          format: email
        name:
          type: string
          description: Omitted when the user record has no name (json `name,omitempty`).
        avatar_url:
          type: string
          description: Omitted when empty (json `avatar_url,omitempty`).
    PublicLinkCoverage:
      type: object
      description: 'How many accepted hosts had a STORED Google calendar token when the page was rendered.
        `total` counts accepted hosts whose user record resolved; `checked` counts those among them for
        whom a Google token row loads, whether or not that token still works. Nothing is renewed or tested
        to compute it. A host whose Google credential is dead, including one whose loss Paceday has recorded
        (PAC-67), still counts as checked, while the slots are computed without that host''s calendar;
        a host with no Google token row at all (for example one on Outlook) is not counted as checked.
        This is deliberate: counting only usable tokens would tell every visitor with the link that a
        host''s connection is dead (spec PAC-67 D-14, AC-28). Before PAC-67 this description said "a usable
        OAuth token", which was not what the server counted (factory section 7.2). Always present, even
        as {0,0}.'
      required:
      - total
      - checked
      additionalProperties: false
      properties:
        total:
          type: integer
        checked:
          type: integer
    PublicLinkInfo:
      type: object
      description: backend/api/handlers_booking.go publicLinkDTO.
      required:
      - slug
      - title
      - durations
      - hosts
      - min_notice_minutes
      - usage_type
      - coverage
      additionalProperties: false
      properties:
        slug:
          type: string
        title:
          type: string
        durations:
          type: array
          description: Allowed meeting lengths in minutes, straight from the link's duration_options column.
          items:
            type: integer
        hosts:
          type: array
          description: Accepted hosts only. Always an array, never null.
          items:
            $ref: '#/components/schemas/PublicHost'
        min_notice_minutes:
          type: integer
        usage_type:
          type: string
          description: Defaults to `reusable` when the stored value is empty.
          enum:
          - reusable
          - recurring
          - single_use
        coverage:
          $ref: '#/components/schemas/PublicLinkCoverage'
    PublicSlotsResponse:
      type: object
      description: Both keys are always present. Exactly one is populated depending on whether the `date`
        query parameter was supplied.
