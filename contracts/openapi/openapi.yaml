    LLMDestinationRefusal:
      type: object
      description: 'PAC-66 and PAC-66-B. Body of the 422 from POST /api/llm/test: the probe would have
        sent the deployment''s cloud credential, the caller''s own key, or a keyless Ollama request to
        a destination not approved for that provider, so no inference request was sent. A superset of
        `SchedulingErrorResponse` (`error` is the same member, so a client that reads only `error`, as
        the web settings page does, renders it unchanged). Never carries a token, a key or any part of
        the deployment credential (spec AC-11).

        '
      properties:
        error:
          type: string
          minLength: 1
          description: A human-readable sentence saying what was refused and why.
        reason:
          type: string
          enum:
          - provider_not_enabled
          - destination_not_approved
          - destination_not_set
          description: '`provider_not_enabled`: the operator approved no host for this provider (spec
            AC-4, AC-18 b). It wins over the other two: when nothing is approved for the provider, this
            is the reason whatever is stored. PAC-66-B: `ollama` with no origin in `PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA`
            (spec AC-B8). Never given for `openai` or `anthropic`, whose public hosts are always approved.
            `destination_not_approved`: the effective host, over `https` on the default port, is not approved
            for this provider. This includes an `http` endpoint, an explicit non-443 port, a host approved
            only for a DIFFERENT provider, and an empty Vertex location or Bedrock region whose built-in
            default region''s host is not approved (spec AC-1, AC-2, AC-7, AC-16, AC-18 a/c, AC-19). PAC-66-B:
            the effective destination of `openai`, `anthropic` or `ollama` is not approved for that provider.
            This includes a base URL carrying a path, a query, a fragment, userinfo or whitespace; an
            `http` scheme or a non-default port on `openai` / `anthropic`; a scheme, host or port differing
            from an approved Ollama origin; a destination approved only for a different provider; and
            Ollama''s built-in default `http://localhost:11434` when it is not approved (spec AC-B1, AC-B2,
            AC-B6, AC-B9, AC-B10, AC-B11, AC-B18, AC-B19). `destination_not_set`: the destination cannot
            be built because the stored value is empty and the provider has no default; today only an
            empty `azureEndpoint` (spec AC-20).

            '
        property:
          type: string
          enum:
          - azureEndpoint
          - gcpLocation
          - awsRegion
          - awsProfile
          - llmBaseUrl
          - ollamaBaseUrl
          description: 'The stored setting the refused destination was built from. Present whenever `reason`
            is not `provider_not_enabled`. `awsProfile` only when the Bedrock host came from that profile''s
            endpoint configuration rather than from the region. PAC-66-B: `llmBaseUrl` on `openai` and
            `anthropic`, and on `ollama` when the effective destination came from it (`ollamaBaseUrl`
            empty); `ollamaBaseUrl` on `ollama` otherwise, including when both are empty and the built-in
            `http://localhost:11434` was refused, since that is the setting the user would save an approved
            origin in.

            '
      required:
      - error
      - reason
      additionalProperties: false
    LLMTestRequest:
      type: object
      description: 'Optional body for POST /api/llm/test. Added by PAC-24 to close API-037.

        **This schema is a closed list of three properties and that is the whole point of it.** Not one
        of them can contribute to the URL the server requests, so no submitted value can direct a stored
        or ambient credential anywhere. The endpoint properties a probe might plausibly want to override
        - `llmBaseUrl`, `ollamaBaseUrl`, `azureEndpoint`, `azureDeployment`, `azureApiVersion`, `awsRegion`,
        `awsProfile`, `bedrockModel`, `gcpProject`, `gcpLocation`, `vertexModel` - are DELIBERATELY ABSENT
        and are a 400 via `additionalProperties: false`. The operation description carries the full argument,
        including why an all-or-nothing body (endpoint plus credential together) does not close the channel
        on the three ambient-credential providers.

        Required. `{}` probes the caller''s stored configuration - the pre-PAC-24 behaviour; an absent
        body is a 400. `{"llmApiKey": "sk-..."}` probes an unsaved key against the caller''s stored endpoint,
        which is the case the settings UI needs because a stored key can no longer be read back to re-submit.

        This is deliberately NOT `SettingsUpdate`. Sharing that schema would re-admit every endpoint property
        by inheritance, which is precisely the defect this shape exists to prevent, and would make a probe
        read like a write. The three property names match the corresponding SettingsUpdate ones so a client
        can build this from the document it already holds.

        `llmApiKey` here is `writeOnly` for the same reason it is on SettingsUpdate: it is accepted and
        is never echoed, including in the 400 and 502 bodies (spec AC-14). Nothing submitted here is persisted.

        '
      properties:
        llmProvider:
          type: string
          enum:
          - ''
          - openai
          - anthropic
          - ollama
          - bedrock
          - azure_openai
          - vertex
          description: 'Which provider branch of `nlp.NewLLMClientFromSettings` to probe. Selects the
            client; it does not select a host. On `openai` and `anthropic` the host is the caller''s stored
            `llmBaseUrl` (or the vendor default when that is empty); on `ollama` it is the stored `ollamaBaseUrl`,
            then `llmBaseUrl`, then `http://localhost:11434`; on the other three it is built entirely
            from the caller''s stored endpoint properties. Spec AC-15. PAC-66: on `azure_openai`, `vertex`
            and `bedrock` the operator''s approved-host check follows THIS value when present, not the
            stored provider, so naming an ambient provider here for one probe is checked exactly as if
            it were saved (spec AC-18; a 422 when refused). PAC-66-B: the same holds on `openai`, `anthropic`
            and `ollama`, so naming `openai` for one probe while the stored `llmBaseUrl` is approved only
            for Ollama is a 422 and sends no key (spec AC-B11). Nothing submitted here is stored.

            '
        llmModel:
          type: string
          description: 'Consulted only by the `openai` and `anthropic` branches (`backend/nlp/llm_factory.go:25,34`),
            where it is a field of the JSON request body. It never appears in a URL. `bedrockModel`, `azureDeployment`
            and `vertexModel` - which DO appear in URLs - are not accepted here.

            '
        llmApiKey:
          type: string
          writeOnly: true
          description: 'An unsaved key to probe. Used only as the `Authorization` header value (`openai`)
            or the `x-api-key` header value (`anthropic`) (`backend/nlp/parser.go:45,80`), sent only to
            a destination approved for that provider (PAC-66-B). Ignored by the four branches that take
            no key. Never persisted and never echoed (spec AC-14).

            '
      additionalProperties: false
    LLMTestResult:
      type: object
      description: 'Literal map: `{"ok": true, "response": ..., "provider": ...}`.'
      properties:
        ok:
          type: boolean
          description: Always literal `true` on the 200 path.
        response:
          type: string
          description: The provider's completion text for the fixed "Say hello" prompt.
        provider:
          type: string
          enum:
          - ''
          - openai
          - anthropic
          - ollama
          - bedrock
          - azure_openai
          - vertex
          description: 'Echo of the `llmProvider` that was actually probed - the submitted one when a
            body was sent, the caller''s stored one otherwise; empty string when unset. It is what tells
            a client which configuration the result is about. It never carries the key.

            '
      required:
      - ok
      - response
      - provider
      additionalProperties: false
    LunchBreakSchedule:
      type: object
      description: 'storage.LunchBreakSchedule - a bare map keyed by lowercase weekday name. Normalised
        to `{}` (never null) on read (`backend/storage/settings.go:103-105`). A per-day entry overrides
        the legacy global `lunchStart`/`lunchEnd`/`protectLunch` trio, including disabling lunch for that
        day. Replaced whole by a PATCH that mentions it; `lunchBreaks: {}` clears every per-day override
        (spec AC-9).

        Keys are enforced EXACTLY by the handler (revision 3; generators drop `propertyNames`), and migration
        024 removes stored keys that are not one of the seven lowercase names, or whose `start`/`end`
        are neither empty nor a clock. Before PAC-24 the validator lower-cased the key, so a `"Monday"`
        key was stored and never matched `LunchWindow`''s lookup.

        '
      propertyNames:
        enum:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
      additionalProperties:
        $ref: '#/components/schemas/DaySchedule'
    ManagerAnalytics:
      type: object
