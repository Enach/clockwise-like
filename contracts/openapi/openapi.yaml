  /api/schedule/compress:
    post:
      operationId: previewCompression
      tags:
      - schedule
      summary: Preview meeting-compression proposals
      description: 'Body decode errors are swallowed (`_ = json.NewDecoder(...).Decode(&body)`), so malformed
        JSON behaves like an empty body and yields 200 for today. If `week` is set it wins over `date`:
        the handler snaps the parsed date to Monday (startOfWeek) and iterates Mon..Fri, appending one
        CompressionResult per day and SILENTLY SKIPPING days whose engine call errors - so week mode never
        returns 500, and can return `null` if all five days error. If `week` is empty, `date` (or today)
        produces a single-element array and an engine error becomes a 500.

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressionRequest'
      responses:
        '200':
          description: 'Array of per-day results. `null` when the slice stayed empty (week mode with every
            day failing).

            '
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/CompressionResult'
        '400':
          description: '`invalid week format` or `invalid date format` - JSON error shape (writeError).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '500':
          description: 'Single-day mode only. Raw Go error as text/plain (http.Error).

            '
          content:
            text/plain:
              schema:
                type: string
  /api/schedule/compress/apply:
    post:
      operationId: applyCompression
      tags:
      - schedule
      summary: Apply selected move proposals
      description: 'The request proposal objects are snake_case (`event_id`, `proposed_start`, `proposed_end`)
        even though the CompressionResult proposals returned by /api/schedule/compress are camelCase.
        Only these three fields are read; any other field on the posted object is ignored. A proposal
        whose start or end fails RFC3339 parsing is NOT an error: it is dropped and `"<event_id>: invalid
        time format"` is appended to `failed` (confirmed by TestApplyCompress_InvalidTime, which expects
        200).

