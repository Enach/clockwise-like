        \ your own domain`). Check 6 runs after the\ndomain match, so the stored configuration it reads\
        \ is always the\ncaller's own organisation's, and before any PAC-50 write\nauthorization.\n\n\
        Since PAC-22 (API-060, resolves U-21) the request is validated before\nanything is stored, and\
        \ every refusal is a 400 that leaves the stored\nconfiguration exactly as it was (or absent).\
        \ The checks run in this\norder, after membership; the first that fails decides the message:\n\
        \n1. The body is JSON (`invalid JSON`).\n2. None of `saml_entry_point`, `saml_issuer`, `saml_cert`\
        \ is present,\n   whatever its value (including `\"\"` and `null`). The first present,\n   in\
