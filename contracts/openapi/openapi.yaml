                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: accepted
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: 'The caller has no host row on this link: never invited, already left or removed,
            or no link has that id (the two are not distinguished, so the answer does not reveal whether
            a link exists). Nothing is written. Body: `{"error":"not found"}` (PAC-30, API-020).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Update failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).'
