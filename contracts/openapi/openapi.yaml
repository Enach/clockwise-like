                $ref: '#/components/schemas/BookingError'
  /api/scheduling-links/{id}/leave:
    post:
      operationId: leaveSchedulingLink
      tags:
      - scheduling-links
      summary: Remove the caller from a link's host list.
      description: Deletes the caller's `scheduling_link_hosts` row. Deleting zero rows is not an error,
        so a non-host caller also gets 204. The owner is rejected with 400.
      parameters:
      - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '204':
          description: Caller removed (or was never a host). Empty body.
        '400':
          description: '"invalid id" or "owner cannot leave link"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: 'Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: '"internal error" or "leave failed: <err>"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/settings:
    get:
      operationId: getSettings
      tags:
      - settings
      summary: Read the caller's settings document
      description: 'Registered as `r.Route("/api/settings", ...)` + `r.Get("/", ...)`, so chi serves both
        `/api/settings` and `/api/settings/`.

        Returns the settings of the AUTHENTICATED CALLER. When the caller has no settings row yet, one
        is created from the SQL defaults and returned, so this operation never 404s and a second read
        returns the same row rather than creating another (spec AC-2).

        `llmApiKey` is never returned, by this or any other operation (`writeOnly: true`). `llmApiKeySet`
        reports whether a key is on file (spec AC-11, AC-12).

        Before PAC-24 this read `WHERE id = 1` - a row shared by every authenticated caller, which after
        migration 018''s backfill is the earliest-created user''s own row - and returned `llmApiKey` in
        cleartext (API-002, API-003).

        '
      responses:
        '200':
          description: The settings document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '500':
          description: DB failure, raw Go error as text/plain (http.Error).
          content:
            text/plain:
              schema:
                type: string
    patch:
      operationId: patchSettings
      tags:
      - settings
      summary: Change some of the caller's settings
      description: "MERGE, at the top level, against the CALLER'S OWN settings. This is the ONLY write\
        \ operation for settings: PAC-24 removes `PUT /api/settings` rather than retaining it as a deprecated\
        \ alias, for the reasons in the comment on this path and in `contracts/features/PAC-24.md` §3.\n\
        The rule is total and needs no knowledge of what is stored:\n* **Property absent** -> unchanged.\
        \ * **Property present** -> set to exactly that value. `\"\"`, `0` and\n  `false` are values,\
        \ not absences: they clear, zero and disable. This is\n  how a setting is cleared, including `llmApiKey`\
        \ (spec AC-7, AC-13).\n* **Property present and `null`** -> 400. No property of this body is\n\
        \  nullable, so a null fails schema validation and nothing is stored\n  (spec AC-8).\n* **`workingHours`\
        \ and `lunchBreaks`** are replaced WHOLE when present -\n  there is no deep merge and no per-day\
        \ merge, so a weekday omitted from\n  a supplied map is REMOVED. `lunchBreaks: {}` clears every\
        \ per-day lunch\n  override (spec AC-9).\n* **`llmApiKeySet` and `updatedAt`** are `readOnly`.\
        \ They may be present -\n  a client that submits back a document it just read will include them\
        \ -\n  and are ignored (spec AC-10).\n\nThe response is a fresh read of the caller's row, so it\
        \ reflects normalisation (e.g. `workingHours` defaulting) rather than the submitted body, and\
        \ it does not contain `llmApiKey`.\nBefore PAC-24 there was no PATCH; the only write was a full-replace\
        \ PUT that persisted every omitted field as its Go zero value (API-004).\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: The re-read settings document for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/SettingsValidationError'
        '500':
          description: Save or re-read failure, text/plain (http.Error).
          content:
            text/plain:
              schema:
                type: string
  /api/settings/daily-recap:
    get:
      operationId: getDailyRecapSettings
      tags:
      - daily-recap
      summary: Read the caller's daily-recap settings
      description: 'A snake_case projection of seven `recap*` fields of the CALLER''S OWN settings row
        - the same row GET /api/settings exposes in camelCase. The two representations are hand-maintained
        and can drift (`recapIncludeFocus` <-> `include_focus_blocks`).

        Before PAC-24 this read the singleton row, so every user saw and edited one shared recap configuration
        (API-002).

        '
      responses:
        '200':
          description: Daily-recap settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapSettings'
        '500':
          description: '`db error` as text/plain (http.Error).'
          content:
            text/plain:
              schema:
                type: string
    patch:
      operationId: patchDailyRecapSettings
      tags:
      - daily-recap
      summary: Partially update the caller's daily-recap settings
      description: 'A partial update of the CALLER''S OWN recap settings. A property absent from the body
        is left unchanged; a property present is applied. No property is nullable, so an explicit `null`
        is a 400 - this matches PATCH /api/settings (spec AC-8) and is a change: the handler''s pointer
        fields previously treated `null` as "leave unchanged", which made a typo indistinguishable from
        an omission.

        Returns 204 with an EMPTY body on success - it does not echo the new state.

        Before PAC-24 this patched the singleton row, and the underlying write was a full-row write that
        also rewrote every NON-recap column of that row from the values it had just read (API-002). It
        now writes only the recap columns of the caller''s row.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyRecapPatch'
      responses:
        '204':
          description: Updated. No body.
        '400':
          description: '`invalid JSON`; `send_to must be ''dm'' or ''channel''`; or - added by PAC-24,
            previously a 500 from the Postgres TIME cast - `send_time must be in HH:MM format`. Written
            with http.Error, so these are text/plain, NOT the JSON error shape.

            '
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: '`db error` as text/plain (http.Error).'
          content:
            text/plain:
              schema:
                type: string
  /api/settings/daily-recap/preview:
    post:
      operationId: previewDailyRecap
      tags:
      - daily-recap
      summary: Render today's recap without sending it
      description: 'Builds the Slack Block Kit payload for the authenticated user at `time.Now()` and
        returns it. No request body is read. Nothing is sent to Slack and no Slack connection is required.

        Before PAC-24 the day''s content was the caller''s but the recap configuration driving it (timezone,
        which sections to include) came from the singleton row, so a preview could omit sections the caller
        had enabled (API-002). Both now come from the caller''s row.

        '
      responses:
        '200':
          description: Rendered Slack blocks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapPreview'
        '500':
          description: '`db error` as text/plain (http.Error).'
          content:
            text/plain:
              schema:
                type: string
  /api/settings/daily-recap/test:
    post:
      operationId: sendDailyRecapTest
      tags:
      - daily-recap
      summary: Send a test recap to Slack
      description: 'Requires a stored `slack` workspace connection for the authenticated user. Destination
        comes from the CALLER''S OWN stored settings (`recapSendTo`, `recapChannelId`), not from the request
        - no request body is read. The Slack call is bounded by a 10s context timeout.

        Before PAC-24 the destination came from the singleton row, so a test send could be addressed to
        a channel another user had configured (API-002).

        '
      responses:
        '200':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapTestResult'
        '400':
          description: '`Slack not connected` (also returned when the workspace-connection lookup errors
            for any other reason). text/plain (http.Error).

            '
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: '`db error` as text/plain (http.Error).'
          content:
            text/plain:
              schema:
                type: string
        '502':
          description: '`send error: <err>` as text/plain (http.Error).'
          content:
            text/plain:
              schema:
                type: string
  /api/teams:
    post:
      operationId: createTeam
      tags:
      - teams
      summary: Create a formal team; the caller becomes its owner.
      description: 'Registered via chi `r.Route("/api/teams")` + `r.Post("/")`, so both `/api/teams` and
        `/api/teams/` route here. The owner team_members row is inserted with its error discarded, so
        a failed AddTeamMember still returns 201 with an ownerless team.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamNameRequest'
      responses:
        '201':
          description: Created team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: 'JSON error "name is required" — covers both a malformed body and a blank/ whitespace-only
            name (one branch, one message).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/JsonUnauthorized'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
    get:
      operationId: listTeams
      tags:
      - teams
      summary: All teams the caller belongs to, newest first.
      description: 'Bare JSON array (no envelope), ordered by teams.created_at DESC. Always an array,
        never null.

        '
      responses:
        '200':
          description: Teams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/JsonUnauthorized'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/teams/invites/{token}:
    get:
      operationId: getTeamInvite
      tags:
      - teams
      summary: Preview a pending team invite by token.
      description: 'Despite the "(public)" comment on the handler, this route is registered inside the
        requireAuth group and therefore requires a valid JWT. Calls ExpireOldInvites first, so an invite
        past expires_at is reported as 410 "invite is expired" rather than 200. The response deliberately
        omits team_id, token and expires_at.

        '
      parameters:
      - $ref: '#/components/parameters/InviteTokenPath'
      responses:
        '200':
          description: Invite preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitePreview'
        '404':
          description: JSON error "invite not found".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 'JSON error "invite is <status>" where status is accepted, declined or expired.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/teams/invites/{token}/accept:
    post:
      operationId: acceptTeamInvite
      tags:
      - teams
      summary: Accept a pending invite as the logged-in user.
      description: 'The authenticated user''s email must case-insensitively equal invitee_email. Membership
        is added with role "member" via an ON CONFLICT DO NOTHING insert, so accepting twice cannot demote
        an existing owner. Returns no body.

        '
      parameters:
      - $ref: '#/components/parameters/InviteTokenPath'
      responses:
        '204':
          description: Invite accepted; membership created. Empty body.
        '401':
          $ref: '#/components/responses/JsonUnauthorized'
        '403':
          description: JSON error "this invite is for a different email address".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: JSON error "invite not found".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: JSON error "invite is <status>".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/teams/{id}:
    parameters:
    - $ref: '#/components/parameters/TeamIdPath'
    get:
      operationId: getTeam
      tags:
      - teams
      summary: One team plus its members.
      description: 'Membership required. `members` is the raw result of ListTeamMembers with its error
        discarded, ordered by joined_at ASC, and is JSON `null` (not []) whenever the list is empty or
        the query failed.

        '
      responses:
        '200':
          description: Team detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetail'
        '400':
          description: JSON error "invalid team id".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '404':
          description: 'JSON error "not found".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-uncertain: 'Practically unreachable: the membership check runs first and a team_members row
            cannot exist without its team (FK + ON DELETE CASCADE), so a missing team yields 403 before
            this branch. Kept because the code path exists.

            '
        '500':
          $ref: '#/components/responses/PlainTextServerError'
    patch:
      operationId: renameTeam
      tags:
      - teams
      summary: Rename a team. Owner only.
      responses:
        '200':
          description: 'The re-read team. GetTeam''s error is discarded, so the body can be the JSON literal
            `null` on a read failure even though the rename committed.

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Team'
                - type: 'null'
        '400':
          description: JSON error "invalid team id" or "name is required".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamNameRequest'
    delete:
      operationId: deleteTeam
      tags:
      - teams
      summary: Delete a team. Owner only.
      description: 'Cascades to team_members, team_invites, no_meeting_zones and manager_team_member_assignments
        via FK ON DELETE CASCADE.

        '
      responses:
        '204':
          description: Deleted. Empty body.
        '400':
          description: JSON error "invalid team id".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/teams/{id}/analytics:
    get:
      operationId: getFormalTeamAnalytics
      tags:
      - teams
      summary: Aggregate meeting/focus minutes across a formal team for one week.
      description: 'Membership required. Unlike GET /api/manager/analytics this reads the analytics_weeks
        table directly per team member, with no consent check and no FreeBusy fallback. Averages divide
        by the member count (or by 1 when the team is empty) using integer division.

        '
      parameters:
      - $ref: '#/components/parameters/TeamIdPath'
      - name: date
        in: query
        required: false
        description: 'Any date in the target week, YYYY-MM-DD. Snapped to that week''s Monday in the parsed
          value''s location (UTC). Defaults to the current local week''s Monday.

          '
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Team analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAnalytics'
        '400':
          description: JSON error "invalid team id" or "date must be YYYY-MM-DD".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/teams/{id}/availability:
    get:
      operationId: getTeamAvailability
      tags:
      - teams
      summary: Slots on one day where every team member is free.
      description: 'Membership required. The engine searches a fixed 09:00-18:00 UTC window on `date`,
        steps the cursor in 15-minute increments, treats no-meeting zones and busy calendar events as
        hard blocks, and scores each slot 0-100 by how few members'' focus blocks it disrupts. A member
        whose calendar token is missing or whose calendar call fails contributes no busy intervals and
        is silently treated as fully free. `slots` is always an array, never null.

        '
      parameters:
      - $ref: '#/components/parameters/TeamIdPath'
      - name: date
        in: query
        required: true
        description: Day to search, YYYY-MM-DD, interpreted in UTC. Missing or malformed yields 400.
        schema:
          type: string
          format: date
      - name: duration
        in: query
        required: false
        description: Slot length in minutes. Defaults to 60. Must be 1..1440.
        schema:
          type: integer
          minimum: 1
          maximum: 1440
          default: 60
      responses:
        '200':
          description: Candidate slots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSlotList'
        '400':
          description: 'JSON error "invalid team id", "date must be YYYY-MM-DD", or "duration must be
            a positive integer (minutes)".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/teams/{id}/members/invite:
    post:
      operationId: inviteTeamMember
      tags:
      - teams
      summary: Create a 7-day team invite and email it. Owner only.
      parameters:
      - $ref: '#/components/parameters/TeamIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteEmailRequest'
      responses:
        '201':
          description: 'The created invite INCLUDING its raw `token`, so the owner can share the link
            out of band. expires_at is now + 7 days. Email delivery is fire-and-forget and silently skipped
            when SMTP_HOST/SMTP_FROM are unset.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvite'
        '400':
          description: JSON error "invalid team id" or "email is required".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: JSON error "email must be a valid email address".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags:
      - teams
      summary: Remove a member by user id. Owner, or the member themselves.
      description: 'Self-removal skips the ownership check entirely, so a team owner can remove themselves
        and leave the team ownerless. There is no last-owner guard here — the owner-protection rule lives
        only on DELETE /api/manager/team/members/{email}.

        '
      parameters:
      - $ref: '#/components/parameters/TeamIdPath'
      - name: userId
        in: path
        required: true
        description: The Paceday user id (UUID) of the member to remove.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Removed (idempotent — removing a non-member also returns 204). Empty body.
        '400':
          description: JSON error "invalid team id" or "invalid user id".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/teams/{id}/no-meeting-zones:
    parameters:
    - $ref: '#/components/parameters/TeamIdPath'
    post:
      operationId: createNoMeetingZone
      tags:
      - teams
      summary: Create a recurring weekly no-meeting zone. Owner only.
      description: 'The WIRE weekday convention is Monday=1 .. Sunday=7. Storage uses Go''s Sunday=0 ..
        Saturday=6; the handler converts 7 -> 0 on write and 0 -> 7 on read (TestNoMeetingZone_ValidatesAndConvertsWeekdayAtBoundary
        asserts both halves).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoMeetingZoneRequest'
      responses:
        '201':
          description: Created zone, dayOfWeek already converted back to the 1..7 wire convention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoMeetingZone'
        '400':
          description: JSON error "invalid team id" or "invalid JSON".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: 'JSON error. "dayOfWeek must be between 1 and 7" (note: 0 is rejected, so an omitted
            dayOfWeek always fails); "startTime and endTime are required"; "startTime must be HH:MM";
            "endTime must be HH:MM"; "startTime must be before endTime" (equal times are rejected).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
    get:
      operationId: listNoMeetingZones
      tags:
      - teams
      summary: All no-meeting zones for a team. Membership required.
      description: 'Bare JSON array, always present (never null), ordered by the STORED day_of_week then
        start_time — which means Sunday sorts FIRST because it is stored as 0, even though it is emitted
        as dayOfWeek 7.

        '
      responses:
        '200':
          description: Zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoMeetingZone'
        '400':
          description: JSON error "invalid team id".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
  /api/teams/{id}/no-meeting-zones/{zoneId}:
    parameters:
    - $ref: '#/components/parameters/TeamIdPath'
    - name: zoneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateNoMeetingZone
      tags:
      - teams
      summary: Replace a no-meeting zone. Owner only.
      description: 'PATCH by name, PUT by behaviour: every field is taken from the body with no merge
        against the stored row, so an omitted dayOfWeek becomes 0 and fails validation with 422. The update
        is scoped by BOTH zone id and team id, so a zone belonging to another team returns 404. Ownership
        is checked before the zoneId is even parsed.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoMeetingZoneRequest'
      responses:
        '200':
          description: Updated zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoMeetingZone'
        '400':
          description: JSON error "invalid team id", "invalid zone id" or "invalid JSON".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '404':
          description: JSON error "zone not found".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: JSON error — same validation messages as createNoMeetingZone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
    delete:
      operationId: deleteNoMeetingZone
      tags:
      - teams
      summary: Delete a no-meeting zone. Owner only.
      responses:
        '204':
          description: Deleted (idempotent — deleting an unknown zone also returns 204). Empty body.
        '400':
          description: JSON error "invalid team id" or "invalid zone id".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/PlainTextServerError'
components:
  schemas:
    AddEventConferenceRequest:
      type: object
      description: POST /api/events/{id}/conference.
      required:
      - provider
      additionalProperties: false
      properties:
        provider:
          type: string
          description: Lowercased and trimmed. `custom` and `google_meet` are handled inline; `zoom` and
            `teams` go through the provider factory; anything else is a 400 from the factory.
          enum:
          - google_meet
          - zoom
          - teams
          - custom
        url:
          type: string
          format: uri
          description: Required (non-empty after trimming) when provider is `custom`, ignored for every
            other provider. Never validated as a URL by the backend.
    AddManagerMemberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 'Lowercased and trimmed, then validated with net/mail.ParseAddress; the parsed
            address must equal the normalized input, so display-name forms like "A <a@b.com>" are rejected.

            '
        display_name:
          type: string
          description: Trimmed. When blank, defaults to the local part of the email.
        cadence:
          allOf:
          - $ref: '#/components/schemas/Cadence'
          description: Lowercased and trimmed. Defaults to "none" when omitted or empty.
        cadence_custom_days:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 365
          description: Required iff cadence == "custom"; must be absent/null otherwise.
      required:
      - email
      additionalProperties: true
    AnalyticsBreakdownEntry:
      type: object
      description: 'api.breakdownEntry. Exactly 5 entries in a fixed order, with fixed colors:

        meeting #FF6B6B, focus #5B7FFF, habit #9B7AE0, personal #E9B949, free #B0BEC5.

        '
      required:
      - category
      - minutes
      - percentage
      - color
      additionalProperties: false
      properties:
        category:
          type: string
          enum:
          - meeting
          - focus
          - habit
          - personal
          - free
        minutes:
          type: integer
        percentage:
          type: number
          format: double
          description: '`minutes / total_working_minutes * 100`, or 0 when total is 0. Not rounded. Note
            buffer_minutes is excluded from the breakdown, so the five percentages need not sum to 100.'
        color:
          type: string
    AnalyticsMeeting:
      type: object
      description: 'One entry of GET /api/analytics/meetings. Built as an ad-hoc `map[string]any` in

        `AnalyticsEngine.WeekMeetings`; these four keys are always present.

        '
      required:
      - title
      - duration_minutes
      - attendee_count
      - start_time
      additionalProperties: false
      properties:
        title:
          type: string
          description: The calendar event summary. Empty string for an untitled event.
        duration_minutes:
          type: integer
        attendee_count:
          type: integer
          minimum: 1
        start_time:
          type: string
          format: date-time
          description: RFC3339, in the offset the calendar returned.
    AnalyticsRecomputeAck:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          type: string
          const: recompute accepted
    AnalyticsWeekRow:
      type: object
      description: 'Raw `storage.AnalyticsWeek` as returned by GET /api/analytics/trends. Same field

        set as AnalyticsWeekWithBreakdown minus `breakdown`, and with `week_start`

        serialised as a full RFC3339 timestamp because the Go field is a `time.Time`.

        '
      required:
      - id
      - user_id
      - week_start
      - total_working_minutes
      - meeting_minutes
      - focus_minutes
      - habit_minutes
      - buffer_minutes
      - personal_minutes
      - free_minutes
      - meeting_count
      - focus_block_count
      - habit_completion_rate
      - largest_focus_block_minutes
      - top_meeting_titles
      - focus_score
      - estimated_meeting_cost_minutes
      - computed_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        week_start:
          type: string
          format: date-time
          description: Midnight UTC of the Monday, e.g. "2026-03-02T00:00:00Z" — NOT the "2026-03-02"
            shape used by /api/analytics/week.
        total_working_minutes:
          type: integer
        meeting_minutes:
          type: integer
        focus_minutes:
          type: integer
        habit_minutes:
          type: integer
        buffer_minutes:
          type: integer
        personal_minutes:
          type: integer
        free_minutes:
          type: integer
        meeting_count:
          type: integer
        focus_block_count:
          type: integer
        habit_completion_rate:
          type: number
          format: double
          description: 0..1 fraction.
        largest_focus_block_minutes:
          type: integer
        top_meeting_titles:
          type: array
          description: 'May serialise as `null` rather than `[]`: it is populated by a failure-swallowing
            `json.Unmarshal` of the JSONB column into a nil slice.'
          nullable: true
          maxItems: 5
          items:
            $ref: '#/components/schemas/MeetingTitle'
        focus_score:
          type: integer
        estimated_meeting_cost_minutes:
          type: integer
        computed_at:
          type: string
          format: date-time
    AnalyticsWeekWithBreakdown:
      type: object
      description: 'Response of GET /api/analytics/week. Built by `weekWithBreakdown` as a

        `map[string]any`, so it deliberately differs from AnalyticsWeekRow: `week_start`

        is a plain date string and `breakdown` is added.

        '
      required:
      - id
      - user_id
      - week_start
      - total_working_minutes
      - meeting_minutes
      - focus_minutes
      - habit_minutes
      - buffer_minutes
      - personal_minutes
      - free_minutes
      - meeting_count
      - focus_block_count
      - habit_completion_rate
      - largest_focus_block_minutes
      - top_meeting_titles
      - focus_score
      - estimated_meeting_cost_minutes
      - computed_at
      - breakdown
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        week_start:
          type: string
          format: date
          description: The Monday of the week, formatted "2006-01-02". DIFFERENT from the trends endpoint,
            which emits a full timestamp.
        total_working_minutes:
          type: integer
          description: Sum of the configured work windows Mon–Fri. Falls back to 2400 (480×5) when it
            computes to ≤0 and the working-hours mode is not "by_day".
        meeting_minutes:
          type: integer
        focus_minutes:
          type: integer
        habit_minutes:
          type: integer
        buffer_minutes:
          type: integer
          description: Never populated by `compute` — the engine leaves it at 0 in every write path.
          x-uncertain: The column exists and round-trips through storage, but AnalyticsEngine.compute
            never sets BufferMinutes, so this is always 0 for engine-computed weeks.
        personal_minutes:
          type: integer
          description: Calendar events with zero attendees.
        free_minutes:
          type: integer
          description: total_working − meeting − focus − habit − personal, floored at 0.
        meeting_count:
          type: integer
        focus_block_count:
          type: integer
        habit_completion_rate:
          type: number
          format: double
          description: completed / (scheduled + completed) occurrences in the week, as a 0..1 FRACTION
            (not a percentage). 0 when there are none.
        largest_focus_block_minutes:
          type: integer
        top_meeting_titles:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/MeetingTitle'
        focus_score:
          type: integer
          description: '`focus*100/(focus+meeting)` clamped to ≤100; 50 when both are 0.'
          minimum: 0
          maximum: 100
        estimated_meeting_cost_minutes:
          type: integer
          description: Sum over meetings of duration × attendee count (person-minutes).
        computed_at:
          type: string
          format: date-time
        breakdown:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/AnalyticsBreakdownEntry'
    AttendeeSuggestion:
      type: object
      description: calendar.AttendeeSuggestion. Both keys are always emitted (no omitempty); `name` is
        "" when Google supplied no display name.
      required:
      - email
      - name
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Original casing from the Google event, not the lowercased dedupe key.
        name:
          type: string
    AuditEntry:
      type: object
      description: storage.AuditEntry. One recorded action, always about the calling user's own calendar
        — the subject is the scoping predicate and is deliberately NOT echoed back as a field, because
        it is the same value on every entry of every response (see contracts/features/PAC-23.md §3 for
        the rejected alternative).
      required:
      - id
      - action
      - details
      - created_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          description: '`audit_log.id`, declared `SERIAL` at backend/storage/migrations/001_initial.up.sql:45
            — a 32-bit signed sequence. `storage.AuditEntry.ID` is a Go `int64` (backend/storage/audit_log.go:9),
            but that widening is a Go type choice, not a range the table can reach, so `int64` here would
            over-declare the server. `int32` is declared instead because the sole consumer coerces with
            `Number(e.id)` (smart-calendar-flow/src/api/client.ts:432) and uses the result as a React
            list key (src/pages/Audit.tsx:95): every `int32` is exactly representable as a JS number,
            so the coercion is lossless and keys stay distinct. Values above 2^53 would collide into one
            key and drop rows — the table cannot produce them, and this declaration is what keeps that
            true for a generated client.'
        action:
          type: string
          description: 'What was recorded. Underscore-separated, lower-case; there is no dotted key convention
            on this endpoint and never was.


            This is the complete set the server can emit, enumerated from every `storage.WriteAuditLog`
            call site in `backend/` (the action argument is a string literal at all seven, and `storage.WriteAuditLog`,
            backend/storage/focus_blocks.go:61-63, holds the only INSERT against the table): `focus_created`
            (backend/engine/focus_time.go:106), `focus_cleared` (backend/engine/focus_time_cleaner.go:39),
            `meeting_scheduled` (backend/engine/smart_schedule.go:323), `meeting_moved` (backend/engine/compression.go:178),
            `meeting_created` (backend/api/handlers_schedule.go:188), `nlp_parsed` (backend/nlp/parser.go:221),
            `nlp_confirmed` (backend/api/handlers_nlp.go:67).


            The enum is closed on purpose. `audit_log.action` is an unconstrained `TEXT` column, so the
            set is held by this contract rather than by the database: adding an eighth action is a contract
            change, and a writer added without one makes the contract test fail, which is the intended
            alarm. Spec AC-14 requires that this set never shrinks.


            It names WHAT happened, not WHO did it. Every entry''s subject is the calling user (see the
            operation description); no entry carries an actor, and no value in this enum distinguishes
            an action a person took from one the scheduler took on their behalf.'
          enum:
          - focus_created
          - focus_cleared
          - meeting_scheduled
          - meeting_moved
          - meeting_created
          - nlp_parsed
          - nlp_confirmed
        details:
          type: string
          description: 'Scanned from the DB into a Go `string`, so on the wire this is ALWAYS a JSON string
            — even when the text inside it happens to be JSON. A generator should emit `string`, and that
            is correct and complete for the transport.


            Whether the text inside parses as JSON depends on which `action` produced it, so the useful
            statement is per-writer rather than a blanket warning. ALWAYS VALID JSON: `focus_created`
            and `focus_cleared` marshal a struct with `encoding/json` (backend/engine/focus_time.go:101-106,
            backend/engine/focus_time_cleaner.go:33-39); `nlp_parsed` uses `fmt.Sprintf` with `%q`, which
            escapes (backend/nlp/parser.go:221). NOT GUARANTEED: `meeting_scheduled`, `meeting_created`,
            `meeting_moved` and `nlp_confirmed` are built by concatenating values into a JSON literal
            with no escaping (backend/engine/smart_schedule.go:323, backend/api/handlers_schedule.go:188,
            backend/engine/compression.go:178, backend/api/handlers_nlp.go:67).


            The interpolated value differs by site and so does the severity. At smart_schedule.go:323
            and handlers_schedule.go:188 it is a meeting title from the request body, so a title containing
            `"`, `\` or a newline yields malformed JSON. At compression.go:178 there is no title: the
            values are a client-supplied `event_id`, copied unvalidated from the request body (backend/api/handlers_schedule.go:80-93),
            and an RFC3339 timestamp — so a caller can write JSON STRUCTURE, not merely a stray quote,
            into its own row. At handlers_nlp.go:67 the value is a Google-issued event id, which in practice
            contains no JSON metacharacter; the construction is the same defect, the input simply is not
            attacker-controlled.


            Consequence for a consumer: parse the four safe actions if you want to; for the other four,
            treat the value as opaque text, as the shipped client does (`formatAuditDetails`, smart-calendar-flow/src/api/client.ts:410-419,
            never calls JSON.parse). PAC-23 does not fix the concatenation — it is docs/specs/PAC-23.md
            OQ-6, and the spec challenge argues for splitting the escaping defect out of it. When that
            lands, the NOT GUARANTEED list empties and this description loses two paragraphs.'
        created_at:
          type: string
          format: date-time
    AuthStatusResponse:
      type: object
      description: 'Assembled from map[string]interface{} literals in authHandlers.status —

        all three keys are always emitted (no omitempty).

        '
      required:
      - connected
      - provider
      - email
      properties:
        connected:
          type: boolean
        provider:
          type: string
          enum:
          - google
          - outlook
          - webcal
          description: 'Settings.calendar_provider, defaulting to "google" when blank. The

            error/fallback paths also report "google", so "google" does not prove

            Google was configured.

            '
        email:
          type: string
          description: 'For outlook/webcal this is the caller''s own settings.calendar_email

            verbatim. For google it is fetched live from the Google userinfo

            endpoint and is the empty string when that call fails.

            Before PAC-24 the outlook/webcal value came from the shared settings

            row and was therefore some other user''s address (API-009).

            '
      additionalProperties: false
    BookingError:
      type: object
      description: 'Shared error envelope written by api.writeError (handlers_settings.go:206): Content-Type
        application/json, body `{"error": "<message>"}`. The two exceptions in this domain are the requireAuth
        401 and the Zoom OAuth callback, both of which use http.Error and therefore send text/plain.'
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: string
          description: Human-readable message. Several 500s concatenate the underlying Go error text.
    Cadence:
      type: string
      description: 1:1 cadence. "none" disables gap detection for that member.
      enum:
      - weekly
      - biweekly
      - monthly
      - custom
      - none
    CadenceGap:
      type: object
      description: engine.CadenceGap.
      properties:
        member_email:
          type: string
          format: email
        display_name:
          type: string
        cadence:
          $ref: '#/components/schemas/Cadence'
        last_one_on_one_at:
          type:
          - string
          - 'null'
          format: date-time
        next_expected_by:
          type: string
          format: date-time
          description: 'last_one_on_one_at (or now, when never met) plus the cadence interval. Monthly
            uses calendar-month arithmetic; the rest use day addition.

            '
        days_overdue:
          type: integer
          minimum: 0
          description: '0 when the next 1:1 is still upcoming within the 7-day warning window; positive
            when already past due. Never negative — upcoming-ness is not encoded here.

            '
      required:
      - member_email
      - display_name
      - cadence
      - last_one_on_one_at
      - next_expected_by
      - days_overdue
      additionalProperties: false
    CadenceGapList:
      type: object
      properties:
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/CadenceGap'
      required:
      - gaps
      additionalProperties: false
    CalendarEvent:
      type: object
      description: api.calendarEventDTO — the flattened event shape returned by GET /api/calendar/events.
      required:
      - id
      - title
      - start
      - end
      properties:
        id:
          type: string
          description: Google Calendar event id. Always present as a key; may be "".
        title:
          type: string
          description: Google `summary`. Always present as a key; may be "".
        start:
          type: string
          description: Either an RFC3339 date-time (timed event, Google `start.dateTime`, preserving the
            event's original UTC offset) OR a bare `YYYY-MM-DD` date (all-day event, Google `start.date`).
            Callers must handle both. Empty string when Google returned no start at all.
          examples:
          - '2026-05-01T10:00:00+02:00'
          - '2026-05-01'
        end:
          type: string
          description: Same dual format as `start`. For all-day events this is the exclusive end date.
          examples:
          - '2026-05-01T10:30:00+02:00'
          - '2026-05-02'
        color:
          type: string
          description: Hex colour mapped from Google's numeric `colorId` via a fixed 11-entry table. Omitted
            when the event has no colorId or an unrecognised one.
          enum:
          - '#7986CB'
          - '#33B679'
          - '#8E24AA'
          - '#E67C73'
          - '#F6BF26'
          - '#F4511E'
          - '#039BE5'
          - '#3F51B5'
          - '#0B8043'
          - '#D50000'
          - '#616161'
        attendees:
          type: array
          description: Attendee emails with room resources (`*@resource.calendar.google.com`) removed.
            Omitted entirely when the event has no non-resource attendees.
          items:
            type: string
            format: email
        attendee_details:
          type: array
          description: Parallel to `attendees`, same ordering and same filtering. Omitted when empty.
          items:
            $ref: '#/components/schemas/CalendarEventAttendee'
        is_personal_block:
          type: boolean
          description: Declared on the DTO with `omitempty` but NEVER SET by toCalendarEventDTO, so it
            is always omitted from responses from this endpoint.
          x-uncertain: Dead field on this path. Either the personal-block tagging logic is missing, or
            the field should be dropped from the DTO.
        description:
          type: string
          description: Omitted when empty.
        location:
          type: string
          description: Omitted when empty.
        conference:
          $ref: '#/components/schemas/CalendarEventConference'
    CalendarEventAttendee:
      type: object
      description: api.attendeeDTO.
      required:
      - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          description: Google `displayName`. Omitted when empty.
        rsvp:
          type: string
          description: Mapped from Google `responseStatus`. Anything other than accepted/declined/tentative
            — including Google's `needsAction` and an empty value — collapses to `pending`. Because `pending`
            is a non-empty string it is always emitted despite the omitempty tag.
          enum:
          - accepted
          - declined
          - tentative
          - pending
        organizer:
          type: boolean
          description: Omitted when false.
    CalendarEventConference:
      type: object
      description: api.conferenceDTO. Populated from `hangoutLink` first; otherwise from the conferenceData
        entry point or the Paceday-private extended properties.
      required:
      - provider
      - url
      properties:
        provider:
          type: string
          description: '`google_meet` when derived from a Google hangout link or conference entry point,
            otherwise whatever string was stored in the event''s private extended properties by the conferencing
            handlers (e.g. `zoom`, `custom`). Not constrained by an enum in Go.'
        url:
          type: string
          format: uri
        label:
          type: string
