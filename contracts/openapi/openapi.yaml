      summary: Create or replace the OIDC SSO configuration for a domain
      description: "Upsert keyed on domain: a second POST for the same domain replaces the\nconfiguration\
        \ (there is no PATCH/PUT). It is a replace for every value\na reader can see (PAC-22 spec §3.2):\
        \ `provider_name`, `provider_type`,\n`oidc_issuer` and `oidc_client_id` are supplied on every\
