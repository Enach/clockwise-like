      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Monday=1 .. Sunday=7 on the wire (0 in the database).
        startTime:
          type: string
          description: Rendered by the Postgres driver from a TIME column.
          x-uncertain: 'Request format is strictly HH:MM, but the response is the driver''s text form
            of a TIME column, which is "HH:MM:SS" (e.g. "09:00:00"). No test asserts the response string,
            so the exact shape is unconfirmed. Clients must not assume request and response formats are
            identical.

            '
        endTime:
          type: string
          x-uncertain: Same TIME-column formatting question as startTime.
        label:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - teamId
      - dayOfWeek
      - startTime
      - endTime
      - label
      - createdAt
      additionalProperties: false
    NoMeetingZoneRequest:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Monday=1 .. Sunday=7. 0 is rejected, so this field is effectively required.
        startTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: HH:MM, 24-hour, parsed with Go layout "15:04". Trimmed before use.
        endTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: HH:MM. Must be strictly after startTime.
        label:
          type: string
          description: Trimmed. Optional; the column defaults to an empty string.
      required:
      - dayOfWeek
      - startTime
      - endTime
      additionalProperties: true
