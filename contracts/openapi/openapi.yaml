    SchedulingErrorResponse:
      type: object
      description: 'The JSON error shape produced by api.writeError (handlers_settings.go:206). Emitted
        with `Content-Type: application/json`. Every 5xx in this domain uses it, with a fixed server-chosen
        message (PAC-21). Handlers that use the Go stdlib `http.Error` for a 4xx return text/plain and
        do NOT use this shape; each response above says which applies. The 401 from requireAuth is a hybrid:
        the body text is `{"error":"unauthorized"}` but it is written through http.Error, which overwrites
        the Content-Type to `text/plain; charset=utf-8`.

        '
      properties:
        error:
          type: string
      required:
      - error
      additionalProperties: false
    SchedulingLink:
      type: object
      description: backend/api/handlers_scheduling_links.go schedulingLinkDTO. Note the DTO field names
        deliberately differ from the storage json tags (`durations` vs `duration_options`, `days` vs `days_of_week`,
        `owner_id` vs `owner_user_id`, `window_start` vs `window_start_time`).
      required:
      - id
      - owner_id
      - title
      - slug
      - durations
      - days
      - window_start
      - window_end
      - buffer_before
      - buffer_after
      - min_notice_minutes
      - usage_type
      - uses_count
      - active
      - hosts
      - created_at
      - is_owner
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
          description: Lowercase alphanumerics separated by single dashes (normalizeSlug).
        durations:
          type: array
          items:
            type: integer
        days:
          type: array
          description: Weekday abbreviations mapped from the stored 0-6 integers, Sunday = "sun".
          items:
            type: string
            enum:
            - sun
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
        window_start:
          type: string
          description: Read back from the Postgres TIME column, so it comes out as "HH:MM:SS" even though
            the handler normalises the input to "HH:MM" before writing (confirmed by handlers_scheduling_links_test.go:91
            expecting "10:00:00").
          example: 09:00:00
        window_end:
          type: string
          example: '17:00:00'
        buffer_before:
          type: integer
          minimum: 0
        buffer_after:
          type: integer
          minimum: 0
        min_notice_minutes:
          type: integer
          minimum: 0
        usage_type:
          type: string
          enum:
          - reusable
          - recurring
          - single_use
        max_uses:
          type: integer
          description: Present only for `recurring` links. Forced to null (and therefore omitted, json
            `max_uses,omitempty`) for reusable and single_use.
        uses_count:
          type: integer
          description: Count of non-cancelled bookings, computed by subquery at read time.
        active:
          type: boolean
        hosts:
          type: array
          description: Every host regardless of status, ordered by invited_at. Always an array, never
            null.
          items:
            $ref: '#/components/schemas/SchedulingLinkHost'
        created_at:
          type: string
          format: date-time
          description: UTC, Go layout "2006-01-02T15:04:05.000Z07:00" (millisecond precision).
          example: '2026-08-12T10:00:00.000Z'
        is_owner:
          type: boolean
          description: True when owner_id equals the authenticated caller.
        my_status:
          type: string
          enum:
          - pending
          - accepted
          - declined
          description: The caller's own host status. Omitted (json `my_status,omitempty`) when the caller
            is not among the link's hosts.
    SchedulingLinkBookingRecord:
      type: object
      description: Raw backend/storage/scheduling_links.go Booking row, returned by GET /api/scheduling-links/{id}/bookings.
        Field names differ from PublicBookingConfirmation.
      required:
