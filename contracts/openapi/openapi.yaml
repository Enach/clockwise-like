            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags:
      - auth
      summary: Calendar connection status for the current session
      description: 'Protected by requireAuth (cookie `auth_token` or `Authorization: Bearer`).

        Reports the CALLER''S own calendar connection: it branches on the caller''s

        `calendarProvider` and, on the outlook branch, reads the caller''s own

        stored Microsoft credential.

        On an internal failure it does NOT error — it 200s with

        {connected:false, provider:"google", email:""}.


        PAC-24 resolves API-009. Before it, this branched on the SINGLETON

        settings row''s calendar_provider and returned that row''s

        `calendar_email`, and `auth.LoadMicrosoftToken` took no user id at all

        (`backend/auth/microsoft_oauth.go:61`, `WHERE id = 1`) — so one user''s

        Outlook address and connection state were reported to everybody, and

        only the google branch consulted the caller.

        The response shape is unchanged; what changes is whose state it

        describes. See `docs/specs/PAC-24.md` §2.5 for the wider problem the same

        singleton created on the write side, which is in PAC-24''s scope but is

        not visible on this operation.

        '
      responses:
        '200':
          description: Connection status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '401':
          description: 'No/invalid JWT. Body is the literal JSON text `{"error":"unauthorized"}`

            but Content-Type is `text/plain; charset=utf-8` because http.Error

            overwrites the header the middleware just set.

            '
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
  /api/auth/zoom:
    get:
      operationId: startZoomOAuth
      tags:
      - conferencing
      summary: Begin the Zoom OAuth authorization-code flow.
      description: Sets a 300-second HttpOnly `zoom_oauth_state` cookie (SameSite=Lax, Path=/) and 302-redirects
        to Zoom's authorize endpoint. Not a JSON endpoint.
      security: []
      responses:
        '302':
          description: Redirect to Zoom's authorize URL.
          headers:
            Location:
              description: Zoom authorize URL with query params response_type=code, client_id, redirect_uri
                (ZOOM_REDIRECT_URL), state (32 hex chars).
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: zoom_oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax
              schema:
                type: string
        '503':
          description: 'ZOOM_CLIENT_ID is unset. Body: {"error":"Zoom OAuth not configured"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/auth/zoom/callback:
    get:
      operationId: handleZoomOAuthCallback
      tags:
      - conferencing
      summary: Zoom OAuth redirect target; exchanges the code and stores tokens.
      description: Compares `state` against the `zoom_oauth_state` cookie, clears that cookie, exchanges
        `code` for tokens, persists them, then 302-redirects to the app root. Error bodies here use `http.Error`,
        i.e. `text/plain; charset=utf-8` plain text, NOT the shared JSON error envelope.
      security: []
      parameters:
      - name: code
        in: query
        required: false
        description: Authorization code from Zoom. Absent/blank values are forwarded to the token exchange,
          which then fails with 500.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: Must equal the `zoom_oauth_state` cookie value, otherwise 400.
        schema:
          type: string
      responses:
        '302':
          description: Tokens stored; redirect back to the app.
          headers:
            Location:
              description: Always the literal string `/?connected=true&provider=zoom`.
              schema:
                type: string
                const: /?connected=true&provider=zoom
            Set-Cookie:
              description: zoom_oauth_state=; Path=/; Max-Age=0 (clears the state cookie)
              schema:
                type: string
        '400':
          description: Missing cookie or state mismatch.
          content:
            text/plain:
              schema:
                type: string
                const: 'invalid state

                  '
        '500':
          description: Token exchange or token persistence failed.
          content:
            text/plain:
              schema:
                type: string
                examples:
                - 'zoom token exchange: <error>

                  '
                - 'save zoom token: <error>

                  '
