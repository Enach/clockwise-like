              schema:
                type: string
                format: uri
            Set-Cookie:
              description: '`slack_oauth_state=<random>; Path=/; Max-Age=300; HttpOnly`'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: '`SLACK_CLIENT_ID` is unset. Body: `{"error":"Slack not configured"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/integrations/slack/status:
    get:
      operationId: getSlackStatus
      tags:
