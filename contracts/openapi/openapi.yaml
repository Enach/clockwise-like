  /api/scheduling-links/host-invites/{id}/accept:
    post:
      operationId: acceptSchedulingLinkHostInvite
      tags:
      - scheduling-links
      summary: Accept a co-host invitation.
      description: '`{id}` is the SCHEDULING LINK id, not the invite/host-row id -- the handler runs `UPDATE
        scheduling_link_hosts SET status=... WHERE link_id=$1 AND user_id=$2`. This matches the `link_id`
        field of the invite list payload. The UPDATE must affect exactly the caller''s row: when it affects
        zero rows (the caller has no host row on that link, or `{id}` is not a link id, e.g. the host-row
        `id` from `SchedulingLinkHostRecord`) the answer is 404 and nothing changes (PAC-30, API-020;
        before PAC-30 this was a 200 that changed nothing). Any existing host row matches, whatever its
        current status, so accepting twice is a 200 both times and a declined host may still accept. The
        owner''s own row is a host row too, so the owner gets 200 (see PAC-30.md follow-ups). A deactivated
        link (`active=false`, see `deleteSchedulingLink`) keeps its host rows, so accept/decline on it
        match and return 200 (PAC-30 D-5); "no link has that id" in the 404 means no row at all, not an
        inactive one.'
