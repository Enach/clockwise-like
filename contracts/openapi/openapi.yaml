  /api/audit:
    get:
      operationId: listAuditEntries
      tags:
      - calendar
      summary: The calling user's own activity entries
      description: 'Returns the calling user''s own `audit_log` rows, ordered by `created_at DESC, id
        DESC`. The query is scoped by the authenticated user id that `requireAuth` puts in the request
        context under `auth.UserIDKey` (backend/api/middleware.go) and that handlers read back with `userIDFromCtx`
        or `auth.UserIDFromContext`; there is no parameter that widens it, and no caller can address another
        user''s entries.


        SERVER BEHAVIOUR SINCE PAC-23 (finding API-005, fixed): `auditHandler` (backend/api/handlers_audit.go:13-32)
        reads the caller from the request context and passes it to `storage.ListAuditLog`, whose query
        is `SELECT id, action, details, created_at FROM audit_log WHERE user_id = $1 ORDER BY created_at
        DESC, id DESC LIMIT $2` (backend/storage/audit_log.go:34); migration `026_audit_log_user_id` added
        the `user_id` column, and `storage.WriteAuditLog` (backend/storage/focus_blocks.go) records the
        subject at all seven call sites. Before PAC-23 the query had no predicate, the table had no user
        column, and every authenticated caller received every user''s rows. Falsify with `grep -n "WHERE
        user_id" backend/storage/audit_log.go` and `grep -l audit_log backend/storage/migrations/*` (`001_initial`
        and `026_audit_log_user_id`).


        A NOTE ON CITATIONS, because three revisions of this contract have now been rejected for stale
        ones. Every `file:line` below was re-derived against the tree at revision 5 (2026-10-22) **after**
        regenerating the bundle, `backend/api/gen/paceday.gen.go` and the web repo''s `src/api/generated/{types.ts,schemas.ts,schemas.types.d.ts}`.
        This description is emitted verbatim as a doc comment into `paceday.gen.go` and into `types.ts`,
        and the schema descriptions below into those two and `schemas.types.d.ts` as well, so a line number
        written here is copied into generated files in both repos that other features regenerate after
        every contract merge. Four kinds of reference are therefore deliberately NOT given as line numbers:
        anything in `backend/api/gen/paceday.gen.go` or in the web repo''s `src/api/generated/` is cited
        by **symbol**, because editing this text moves every line it could cite; the seven `storage.WriteAuditLog`
        call sites and the three `requireAuth` rejections are cited by **file and enclosing function**
        with the falsifying `grep` beside them, because eleven merges between revisions 4 and 5 moved
        every one of their line numbers while leaving the functions in place; anything in `docs/factory/PAC-23-plan.md`
        is cited by **section**, because that document is edited by other features; and anything in either
        `Makefile` is cited by **target**. A bare `file:line` remains only where no symbol encloses the
        claim (a column in a migration, one line of a short handler, a constant in the web client). Where
        a claim is cheap to check by command, the command is given instead of or beside the citation.


        Entries recorded before the PAC-23 migration have no subject and are therefore returned to **nobody**.
        They are retained rather than deleted — they cannot be attributed, and inferring an audit record''s
        subject after the fact is not acceptable (spec §3.3). How "no subject" is represented in storage
        is the migration''s business: a conforming server returns an entry only to its subject, and an
        entry with no subject has none. This description deliberately no longer spells that predicate
        `user_id IS NULL`, because the identification "no subject ⟺ pre-migration" is exact under only
        one of two delete actions that docs/factory/PAC-23-plan.md §7 item 1 leaves open — `ON DELETE
        CASCADE`, as drafted in that plan''s §2 up-migration step 1 (`ALTER TABLE audit_log ADD COLUMN
        user_id UUID REFERENCES users(id) ON DELETE CASCADE`), keeps it exact, while `ON DELETE SET NULL`
        would give a deleted user''s rows the same marker and make the sentence false. The contract must
        not be the artifact that goes stale when a plan question resolves. The observable effect is the
        same either way: on the release of PAC-23 every user''s log appears to start empty and refills
        as they use the product.


        This log is a **per-user activity feed**, not a security audit trail: it has no authentication
        events, no client address, and no actor field, and it is readable only by its subject. Since PAC-67
        it records the subject''s own provider connections being lost or disconnected (CONNECTION ENTRIES
        below), so the subject can see why a connection reads not connected; that does not make it an
        audit trail. See docs/specs/PAC-23.md §3.5 — do not build anything on it that needs a third party
        to be able to review it.


        The subject of an entry is whose calendar (or, since PAC-67, whose provider connection) it happened
        to, which is not necessarily who caused it. Every entry written by the seven PAC-23 writers has
        actor = subject, and that is true for a narrow reason worth stating: the one path where they differ
        writes no such entry at all. PAC-67 adds the first entries whose actor can differ from the subject;
        see CONNECTION ENTRIES below. `POST /api/book/{slug}` is registered outside the `requireAuth`
        group (backend/api/routes.go:27 — `:26` is the `GET .../slots` route, not this one) and reaches
        `calClient.CreateEvent` inside `BookingEngine.ConfirmBooking` (backend/engine/booking.go:269),
        so an unauthenticated third party puts a real event on a host''s calendar and nothing is recorded.
        If booking is ever recorded — PAC-23 does not add it — the subject is the host, which is already
        in scope as `h.UserID` throughout that function''s per-host loop (booking.go:244-271, from `GetUserByID`
        to `SaveBookingEvent`); the booker is not a user of this system and gets no identity here, because
        a fabricated actor in a record whose purpose is attribution is worse than an absent one (spec
        §3.2). The feed would then say that a meeting appeared on your calendar and would still be unable
        to say who put it there. Do not read the absence of an actor field as a claim that the subject
        acted.


        The scoping guarantees who may READ a row, not that the row''s contents originated with the reader.
        `details` carries free text supplied by whoever made the request, at four of the seven writers:
        a meeting title from the request body in `SmartScheduler.CreateMeeting` (backend/engine/smart_schedule.go)
        and `scheduleHandlers.createMeeting` (backend/api/handlers_schedule.go), a typed prompt in `NLPService.Parse`
        (backend/nlp/parser.go), and a client-supplied `event_id` copied unvalidated from the request
        body in `CompressionEngine.Apply` (backend/engine/compression.go) — the fourth is the one the
        `details` schema below calls the worst of them, because the value can carry JSON structure rather
        than merely a stray quote. So a writer whose actor is not the subject would place a third party''s
        words in the subject''s feed. No writer does that today — all seven have actor = subject — but
        this contract is the artifact that makes subject ≠ actor a legal shape, so it states the rule
        rather than leaving the direction unguarded: a writer whose actor is not the subject must not
        put text supplied by the actor in `details`; where that is unavoidable the entry needs the redacted
        projection spec §3.5 describes, not this operation. Spec AC-3 forbids only the mirror image, another
        user''s text reaching a non-subject.


        CONNECTION ENTRIES (PAC-67, spec PAC-67 AC-8, AC-9, AC-15, AC-16, AC-22 to AC-29, D-12, D-13).
        Three kinds record the lifecycle of the subject''s own Outlook, Zoom and Google credentials: `connection_lost`,
        `provider_disconnected` and `revocation_unconfirmed` (see `action`). Their subject is always the
        credential''s OWNER. A `connection_lost` entry is written whenever a renewal of the owner''s credential
        is permanently refused, on ANY path that renews it (spec D-13), including paths where the actor
        is not the owner: a teammate''s `GET /api/teams/{id}/availability` reading the owner''s Google
        calendar, an unauthenticated visitor on `GET /api/book/{slug}/slots` or `POST /api/book/{slug}`,
        and scheduled jobs acting for the owner. The entry goes to the owner''s log only; the requester''s
        log is never written, and nothing in these entries identifies the requester or visitor. They obey
        the rule in the previous paragraph by construction: `details` holds only server-chosen enum values
        (the provider and, for a disconnect, the revocation outcome), never text supplied by the actor,
        and never token material. Each LOSS writes exactly one `connection_lost` entry: a loss starts
        at the first permanent refusal of a credential that was usable and ends when the owner reconnects
        or disconnects that provider, so further refusals within one loss, and concurrent refusals within
        one backend process, add no entry, while a loss of a later, reconnected credential adds a new
        one (spec AC-9, AC-24, AC-25; across several backend processes is spec OQ-9). A temporary failure
        (timeout, network, provider 5xx) never writes one. Disconnects write `provider_disconnected`,
        plus `revocation_unconfirmed` when the revocation is not confirmed; the per-case counts are on
        `disconnectMicrosoft` and `disconnectZoom`.


        Like every kind in this log, these entries are written BEST-EFFORT (`storage.WriteAuditLog`, backend/storage/focus_blocks.go:
        a failed insert is written to the server log and never fails the caller). Each is written after
        the outcome it records is known, so a failed insert cannot change a response: a disconnect still
        answers its 200, and a loss is still recorded and still reported on the status surfaces, which
        do not read this log. The counts above are therefore what is WRITTEN when the insert succeeds;
        an entry whose insert failed is not retried, and its loss or disconnect then has no entry (contract
        challenge finding 2). The response of a disconnect, and the status surfaces for a loss, are the
        authoritative record.


        There is no pagination — no `offset`, no cursor, no `before`. Entries older than the most recent
        `limit` (at most 500) cannot be retrieved through this API at all, and because this operation
        is the only reader of the table in the whole codebase (one SELECT, in `storage.ListAuditLog`,
        backend/storage/audit_log.go; one INSERT, in `storage.WriteAuditLog`, backend/storage/focus_blocks.go;
        no view, no join, no second reader) they cannot be retrieved any other way either.


        WHICH SERVER ANSWERS THIS, because the `limit` description below depends on it: the hand-written
        `auditHandler` (backend/api/handlers_audit.go:13-32), registered directly on chi at backend/api/routes.go:180
        (`grep -n audit backend/api/routes.go` finds that one line). `backend/api/gen/paceday.gen.go`
        — generated from this bundle, committed, and drift-checked by the `openapi-check` make target
        — also contains a complete server surface for this operation (`ServerInterface.ListAuditEntries`,
        `ListAuditEntriesParams`, `ServerInterfaceWrapper.ListAuditEntries` binding `limit`, a `/api/audit`
        route inside `HandlerWithOptions` (which `HandlerFromMux` delegates to), and `ListAuditEntries200JSONResponse`
        / `401TextResponse` / `500JSONResponse`), and **none of it is mounted**. One command falsifies
        that claim rather than leaving a reader to trust it: `grep -rn "HandlerFromMux\|gen\.ServerInterface\|gen\.Strict\|api/gen"
        --include=*.go backend/ | grep -v "^backend/api/gen/"` — it returns nothing today. `contracts/openapi/MIGRATION.md`
        records this operation as `handwritten`, and its `notes` cell carries the precondition for moving
        it; PAC-23 does not move it (contracts/features/PAC-23.md §6). Where the two servers would answer
        the same request differently, the `limit` description says so explicitly, and it is the only place
        in this contract where they do.'
      parameters:
      - name: limit
        in: query
        required: false
        description: 'Maximum number of entries to return. Against the server that answers this operation
          — the hand-written `auditHandler`, see the operation description — every input resolves and
          none is rejected with a 4xx. Revisions 1, 2 and 3 of this description each enumerated "cases"
          and each claimed a completeness it did not have, so it is written here as a two-step RESOLUTION
          PROCEDURE instead: step 1 picks one piece of text, step 2 maps any piece of text to one number.
          Together they resolve every request that can be sent, including the ordinary one.


          STEP 1 — WHICH TEXT IS READ. The handler reads `r.URL.Query().Get("limit")` (backend/api/handlers_audit.go:23).
          `URL.Query()` is `url.ParseQuery` with its error discarded, and `ParseQuery` DROPS any `key=value`
          pair it cannot URL-unescape and carries on; `Get` then returns the first of the surviving values,
          or `""` if none survive. So the text read is **the first `limit` value that URL-decodes**, not
          the first one supplied, and multiplicity is settled here rather than being a case of its own.
          `?limit=10&limit=500` reads `10`. `?limit=500&limit=10` reads `500`. `?limit=%zz&limit=10` reads
          **`10`**, because the `%zz` pair is dropped — NOT `%zz`, and so not the default. `?limit=%zz`
          on its own leaves no surviving value and is therefore read as absent. Only a request with two
          or more DECODABLE values is "supplied more than once", and for it the later ones are ignored.


          STEP 2 — WHAT THAT TEXT RESOLVES TO. Five outcomes, and they partition every possible string,
          so there is no sixth:


          (a) nothing was read — the parameter is absent, or empty (`?limit=`), or bare (`?limit`), or
          every pair was undecodable — **50**.

          (b) text was read and is not a base-10 integer (`?limit=abc`, `?limit=50.5`, `?limit=1e2`, `?limit=+50`,
          which URL-decodes to `" 50"`) — **50**.

          (c) a base-10 integer below `minimum`, i.e. `0` or any negative value (`?limit=0`, `?limit=-5`)
          — **50**.

          (d) a base-10 integer from `minimum` to `maximum` inclusive — **that value**. This is the conforming
          request and the ONLY case the shipped client exercises (`?limit=50`); `?limit=10` returns at
          most 10 entries and `?limit=500` at most 500. Revisions 1-3 omitted it, which is why (e) had
          nothing to compose over.

          (e) a base-10 integer above `maximum` (`?limit=501`, `?limit=10000`) — **500**, the maximum
          itself, never a smaller number chosen silently. This includes a value too large for `int64`
          (`?limit=99999999999999999999`): `strconv.Atoi` saturates to `MaxInt64` and returns `ErrRange`,
          and the clamp then caps it, so the outcome is 500. An implementation that checks `Atoi`''s error
          must still resolve an overflowing value here and not into (b) — `ErrRange` means "above `maximum`",
          not "unparseable".


          `minimum`/`maximum` therefore constrain what a conforming client may send — (d) is the whole
          of what they permit — and (a), (b), (c) and (e) define what the server does with the non-conforming
          request that the wire still allows.


          ON MIGRATION TO THE GENERATED SERVER — which has not happened, which PAC-23 does not do, and
          which changes three of the five outcomes above. The generated `ServerInterfaceWrapper.ListAuditEntries`
          binds this parameter with `runtime.BindQueryParameter` into a `*int`, and on any bind error
          hands an `InvalidParamFormatError` to the default `ErrorHandlerFunc` set up in `HandlerWithOptions`,
          which is `http.Error(w, err.Error(), http.StatusBadRequest)` — plain text with `charset=utf-8`,
          `X-Content-Type-Options: nosniff` and a trailing newline (all symbols in backend/api/gen/paceday.gen.go;
          cited by name because this paragraph is emitted into that file). What changes:



          — (a) splits. Absent stays absent and still resolves. But EMPTY and BARE (`?limit=`, `?limit`)
          become `400`, because `BindStringToObject` runs `strconv.ParseInt("", 10, 64)`. `?limit=%zz`
          keeps resolving, because the binder sees no value at all.

          — (b) becomes `400` in full: `strconv.ParseInt: … invalid syntax`.

          — (e) becomes `400` **only for a value that overflows `int64`**: `strconv.ParseInt: … value
          out of range`, through the same `InvalidParamFormatError`. `?limit=10000` is unaffected and
          still resolves to 500. So the `400` is NOT "a parse failure, not a range one" — a range failure
          produces it too, and `maximum: 500` is not what guards the upper end.

          — step 1 changes. Two or more decodable values become `400` (`multiple values for single value
          parameter ''limit''`) instead of the first being used. `?limit=%zz&limit=10` still resolves
          to 10, because `ParseQuery` drops the undecodable pair before the binder sees it — the one input
          class on which both servers agree and revision 3 did not.

          — (c) and (d) are unaffected. The binder parses but does not enforce `minimum`/`maximum`, so
          `?limit=0`, `?limit=-5` and `?limit=10000` all reach the handler and remain the handler''s business.


          This operation declares no `400`, and must not while nothing emits one: factory §7 rule 2 means
          the contract describes what IS, so a declared-but- unreachable `400` would be a promise about
          a server that does not exist, would appear in any generated client as a branch no response can
          take, and would generate a `ListAuditEntries400TextResponse` inviting a handler to return it.
          The consequence is recorded instead, as a precondition: adopting the generated wrapper for `listAuditEntries`
          is a CONTRACT change, not just a handler change, and the `400` (with `PlainTextError`, the convention
          this fragment already uses for `listCalendarEvents`) must be added in the same change, never
          after it. That precondition is also in the `notes` cell of this operation''s row in `contracts/openapi/MIGRATION.md`,
          which is the file whose "Moving a row" procedure the migrating author follows — this description
          is where an author wiring `ListAuditEntriesParams` will read it, and that register is where
          an author deciding to wire it at all will.


          SERVER BEHAVIOUR SINCE PAC-23 (finding API-074, fixed): steps 1 and 2 are both the current code.
          `backend/api/handlers_audit.go:23` discards `strconv.Atoi`''s error, which is exactly right
          here: an unreadable or non-integer value arrives as `0` and resolves to the default, and an
          overflowing one arrives saturated at `MaxInt64` and resolves to the maximum. `storage.ListAuditLog`
          (backend/storage/audit_log.go:28-33) maps `<= 0` to 50 and `> 500` to 500. Before PAC-23 that
          clamp was `if limit <= 0 || limit > 500 { limit = 100 }`, so (a), (b), (c) and (e) all returned
          100 — including `?limit=10000`, below the declared `maximum`. No third number is in play: the
          50 comes from that client (`smart-calendar-flow/src/api/client.ts:419-420`, which also renders
          it into the page subtitle at `src/pages/Audit.tsx:39`). After PAC-23 that client still declares
          the number by hand, because neither pinned frontend generator hands it over as a value — in
          the committed `src/api/generated/types.ts` (openapi-typescript 7.4.4) the `listAuditEntries`
          query type is `limit?: number` with this `default` surviving only as prose in the JSDoc above
          it, and the committed `src/api/generated/schemas.ts` (typed-openapi 4.1.0, `--schemas-only`)
          emits component schemas only, so the parameter does not appear in it at all. The client''s literal
          is pinned against this `default` by test rather than imported from it; see contracts/features/PAC-23.yaml
          `consumersAffected`.'
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      responses:
        '200':
          description: 'The caller''s own audit entries. ALWAYS a JSON array — `[]` when they have none,
            never `null`. The bundle is `openapi: 3.1.0`, where `type: array` already excludes `null`,
            so a `null` body is non-conforming and spec AC-2 is expressible; what makes it true at runtime
            is the single line `entries := make([]AuditEntry, 0)` in `storage.ListAuditLog` (backend/storage/audit_log.go:40),
            and `var entries []AuditEntry` in place of the `make` would emit `null` and break this guarantee.
            Stated here because the empty case is the release-day case for every user: `[]` is also what
            a user sees for activity recorded before the PAC-23 migration.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
        '401':
          description: MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiddlewareUnauthorized'
        '500':
          description: 'Query failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/callback:
    get:
      operationId: googleOAuthCallback
      tags:
      - auth
      summary: Google OAuth callback
      description: 'Validates the `oauth_state` cookie against the `state` query param,

        exchanges the code, upserts the user, stores the OAuth token, associates

        the org, issues the `auth_token` JWT cookie, then redirects to

        `<FRONTEND_URL>/auth/callback`.

        Since PAC-35 (API-011) the redirect to `/auth/callback` happens only when

        the session cookie was actually set. If the session cannot be issued

        (empty signing secret, or token generation fails) the user is sent to

        the sign-in failure state instead; see the `302` response.


        Since PAC-67 a successful Google sign-in is also the Google RECONNECT

        (spec PAC-67 AC-12, AC-24): storing the new token ends any recorded

        loss of the Google connection for the user it resolves to, so

        `getAuthStatus` (Google calendar provider) and the `google_meet` row of

        `listConferenceProviders` report connected again, and a later loss of

        the new credential is a new loss with its own `connection_lost`

        activity entry. The user is still resolved by the Google account''s

        email, exactly as before (spec PAC-67 OQ-10: sign-in matching is not

        changed). No response of this operation changes.

        '
      security: []
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: "One of exactly two destinations (PAC-35, API-011):\n- Success: the `auth_token`\
            \ cookie is set and Location is\n  `<FRONTEND_URL>/auth/callback` (no query string, unlike\
            \ the\n  Microsoft/SSO callbacks).\n- Session not issued (signing secret empty, or token generation\n\
            \  failed) after the user and token were saved: NO `auth_token`\n  cookie is set or expired,\
            \ and Location is the sign-in failure\n  state `<FRONTEND_URL>/?error=auth_failed`. Never\
            \ `/auth/callback`.\nThe user row and stored Google token written before that point are\n\
            kept; nothing is deleted on the failure path. The cause is written\nto the server log and\
            \ Sentry only; the Location carries no cause.\n"
          headers:
            Location:
              schema:
                type: string
              description: '`<FRONTEND_URL>/auth/callback` on success;

                `<FRONTEND_URL>/?error=auth_failed` when the session could not be issued.

                '
            Set-Cookie:
              schema:
                type: string
              description: 'On success: auth_token=<HS256 JWT>; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax.

                On the failure redirect: no `auth_token` cookie at all.

                '
        '400':
          description: Missing or mismatched `oauth_state` cookie ("invalid state").
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: 'Token exchange, userinfo fetch, user upsert or token save failed. Body: `{"error":"internal
            error"}`. The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/callback/oidc/{domain}:
    get:
      operationId: ssoOidcCallback
      tags:
      - auth
      summary: OIDC SSO callback
      description: 'Verifies `sso_state` (both the random half and the embedded domain),

        re-discovers the OIDC client, exchanges the code, checks that the

        asserted email belongs to `{domain}` (PAC-45), upserts the user with

        provider="sso", and issues the JWT cookie.

        Since PAC-35 (API-011) the redirect to `/auth/callback?provider=sso`

        happens only when the session cookie was actually set; otherwise the

        user goes to the sign-in failure state (see `302`).

        Inconsistent error encoding: the 404 and 500 use the JSON helpers while

        the 400s and the 403 use http.Error (text/plain).

        '
      security: []
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: "One of exactly two destinations (PAC-35, API-011):\n- Success: the `auth_token`\
            \ cookie is set and Location is\n  `<FRONTEND_URL>/auth/callback?provider=sso`.\n- Session\
            \ not issued (signing secret empty, or token generation\n  failed) after the user was saved:\
            \ NO `auth_token` cookie is set\n  or expired, and Location is the sign-in failure state\n\
            \  `<FRONTEND_URL>/?error=auth_failed`. The saved user row is kept.\nEvery other failure stays\
            \ a non-302 response below (spec PAC-35\nD-1).\n"
          headers:
            Location:
              schema:
                type: string
              description: '`<FRONTEND_URL>/auth/callback?provider=sso` on success;

                `<FRONTEND_URL>/?error=auth_failed` when the session could not be issued.

                '
            Set-Cookie:
              schema:
                type: string
              description: 'On success: auth_token JWT cookie. On the failure redirect: no

                `auth_token` cookie at all.

                '
        '400':
          description: '"missing state cookie", "invalid state", or "no email in OIDC token claims".'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: '"email domain does not match SSO provider domain": the IdP asserted

            an email whose domain is not exactly `{domain}` (PAC-45). No user is

            upserted and no session is issued. text/plain (http.Error).

            Documented by PAC-35: the response has existed since PAC-45 (#172)

            but was missing from this contract.

            '
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '404':
          description: '"SSO not configured for this domain" — JSON, unlike the other errors here. No
            active provider row: none exists, or it is suspended (PAC-22). A sign-in started before a
            suspension that reaches this callback after it gets this 404 and no session. Also returned
            when the lookup errors.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'OIDC setup, code exchange or user upsert failed. Body: `{"error":"internal error"}`.
            The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/detect:
    post:
      operationId: detectAuthProvider
      tags:
      - auth
      summary: Detect which auth provider an email address should use
      description: 'Rate limited to 20 requests per minute per client IP (fixed one-minute

        window per key, in-process map; expired buckets are swept at most once a

        minute). Since PAC-39 (#215, API-062) the key is the IP of the socket peer

        (`RemoteAddr` without its port). `X-Forwarded-For` is never read. A

        client-supplied `X-Real-IP` is ignored; `X-Real-IP` is used only when the

        socket peer is inside the operator''s `TRUSTED_PROXIES` allowlist (empty

        by default, so no proxy is trusted) and holds a valid IP. Still open

        (API-062): the map is per process, so the effective limit is

        20/min x replicas.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoDetectRequest'
      responses:
        '200':
          description: Detection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoDetectResponse'
        '400':
          description: Body is not JSON, or `email` is empty ("email required").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '"rate limit exceeded" — more than 20 detects in the current one-minute window
            from this client IP (socket peer, or X-Real-IP from a trusted proxy).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'The SSO provider lookup failed. Body: `{"error":"internal error"}`. The detail
            is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/disconnect:
    delete:
      operationId: disconnectCalendar
      tags:
      - auth
      summary: Disconnect the caller's Google calendar (the session is kept)
      description: "Never touches the session: no response of this operation sets or\nexpires the `auth_token`\
        \ cookie (PAC-35, API-061; before PAC-35 the\n204 expired it and so logged the user out).\n\n\
        Branches on the caller's calendar provider exactly as `getAuthStatus`\ndoes (`calendarProvider`\
        \ from the caller's own settings row; blank or\nany value other than `outlook` / `webcal` means\
        \ Google; a caller with\nno settings row yet gets the default row, provider `google`, exactly\
        \ as\n`getAuthStatus` creates it), so the server and the app classify every\nuser the same way\
        \ (spec PAC-35 D-8):\n- Google: deletes the caller's stored Google OAuth token row and answers\n\
        \  204. As before, this also turns Google Meet to not connected for the\n  caller (it depends\
        \ on the same credential). A caller with no stored\n  token gets 204 too.\n- `outlook` or `webcal`:\
        \ deletes NOTHING (the stored Google token, if\n  the caller holds one, the Microsoft credential\
        \ and the webcal link\n  are all kept) and answers 409 `CalendarDisconnectUnsupported`.\n  Disconnect\
        \ for these calendars is not implemented HERE (spec PAC-35\n  OQ-5). Since PAC-67 the Microsoft\
        \ credential has its own operation,\n  `disconnectMicrosoft` (`POST /api/auth/microsoft/disconnect`);\
        \ this\n  operation's 409 for `outlook` and `webcal` is unchanged by it (spec\n  PAC-67 OQ-3).\n\
        - The settings row cannot be read (or created): deletes nothing and\n  answers 500.\n  The provider\
        \ is never guessed as Google on this path, so a read\n  failure cannot delete an Outlook or webcal\
        \ user's Google token.\n  (`getAuthStatus` still answers \"google\" on its own read failure;\n\
        \  disconnect deliberately does not follow it there.)\n"
      responses:
        '204':
          description: 'The caller''s calendar is Google and its stored token row is gone

            (or there was none). No body. No Set-Cookie.

            '
        '401':
          description: No/invalid JWT (text/plain body carrying JSON text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '409':
          description: 'The caller''s calendar provider is `outlook` or `webcal`. Nothing was

            deleted and the session is kept. This is the only 409 this

            operation returns, so a client can tell "disconnect is not available

            for this kind of calendar" from every other failure by status

            alone; `provider` says which kind. A client must treat it as a

            failure, never as a success (spec PAC-35 D-8).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDisconnectUnsupported'
        '500':
          description: 'The caller''s settings could not be read, or the token delete failed. Nothing
            else is changed and the session is kept. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/google:
    get:
      operationId: startGoogleOAuth
      tags:
      - auth
      summary: Begin Google OAuth
      description: 'Sets an httpOnly `oauth_state` cookie (MaxAge 300, SameSite=Lax) and

        redirects to Google''s consent screen. Never returns a body.

        Since PAC-35 (API-064) a valid `login_hint` is forwarded to Google so the

        account the user typed is preselected. Google still shows its consent

        screen every time (`oauth2.ApprovalForce`); the hint chooses the

        account, it does not skip the screen.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/LoginHint'
      responses:
        '302':
          description: 'Redirect to Google''s authorization endpoint. Always a 302, whatever

            `login_hint` holds: an invalid hint is dropped, never a 400.

            '
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: 'auth.GetAuthURL(oauthConfig, state), plus `login_hint=<hint>`

                (URL-encoded) when the request''s `login_hint` passed the

                LoginHint rule. No other query parameter of this request is

                copied into it.

                '
            Set-Cookie:
              schema:
                type: string
              description: oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax
  /api/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: Clear the session cookie
      description: 'Expires the `auth_token` cookie. Note it is behind requireAuth, so logging

        out with an already-expired token returns 401 rather than succeeding

        (unchanged by PAC-35, spec section 5).

        '
      responses:
        '204':
          description: 'Logged out. No body (PAC-35, API-063; before PAC-35 this was a 200

            with an empty body and no Content-Type, which the strict web client

            would classify as "server unreachable").

            '
          headers:
            Set-Cookie:
              schema:
                type: string
              description: auth_token=; Path=/; Max-Age=-1; HttpOnly; SameSite=Lax
        '401':
          description: No/invalid JWT.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags:
      - auth
      summary: The authenticated user
      description: 'Since PAC-35 (API-065) the user''s picture has one name in the

        current-user read: `avatarUrl`, the name the server already sends.

        Clients read it under that name; the server does not rename it.

        Scheduling-link and booking hosts carry the same stored value as

        `avatar_url` (`SchedulingLinkHost`, `PublicHost`), unchanged by PAC-35.

        '
      responses:
        '200':
          description: The user row (with its org when one is associated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: 'No/invalid JWT. Returned by requireAuth, or by the handler itself when

            the context user id is uuid.Nil. Body text is `{"error":"unauthorized"}`

            served as text/plain.

            '
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '404':
          description: 'Valid JWT but no matching users row — body text is

            `{"error":"user not found"}` served as text/plain.

            '
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
  /api/auth/microsoft:
    get:
      operationId: startMicrosoftOAuth
      tags:
      - auth
      summary: Begin Microsoft OAuth
      description: 'Sets an httpOnly `ms_oauth_state` cookie and redirects to Microsoft.

        Configuration is read from env at request time (MICROSOFT_CLIENT_ID);

        if the client id is blank the route 503s.

        Since PAC-35 (API-064) a valid `login_hint` is forwarded to Microsoft.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/LoginHint'
      responses:
        '302':
          description: 'Redirect to Microsoft''s authorization endpoint. An invalid

            `login_hint` is dropped, never a 400.

            '
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: 'auth.GetMicrosoftAuthURL(cfg, state), plus `login_hint=<hint>`

                (URL-encoded) when the request''s `login_hint` passed the

                LoginHint rule. No other query parameter of this request is

                copied into it.

                '
            Set-Cookie:
              schema:
                type: string
              description: ms_oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax
        '503':
          description: '`MICROSOFT_CLIENT_ID` is unset — "Microsoft OAuth not configured".'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/microsoft/callback:
    get:
      operationId: microsoftOAuthCallback
      tags:
      - auth
      summary: Microsoft OAuth callback
      description: 'Validates `ms_oauth_state`, exchanges the code, fetches the Graph profile

        and upserts the user, then saves the Microsoft token on THAT USER''S OWN

        settings row (making Outlook their calendar provider), sets the session

        cookie and redirects. Since PAC-24 the profile fetch is required, not

        best-effort: without it there is no user to attach the credential to, so

        nothing is saved. Before PAC-24 the token was saved on the single shared

        settings row and the provider flipped for everyone.

        Since PAC-35 (API-011, API-012) three failures after a successful code

        exchange end on the app''s sign-in failure state rather than on a JSON

        error page on the API origin: the Graph profile could not be read (or

        carried no email), the user could not be saved, or the session could

        not be issued. See the `302` response.


        Since PAC-67 this sign-in is also the Outlook RECONNECT, and what it

        stores changes in two ways; no response, status or Location changes.

        (1) When the code exchange returns an access token but NO refresh

        token, the user''s stored refresh token is kept, never overwritten with

        an empty one, so a working connection is never erased by a reconnect

        (spec PAC-67 AC-11). With no refresh token stored before either, the

        result is a credential with no refresh token. It can never be renewed,

        so it is reported not connected both by `getAuthStatus` (as today) and,

        since PAC-67, by the `teams` row of `listConferenceProviders` (which

        before PAC-67 reported it connected and enabled); once its access token

        expires, Teams meeting creation with it answers the 400 "teams:

        connection lost — reconnect at /api/auth/microsoft" without recording a

        loss (contract challenge finding 5). (2) Storing the credential ends any recorded loss of

        the Outlook connection for the user it resolves to (AC-12, AC-24), so

        `getAuthStatus` (Outlook calendar provider) and the `teams` row of

        `listConferenceProviders` report connected again. The credential is

        still attached to the user matched by the Microsoft account''s email,

        and every sign-in still sets that user''s calendar provider to

        `outlook`, including a sign-in after `disconnectMicrosoft` (spec

        PAC-67 D-4, OQ-5, OQ-10: unchanged on purpose).

        '
      security: []
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: "One of exactly two destinations (PAC-35):\n- Success: Location `<FRONTEND_URL>/auth/callback?provider=outlook`,\n\
            \  with the `auth_token` cookie set.\n- Sign-in failure state, Location `<FRONTEND_URL>/?error=auth_failed`,\n\
            \  with NO `auth_token` cookie set or expired, when any of these\n  happens after the code\
            \ exchange succeeded:\n  (a) the Graph profile could not be read, or carried no email\n  \
            \    (nothing is saved; API-012, was a 502);\n  (b) the user upsert failed (nothing is saved;\
            \ API-012, was a 500\n      with `{\"error\":\"save user failed\"}`);\n  (c) the session could\
            \ not be issued (signing secret empty, or\n      token generation failed) after the user and\
            \ the Microsoft\n      token were saved; they are kept (API-011).\nThe cause is written to\
            \ the server log and Sentry only; the\nLocation carries no cause, provider name or detail.\n\
            State mismatch, token exchange failure, token save failure and an\nunconfigured client are\
            \ NOT redirects; they are the 400, 500 and\n503 below (spec PAC-35 D-1).\n"
          headers:
            Location:
              schema:
                type: string
              description: '`<FRONTEND_URL>/auth/callback?provider=outlook` on success;

                `<FRONTEND_URL>/?error=auth_failed` on the failures (a)-(c).

                '
            Set-Cookie:
              schema:
                type: string
              description: 'On success: auth_token JWT for the upserted user. On the failure

                redirect: no `auth_token` cookie at all.

                '
        '400':
          description: Missing or mismatched `ms_oauth_state` cookie ("invalid state").
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: 'Token exchange or token save failed. Body: `{"error":"internal error"}`. The detail
            is written to the server log and Sentry only (PAC-21). A failed user upsert is no longer a
            500, and an unreadable Graph profile is no longer a 502: since PAC-35 both are the failure
            redirect under `302`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`MICROSOFT_CLIENT_ID` is unset. Body: `{"error":"Microsoft OAuth not configured"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/microsoft/disconnect:
    post:
      operationId: disconnectMicrosoft
      tags:
      - auth
      summary: Disconnect the caller's Outlook (Microsoft) credential (the session is kept)
      description: "New in PAC-67 (spec AC-13, AC-16, AC-17, D-3, D-5, D-8). Protected by\nrequireAuth.\
        \ Takes no request body (any body is ignored). Acts on the\nCALLER only; no other user's credential,\
        \ settings or activity log is\nread or written.\n\nEffects, in this order. Steps 1 and 2 are ONE\
        \ atomic change: either\nboth happen or neither does (then the answer is the 500 below).\n1. The\
        \ caller's stored Microsoft credential (access token, refresh\n   token, expiry) is removed WHETHER\
        \ OR NOT IT DECODES (a stored value\n   that is not valid JSON, on which `LoadMicrosoftToken`\
        \ fails, is\n   removed like any other, answers `not_offered` and writes the entry\n   of step\
        \ 5; it is never a 500), and any recorded loss of it is\n   cleared: a later Microsoft sign-in\
        \ starts a fresh connection.\n2. When the caller's conferencing provider is `teams` it becomes\n\
        \   `meet` (spec D-8); any other conferencing provider is unchanged.\n3. The caller's calendar\
        \ provider is NOT changed (spec D-3): a caller\n   on `outlook` stays on `outlook` and `getAuthStatus`\
        \ reports\n   `{connected: false, provider: \"outlook\"}` until they sign in with\n   Microsoft\
        \ again or choose another provider in settings.\n4. Nothing is sent to Microsoft. Microsoft offers\
        \ no revocation of one\n   application's grant for one user that Paceday can call with the\n \
        \  user's own delegated token: deleting the delegated permission\n   grant (`DELETE /oauth2PermissionGrants/{id}`)\
        \ needs\n   `DelegatedPermissionGrant.ReadWrite.All` and an administrator role\n   for work or\
        \ school accounts and is not supported for personal\n   accounts, and the only per-user server\
        \ call left\n   (`revokeSignInSessions`) signs the user out of every application,\n   which spec\
        \ D-5 forbids (OQ-1, resolved in\n   contracts/features/PAC-67.md §3). The answer therefore always\n\
        \   carries `revocation: not_offered` when a credential was removed,\n   and the client tells\
        \ the user the grant can be removed from their\n   Microsoft account (AC-17).\n5. One `provider_disconnected`\
        \ activity entry is written for the\n   caller, details `{\"provider\":\"outlook\",\"revocation\"\
        :\"not_offered\"}`,\n   after steps 1 and 2 have succeeded. The write is BEST-EFFORT, like\n \
        \  every kind in the activity log (`storage.WriteAuditLog`): a failed\n   insert is written to\
        \ the server log and the 200 stands, because\n   the credential is already removed; that disconnect\
        \ then has no\n   entry. No `revocation_unconfirmed` entry is written: nothing was\n   attempted,\
        \ so nothing failed (round-5 challenge NB-2).\n\nA caller with no stored Microsoft credential\
        \ gets 200 with\n`revocation: nothing_stored`: step 2 still applies, nothing else\nchanges, and\
        \ no activity entry is written.\n\nAfter a 200 the `teams` row of `listConferenceProviders` reports\n\
        `connected: false` with `enabled` omitted.\n\nUnlike `disconnectCalendar`, there is no 409: the\
        \ operation applies to\nevery caller whatever their calendar provider, and it does not touch\n\
        the Google credential or the webcal link.\n"
      responses:
        '200':
          description: 'The Microsoft credential is gone (or there was none). The session

            is kept: no Set-Cookie.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDisconnectResult'
        '401':
          description: No/invalid JWT (text/plain body carrying JSON text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: 'The caller''s settings could not be read, or the atomic change of steps 1 and
            2 failed. NOTHING was changed: the credential is still stored, the conferencing provider is
            unchanged and no activity entry is written, so a retry is safe. A stored credential that does
            not decode is NOT this case (see step 1), and nothing that fails after steps 1 and 2 is a
            500: a failed activity-entry write is logged only. Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/sso/{domain}:
    get:
      operationId: startSsoLogin
      tags:
      - auth
      summary: Begin OIDC SSO login for a configured domain
      description: 'Looks up the SSO provider row for `{domain}`, builds the OIDC redirect

        URL as `os.Getenv("APP_URL") + "/api/auth/callback/oidc/" + domain`, sets

        an `sso_state` cookie of the form `<state>|<domain>`, and redirects.

        This is the destination `detectAuthProvider` names in `redirect_url`;

        the web app reaches it by resolving that path against the API origin and

        appending `?login_hint=<typed email>` (PAC-35, API-010).

        Since PAC-35 (API-064) a `login_hint` that passes the LoginHint rule AND

        whose domain is exactly `{domain}` (case-insensitive, no subdomains, the

        same test as the callback''s PAC-45 check) is forwarded to the IdP. A hint

        at another domain is dropped, so this route never sends one

        organisation''s IdP an address outside that organisation''s domain.

        Unchanged by PAC-35 (spec D-5): the 404, 500 and 501 answers below.

        Since PAC-22 (API-060, spec D-1) createSsoProvider refuses SAML and

        incomplete OIDC configurations, so the 501 below is reachable only for

        rows stored before PAC-22; those rows are neither rewritten nor

        deleted, and this route keeps refusing them exactly as before. The 500

        (issuer discovery failed) stays reachable for any row whose discovery

        fails: a row stored before PAC-22 with an empty issuer, and equally a

        row written since whose issuer is unreachable or unusable

        (createSsoProvider requires only a non-empty issuer, so `" "` is

        accepted). Only an active row is looked up: a configuration

        suspended through setSsoProviderState (PAC-22) answers the 404, as if

        no SSO were configured.

        '
      security: []
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
        description: Email domain, e.g. "acme.com".
      - $ref: '#/components/parameters/LoginHint'
      responses:
        '302':
          description: 'Redirect to the identity provider. Always a 302 for a usable OIDC

            row, whatever `login_hint` holds: an invalid or other-domain hint is

            dropped, never a 400.

            '
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: 'The IdP authorization URL (OIDCClient.AuthURL(state)), plus

                `login_hint=<hint>` (URL-encoded) when the hint passed the

                LoginHint rule and belongs to `{domain}`. No other query

                parameter of this request is copied into it.

                '
            Set-Cookie:
              schema:
                type: string
              description: sso_state=<32 hex chars>|<domain>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax
        '404':
          description: '"SSO not configured for this domain" — no active provider row: none exists, or
            it is suspended (PAC-22). Also returned when the lookup errors.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Issuer discovery failed. Body: `{"error":"internal error"}`. The detail is written
            to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: '"SAML not yet supported" — the stored provider_type is "saml".'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags:
      - auth
      summary: Calendar connection status for the current session
      description: "Protected by requireAuth (cookie `auth_token` or `Authorization: Bearer`).\nReports\
        \ the CALLER'S own calendar connection: it branches on the caller's\n`calendarProvider` and, on\
        \ the outlook branch, reads the caller's own\nstored Microsoft credential.\nOn an internal failure\
        \ it does NOT error — it 200s with\n{connected:false, provider:\"google\", email:\"\"}.\n\nSince\
        \ PAC-67 `connected` means USABLE, not merely stored (spec PAC-67\n§3, AC-8, AC-12, AC-13, AC-21).\
        \ A credential whose renewal the provider\npermanently refused (OAuth `invalid_grant` or equivalent)\
        \ is kept\n(spec D-1) but is recorded as lost, and while that loss is recorded\nthis operation\
        \ reports `connected: false` for it. A temporary failure\n(network, timeout, provider 5xx) is\
        \ never recorded as a loss and never\nturns this to false (AC-10). Per branch:\n- `outlook`: true\
        \ when the caller holds a stored Microsoft credential\n  with a refresh token AND no loss of it\
        \ is recorded; false after\n  `disconnectMicrosoft` (the credential is gone) and after a loss.\n\
        - `google` (blank or any unrecognised provider): true when the caller\n  holds a stored Google\
        \ token row AND no loss of it is recorded.\n- `webcal`: unchanged.\nOnly the caller's own credentials\
        \ are consulted. A loss recorded while\nthe credential was being used for someone else (a teammate's\
        \ team\navailability request, a public booking page, a scheduled job) is the\nOWNER's: it changes\
        \ the owner's answer here, never the requester's\n(spec D-12). The response shape is unchanged;\
        \ no field is added.\n\nPAC-24 resolves API-009. Before it, this branched on the SINGLETON\nsettings\
        \ row's calendar_provider and returned that row's\n`calendar_email`, and `auth.LoadMicrosoftToken`\
        \ took no user id at all\n(`backend/auth/microsoft_oauth.go:61`, `WHERE id = 1`) — so one user's\n\
        Outlook address and connection state were reported to everybody, and\nonly the google branch consulted\
        \ the caller.\nThe response shape is unchanged; what changes is whose state it\ndescribes. See\
        \ `docs/specs/PAC-24.md` §2.5 for the wider problem the same\nsingleton created on the write side,\
        \ which is in PAC-24's scope but is\nnot visible on this operation.\n"
      responses:
        '200':
          description: Connection status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '401':
          description: 'No/invalid JWT. Body is the literal JSON text `{"error":"unauthorized"}`

            but Content-Type is `text/plain; charset=utf-8` because http.Error

            overwrites the header the middleware just set.

            '
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
  /api/auth/zoom:
    get:
      operationId: startZoomOAuth
      tags:
      - conferencing
      summary: Begin the Zoom OAuth authorization-code flow.
      description: 'Sets a 300-second HttpOnly `zoom_oauth_state` cookie (SameSite=Lax, Path=/) and 302-redirects
        to Zoom''s authorize endpoint. Not a JSON endpoint. Requires a signed-in user since PAC-24: Zoom
        is connected to the caller''s own settings, so there must be a caller (session cookie, which the
        browser sends on this top-level navigation).'
      responses:
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '302':
          description: Redirect to Zoom's authorize URL.
          headers:
            Location:
              description: Zoom authorize URL with query params response_type=code, client_id, redirect_uri
                (ZOOM_REDIRECT_URL), state (32 hex chars).
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: zoom_oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax
              schema:
                type: string
        '503':
          description: 'ZOOM_CLIENT_ID is unset. Body: {"error":"Zoom OAuth not configured"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/auth/zoom/callback:
    get:
      operationId: handleZoomOAuthCallback
      tags:
      - conferencing
      summary: Zoom OAuth redirect target; exchanges the code and stores tokens.
      description: 'Compares `state` against the `zoom_oauth_state` cookie, clears that cookie, exchanges
        `code` for tokens, persists them on the CALLER''S OWN settings row (making Zoom the caller''s
        conferencing provider, and nobody else''s), then 302-redirects to the app root. Requires a signed-in
        user since PAC-24 (401 otherwise); before PAC-24 it wrote the single shared settings row. Error
        bodies here use `http.Error`, i.e. `text/plain; charset=utf-8` plain text, NOT the shared JSON
        error envelope.


        Since PAC-67 (spec AC-3, AC-11, AC-12, AC-24) this is also the Zoom RECONNECT, and what it stores
        changes; no response, status or Location changes. The access token''s expiry (from the exchange''s
        `expires_in`) is stored with the tokens so the credential can be renewed when it expires. When
        the exchange returns no refresh token, the caller''s stored refresh token is kept rather than
        overwritten with an empty one (AC-11). Storing the credential ends any recorded loss of the caller''s
        Zoom connection, so the `zoom` row of `listConferenceProviders` reports connected again.'
      parameters:
      - name: code
        in: query
        required: false
        description: Authorization code from Zoom. Absent/blank values are forwarded to the token exchange,
          which then fails with 500.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: Must equal the `zoom_oauth_state` cookie value, otherwise 400.
        schema:
          type: string
      responses:
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '302':
          description: Tokens stored; redirect back to the app.
          headers:
            Location:
              description: Always the literal string `/?connected=true&provider=zoom`.
              schema:
                type: string
                const: /?connected=true&provider=zoom
            Set-Cookie:
              description: zoom_oauth_state=; Path=/; Max-Age=0 (clears the state cookie)
              schema:
                type: string
        '400':
          description: Missing cookie or state mismatch.
          content:
            text/plain:
              schema:
                type: string
                const: 'invalid state

                  '
        '500':
          description: 'Token exchange or token persistence failed. Body: `{"error":"internal error"}`.
            The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/book/{slug}:
    parameters:
    - name: slug
      in: path
      required: true
      description: Scheduling-link slug (chi URLParam "slug"). Lookup is `slug = $1 AND active = true`.
      schema:
        type: string
    get:
      operationId: getPublicLinkInfo
      tags:
      - booking
      summary: Public metadata for a bookable scheduling link.
      security: []
      responses:
        '200':
          description: Link is bookable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLinkInfo'
        '404':
          description: 'No active link with that slug. Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: 'Link exhausted (single_use with >=1 use, or recurring at max_uses). Body: {"error":"link
            is no longer accepting bookings"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Storage failure. Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    post:
      operationId: createPublicBooking
      tags:
      - booking
      summary: Book a slot on a public scheduling link.
      security: []
      description: 'Rate limited per client (NEW-booking-rate-limit). A client may make at most 20 requests
        to this operation per fixed 10-minute window; the window starts at the client''s first counted
        request and is not extended by refused requests. The limit is checked and the request counted
        atomically, as the very first step of the handler: before the link lookup, before the body is
        read and before any validation, so every request counts whatever it would otherwise have answered
        (201, 400, 404, 409, 410, 422 or 500), and a refused request answers 429 even for an unknown slug
        and never writes a booking. Concurrent requests cannot exceed the limit. The count is per client
        across all links, not per link or per host, and is separate from the slot-listing budget of `getPublicBookingSlots`.
        A client is identified exactly as for `detectAuthProvider` (PAC-39): the socket peer address,
        or the `X-Real-IP` header only when the socket peer is inside `TRUSTED_PROXIES` (comma-separated
        IPs or CIDRs; empty or unset trusts nobody; an unparseable entry trusts less, never more). `X-Forwarded-For`
        is never read. A client is one exact IPv4 or IPv6 address, with no prefix grouping. Counts live
        in process memory: the limit is per backend process (20 per replica, as API-062''s residue), and
        a restart clears them. Clients whose window has ended are forgotten by a sweep that runs on a
        request, at most once per window, so memory stays bounded. CORS preflight (`OPTIONS`) is answered
        by the CORS middleware and is not counted. Not checked (API-094, open): the requested time is
        never checked against the hosts'' availability, the link''s days or hours, or any upper date bound.
        The only time checks are the minimum notice (422) and overlap with this link''s own non-cancelled
        bookings (409); any other start is accepted. The booking row is saved, then a calendar event (with
        the booker email as a guest) is attempted on each accepted host''s calendar, best effort: a host
        whose user record or calendar client cannot be loaded is skipped and a failed event creation is
        ignored, so a 201 does not mean any host''s calendar was written. Operation-level `security: []`
        is kept: this operation is public and is registered outside requireAuth; the rate limit is not
        authentication.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicBookingRequest'
      responses:
        '201':
          description: Booking confirmed and host calendar events written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBookingConfirmation'
        '400':
          description: 'Validation failure. Messages: "invalid request body"; "name, email, and start
            are required"; "invalid start time, use RFC3339"; "invalid end time, use RFC3339"; "duration
            does not match end time"; "invalid duration"; "end must be after start" (reachable only when
            the end computed from `duration_minutes` overflows, which needs a link duration option above
            about 153,722,867 minutes; an ordinary end at or before start answers "duration does not match
            end time" or "invalid duration" instead).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'No active link with that slug. Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: 'An overlapping non-cancelled booking already exists. Body: {"error":"slot is no
            longer available"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: 'Link exhausted. Body: {"error":"link is no longer accepting bookings"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          description: 'Start is inside the min_notice_minutes window. Body: {"error":"booking is too
            soon"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '429':
          $ref: '#/components/responses/BookingCreateRateLimited'
        '500':
          description: Storage or engine failure. `error` is one of "internal error" or "booking conflict
            check failed". The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/book/{slug}/slots:
    get:
      operationId: getPublicBookingSlots
      tags:
      - booking
      summary: Available slots for a date, or the list of dates that have any slot.
      description: 'Two distinct modes. With `date`: `slots` is populated and `available_dates` is always
        the empty array. Without `date`: the handler probes the next 60 calendar days from `time.Now()`
        and returns those day strings in `available_dates`, with `slots` always the empty array. Both
        keys are always present in both modes. Rate limited per client (NEW-booking-rate-limit), separately
        from and more loosely than `createPublicBooking`: at most 120 requests per client per fixed 1-minute
        window, with or without `date`. The limit is checked and the request counted atomically as the
        handler''s first step, before the link lookup and before the query is validated, so every request
        counts whatever it would otherwise have answered, and a refused request answers 429 even for an
        unknown slug. Booking requests do not consume this budget and slot requests do not consume the
        booking budget. Client identification, the per-process caveat, the sweep and the CORS preflight
        exemption are exactly as described on `createPublicBooking`; this limiter has its own counts and
        its own sweep.'
      security: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: query
        required: false
        description: Day to enumerate, parsed with Go layout "2006-01-02". Omit for the 60-day availability
          summary.
        schema:
          type: string
          format: date
          example: '2026-08-12'
      - name: duration
        in: query
        required: false
        description: Meeting length in minutes. Must be one of the link's `durations` (or exactly 30 when
          the link has none). Default is `durations[0]`, else 30.
        schema:
          type: integer
          minimum: 1
          example: 30
      responses:
        '200':
          description: Slot list or availability summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSlotsResponse'
        '400':
          description: '"invalid duration" (non-numeric or not in the link''s duration set) or "invalid
            date format, use YYYY-MM-DD".'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'No active link with that slug. Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: 'Link exhausted. Body: {"error":"link is no longer accepting bookings"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '429':
          $ref: '#/components/responses/BookingSlotsRateLimited'
        '500':
          description: 'Storage or engine failure. Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/calendar/events:
    get:
      operationId: listCalendarEvents
      tags:
      - calendar
      summary: List Google Calendar events in a time window
      description: Reads the authenticated user's primary Google calendar (calendar.CalendarClient.CalendarID,
        hardcoded to "primary" in backend/calendar/client.go) and flattens each event into the frontend-facing
        CalendarEvent shape. Room resource attendees (`*@resource.calendar.google.com`) are dropped from
        both `attendees` and `attendee_details`.
      parameters:
      - name: start
        in: query
        required: true
        description: Window start. Parsed with time.Parse(time.RFC3339, ...). Missing or unparseable ->
          400. There is no default, so it is effectively required.
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        required: true
        description: Window end. Parsed with time.Parse(time.RFC3339, ...). Missing or unparseable ->
          400.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Events in the window. Always a JSON array, `[]` when empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
        '400':
          description: '`invalid start param` or `invalid end param`. Emitted with http.Error, so the
            body is plain text, not JSON.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'Google Calendar API error, or the stored credential could not be read. Body: `{"error":"internal
            error"}`. The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/calendar/freebusy:
    get:
      operationId: getCalendarFreeBusy
      tags:
      - calendar
      summary: Raw Google free/busy lookup for a comma-separated attendee list
      description: 'Thin passthrough over calendar.CalendarClient.GetFreeBusy. The response is `map[string][]calendar.TimeSlot`.
        calendar.TimeSlot (backend/calendar/freebusy.go) carries explicit json tags since PAC-26 (API-029),
        so each window is `{"start","end"}`, the same window shape as POST /api/freebusy. Before PAC-26
        the struct had no tags and the keys were `Start` / `End`. The map wrapper is unchanged and is
        still NOT the POST /api/freebusy envelope. No frontend code calls this endpoint, but it is NOT
        dead: the MCP server''s `clockwise_find_free_slots` tool (mcp/tools.go) calls it and relays the
        body to the model as text without parsing it, so the key casing change reaches the MCP client
        unchanged and breaks no code. U-03 stays resolved as "keep" (assumed by the factory for PAC-21,
        pending owner confirmation); PAC-26 changes only the window key casing, not the envelope.'
      parameters:
      - name: start
        in: query
        required: true
        description: RFC3339. Missing or unparseable -> 400.
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        required: true
        description: RFC3339. Missing or unparseable -> 400.
        schema:
          type: string
          format: date-time
      - name: attendees
        in: query
        required: false
        description: Comma-separated email addresses, split on "," with no trimming and no validation.
          An empty or absent value produces an empty email list, which is forwarded to Google as a free/busy
          query with zero items.
        schema:
          type: string
        example: alice@example.com,bob@example.com
      responses:
        '200':
          description: Object keyed by the calendar id echoed back by Google (normally the email). Emails
            that Google does not return are simply absent from the map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawGoogleFreeBusyMap'
        '400':
          description: '`invalid start param` / `invalid end param` (plain text).'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'Google Calendar API error, or the stored credential could not be read. Body: `{"error":"internal
            error"}`. The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/conference/create:
    post:
      operationId: createConferenceLink
      tags:
      - conferencing
      summary: Create a standalone conference meeting with the configured provider.
      description: 'Provider comes from the CALLER''S stored settings (`ConferencingProvider`), not from
        the request; the Teams credential is the caller''s own (PAC-24; before it, both came from the
        single shared settings row).


        Since PAC-67 (finding API-052, resolved here under factory section 7.1) the body is validated
        before any credential is read or any provider is called: `title` must be present and contain at
        least one character that is not whitespace, `start` and `end` must be present RFC 3339 date-times,
        and `end` must be after `start`. Anything else is the 400 "invalid body". "Whitespace" is exactly
        the set ECMA-262 `\s` matches (WhiteSpace and LineTerminator), so the server''s test and the schema''s
        `pattern: ''\S''` on `CreateConferenceRequest.title` accept and refuse the same titles (contract
        challenge finding 1). Neither Go''s `strings.TrimSpace` (`unicode.IsSpace`: adds U+0085, lacks
        U+FEFF) nor Go''s `regexp` `\S` (ASCII only) is that set, so the server cannot use either as is.
        A `start` or `end` equal to `0001-01-01T00:00:00Z` cannot be told apart from an absent one and
        is refused as absent. Before PAC-67 a missing field decoded to the Go zero value and was forwarded
        to the provider (a blank title and the year 1).


        Since PAC-67 (spec AC-3 to AC-5, AC-7 to AC-12) the Teams and Zoom credentials are renewed when
        the stored access token has expired, using the caller''s own refresh token, and the renewed credential
        is stored for the caller only (a rotated refresh token replaces the stored one). A token that
        has not expired is used as is, with no renewal request. When the provider PERMANENTLY refuses
        the renewal (OAuth `invalid_grant` or equivalent) the request fails with the 400 "connection lost"
        sentence for that provider, the loss is recorded for the caller (the matching row of `listConferenceProviders`
        reports not connected, and the caller''s activity log gets ONE `connection_lost` entry per loss
        however many requests hit it, written best-effort: see CONNECTION ENTRIES on `listAuditEntries`),
        and the stored credential is kept (spec D-1). A TEMPORARY renewal failure (timeout, network, provider
        5xx) is the 500 below: it never says reconnect and records nothing (AC-10).


        A Teams or Zoom credential whose access token has expired and that holds NO refresh token cannot
        be renewed: no renewal request is sent and the request fails with the same 400 "connection lost"
        sentence for that provider. Nothing is recorded and no activity entry is written, because such
        a credential is never reported connected (see `ConferenceProviderStatus.connected`), so there
        is no loss to start. A Zoom credential whose expiry is not stored (one stored before PAC-67) is
        treated as expired, so it is renewed before it is used.


        API-091 (no frontend consumer) is resolved for this operation by keeping it: it is the standalone
        meeting-creation path spec PAC-67 AC-3, AC-5 and AC-8 test through, so those Go contract tests
        are its second opinion. Still not referenced anywhere in the frontend.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConferenceRequest'
      responses:
        '200':
          description: Meeting created. Note the camelCase keys, unlike every other schema in this domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConferenceMeetingDetails'
        '400':
          description: 'One of these fixed messages (PAC-21: no Go error text is appended). The dash in
            the three provider sentences is U+2014 EM DASH, exactly as the server writes it today; the
            new stored-credential sentence uses the same character on purpose, so the three read alike:
            "invalid body" (the body is not JSON, or, since PAC-67, fails the validation in the operation
            description: API-052); "teams: not connected — visit /api/auth/microsoft to authenticate"
            (also returned when reading the stored Microsoft token fails, not only when there is none:
            the server does not separate the two on this path; see the PAC-21 contract''s doesNotResolve);
            "zoom: not connected — visit /api/auth/zoom to authenticate"; "zoom: stored credential is
            invalid — reconnect at /api/auth/zoom" (the stored Zoom token does not decode; before PAC-21
            was finished this was "zoom: invalid token: " plus the JSON decoder''s error); NEW in PAC-67,
            "teams: connection lost — reconnect at /api/auth/microsoft" and "zoom: connection lost — reconnect
            at /api/auth/zoom" (the provider permanently refused the renewal of the caller''s credential,
            on this request or on an earlier one whose loss is still recorded; spec AC-8 "fails with an
            error telling A to reconnect"; also the answer when the access token has expired and no refresh
            token is stored, which records nothing).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Settings load or meeting creation failed, or (since PAC-67) renewing the Teams
            or Zoom credential failed TEMPORARILY (timeout, network, provider 5xx; spec AC-10): nothing
            is recorded and the credential is still reported connected. Body: `{"error":"internal error"}`,
            which never tells the caller to reconnect. The detail is written to the server log and Sentry
            only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/conference/providers:
    get:
      operationId: listConferenceProviders
      tags:
      - conferencing
      summary: Conferencing providers this server can offer, and their connection state.
      description: 'Order is fixed: google_meet (only when Google OAuth env is configured), zoom (only
        when Zoom env is configured), teams (only when Microsoft env is configured), then `custom`, which
        is always last and always `connected: true`. Connection state and the Meet email describe the
        CALLER''S own settings and credentials (PAC-24). Length is therefore 1..4.


        Since PAC-67 `connected` means USABLE, not merely stored (spec PAC-67 §3, AC-8, AC-12 to AC-14,
        AC-21, AC-23): a credential whose renewal the provider permanently refused is kept (spec D-1)
        but reported `connected: false` until the caller reconnects that provider; a temporary failure
        never changes it. The exact predicate of each row is on `ConferenceProviderStatus.connected`:
        a credential that can never be renewed (no refresh token) is not usable either and reads `connected:
        false`. This holds for every row whatever the caller''s calendar provider: the `teams` row reports
        a lost Outlook credential even when the calendar provider is Google, and the `google_meet` row
        a lost Google credential even when it is Outlook (AC-21). A loss recorded while the credential
        was used for someone else (team availability, a public booking page, a scheduled job) changes
        the OWNER''s rows only, never the requester''s (spec D-12).


        API-070 (resolved here under factory section 7.1, contract side): the variable length and the
        always-connected `custom` row were already documented above and are confirmed against `providers`
        in backend/api/handlers_conferencing.go; they are intended, not defects. What remains of the finding
        is a test that indexes the array by position and so passes only on a fully configured server;
        the PAC-67 backend stage looks rows up by `provider` instead (contracts/features/PAC-67.yaml resolvesFindings).'
      responses:
        '200':
          description: Provider statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConferenceProviderStatus'
                minItems: 1
                maxItems: 4
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Settings load failed. Body: `{"error":"internal error"}`. The detail is written
            to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/conference/zoom/disconnect:
    post:
      operationId: disconnectZoom
      tags:
      - conferencing
      summary: Disconnect the caller's Zoom credential and ask Zoom to revoke it.
      description: 'Takes no request body. Acts on the CALLER only; other users'' credentials, settings
        and activity logs are untouched. Before PAC-24 the tokens were server-wide.


        Since PAC-67 (spec AC-14 to AC-16, D-2, D-9), in this order: (1) LOCAL REMOVAL, one atomic change:
        the caller''s stored Zoom credential is read into memory and then removed whether or not it decodes,
        any recorded loss of it is cleared, and the caller''s conferencing provider becomes `meet` unconditionally
        (spec D-9, unchanged from before PAC-67). A failure up to and including this step is the 500 below,
        and then nothing has changed. (2) RENEWAL FOR REVOCATION, only when needed: when the removed access
        token is empty, has expired, or has no stored expiry (a credential stored before PAC-67), and
        a refresh token was stored, the server first renews it at Zoom''s token endpoint with the removed
        refresh token, as a meeting creation would. The renewed access and refresh tokens are held in
        memory for this request only and are NEVER stored: the credential stays removed. When that renewal
        fails, refused permanently or temporarily, or when it is needed and no refresh token was stored,
        nothing is sent to the revocation endpoint and the answer is `revocation: unconfirmed`. That is
        not a loss: nothing is recorded and no `connection_lost` entry is written (the credential no longer
        exists). A disconnect while a loss is recorded is this case, since the refresh token was already
        refused. (3) REVOCATION: the unexpired or just-renewed access token is sent to Zoom''s token revocation
        endpoint (`POST https://zoom.us/oauth/revoke`, client credentials in Basic auth, `token` = the
        access token). The answer is `revocation: confirmed` when Zoom answers success, and `revocation:
        unconfirmed` when Zoom refuses, answers an error, or cannot be reached. A stored credential that
        does not decode (non-blank `zoom_tokens` that is not valid JSON, the state behind the "zoom: stored
        credential is invalid" 400 of `createConferenceLink`) cannot be revoked at all: steps 2 and 3
        send nothing and the answer is `revocation: unconfirmed`. The local removal stands in every case
        (spec D-2). No `connection_lost` entry is ever written by a disconnect. (4) ACTIVITY ENTRIES for
        the caller, written after the outcome is known: `confirmed` writes one `provider_disconnected`
        entry (details `{"provider":"zoom","revocation":"confirmed"}`); `unconfirmed`, including the undecodable
        and failed-renewal cases, writes two, one `provider_disconnected` (details `{"provider":"zoom","revocation":"unconfirmed"}`)
        and one `revocation_unconfirmed` (details `{"provider":"zoom"}`) (spec AC-15, AC-16; round-5 challenge
        NB-2). These writes are BEST-EFFORT, like every kind in the activity log (`storage.WriteAuditLog`):
        a failed insert is written to the server log and does not change the response, because the credential
        is already removed and the 200 is the only truthful answer. Such a disconnect has fewer entries
        than listed, possibly none; the 200 body is then the only record the user gets of the outcome.
        A caller with no stored Zoom credential (blank `zoom_tokens`) gets 200 with `revocation: nothing_stored`:
        the conferencing provider still becomes `meet`, nothing is sent to Zoom and no activity entry
        is written.


        Before PAC-67 this answered 204 with no body and sent nothing to Zoom. The only consumer (smart-calendar-flow
        `zoomDisconnect`, typed `void`) resolves a 200 JSON body as it did the 204 and ignores it, so
        it keeps working; it owes the "revocation could not be confirmed" message (spec section 5).'
      responses:
        '200':
          description: The Zoom credential is gone locally (or there was none); `revocation` says what
            Zoom answered. Never a failure status because of revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDisconnectResult'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Reading the caller''s stored Zoom credential, or the local removal (step 1), failed.
            NOTHING was changed locally, nothing was sent to Zoom and no activity entry was written, so
            a retry is safe. Nothing that fails after step 1 is a 500: renewal and revocation failures
            are `revocation: unconfirmed`, and a failed activity-entry write is logged only. Body: `{"error":"internal
            error"}`. The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/events/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Google Calendar event id, taken verbatim from the URL. Not validated or decoded by
        the handler.
      schema:
        type: string
    patch:
      operationId: patchEvent
      tags:
      - calendar
      summary: Partially update a Google Calendar event
      description: 'Fetches the event, applies the non-null fields of the body, and writes it back with
        calendar.CalendarClient.UpdateEvent. An ABSENT key and an explicit `null` are indistinguishable
        and both mean "leave unchanged". The field-by-field semantics are on EventPatchRequest. In short,
        since PAC-29: `send_updates` is passed to Google (absent means `none`, which is what every PATCH
        did before PAC-29); a bare `YYYY-MM-DD` `start` / `end` keeps the event all-day (API-043); `attendees`
        replaces the non-room guests but keeps each existing guest''s Google entry (name, RSVP) and every
        room resource attendee (API-044); `room_resource_email` adds that room (API-018); `attendee_details`
        is declared, accepted and ignored (API-018). The 200 body is the event UpdateEvent returned, flattened
        by the same toCalendarEventDTO as GET /api/calendar/events: the CalendarEvent DTO (`title`, `start`,
        `end`, `attendees: string[]`, ...), never Google''s own keys (`summary`, `start.dateTime`, `htmlLink`,
        `hangoutLink`) (API-017, U-04). Like the list, the DTO drops room resource attendees (`*@resource.calendar.google.com`)
        from `attendees` and `attendee_details`, so a room on the event is not visible in this body even
        though PATCH keeps it. Only a Google 404 or 410 from the initial GetEvent, or a GetEvent answer
        whose `status` is `cancelled` (Google returns recently deleted events that way), is a 404; any
        other GetEvent failure is a 500 (API-045). Error precedence (PAC-29): checks that need only the
        request come first (`invalid body`, `invalid send_updates`, `invalid room_resource_email`: 400),
        then the stored credential (401 / 500), then GetEvent (404 / 500), then the start/end kind check
        against the stored event (400); Google is written only after all of them pass. PAC-29: until PAC-29''s
        implementation lands the server still encodes the raw google.golang.org/api/calendar/v3.Event,
        ignores `send_updates`, `room_resource_email` and `attendee_details`, decodes `start` / `end`
        as date-times only (a bare date is a 400 `invalid body`) and writes them as UTC `dateTime` (converting
        an all-day event to a timed one), replaces the whole attendee list with email-only entries (dropping
        names, RSVPs and the room), maps every GetEvent failure to 404, and writes to a cancelled event
        like any other. This operation describes the server after that PR, not before it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPatchRequest'
      responses:
        '200':
          description: The updated event as the CalendarEvent DTO, the same shape as one element of GET
            /api/calendar/events (PAC-29).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          description: 'Nothing is written to Google. One of these fixed bodies: `{"error":"invalid body"}`
            (the body is not valid JSON, or `start` / `end` is neither an RFC3339 date-time nor a `YYYY-MM-DD`
            date); `{"error":"invalid send_updates"}` (a value other than `all` / `none`); `{"error":"invalid
            room_resource_email"}` (non-empty and not a `*@resource.calendar.google.com` address); `{"error":"start
            and end must both be dates or both be date-times"}` (after applying the patch to the stored
            event, one of start / end is a bare date and the other a date-time, e.g. a date-time `start`
            alone on an all-day event). The last three are PAC-29.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '404':
          description: 'Body: `{"error":"event not found"}` (fixed text; the Google error is not appended,
            PAC-21). Since PAC-29 (API-045) only when GetEvent fails with a Google 404 or 410, or returns
            the event with `status: cancelled` (a deleted event; it is not written, so PATCH never restores
            it); any other GetEvent failure (transport, permission, quota) is a 500.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'The Google update call failed, GetEvent failed with anything other than a Google
            404 / 410 (PAC-29, API-045), or the stored credential could not be read. Body: `{"error":"internal
            error"}`. The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteEvent
      tags:
      - calendar
      summary: Delete a Google Calendar event
      description: 'Deletes the event from the user''s primary calendar. Since PAC-29 the `send_updates`
        query parameter is passed to Google''s delete call (API-042), and a Google 404 or 410 is a 404
        like PATCH (API-045). PAC-29: until PAC-29''s implementation lands the server reads no query parameter
        (so guests are never notified and an invalid `send_updates` is not rejected) and every delete
        failure, including a missing event, is a 500. This operation describes the server after that PR,
        not before it. Error precedence (PAC-29): an invalid `send_updates` is a 400 before the stored
        credential is read (401 / 500) and before any Google call.'
      parameters:
      - name: send_updates
        in: query
        required: false
        description: Whether Google emails the guests about the cancellation. Absent means `none`, which
          is what every DELETE did before PAC-29. Any other value is a 400 and nothing is deleted.
        schema:
          type: string
          enum:
          - all
          - none
          default: none
      responses:
        '204':
          description: Deleted. Empty body, no Content-Type header set.
        '400':
          description: '`{"error":"invalid send_updates"}`: the query parameter is present and is neither
            `all` nor `none`. Nothing is deleted (PAC-29).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '404':
          description: '`{"error":"event not found"}`: Google answered the delete with 404 or 410 (the
            event does not exist or is already deleted). PAC-29, API-045.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'The Google delete call failed with anything other than 404 / 410, or the stored
            credential could not be read. Body: `{"error":"internal error"}`. The detail is written to
            the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/events/{id}/conference:
    parameters:
    - name: id
      in: path
      required: true
      description: Provider calendar event id (an opaque Google Calendar event id string, not a UUID -
        it is never parsed).
      schema:
        type: string
    post:
      operationId: addEventConference
      tags:
      - conferencing
      summary: Attach a conference link to an existing calendar event.
      description: 'Uses the CALLER''S stored settings and credentials (PAC-24). Four branches. (1) The
        event already has a conference: returns 200 with the EXISTING link when the stored provider matches,
        or when `provider` is `custom`; otherwise 409. (2) `custom`: stores the supplied `url` in the
        event''s private extended properties. (3) `google_meet`: asks Google to mint a Meet link. (4)
        anything else (`zoom`, `teams`): creates a meeting through the provider factory and stores the
        join URL in extended properties.


        Since PAC-67 (spec AC-3, AC-8, AC-10, AC-12, AC-23, D-10) every credential this operation uses
        is renewed when expired and the renewal is stored for the caller. The event is read with the caller''s
        GOOGLE credential before the Teams or Zoom credential is touched. When Google permanently refuses
        that renewal the answer is the existing 404 "event not found" (unchanged, spec D-7, D-10), the
        Google loss is recorded for the caller (the `google_meet` row and, for a Google calendar provider,
        `getAuthStatus` report not connected; one `connection_lost` entry naming `google`), and the Teams
        or Zoom credential is neither read, renewed nor reported. When the Teams or Zoom renewal is permanently
        refused the answer is the 400 "connection lost" sentence for that provider and that loss is recorded
        likewise. A temporary renewal failure records nothing: Google''s gives the 404 as today, Teams''
        or Zoom''s gives the 502 "upstream provider error". A Teams or Zoom credential whose access token
        has expired and that holds no refresh token gets the same 400 "connection lost" sentence with
        no renewal request, and records nothing (as on `createConferenceLink`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEventConferenceRequest'
      responses:
        '200':
          description: Conference attached, or the pre-existing conference echoed back. `label` is the
            stored provider string on the echo branch, "Custom link" for custom, "Google Meet" for google_meet,
            and the uppercased provider name otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventConferenceLink'
        '400':
          description: 'One of these fixed messages (PAC-21: no Go error text is appended): The dash in
            the three provider sentences is U+2014 EM DASH, exactly as the server writes it. "invalid
            body"; "provider is required"; "url is required for custom conferences"; "event has no time"
            (the existing literal, kept: the event has no start or end, or, new in PAC-21, Google''s value
            does not parse; before PAC-21 was finished a parse failure returned Go''s time.Parse error
            text); ''unsupported conference provider "<provider>"'' (echoes the request''s own `provider`);
            "teams: not connected — visit /api/auth/microsoft to authenticate" (also returned when reading
            the stored Microsoft token fails); "zoom: not connected — visit /api/auth/zoom to authenticate";
            "zoom: stored credential is invalid — reconnect at /api/auth/zoom"; NEW in PAC-67, "teams:
            connection lost — reconnect at /api/auth/microsoft" and "zoom: connection lost — reconnect
            at /api/auth/zoom" (the provider permanently refused the renewal of the caller''s Teams or
            Zoom credential, or its access token has expired and no refresh token is stored; see the operation
            description).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '404':
          description: 'Body: `{"error":"event not found"}` (fixed text; the Google error is not appended,
            PAC-21). Any GetEvent failure maps to 404, including, since PAC-67, a permanently refused
            or temporarily failing renewal of the caller''s Google credential (spec D-10: unchanged on
            purpose; the loss is reported on Google''s status surfaces and in the activity log instead).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: 'Event already has a conference from a different provider. Body: {"error":"event
            already has a conference"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Google Meet creation, settings load, or the event update failed, or the stored
            credential could not be read. Body: `{"error":"internal error"}`. The detail is written to
            the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '502':
          description: Upstream provider problem. `error` is one of "Google Meet creation is still pending",
            "upstream provider error" (the provider's create-meeting call failed, or, since PAC-67, renewing
            the Teams or Zoom credential failed temporarily; spec AC-10) or "conference provider returned
            no join URL". The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    delete:
      operationId: removeEventConference
      tags:
      - conferencing
      summary: Remove any conference from a calendar event.
      description: 'Clears a Google Meet if present and strips the `paceday_conference_provider` / `paceday_conference_url`
        private extended properties. Idempotent: an event with no conference also returns 204 without
        writing anything.'
      responses:
        '204':
          description: Conference removed (or there was none). Empty body.
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '404':
          description: 'Body: `{"error":"event not found"}` (fixed text; the Google error is not appended,
            PAC-21). Any GetEvent failure maps to 404.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Removing the Google Meet or the conference properties failed, or the stored credential
            could not be read. Body: `{"error":"internal error"}`. The detail is written to the server
            log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/focus/blocks:
    get:
      operationId: listFocusBlocks
      tags:
      - focus
      summary: List persisted focus blocks for a week
      description: 'Returns the caller''s rows from the `focus_blocks` table (`user_id` = the authenticated
        user) where `date >= week AND date < week+7days`, ordered by start_time. Other users'' blocks
        are never listed. Keys are snake_case (`id`, `google_event_id`, `start_time`, `end_time`, `date`,
        `created_at`) from explicit json tags on `storage.FocusBlock` (PAC-26, API-014). Before PAC-26
        the struct had no tags and the encoder emitted the Go field names (`ID`, `GoogleEventID`, `StartTime`,
        ...), which the web app''s FocusBlock type could not read.

        '
      parameters:
      - name: week
        in: query
        required: false
        description: 'Week anchor date, format `YYYY-MM-DD` (Go layout "2006-01-02"). Omitted or empty
          -> `time.Now()`. The value is used verbatim as the lower bound; it is NOT snapped to Monday
          (unlike POST /api/schedule/compress, which does snap via startOfWeek()).

          '
        schema:
          type: string
          format: date
          example: '2025-01-06'
      responses:
        '200':
          description: 'Focus block rows. `[]` when the week has no rows (PAC-28).

            '
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FocusBlockRecord'
        '400':
          description: '`invalid week format` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '500':
          description: 'DB failure. Body: `{"error":"internal error"}`. The detail is written to the server
            log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    delete:
      operationId: clearFocusBlocks
      tags:
      - focus
      summary: Delete the focus blocks of a week
      description: 'Deletes the caller''s focus blocks for the Monday-anchored week containing `week`,
        from the caller''s calendar and from storage. Other users'' blocks are not touched and not counted.

        '
      parameters:
      - name: week
        in: query
        required: false
        description: 'Week anchor date, `YYYY-MM-DD`. Omitted -> `time.Now()`.

          '
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Number of deleted blocks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusClearResult'
        '400':
          description: '`invalid week format` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'Engine failure for a user who HAS a stored Google credential (a user with none
            gets the 401 `calendar not connected`). Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/focus/run:
    post:
      operationId: runFocus
      tags:
      - focus
      summary: Run the focus-time engine for a week
      description: 'Creates focus blocks for the target week. The body is optional: an absent or empty
        body (zero bytes or only whitespace) and the JSON literal `null` are treated as `{}`, i.e. the
        current week. Any other body that does not decode into FocusRunRequest is a 400 `invalid JSON`:
        a syntax error, a non-object top-level value (array, string, number, boolean), or a member of
        the wrong type such as `{"week":5}`. Before PAC-36 such a body was silently treated as `{}` and
        answered 200 for the current week (API-035). Only the first JSON value is read; bytes after it
        are not inspected, as on every sibling endpoint. A non-empty `week` that fails `time.Parse("2006-01-02",
        ...)` is a 400 `invalid week format, use YYYY-MM-DD`.

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusRunRequest'
      responses:
        '200':
          description: Focus run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusRunResult'
        '400':
          description: '`invalid JSON` (the body is present, is not `null`, and does not decode into FocusRunRequest;
            PAC-36, API-035) or `invalid week format, use YYYY-MM-DD`. Fixed messages, JSON error shape
            (writeError).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'Engine failure for a user who HAS a stored Google credential (a user with none
            gets the 401 `calendar not connected`). Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/freebusy:
    post:
      operationId: queryFreeBusy
      tags:
      - calendar
      summary: Participant free/busy with coverage classification
      description: Backed by engine.FreeBusyService. Emails on known consumer domains (gmail.com, googlemail.com,
        outlook.com, hotmail.com, yahoo.com, icloud.com, live.com, msn.com, proton.me, protonmail.com)
        are never queried and come back with coverage/status "unknown" and an empty busy list. Emails
        are lowercased and trimmed before lookup. Results are cached for 15 minutes per (userID, email,
        UTC date of start). External lookups run under a 5s timeout; a timeout or provider failure degrades
        to "unknown" rather than an error. The response carries the same data three times for backwards
        compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeBusyQueryRequest'
      responses:
        '200':
          description: Free/busy result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeBusyQueryResponse'
        '400':
          description: 'JSON error (writeError). One of: `invalid JSON` (fixed text: the decoder''s error
            is not appended, PAC-21), `emails is required` (empty or missing array), `max 20 emails per
            request`, `start_time must be RFC3339`, `end_time must be RFC3339`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`{"error":"unauthorized"}` as JSON via writeError when the user id is missing
            from the request context, or MiddlewareUnauthorized from the middleware (text/plain content
            type).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'engine.FreeBusyService.Query failed - in practice only a settings-read failure.
            Body: `{"error":"internal error"}`. The detail is written to the server log and Sentry only
            (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/habits:
    get:
      operationId: listHabits
      tags:
      - habits
      summary: List all habits for the authenticated user
      description: 'Returns every habit owned by the caller, active and inactive alike

        (`storage.ListHabitsByUser` has no `active` filter), ordered by

        `priority DESC, created_at ASC`. A nil slice is normalised to `[]`.

        '
      responses:
        '200':
          description: The user's habits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createHabit
      tags:
      - habits
      summary: Create a habit
      description: 'Server-side defaults are applied *before* validation:

        `days_of_week` -> [1,2,3,4,5] when the key is absent or JSON `null`;

        `window_start` -> "09:00" and `window_end` -> "17:00" when absent or blank after trimming;

        `priority` -> 50 when absent or explicitly `0`;

        `color` -> "#5B7FFF" when absent or empty.

        `title` is trimmed. On success a background `ReoptimizeAll` is started.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCreateRequest'
      responses:
        '201':
          description: The created habit, as persisted (id, user_id, active, created_at filled in by the
            DB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          description: 'Malformed JSON body ("invalid request body") or a validation failure. The

            exact `error` strings are enumerated in habits.notes.md and are stable

            because handlers_habits_validation_test.go pins them.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: 'Insert failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/habits/reoptimize:
    post:
      operationId: reoptimizeHabits
      tags:
      - habits
      summary: Kick off background re-scheduling of all active habits
      description: 'Spawns `HabitsEngine.ReoptimizeAll` on a detached context (14-day horizon) and

        returns immediately. The request body is never read. Errors from the background

        job are swallowed and are not observable through this endpoint.

        '
      responses:
        '200':
          description: Reoptimization started. Note the status is 200, not 202 (contrast POST /api/analytics/recompute).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitsReoptimizeAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/habits/templates:
    get:
      operationId: listHabitTemplates
      tags:
      - habits
      summary: List the 12 built-in habit starter templates
      description: 'Returns `engine.HabitTemplates` verbatim. Static, not user-scoped, never empty.

        The handler writes no explicit status code, so Go''s implicit 200 applies.

        '
