      summary: Invite an existing user as a co-host (owner only).
      description: The invitee must already have an account; the email is lowercased and trimmed. Upsert
        on (link_id, user_id), so re-inviting an accepted host resets them to `pending`. Response is the
        raw `storage.LinkHost` row, not the host DTO used inside SchedulingLink.
