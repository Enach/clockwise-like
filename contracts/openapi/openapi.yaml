          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        window_start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        window_end:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        priority:
          type: integer
          description: Unlike create, an explicit 0 is honoured.
          minimum: 0
          maximum: 100
        color:
          type: string
        active:
          type: boolean
          description: The only way to reactivate a habit that DELETE deactivated.
