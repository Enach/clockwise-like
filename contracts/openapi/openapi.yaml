    CalendarEvent:
      type: object
      description: api.calendarEventDTO, built by toCalendarEventDTO — the flattened event shape returned
        by GET /api/calendar/events (one per array element) and, since PAC-29, as the whole 200 body of
        PATCH /api/events/{id}, POST /api/schedule/create and POST /api/nlp/confirm. One converter, so
        the four operations cannot disagree about the same event.
      required:
      - id
      - title
      - start
      - end
      properties:
        id:
          type: string
          description: Google Calendar event id. Always present as a key; may be "".
        title:
          type: string
          description: Google `summary`. Always present as a key; may be "".
        start:
          type: string
          description: Either an RFC3339 date-time (timed event, Google `start.dateTime`, preserving the
            event's original UTC offset) OR a bare `YYYY-MM-DD` date (all-day event, Google `start.date`).
            Callers must handle both. Empty string when Google returned no start at all.
          examples:
          - '2026-05-01T10:00:00+02:00'
          - '2026-05-01'
        end:
          type: string
          description: Same dual format as `start`. For all-day events this is the exclusive end date.
          examples:
          - '2026-05-01T10:30:00+02:00'
          - '2026-05-02'
        color:
          type: string
          description: Hex colour mapped from Google's numeric `colorId` via a fixed 11-entry table. Omitted
            when the event has no colorId or an unrecognised one.
          enum:
          - '#7986CB'
          - '#33B679'
          - '#8E24AA'
          - '#E67C73'
          - '#F6BF26'
          - '#F4511E'
          - '#039BE5'
          - '#3F51B5'
          - '#0B8043'
          - '#D50000'
          - '#616161'
        attendees:
          type: array
          description: Attendee emails with room resources (`*@resource.calendar.google.com`) removed.
            Omitted entirely when the event has no non-resource attendees.
          items:
            type: string
            format: email
        attendee_details:
          type: array
          description: Parallel to `attendees`, same ordering and same filtering. Omitted when empty.
          items:
            $ref: '#/components/schemas/CalendarEventAttendee'
        is_personal_block:
          type: boolean
          description: Declared on the DTO with `omitempty` but NEVER SET by toCalendarEventDTO, so it
            is always omitted from every response that carries this schema (the events list and, since
            PAC-29, PATCH /api/events/{id}, POST /api/schedule/create and POST /api/nlp/confirm).
          x-uncertain: Dead field on this path. Either the personal-block tagging logic is missing, or
            the field should be dropped from the DTO.
        description:
          type: string
          description: Omitted when empty.
        location:
          type: string
          description: Omitted when empty.
        conference:
          $ref: '#/components/schemas/CalendarEventConference'
    CalendarEventAttendee:
      type: object
      description: api.attendeeDTO.
      required:
      - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          description: Google `displayName`. Omitted when empty.
        rsvp:
          type: string
          description: Mapped from Google `responseStatus`. Anything other than accepted/declined/tentative
            — including Google's `needsAction` and an empty value — collapses to `pending`. Because `pending`
            is a non-empty string it is always emitted despite the omitempty tag.
          enum:
          - accepted
          - declined
          - tentative
          - pending
        organizer:
          type: boolean
          description: Omitted when false.
    CalendarEventConference:
      type: object
      description: api.conferenceDTO. Populated from `hangoutLink` first; otherwise from the conferenceData
        entry point or the Paceday-private extended properties.
      required:
      - provider
      - url
      properties:
        provider:
          type: string
          description: '`google_meet` when derived from a Google hangout link or conference entry point,
            otherwise whatever string was stored in the event''s private extended properties by the conferencing
            handlers (e.g. `zoom`, `custom`). Not constrained by an enum in Go.'
        url:
          type: string
          format: uri
        label:
          type: string
          description: '"Google Meet" for hangout links, otherwise the provider string uppercased (e.g.
            "ZOOM", "CUSTOM"). Omitted when empty.'
    CalendarNotConnectedError:
      type: object
      description: The JSON error envelope for "this user has no calendar connected". The message is a
        single fixed value so a client can branch on it.
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: string
          enum:
          - calendar not connected
    CalendarRoom:
      type: object
      description: calendar.Room — only two fields exist server-side.
      required:
      - id
      - name
      additionalProperties: false
      properties:
        id:
          type: string
          description: The Google resource calendar id, which is also the room's bookable email address
            (contains `resource.calendar.google.com`).
        name:
          type: string
          description: The calendar list entry's `summary`.
    CompressionApplyProposal:
      type: object
      description: 'The anonymous struct in api.applyRequest. snake_case, and only these three fields
        are read - unknown members are ignored by encoding/json.

        '
      properties:
        event_id:
          type: string
        proposed_start:
          type: string
          format: date-time
          description: RFC3339. Unparseable -> the proposal lands in `failed`, no error.
        proposed_end:
          type: string
          format: date-time
      additionalProperties: true
    CompressionApplyRequest:
      type: object
      properties:
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/CompressionApplyProposal'
      additionalProperties: true
    CompressionApplyResult:
      type: object
      description: Literal map with keys `applied` and `failed`.
      properties:
        applied:
          type: array
          items:
            type: string
          description: Event ids the engine moved.
        failed:
          type: array
          items:
            type: string
          description: 'Mixed contents: handler-side entries read `"<event_id>: invalid time format"`,
            engine-side entries are appended verbatim by Compressor.Apply.

            '
      required:
      - applied
      - failed
      additionalProperties: false
    CompressionRequest:
      type: object
      description: 'Both fields optional; `week` takes precedence over `date` when non-empty. The whole
        body is optional too: absent, empty or `null` is treated as `{}`. Any other body that does not
        decode into this object is a 400 `invalid JSON` (PAC-36, API-035; the decode error was discarded
        before).

        '
      properties:
        date:
          type: string
          format: date
          description: '`YYYY-MM-DD`. Used only when `week` is empty. Default: today.'
        week:
          type: string
          format: date
          description: '`YYYY-MM-DD`. Snapped back to that week''s Monday by startOfWeek(), then Mon..Fri
            (5 days) are evaluated.

            '
      additionalProperties: true
    CompressionResult:
      type: object
      description: engine.CompressionResult. camelCase.
      properties:
        date:
          type: string
          description: '`YYYY-MM-DD` as produced by the engine.'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/MoveProposal'
        totalFocusGainMinutes:
          type: integer
      required:
      - date
      - proposals
      - totalFocusGainMinutes
      additionalProperties: false
    ConferenceMeetingDetails:
      type: object
      description: backend/conference/provider.go Details. camelCase json tags, unlike every other response
        in this domain.
      required:
      - provider
      - joinUrl
      additionalProperties: false
      properties:
        provider:
          type: string
          enum:
          - meet
          - zoom
          - teams
          description: 'A literal set by the concrete provider (U-12, resolved by PAC-67 from backend/conference:
            `MeetProvider.CreateMeeting` writes "meet", `ZoomProvider.CreateMeeting` "zoom", `TeamsProvider.CreateMeeting`
            "teams"; `grep -n ''Provider:'' backend/conference/*.go` shows the three). Note "meet", not
            "google_meet": this is not the `ConferenceProviderStatus.provider` vocabulary.'
        joinUrl:
          type: string
          description: 'Always present (no omitempty). The join URL for zoom and teams. For meet it is
            the EMPTY STRING: `MeetProvider` creates nothing (a Meet link is minted by Google Calendar
            on event creation), so the standalone create with a `meet` conferencing provider answers `{"provider":"meet","joinUrl":""}`.
            Because of that the earlier `format: uri` was not true of every response and is removed (U-12,
            factory section 7.2).'
        meetingId:
          type: string
          description: Omitted when empty (always omitted for meet).
        password:
          type: string
          description: Omitted when empty.
    ConferenceProviderStatus:
      type: object
      description: backend/api/handlers_conferencing.go conferenceProviderStatus.
      required:
      - provider
      - connected
      additionalProperties: false
      properties:
        provider:
          type: string
          enum:
          - google_meet
          - zoom
          - teams
          - custom
        connected:
          type: boolean
          description: 'Always present. `custom` is hardcoded to true. Since PAC-67 the other rows mean
            USABLE (see `listConferenceProviders`), with these predicates over the caller''s own credentials:
            `google_meet`, a Google token row is stored AND no loss of it is recorded; `zoom`, a stored
            Zoom credential decodes AND holds a refresh token AND no loss of it is recorded; `teams`,
            a stored Microsoft credential decodes AND holds a refresh token AND no loss of it is recorded,
            the same predicate as `getAuthStatus` for an Outlook calendar provider. Before PAC-67 `zoom`
            was true for any non-blank stored value (including one that does not decode) and `teams` for
            any stored Microsoft credential, with or without a refresh token, which could report a credential
            that can never be renewed as connected (contract challenge finding 5).'
        email:
          type: string
          description: Set only for google_meet (the configured calendar email); omitted when empty.
        enabled:
          type: boolean
          description: 'json `enabled,omitempty` on a bool, so `false` is OMITTED entirely - the key only
            ever appears as `true`, and only for teams. Absence must be read as false. Since PAC-67 it
            follows teams'' `connected` exactly (same predicate): a lost, disconnected or never-renewable
            (no refresh token) Microsoft credential omits it, so no field of the row reports Teams usable
            (spec PAC-67 section 4 preamble).'
        auto_with:
          type: string
          enum:
          - google
          - outlook
          description: '"google" for google_meet, "outlook" for teams. Omitted for zoom and custom.'
    CreateConferenceRequest:
      type: object
      description: POST /api/conference/create. Since PAC-67 (API-052) all three fields are required and
        validated before any provider is called; a body that fails is the 400 "invalid body". Before PAC-67
        every field silently defaulted to the Go zero value when absent and was forwarded to the provider.
      required:
      - title
      - start
      - end
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          pattern: \S
          description: Must contain at least one character that is not whitespace in the ECMA-262 `\s`
            sense. `pattern` states exactly the test the server applies (see `createConferenceLink`),
            so a blank title such as "   " cannot be expressed by a client that validates against this
            schema.
        start:
          type: string
          format: date-time
          description: '`0001-01-01T00:00:00Z` (Go''s zero time) is refused with the 400 "invalid body",
            like an absent `start`: the server cannot tell the two apart.'
        end:
          type: string
          format: date-time
          description: Must be strictly after `start`.
    CreatePublicBookingRequest:
      type: object
      description: Anonymous request body of POST /api/book/{slug}. `name`, `email` and `start` are required
        by the handler; `end`, `duration` and `duration_minutes` are three overlapping ways to express
        the length.
      required:
      - name
      - email
      - start
      additionalProperties: false
      properties:
        name:
          type: string
          description: Trimmed; must be non-empty after trimming.
          minLength: 1
        email:
          type: string
          description: Trimmed; must be non-empty after trimming. Never validated as an email address.
          minLength: 1
        start:
          type: string
          format: date-time
          description: RFC3339. Must be at least `min_notice_minutes` in the future, else 422.
        end:
          type: string
          format: date-time
          description: 'RFC3339, optional. When present it wins: the resulting length must equal `duration`/`duration_minutes`
            if either was also sent, else 400. When absent, end = start + resolved duration.'
        notes:
          type: string
          description: Free text; no length limit enforced.
        duration:
          type: integer
          nullable: true
          description: Minutes. Takes precedence over `duration_minutes` when both are sent. This is the
            field the frontend actually populates.
        duration_minutes:
          type: integer
          nullable: true
          description: Minutes. Overridden by `duration` when both are present. When neither is sent and
            `end` is absent, the length falls back to durations[0] (else 30). The resolved value must
            be in the link's duration set, else 400.
    CreateSchedulingLinkRequest:
      type: object
      description: backend/api/handlers_scheduling_links.go schedulingLinkInput. Several fields have two
        accepted spellings; the canonical one wins when both are sent. Nothing is required at the JSON
        level, but validation rejects an empty title.
      additionalProperties: false
      properties:
        title:
          type: string
          description: Trimmed. Required in effect - an empty title is a 422.
        slug:
          type: string
          description: Normalised to lowercase alphanumerics and dashes. When it normalises to the empty
            string a slug is generated from the owner's name plus the first duration.
        duration_options:
          type: array
          description: Canonical spelling. Wins over `durations`. Defaults to [30] when both are absent
            (a present-but-empty array is a 422).
          items:
            type: integer
            minimum: 1
        durations:
          type: array
          description: Alias for duration_options, used only when duration_options is absent.
          items:
            type: integer
            minimum: 1
        days_of_week:
          type: array
          description: Canonical spelling, 0=Sunday..6=Saturday. Wins over `days`. Defaults to [1,2,3,4,5]
            when both are absent.
          items:
            type: integer
            minimum: 0
            maximum: 6
        days:
          type: array
          description: Alias for days_of_week, used only when days_of_week is absent. Accepts "mon"/"monday"/"1"
            etc, case-insensitive; unrecognised entries are silently dropped, which can turn a non-empty
            list into a 422 "at least one day".
          items:
            type: string
        window_start_time:
          type: string
          description: Canonical spelling. "HH:MM" or "HH:MM:SS". Defaults to "09:00".
          example: 09:00
        window_start:
          type: string
          description: Alias, used only when window_start_time is empty.
        window_end_time:
          type: string
          description: Canonical spelling. "HH:MM" or "HH:MM:SS". Defaults to "17:00".
          example: '17:00'
        window_end:
          type: string
          description: Alias, used only when window_end_time is empty.
        buffer_before:
          type: integer
          minimum: 0
          default: 0
        buffer_after:
          type: integer
          minimum: 0
          default: 0
        min_notice_minutes:
          type: integer
          minimum: 0
          default: 0
        usage_type:
          type: string
          enum:
          - reusable
          - recurring
          - single_use
          default: reusable
          description: Lowercased and trimmed before validation; an empty string becomes `reusable`.
        max_uses:
          type: integer
          nullable: true
          minimum: 1
          description: Required and must be positive when usage_type is `recurring`. Ignored (forced to
            null) otherwise.
        co_host_emails:
          type: array
          description: Emails are lowercased and trimmed, then resolved to existing accounts and added
            as `pending` hosts. Addresses with no account are skipped silently - the response gives no
            indication that an invite was dropped.
          items:
            type: string
            format: email
    CurrentUserResponse:
      type: object
      description: storage.User (backend/storage/users.go) serialized directly.
      required:
      - id
      - email
      - name
      - avatarUrl
      - provider
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          description: 'The user''s picture URL. In the current-user read (`getCurrentUser`)

            this is the only name for it; clients read it as `avatarUrl`, not

            `avatar` (PAC-35, API-065: the web app read it as `avatar`, or not at

            all). Scheduling-link and booking hosts carry the same stored value

            as `avatar_url` (`SchedulingLinkHost`, `PublicHost`), unchanged by

            PAC-35. May be the empty string. Every sign-in overwrites it: Google

            writes the Google picture, Microsoft and SSO always write "" (so a

            Microsoft or SSO sign-in clears a picture an earlier Google sign-in

            stored). Not omitempty, so the key is always present.

            '
        provider:
          type: string
          enum:
          - google
          - microsoft
          - sso
          description: 'The provider of the user''s FIRST sign-in: set when the row is

            inserted and never updated (UpsertUser''s ON CONFLICT does not touch

            `provider`), so a user who first signed in with Google and later

            with Microsoft still reads "google".

            Closed by PAC-35 (U-13): `users.provider` has no CHECK constraint

            (migration 006, `TEXT NOT NULL DEFAULT ''google''`), but its only

            writer is storage.UpsertUser, and every call site in the history

            of the repository passes one of these three literals

            (handlers_auth.go "google", handlers_microsoft_auth.go "microsoft",

            handlers_sso.go "sso"; tests and the e2e seed write "google").

            A CHECK constraint is not added (spec PAC-35 section 7: no

            migration).

            '
        org:
          description: 'Present only when the user has an org_id AND the org row loads

            (json tag "org,omitempty"). org_id itself is `json:"-"` and never

            serialized.

            '
          $ref: '#/components/schemas/OrgSummary'
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    DailyRecapPatch:
      type: object
      description: 'api.recapSettingsBody. A property absent means "leave unchanged"; a property present
        is applied.

        PAC-24 makes two changes to what this document permits, both to align it with PATCH /api/settings.
        `null` is no longer accepted anywhere: the Go fields are pointers, so `null` used to be indistinguishable
        from an omission, which meant a client that meant to clear something and a client with a serialisation
        bug got the same silent success. And an unknown property is now rejected rather than ignored,
        which is how a caller learns it has misspelt one of these seven snake_case names.

        '
      properties:
        enabled:
          type: boolean
        send_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: '`HH:MM`. PAC-24 validates it; before that an unparseable value reached the Postgres
            TIME cast during the save and surfaced as a 500 `db error`.

            '
        send_to:
          type: string
          enum:
          - dm
          - channel
          description: Anything else -> 400 (text/plain).
        channel_id:
          type: string
        include_briefs:
          type: boolean
        include_focus_blocks:
          type: boolean
        include_habits:
          type: boolean
      additionalProperties: false
    DailyRecapPreview:
      type: object
      description: 'Literal `{"blocks": [...]}`.'
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/SlackBlock'
      required:
      - blocks
      additionalProperties: false
    DailyRecapSettings:
      type: object
      description: 'Hand-built map in dailyRecapHandlers.getSettings. snake_case, and the key names do
        not mirror the camelCase Settings keys one-to-one.

        '
      properties:
        enabled:
          type: boolean
          description: settings.recapEnabled
        send_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: 'settings.recapSendTime, `HH:MM`. PAC-24 pins the rendered form; it was `HH:MM:SS`
            here too (U-19).

            '
        send_to:
          type: string
          enum:
          - dm
          - channel
          description: settings.recapSendTo
        channel_id:
          type: string
          description: settings.recapChannelId
        include_briefs:
          type: boolean
          description: settings.recapIncludeBriefs
        include_focus_blocks:
          type: boolean
          description: settings.recapIncludeFocus (name differs)
        include_habits:
          type: boolean
          description: settings.recapIncludeHabits
      required:
      - enabled
      - send_time
      - send_to
      - channel_id
      - include_briefs
      - include_focus_blocks
      - include_habits
      additionalProperties: false
    DailyRecapTestResult:
      type: object
      description: 'Literal `{"ok": true, "slack_message_ts": "..."}`.'
      properties:
        ok:
          type: boolean
          description: Always literal `true` on the 200 path.
        slack_message_ts:
          type: string
          description: Slack message timestamp returned by chat.postMessage.
      required:
      - ok
      - slack_message_ts
      additionalProperties: false
    DaySchedule:
      type: object
      description: storage.DaySchedule. No omitempty - all three always serialise.
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          description: '`HH:MM`, validated with a shape check AND `time.Parse("15:04")`, so `25:00` is
            rejected. Empty string allowed when `enabled` is false. PAC-24 corrected the pattern: the
            previous `^[0-9]{2}:[0-9]{2}$` both admitted `99:99` (which the server rejects) and forbade
            the empty string (which the server accepts and which GET returns for a disabled day) - it
            was wrong in both directions.

            '
        end:
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
      required:
      - enabled
      - start
      - end
      additionalProperties: false
    ErrorResponse:
      type: object
      description: 'The shared JSON error envelope, written by writeError()

        (backend/api/handlers_settings.go:206). Content-Type: application/json.

        `error` is a server-chosen message, never the text of a Go, driver or

        provider error; every 5xx in this document uses this envelope (PAC-21).

        '
      required:
      - error
      properties:
        error:
          type: string
      additionalProperties: false
    EventConferenceLink:
      type: object
      description: backend/api/handlers_conferencing.go conferenceLinkResponse.
      required:
      - provider
      - url
      additionalProperties: false
      properties:
        provider:
          type: string
          description: The requested provider, EXCEPT on the already-has-a-conference echo branch, where
            it is the provider already stored on the event (which can differ from the requested one when
            `custom` was requested).
        url:
          type: string
          format: uri
        label:
          type: string
          description: Omitted when empty. "Custom link" for custom, "Google Meet" for google_meet, the
            uppercased provider name (e.g. "ZOOM", "TEAMS") for factory providers, and the bare stored
            provider string on the echo branch.
    EventPatchRequest:
      type: object
      description: Body of PATCH /api/events/{id}. Every field is optional; null or absent leaves the
        corresponding part of the event unchanged. Since PAC-29 the schema declares every key the web
        client sends (`send_updates`, `room_resource_email`, `attendee_details`, API-018). The server's
        decoder still ignores undeclared keys; the contract forbids them so a generated client cannot
        send a key that would be a silent no-op.
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
          description: Maps to Google `summary`. Null or absent leaves it unchanged.
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        start:
          type: string
          nullable: true
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2}))?$
          description: 'Either an RFC3339 date-time, written as Google `start.dateTime` in UTC (the event
            becomes or stays timed), or a bare `YYYY-MM-DD` date, written as Google `start.date` (the
            event becomes or stays all-day). The same dual format as CalendarEvent.start, so a client
            can write back what it read. PAC-29, API-043: before PAC-29 only a date-time was accepted
            and an all-day event was always converted to a timed one. After applying the patch, start
            and end must be of the same kind or the request is a 400.'
          examples:
          - '2026-05-01T10:00:00Z'
          - '2026-05-01'
        end:
          type: string
          nullable: true
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2}))?$
          description: Same handling as `start`. For a bare date this is Google's exclusive end date,
            as in CalendarEvent.end.
          examples:
          - '2026-05-01T10:30:00Z'
          - '2026-05-02'
        attendees:
          type: array
          nullable: true
          description: 'Replaces the event''s NON-ROOM attendees with this list (emails compared case-insensitively,
            duplicates collapsed). An email already on the event keeps its existing Google attendee entry
            (display name, RSVP, organizer, optional); a new email is added as an email-only entry. Room
            resource attendees already on the event (`resource: true` or `*@resource.calendar.google.com`)
            are always kept, so writing back the list GET /api/calendar/events returned (which omits rooms)
            does not drop the room. `[]` removes every non-room attendee. The two room rules differ on
            purpose: the DTO hides only the `*@resource.calendar.google.com` suffix, so a `resource: true`
            attendee without that suffix is shown as an ordinary guest, yet PATCH still keeps it if the
            client leaves it out. The difference can only keep an attendee, never drop one. PAC-29, API-044:
            before PAC-29 this replaced the whole list with email-only entries, dropping names, RSVPs
            and the room.'
          items:
            type: string
            format: email
        send_updates:
          type: string
          nullable: true
          enum:
          - all
          - none
          description: 'Passed to Google''s update call as `sendUpdates`: `all` emails the guests about
            the change, `none` does not. Null or absent means `none`, which is what every PATCH did before
            PAC-29. Any other value is a 400 and nothing is written. PAC-29, API-018.'
        room_resource_email:
          type: string
          nullable: true
          pattern: ^$|^[^@\s]+@resource\.calendar\.google\.com$
          description: 'A Google room resource calendar address (as returned by GET /api/rooms). When
            non-empty and not already an attendee, the room is added as a resource attendee. Rooms already
            on the event are kept: this endpoint never removes a room (PAC-29 decision D-6). Null, absent
            or `""` leaves the rooms unchanged. A non-empty value that is not a `*@resource.calendar.google.com`
            address is a 400. PAC-29, API-018.'
        attendee_details:
          type: array
          nullable: true
          description: Accepted and ignored by the server. Declared because the web client sends it alongside
            `attendees` on every edit (API-018). Who attends comes from `attendees`; existing attendees
            keep their names and RSVPs from Google (see `attendees`); a client never sets another person's
            RSVP. PAC-29 decision D-7.
          items:
            type: object
            additionalProperties: true
    FocusBlockRecord:
      type: object
      description: 'storage.FocusBlock (backend/storage/models.go), with explicit snake_case json tags
        (PAC-26, API-014). The keys match the `focus_blocks` columns and the web app''s FocusBlock type.
        Before PAC-26 the struct had no tags and the keys were `ID`, `GoogleEventID`, `StartTime`, `EndTime`,
        `Date`, `CreatedAt`.

        '
      properties:
        id:
          type: integer
          format: int64
        google_event_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
      required:
