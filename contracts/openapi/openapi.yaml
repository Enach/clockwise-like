    MiddlewareUnauthorized:
      type: string
      description: 'A JSON literal delivered with a text/plain Content-Type, because the handler sets
        application/json and http.Error then overwrites the header. Every producer of this exact body
        in backend/api/ is an `http.Error` with the literal `{"error":"unauthorized"}`: the three in `requireAuth`
        (backend/api/middleware.go — one per rejection reason: no token, a token that fails `auth.ValidateToken`,
        a `UserID` claim that is not a UUID; cited by function because this description is emitted into
        generated files in both repos), `orgHandlers.members` (backend/api/handlers_org.go:21), and `meHandlers.me`
        (backend/api/handlers_me.go:19, reached at `GET /api/auth/me`). The falsifying command, excluding
        the generated package, is `grep -rn error.:.unauthorized --include=*.go backend/api/`, which returns
        exactly those five lines. The third is listed for completeness only: `getCurrentUser` declares
        its 401 against `PlainTextError`, not this schema, and lives in paths/auth.yaml, which PAC-23
        does not own and does not touch.


        Precisely, because PAC-23 AC-12 requires this response to be unchanged: as net/http''s `http.Error`
        produces it the header is `text/plain; charset=utf-8`, `X-Content-Type-Options: nosniff` is set,
        and the message is written with `Fprintln`, so the body is 25 bytes — the example below, trailing
        newline included. The two headers are stated here because the sibling `PlainTextError` states
        them and "exactly as today" includes them.


        The trailing newline is part of the VALUE a generated handler must supply. oapi-codegen''s per-operation
        `…401TextResponse` types set `Content-Type: text/plain` with no charset, do not set `nosniff`,
        and write the value verbatim without appending anything (see `ListAuditEntries401TextResponse`
        in backend/api/gen/paceday.gen.go; cited by symbol because this description is emitted into that
        file). A handler adopting the generated interface must therefore include the `\n` in the string
        and set both headers itself, or its 401 is not byte-identical to the middleware''s.'
      example: '{"error":"unauthorized"}

        '
