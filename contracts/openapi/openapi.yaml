          description: May be the empty string if the owner record has no name.
        owner_email:
          type: string
          format: email
        invited_at:
          type: string
          format: date-time
          description: UTC, Go layout "2006-01-02T15:04:05.000Z07:00".
    SchedulingLinkHostRecord:
      type: object
      description: Raw backend/storage/scheduling_links.go LinkHost row, returned by POST /api/scheduling-links/{id}/hosts.
        Not the same shape as the `hosts[]` entries inside SchedulingLink.
      required:
      - id
      - link_id
      - user_id
      - status
      - invited_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Host-row id. Note that accept/decline key on link_id, so this id is never used
            as a path parameter.
        link_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - accepted
          - declined
        invited_at:
          type: string
          format: date-time
          description: Raw time.Time marshalling (RFC3339 with nanoseconds and the DB offset), not the
            DTO millisecond format.
        responded_at:
          type: string
          format: date-time
          description: Omitted while null (json `responded_at,omitempty`). Set by accept/decline.
    SchedulingLinkInviteResponse:
      type: object
      description: Echo of the status that was written. The only body accept/decline ever returns.
      required:
      - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - accepted
          - declined
    SchedulingLinkListResponse:
      type: object
      description: GET /api/scheduling-links. Both arrays are always present, never null.
      required:
      - owned
      - shared
      additionalProperties: false
      properties:
        owned:
          type: array
          items:
            $ref: '#/components/schemas/SchedulingLink'
        shared:
          type: array
          description: Links where the caller is an accepted co-host but not the owner.
          items:
            $ref: '#/components/schemas/SchedulingLink'
    Settings:
      description: 'The settings document for ONE user, returned by GET and by PATCH. Every property is
        always present except `llmApiKey`, which is `writeOnly` and therefore never present (spec AC-11);
        `llmApiKeySet` takes its place in the required list.

        '
      allOf:
      - $ref: '#/components/schemas/SettingsFields'
      required:
      - workStart
      - workEnd
      - timezone
      - focusMinBlockMinutes
      - focusMaxBlockMinutes
      - focusDailyTargetMinutes
      - outOfHoursMeetingsPerWeek
      - autoDeclineOutsideWorkingHours
      - focusLabel
      - focusColor
      - lunchStart
      - lunchEnd
      - protectLunch
      - bufferBeforeMinutes
      - bufferAfterMinutes
      - bufferEnabled
      - bufferMinMeetingMinutes
      - bufferSkipBackToBack
      - workingHours
      - lunchBreaks
      - compressionEnabled
      - autoScheduleEnabled
      - autoScheduleCron
      - llmProvider
      - llmModel
      - llmApiKeySet
      - llmBaseUrl
      - awsRegion
      - awsProfile
      - bedrockModel
      - azureEndpoint
      - azureDeployment
      - azureApiVersion
      - gcpProject
      - gcpLocation
      - vertexModel
      - ollamaBaseUrl
      - ollamaModel
      - calendarProvider
      - webcalUrl
      - calendarEmail
      - conferencingProvider
      - recapEnabled
      - recapSendTime
      - recapSendTo
      - recapChannelId
      - recapIncludeBriefs
      - recapIncludeFocus
      - recapIncludeHabits
      - updatedAt
    SettingsFields:
      type: object
      description: 'The property set shared by the GET response (`Settings`) and the PATCH / PATCH body
        (`SettingsUpdate`). Property names come straight from the json tags on storage.Settings - camelCase
        throughout. `ID`, `MicrosoftTokens` and `ZoomTokens` are `json:"-"` and never appear on the wire.

        Two properties are asymmetric and are marked as such rather than being split into two schemas,
        so that a document read from GET can be submitted back unchanged (which is what the shipped frontend
        does): `llmApiKey` is `writeOnly` - accepted on write, never returned; and `llmApiKeySet` and
        `updatedAt` are `readOnly` - returned, accepted and ignored on write. Everything else is symmetric.

        No property other than `llmApiKey` carries omitempty, so the GET response always contains all
        of them.

        '
      properties:
        workStart:
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          description: '`HH:MM`, OR THE EMPTY STRING. DB default `09:00`. PAC-24 tightened the shape from
            `^[0-9]{2}:[0-9]{2}$`, which admitted `99:99` (the server''s own check was the same loose
            regexp, so `99:99` was stored), and at the same time widened it to admit `""`, which the server
            both accepts and returns.

            `""` is not a modelling slip, it is the state the data is in. `validateSettings` skips the
            format check exactly when the value is empty (`backend/api/handlers_settings.go:75`, `if val
            != "" && !timePattern.MatchString(val)`), and every row zeroed by API-004 - the defect this
            feature exists to repair - already holds `""` in this column, because the pre-PAC-24 full
            replace persisted each omitted property as its Go zero value. A strict `HH:MM` pattern would
            make day-one GETs fail the contract they were generated from, and the generated zod schema
            would reject the body before any UI saw it. It is also what makes spec AC-7 satisfiable: `{"workStart":
            ""}` is the documented way to clear this setting, and under the merge rule a present property
            is stored exactly as given.

            Consumers already treat `""` as meaningful rather than as damage: `WorkWindow` falls back
            to `09:00`/`18:00` when the effective start or end is empty (`backend/storage/settings.go:124-127`).
            The same widening, for the same reason, was already applied to `DaySchedule.start`/`end`.
            Contrast `recapSendTime`, which is NOT widened - see its own description.

            '
        workEnd:
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          description: '`HH:MM` or `""`, as `workStart`. DB default `18:00`. PAC-24 adds the cross-property
            check that workEnd > workStart, which OpenAPI cannot express; it is a 400 (`workEnd must be
            after workStart`). That check applies only when BOTH values are non-empty, which is the existing
            handler behaviour and keeps `""` a clear rather than a 400. Before PAC-24 an inverted working
            day was accepted and produced a zero-length day at use (API-082).

            '
        timezone:
          type: string
          description: 'IANA name, e.g. `Europe/Paris`. DB default `UTC`. PAC-24 validates it with time.LoadLocation
            and returns 400 `timezone is not a known IANA location`. Before PAC-24 any string was accepted
            and every engine silently fell back to UTC, so a typo moved a user''s whole schedule with
            no error anywhere (API-082).

            '
        focusMinBlockMinutes:
          type: integer
          minimum: 0
          description: Rejected when < 0. DB default 25.
        focusMaxBlockMinutes:
          type: integer
          minimum: 0
          description: 'Rejected when < 0. DB default 120. PAC-24 adds the cross-property check focusMinBlockMinutes
            <= focusMaxBlockMinutes, which OpenAPI cannot express; it is a 400 (API-082).

            '
        focusDailyTargetMinutes:
          type: integer
          minimum: 0
          description: Rejected when < 0. DB default 240.
        outOfHoursMeetingsPerWeek:
          type: integer
          minimum: 0
          description: 'Weekly allowance of meetings outside working hours. 0 disables out-of-hours scheduling
            entirely (canScheduleOutOfHours returns false when <= 0).

            '
        autoDeclineOutsideWorkingHours:
          type: boolean
        focusLabel:
          type: string
          description: DB default `Focus Time`.
        focusColor:
          type: string
          description: Hex colour string. Not validated. DB default `#4F46E5`.
        lunchStart:
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          description: '`HH:MM` or `""`. DB default `12:00`. Legacy global; overridden per-day by lunchBreaks.
            `""` here is the strongest case of the four: it is not merely tolerated but LOAD-BEARING.
            `LunchWindow` returns `enabled: false` precisely when `lunchStart` or `lunchEnd` is empty
            (`backend/storage/settings.go:141-142`), so `""` is how "this user has no protected lunch"
            is represented. Forbidding it in the schema would make an existing, meaningful state unrepresentable.

            '
        lunchEnd:
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          description: '`HH:MM` or `""`, as `lunchStart`. DB default `13:00`. PAC-24 adds the cross-property
            check lunchEnd > lunchStart as a 400 (API-082), applied only when both values are non-empty.

            '
        protectLunch:
          type: boolean
          description: DB default true.
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          description: Rejected when < 0. DB default 5.
        bufferAfterMinutes:
          type: integer
          minimum: 0
          description: Rejected when < 0. DB default 5.
        bufferEnabled:
          type: boolean
        bufferMinMeetingMinutes:
          type: integer
          minimum: 0
          description: 'PAC-24 adds the `>= 0` check its two siblings already had; before that a negative
            value was accepted here alone (API-082).

            '
        bufferSkipBackToBack:
          type: boolean
        workingHours:
          $ref: '#/components/schemas/WorkingHoursSchedule'
        lunchBreaks:
          $ref: '#/components/schemas/LunchBreakSchedule'
        compressionEnabled:
          type: boolean
        autoScheduleEnabled:
          type: boolean
        autoScheduleCron:
          type: string
          description: '5-field cron (minute hour dom month dow), parsed with robfig/cron v3 using exactly
            those five fields. Empty string skips validation. DB default `0 8 * * *`.

            '
        llmProvider:
          type: string
          enum:
          - ''
          - openai
          - anthropic
          - ollama
          - bedrock
          - azure_openai
          - vertex
          description: Empty string is explicitly allowed by validLLMProviders.
        llmModel:
          type: string
          description: 'Provider default applied at call time when empty: `gpt-4o-mini` (openai), `claude-haiku-4-5-20251001`
            (anthropic).

            '
        llmApiKey:
          type: string
          writeOnly: true
          description: 'WRITE-ONLY. Accepted on write; never present in any response from any operation
            (spec AC-11). Required for openai and anthropic.

            Under the merge semantics this needs no special case: omit it and the stored key is unchanged;
            send `""` and it is cleared; send a value and it is replaced (spec AC-13). There is no way
            to read it back, by design - someone who loses their key re-enters it. Do not add a reveal
            affordance later.

            Before PAC-24 it was returned in cleartext from a row shared by every authenticated account
            (API-002 + API-003), and wiped by any write that omitted it (API-004). Every key configured
            before this ships must be treated as compromised and rotated - closing the read path does
            not un-expose it (spec §5, OQ-5).

            '
        llmApiKeySet:
          type: boolean
          readOnly: true
          description: '`true` exactly when the stored key is non-empty. This is the only thing a reader
            learns about the key, and it is what lets a client distinguish "not configured" from "configured"
            without disclosing anything (spec AC-12).

            `readOnly`, so a client that submits back a document it just read may include it; it is accepted
            and ignored (spec AC-10). It is NOT the way to clear a key - send `llmApiKey: ""` for that.

            '
        llmBaseUrl:
          type: string
          description: Also the legacy fallback for the ollama base URL.
        awsRegion:
          type: string
        awsProfile:
          type: string
        bedrockModel:
          type: string
        azureEndpoint:
          type: string
        azureDeployment:
          type: string
        azureApiVersion:
          type: string
        gcpProject:
          type: string
        gcpLocation:
          type: string
        vertexModel:
          type: string
        ollamaBaseUrl:
          type: string
          description: Falls back to llmBaseUrl, then `http://localhost:11434`.
        ollamaModel:
          type: string
          description: Falls back to llmModel, then `llama3.2`.
        calendarProvider:
          type: string
          enum:
          - google
          - outlook
          - webcal
          description: 'DB default `google`. Which calendar the product reads and writes for THIS user.

            Resolves U-18. The authoritative set was settled by reading the three consumers that switch
            on this value - calendar.NewProvider (`backend/calendar/client_factory.go:16,22,27`), the
            auth-status handler (`backend/api/handlers_auth.go:97,105,111`) and the free/busy service
            (`backend/engine/freebusy_service.go:122`). All three accept exactly `outlook` and `webcal`
            and treat every other value, including a typo, as Google. PAC-24 enforces the set; before
            it, an unknown value was stored and silently behaved as `google`.

            Before PAC-24 this was a property of the singleton row, so one user connecting Outlook switched
            the whole deployment (`backend/auth/microsoft_oauth.go:57` writes `calendar_provider = ''outlook''
            WHERE id = 1`).

            '
        webcalUrl:
          type: string
        calendarEmail:
          type: string
          description: 'The address of THIS user''s connected calendar. Before PAC-24 the auth-status
            handler served the singleton row''s value to everyone (API-009).

            '
        conferencingProvider:
          type: string
          enum:
          - meet
          - zoom
          - teams
          description: 'Read with `COALESCE(conferencing_provider,''meet'')`; conference.NewProvider switches
            on `zoom`, `teams`, and treats everything else as `meet`. So the wire values are `meet` /
            `zoom` / `teams`, not the frontend''s `google_meet` / `zoom` / `teams` / `custom`. PAC-24
            enforces the set for the same reason as calendarProvider: an unknown value was stored and
            silently behaved as `meet`.

            '
        recapEnabled:
          type: boolean
        recapSendTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: '`HH:MM`, in the same form on read and on write. **STRICT: unlike the four legacy
            clock properties above, `""` is NOT admitted here, in either direction.** The three reasons
            are specific to this column and do not generalise:

            (a) There is no empty state to represent. The column is `TIME NOT NULL DEFAULT ''08:00''`
            (`015_daily_recap.up.sql:3`), and the write path passes every value through `recapSendTimeOrDefault`
            (`backend/storage/settings.go:356-361`), which turns `""` into `08:00`. So no row can hold
            an empty send time and no GET can return one - the `COALESCE(...,'''')` at `:224` and `:439`
            is defensive and unreachable. This is the difference from `workStart`/`lunchStart`, where
            `""` both exists in the data and carries meaning.

            (b) Admitting `""` would make this contract lie about its own merge rule. `PATCH /api/settings`
            states that a property present is set to exactly the value given; `""` here would instead
            be silently rewritten to `08:00`. A client asking to clear a value and being told `200` while
            the server stored something it did not ask for is the exact silent-success failure mode this
            contract refuses for `null`.

            (c) PAC-24 therefore removes the substitution: `""` is a 400 (`recapSendTime must be in HH:MM
            format`), which is the same message spec AC-17 already requires for a malformed value and
            which AC-16 requires instead of an internal failure.

            **This requires a narrow amendment to spec AC-7**, which as written says an empty value of
            a setting''s type always clears it. AC-7 must exempt `recapSendTime` on the ground that it
            has no empty state. The contract author may not edit the spec; the amendment is named in `contracts/features/PAC-24.md`
            §"Revision 2" and must be made before stage 3.

            Resolves U-19, and resolves it by CHANGING the server rather than by documenting what it did.
            The column is Postgres `TIME` (`015_daily_recap.up.sql:3`) and was read as `recap_send_time::TEXT`,
            which renders `HH:MM:SS` (`08:00:00`, with a fractional part when one was stored) - contradicting
            the struct comment that claims `HH:MM` and contradicting the write format, so no client could
            round-trip this value. PAC-24 renders the column to `HH:MM` on read and rejects anything else
            on write. Note: the marker was originally to be settled by observing a live response; it is
            settled here by fixing the asymmetry instead, which makes the observation unnecessary. Spec
            AC-16 is the integration test that proves the rendered form.

            '
        recapSendTo:
          type: string
          enum:
          - dm
          - channel
          description: 'DB CHECK constraint enforces this. PAC-24 validates it on the settings write too;
            before that only the daily-recap PATCH did, so a bad value sent to PUT /api/settings reached
            the DB CHECK and surfaced as a 500 (API-081).

            '
        recapChannelId:
          type: string
        recapIncludeBriefs:
          type: boolean
          description: DB default true.
        recapIncludeFocus:
          type: boolean
          description: 'DB default true. Exposed as `include_focus_blocks` by the daily-recap endpoints.

            '
        recapIncludeHabits:
          type: boolean
          description: DB default true.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: 'Server-managed (NOW() on every write). May be present in a request body - a client
            submitting back a document it just read will include it - and is ignored (spec AC-10).

            '
      additionalProperties: false
    SettingsUpdate:
      description: 'PATCH /api/settings body - the only settings write. Nothing is required: a property
        absent means "leave it as it is", and `{}` is a valid no-op request. A property present is applied
        exactly as given - `""`, `0` and `false` are values, not absences.

        No property is nullable, so `null` anywhere in this body is a 400 rather than a silent no-op (spec
        AC-8). `additionalProperties: false` is inherited from SettingsFields, so an unknown property
        - including a snake_case spelling of a real one - is rejected rather than ignored; that is what
        makes API-013 detectable instead of silent.

        `workingHours` and `lunchBreaks` are replaced whole when present, not deep-merged (spec AC-9).
        `llmApiKeySet` and `updatedAt` are `readOnly` and are accepted and ignored.

        Before PAC-24 this was the body of `PUT /api/settings`, a replace: every omitted property was
        persisted as its Go zero value (API-004). That operation is removed, not deprecated - its only
        consumer (`smart-calendar-flow/src/api/client.ts:813`) sends snake_case names that `additionalProperties:
        false` refuses on either method, so a deprecated alias would have shielded nothing.

        '
      allOf:
      - $ref: '#/components/schemas/SettingsFields'
    SlackBlock:
      type: object
      description: 'engine.slackBlock is `map[string]interface{}` - an untyped Slack Block Kit object.
        Nested values are themselves slackBlocks or arrays of them.

        Resolves U-20 by reading engine/daily_recap.go end to end. Every top-level block this API can
        emit is built by DailyRecapService.BuildMessage (`:150-236`), buildSummaryBlock (`:238-262`) or
        buildMeetingBlocks, and the complete set of top-level `type` values is `header`, `context`, `section`,
        `divider`. The only nested text object types are `plain_text` and `mrkdwn`.

        `additionalProperties` stays `true`: the member set of a block varies by type (`text`, `elements`,
        `emoji`), the Go type is a bare map, and pinning the members would be a stricter claim than the
        code supports. The `type` enum is the part that was actually determinable, and it is the part
        a client switches on. PAC-24 changes none of this behaviour - only what the contract says about
        it.

        '
      properties:
        type:
          type: string
          enum:
          - header
          - context
          - section
          - divider
      additionalProperties: true
    SlackMessage:
      type: object
      description: storage.SlackMessage — one Slack search hit backing a brief.
      required:
      - channel_name
      - author_name
      - text
      - timestamp
      - permalink
      additionalProperties: false
      properties:
        channel_name:
          type: string
        author_name:
          type: string
        text:
          type: string
          description: Excerpt, truncated server-side to roughly 200 characters.
        timestamp:
          type: string
          description: Slack's `ts` value (a string, e.g. "1712345678.123456") — NOT an RFC3339 date-time.
        permalink:
          type: string
    SsoDetectRequest:
      type: object
      description: Anonymous struct in ssoHandlers.detect.
      required:
      - email
      properties:
        email:
          type: string
          description: Rejected with 400 when empty; not otherwise validated server-side.
      additionalProperties: true
    SsoDetectResponse:
      type: object
      description: auth.DetectResult (backend/auth/sso_detect.go).
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - google
          - microsoft
          - sso
          - generic
          description: '"generic" for consumer/unparseable domains, "sso" when a provider row

            exists for the domain, "microsoft" from a live tenant probe against

            login.microsoftonline.com (2s timeout, 1h cache), else "google".

            '
        provider_name:
          type: string
          description: Display name of the SSO provider. Omitted unless type == "sso".
        redirect_url:
          type: string
          description: 'Relative path `/api/auth/sso/<domain>`. Omitted unless type == "sso".

            '
      additionalProperties: false
    SsoProviderCreateRequest:
      type: object
      description: Anonymous struct in ssoHandlers.createSSOProvider.
      required:
      - domain
      - provider_name
      - provider_type
      properties:
        domain:
          type: string
          description: Must match the caller's org domain or the request is 403'd.
        provider_name:
          type: string
        provider_type:
          type: string
          enum:
          - oidc
          - saml
          description: '"saml" is accepted and stored, but /api/auth/sso/{domain} rejects it

            with 501 — a SAML row can be created that can never be used to log in.

            '
        oidc_issuer:
          type: string
        oidc_client_id:
          type: string
        oidc_client_secret:
          type: string
        saml_entry_point:
          type: string
        saml_issuer:
          type: string
        saml_cert:
          type: string
      additionalProperties: false
      x-uncertain: No field beyond the three required ones is validated, so an oidc provider can be created
        with an empty issuer/client_id; the failure only surfaces later as a 500 from /api/auth/sso/{domain}.
    SsoProviderResponse:
      type: object
      description: 'storage.SSOProvider (backend/storage/sso_providers.go) marshalled directly.

        The struct has NO json tags, so encoding/json emits the exact Go field

        names below — PascalCase, and including the client secret and SAML cert.

        '
      required:
      - ID
      - Domain
      - ProviderName
      - ProviderType
      - Enabled
      - OIDCIssuer
      - OIDCClientID
      - OIDCClientSecret
      - SAMLEntryPoint
      - SAMLIssuer
      - SAMLCert
      - CreatedAt
      - UpdatedAt
      properties:
        ID:
          type: string
          format: uuid
        Domain:
          type: string
        ProviderName:
          type: string
        ProviderType:
          type: string
          enum:
          - oidc
          - saml
        Enabled:
          type: boolean
        OIDCIssuer:
          type: string
        OIDCClientID:
          type: string
        OIDCClientSecret:
          type: string
          description: Returned in plaintext to any org member by both POST and GET /api/admin/sso. Documented
            because it is what the code does, not because it is intended.
        SAMLEntryPoint:
          type: string
        SAMLIssuer:
          type: string
        SAMLCert:
          type: string
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
      additionalProperties: false
      x-uncertain: No frontend code consumes /api/admin/sso, so the PascalCase key casing is unverified
        against any real consumer; it is inferred from the absence of json tags on storage.SSOProvider.
    SuggestedSlot:
      type: object
      description: engine.SuggestedSlot.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        score:
          type: integer
          description: 'Integer score from scoreCandidate + adjustScoreForPreferences. No documented range
            or normalisation.

            '
        reasons:
          type: array
          nullable: true
          items:
            type: string
      required:
      - start
      - end
      - score
      - reasons
      additionalProperties: false
    Team:
      type: object
      description: storage.Team. Note the camelCase json tags — unlike the manager domain's snake_case.
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
          description: Omitted entirely when the team has no organization (omitempty on a *uuid.UUID).
        name:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - createdBy
      - createdAt
      additionalProperties: false
    TeamAnalytics:
      type: object
      description: engine.TeamAnalytics.
      properties:
        avg_meeting_minutes:
          type: integer
          description: Integer division by member count (or by 1 for an empty team).
        avg_focus_minutes:
          type: integer
        member_breakdown:
          type:
          - array
          - 'null'
          description: 'JSON null (not []) when the team has no members — the slice is appended to without
            pre-initialisation and has no omitempty.

            '
          items:
            $ref: '#/components/schemas/MemberAnalyticsSummary'
      required:
      - avg_meeting_minutes
      - avg_focus_minutes
      - member_breakdown
      additionalProperties: false
    TeamDetail:
      type: object
      properties:
        team:
          $ref: '#/components/schemas/Team'
        members:
          type:
          - array
          - 'null'
          description: JSON null (not []) when the team has no members or the query failed.
          items:
            $ref: '#/components/schemas/TeamMember'
      required:
      - team
      - members
      additionalProperties: false
    TeamInvite:
      type: object
      description: storage.TeamInvite, returned in full (token included) by inviteTeamMember.
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        inviteeEmail:
          type: string
          format: email
        invitedBy:
          type: string
          format: uuid
        token:
          type: string
          description: A freshly generated UUID string used as the invite link path segment.
        status:
          type: string
          enum:
          - pending
          - accepted
          - declined
          - expired
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: createdAt + 7 days (computed in Go, not by the database).
      required:
      - id
      - teamId
      - inviteeEmail
      - invitedBy
      - token
      - status
      - createdAt
      - expiresAt
      additionalProperties: false
    TeamInvitePreview:
      type: object
      description: 'A deliberately narrow projection — NOT a TeamInvite. Built as a map[string]string,
        so every value is a plain string and a missing team or inviter yields "" rather than null.

        '
      properties:
        teamName:
          type: string
          description: Empty string when the team row could not be read.
        inviterName:
          type: string
          description: 'The inviter''s DISPLAY NAME, not their email. Empty string when the user row could
            not be read.

            '
        email:
          type: string
          format: email
          description: The invitee email the invite was issued to.
      required:
      - teamName
      - inviterName
      - email
      additionalProperties: false
    TeamMember:
      type: object
      description: storage.TeamMember, as returned inside TeamDetail.
      properties:
        teamId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - member
        joinedAt:
          type: string
          format: date-time
        name:
          type: string
          description: 'Joined from users.name via COALESCE(...,''''), and tagged omitempty — so a user
            with no name causes the key to be OMITTED, not sent as "".

            '
        email:
          type: string
          format: email
          description: Joined from users.email, also omitempty.
      required:
      - teamId
      - userId
      - role
      - joinedAt
      additionalProperties: false
    TeamNameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed before storage. No maximum length is enforced by the backend.
      required:
      - name
      additionalProperties: true
    TeamSlot:
      type: object
      description: engine.TeamSlot.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        quality_score:
          type: integer
          minimum: 0
          maximum: 100
          description: 100 - (members_with_disrupted_focus / total_members) * 100, integer division.
      required:
      - start
      - end
      - quality_score
      additionalProperties: false
    TeamSlotList:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/TeamSlot'
      required:
      - slots
      additionalProperties: false
    UpdateSchedulingLinkRequest:
      type: object
      description: backend/api/handlers_scheduling_links.go schedulingLinkPatch. Scalars are Go pointers,
        so an absent key leaves the stored value alone; slices are plain slices, so an absent key and
        an explicit `null` are indistinguishable and both mean "leave unchanged", while `[]` means "clear"
        (and then usually fails 422).
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
          description: Normalised. If it normalises to empty the request is a 422 "slug cannot be empty".
        duration_options:
          type: array
          items:
            type: integer
        durations:
          type: array
          description: Applied AFTER duration_options, so when both are sent `durations` wins - the opposite
            precedence from create.
          items:
            type: integer
        days_of_week:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        days:
          type: array
          description: Applied after days_of_week, so `days` wins when both are sent - again the opposite
            of create.
          items:
            type: string
        window_start_time:
          type: string
          nullable: true
        window_start:
          type: string
          nullable: true
          description: Alias, applied only when window_start_time is absent.
        window_end_time:
          type: string
          nullable: true
        window_end:
          type: string
          nullable: true
          description: Alias, applied only when window_end_time is absent.
        buffer_before:
          type: integer
          nullable: true
          minimum: 0
        buffer_after:
          type: integer
          nullable: true
          minimum: 0
        min_notice_minutes:
          type: integer
          nullable: true
          minimum: 0
        usage_type:
          type: string
          nullable: true
          enum:
          - reusable
          - recurring
          - single_use
        max_uses:
          type: integer
          nullable: true
          description: An explicit null is indistinguishable from an absent key (both leave the stored
            value), so max_uses cannot be cleared by PATCH except by switching usage_type away from `recurring`.
        active:
          type: boolean
          nullable: true
          description: Setting false is the same soft-deactivation that DELETE performs.
        co_host_emails:
          type: array
          description: 'Destructive when present: every non-owner host row is deleted first, then these
            emails are added as `pending`. Unknown emails are skipped silently.'
          items:
            type: string
            format: email
    UserProfileGoStruct:
      type: object
      description: 'storage.UserProfile marshalled with no json tags — Go field names verbatim. Do not
        rename these keys in the spec; they are literally what the server sends.

        '
      properties:
        UserID:
          type: string
          format: uuid
        IsManager:
          type: boolean
        DetectedAt:
          type:
          - string
          - 'null'
          format: date-time
        AnalyticsSharedWithManager:
          type: boolean
          description: Member-side consent flag, defaulting to true. No endpoint in this domain sets it.
        UpdatedAt:
          type: string
          format: date-time
          description: The value read BEFORE the upsert, not the newly written now().
      required:
      - UserID
      - IsManager
      - DetectedAt
      - AnalyticsSharedWithManager
      - UpdatedAt
      additionalProperties: false
    WorkingHoursSchedule:
      type: object
      description: 'storage.WorkingHoursSchedule. Replaced WHOLE by a PATCH that mentions it; there is
        no deep merge (spec AC-9).

        **Normalised on read** by `Settings.normalizeSchedules` (`backend/storage/settings.go:92-106`),
        which `loadScheduleFields` calls on every read path (`:495`): an empty `mode` becomes `{mode:
        all_days, default: {enabled: true, start: workStart or 09:00, end: workEnd or 18:00}, days: {}}`;
        an `all_days` document whose `default` is entirely empty (`enabled:false, start:"", end:""`) has
        that default replaced the same way (`:95-99`); and a nil `days` map becomes `{}`.

        **So `{"mode":"all_days","default":{"enabled":false,"start":"","end":""}, "days":{}}` is NOT a
        document GET can return** - the `:95-99` branch rewrites it before it reaches the wire. That matters
        because it is the one document the shipped consumer cannot render: `normalizeInterval` rejects
        an empty `start`/`end` and returns `undefined` (`smart-calendar-flow/src/api/client.ts:477-488`),
        `normalizeWorkingHours` then returns `undefined` because `default` is undefined and `days` is
        empty (`:505-517`), and `normalizeSettings` reaches `delete out.working_hours` (`:543`) - the
        per-day section disappears with no error and no empty state, which is the silent blank spec AC-20
        exists to end.

        The `by_day` arm of the same shape IS reachable, because `:95-99` guards on `mode == "all_days"`:
        `{"mode":"by_day", …, "days":{}}` normalises to itself and produces the identical `undefined`
        in the consumer. PAC-24 closes it at the point of entry rather than describing it - a `by_day`
        document must carry at least one weekday (400: `workingHours.days must contain at least one weekday
        when mode is by_day`). `by_day` with no days also means "this user never works", which no consumer
        intends and which `WorkWindow` already renders as `enabled:false` for every day (`:117-121`).

        '
      properties:
        mode:
          type: string
          enum:
          - ''
          - all_days
          - by_day
          description: 'Compared case-insensitively after trimming during validation (`backend/api/handlers_settings.go:128`),
            but the persisted value is whatever was sent.

            `''''` is in the enum because the server accepts it (`:129`, `mode != "" && mode != "all_days"
            && mode != "by_day"`) and because the contract must describe what is, not what should be (factory
            §7). Revision 1 of this contract omitted `''''` while the description two lines below said
            it was accepted - a schema disagreeing with its own prose. It is accepted on write ONLY when
            `days` is empty; otherwise it is the existing 400 `workingHours.mode is required when day-specific
            hours are provided` (`:132-134`). That conditional is cross-property and OpenAPI cannot express
            it, so it stays a documented 400 rather than becoming a schema narrowing - narrowing here
            would be a NEW rejection, and spec §6 requires both tests in `backend/api/handlers_settings_schedule_test.go`
            to keep passing unchanged.

            A GET never returns `''''`, because normalisation rewrites it.

            '
        default:
          $ref: '#/components/schemas/DaySchedule'
          description: 'Only validated when `mode == "all_days"` and at least one of enabled/start/end
            is set. Ignored by WorkWindow() in by_day mode.

            '
        days:
          type: object
          description: 'Keys are lowercase English weekday names, and PAC-24 makes that a schema constraint
            rather than a warning. `validateSchedulePreferences` lowercases before checking (`backend/api/handlers_settings.go:145`,
            `validScheduleWeekdays[strings.ToLower(day)]`), so `"Monday"` passes validation and is stored
            - but `WorkWindow` looks the day up as `strings.ToLower(day.Weekday().String())` (`backend/storage/settings.go:117`),
            so the entry can never match and the user''s Monday hours are silently inert forever. Under
            the whole-object replace this is worse than it was: the write that installs the dead key also
            deletes the live key it replaced. `propertyNames` makes the dead key a 400 instead of a document
            that says so. In `by_day` mode a missing weekday means "not working".

            '
          propertyNames:
            enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          additionalProperties:
            $ref: '#/components/schemas/DaySchedule'
      required:
      - mode
      - default
      - days
      additionalProperties: false
  responses:
    BookingUnauthorized:
      description: 'Emitted by the requireAuth middleware when the `auth_token` cookie and the `Authorization:
        Bearer` header are both absent or invalid. The body is the JSON text `{"error":"unauthorized"}`
        but the response is sent with `http.Error`, so the Content-Type header is `text/plain; charset=utf-8`,
        not application/json.'
      content:
        text/plain:
          schema:
            type: string
            const: '{"error":"unauthorized"}

              '
    Forbidden:
      description: The habit exists but belongs to another user. Body is `{"error":"forbidden"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Body is `{"error":"internal error"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JsonError:
      description: JSON error envelope from writeError.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JsonForbidden:
      description: 'JSON error "forbidden". Emitted when the caller is not a member of `team_id`, when
        the route requires ownership and the caller''s role is not "owner", AND when the team simply does
        not exist — the membership lookup error is not distinguished from a role mismatch.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JsonUnauthorized:
      description: 'JSON error "unauthorized" from the handler''s own uuid.Nil check. In production this
        is shadowed by the requireAuth middleware, which emits its own `{"error":"unauthorized"}` via
        http.Error with a Content-Type of application/json.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No habit with that id. Body is `{"error":"not found"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PlainTextServerError:
      description: 'text/plain; charset=utf-8. Written by http.Error, NOT by writeError, so there is no
        JSON envelope. Typical bodies: "db error", or a raw wrapped storage/engine error string on the
        /api/teams routes.

        '
      content:
        text/plain:
          schema:
            type: string
    SchedulingLinkValidationError:
      description: 'Validation failure from validateSchedulingLink / parseClock. Messages: "title is required";
        "at least one duration is required"; "durations must be positive integers"; "at least one day
        is required"; "days_of_week must contain values between 0 and 6"; "window times must use HH:MM";
        "window_start must be before window_end"; "buffers must be zero or positive"; "min_notice_minutes
        must be zero or positive"; "usage_type must be reusable, recurring, or single_use"; "max_uses
        must be set to a positive integer for recurring links"; "slug cannot be empty" (PATCH only).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingError'
    SettingsValidationError:
      description: 'Malformed JSON, or a value the server refuses. JSON error shape (writeError). A body
        property set to `null` is refused here: no property of SettingsUpdate is nullable (spec AC-8).

        Messages that already exist: `invalid JSON: <err>`; `<field> must be in HH:MM format` (workStart/workEnd/lunchStart/lunchEnd);
        `focusMinBlockMinutes must be positive`; `focusMaxBlockMinutes must be positive`; `focusDailyTargetMinutes
        must be positive`; `outOfHoursMeetingsPerWeek must be zero or positive`; `bufferBeforeMinutes
        must be positive`; `bufferAfterMinutes must be positive`; `autoScheduleCron must be a 5-part cron
        expression`; `autoScheduleCron is invalid: <err>`; `llmProvider must be one of: openai, anthropic,
        ollama, bedrock, azure_openai, vertex`; `workingHours.mode must be all_days or by_day`; `workingHours.mode
        is required when day-specific hours are provided`; `workingHours.days.<day> is not a valid weekday`;
        `lunchBreaks.<day> is not a valid weekday`; `<field> requires start and end when enabled`; `<field>
        start and end must be in HH:MM format`; `<field> end must be after start`.

        Messages PAC-24 adds, closing API-081 and API-082 - each of these is a value the server accepted
        before and then failed on, silently or as a 500 (spec AC-17): `workEnd must be after workStart`;
        `lunchEnd must be after lunchStart`; `focusMinBlockMinutes must not exceed focusMaxBlockMinutes`;
        `bufferMinMeetingMinutes must be zero or positive`; `timezone is not a known IANA location`; `recapSendTo
        must be dm or channel` (previously reached the DB CHECK and surfaced as a 500 - API-081); `recapSendTime
        must be in HH:MM format` (previously reached the Postgres TIME cast and surfaced as a 500); `calendarProvider
        must be one of: google, outlook, webcal` (resolves U-18); `conferencingProvider must be one of:
        meet, zoom, teams`.

        Messages revision 2 of this contract adds, each with its reason: `recapSendTime must be in HH:MM
        format` now also covers `""`. The write path previously substituted `08:00` for an empty value
        (`recapSendTimeOrDefault`, `backend/storage/settings.go:356-361`); under the merge rule a present
        property must be stored exactly as given, so a silent substitution is a contract violation and
        the empty value is refused instead. See `SettingsFields.recapSendTime`; this is the one clock
        property for which `""` is NOT a value, and it needs a narrow amendment to spec AC-7. `workingHours.days
        must contain at least one weekday when mode is by_day` - a `by_day` document with an empty `days`
        map is the only remaining stored state that makes the consumer delete the working-hours section
        with no error (`smart-calendar-flow/src/api/client.ts:505-517,543`); the `all_days` equivalent
        is already normalised away on read (`backend/storage/settings.go:95-99`). Serves spec AC-20.

        Two messages in the list above become UNREACHABLE via the HTTP boundary and remain only as defence
        in depth, because `propertyNames` now rejects the request at schema validation: `workingHours.days.<day>
        is not a valid weekday` and `lunchBreaks.<day> is not a valid weekday`. The handler checks stay
        - they are what `handlers_settings_schedule_test.go:41-49` asserts, and spec §6 requires that
        test to keep passing unchanged.

        `""` is NOT in this catalogue for `workStart`, `workEnd`, `lunchStart` or `lunchEnd`. It is a
        valid value for all four, on read and on write (spec AC-7); the handler already skips the format
        check for it (`backend/api/handlers_settings.go:75`).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulingErrorResponse'
    Unauthorized:
      description: 'No `auth_token` cookie and no `Authorization: Bearer <jwt>` header, or the token

        failed validation, or its `sub` is not a UUID. Emitted by `requireAuth`.

        QUIRK: the body is the JSON text `{"error":"unauthorized"}` but it is written with

        `http.Error`, which overwrites the Content-Type to `text/plain; charset=utf-8`.

        Clients must not rely on the declared media type here.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      description: 'The provider calendar event id (`calendar_event_id` in meeting_briefs), used as an

        opaque string — no UUID or format validation is performed. Because it is a single

        chi path segment it cannot contain an unencoded `/`.

        '
      schema:
        type: string
        minLength: 1
    HabitId:
      name: id
      in: path
      required: true
      description: Habit id. Parsed with `uuid.Parse`, which also accepts the unhyphenated, braced and
        `urn:uuid:` spellings.
      schema:
        type: string
        format: uuid
    InviteTokenPath:
      name: token
      in: path
      required: true
      description: 'Opaque invite token — a UUID string generated by CreateTeamInvite. Not validated as
        a UUID by the handler; any string is looked up verbatim.

        '
      schema:
        type: string
    MemberEmailPath:
      name: email
      in: path
      required: true
      description: 'The roster member''s email address, percent-encoded in the path (the `@` MUST be sent
        as %40 — chi splits on `/` only, but the frontend and the Go tests both use encodeURIComponent/%40
        form). The handler applies url.PathUnescape to the raw chi param and falls back to the raw value
        if unescaping fails. Storage lowercases and trims before matching, so lookup is case-insensitive
        even though this path segment is not normalized by the handler itself.

        '
      schema:
        type: string
        format: email
      examples:
        encoded:
          value: member%40example.com
    OptionalTeamIdQuery:
      name: team_id
      in: query
      required: false
      description: 'Formal team UUID. Optional on this route. When ABSENT the handler operates on the
        manager''s global (un-scoped) roster and performs NO authorization check beyond JWT. When present
        it must parse as a UUID and the caller must be a member (reads) or the owner (writes) of that
        team.

        '
      schema:
        type: string
        format: uuid
    RequiredTeamIdQuery:
      name: team_id
      in: query
      required: true
      description: 'Formal team UUID. Required on this route: a missing or whitespace-only value is 400
        "team_id is required".

        '
      schema:
        type: string
        format: uuid
    SchedulingLinkIdPath:
      name: id
      in: path
      required: true
      description: Scheduling-link UUID. Parsed with uuid.Parse; a non-UUID value yields 400 "invalid
        id".
      schema:
        type: string
        format: uuid
    TeamIdPath:
      name: id
      in: path
      required: true
      description: Formal team UUID.
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'HS256 JWT issued by backend/auth/jwt.go GenerateToken. Claims: `sub`

        (user uuid, string), `email`, `exp` (+7 days), `iat`.

        middleware.requireAuth accepts it as `Authorization: Bearer <jwt>` ONLY

        when the `auth_token` cookie is absent or empty — the cookie wins.

        '
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: 'The same HS256 JWT, set httpOnly / SameSite=Lax / Max-Age=604800 / Path=/

        by the OAuth and OIDC callbacks. This is the transport the shipped

        frontend uses (both fetch wrappers send `credentials: "include"` and

        never set an Authorization header). It is checked before bearerAuth.

        '
