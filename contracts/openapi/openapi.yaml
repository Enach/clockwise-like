          - accepted
          - declined
    SchedulingLinkListResponse:
      type: object
      description: GET /api/scheduling-links. Both arrays are always present, never null.
      required:
      - owned
      - shared
      additionalProperties: false
      properties:
        owned:
          type: array
          items:
            $ref: '#/components/schemas/SchedulingLink'
        shared:
          type: array
          description: Links where the caller is an accepted co-host but not the owner.
          items:
            $ref: '#/components/schemas/SchedulingLink'
    Settings:
      type: object
      description: 'The settings document for ONE user, returned by GET and by PATCH. Every property is
        always present. It has NO `llmApiKey` property at all: the key is write-only and is never returned
        (spec AC-11); `llmApiKeySet` reports whether one is on file. Property names come straight from
        the json tags on storage.Settings, camelCase throughout. `ID`, `MicrosoftTokens` and `ZoomTokens`
        are `json:"-"` and never appear.

        PAC-24 revision 3 makes this a concrete schema rather than an `allOf` over a shared field set
        with `readOnly`/`writeOnly` markers: all three generators (oapi-codegen, openapi-typescript, typed-openapi)
        dropped those markers and generated a response type carrying `llmApiKey`, and typed-openapi also
        dropped the `required` list (contract challenge, revision 2, finding 1). The property map is shared
        with `SettingsUpdate` through a YAML anchor, so the two cannot drift; every `Settings` document
        is a valid `SettingsUpdate` body.

        Every value this schema forbids has been normalised away in storage by migration 024 (see `SettingsUpdate`
        and contracts/features/PAC-24.md, Revisions 3 and 4), so a GET always satisfies it.

        '
      properties:
        workStart: &id001
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          description: '`HH:MM`, OR THE EMPTY STRING. DB default `09:00`. PAC-24 tightened the shape from
            `^[0-9]{2}:[0-9]{2}$`, which admitted `99:99` (the server''s own check was the same loose
            regexp, so `99:99` was stored), and at the same time widened it to admit `""`, which the server
            both accepts and returns.

            `""` is not a modelling slip, it is the state the data is in. `validateSettings` skips the
            format check exactly when the value is empty (`backend/api/handlers_settings.go:75`, `if val
            != "" && !timePattern.MatchString(val)`), and every row zeroed by API-004 - the defect this
            feature exists to repair - already holds `""` in this column, because the pre-PAC-24 full
            replace persisted each omitted property as its Go zero value. A strict `HH:MM` pattern would
            make day-one GETs fail the contract they were generated from, and the generated zod schema
            would reject the body before any UI saw it. It is also what makes spec AC-7 satisfiable: `{"workStart":
            ""}` is the documented way to clear this setting, and under the merge rule a present property
            is stored exactly as given.

            Consumers already treat `""` as meaningful rather than as damage: `WorkWindow` falls back
            to `09:00`/`18:00` when the effective start or end is empty (`backend/storage/settings.go:124-127`).
            The same widening, for the same reason, was already applied to `DaySchedule.start`/`end`.
            Contrast `recapSendTime`, which is NOT widened - see its own description.

            '
        workEnd: &id002
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          description: '`HH:MM` or `""`, as `workStart`. DB default `18:00`. PAC-24 adds the cross-property
            check that workEnd > workStart, which OpenAPI cannot express; it is a 400 (`workEnd must be
            after workStart`). That check applies only when BOTH values are non-empty, which is the existing
            handler behaviour and keeps `""` a clear rather than a 400. Before PAC-24 an inverted working
            day was accepted and produced a zero-length day at use (API-082).

            '
        timezone: &id003
          type: string
          description: 'IANA name, e.g. `Europe/Paris`. DB default `UTC`. PAC-24 validates it with time.LoadLocation
            and returns 400 `timezone is not a known IANA location`. Before PAC-24 any string was accepted
            and every engine silently fell back to UTC, so a typo moved a user''s whole schedule with
            no error anywhere (API-082).

            '
        focusMinBlockMinutes: &id004
          type: integer
          minimum: 0
          description: Rejected when < 0. DB default 25.
        focusMaxBlockMinutes: &id005
          type: integer
          minimum: 0
          description: 'Rejected when < 0. DB default 120. PAC-24 adds the cross-property check focusMinBlockMinutes
            <= focusMaxBlockMinutes, which OpenAPI cannot express; it is a 400 (API-082).

            '
        focusDailyTargetMinutes: &id006
          type: integer
          minimum: 0
          description: Rejected when < 0. DB default 240.
        outOfHoursMeetingsPerWeek: &id007
          type: integer
          minimum: 0
          description: 'Weekly allowance of meetings outside working hours. 0 disables out-of-hours scheduling
            entirely (canScheduleOutOfHours returns false when <= 0).

            '
        autoDeclineOutsideWorkingHours: &id008
          type: boolean
        focusLabel: &id009
          type: string
          description: DB default `Focus Time`.
        focusColor: &id010
          type: string
          description: Hex colour string. Not validated. DB default `#4F46E5`.
        lunchStart: &id011
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          description: '`HH:MM` or `""`. DB default `12:00`. Legacy global; overridden per-day by lunchBreaks.
            `""` here is the strongest case of the four: it is not merely tolerated but LOAD-BEARING.
            `LunchWindow` returns `enabled: false` precisely when `lunchStart` or `lunchEnd` is empty
            (`backend/storage/settings.go:141-142`), so `""` is how "this user has no protected lunch"
            is represented. Forbidding it in the schema would make an existing, meaningful state unrepresentable.

            '
        lunchEnd: &id012
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          description: '`HH:MM` or `""`, as `lunchStart`. DB default `13:00`. PAC-24 adds the cross-property
            check lunchEnd > lunchStart as a 400 (API-082), applied only when both values are non-empty.

            '
        protectLunch: &id013
          type: boolean
          description: DB default true.
        bufferBeforeMinutes: &id014
          type: integer
          minimum: 0
          description: Rejected when < 0. DB default 5.
        bufferAfterMinutes: &id015
          type: integer
          minimum: 0
          description: Rejected when < 0. DB default 5.
        bufferEnabled: &id016
          type: boolean
        bufferMinMeetingMinutes: &id017
          type: integer
          minimum: 0
          description: 'PAC-24 adds the `>= 0` check its two siblings already had; before that a negative
            value was accepted here alone (API-082).

            '
        bufferSkipBackToBack: &id018
          type: boolean
        workingHours: &id019
          $ref: '#/components/schemas/WorkingHoursSchedule'
        lunchBreaks: &id020
          $ref: '#/components/schemas/LunchBreakSchedule'
        compressionEnabled: &id021
          type: boolean
        autoScheduleEnabled: &id022
          type: boolean
        autoScheduleCron: &id023
          type: string
          description: '5-field cron (minute hour dom month dow), parsed with robfig/cron v3 using exactly
            those five fields. Empty string skips validation. DB default `0 8 * * *`.

            '
        llmProvider: &id024
          type: string
          enum:
          - ''
          - openai
          - anthropic
          - ollama
          - bedrock
          - azure_openai
          - vertex
          description: Empty string is explicitly allowed by validLLMProviders.
        llmModel: &id025
          type: string
          description: 'Provider default applied at call time when empty: `gpt-4o-mini` (openai), `claude-haiku-4-5-20251001`
            (anthropic).

            '
        llmApiKeySet: &id026
          type: boolean
          readOnly: true
          description: '`true` exactly when the stored key is non-empty. This is the only thing a reader
            learns about the key, and it is what lets a client distinguish "not configured" from "configured"
            without disclosing anything (spec AC-12).

            `readOnly`, so a client that submits back a document it just read may include it; it is accepted
            and ignored (spec AC-10). It is NOT the way to clear a key - send `llmApiKey: ""` for that.

            '
        llmBaseUrl: &id027
          type: string
          description: 'Base URL of the `openai` or `anthropic` destination; `""` means the vendor''s
            public host (`https://api.openai.com`, `https://api.anthropic.com`). Also Ollama''s fallback
            when `ollamaBaseUrl` is `""`. PAC-66-B: a write changing it to a non-empty value must be exactly
            `<scheme>://<host>[:<port>]` (at most one trailing `/`) and approved for at least one of `openai`,
            `anthropic`, `ollama` (400 otherwise); a request is sent to it only for a provider it is approved
            for (see `testLLMConnection`). The web app writes this property from its Ollama field. No
            `pattern`, for the reason given on `awsRegion`.

            '
        awsRegion: &id028
          type: string
          description: 'Bedrock region. Empty means the built-in `us-east-1`, applied as an explicit region
            that overrides the deployment''s AWS region configuration (spec D-7). PAC-66: a write changing
            it to a non-empty value must be a valid region name (one host label); the Bedrock host the
            SDK resolves is sent to only if approved in `PACEDAY_LLM_APPROVED_HOSTS_BEDROCK`. Deliberately
            no `pattern`: this map is shared with `Settings`, and rows stored before PAC-66 are kept as
            they are (spec D-3), so a pattern would make the response schema false for them.

            '
        awsProfile: &id029
          type: string
          description: 'Named profile in the deployment''s AWS shared config. Not checked by PAC-66 (spec
            OQ-4): it selects which deployment identity signs, but any endpoint it configures is still
            subject to the Bedrock approved-host check at send time.

            '
        bedrockModel: &id030
          type: string
        azureEndpoint: &id031
          type: string
          description: 'Azure OpenAI resource endpoint, e.g. `https://my-resource.openai.azure.com`. PAC-66:
            a write changing it to a non-empty value must be an `https` URL whose host is approved in
            `PACEDAY_LLM_APPROVED_HOSTS_AZURE_OPENAI` (400 otherwise). `""` is always accepted and means
            "not set", which is refused when a request would be sent. The path is not constrained (see
            `contracts/features/PAC-66.md` §7). No `format` or `pattern`, for the reason given on `awsRegion`.

            '
        azureDeployment: &id032
          type: string
        azureApiVersion: &id033
          type: string
        gcpProject: &id034
          type: string
        gcpLocation: &id035
          type: string
          description: 'Vertex region, e.g. `europe-west4`. Empty means the built-in `us-central1`. The
            server builds the host `<gcpLocation>-aiplatform.googleapis.com` from it. PAC-66: a write
            changing it to a non-empty value must build a host approved in `PACEDAY_LLM_APPROVED_HOSTS_VERTEX`
            (400 otherwise), so a value that changes the URL''s authority (`attacker.example/x`) is refused.
            The same check is made when a request would be sent, including for `""`. No `pattern`, for
            the reason given on `awsRegion`.

            '
        vertexModel: &id036
          type: string
        ollamaBaseUrl: &id037
          type: string
          description: 'Falls back to llmBaseUrl, then `http://localhost:11434`. Stored as `http://localhost:11434`
            on a new account (migration 002), so it is Ollama''s destination until cleared. PAC-66-B:
            a write changing it to a non-empty value must be exactly `<scheme>://<host>[:<port>]` (at
            most one trailing `/`) and an origin approved in `PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA` (400
            otherwise); the same check is made whenever an Ollama request would be sent. No `pattern`,
            for the reason given on `awsRegion`.

            '
        ollamaModel: &id038
          type: string
          description: Falls back to llmModel, then `llama3.2`.
        calendarProvider: &id039
          type: string
          enum:
          - google
          - outlook
          - webcal
          description: 'DB default `google`. Which calendar the product reads and writes for THIS user.

            Resolves U-18. The authoritative set was settled by reading the three consumers that switch
            on this value - calendar.NewProvider (`backend/calendar/client_factory.go:16,22,27`), the
            auth-status handler (`backend/api/handlers_auth.go:97,105,111`) and the free/busy service
            (`backend/engine/freebusy_service.go:122`). All three accept exactly `outlook` and `webcal`
            and treat every other value, including a typo, as Google. PAC-24 enforces the set; before
            it, an unknown value was stored and silently behaved as `google`.

            Before PAC-24 this was a property of the singleton row, so one user connecting Outlook switched
            the whole deployment (`backend/auth/microsoft_oauth.go:57` writes `calendar_provider = ''outlook''
            WHERE id = 1`).

            '
        webcalUrl: &id040
          type: string
        calendarEmail: &id041
          type: string
          description: 'The address of THIS user''s connected calendar. Before PAC-24 the auth-status
            handler served the singleton row''s value to everyone (API-009).

            '
        conferencingProvider: &id042
          type: string
          enum:
          - meet
          - zoom
          - teams
          description: 'Read with `COALESCE(conferencing_provider,''meet'')`; conference.NewProvider switches
            on `zoom`, `teams`, and treats everything else as `meet`. So the wire values are `meet` /
            `zoom` / `teams`, not the frontend''s `google_meet` / `zoom` / `teams` / `custom`. PAC-24
            enforces the set for the same reason as calendarProvider: an unknown value was stored and
            silently behaved as `meet`.

            '
        recapEnabled: &id043
          type: boolean
        recapSendTime: &id044
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: '`HH:MM`, in the same form on read and on write. **STRICT: unlike the four legacy
            clock properties above, `""` is NOT admitted here, in either direction.** The three reasons
            are specific to this column and do not generalise:

            (a) There is no empty state to represent. The column is `TIME NOT NULL DEFAULT ''08:00''`
            (`015_daily_recap.up.sql:3`), and the write path passes every value through `recapSendTimeOrDefault`
            (`backend/storage/settings.go:356-361`), which turns `""` into `08:00`. So no row can hold
            an empty send time and no GET can return one - the `COALESCE(...,'''')` at `:224` and `:439`
            is defensive and unreachable. This is the difference from `workStart`/`lunchStart`, where
            `""` both exists in the data and carries meaning.

            (b) Admitting `""` would make this contract lie about its own merge rule. `PATCH /api/settings`
            states that a property present is set to exactly the value given; `""` here would instead
            be silently rewritten to `08:00`. A client asking to clear a value and being told `200` while
            the server stored something it did not ask for is the exact silent-success failure mode this
            contract refuses for `null`.

            (c) PAC-24 therefore removes the substitution: `""` is a 400 (`recapSendTime must be in HH:MM
            format`), which is the same message spec AC-17 already requires for a malformed value and
            which AC-16 requires instead of an internal failure.

            **This requires a narrow amendment to spec AC-7**, which as written says an empty value of
            a setting''s type always clears it. AC-7 must exempt `recapSendTime` on the ground that it
            has no empty state. The contract author may not edit the spec; the amendment is named in `contracts/features/PAC-24.md`
            §"Revision 2" and must be made before stage 3.

            Resolves U-19, and resolves it by CHANGING the server rather than by documenting what it did.
            The column is Postgres `TIME` (`015_daily_recap.up.sql:3`) and was read as `recap_send_time::TEXT`,
            which renders `HH:MM:SS` (`08:00:00`, with a fractional part when one was stored) - contradicting
            the struct comment that claims `HH:MM` and contradicting the write format, so no client could
            round-trip this value. PAC-24 renders the column to `HH:MM` on read and rejects anything else
            on write. Note: the marker was originally to be settled by observing a live response; it is
            settled here by fixing the asymmetry instead, which makes the observation unnecessary. Spec
            AC-16 is the integration test that proves the rendered form.

            '
        recapSendTo: &id045
          type: string
          enum:
          - dm
          - channel
          description: 'DB CHECK constraint enforces this. PAC-24 validates it on the settings write too;
            before that only the daily-recap PATCH did, so a bad value sent to PUT /api/settings reached
            the DB CHECK and surfaced as a 500 (API-081).

            '
        recapChannelId: &id046
          type: string
        recapIncludeBriefs: &id047
          type: boolean
          description: DB default true.
        recapIncludeFocus: &id048
          type: boolean
          description: 'DB default true. Exposed as `include_focus_blocks` by the daily-recap endpoints.

            '
        recapIncludeHabits: &id049
          type: boolean
          description: DB default true.
        timeFormat: &id050
          type: string
          enum:
          - 12h
          - 24h
          description: 'How the signed-in web app shows times of day to this user (PAC-55): `12h` ("2:30
            PM", the default, exactly as before PAC-55) or `24h` ("14:30", two-digit hour, no AM/PM).
            DB default `12h`; a user who never chose reads `12h`. There is no "unset": `""` and any other
            STRING are a 400 `timeFormat must be 12h or 24h`; a non-string (`24`, `true`, `["24h"]`) fails
            decoding first and is a 400 `invalid JSON: timeFormat has the wrong type`; `null` is a 400
            like every property of this body. Display only: the server formats nothing with it, and the
            public booking page ignores it (always 12-hour, PAC-55 §5).

            '
        updatedAt: &id051
          type: string
          format: date-time
          readOnly: true
          description: 'Server-managed (NOW() on every write). May be present in a request body - a client
            submitting back a document it just read will include it - and is ignored (spec AC-10).

            '
      required:
      - workStart
      - workEnd
      - timezone
      - focusMinBlockMinutes
      - focusMaxBlockMinutes
      - focusDailyTargetMinutes
      - outOfHoursMeetingsPerWeek
      - autoDeclineOutsideWorkingHours
      - focusLabel
      - focusColor
      - lunchStart
      - lunchEnd
      - protectLunch
      - bufferBeforeMinutes
      - bufferAfterMinutes
      - bufferEnabled
      - bufferMinMeetingMinutes
      - bufferSkipBackToBack
      - workingHours
      - lunchBreaks
      - compressionEnabled
      - autoScheduleEnabled
      - autoScheduleCron
      - llmProvider
      - llmModel
      - llmApiKeySet
      - llmBaseUrl
      - awsRegion
      - awsProfile
      - bedrockModel
      - azureEndpoint
      - azureDeployment
      - azureApiVersion
      - gcpProject
      - gcpLocation
      - vertexModel
      - ollamaBaseUrl
      - ollamaModel
      - calendarProvider
      - webcalUrl
      - calendarEmail
      - conferencingProvider
      - recapEnabled
      - recapSendTime
      - recapSendTo
      - recapChannelId
      - recapIncludeBriefs
      - recapIncludeFocus
      - recapIncludeHabits
      - timeFormat
      - updatedAt
      additionalProperties: false
    SettingsUpdate:
      type: object
      description: 'PATCH /api/settings body - the only settings write. Nothing is required: a property
        absent means "leave it as it is", and `{}` is a valid no-op request. A property present is applied
        exactly as given - `""`, `0` and `false` are values, not absences, except where a property''s
        enum or pattern excludes `""` (`recapSendTime`, `recapSendTo`, `calendarProvider`, `conferencingProvider`,
        `timeFormat`), where `""` is a 400 like any other value outside the set (spec AC-7 as amended
        2026-10-12).

        The same properties as `Settings` (one YAML anchor) plus the write-only `llmApiKey`. `llmApiKeySet`
        and `updatedAt` are accepted and ignored, so a document read from GET can be submitted back unchanged
        (spec AC-10).

        No property is nullable: `null` is a 400 `<property> must not be null` and an unknown property
        - including a snake_case spelling of a real one - is a 400 `unknown property: <name>` (spec AC-8).
        These are enforced by the handler, not by a generated validator.

        Validation applies to the properties whose value the body CHANGES. A property sent with the value
        already stored is not re-validated, so a GET document submitted back unchanged is always accepted
        - including a legacy combination a newer cross-property rule would reject (an end before a start,
        a focus minimum above the maximum) - and a stored value never locks the user out of saving something
        else (challenge r2, finding 2).

        `workingHours` is ONE property and is replaced whole, so a write that changes it must make the
        whole document valid: both its `default` and its `days`, whatever the mode. That includes a `default`
        the client derived from legacy values - for a row whose mode was `""` the server derives it from
        `workStart`/`workEnd` on read - so a client switching such a row to `by_day` must send a valid
        `default` (revision 6).

        `workingHours` and `lunchBreaks` are replaced whole when present, not deep-merged (spec AC-9).

        Before PAC-24 this was the body of `PUT /api/settings`, a replace: every omitted property was
        persisted as its Go zero value (API-004). That operation is removed because the two repositories
        deploy together (spec PAC-24, Decisions 2026-10-12, OQ-3).

        '
      properties:
        workStart: *id001
        workEnd: *id002
        timezone: *id003
        focusMinBlockMinutes: *id004
        focusMaxBlockMinutes: *id005
        focusDailyTargetMinutes: *id006
        outOfHoursMeetingsPerWeek: *id007
        autoDeclineOutsideWorkingHours: *id008
        focusLabel: *id009
        focusColor: *id010
        lunchStart: *id011
        lunchEnd: *id012
        protectLunch: *id013
        bufferBeforeMinutes: *id014
        bufferAfterMinutes: *id015
        bufferEnabled: *id016
        bufferMinMeetingMinutes: *id017
        bufferSkipBackToBack: *id018
        workingHours: *id019
        lunchBreaks: *id020
        compressionEnabled: *id021
        autoScheduleEnabled: *id022
        autoScheduleCron: *id023
        llmProvider: *id024
        llmModel: *id025
        llmApiKeySet: *id026
        llmBaseUrl: *id027
        awsRegion: *id028
        awsProfile: *id029
        bedrockModel: *id030
        azureEndpoint: *id031
        azureDeployment: *id032
        azureApiVersion: *id033
        gcpProject: *id034
        gcpLocation: *id035
        vertexModel: *id036
        ollamaBaseUrl: *id037
        ollamaModel: *id038
        calendarProvider: *id039
        webcalUrl: *id040
        calendarEmail: *id041
        conferencingProvider: *id042
        recapEnabled: *id043
        recapSendTime: *id044
        recapSendTo: *id045
        recapChannelId: *id046
        recapIncludeBriefs: *id047
        recapIncludeFocus: *id048
        recapIncludeHabits: *id049
        timeFormat: *id050
        updatedAt: *id051
        llmApiKey:
          type: string
          writeOnly: true
          description: 'WRITE-ONLY. Accepted on write; never present in any response from any operation
            (spec AC-11). Required for openai and anthropic.

            Under the merge semantics this needs no special case: omit it and the stored key is unchanged;
            send `""` and it is cleared; send a value and it is replaced (spec AC-13). There is no way
            to read it back, by design - someone who loses their key re-enters it. Do not add a reveal
            affordance later.

            Before PAC-24 it was returned in cleartext from a row shared by every authenticated account
            (API-002 + API-003), and wiped by any write that omitted it (API-004). Every key configured
            before this ships must be treated as compromised and rotated - closing the read path does
            not un-expose it (spec §5, OQ-5).

            '
      additionalProperties: false
    SlackBlock:
      type: object
      description: 'engine.slackBlock is `map[string]interface{}` - an untyped Slack Block Kit object.
        Nested values are themselves slackBlocks or arrays of them.

        Resolves U-20 by reading engine/daily_recap.go end to end. Every top-level block this API can
        emit is built by DailyRecapService.BuildMessage (`:150-236`), buildSummaryBlock (`:238-262`) or
        buildMeetingBlocks, and the complete set of top-level `type` values is `header`, `context`, `section`,
        `divider`. The only nested text object types are `plain_text` and `mrkdwn`.

        `additionalProperties` stays `true`: the member set of a block varies by type (`text`, `elements`,
        `emoji`), the Go type is a bare map, and pinning the members would be a stricter claim than the
        code supports. The `type` enum is the part that was actually determinable, and it is the part
        a client switches on. PAC-24 changes none of this behaviour - only what the contract says about
        it.

        '
      properties:
        type:
          type: string
          enum:
          - header
          - context
          - section
          - divider
      additionalProperties: true
    SlackMessage:
      type: object
      description: storage.SlackMessage — one Slack search hit backing a brief.
      required:
      - channel_name
      - author_name
      - text
      - timestamp
      - permalink
      additionalProperties: false
      properties:
        channel_name:
          type: string
        author_name:
          type: string
        text:
          type: string
          description: Excerpt, truncated server-side to roughly 200 characters.
        timestamp:
          type: string
          description: Slack's `ts` value (a string, e.g. "1712345678.123456") — NOT an RFC3339 date-time.
        permalink:
          type: string
    SsoDetectRequest:
      type: object
      description: Anonymous struct in ssoHandlers.detect.
      required:
      - email
      properties:
        email:
          type: string
          description: Rejected with 400 when empty; not otherwise validated server-side.
      additionalProperties: true
    SsoDetectResponse:
      type: object
      description: auth.DetectResult (backend/auth/sso_detect.go).
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - google
          - microsoft
          - sso
          - generic
          description: '"generic" for consumer/unparseable domains, "sso" when an active

            provider row exists for the domain (a row suspended through

            setSsoProviderState is ignored, PAC-22), "microsoft" from a live tenant probe against

            login.microsoftonline.com (2s timeout, 1h cache), else "google".

            '
        provider_name:
          type: string
          description: Display name of the SSO provider. Omitted unless type == "sso".
        redirect_url:
          type: string
          description: 'Relative path `/api/auth/sso/<domain>` (the email''s domain,

            lowercased and trimmed, not URL-escaped). Omitted unless

            type == "sso". It is a path on the API''s origin, not the web app''s:

            a client resolves it against its API base URL, which may be a

            different origin (PAC-35 AC-7). The client appends

            `?login_hint=<email>` itself (see `startSsoLogin`); the detection

            answer does not carry the email. This is the only field a client

            needs to reach SSO; there is no `domain` field (API-010).

            '
      additionalProperties: false
    SsoProvider:
      type: object
      description: 'An organisation''s SSO configuration as it may leave the server (PAC-22,

        resolves U-22, closes the disclosure half of API-001). Returned by

        createSsoProvider, listSsoProviders and setSsoProviderState. It is a

        projection written for the wire with explicit snake_case keys, not the

        storage row: the client secret and the signing certificate are never

        part of it under any name, for any caller. In their place are two

        booleans that say only whether each secret is on file; each depends on

        its own secret and on nothing else (spec §3.1, AC-3, AC-4).


        Rows stored before PAC-22 serialise with this same shape: a SAML row

        reports `provider_type: saml` and its non-secret SAML values, and an

        OIDC row with empty values reports them as `""` (spec AC-5). No row

        writable since PAC-22 has a SAML value, so for those the SAML

        properties are `""` and `has_saml_cert` is false.

        '
      required:
      - id
      - domain
      - provider_name
      - provider_type
      - state
      - oidc_issuer
      - oidc_client_id
      - has_oidc_client_secret
      - saml_entry_point
      - saml_issuer
      - has_saml_cert
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        provider_name:
          type: string
        provider_type:
          type: string
          enum:
          - oidc
          - saml
          description: '`saml` only for rows stored before PAC-22; createSsoProvider no

            longer accepts it. startSsoLogin still answers 501 for such a row.

            '
        state:
          $ref: '#/components/schemas/SsoProviderState'
        oidc_issuer:
          type: string
          description: '`""` only for a row stored before PAC-22.'
        oidc_client_id:
          type: string
          description: '`""` only for a row stored before PAC-22.'
        has_oidc_client_secret:
          type: boolean
          description: 'True when a non-empty client secret is on file, false otherwise.

            The secret itself is never returned (spec AC-3). It depends on the

            stored secret and nothing else (AC-4). False only for a row stored

            before PAC-22: every write since either supplies a non-empty

            secret or keeps a non-empty one. A row of type `saml` stored

            before PAC-22 can read true here (the write path stored a client

            secret whatever the type); a replace of such a row that leaves the

            secret out is still refused, because a secret is kept only from an

            `oidc` row (spec §3.2, AC-25).

            '
        saml_entry_point:
          type: string
          description: Non-secret SAML sign-in address of a row stored before PAC-22; `""` otherwise.
        saml_issuer:
          type: string
          description: Non-secret SAML issuer of a row stored before PAC-22; `""` otherwise.
        has_saml_cert:
          type: boolean
          description: 'True when a non-empty SAML signing certificate is on file, false

            otherwise. The certificate itself is never returned. Only a row

            stored before PAC-22 can be true (spec §3.1, D-8).

            '
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 'Time of the last configuration write (createSsoProvider).

            setSsoProviderState does not change it.

            '
      additionalProperties: false
    SsoProviderCreateRequest:
      type: object
      description: 'Body of createSsoProvider. Since PAC-22 (resolves U-21, API-060) it

        describes an OIDC configuration and nothing else: every property but

        the client secret is required and non-empty, and the SAML properties

        are gone (spec D-1, D-2, D-8). The server enforces each of these with

        the 400 messages listed on createSsoProvider, in the order given

        there, including a named refusal of `saml_entry_point`, `saml_issuer`

        and `saml_cert` when present. A replace supplies every value a reader

        can see again; the client secret alone may be left out of a replace,

        which keeps the stored one under the conditions stated on

        createSsoProvider (spec §3.2, D-12, D-13, D-14). Whether SSO is

        active is not part of this body (spec §3.3); see

        setSsoProviderState.

        '
      required:
      - domain
      - provider_name
      - provider_type
      - oidc_issuer
      - oidc_client_id
      properties:
        domain:
          type: string
          minLength: 1
          description: Must match the caller's org domain or the request is 403'd (rule unchanged by PAC-22;
            PAC-50 replaces it).
        provider_name:
          type: string
          minLength: 1
          description: Display name, returned as `provider_name` and shown by detectAuthProvider.
        provider_type:
          type: string
          enum:
          - oidc
          description: 'The only kind the product can complete a sign-in with. `saml` is

            refused with 400 `provider_type ''saml'' is not supported` (spec

            D-1); before PAC-22 it was accepted, stored, and refused only at

            sign-in with 501.

            '
        oidc_issuer:
          type: string
          minLength: 1
          description: OIDC issuer used for discovery at sign-in. Stored as given.
        oidc_client_id:
          type: string
          minLength: 1
        oidc_client_secret:
          type: string
          minLength: 1
          description: "Write-only. No response of any operation returns it, or anything\nderived from\
            \ it; SsoProvider reports only whether one is on file\n(`has_oidc_client_secret`).\n- Supplied:\
            \ a non-empty string that replaces the stored secret\n  (spec D-12, AC-23). `\"\"` and `null`\
            \ are refused with 400\n  `oidc_client_secret must not be empty` (AC-26): no write clears\n\
            \  the secret.\n- Absent: required on a create; on a replace, the stored secret\n  is kept\
            \ when the stored configuration is `oidc`, holds a\n  non-empty secret, and has exactly the\
            \ submitted `oidc_issuer`\n  and `oidc_client_id`, all decided at the moment the write is\n\
            \  stored; otherwise 400 (spec D-13, D-14, AC-22, AC-24, AC-25,\n  AC-27).\n"
      additionalProperties: false
    SsoProviderList:
      type: object
      description: 'listSsoProviders response (PAC-22). A named container rather than a

        bare array so that a property added beside `providers` later does not

        change the response''s type for every consumer (spec §3.7). Most list

        responses in this contract are bare arrays; this one is deliberately

        not, and must not be "corrected" towards them.

        '
      required:
      - providers
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/SsoProvider'
          description: 'Ordered by `created_at`, oldest first. Empty when the org has none.

            At most one item today: a configuration is listed when its domain

            equals the org''s domain exactly, and both `sso_providers.domain`

            and `organizations.domain` are unique. The array is kept so that

            the type does not change if an org can ever hold more than one.

            '
      additionalProperties: false
    SsoProviderState:
      type: string
      enum:
      - active
      - suspended
      description: 'Whether sign-in uses this configuration (PAC-22, spec §3.3, §3.5).

        `active`: detection answers `sso` for the domain and startSsoLogin

        redirects to the provider. `suspended`: sign-in behaves as if no SSO

        were configured; the configuration is kept. Stored as the existing

        `enabled` column (true is `active`), so no migration.

        '
    SsoProviderStateRequest:
      type: object
      description: 'Body of setSsoProviderState: the state wanted, never a toggle, and

        nothing else (spec AC-12). Any other property, including any

        configuration value, is refused with 400 `unknown property: <name>`,

        and `state` given twice is refused with 400 `duplicate property:

        state`.

        '
      required:
      - state
      properties:
        state:
          $ref: '#/components/schemas/SsoProviderState'
      additionalProperties: false
    SuggestedSlot:
      type: object
      description: engine.SuggestedSlot.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        score:
          type: integer
          description: 'Integer score from scoreCandidate + adjustScoreForPreferences. No documented range
            or normalisation.

            '
        reasons:
          type: array
          nullable: true
          items:
            type: string
      required:
      - start
      - end
      - score
      - reasons
      additionalProperties: false
    Team:
      type: object
      description: storage.Team. Note the camelCase json tags — unlike the manager domain's snake_case.
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
          description: Omitted entirely when the team has no organization (omitempty on a *uuid.UUID).
        name:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - createdBy
      - createdAt
      additionalProperties: false
    TeamAnalytics:
      type: object
      description: engine.TeamAnalytics.
      properties:
        avg_meeting_minutes:
          type: integer
          description: Integer division by member count (or by 1 for an empty team).
        avg_focus_minutes:
          type: integer
        member_breakdown:
          type: array
          description: '`[]` when the team has no members.'
          items:
            $ref: '#/components/schemas/MemberAnalyticsSummary'
      required:
      - avg_meeting_minutes
      - avg_focus_minutes
      - member_breakdown
      additionalProperties: false
    TeamDetail:
      type: object
      properties:
        team:
          $ref: '#/components/schemas/Team'
        members:
          type: array
          description: '`[]` when the team has no members or the query failed.'
          items:
            $ref: '#/components/schemas/TeamMember'
      required:
      - team
      - members
      additionalProperties: false
    TeamInvite:
      type: object
      description: storage.TeamInvite, returned in full (token included) by inviteTeamMember.
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        inviteeEmail:
          type: string
          format: email
        invitedBy:
          type: string
          format: uuid
        token:
          type: string
          description: A freshly generated UUID string used as the invite link path segment.
        status:
          type: string
          enum:
          - pending
          - accepted
          - declined
          - expired
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: createdAt + 7 days (computed in Go, not by the database).
      required:
      - id
      - teamId
      - inviteeEmail
      - invitedBy
      - token
      - status
      - createdAt
      - expiresAt
      additionalProperties: false
    TeamInvitePreview:
      type: object
      description: 'A narrow projection of a pending invite, NOT a TeamInvite (no id, token, status, invitedBy
        or createdAt). The three original keys are camelCase and stay so for existing readers; the three
        keys added by PAC-34 are snake_case, the spelling the PAC-34 acceptance criteria name and the
        web normalizer reads (see contracts/features/PAC-34.md section 3 for the rejected alternatives).
        team_id and expires_at come from the invite row itself, so they are always present. The team and
        inviter rows are read separately and a failed read is not an error: teamName and inviterName become
        "" and inviter_email becomes null.

        '
      properties:
        teamName:
          type: string
          description: Empty string when the team row could not be read.
        inviterName:
          type: string
          description: 'The inviter''s DISPLAY NAME, not their email. Empty string when the user row could
            not be read.

            '
        email:
          type: string
          format: email
          description: The invitee email the invite was issued to.
        team_id:
          type: string
          format: uuid
          description: team_invites.team_id of this invite (PAC-34). Never empty.
        expires_at:
          type: string
          format: date-time
          description: 'team_invites.expires_at, RFC 3339 (PAC-34): createdAt + 7 days, computed in Go
            when the invite was created. A 200 is returned only while the invite is pending and ExpireOldInvites
            runs first, so a client normally sees a future instant; a client must still treat a past value
            as expired rather than assume otherwise.

            '
        inviter_email:
          type:
          - string
          - 'null'
          format: email
          description: 'The inviter''s account email, users.email of team_invites.invited_by (PAC-34).
            null, never "", when the inviter''s user row could not be read. invited_by is NOT NULL with
            ON DELETE CASCADE, so a deleted inviter removes the invite (404), and null only arises from
            a failed read.

            '
      required:
      - teamName
      - inviterName
      - email
      - team_id
      - expires_at
      - inviter_email
      additionalProperties: false
    TeamMember:
      type: object
      description: storage.TeamMember, as returned inside TeamDetail.
      properties:
        teamId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - member
        joinedAt:
          type: string
          format: date-time
        name:
          type: string
          description: 'Joined from users.name via COALESCE(...,''''), and tagged omitempty — so a user
            with no name causes the key to be OMITTED, not sent as "".

            '
        email:
          type: string
          format: email
          description: Joined from users.email, also omitempty.
      required:
      - teamId
      - userId
      - role
      - joinedAt
      additionalProperties: false
    TeamNameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed before storage. No maximum length is enforced by the backend.
      required:
      - name
      additionalProperties: true
    TeamSlot:
      type: object
      description: engine.TeamSlot.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        quality_score:
          type: integer
          minimum: 0
          maximum: 100
          description: 100 - (members_with_disrupted_focus / total_members) * 100, integer division.
      required:
      - start
      - end
      - quality_score
      additionalProperties: false
    TeamSlotList:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/TeamSlot'
      required:
      - slots
      additionalProperties: false
    UpdateSchedulingLinkRequest:
      type: object
      description: backend/api/handlers_scheduling_links.go schedulingLinkPatch. Scalars are Go pointers,
        so an absent key leaves the stored value alone; slices are plain slices, so an absent key and
        an explicit `null` are indistinguishable and both mean "leave unchanged", while `[]` means "clear"
        (and then usually fails 422).
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
          description: Normalised. If it normalises to empty the request is a 422 "slug cannot be empty".
        duration_options:
          type: array
          items:
            type: integer
        durations:
          type: array
          description: Applied AFTER duration_options, so when both are sent `durations` wins - the opposite
            precedence from create.
          items:
            type: integer
        days_of_week:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        days:
          type: array
          description: Applied after days_of_week, so `days` wins when both are sent - again the opposite
            of create.
          items:
            type: string
        window_start_time:
          type: string
          nullable: true
        window_start:
          type: string
          nullable: true
          description: Alias, applied only when window_start_time is absent.
        window_end_time:
          type: string
          nullable: true
        window_end:
          type: string
          nullable: true
          description: Alias, applied only when window_end_time is absent.
        buffer_before:
          type: integer
          nullable: true
          minimum: 0
        buffer_after:
          type: integer
          nullable: true
          minimum: 0
        min_notice_minutes:
          type: integer
          nullable: true
          minimum: 0
        usage_type:
          type: string
          nullable: true
          enum:
          - reusable
          - recurring
          - single_use
        max_uses:
          type: integer
          nullable: true
          description: An explicit null is indistinguishable from an absent key (both leave the stored
            value), so max_uses cannot be cleared by PATCH except by switching usage_type away from `recurring`.
        active:
          type: boolean
          nullable: true
          description: Setting false is the same soft-deactivation that DELETE performs.
        co_host_emails:
          type: array
          description: 'When present, the complete co-host list: unlisted non-owner hosts are removed,
            new ones are added as `pending`, existing ones keep their status (PAC-61). Unknown emails
            are skipped silently.'
          items:
            type: string
            format: email
    UserProfileGoStruct:
      type: object
      description: 'storage.UserProfile with explicit snake_case json tags (PAC-26, API-030); the keys
        match the user_profiles columns. The schema name is kept from before PAC-26, when the struct had
        no tags and the keys were the Go field names (`UserID`, `IsManager`, `DetectedAt`, `AnalyticsSharedWithManager`,
        `UpdatedAt`).

        '
      properties:
        user_id:
          type: string
          format: uuid
        is_manager:
          type: boolean
        detected_at:
          type:
          - string
          - 'null'
          format: date-time
        analytics_shared_with_manager:
          type: boolean
          description: Member-side consent flag, defaulting to true. No endpoint in this domain sets it.
        updated_at:
          type: string
          format: date-time
          description: The value read BEFORE the upsert, not the newly written now().
      required:
      - user_id
      - is_manager
      - detected_at
      - analytics_shared_with_manager
      - updated_at
      additionalProperties: false
    WorkingHoursSchedule:
      type: object
      description: 'storage.WorkingHoursSchedule. Replaced WHOLE by a PATCH that mentions it; there is
        no deep merge (spec AC-9).

        **Normalised on read** by `Settings.normalizeSchedules` (`backend/storage/settings.go:92-106`),
        which `loadScheduleFields` calls on every read path (`:495`): an empty `mode` becomes `{mode:
        all_days, default: {enabled: true, start: workStart or 09:00, end: workEnd or 18:00}, days: {}}`;
        an `all_days` document whose `default` is entirely empty (`enabled:false, start:"", end:""`) has
        that default replaced the same way (`:95-99`); and a nil `days` map becomes `{}`.

        **So `{"mode":"all_days","default":{"enabled":false,"start":"","end":""}, "days":{}}` is NOT a
        document GET can return** - the `:95-99` branch rewrites it before it reaches the wire. That matters
        because it is the one document the shipped consumer cannot render: `normalizeInterval` rejects
        an empty `start`/`end` and returns `undefined` (`smart-calendar-flow/src/api/client.ts:477-488`),
        `normalizeWorkingHours` then returns `undefined` because `default` is undefined and `days` is
        empty (`:505-517`), and `normalizeSettings` reaches `delete out.working_hours` (`:543`) - the
        per-day section disappears with no error and no empty state, which is the silent blank spec AC-20
        exists to end.

        The `by_day` arm of the same shape IS reachable, because `:95-99` guards on `mode == "all_days"`:
        `{"mode":"by_day", …, "days":{}}` normalises to itself and produces the identical `undefined`
        in the consumer. PAC-24 closes it at the point of entry rather than describing it - a `by_day`
        document must carry at least one weekday (400: `workingHours.days must contain at least one weekday
        when mode is by_day`). `by_day` with no days also means "this user never works", which no consumer
        intends and which `WorkWindow` already renders as `enabled:false` for every day (`:117-121`).

        '
      properties:
        mode:
          type: string
          enum:
          - ''
          - all_days
          - by_day
          description: 'Compared EXACTLY by the handler (revision 3): `"BY_DAY"` and `" all_days"` are
            a 400. Before PAC-24 the validator lower-cased and trimmed, then persisted whatever was sent.
            Migration 024 turns a stored mode that equals `by_day` ignoring case (and NOT trimmed: `"
            by_day"` never matched) into `by_day`, and any other non-empty value into `all_days` - exactly
            how `WorkWindow` treated them (it only special-cases `by_day`, case-insensitively). It also
            clears an enabled entry that would fail validation in the half the stored mode ignored before
            the upgrade (`days` under `all_days`, `default` under `by_day`), which `WorkWindow` never
            read. It does not touch the half in use, nor a `default` derived on read for a mode-`""` row:
            a write of `workingHours` must make those valid (see `SettingsUpdate`).

            `''''` is in the enum because the server accepts it (`:129`, `mode != "" && mode != "all_days"
            && mode != "by_day"`) and because the contract must describe what is, not what should be (factory
            §7). Revision 1 of this contract omitted `''''` while the description two lines below said
            it was accepted - a schema disagreeing with its own prose. It is accepted on write ONLY when
            `days` is empty; otherwise it is the existing 400 `workingHours.mode is required when day-specific
            hours are provided` (`:132-134`). That conditional is cross-property and OpenAPI cannot express
            it, so it stays a documented 400 rather than becoming a schema narrowing - narrowing here
            would be a NEW rejection, and spec §6 requires both tests in `backend/api/handlers_settings_schedule_test.go`
            to keep passing unchanged.

            A GET never returns `''''`, because normalisation rewrites it.

            '
        default:
          $ref: '#/components/schemas/DaySchedule'
          description: 'Validated whenever at least one of enabled/start/end is set, in either mode (revision
            4). Ignored by WorkWindow() in by_day mode.

            '
        days:
          type: object
          description: 'Keys are lowercase English weekday names, and PAC-24 makes that a constraint THE
            HANDLER ENFORCES (revision 3): `propertyNames` below documents it, but no generator carries
            `propertyNames` into a validator, so the server''s exact-match check is the enforcement point
            (contract challenge r2, finding 4). Migration 024 removes stored keys that are not exactly
            one of the seven names - they never matched `WorkWindow`''s lookup, so removing them changes
            no behaviour; it also removes entries whose `start`/`end` are neither empty nor a clock. Keys
            and entries are checked WHATEVER THE MODE (revision 4): a `days` map stored under `all_days`
            is still returned by GET. Before PAC-24 the validator lower-cased keys and only looked at
            `days` in `by_day` mode, so `"Monday"` was stored and never matched. In `by_day` mode a missing
            weekday means "not working".

            '
          propertyNames:
            enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          additionalProperties:
            $ref: '#/components/schemas/DaySchedule'
      required:
      - mode
      - default
      - days
      additionalProperties: false
  responses:
    BookingCreateRateLimited:
      description: 'The client has already made 20 requests to `createPublicBooking` in its current 10-minute
        window (NEW-booking-rate-limit). Nothing was looked up or written. Body: `{"error":"rate limit
        exceeded"}`, Content-Type application/json, the same envelope and message as the detect limiter''s
        429. `Retry-After` is the whole number of seconds until the client''s window ends, rounded up,
        never less than 1 and never more than 600. The header is not listed in `Access-Control-Expose-Headers`,
        so a page on another origin cannot read it; the web booking page does not need it.'
      headers:
        Retry-After:
          required: true
          description: 'Delay-seconds form of RFC 9110 section 10.2.3 (never the HTTP-date form): seconds
            remaining in the client''s booking window, rounded up.'
          schema:
            type: integer
            minimum: 1
            maximum: 600
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingRateLimitError'
    BookingSlotsRateLimited:
      description: 'The client has already made 120 requests to `getPublicBookingSlots` in its current
        1-minute window (NEW-booking-rate-limit). Nothing was looked up. Body: `{"error":"rate limit exceeded"}`,
        Content-Type application/json. `Retry-After` is the whole number of seconds until the client''s
        window ends, rounded up, never less than 1 and never more than 60. Not exposed to cross-origin
        pages, as for `BookingCreateRateLimited`.'
      headers:
        Retry-After:
          required: true
          description: 'Delay-seconds form of RFC 9110 section 10.2.3 (never the HTTP-date form): seconds
            remaining in the client''s slot-listing window, rounded up.'
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingRateLimitError'
    BookingUnauthorized:
      description: 'Emitted by the requireAuth middleware when the `auth_token` cookie and the `Authorization:
        Bearer` header are both absent or invalid. The body is the JSON text `{"error":"unauthorized"}`
        but the response is sent with `http.Error`, so the Content-Type header is `text/plain; charset=utf-8`,
        not application/json.'
      content:
        text/plain:
          schema:
            type: string
            const: '{"error":"unauthorized"}

              '
    CalendarNotConnected:
      description: 'Either the requireAuth middleware rejected the request (text/plain, MiddlewareUnauthorized),
        or the session is valid but the caller has no stored Google Calendar credential, so an operation
        that must read or write their calendar cannot run. The second case is application/json with the
        exact body `{"error":"calendar not connected"}`: no provider, Go or storage error text and no
        user id (PAC-21, API-054). A failure to READ the credential store is not this response; it is
        the operation''s 500. The two cases are told apart by Content-Type, or by the body. The web app''s
        Dashboard decides "not connected" from GET /api/auth/status, not from this 401; no web code signs
        the user out on this 401 (only a 401 on GET /api/auth/me does).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CalendarNotConnectedError'
        text/plain:
          schema:
            $ref: '#/components/schemas/MiddlewareUnauthorized'
    Forbidden:
      description: The habit exists but belongs to another user. Body is `{"error":"forbidden"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Body is `{"error":"internal error"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JsonError:
      description: JSON error envelope from writeError.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JsonForbidden:
      description: 'JSON error "forbidden". Emitted when the caller is not a member of `team_id`, when
        the route requires ownership and the caller''s role is not "owner", AND when the team simply does
        not exist — the membership lookup error is not distinguished from a role mismatch.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JsonUnauthorized:
      description: 'JSON error "unauthorized" from the handler''s own uuid.Nil check. In production this
        is shadowed by the requireAuth middleware, which emits its own `{"error":"unauthorized"}` via
        http.Error with a Content-Type of application/json.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No habit with that id. Body is `{"error":"not found"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SchedulingLinkValidationError:
      description: 'Validation failure from validateSchedulingLink / parseClock. Messages: "title is required";
        "at least one duration is required"; "durations must be positive integers"; "at least one day
        is required"; "days_of_week must contain values between 0 and 6"; "window times must use HH:MM";
        "window_start must be before window_end"; "buffers must be zero or positive"; "min_notice_minutes
        must be zero or positive"; "usage_type must be reusable, recurring, or single_use"; "max_uses
        must be set to a positive integer for recurring links"; "slug cannot be empty" (PATCH only).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingError'
    ServerError:
      description: 'A server-side failure. JSON error envelope (application/json) with a fixed, server-chosen
        message: "internal error" on the /api/teams routes, "internal error" or "db error" on the /api/manager
        routes. Never the storage or engine error text, which is written to the server log and Sentry
        only (PAC-21). Replaces PlainTextServerError, the text/plain response these routes documented
        before PAC-21 was finished.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SettingsValidationError:
      description: 'Malformed JSON, or a value the server refuses. JSON error shape (writeError). A body
        property set to `null` is refused here: no property of SettingsUpdate is nullable (spec AC-8).

        Messages that already exist: `invalid JSON` (the body cannot be read; fixed text, PAC-21: before,
        the read error was appended); `invalid JSON: the body must be an object` (the body is not a JSON
        object, or is `null`; an existing fixed literal, unchanged); `invalid JSON: <property> has the
        wrong type` (a value of the wrong JSON type; `<property>` is the dotted path of JSON property
        names from the request, e.g. `timeFormat` or `workingHours.days.monday.start`, never a Go type
        or struct name; before PAC-21 was finished this was the decoder''s own error text, which named
        Go types); `<field> must be in HH:MM format` (workStart/workEnd/lunchStart/lunchEnd); `focusMinBlockMinutes
        must be positive`; `focusMaxBlockMinutes must be positive`; `focusDailyTargetMinutes must be positive`;
        `outOfHoursMeetingsPerWeek must be zero or positive`; `bufferBeforeMinutes must be positive`;
        `bufferAfterMinutes must be positive`; `autoScheduleCron must be a 5-part cron expression`; `autoScheduleCron
        is invalid` (fixed text; before PAC-21 was finished the cron parser''s error was appended); `llmProvider
        must be one of: openai, anthropic, ollama, bedrock, azure_openai, vertex`; `workingHours.mode
        must be all_days or by_day`; `workingHours.mode is required when day-specific hours are provided`;
        `workingHours.days.<day> is not a valid weekday`; `lunchBreaks.<day> is not a valid weekday`;
        `<field> requires start and end when enabled`; `<field> start and end must be in HH:MM format`;
        `<field> end must be after start`.

        Messages PAC-24 adds, closing API-081 and API-082 - each of these is a value the server accepted
        before and then failed on, silently or as a 500 (spec AC-17): `workEnd must be after workStart`;
        `lunchEnd must be after lunchStart`; `focusMinBlockMinutes must not exceed focusMaxBlockMinutes`;
        `bufferMinMeetingMinutes must be zero or positive`; `timezone is not a known IANA location`; `recapSendTo
        must be dm or channel` (previously reached the DB CHECK and surfaced as a 500 - API-081); `recapSendTime
        must be in HH:MM format` (previously reached the Postgres TIME cast and surfaced as a 500); `calendarProvider
        must be one of: google, outlook, webcal` (resolves U-18); `conferencingProvider must be one of:
        meet, zoom, teams`.

        Message PAC-55 adds: `timeFormat must be 12h or 24h`, for `""` and any other string (a non-string
        is `invalid JSON: timeFormat has the wrong type`).

        Messages revision 2 of this contract adds, each with its reason: `recapSendTime must be in HH:MM
        format` now also covers `""`. The write path previously substituted `08:00` for an empty value
        (`recapSendTimeOrDefault`, `backend/storage/settings.go:356-361`); under the merge rule a present
        property must be stored exactly as given, so a silent substitution is a contract violation and
        the empty value is refused instead. See `Settings.recapSendTime`; this is the one clock property
        for which `""` is NOT a value, and it needs a narrow amendment to spec AC-7. `workingHours.days
        must contain at least one weekday when mode is by_day` - a `by_day` document with an empty `days`
        map is the only remaining stored state that makes the consumer delete the working-hours section
        with no error (`smart-calendar-flow/src/api/client.ts:505-517,543`); the `all_days` equivalent
        is already normalised away on read (`backend/storage/settings.go:95-99`). Serves spec AC-20.

        `workingHours.days.<day> is not a valid weekday` and `lunchBreaks.<day> is not a valid weekday`
        are how a weekday key that is not exactly one of the seven lowercase names is refused: generators
        drop `propertyNames`, so the handler is the only enforcement point (revision 3/4).

        Messages PAC-66 adds, each produced only when the write CHANGES the property to a non-empty value
        (`""` is always accepted for all three, spec AC-15): `azureEndpoint must be an https URL whose
        host is approved for azure_openai on this deployment` (an unapproved host, a scheme other than
        `https`, a port other than 443, userinfo, or a value that does not parse as an absolute URL);
        `azureEndpoint cannot be set: azure_openai is not enabled on this deployment` (the operator approved
        no Azure host); `gcpLocation must be a region whose Vertex host is approved on this deployment`
        (including any value that changes the URL''s authority, e.g. `attacker.example/x`); `gcpLocation
        cannot be set: vertex is not enabled on this deployment`; `awsRegion must be a valid AWS region
        name`. Each names the property first, so a client can attach it to the field.

        Messages PAC-66-B adds, under the same changed-and-non-empty rule (`""` is always accepted for
        both, spec AC-B14): `llmBaseUrl must be the scheme, host and port of an OpenAI, Anthropic or Ollama
        destination approved on this deployment` (a value approved for none of the three providers, or
        one carrying a path, query, fragment, userinfo or whitespace; spec AC-B3, AC-B6, AC-B18, AC-B19);
        `ollamaBaseUrl must be the scheme, host and port of an Ollama server approved on this deployment`
        (spec AC-B4, AC-B18); `ollamaBaseUrl cannot be set: ollama is not enabled on this deployment`
        (the operator approved no Ollama origin).

        `""` is NOT in this catalogue for `workStart`, `workEnd`, `lunchStart` or `lunchEnd`. It is a
        valid value for all four, on read and on write (spec AC-7); the handler already skips the format
        check for it (`backend/api/handlers_settings.go:75`).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulingErrorResponse'
    Unauthorized:
      description: 'No `auth_token` cookie and no `Authorization: Bearer <jwt>` header, or the token

        failed validation, or its `sub` is not a UUID. Emitted by `requireAuth`.

        QUIRK: the body is the JSON text `{"error":"unauthorized"}` but it is written with

        `http.Error`, which overwrites the Content-Type to `text/plain; charset=utf-8`.

        Clients must not rely on the declared media type here.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      description: 'The provider calendar event id (`calendar_event_id` in meeting_briefs), used as an

        opaque string — no UUID or format validation is performed. Because it is a single

        chi path segment it cannot contain an unencoded `/`.

        '
      schema:
        type: string
        minLength: 1
    HabitId:
      name: id
      in: path
      required: true
      description: Habit id. Parsed with `uuid.Parse`, which also accepts the unhyphenated, braced and
        `urn:uuid:` spellings.
      schema:
        type: string
        format: uuid
    InviteTokenPath:
      name: token
      in: path
      required: true
      description: 'Opaque invite token — a UUID string generated by CreateTeamInvite. Not validated as
        a UUID by the handler; any string is looked up verbatim.

        '
      schema:
        type: string
    LoginHint:
      name: login_hint
      in: query
      required: false
      schema:
        type: string
      description: 'The email the user typed, forwarded to the provider as the OAuth/OIDC

        `login_hint` so it can preselect or prefill that account (PAC-35,

        API-064). Advisory only (spec PAC-35 D-4): it never selects, creates or

        links a Paceday account; the account signed in is the one the provider

        authenticates, checked exactly as before.

        The LoginHint rule: the value is forwarded only when it is a bare email

        address, meaning all of: (1) at most 254 characters; (2) exactly one

        `@`; (3) Go''s `net/mail.ParseAddress` accepts it with an empty display

        name and an `Address` equal to the whole value (so no `<...>`, display

        name, comment, whitespace or other extra text); (4) the local part

        (before `@`) uses only `A-Z a-z 0-9 . _ + - ''` (the apostrophe allows

        names such as `o''brien`); (5) the domain (after

        `@`) is a DNS hostname: two or more dot-separated labels, each matching

        `[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?`, the last one containing at

        least one letter, so no IP literal (`[127.0.0.1]` or `127.0.0.1`) and

        no single-label host (`localhost`). Anything else, including an empty

        value, is dropped silently and sign-in starts without a hint. Examples

        dropped (spec AC-10, "a hint carrying extra URL parameters"):

        `alice@acme.com&prompt=none`, `alice&prompt=none@acme.com`,

        `alice@acme.com?x=y`, `alice@acme.com#frag`, `alice@[127.0.0.1]`,

        `alice@localhost`, `alice@acme`. Examples forwarded: `alice@acme.com`,

        `o''brien@acme.com`.

        When `login_hint` is repeated, only the first value is considered

        (`url.Values.Get`); the others are ignored.

        It is never a 400: the schema is a plain string on purpose, because a

        malformed hint must not stop a sign-in (spec AC-10). The forwarded

        value is URL-encoded by the OAuth library, so it cannot add a parameter

        to the provider request, and no other query parameter of the start

        request is forwarded.

        '
    MemberEmailPath:
      name: email
      in: path
      required: true
      description: 'The roster member''s email address, percent-encoded in the path (the `@` MUST be sent
        as %40 — chi splits on `/` only, but the frontend and the Go tests both use encodeURIComponent/%40
        form). The handler applies url.PathUnescape to the raw chi param and falls back to the raw value
        if unescaping fails. Storage lowercases and trims before matching, so lookup is case-insensitive
        even though this path segment is not normalized by the handler itself.

        '
      schema:
        type: string
        format: email
      examples:
        encoded:
          value: member%40example.com
    OptionalTeamIdQuery:
      name: team_id
      in: query
      required: false
      description: 'Formal team UUID. Optional on this route. When ABSENT the handler operates on the
        manager''s global (un-scoped) roster and performs NO authorization check beyond JWT. When present
        it must parse as a UUID and the caller must be a member (reads) or the owner (writes) of that
        team.

        '
      schema:
        type: string
        format: uuid
    RequiredTeamIdQuery:
      name: team_id
      in: query
      required: true
      description: 'Formal team UUID. Required on this route: a missing or whitespace-only value is 400
        "team_id is required".

        '
      schema:
        type: string
        format: uuid
    SchedulingLinkIdPath:
      name: id
      in: path
      required: true
      description: Scheduling-link UUID. Parsed with uuid.Parse; a non-UUID value yields 400 "invalid
        id".
      schema:
        type: string
        format: uuid
    TeamIdPath:
      name: id
      in: path
      required: true
      description: Formal team UUID.
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'HS256 JWT issued by backend/auth/jwt.go GenerateToken. Claims: `sub`

        (user uuid, string), `email`, `exp` (+7 days), `iat`.

        middleware.requireAuth accepts it as `Authorization: Bearer <jwt>`.

        Since PAC-39 (API-008) the header wins over the `auth_token` cookie: when

        a `Bearer ` header is present its token is the only credential

        considered, whatever the cookie holds, and an invalid bearer token is a

        401 with no fallback to the cookie.

        '
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: 'The same HS256 JWT, set httpOnly / SameSite=Lax / Max-Age=604800 / Path=/

        by the OAuth and OIDC callbacks. This is the transport the shipped

        frontend uses (both fetch wrappers send `credentials: "include"` and

        never set an Authorization header). It is consulted only when the request

        carries no `Authorization: Bearer` header (PAC-39, API-008).

        '
