    Habit:
      type: object
      description: storage.Habit. Every field is emitted — no `omitempty` anywhere on this struct.
      required:
      - id
      - user_id
      - title
      - duration_minutes
      - days_of_week
      - window_start
      - window_end
      - priority
      - color
      - active
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        days_of_week:
          type: array
          description: Monday=1 … Sunday=7. Non-empty, unique, ascending only by convention (insertion
            order is preserved by the DB array).
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        window_start:
          type: string
          description: Local clock time, exactly `HH:MM` (5 chars, zero-padded).
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        window_end:
          type: string
          description: Local clock time, exactly `HH:MM`. Strictly greater than `window_start`.
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        priority:
          type: integer
          description: Higher wins when habits compete for the same slot. Scheduling order is `priority
            DESC, created_at ASC`.
          minimum: 0
          maximum: 100
        color:
          type: string
          description: 'Hex color. NOT validated by the backend — any string is accepted and stored.

            Only "#5B7FFF", "#E9B949" and "#9B7AE0" map to a dedicated Google Calendar

            color id; everything else falls back to graphite.

            '
        active:
          type: boolean
          description: Set false by DELETE. Never settable at creation; settable via PATCH.
        created_at:
          type: string
          format: date-time
    HabitCreateRequest:
      type: object
      description: 'Anonymous request struct in handlers_habits.go `create`. Unknown keys are ignored

        (the decoder does not call DisallowUnknownFields). `active` cannot be set here.

        '
      required:
      - title
      - duration_minutes
      properties:
        title:
          type: string
          description: Trimmed server-side. Must be non-empty and ≤200 runes after trimming.
          maxLength: 200
        duration_minutes:
          type: integer
          description: Required in practice — the Go zero value 0 fails validation.
          minimum: 1
          maximum: 1440
        days_of_week:
          type: array
          description: 'Monday=1 … Sunday=7. Absent or `null` defaults to [1,2,3,4,5]. An explicitly

            empty array `[]` is NOT defaulted and fails validation.

            '
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        window_start:
          type: string
          description: Defaults to "09:00" when absent or blank after trimming.
          default: 09:00
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        window_end:
          type: string
          description: Defaults to "17:00" when absent or blank after trimming. Must be strictly after
            `window_start`.
          default: '17:00'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        priority:
          type: integer
          description: 'Defaults to 50. WARNING: the handler tests `if body.Priority == 0`, so an

            explicit `"priority": 0` is indistinguishable from omission and also becomes 50.

            Priority 0 can only be reached via PATCH.

            '
          default: 50
          minimum: 1
          maximum: 100
        color:
          type: string
          description: Defaults to "#5B7FFF" when absent or empty. Not validated.
          default: '#5B7FFF'
    HabitOccurrence:
      type: object
      description: storage.HabitOccurrence — one materialised instance of a habit on a date.
      required:
      - id
      - habit_id
      - scheduled_date
      - start_time
      - end_time
      - status
      - calendar_event_id
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        habit_id:
          type: string
          format: uuid
        scheduled_date:
          type: string
          format: date-time
          description: 'The DB column is a DATE, but the Go field is `time.Time`, so it serialises as
            a

            full RFC3339 timestamp at midnight UTC (e.g. "2026-03-04T00:00:00Z"), NOT as

            "2026-03-04". Parsed from the DB with a failure-swallowing `time.Parse`, so a

            malformed stored value would surface as the zero time "0001-01-01T00:00:00Z".

            '
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string
          description: 'Written by the engine as well as by the API. "scheduled" (placed), "completed"

            (user-confirmed; survives reoptimization), "displaced" (its slot was taken and

            rescheduling is being attempted), "missed" (no slot fit in the window).

            Only "scheduled" and "completed" are settable via the API.

            '
          enum:
          - scheduled
          - completed
          - displaced
          - missed
        calendar_event_id:
          type: string
          description: Google Calendar event id for the mirrored event. Empty string when no calendar
            is connected or event creation failed. Never null.
        created_at:
          type: string
          format: date-time
    HabitOccurrenceStatusUpdate:
      type: object
