  /api/settings:
    get:
      operationId: getSettings
      tags:
      - settings
      summary: Read the caller's settings document
      description: 'Registered as `r.Route("/api/settings", ...)` + `r.Get("/", ...)`, so chi serves both
        `/api/settings` and `/api/settings/`.

        Returns the settings of the AUTHENTICATED CALLER. When the caller has no settings row yet, one
        is created from the SQL defaults and returned, so this operation never 404s and a second read
        returns the same row rather than creating another (spec AC-2).

        `llmApiKey` is never returned, by this or any other operation (`writeOnly: true`). `llmApiKeySet`
        reports whether a key is on file (spec AC-11, AC-12).

        Before PAC-24 this read `WHERE id = 1` - a row shared by every authenticated caller, which after
        migration 018''s backfill is the earliest-created user''s own row - and returned `llmApiKey` in
        cleartext (API-002, API-003).

        '
      responses:
        '200':
          description: The settings document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '500':
          description: 'DB failure. Body: `{"error":"internal error"}`. The detail is written to the server
            log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    patch:
      operationId: patchSettings
      tags:
      - settings
      summary: Change some of the caller's settings
      description: "MERGE, at the top level, against the CALLER'S OWN settings. This is the ONLY write\
        \ operation for settings: PAC-24 removes `PUT /api/settings` rather than retaining it as a deprecated\
        \ alias, for the reasons in the comment on this path and in `contracts/features/PAC-24.md` §3.\n\
        The rule is total and needs no knowledge of what is stored:\n* **Property absent** -> unchanged.\
        \ * **Property present** -> set to exactly that value. `\"\"`, `0` and\n  `false` are values,\
        \ not absences: they clear, zero and disable. This is\n  how a setting is cleared, including `llmApiKey`\
        \ (spec AC-7, AC-13).\n* **Property present and `null`** -> 400. No property of this body is\n\
        \  nullable, so a null fails schema validation and nothing is stored\n  (spec AC-8).\n* **`workingHours`\
        \ and `lunchBreaks`** are replaced WHOLE when present -\n  there is no deep merge and no per-day\
        \ merge, so a weekday omitted from\n  a supplied map is REMOVED. `lunchBreaks: {}` clears every\
        \ per-day lunch\n  override (spec AC-9).\n* **`llmApiKeySet` and `updatedAt`** are `readOnly`.\
        \ They may be present -\n  a client that submits back a document it just read will include them\
        \ -\n  and are ignored (spec AC-10).\n\nThe response is a fresh read of the caller's row, so it\
        \ reflects normalisation (e.g. `workingHours` defaulting) rather than the submitted body, and\
        \ it does not contain `llmApiKey`.\n**PAC-66 destination rules.** When a write CHANGES `azureEndpoint`,\
        \ `gcpLocation` or `awsRegion` to a non-empty value, that value is checked whichever provider\
        \ is selected (spec AC-5, AC-7): `azureEndpoint` must be an `https` URL whose host is approved\
        \ for `azure_openai`; `gcpLocation` must build a Vertex host approved for `vertex`; `awsRegion`\
        \ must be a valid AWS region name (one host label; the Bedrock host itself is checked when a request\
        \ is sent). A refused value is a 400 naming the property, and nothing in the body is stored. Three\
        \ things are deliberately NOT refused here: `\"\"` for any of the three (a user can always clear\
        \ a bad value, spec AC-15, D-3); a value equal to the one already stored (the changed-only rule\
        \ above, PAC-24 AC-17, spec AC-9); and a write that changes only `llmProvider`, even onto a stored\
        \ unapproved endpoint (spec AC-17). Each of those is refused when a request would be sent instead\
        \ (see `testLLMConnection`). The server never rewrites or clears a stored value (spec D-3).\n\
        **PAC-66-B destination rules.** When a write CHANGES `llmBaseUrl` or `ollamaBaseUrl` to a non-empty\
        \ value, that value is checked whichever provider is selected (spec AC-B3, AC-B4, AC-B18, AC-B19):\
        \ it must be exactly `<scheme>://<host>[:<port>]` with at most one trailing `/`. `ollamaBaseUrl`\
        \ must then be an origin approved for `ollama`. `llmBaseUrl` is read by all three of `openai`,\
        \ `anthropic` and `ollama`, so it must be approved for AT LEAST ONE of them (the vendors' public\
        \ hosts count; spec D-B5); being approved for one provider does not make it a destination for\
        \ another, which is checked when a request would be sent. A refused value is a 400 naming the\
        \ property, and nothing in the body is stored. As for PAC-66, `\"\"` is always accepted (a user\
        \ can always clear a bad value; clearing means the provider's fallback, spec §B4), an unchanged\
        \ value is not re-checked, and a write that changes only `llmProvider` is not refused (spec AC-B14,\
        \ D-B4).\nBefore PAC-24 there was no PATCH; the only write was a full-replace PUT that persisted\
        \ every omitted field as its Go zero value (API-004).\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: The re-read settings document for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/SettingsValidationError'
        '500':
          description: 'Load, save or re-read failure. Body: `{"error":"internal error"}`. The detail
            is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/settings/daily-recap:
    get:
      operationId: getDailyRecapSettings
      tags:
      - daily-recap
      summary: Read the caller's daily-recap settings
      description: 'A snake_case projection of seven `recap*` fields of the CALLER''S OWN settings row
        - the same row GET /api/settings exposes in camelCase. The two representations are hand-maintained
        and can drift (`recapIncludeFocus` <-> `include_focus_blocks`).

        Before PAC-24 this read the singleton row, so every user saw and edited one shared recap configuration
        (API-002).

        '
      responses:
        '200':
          description: Daily-recap settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapSettings'
        '500':
          description: 'DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    patch:
      operationId: patchDailyRecapSettings
      tags:
      - daily-recap
      summary: Partially update the caller's daily-recap settings
      description: 'A partial update of the CALLER''S OWN recap settings. A property absent from the body
        is left unchanged; a property present is applied. No property is nullable, so an explicit `null`
        is a 400 - this matches PATCH /api/settings (spec AC-8) and is a change: the handler''s pointer
        fields previously treated `null` as "leave unchanged", which made a typo indistinguishable from
        an omission.

        Returns 204 with an EMPTY body on success - it does not echo the new state.

        Before PAC-24 this patched the singleton row, and the underlying write was a full-row write that
        also rewrote every NON-recap column of that row from the values it had just read (API-002). It
        now writes only the recap columns of the caller''s row.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyRecapPatch'
      responses:
        '204':
          description: Updated. No body.
        '400':
          description: '`invalid JSON`; `send_to must be ''dm'' or ''channel''`; or - added by PAC-24,
            previously a 500 from the Postgres TIME cast - `send_time must be in HH:MM format`. Written
            with http.Error, so these are text/plain, NOT the JSON error shape.

            '
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 'DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/settings/daily-recap/preview:
    post:
      operationId: previewDailyRecap
      tags:
      - daily-recap
      summary: Render today's recap without sending it
      description: 'Builds the Slack Block Kit payload for the authenticated user at the current time
        IN THE CALLER''S TIMEZONE (`settings.timezone`, UTC when it cannot be resolved) - the same rule
        the scheduled recap uses - and returns it; the header names that zone and every time in the recap
        is rendered in it. No request body is read. Nothing is sent to Slack and no Slack connection is
        required.

        Before PAC-24 the day''s content was the caller''s but the recap configuration driving it (which
        sections to include) came from the singleton row, so a preview could omit sections the caller
        had enabled (API-002), and it was built in the server''s zone. Both now come from the caller''s
        row.

        '
      responses:
        '200':
          description: Rendered Slack blocks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapPreview'
        '500':
          description: 'DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/settings/daily-recap/test:
    post:
      operationId: sendDailyRecapTest
      tags:
      - daily-recap
      summary: Send a test recap to Slack
      description: 'Requires a stored `slack` workspace connection for the authenticated user. Destination
        comes from the CALLER''S OWN stored settings (`recapSendTo`, `recapChannelId`), not from the request
        - no request body is read. The message is built at the current time in the caller''s timezone,
        as for the preview. The Slack call is bounded by a 10s context timeout.

        Before PAC-24 the destination came from the singleton row, so a test send could be addressed to
        a channel another user had configured (API-002).

        '
      responses:
        '200':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapTestResult'
        '400':
          description: '`Slack not connected` (also returned when the workspace-connection lookup errors
            for any other reason). text/plain (http.Error).

            '
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 'DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '502':
          description: 'Sending the test message failed. Body: `{"error":"upstream provider error"}`.
            The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/teams:
    post:
      operationId: createTeam
      tags:
      - teams
      summary: Create a formal team; the caller becomes its owner.
      description: 'Registered via chi `r.Route("/api/teams")` + `r.Post("/")`, so both `/api/teams` and
        `/api/teams/` route here. The owner team_members row is inserted with its error discarded, so
        a failed AddTeamMember still returns 201 with an ownerless team.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamNameRequest'
      responses:
        '201':
          description: Created team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: 'JSON error "name is required" — covers both a malformed body and a blank/ whitespace-only
            name (one branch, one message).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/JsonUnauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      operationId: listTeams
      tags:
      - teams
      summary: All teams the caller belongs to, newest first.
      description: 'Bare JSON array (no envelope), ordered by teams.created_at DESC. Always an array,
        never null.

        '
      responses:
        '200':
          description: Teams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/JsonUnauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/teams/invites/{token}:
    get:
      operationId: getTeamInvite
      tags:
      - teams
      summary: Preview a pending team invite by token.
      description: 'Registered inside the requireAuth group and therefore requires a valid JWT. The handler
        comment says "(public)", which is wrong (API-089); PAC-34 corrects the comment, not the routing.
        Calls ExpireOldInvites first, so an invite past expires_at is reported as 410 "invite is expired"
        rather than 200. PAC-34 (API-021): the 200 also carries team_id, expires_at and inviter_email,
        so the invite page can show who invited the caller and when the link expires. The audience is
        unchanged: any authenticated caller holding the token, as before (the invitee email is checked
        on accept, not on preview). The token is still not echoed; the caller already has it in the path.

        '
      parameters:
      - $ref: '#/components/parameters/InviteTokenPath'
      responses:
        '200':
          description: Invite preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitePreview'
        '404':
          description: JSON error "invite not found".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 'JSON error "invite is <status>" where status is accepted, declined or expired.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/teams/invites/{token}/accept:
    post:
      operationId: acceptTeamInvite
      tags:
      - teams
      summary: Accept a pending invite as the logged-in user.
      description: 'The authenticated user''s email must case-insensitively equal invitee_email. Membership
        is added with role "member" via an ON CONFLICT DO NOTHING insert, so accepting twice cannot demote
        an existing owner. Returns no body.

        '
      parameters:
      - $ref: '#/components/parameters/InviteTokenPath'
      responses:
        '204':
          description: Invite accepted; membership created. Empty body.
        '401':
          $ref: '#/components/responses/JsonUnauthorized'
        '403':
          description: JSON error "this invite is for a different email address".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: JSON error "invite not found".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: JSON error "invite is <status>".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/teams/{id}:
    parameters:
    - $ref: '#/components/parameters/TeamIdPath'
    get:
      operationId: getTeam
      tags:
      - teams
      summary: One team plus its members.
      description: 'Membership required. `members` is the raw result of ListTeamMembers with its error
        discarded, ordered by joined_at ASC, and is `[]` whenever the list is empty or the query failed
        (PAC-28).

        '
      responses:
        '200':
          description: Team detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetail'
        '400':
          description: JSON error "invalid team id".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '404':
          description: 'JSON error "not found".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-uncertain: 'Practically unreachable: the membership check runs first and a team_members row
            cannot exist without its team (FK + ON DELETE CASCADE), so a missing team yields 403 before
            this branch. Kept because the code path exists.

            '
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      operationId: renameTeam
      tags:
      - teams
      summary: Rename a team. Owner only.
      responses:
        '200':
          description: 'The re-read team. Never `null`: since PAC-26 (API-032) a failed re-read is the
            500 `internal error` below instead of a 200 whose body is the JSON literal `null`. The rename
            has committed when that 500 is sent.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: JSON error "invalid team id" or "name is required".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamNameRequest'
    delete:
      operationId: deleteTeam
      tags:
      - teams
      summary: Delete a team. Owner only.
      description: 'Cascades to team_members, team_invites, no_meeting_zones and manager_team_member_assignments
        via FK ON DELETE CASCADE.

        '
      responses:
        '204':
          description: Deleted. Empty body.
        '400':
          description: JSON error "invalid team id".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/teams/{id}/analytics:
    get:
      operationId: getFormalTeamAnalytics
      tags:
      - teams
      summary: Aggregate meeting/focus minutes across a formal team for one week.
      description: 'Membership required. Unlike GET /api/manager/analytics this reads the analytics_weeks
        table directly per team member, with no consent check and no FreeBusy fallback. Averages divide
        by the member count (or by 1 when the team is empty) using integer division.

        '
      parameters:
      - $ref: '#/components/parameters/TeamIdPath'
      - name: date
        in: query
        required: false
        description: 'Any date in the target week, YYYY-MM-DD. Snapped to that week''s Monday in the parsed
          value''s location (UTC). Defaults to the current local week''s Monday.

          '
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Team analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAnalytics'
        '400':
          description: JSON error "invalid team id" or "date must be YYYY-MM-DD".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/teams/{id}/availability:
    get:
      operationId: getTeamAvailability
      tags:
      - teams
      summary: Slots on one day where every team member is free.
      description: 'Membership required. The engine searches a fixed 09:00-18:00 UTC window on `date`,
        steps the cursor in 15-minute increments, treats no-meeting zones and busy calendar events as
        hard blocks, and scores each slot 0-100 by how few members'' focus blocks it disrupts. A member
        whose calendar token is missing or whose calendar call fails contributes no busy intervals and
        is silently treated as fully free. `slots` is always an array, never null.

        '
      parameters:
      - $ref: '#/components/parameters/TeamIdPath'
      - name: date
        in: query
        required: true
        description: Day to search, YYYY-MM-DD, interpreted in UTC. Missing or malformed yields 400.
        schema:
          type: string
          format: date
      - name: duration
        in: query
        required: false
        description: Slot length in minutes. Defaults to 60. Must be 1..1440.
        schema:
          type: integer
          minimum: 1
          maximum: 1440
          default: 60
      responses:
        '200':
          description: Candidate slots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSlotList'
        '400':
          description: 'JSON error "invalid team id", "date must be YYYY-MM-DD", or "duration must be
            a positive integer (minutes)".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/teams/{id}/members/invite:
    post:
      operationId: inviteTeamMember
      tags:
      - teams
      summary: Create a 7-day team invite and email it. Owner only.
      parameters:
      - $ref: '#/components/parameters/TeamIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteEmailRequest'
      responses:
        '201':
          description: 'The created invite INCLUDING its raw `token`, so the owner can share the link
            out of band. expires_at is now + 7 days. Email delivery is fire-and-forget and silently skipped
            when SMTP_HOST/SMTP_FROM are unset.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvite'
        '400':
          description: JSON error "invalid team id" or "email is required".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: JSON error "email must be a valid email address".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags:
      - teams
      summary: Remove a member by user id. Owner, or the member themselves; never the last owner.
      description: 'An owner of the team may remove anyone; any caller may remove themselves. A removal
        that would leave the team with zero owners is refused with 422 and changes nothing (PAC-25, API-023).
        Check order, fixed so that a non-owner cannot learn who the owner is from the answer: 400 malformed
        ids; then, when the caller is not the target, 403 unless the caller is an owner; then 422 if the
        target is an owner and no other owner of the team would remain; then the removal, 204. The guard
        counts owners ("would leave zero owners", PAC-25 D-4), it does not refuse every owner: in a team
        with two owners either may leave, and the second to try is refused. No interleaving of concurrent
        removals may leave the team with zero owners (PAC-25 D-6). A sole owner who is also the only member
        is refused too; deleting the team (DELETE /api/teams/{id}) stays the way to be rid of it (PAC-25
        D-5). The manager-domain DELETE /api/manager/team/members/{email} keeps its own, role-based rule
        (it refuses removing any owner) with the same 422 wording (PAC-25 D-3).

        '
      parameters:
      - $ref: '#/components/parameters/TeamIdPath'
      - name: userId
        in: path
        required: true
        description: The Paceday user id (UUID) of the member to remove.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Removed (idempotent — removing a non-member also returns 204). Empty body.
        '400':
          description: JSON error "invalid team id" or "invalid user id".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: 'JSON error "the team owner cannot be removed" (the manager-domain wording). The
            target is an owner of the team and removing them would leave the team with no owner. Evaluated
            after the 403 check, so a caller who is not an owner never receives it (naming someone else
            is 403; naming themselves, they are not an owner). Nothing is written: the membership and
            its role are unchanged.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: the team owner cannot be removed
        '500':
          $ref: '#/components/responses/ServerError'
  /api/teams/{id}/no-meeting-zones:
    parameters:
    - $ref: '#/components/parameters/TeamIdPath'
    post:
      operationId: createNoMeetingZone
      tags:
      - teams
      summary: Create a recurring weekly no-meeting zone. Owner only.
      description: 'The WIRE weekday convention is Monday=1 .. Sunday=7. Storage uses Go''s Sunday=0 ..
        Saturday=6; the handler converts 7 -> 0 on write and 0 -> 7 on read (TestNoMeetingZone_ValidatesAndConvertsWeekdayAtBoundary
        asserts both halves).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoMeetingZoneRequest'
      responses:
        '201':
          description: Created zone, dayOfWeek already converted back to the 1..7 wire convention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoMeetingZone'
        '400':
          description: JSON error "invalid team id" or "invalid JSON".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: 'JSON error. "dayOfWeek must be between 1 and 7" (note: 0 is rejected, so an omitted
            dayOfWeek always fails); "startTime and endTime are required"; "startTime must be HH:MM";
            "endTime must be HH:MM"; "startTime must be before endTime" (equal times are rejected).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      operationId: listNoMeetingZones
      tags:
      - teams
      summary: All no-meeting zones for a team. Membership required.
      description: 'Bare JSON array, always present (never null), ordered by the STORED day_of_week then
        start_time — which means Sunday sorts FIRST because it is stored as 0, even though it is emitted
        as dayOfWeek 7.

        '
      responses:
        '200':
          description: Zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoMeetingZone'
        '400':
          description: JSON error "invalid team id".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/teams/{id}/no-meeting-zones/{zoneId}:
    parameters:
    - $ref: '#/components/parameters/TeamIdPath'
    - name: zoneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateNoMeetingZone
      tags:
      - teams
      summary: Replace a no-meeting zone. Owner only.
      description: 'PATCH by name, PUT by behaviour: every field is taken from the body with no merge
        against the stored row, so an omitted dayOfWeek becomes 0 and fails validation with 422. The update
        is scoped by BOTH zone id and team id, so a zone belonging to another team returns 404. Ownership
        is checked before the zoneId is even parsed.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoMeetingZoneRequest'
      responses:
        '200':
          description: Updated zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoMeetingZone'
        '400':
          description: JSON error "invalid team id", "invalid zone id" or "invalid JSON".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '404':
          description: JSON error "zone not found".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: JSON error — same validation messages as createNoMeetingZone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteNoMeetingZone
      tags:
      - teams
      summary: Delete a no-meeting zone. Owner only.
      responses:
        '204':
          description: Deleted (idempotent — deleting an unknown zone also returns 204). Empty body.
        '400':
          description: JSON error "invalid team id" or "invalid zone id".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  schemas:
    AddEventConferenceRequest:
      type: object
