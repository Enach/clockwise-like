      responses:
        '200':
          description: Connection status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/llm/test:
    post:
      operationId: testLLMConnection
      tags:
      - llm
      summary: Probe an LLM provider configuration
      description: "Probes a provider configuration by issuing a fixed completion (system \"You are a\
        \ helpful assistant.\", user \"Say hello\").\nPAC-24 resolves API-037. **THE DESTINATION IS NEVER\
        \ SUPPLIED BY THE CALLER.** Every value that contributes to the URL this server requests — `llmBaseUrl`,\
        \ `ollamaBaseUrl`, `azureEndpoint`, `azureDeployment`, `azureApiVersion`, `awsRegion`, `awsProfile`,\
        \ `bedrockModel`, `gcpProject`, `gcpLocation`, `vertexModel` — is read from the CALLER'S OWN stored\
        \ settings and from nowhere else. The request body may carry only `llmProvider`, `llmModel` and\
        \ `llmApiKey`, none of which reaches a URL (`backend/nlp/llm_factory.go:13-58`: `llmModel` is\
        \ consulted only by the `openai` and `anthropic` branches, where it is a JSON body field, and\
        \ `llmApiKey` only as an `Authorization` header value).\nThis is a security property of the contract,\
        \ not a convenience, and the invariant is: **a credential the caller did not supply is never sent\
        \ to a destination the caller did supply — because the caller cannot supply a destination at all.**\
        \ An earlier draft of this contract let a body override each endpoint property individually with\
        \ per-property fallback to the stored values. That let `{\"llmProvider\":\"openai\",\"llmBaseUrl\"\
        :\"https://attacker.example\"}` pair a caller-chosen host with the stored key: `nlp.NewLLMClientFromSettings`\
        \ builds `OpenAIClient{APIKey: s.LLMAPIKey, BaseURL: s.LLMBaseURL}` (`backend/nlp/llm_factory.go:29`)\
        \ and `OpenAIClient.Complete` POSTs to `base + \"/v1/chat/completions\"` with `Authorization:\
        \ Bearer <key>` (`backend/nlp/parser.go:31,43`), so the stored key would leave the deployment\
        \ and the 200/502 would confirm delivery. An all-or-nothing body (supply the endpoint AND the\
        \ key together) does not close it either: on the `azure_openai`, `bedrock` and `vertex` branches\
        \ the credential is AMBIENT and cannot be submitted — `AzureOpenAIClient.Complete` mints a token\
        \ with `azidentity.NewDefaultAzureCredential` and sends it as `Authorization: Bearer <token>`\
        \ to `c.Endpoint` (`backend/nlp/llm_azure_openai.go:28-50`) — so any submitted endpoint is necessarily\
        \ paired with a credential the caller did not supply. Refusing submitted destinations outright\
        \ is the only shape that holds for all six providers.\nWhat the body IS for: verifying a key that\
        \ has not been saved, now that a stored key can never be read back (see `SettingsUpdate.llmApiKey`),\
        \ and naming which provider the result is about (spec AC-15). The body is REQUIRED (revision 3):\
        \ `{}` probes the caller's stored configuration entirely - the pre-PAC-24 behaviour - and an absent\
        \ body is a 400, as the generated server wrapper already makes it (contract challenge r2, finding\
        \ 3). In the body, `\"\"` is a value like any other: `llmApiKey: \"\"` probes with no key and\
        \ `llmProvider: \"\"` probes with no provider, which is the 500 `{\"error\":\"internal error\"\
        }` (the configuration sentence is logged only, PAC-21).\nBefore PAC-24 the handler never read\
        \ r.Body at all and always probed the SINGLETON settings row, so this operation reported on the\
        \ deployment's saved configuration rather than on the caller's (API-002, API-037).\nNo response\
        \ on any status carries the submitted or the stored `llmApiKey` (PAC-24 spec AC-14). Since PAC-21\
        \ the 502 body is the fixed `upstream provider error` and no longer echoes the provider's own\
        \ text (`backend/api/server_errors.go`); the detail goes to the server log only.\n**PAC-66: the\
        \ deployment's cloud identity goes only to hosts the OPERATOR approved.** PAC-24 left one indirect\
        \ channel open: a caller could write `azureEndpoint` or `gcpLocation` into their OWN settings\
        \ with `PATCH /api/settings` and then probe, and on the three ambient-credential providers (`azure_openai`,\
        \ `vertex`, `bedrock`) the server sent the DEPLOYMENT'S cloud credential (an Entra ID token, a\
        \ Google ADC token, an AWS SigV4 signature) to the host those values built (`backend/nlp/llm_azure_openai.go:28-50`,\
        \ `llm_vertex.go:29-53`; a Vertex location such as `attacker.example/x` changes the URL's authority).\
        \ PAC-66 closes it for those three providers:\n* The operator names the approved inference hosts\
        \ per provider in\n  deployment configuration (`PACEDAY_LLM_APPROVED_HOSTS_AZURE_OPENAI`,\n  `PACEDAY_LLM_APPROVED_HOSTS_VERTEX`,\n\
        \  `PACEDAY_LLM_APPROVED_HOSTS_BEDROCK`; format in\n  `contracts/features/PAC-66.md` §4). No request\
        \ property and no\n  stored setting can add to that set. A host approved for one provider\n  is\
        \ not approved for another (spec D-8). Nothing approved means the\n  provider is not enabled on\
        \ this deployment (spec D-1, fail closed).\n\n* Before an ambient provider sends anything, the\
        \ server computes the\n  EFFECTIVE HOST of the inference request, the host it would actually\n\
        \  contact after every default is applied (Azure: the stored endpoint's\n  host, none when empty;\
        \ Vertex: `<location>-aiplatform.googleapis.com`,\n  `us-central1` when empty; Bedrock: the host\
        \ the AWS SDK resolves for\n  the stored region, `us-east-1` when empty, and the stored profile).\n\
        \  The request is sent only if that host, over `https` on the default\n  port, is approved for\
        \ the provider the probe USES: the body's\n  `llmProvider` when present, otherwise the stored\
        \ one (spec AC-18).\n  Otherwise this operation answers 422 and makes no outbound inference\n\
        \  request at all (spec AC-1, AC-2, AC-4, AC-7, AC-16, AC-19, AC-20).\n\n* The 422 is reported\
        \ whether or not a cloud credential could be\n  acquired: a destination refusal never surfaces\
        \ as the credential\n  error (spec, shared Given \"Refusal does not depend on the\n  credential\"\
        ).\n\n* A redirect from an approved host is never followed with the\n  deployment credential to\
        \ another host or to `http` (spec AC-8). It\n  is reported as the 502 below, because the approved\
        \ provider\n  answered and its answer was unusable.\n\n* The check is made on every send, not\
        \ only on write, so a value stored\n  before PAC-66 is refused here too (spec AC-9).\n\nFor the\
        \ three ambient providers an approved host is still approved whatever path, project, deployment\
        \ or model the stored values put in the URL; that sibling problem is recorded in `contracts/features/PAC-66.md`\
        \ §7 and is not solved by PAC-66 or PAC-66-B.\n**PAC-66-B: a user-set base URL goes only to a\
        \ destination approved for the provider in use.** On the user-key and keyless providers (`openai`,\
        \ `anthropic`, `ollama`) the destination is built from the caller's stored `llmBaseUrl` / `ollamaBaseUrl`.\
        \ Before PAC-66-B any scheme, host, port, path or query was used verbatim, so a caller could make\
        \ the server POST to any address it can reach and read the outcome as an oracle, and the server\
        \ followed redirects, re-sending an Anthropic `x-api-key` to any host (spec §B1, §B2.4). PAC-66-B\
        \ closes it (spec PAC-66 Part B; rationale in `contracts/features/PAC-70.md`):\n* **Approved destinations,\
        \ per provider, never transferred** (spec\n  D-B1, D-B2, D-B3, D-B5). `openai`: `https://api.openai.com`,\
        \ built in,\n  plus the hosts the operator lists in\n  `PACEDAY_LLM_APPROVED_HOSTS_OPENAI`. `anthropic`:\n\
        \  `https://api.anthropic.com`, built in, plus\n  `PACEDAY_LLM_APPROVED_HOSTS_ANTHROPIC`. Both\
        \ only over `https` on the\n  default port. `ollama`: only the origins (scheme, host and port)\
        \ the\n  operator lists in `PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA`, where `http`\n  and a non-default\
        \ port are allowed because Ollama carries no key;\n  nothing listed means Ollama is not enabled\
        \ on this deployment (fail\n  closed). A destination approved for one provider is never a\n  destination\
        \ for another, so a user's key never goes to an Ollama\n  origin (spec AC-B11). No request property\
        \ and no stored setting can\n  add to any of these sets.\n\n* **Effective destination** (spec\
        \ §B4). `openai` / `anthropic`: the\n  stored `llmBaseUrl`, or the vendor's public host when it\
        \ is `\"\"`. A\n  non-empty value with no usable host (e.g. `http:/`) is refused, never\n  replaced\
        \ by the public host. `ollama`: `ollamaBaseUrl`; when that is\n  `\"\"`, `llmBaseUrl`; when both\
        \ are `\"\"`, `http://localhost:11434`. The\n  fallback order is unchanged (spec D-B9); an account's\
        \ starting state\n  stores `ollamaBaseUrl` as `http://localhost:11434`, so the shared\n  `llmBaseUrl`\
        \ is not Ollama's destination until `ollamaBaseUrl` is\n  cleared.\n\n* **A base URL names a destination,\
        \ not an operation** (spec D-B8). It\n  is usable only when it is exactly `<scheme>://<host>[:<port>]`\
        \ with\n  at most one trailing `/`. Any other path, a `?` or `#` (even empty),\n  userinfo, or\
        \ surrounding whitespace makes it not approved. The\n  request is sent to exactly the provider's\
        \ chat operation on that\n  origin (`/v1/chat/completions`, `/v1/messages`, `/api/chat`) with\
        \ no\n  query.\n\n* **The check is made on every send, against the provider the probe\n  USES**\
        \ (the body's `llmProvider` when present, otherwise the stored\n  one), before anything else about\
        \ the request. A refusal is the 422\n  below and sends nothing, whether or not a key is on file\
        \ or\n  submitted: an `openai` or `anthropic` probe with a refused destination\n  and no key is\
        \ the 422, not the 500 (spec\n  \"Refusal does not depend on the key\"). A value stored before\
        \ PAC-66-B\n  is refused here too and is never rewritten (spec AC-B14, D-B4).\n\n* **A redirect\
        \ is never followed** on these three providers, whatever\n  the status, target, method or query,\
        \ including a redirect to another\n  approved destination. The request that drew it counts as\
        \ failed (the\n  502 below), and the user's key appears only in that first request\n  (spec AC-B7,\
        \ D-B6).\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMTestRequest'
      responses:
        '200':
          description: Provider reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMTestResult'
        '400':
          description: 'Malformed JSON body; a body naming an `llmProvider` outside the permitted set;
            or a body carrying any property other than `llmProvider`, `llmModel` and `llmApiKey` (`additionalProperties:
            false`). The last case is how a caller attempting to supply a destination - `llmBaseUrl`,
            `azureEndpoint`, `ollamaBaseUrl`, … - is refused, and it must be refused here rather than
            ignored, so that a client is told its override did nothing instead of being left to believe
            it probed what it named. JSON error shape (writeError). The response never contains the submitted
            or the stored `llmApiKey` (spec AC-14).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '422':
          description: 'PAC-66 and PAC-66-B. The probe would send a request to a destination not approved
            for the provider it uses (as named in the body or stored): the deployment''s cloud credential
            (`azure_openai`, `vertex`, `bedrock`; PAC-66), the caller''s own key (`openai`, `anthropic`;
            PAC-66-B) or a keyless request (`ollama`; PAC-66-B). Nothing was sent. `reason` says which
            of three cases applies; `property` names the stored setting to correct. The body never carries
            a token, a key or any part of the deployment credential, and `error` is a non-empty sentence
            (PAC-66 spec AC-11, AC-B16). Distinct from the 400 (the request body itself is malformed)
            and from the 502 (the provider call failed: credential acquisition, provider configuration,
            transport, or an unusable or redirecting answer; a 502 does not imply a request was sent).
            A 422 always means nothing was sent; the converse does not hold.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMDestinationRefusal'
              examples:
                notEnabled:
                  value:
                    error: azure_openai is not enabled on this deployment; ask your administrator to approve
                      an Azure OpenAI endpoint
                    reason: provider_not_enabled
                notApproved:
                  value:
                    error: azureEndpoint is not an approved Azure OpenAI endpoint on this deployment
                    reason: destination_not_approved
                    property: azureEndpoint
                notSet:
                  value:
                    error: the Azure endpoint is not set; save an approved endpoint in Settings first
                    reason: destination_not_set
                    property: azureEndpoint
                ollamaNotEnabled:
                  value:
                    error: ollama is not enabled on this deployment; ask your administrator to approve
                      an Ollama server
                    reason: provider_not_enabled
                baseUrlNotApproved:
                  value:
                    error: llmBaseUrl is not an approved OpenAI destination on this deployment; use only
                      the scheme, host and port of an approved server, or leave it empty for api.openai.com
                    reason: destination_not_approved
                    property: llmBaseUrl
        '500':
          description: 'Settings load failure, or the LLM client could not be constructed (for example
            no key on file or submitted for a key-carrying provider, or `llmProvider: ""`). Both answer
            the same fixed body, `{"error":"internal error"}`, in the JSON error envelope (before PAC-21
            was finished the settings-load failure was text/plain). The cause, such as the sentence `LLM
            not configured - set API key in Settings`, is never in the body. A PAC-66 or PAC-66-B destination
            refusal is NEVER a 500; it is the 422, including on `openai` and `anthropic` when no key is
            on file or submitted. The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '502':
          description: 'The provider call failed. Body: `{"error":"upstream provider error"}`. The upstream
            error string is NOT returned: it is redacted of both keys and written to the server log and
            Sentry only (PAC-21). A 502 does NOT imply an inference request was sent: the handler maps
            every provider-call error to 502, including failures before any request leaves the server
            - Azure or Vertex credential acquisition and Bedrock configuration loading (e.g. a stored
            `awsProfile` absent from the deployment''s shared config). PAC-66: this includes an approved
            ambient-provider host answering with a redirect, which is not followed with the deployment
            credential to any other host or to `http` (spec AC-8). PAC-66-B: this also includes an approved
            `openai`, `anthropic` or `ollama` destination answering with a redirect of any status to any
            target; it is not followed, and the caller''s key is in no request but the first (spec AC-B7).
            The body never carries the deployment credential or a key. It is never used for a destination
            refusal; see 422.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/manager/analytics:
    get:
      operationId: getManagerAnalytics
      tags:
      - manager
      summary: Twelve weeks of per-member focus/meeting/free minutes.
      description: 'Returns exactly 12 week buckets per member (months=3 is hard-coded and numWeeks =
        months*4), ordered NEWEST FIRST: weeks[0].week_start == the resolved `week`, each subsequent entry
        is 7 days earlier. A member with no data still gets 12 buckets of zeroes with data_available=false.
        `members` is always an array, never null. Visibility (PAC-60): a member who is a Paceday user
        has measured minutes only when the caller owns at least one team that member belongs to; otherwise
        every bucket is zeroes with data_available=false, whatever the route or `team_id` that put the
        member on the caller''s list. External (non-Paceday) members are unaffected (FreeBusy). PAC-34
        (API-022): each member also carries is_paceday_user (same derivation as the roster''s) and a member-level
        data_available that is true iff at least one of its 12 buckets has data_available=true. A client
        must render a bucket with data_available=false, and a member with data_available=false, as "no
        data", never as zero minutes. Neither field widens visibility: is_paceday_user is already on the
        roster for the same caller and members, and data_available is derived only from the buckets this
        response already returns.

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      - name: week
        in: query
        required: false
        description: Monday of the newest week, YYYY-MM-DD. Defaults to the current UTC ISO week's Monday.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Per-member weekly analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAnalytics'
        '400':
          description: JSON error — "team_id must be a valid UUID" or "week must be YYYY-MM-DD".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/manager/detect:
    post:
      operationId: previewManagerDetection
      tags:
      - manager
      summary: Preview detected 1:1 candidates for a team. Assigns nothing.
      description: 'PREVIEW half of the preview-then-confirm flow. Runs DetectTeam (which does write the
        global manager_team_members identity rows and one_on_one_occurrences as a side effect of scanning
        the calendar) and then reports, per candidate, whether that email is ALREADY assigned to the selected
        team. `assigned` is hard-coded to 0: this endpoint never creates a manager_team_member_assignments
        row for any team. `team_id` is REQUIRED here and the caller must be the team OWNER.

        '
      parameters:
      - $ref: '#/components/parameters/RequiredTeamIdQuery'
      requestBody:
        required: false
        description: Body is ignored entirely.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Detection preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanPreview'
        '400':
          description: 'JSON error. "team_id is required" when the query param is absent or blank; "team_id
            must be a valid UUID" when unparseable.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          description: 'Detection failed for a user who HAS a stored Google credential (a user with none
            gets the 401 `calendar not connected`): `{"error":"internal error"}`; or the per-candidate
            assignment lookup failed: `{"error":"db error"}`. The detail is written to the server log
            and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/manager/detect/confirm:
    post:
      operationId: confirmManagerDetection
      tags:
      - manager
      summary: Explicitly assign selected candidate emails to one team.
      description: 'CONFIRM half of the preview-then-confirm flow. The only endpoint that creates manager_team_member_assignments
        rows from detection. Runs in a single transaction (storage.ConfirmManagerTeamMembers) and is idempotent:
        a second confirm of the same email counts as skipped, not assigned. Emails are lowercased/trimmed
        by the handler before storage sees them. The request decoder uses DisallowUnknownFields, so any
        field other than `emails` yields 400 "invalid JSON".

        '
      parameters:
      - $ref: '#/components/parameters/RequiredTeamIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanConfirmRequest'
      responses:
        '200':
          description: Assignment counts. `total` is the post-commit assignment count for this team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanConfirmation'
        '400':
          description: 'JSON error. "team_id is required", "team_id must be a valid UUID", or "invalid
            JSON" (malformed body OR an unknown field, via DisallowUnknownFields).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: 'JSON error. "emails is required" when the key is absent or JSON null (an empty
            array is accepted and returns assigned=0, skipped=0); "email is required" for a blank entry;
            "email must be a valid email address" for an unparseable entry.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/manager/gaps:
    get:
      operationId: getManagerCadenceGaps
      tags:
      - manager
      summary: Members whose 1:1 cadence is overdue or due within 7 days.
      description: 'Gaps are computed over the roster in scope: the manager''s global roster, or, when
        `team_id` is supplied, the team-scoped roster with that team''s cadences. Members with cadence="none"
        never appear. A member never met is due now. A member with a recorded 1:1 occurrence in the next
        14 days is suppressed. Sorted by days_overdue descending. `gaps` is always an array, never null.

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      responses:
        '200':
          description: Cadence gaps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadenceGapList'
        '400':
          description: JSON error — "team_id must be a valid UUID".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          description: Gap detection or a database read failed. `error` is "internal error" or "db error".
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/manager/profile:
    get:
      operationId: getManagerProfile
      tags:
      - manager
      summary: Manager flag, detection timestamp and global roster size.
      description: 'Not team-scoped. `team_member_count` counts rows in manager_team_members for the caller
        (the global identity table), not assignments to any one formal team.

        '
      responses:
        '200':
          description: Manager profile summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerProfileSummary'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: setManagerProfile
      tags:
      - manager
      summary: Set the caller's is_manager flag; may trigger background detection.
      description: 'When `is_manager` is true and the profile has no `detected_at` yet, the handler spawns
        a background goroutine running DetectTeam with a 30s timeout. That background run persists detected
        members into the GLOBAL manager_team_members table only; it never creates team assignments. The
        response is written before the goroutine completes.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerProfileUpdate'
      responses:
        '200':
          description: 'The storage.UserProfile Go struct, with explicit snake_case json tags since PAC-26
            (API-030). Before PAC-26 the struct had no tags and the keys were PascalCase. The shape still
            differs from the GET response on the same path (GET is a summary with team_member_count; POST
            is the profile row).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileGoStruct'
        '400':
          $ref: '#/components/responses/JsonError'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/manager/team:
    get:
      operationId: getManagerRoster
      tags:
      - manager
      summary: Team-scoped manager roster with this-week / last-week stats.
      description: '`team_id` is REQUIRED (unlike the member-mutation routes below), and membership —
        not ownership — suffices. The roster is the union of (a) manager assignments for this team and
        (b) formal team_members of this team that have no assignment yet, synthesised with source="formal"
        and cadence="none". The caller is always excluded from (b). Sorted case-insensitively by display_name.
        `members` is always an array, never null.

        '
      parameters:
      - $ref: '#/components/parameters/RequiredTeamIdQuery'
      - name: week
        in: query
        required: false
        description: 'Monday of the target week, YYYY-MM-DD, parsed as UTC midnight. Defaults to the current
          ISO week''s Monday in UTC. Not validated to actually be a Monday.

          '
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Manager roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerRoster'
        '400':
          description: 'JSON error. "team_id is required", "team_id must be a valid UUID", or "week must
            be YYYY-MM-DD".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/manager/team/members:
    post:
      operationId: addManagerTeamMember
      tags:
      - manager
      summary: Add or upsert a roster member, optionally scoped to a team.
      description: '`team_id` is OPTIONAL here. Without it the member is written to the global manager_team_members
        table only. With it the write is transactional across manager_team_members plus manager_team_member_assignments,
        and the caller must be the team OWNER. Adding a member never creates a team_invites row (asserted
        by TestManagerTeam_AddMemberCreatesOnlySelectedTeamAssignment).

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddManagerMemberRequest'
      responses:
        '201':
          description: 'The member row as stored, read back after the upsert commits (PAC-26, API-031),
            as storage.ManagerTeamMember with explicit snake_case json tags (API-030). Without `team_id`
            it is the global manager_team_members row; with `team_id` it is that row seen through this
            team''s assignment (display name override, assignment cadence and cadence_custom_days), exactly
            as patchManagerTeamMember returns it. `id`, `created_at` and `updated_at` are the stored values.
            Before PAC-26 the body was the pre-insert struct in PascalCase with the zero UUID and "0001-01-01T00:00:00Z"
            timestamps. If the read-back fails the response is the 500 below, although the upsert has
            committed; the upsert is idempotent, so a retry is safe.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerTeamMemberGoStruct'
        '400':
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: 'JSON error. "email is required"; "email must be a valid email address"; "cadence
            must be weekly, biweekly, monthly, custom, or none"; "custom_cadence_days must be between
            1 and 365"; "custom_cadence_days is only valid with custom cadence".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/manager/team/members/{email}:
    parameters:
    - $ref: '#/components/parameters/MemberEmailPath'
    delete:
      operationId: removeManagerTeamMember
      tags:
      - manager
      summary: Remove a member globally, or unassign them from one team.
      description: 'Without `team_id`: deletes the global manager_team_members row outright. With `team_id`
        (owner required): removes the formal team_members row if the email maps to a Paceday user, deletes
        the manager assignment for this team only, deletes pending team_invites for this email on this
        team, and LEAVES the global manager_team_members identity row and its 1:1 history intact. Every
        storage error on this path is swallowed, so a failed delete still returns 204.

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      responses:
        '204':
          description: Deleted (or silently no-op). Empty body.
        '400':
          description: JSON error — "team_id must be a valid UUID".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '422':
          description: JSON error — "the team owner cannot be removed".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchManagerTeamMember
      tags:
      - manager
      summary: Update display name and/or cadence for a roster member.
      description: 'Omitted fields keep their current value. Supplying `cadence` as anything other than
        "custom" clears cadence_custom_days; omitting `cadence` preserves it (TestManagerPatchMember_PreservesOmittedCustomDays).
        A blank display_name falls back to the local part of the email. With `team_id`, only team-scoped
        preferences change (display_name_override, cadence, cadence_custom_days on the assignment row);
        the canonical global display name is never overwritten. Also, with `team_id`, a formal team member
        with no assignment yet is materialised into an assignment on first patch.

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchManagerMemberRequest'
      responses:
        '200':
          description: 'The re-read storage.ManagerTeamMember, with explicit snake_case json tags since
            PAC-26 (API-030). Never `null`: since PAC-26 (API-032) a failed re-read is the 500 below instead
            of a 200 whose body is the JSON literal `null`. The patch has committed when that 500 is sent.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerTeamMemberGoStruct'
        '400':
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '404':
          description: text/plain "not found" — no such member in scope.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: JSON error — cadence validation, same messages as addManagerTeamMember.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/manager/team/members/{email}/schedule:
    parameters:
    - $ref: '#/components/parameters/MemberEmailPath'
    post:
      operationId: scheduleManagerOneOnOne
      tags:
      - manager
      summary: Build a server-side /app prefill URL for a 1:1 with this member.
      description: 'Creates nothing on any calendar. Returns a relative URL of the form `/app?attendees=<email>&duration=30&title=1%3A1+with+<display_name>`
        plus `&date=<suggested_date>` when supplied (query params are Go url.Values-encoded, so alphabetically
        ordered). An empty body is accepted (io.EOF is tolerated).

        '
      parameters:
      - $ref: '#/components/parameters/OptionalTeamIdQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOneOnOneRequest'
      responses:
        '200':
          description: Prefill URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefillUrlResponse'
        '400':
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/JsonForbidden'
        '404':
          description: text/plain "not found".
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: JSON error — "suggested_date must be YYYY-MM-DD".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/meetings/{event_id}/brief:
    parameters:
    - $ref: '#/components/parameters/EventId'
    get:
      operationId: getMeetingBrief
      tags:
      - meeting-briefs
      summary: Read the cached Slack/Notion brief for a meeting
      description: 'Pure read — it never triggers generation. When no brief row exists the handler

        returns 200 (not 404) with `{"status":"pending","sources":{"slack":[],"notion":[]}}`

        and no `generated_at` / `brief_text`.

        '
      responses:
        '200':
          description: The brief, or a synthetic `pending` placeholder when none is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingBriefResponse'
        '400':
          description: '"event_id required" as PLAIN TEXT (written via `http.Error`, so

            `Content-Type: text/plain; charset=utf-8`, not the JSON error shape).

            '
          content:
            text/plain:
              schema:
                type: string
          x-uncertain: 'Believed unreachable: chi never matches an empty {event_id} segment, so this branch
            cannot fire through the router.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: 'Database error. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/meetings/{event_id}/brief/refresh:
    parameters:
    - $ref: '#/components/parameters/EventId'
    post:
      operationId: refreshMeetingBrief
      tags:
      - meeting-briefs
      summary: Force-regenerate a meeting brief
      description: 'Synchronous and slow — bounded by a 60s server-side context timeout. Calls

        `MeetingBriefService.Generate(..., force=true)`, which searches Slack and Notion

        and (when an LLM is configured in settings) writes `brief_text`.

        The handler builds a stub `calendar.Event{Id: event_id}` rather than fetching the

        real event, so the brief''s search terms come from the stored/derived context only.

        The request body is never read.

        The returned `status` is "ready" on success and "failed" when the source fetch or

        LLM step failed — a "failed" brief is still returned with HTTP 200.

        '
      responses:
        '200':
          description: The regenerated brief.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingBriefResponse'
        '400':
          description: '"event_id required" as PLAIN TEXT. Believed unreachable via chi routing.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: 'Brief generation returned an error. Body: `{"error":"internal error"}`. The detail
            is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/nlp/confirm:
    post:
      operationId: confirmNaturalLanguage
      tags:
      - nlp
      summary: Create the meeting for a chosen parsed slot
      description: 'The whole ParseResult from /api/nlp/parse is echoed back. Only `title`, `attendees`,
        `constraints` (mapped to the event Description) and `suggested_slots[selected_slot_index]` are
        used; `duration_minutes`, `range_start`, `range_end`, `preferred_times` and `avoid_times` are
        ignored here. On success an audit row `nlp_confirmed` is written and the created event is returned
        as the CalendarEvent DTO (toCalendarEventDTO, the same shape as GET /api/calendar/events), never
        Google''s own keys. PAC-29 (API-017, U-14): until PAC-29''s implementation lands the server still
        encodes the raw `calendar/v3.Event` here, so this response describes the server after that PR.
        A NEGATIVE `selected_slot_index` is a 400 `invalid selected_slot_index`, like an index past the
        end. Before PAC-21 was finished it passed the bounds check, indexed the slice out of range and
        panicked; the panic was re-raised by sentryMiddleware, so net/http aborted the response with no
        status and no body at all. That was U-06 / API-024, resolved here: a crash is not a contract to
        preserve, and the 400 is the response the handler already gives every other out-of-range index.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NLPConfirmRequest'
      responses:
        '200':
          description: The created event as the CalendarEvent DTO (PAC-29). Room resource attendees are
            dropped from `attendees` / `attendee_details`, as in the list; `attendees` is omitted when
            there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          description: '`invalid JSON`, or `invalid selected_slot_index` (empty slot list, index < 0,
            or index >= len). JSON error shape (writeError).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'CreateMeeting failed for a user who HAS a stored Google credential (a user with
            none gets the 401 `calendar not connected`): `{"error":"internal error"}`; or the weekly out-of-hours
            allowance is spent: `{"error":"out-of-hours meeting allowance reached"}`. A negative `selected_slot_index`
            is a 400, never a 500 (resolves U-06 / API-024). The detail is written to the server log and
            Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/nlp/parse:
    post:
      operationId: parseNaturalLanguage
      tags:
      - nlp
      summary: Parse a natural-language scheduling request
      description: 'A malformed body and an empty `text` are collapsed into the same 400 (`missing text
        field`). Note that LLM-level failures inside the parser do NOT surface as 5xx: the parser returns
        `{"intent":"unknown","error":"..."}` with HTTP 200. A 500 only occurs when Parse() itself returns
        a non-nil error.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NLPParseRequest'
      responses:
        '200':
          description: Parse result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NLPParseResult'
        '400':
          description: '`missing text field` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '500':
          description: 'Parse() returned an error. Body: `{"error":"internal error"}`. The detail is written
            to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/org/members:
    get:
      operationId: listOrgMembers
      tags:
      - calendar
      summary: List users in the caller's organization
      description: Returns all `users` rows sharing the caller's `org_id`, ordered by `created_at` ascending.
        If the caller cannot be loaded, or has no `org_id`, the handler returns 200 with `[]` rather than
        an error.
      responses:
        '200':
          description: Org members, or `[]` when the caller has no organization. The `org` property is
            never populated by this endpoint — storage.GetOrgMembers does not hydrate it, so it is always
            omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMember'
        '401':
          description: Body is the JSON literal `{"error":"unauthorized"}` but http.Error overwrites Content-Type
            with text/plain; charset=utf-8. Also reachable as MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiddlewareUnauthorized'
        '500':
          description: 'Database error. Body: `{"error":"internal"}`, served as application/json (until
            PAC-21 was finished it was this same JSON literal with a text/plain Content-Type). The detail
            is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/personal-calendars:
    get:
      operationId: listPersonalCalendars
      tags:
      - calendar
      summary: List the caller's personal calendars
      description: Rows from `personal_calendars` owned by the authenticated user, ordered by id ascending.
        Always an array, `[]` when empty.
      responses:
        '200':
          description: Personal calendars.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalCalendar'
        '401':
          description: MiddlewareUnauthorized (text/plain body containing JSON).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiddlewareUnauthorized'
        '500':
          description: 'Database error. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createPersonalCalendar
      tags:
      - calendar
      summary: Connect a personal calendar
      description: Inserts a row owned by the authenticated user. `name` defaults to the literal string
        "Personal" when empty or absent. `enabled` has no default handling, so an omitted key becomes
        the Go zero value `false`. `credentials_json` is never settable through this endpoint and is never
        returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalCalendarCreateRequest'
      responses:
        '201':
          description: Created calendar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalCalendar'
        '400':
          description: '`invalid body` (unparseable JSON) or `provider required`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiddlewareUnauthorized'
        '500':
          description: Insert failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/personal-calendars/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Personal calendar id. Parsed with strconv.ParseInt(..., 10, 64); a non-integer path
        segment yields 400 `invalid id`. Note the response DTO returns this same id as a STRING.
      schema:
        type: integer
        format: int64
    patch:
      operationId: updatePersonalCalendar
      tags:
      - calendar
      summary: Rename, re-point or enable/disable a personal calendar
      description: 'Applies COALESCE semantics in SQL: a null or absent field leaves the column unchanged.
        `provider` cannot be changed. The UPDATE is scoped by `user_id`, so another user''s calendar behaves
        exactly like a missing one.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalCalendarPatchRequest'
      responses:
        '200':
          description: Updated calendar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalCalendar'
        '400':
          description: '`invalid id` or `invalid body`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiddlewareUnauthorized'
        '404':
          description: '`personal calendar not found` — unknown id, or owned by another user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deletePersonalCalendar
      tags:
      - calendar
      summary: Disconnect a personal calendar
      description: Deletes the row scoped by `user_id`. Note this removes only the personal_calendars
        row; associated personal_blockers rows are not touched by this handler.
      responses:
        '204':
          description: Deleted. Empty body.
        '400':
          description: '`invalid id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiddlewareUnauthorized'
        '404':
          description: '`personal calendar not found` — nothing was deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/personal-calendars/{id}/preview:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      operationId: previewPersonalCalendar
      tags:
      - calendar
      summary: Preview the events a personal calendar would block
      description: Reads events through engine.PersonalBlocker.Preview over a FIXED window of `time.Now().Truncate(24h)`
        to that value plus 14 days. The window is not configurable and Truncate operates on the Unix epoch,
        so the start is a UTC midnight regardless of the caller's timezone. Returns `[]` rather than null
        when the provider yields nothing.
      responses:
        '200':
          description: 'Preview events. The element type is calendar.GenericEvent (backend/calendar/provider.go),
            with explicit json tags since PAC-26 (API-029): keys `id`, `title`, `start`, `end`. Before
            PAC-26 the struct had no tags and the keys were `ID`, `Title`, `Start`, `End`.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalCalendarPreviewEvent'
        '400':
          description: '`invalid id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiddlewareUnauthorized'
        '404':
          description: '`personal calendar not found`. Also returned when the ownership lookup itself
            errors, since any error from ownedCalendar maps to 404.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Preview failed (e.g. the webcal/ICS fetch errored).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/personal-calendars/{id}/sync:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      operationId: syncPersonalCalendar
      tags:
      - calendar
      summary: Run a personal-calendar sync now
      description: 'Runs engine.PersonalBlocker.Sync, stamps `last_synced_at = NOW()`, then re-reads and
        returns the calendar. Takes no request body. The sync writes busy blocks into the user''s work
        calendar, so it is calendar-dependent: a user with no stored Google credential gets the 401 CalendarNotConnected
        (PAC-21; before, a 500).'
      responses:
        '200':
          description: The calendar after syncing; `last_synced_at` is always populated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalCalendar'
        '400':
          description: '`invalid id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '404':
          description: '`personal calendar not found` (before or after the sync).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The blocker's Sync returned an error other than "no stored Google credential" (for
            example the personal feed could not be read, or reading the credential store failed), or the
            last_synced_at update failed. Body `{"error":"internal error"}`. Verified by TestPersonalCalendarSyncPropagatesBlockerError.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rooms:
    get:
      operationId: listRooms
      tags:
      - calendar
      summary: List Google Workspace room resources
      description: Enumerates the user's Google CalendarList and keeps entries whose id contains `resource.calendar.google.com`,
        optionally filtered by a case-insensitive substring match against the summary or the id. Returns
        `[]` rather than null when nothing matches.
      parameters:
      - name: q
        in: query
        required: false
        description: Case-insensitive substring filter, lowercased by the handler before matching. Absent
          or empty means no filtering. Not trimmed.
        schema:
          type: string
      responses:
        '200':
          description: Matching rooms, capped only by what Google returns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarRoom'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'Google CalendarList API error, or the stored credential could not be read. Body:
            `{"error":"internal error"}`. The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/schedule/compress:
    post:
      operationId: previewCompression
      tags:
      - schedule
      summary: Preview meeting-compression proposals
      description: 'Read-only: computes proposals, moves nothing. The body is optional: an absent or empty
        body (zero bytes or only whitespace) and the JSON literal `null` are treated as `{}`, i.e. today.
        Any other body that does not decode into CompressionRequest is a 400 `invalid JSON` (a syntax
        error, a non-object top-level value, or a member of the wrong type). Before PAC-36 the decode
        error was discarded and such a body answered 200 for today (API-035). Only the first JSON value
        is read. If `week` is set it wins over `date`: the handler snaps the parsed date to Monday (startOfWeek)
        and computes Mon..Fri in order. A 200 in week mode carries exactly five CompressionResult entries,
        one per day, Monday first; a non-working day is an entry with no proposals, not a missing entry.
        If ANY day''s computation fails, the whole request fails exactly as single-day mode fails (401
        CalendarNotConnected or 500 `internal error`) and no per-day results are returned. Before PAC-36
        week mode skipped every failing day and answered 200 with the survivors, `[]` if all five failed,
        which a client cannot tell apart from "nothing to compress" (API-034). If `week` is empty, `date`
        (or today) produces a single-element array and an engine error is the 500. A caller with no stored
        Google credential gets the 401 `calendar not connected` in BOTH modes, before any day is computed
        (PAC-21, API-054).

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressionRequest'
      responses:
        '200':
          description: 'Array of per-day results: exactly one entry in single-day mode, exactly five (Mon..Fri,
            in that order) in week mode. Never `[]` (PAC-36: a week in which a day failed is an error
            response, not a shorter array).

            '
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 5
                items:
                  $ref: '#/components/schemas/CompressionResult'
        '400':
          description: '`invalid JSON` (the body is present, is not `null`, and does not decode into CompressionRequest;
            PAC-36, API-035), `invalid week format` or `invalid date format`. Fixed messages, JSON error
            shape (writeError).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'Both modes: an engine failure for a user who HAS a stored Google credential (a
            user with none gets the 401 `calendar not connected`), on the single day or on any one of
            the five week days (PAC-36, API-034: week mode no longer skips it); or reading the credential
            store failed (checked before any day is computed). Body: `{"error":"internal error"}`, with
            no per-day results and no indication of which day failed. The detail is written to the server
            log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/schedule/compress/apply:
    post:
      operationId: applyCompression
      tags:
      - schedule
      summary: Apply selected move proposals
      description: 'The request proposal objects are snake_case (`event_id`, `proposed_start`, `proposed_end`)
        even though the CompressionResult proposals returned by /api/schedule/compress are camelCase.
        Only these three fields are read; any other field on the posted object is ignored. A proposal
        whose start or end fails RFC3339 parsing is NOT an error: it is dropped and `"<event_id>: invalid
        time format"` is appended to `failed` (confirmed by TestApplyCompress_InvalidTime, which expects
        200).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressionApplyRequest'
      responses:
        '200':
          description: Applied / failed event ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompressionApplyResult'
        '400':
          description: '`invalid JSON` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'Engine Apply() failure for a user who HAS a stored Google credential (a user with
            none gets the 401 `calendar not connected`). Body: `{"error":"internal error"}`. The detail
            is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/schedule/create:
    post:
      operationId: createScheduledMeeting
      tags:
      - schedule
      summary: Create a meeting at an explicit time
      description: '`start` and `end` must both parse as RFC3339. The handler builds an `engine.ScheduleRequest`
        WITHOUT `duration_minutes` (the slot carries the times) and calls SmartScheduler.CreateMeeting,
        which refuses out-of-hours creation once the weekly allowance is spent - that refusal surfaces
        as a 500 with the text `out-of-hours meeting allowance reached`, not a 4xx. On success an audit
        row `meeting_created` is written. The response body is the created event flattened by toCalendarEventDTO:
        the CalendarEvent DTO, the same shape as one element of GET /api/calendar/events, never Google''s
        own keys (`summary`, `start.dateTime`, `hangoutLink`). PAC-29 (API-017, U-14): until PAC-29''s
        implementation lands the server still encodes the raw `calendar/v3.Event` here, so this response
        describes the server after that PR.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreateRequest'
      responses:
        '200':
          description: The created event as the CalendarEvent DTO (PAC-29). Room resource attendees are
            dropped from `attendees` / `attendee_details`, as in the list; `attendees` is omitted when
            there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          description: '`invalid JSON`, or `invalid start or end (use RFC3339)` - JSON error shape (writeError).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'Calendar or engine error for a user who HAS a stored Google credential (a user
            with none gets the 401 `calendar not connected`): `{"error":"internal error"}`; or the weekly
            out-of-hours allowance is spent: `{"error":"out-of-hours meeting allowance reached"}`. The
            detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/schedule/suggest:
    post:
      operationId: suggestMeetingSlots
      tags:
      - schedule
      summary: Suggest meeting slots
      description: '`range_start` and `range_end` are both mandatory and must parse as RFC3339; either
        one failing yields a single 400. `duration_minutes`, `attendees` and `title` are optional as far
        as the handler is concerned (no validation) - `duration_minutes: 0` produces zero-length candidate
        slots rather than an error. The engine walks candidate starts in 30-minute steps (engine/smart_schedule.go:
        `t = t.Add(30 * time.Minute)`) and returns at most 3 slots, each at least 1h apart (pickTopUnique(candidates,
        3, time.Hour)). There is no 15-minute increment rule on this route: every step in engine/smart_schedule.go
        (lines 113, 121 and 135) is 30 minutes, so every suggested start is the start of a free interval
        (`range_start` or the end of a busy interval) plus a multiple of 30 minutes. The 15-minute stepping
        in engine/booking.go, engine/habits.go and engine/team_availability.go backs other domains. U-07
        resolved by PAC-21 from the engine, to be pinned by TestSmartScheduler_Suggest_StepsThirtyMinutes
        (AC-6, written in the backend PR before the code); assumed by the factory, pending owner confirmation
        that no 15-minute rule was intended.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSuggestRequest'
      responses:
        '200':
          description: Ranked slot suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSuggestions'
        '400':
          description: '`invalid JSON`, or `invalid range_start or range_end (use RFC3339)` - JSON error
            shape (writeError).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'Engine error (freebusy failure or settings load) for a user who HAS a stored Google
            credential (a user with none gets the 401 `calendar not connected`): `{"error":"internal error"}`;
            or the weekly out-of-hours allowance is spent: `{"error":"out-of-hours meeting allowance reached"}`
            (still a 500, not a 4xx: changing that status is not part of this change). The detail is written
            to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
  /api/scheduling-links:
    post:
      operationId: createSchedulingLink
      tags:
      - scheduling-links
      summary: Create a scheduling link owned by the caller.
      description: The caller is inserted as an `accepted` host. Each entry of `co_host_emails` is resolved
        by lowercased email; unknown emails are silently skipped (no error, no host row). An empty/omitted
        `slug` is auto-generated from the owner's name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchedulingLinkRequest'
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: 'Body is not valid JSON. Body: {"error":"invalid request body"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '409':
          description: 'Explicit slug collides with an existing link. Body: {"error":"slug already exists"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          $ref: '#/components/responses/SchedulingLinkValidationError'
        '500':
          description: '`error` is one of "user not found", "slug generation failed", "slug check failed"
            or "internal error" (insert or owner-host insert failed). The detail is written to the server
            log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    get:
      operationId: listSchedulingLinks
      tags:
      - scheduling-links
      summary: Links the caller owns or co-hosts with an accepted status.
      responses:
        '200':
          description: Partitioned into owned vs shared by `is_owner`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkListResponse'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /api/scheduling-links/host-invites:
