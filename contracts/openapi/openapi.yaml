            type: integer
            minimum: 1
            maximum: 7
        window_start:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
        window_end:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
        priority:
          type: integer
        color:
          type: string
    HabitUpdateRequest:
      type: object
      description: 'Anonymous request struct in handlers_habits.go `update`. All fields are Go

        pointers (or a nil-able slice), so absent/`null` means "leave unchanged".

        The merged result is validated as a whole.

        '
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        days_of_week:
          type: array
