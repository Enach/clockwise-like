        \ endpoint the secret goes to (spec §2.2, D-13).\n- `oidc_client_secret` given as `\"\"` or `null`:\
        \ refused (400, check\n  5). No write clears the client secret; removing the configuration\n \
        \ (deleteSsoProvider) is the way to remove it.\nA create (no configuration for the domain) has\
        \ nothing to keep, so it\nmust supply the secret.\n\nWho may call it is unchanged by PAC-22. The\
        \ caller must belong to an\norg and the supplied domain must match that org's domain\n(domain.DomainMatchesOrg).\
        \ PAC-50 replaces that rule; PAC-22 neither\nwidens nor narrows it.\n\nOrder of checks. Membership\
        \ (403 `org membership required`) is checked\nfirst, as today, before the body is read: a caller\
        \ with no org gets\nthat 403 whatever the body holds. Checks 1-5 below run after it and\nbefore\
