        the same: the Go fields `Start`/`End` are tagged `start_time`/`end_time` so that one block shape
        can be read from both operations. It has no `id` and no `created_at`: the engine reports what
        it created before any row id is known to the response. Before PAC-26 the struct had no tags and
        the keys were `GoogleEventID`, `Start`, `End`, `Date`.

        '
      properties:
