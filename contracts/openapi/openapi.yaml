        \ never\n   silently dropped.\n3. `domain`, `provider_name` and `provider_type` are non-empty\n\
        \   (`domain, provider_name and provider_type are required`, unchanged).\n4. `provider_type` is\
        \ `oidc`. `saml` is refused with\n   `provider_type 'saml' is not supported` (spec D-1, AC-8):\
        \ the\n   product cannot complete a SAML sign-in, so a SAML configuration is\n   refused when\
        \ offered instead of stored and refused at sign-in. Any\n   other value is refused with `provider_type\
        \ must be 'oidc'`\n   (replaces `provider_type must be 'oidc' or 'saml'`).\n5. `oidc_issuer` and\
        \ `oidc_client_id` are each present and\n   non-empty, in that order: `oidc_issuer is required`,\n\
        \   `oidc_client_id is required` (spec D-2, AC-7). Missing, `null` and\n   `\"\"` are the same\
        \ refusal. Then, when `oidc_client_secret` is\n   present, it is a non-empty string: `\"\"` and\
        \ `null` are refused with\n   `oidc_client_secret must not be empty` (spec D-12, AC-26). Its\n\
        \   absence is not decided here (check 6). Values are stored as given\n   (not trimmed).\n6. Only\
        \ when `oidc_client_secret` is absent, against the stored\n   configuration for the domain: `oidc_client_secret\
        \ is required` when\n   there is no configuration, or it is not of type `oidc`, or its\n   stored\
        \ client secret is empty (spec AC-7, AC-25); `oidc_client_secret\n   is required when oidc_issuer\
        \ or oidc_client_id changes` when the\n   submitted issuer or client id differs from the stored\
        \ one (spec\n   D-13, AC-24).\n\nChecks 1-5 are decided from the request alone (and the caller's\n\
        membership). Check 6 reads the stored configuration but, like checks\n1-5, is decided before any\
        \ write authorization is consulted. So a\nsubmission refused by any of them costs the caller nothing\
