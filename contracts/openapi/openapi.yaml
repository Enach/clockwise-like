                type: string
              description: sso_state=<32 hex chars>|<domain>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax
        '404':
          description: '"SSO not configured for this domain" — no provider row (also returned when the
            lookup errors).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '"OIDC setup: <err>" — issuer discovery failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
