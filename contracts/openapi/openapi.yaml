    ProviderDisconnectResult:
      type: object
      description: 'Body of the 200 of `disconnectMicrosoft` and `disconnectZoom` (PAC-67,

        spec AC-13 to AC-17, D-2). Says which provider was disconnected and

        what became of the grant at the provider. The local credential is gone

        whatever `revocation` says: a revocation that could not be confirmed

        never blocks local removal (spec D-2). Carries no token material.

        '
      required:
      - provider
      - revocation
      properties:
        provider:
          type: string
          enum:
          - outlook
          - zoom
          description: '`outlook` from `disconnectMicrosoft`, `zoom` from `disconnectZoom`.'
        revocation:
          type: string
          enum:
          - confirmed
          - unconfirmed
          - not_offered
          - nothing_stored
          description: "- `confirmed`: the provider answered success to the revocation\n  request (Zoom\
            \ only).\n- `unconfirmed`: a credential was removed and its revocation is\n  not confirmed\
            \ (Zoom only): either a revocation was attempted and\n  the provider refused it, answered\
            \ an error, or could not be\n  reached; or no revocation could be attempted, because the stored\n\
            \  credential does not decode or its expired access token could not\n  be renewed (see `disconnectZoom`).\
            \ The client must tell the user\n  that revocation at the provider could not be confirmed\
            \ (spec\n  AC-15, D-2) and must not show a plain success.\n- `not_offered`: the provider offers\
            \ no revocation of this one\n  grant that Paceday may call, so none was attempted (Outlook\n\
            \  always, spec AC-17, D-5). The client tells the user the grant\n  can be removed from their\
            \ account at the provider.\n- `nothing_stored`: the caller held no credential for this\n \
            \ provider; nothing was removed or sent, and no activity entry\n  was written.\n"
      additionalProperties: false
    PublicBookingConfirmation:
      type: object
      description: backend/api/handlers_booking.go bookingConfirmationDTO, returned by POST /api/book/{slug}
        with 201.
      required:
      - id
      - link_slug
      - title
      - start
      - end
      - duration_minutes
      - hosts
      - booker_name
      - booker_email
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        link_slug:
          type: string
        title:
          type: string
          description: The link's title, not a per-booking title.
        start:
          type: string
          format: date-time
          description: UTC, formatted with time.RFC3339 (second precision, always a `Z` offset).
        end:
          type: string
          format: date-time
          description: UTC, formatted with time.RFC3339.
        duration_minutes:
          type: integer
          description: Computed as end-start, truncated to whole minutes.
        hosts:
          type: array
          description: Accepted hosts. Always an array, never null.
          items:
            $ref: '#/components/schemas/PublicHost'
        booker_name:
          type: string
        booker_email:
          type: string
        notes:
          type: string
          description: Omitted when empty (json `notes,omitempty`).
    PublicBookingSlot:
      type: object
      description: engine.AvailableSlot. Times are Go time.Time marshalled as RFC3339 with nanoseconds.
      required:
      - start
      - end
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    PublicHost:
      type: object
      description: A host shown on the public booking page. Only accepted hosts appear.
      required:
      - email
