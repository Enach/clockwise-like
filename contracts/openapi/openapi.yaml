    AnalyticsBreakdownEntry:
      type: object
      description: 'api.breakdownEntry. Exactly 5 entries in a fixed order, with fixed colors:

        meeting #FF6B6B, focus #5B7FFF, habit #9B7AE0, personal #E9B949, free #B0BEC5.

        '
      required:
      - category
      - minutes
      - percentage
      - color
      additionalProperties: false
      properties:
        category:
          type: string
          enum:
          - meeting
          - focus
          - habit
          - personal
          - free
        minutes:
          type: integer
        percentage:
          type: number
          format: double
          description: 'A percentage where 100 means the whole of `total_working_minutes` (PAC-42: the
            same scale as `habit_completion_rate` and `focus_score` in the same response): `minutes /
            total_working_minutes * 100`, or 0 when total is 0. Not rounded. No maximum is declared because
            the value is not bounded by 100: the total counts Monday–Friday working windows only, while
            meeting and personal minutes count every timed event in the seven days at any hour. buffer_minutes
            is excluded from the breakdown, so the five percentages need not sum to 100.'
        color:
          type: string
    AnalyticsMeeting:
      type: object
      description: 'One entry of GET /api/analytics/meetings. Built as an ad-hoc `map[string]any` in

