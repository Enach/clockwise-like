        '500':
          description: Calendar/engine error, raw Go error as text/plain (http.Error).
          content:
            text/plain:
              schema:
                type: string
  /api/schedule/suggest:
    post:
      operationId: suggestMeetingSlots
      tags:
      - schedule
      summary: Suggest meeting slots
      description: '`range_start` and `range_end` are both mandatory and must parse as RFC3339; either
        one failing yields a single 400. `duration_minutes`, `attendees` and `title` are optional as far
        as the handler is concerned (no validation) - `duration_minutes: 0` produces zero-length candidate
        slots rather than an error. The engine walks candidate starts in 30-minute steps (engine/smart_schedule.go:
        `t = t.Add(30 * time.Minute)`) and returns at most 3 slots, each at least 1h apart (pickTopUnique(candidates,
        3, time.Hour)).

        '
      x-uncertain: 'The task brief mentions a 15-minute increment rule. No 15-minute constraint exists
        anywhere on this route: the smart scheduler steps 30 minutes, and the only 15-minute stepping
        in the repo is in engine/booking.go, engine/habits.go and engine/team_availability.go, which back
        other domains (booking links, habits, team availability). A human should confirm whether a 15-minute
        rule was intended here.

