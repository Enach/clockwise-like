      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          type: string
          const: recompute accepted
    AnalyticsWeekRow:
      type: object
      description: 'One item of GET /api/analytics/trends. Same fields as AnalyticsWeekWithBreakdown,

        in the same formats and on the same scales, minus `breakdown` (PAC-42).

        '
      required:
      - id
      - user_id
      - week_start
      - total_working_minutes
      - meeting_minutes
      - focus_minutes
      - habit_minutes
      - buffer_minutes
      - personal_minutes
      - free_minutes
      - meeting_count
      - focus_block_count
      - habit_completion_rate
      - largest_focus_block_minutes
      - top_meeting_titles
      - focus_score
      - estimated_meeting_cost_minutes
      - computed_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        week_start:
          type: string
          format: date
          description: 'The calendar date of the Monday the week starts on, `YYYY-MM-DD` (e.g. "2025-01-06"),
            with no time of day and no zone: the stored DATE value. Same format as AnalyticsWeekWithBreakdown.week_start,
            so the two are equal strings for the same week (PAC-42, API-055; this was an RFC3339 timestamp
            before). Never the zero date "0001-01-01" (PAC-42 fixes the read path that produced it).'
        total_working_minutes:
          type: integer
        meeting_minutes:
          type: integer
        focus_minutes:
          type: integer
        habit_minutes:
          type: integer
        buffer_minutes:
          type: integer
          description: Always 0 for engine-computed weeks (open defect API-057); see AnalyticsWeekWithBreakdown.buffer_minutes.
        personal_minutes:
          type: integer
        free_minutes:
          type: integer
        meeting_count:
          type: integer
        focus_block_count:
          type: integer
        habit_completion_rate:
          type: number
          format: double
          description: 'A percentage where 100 means every counted habit occurrence was completed (PAC-42,
            API-058; reported unscaled before PAC-42): `completed / (scheduled + completed) * 100`, 0
            when there are none, not rounded. Equal to the single-week value for the same stored week.
            Rows stored before PAC-42 are reported on this scale too: storage keeps the unscaled ratio
            for every week and the multiplication by 100 is applied on read (spec D-3).'
          minimum: 0
          maximum: 100
        largest_focus_block_minutes:
          type: integer
        top_meeting_titles:
          type: array
          description: '`[]` when the week has no titles, including when the JSONB column holds `null`
            or fails to unmarshal (PAC-28).'
          maxItems: 5
          items:
            $ref: '#/components/schemas/MeetingTitle'
        focus_score:
          type: integer
          description: A percentage where 100 means all focus and meeting time was focus; same computation
            and range as AnalyticsWeekWithBreakdown.focus_score.
          minimum: 0
          maximum: 100
        estimated_meeting_cost_minutes:
          type: integer
        computed_at:
          type: string
          format: date-time
    AnalyticsWeekWithBreakdown:
      type: object
      description: 'Response of GET /api/analytics/week. The same fields as AnalyticsWeekRow, in the

        same formats and on the same scales, plus `breakdown` (PAC-42).

        '
      required:
      - id
      - user_id
      - week_start
      - total_working_minutes
      - meeting_minutes
      - focus_minutes
      - habit_minutes
      - buffer_minutes
      - personal_minutes
      - free_minutes
      - meeting_count
      - focus_block_count
      - habit_completion_rate
      - largest_focus_block_minutes
      - top_meeting_titles
      - focus_score
      - estimated_meeting_cost_minutes
      - computed_at
      - breakdown
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        week_start:
          type: string
          format: date
          description: 'The calendar date of the Monday the week starts on, `YYYY-MM-DD` (e.g. "2025-01-06"),
            with no time of day and no zone: the stored DATE value. Same format as AnalyticsWeekRow.week_start,
            so the two are equal strings for the same week (PAC-42, API-055). Never the zero date "0001-01-01"
            (PAC-42 fixes the read path that produced it).'
        total_working_minutes:
          type: integer
          description: Sum of the configured work windows Mon–Fri. Falls back to 2400 (480×5) when it
            computes to ≤0 and the working-hours mode is not "by_day".
        meeting_minutes:
          type: integer
        focus_minutes:
          type: integer
        habit_minutes:
          type: integer
        buffer_minutes:
          type: integer
          description: 'Always 0 for engine-computed weeks: AnalyticsEngine.compute never sets it, so
            every write path stores 0. This is open defect API-057 (docs/factory/api-audit.md), not intended
            behaviour; computing it is out of PAC-42''s scope (spec D-5, pending owner confirmation, OQ-8).
            The column round-trips through storage, so a row written by other means would report its stored
            value.'
        personal_minutes:
          type: integer
          description: Calendar events with zero attendees.
        free_minutes:
          type: integer
          description: total_working − meeting − focus − habit − personal, floored at 0.
        meeting_count:
          type: integer
        focus_block_count:
          type: integer
        habit_completion_rate:
          type: number
          format: double
          description: 'A percentage where 100 means every counted habit occurrence was completed (PAC-42,
            API-058: the same scale as `focus_score` and `breakdown[].percentage` in this response): `completed
            / (scheduled + completed) * 100` over the week''s occurrences. 0 when there are none. Not
            rounded. Storage keeps the unscaled ratio; the multiplication by 100 is applied when the response
            is built (spec D-3).'
          minimum: 0
          maximum: 100
        largest_focus_block_minutes:
          type: integer
        top_meeting_titles:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/MeetingTitle'
        focus_score:
          type: integer
          description: 'A percentage where 100 means all focus and meeting time was focus: `focus*100/(focus+meeting)`
            (integer division) clamped to ≤100; 50 when both are 0.'
          minimum: 0
          maximum: 100
        estimated_meeting_cost_minutes:
          type: integer
          description: Sum over meetings of duration × attendee count (person-minutes).
        computed_at:
          type: string
          format: date-time
        breakdown:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/AnalyticsBreakdownEntry'
    AttendeeSuggestion:
      type: object
      description: calendar.AttendeeSuggestion. Both keys are always emitted (no omitempty); `name` is
        "" when Google supplied no display name.
      required:
      - email
      - name
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Original casing from the Google event, not the lowercased dedupe key.
        name:
          type: string
    AuditEntry:
      type: object
      description: storage.AuditEntry. One recorded action, always about the calling user's own calendar
        or, since PAC-67, one of the calling user's own provider connections (Outlook, Zoom, Google; the
        three connection kinds of `action`) — the subject is the scoping predicate and is deliberately
        NOT echoed back as a field, because it is the same value on every entry of every response (see
        contracts/features/PAC-23.md §2, rejected alternative A).
      required:
      - id
      - action
      - details
      - created_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          description: '`audit_log.id`, declared `SERIAL` at backend/storage/migrations/001_initial.up.sql:45
            — a 32-bit signed sequence. `storage.AuditEntry.ID` is a Go `int64` (backend/storage/audit_log.go:18),
            but that widening is a Go type choice, not a range the table can reach, so `int64` here would
            over-declare the server. `int32` is declared instead because the sole consumer coerces with
            `Number(e.id)` (smart-calendar-flow/src/api/client.ts:448, inside `normalizeAuditEntries`)
            and uses the result as a React list key (src/pages/Audit.tsx:95): every `int32` is exactly
            representable as a JS number, so the coercion is lossless and keys stay distinct. Values above
            2^53 would collide into one key and drop rows — the table cannot produce them, and this declaration
            is what keeps that true for a generated client.'
        action:
          type: string
          description: 'What was recorded. Underscore-separated, lower-case; there is no dotted key convention
            on this endpoint and never was.


            This is the complete set the server can emit, enumerated from every `storage.WriteAuditLog`
            call site in `backend/` (the action argument is a string literal at all seven, and `storage.WriteAuditLog`,
            in backend/storage/focus_blocks.go, holds the only INSERT against the table): `focus_created`
            (`FocusTimeEngine.RunForUser`, backend/engine/focus_time.go), `focus_cleared` (`FocusTimeEngine.ClearWeek`,
            backend/engine/focus_time_cleaner.go), `meeting_scheduled` (`SmartScheduler.CreateMeeting`,
            backend/engine/smart_schedule.go), `meeting_moved` (`CompressionEngine.Apply`, backend/engine/compression.go),
            `meeting_created` (`scheduleHandlers.createMeeting`, backend/api/handlers_schedule.go), `nlp_parsed`
            (`NLPService.Parse`, backend/nlp/parser.go), `nlp_confirmed` (`nlpHandlers.confirm`, backend/api/handlers_nlp.go).
            Cited by enclosing function rather than line because this text is emitted into generated files
            in both repos; the falsifying command is `grep -rn ''WriteAuditLog('' --include=''*.go'' backend/
            | grep -v _test.go`, which returns the definition and exactly these seven call sites. PAC-67
            adds three kinds, none of which redefines the seven above: they are written by the credential
            lifecycle, not by a scheduling feature, and their writers are named by the PAC-67 plan: `connection_lost`
            (the provider permanently refused renewing the subject''s credential; one per loss, see the
            operation description), `provider_disconnected` (the subject disconnected Outlook or Zoom),
            and `revocation_unconfirmed` (a revocation sent to the provider on that disconnect was not
            confirmed, or could not be attempted; Zoom only). After PAC-67 the falsifying command above
            must return these writers as well. No test checks this enum against the writers today (none
            exists in backend/api or backend/storage; contract challenge, non-blocking); the PAC-67 backend
            stage ADDS one covering all ten (manifest CONTRACT-6).


            The enum is closed on purpose. `audit_log.action` is an unconstrained `TEXT` column, so the
            set is held by this contract rather than by the database: adding an eighth action is a contract
            change, and once the PAC-67 enum test exists a writer added without one makes it fail, which
            is the intended alarm. Spec AC-14 requires that this set never shrinks.


            Because the body of the 200 is an array of this schema, a value outside this enum makes the
            WHOLE response non-conforming, not just the one row — one operator `INSERT`, one writer added
            without a contract change, or one restored backup, and a validating consumer rejects six good
            rows along with the odd one. That is the intended alarm in a test and the wrong behaviour
            in a UI, so the expected handling is stated rather than left to each consumer: **render the
            row, substituting a placeholder such as `unknown` for the unrecognised value, rather than
            discarding the response.**


            No consumer implements that today, and the correction matters because an earlier revision
            of this paragraph claimed one did. The shipped client''s normaliser is `action: typeof e.action
            === "string" && e.action ? e.action : "unknown"` (smart-calendar-flow/src/api/client.ts:451,
            inside `normalizeAuditEntries`). It substitutes `unknown` only for an action that is MISSING,
            NON-STRING or EMPTY; an unrecognised non-empty string — `focus.run`, `weird_action` — passes
            through verbatim. The row still renders, but for a different reason: that client''s `AuditEntry`
            is hand-written with `action: string` (smart-calendar-flow/src/api/types.ts:224, in the interface
            at `:222-227`), so nothing validates against this enum at all. A stage-4 frontend implementer
            must not read this paragraph as describing work already done. The generated zod schema factory
            §4 mandates exists — `src/api/generated/schemas.ts` exports `AuditEntry = z.strictObject(…)`
            with `action: z.enum([…])` over exactly these seven values, committed since smart-calendar-flow
            #87 (2026-10-10) and regenerated after every contract merge — and is not applied to the audit
            path: the only import from `generated/schemas` in that repo is `SettingsUpdate` (`src/api/client.ts:2`).
            The day it is applied to `getAudit`, an out-of-enum value is a thrown validation error and
            the whole response is lost, which is the case this paragraph is for.


            It names WHAT happened, not WHO did it. Every entry''s subject is the calling user (see the
            operation description); no entry carries an actor, and no value in this enum distinguishes
            an action a person took from one the scheduler took on their behalf.'
          enum:
          - focus_created
          - focus_cleared
          - meeting_scheduled
          - meeting_moved
          - meeting_created
          - nlp_parsed
          - nlp_confirmed
          - connection_lost
          - provider_disconnected
          - revocation_unconfirmed
        details:
          type: string
          description: 'Scanned from the DB into a Go `string`, so on the wire this is ALWAYS a JSON string
            — even when the text inside it happens to be JSON. A generator should emit `string`, and that
            is correct and complete for the transport.


            Whether the text inside parses as JSON depends on which `action` produced it, so the useful
            statement is per-writer rather than a blanket warning. ALWAYS VALID JSON: `focus_created`
            and `focus_cleared` marshal a map with `encoding/json` (`FocusTimeEngine.RunForUser` in backend/engine/focus_time.go,
            `FocusTimeEngine.ClearWeek` in backend/engine/focus_time_cleaner.go); `nlp_parsed` uses `fmt.Sprintf`
            with `%q`, which escapes (`NLPService.Parse`, backend/nlp/parser.go); and the three PAC-67
            connection kinds, which marshal a struct with `encoding/json` and hold only server-chosen
            values: `connection_lost` is `{"provider":"outlook"|"zoom"|"google"}`, `provider_disconnected`
            is `{"provider":"outlook"|"zoom","revocation": "confirmed"|"unconfirmed"|"not_offered"}` (the
            `revocation` vocabulary of `ProviderDisconnectResult`), and `revocation_unconfirmed` is `{"provider":"zoom"}`.
            No token material and no actor-supplied text ever appears in them. NOT GUARANTEED: `meeting_scheduled`,
            `meeting_created`, `meeting_moved` and `nlp_confirmed` are built by concatenating values into
            a JSON literal with no escaping (`SmartScheduler.CreateMeeting` in backend/engine/smart_schedule.go,
            `scheduleHandlers.createMeeting` in backend/api/handlers_schedule.go, `CompressionEngine.Apply`
            in backend/engine/compression.go, `nlpHandlers.confirm` in backend/api/handlers_nlp.go). Sites
            are cited by enclosing function, not line, for the reason given in the operation description;
            `grep -rn ''WriteAuditLog('' --include=''*.go'' backend/` shows all seven argument expressions
            on one line each.


            The interpolated value differs by site and so does the severity. In `SmartScheduler.CreateMeeting`
            and `scheduleHandlers.createMeeting` it is a meeting title from the request body, so a title
            containing `"`, `\` or a newline yields malformed JSON. In `CompressionEngine.Apply` there
            is no title: the values are a client-supplied `event_id`, copied unvalidated from the request
            body (`scheduleHandlers.applyCompress`, backend/api/handlers_schedule.go:80-93 — the timestamps
            are parsed, the id is not touched), and an RFC3339 timestamp — so a caller can write JSON
            STRUCTURE, not merely a stray quote, into its own row. In `nlpHandlers.confirm` the value
            is a Google-issued event id, which in practice contains no JSON metacharacter; the construction
            is the same defect, the input simply is not attacker-controlled.


            Consequence for a consumer: parse the four safe actions if you want to; for the other four,
            treat the value as opaque text, as the shipped client does (`formatAuditDetails`, smart-calendar-flow/src/api/client.ts:426-435,
            never calls JSON.parse). PAC-23 does not fix the concatenation — it is docs/specs/PAC-23.md
            OQ-6, and the spec challenge argues for splitting the escaping defect out of it. When that
            lands, the NOT GUARANTEED list empties and this description loses two paragraphs.'
        created_at:
          type: string
          format: date-time
    AuthStatusResponse:
      type: object
      description: 'Assembled from map[string]interface{} literals in authHandlers.status —

        all three keys are always emitted (no omitempty).

        '
      required:
      - connected
      - provider
      - email
      properties:
        connected:
          type: boolean
          description: 'Whether the caller''s calendar connection for `provider` is usable

            (PAC-67): stored, and not recorded as lost after a permanent

            refusal of its renewal. See `getAuthStatus`.

            '
        provider:
          type: string
          enum:
          - google
          - outlook
          - webcal
