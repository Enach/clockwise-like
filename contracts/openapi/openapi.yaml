  /api/scheduling-links/{id}:
    parameters:
    - $ref: '#/components/parameters/SchedulingLinkIdPath'
    get:
      operationId: getSchedulingLink
      tags:
      - scheduling-links
      summary: Fetch one scheduling link by id (owner or accepted co-host).
      description: 'Readable only by the link''s owner and by co-hosts whose host row on the link is `accepted`
        (PAC-25, API-006). That is the same set of callers who receive the link from `GET /api/scheduling-links`,
        so this read discloses nothing the list does not. Every other authenticated caller (no host row,
        a `pending` or `declined` invitation, a co-host who left or was removed) receives the same `404
        {"error":"not found"}` as for an id that matches no link, with no part of the link in the body,
        so the answer does not reveal whether a link exists. A refused read is never `403` (PAC-25 D-1;
        contrast the owner-only siblings PATCH, DELETE, `/bookings` and `/hosts`, which still answer `403`
        and are out of scope). Check order: `400` malformed id; then the link lookup; then the caller''s
        own host-status lookup on that link; then `404` for no link or a caller who may not read it; then
        `200`. A storage error on either lookup answers `500` `{"error":"internal error"}`, never `404`
        (an outage is not reported as "not found") and never `200` (the reader check does not fail open).
        An allowed reader receives the full record including every host row (accepted, pending and declined)
        with each host''s email, name and avatar; `is_owner` is computed against the caller and `my_status`
        is the caller''s own host status. Building that record reads the roster (the link''s host rows
        and each host''s user record); a storage error on that read also answers `500` `{"error":"internal
        error"}`, never `200` with `hosts: []` or with a host''s email missing (PAC-25 C-2). An accepted
        co-host therefore still sees pending and declined invitees'' emails, as through the list (PAC-25
        D-2).'
      responses:
        '200':
          description: 'The link, with hosts. Returned only to the owner (`is_owner: true`) or an accepted
            co-host (`is_owner: false`, `my_status: accepted`), and only when the whole roster was read:
            `hosts` is never emptied and no host''s email is dropped because a storage read failed. A
            failed roster read is `500`, not this response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: 'Body exactly `{"error":"not found"}`. Returned when no link has that id, AND when
            the link exists but the caller is neither its owner nor an accepted co-host (never invited,
            invitation pending or declined, left or removed). The two cases are indistinguishable by status
            and body (PAC-25 D-1). A soft-deleted link (`active=false`) is NOT a 404 for its owner or
            accepted co-hosts: GetSchedulingLinkByID ignores `active`, so they still receive 200 (API-050,
            not resolved by PAC-25).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              example:
                error: not found
        '500':
          description: 'Body: {"error":"internal error"}. A storage error on the link lookup, on the caller''s
            host-status lookup, or on the roster read (PAC-25 C-2).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    patch:
      operationId: updateSchedulingLink
      tags:
      - scheduling-links
      summary: Partially update a scheduling link (owner only).
      description: 'Every field is optional; absent fields keep their stored value. The whole merged record
        is re-validated, so a patch can fail 422 on a field it did not touch. When `co_host_emails` is
        present (even `[]`) it sets the co-host list by difference (PAC-61): non-owner hosts whose email
        is not listed are removed, listed emails that are not yet hosts are added as `pending`, and listed
        hosts keep their status (accepted, pending or declined).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchedulingLinkRequest'
      responses:
        '200':
          description: Updated link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: '"invalid id" or "invalid request body"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'Caller is not the owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: 'New slug collides with another link. Body: {"error":"slug already exists"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          $ref: '#/components/responses/SchedulingLinkValidationError'
        '500':
          description: '`error` is "internal error" (lookup or update failed) or "slug check failed".
            The detail is written to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    delete:
      operationId: deleteSchedulingLink
      tags:
      - scheduling-links
      summary: Deactivate a scheduling link (owner only).
      description: Soft delete -- `UPDATE scheduling_links SET active=false`. The row and its bookings
        survive; the public `/api/book/{slug}` lookup filters on `active=true` and will start returning
        404, while `GET /api/scheduling-links/{id}` still returns the link.
      responses:
        '204':
          description: Deactivated. Empty body.
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'Caller is not the owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Lookup or delete failed. Body: `{"error":"internal error"}`. The detail is written
            to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
