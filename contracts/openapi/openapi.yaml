  /api/habits/{id}/occurrences/{occurrenceId}:
    parameters:
    - $ref: '#/components/parameters/HabitId'
    - name: occurrenceId
      in: path
      required: true
      description: The habit_occurrences row id.
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateHabitOccurrenceStatus
      tags:
      - habits
      summary: Mark an occurrence completed or scheduled
      description: 'Only `status` is read. It is lowercased and trimmed before comparison, so

        "Completed" and " completed " are accepted. Ownership is enforced inside the

        SQL UPDATE (join on habits.user_id); a row belonging to another user is

        indistinguishable from a missing row and yields 404, not 403.

        The engine also writes "displaced" and "missed" statuses, but neither can be

        set through this endpoint.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitOccurrenceStatusUpdate'
      responses:
        '200':
          description: The updated occurrence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitOccurrence'
        '400':
          description: 'One of: "invalid habit id"; "invalid occurrence id"; "invalid request body";

            "status must be completed or scheduled".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
