            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listSsoProviders
      tags:
      - auth
      summary: List the SSO configurations belonging to the caller's org
      description: 'Any member of the org may call it (unchanged by PAC-22; restricting

        who may read is out of PAC-22''s scope, spec §5). Since PAC-22 the

        response is an SsoProviderList: a named container, not a bare array

        (spec §3.7), whose items never carry the client secret or a signing

        certificate under any name, nor anything derived from either, whoever

        the caller is (API-001 disclosure half, spec AC-1): neither stored

        value occurs anywhere in the body or the headers, raw or

        JSON-escaped, in any letter case. Suspended configurations are listed,

        with `state: suspended`; so are configurations stored before PAC-22

        that could not be written today (a SAML row, an incomplete OIDC row).

        A configuration is listed when its domain equals the org''s domain

        exactly (the join is on `organizations.domain`).

        '
      responses:
        '200':
          description: The org's configurations; `{"providers":[]}` when there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoProviderList'
        '401':
          description: No/invalid JWT (text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: '"org membership required" — the user has no org_id (also returned when the user
            lookup errors).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Query failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/sso/{domain}:
    delete:
      operationId: deleteSsoProvider
      tags:
      - auth
      summary: Delete the SSO provider for a domain
      description: 'Deletes by domain after checking the domain belongs to the caller''s org.

        Deleting a domain that has no provider row still returns 204 — the

        storage layer does not check rows-affected.

        '
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted (or nothing existed). No body.
        '401':
          description: No/invalid JWT (text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: '"org membership required"; "org not found"; "can only delete SSO for your own
            domain".'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Delete failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/sso/{domain}/state:
    put:
      operationId: setSsoProviderState
      tags:
      - auth
      summary: Suspend or resume the SSO configuration for a domain
      description: "Added by PAC-22 (spec §3.3, §3.5, §3.6; resolves API-066). The only\noperation that\
        \ changes whether SSO is active, and it changes nothing\nelse. The request names its target (`{domain}`,\
        \ as deleteSsoProvider\ndoes) and the state it wants; it never toggles. It carries no\nconfiguration\
        \ value and no secret, so suspending and resuming never\nneed the client secret (spec AC-10, AC-12).\n\
        \nWhile a configuration is suspended, sign-in behaves as if no SSO were\nconfigured for its domain:\
        \ detectAuthProvider does not answer `sso`\nand startSsoLogin answers 404. The configuration itself\
        \ is kept and\nstays listed. **Suspension stops new sign-ins; it does not end\nsessions** already\
        \ issued through the provider (spec §3.5).\n\n**Not implementable before PAC-50 merges (spec D-5,\
        \ D-6).** The\ncaller must be permitted to change SSO configuration under exactly\nthe rule that\
        \ authorizes createSsoProvider writes, never membership\nalone. On `main` at the time of writing\
        \ that rule is membership only,\nwhich D-6 forbids here; this operation is therefore specified\
        \ against\nPAC-50's gate and this contract is rebased onto PAC-50 before it is\nimplemented (see\
        \ contracts/features/PAC-22.md, \"Rebase onto PAC-50\").\n\nChecks run in this order; the first\
        \ that fails decides the response:\n\n1. Membership: the caller belongs to an org, else 403\n\
        \   `org membership required` (or `org not found`).\n2. Body: JSON (`invalid JSON`); then its\
        \ properties in body order:\n   the first property other than `state` is refused\n   (`unknown\
        \ property: <name>`), so no configuration value can ride\n   along, and a second `state` is refused\
        \ (`duplicate property:\n   state`), so a body never asks for two states and no decoder's\n  \
        \ \"last one wins\" decides a kill switch; then `state` is `active` or\n   `suspended` (`state\
        \ must be 'active' or 'suspended'`, for a missing\n   or `null` state too).\n3. Domain: `{domain}`,\
        \ lower-cased and not trimmed, must equal the\n   caller's org domain exactly, case-insensitively,\
        \ else 403\n   `provider_domain_mismatch`. A subdomain of the org domain, and\n   another org's\
        \ domain, are both refused (spec AC-21). The status is\n   the one a configuration write to such\
        \ a domain gets: 403, as the\n   owner decided for PAC-50 on 2026-10-27 (spec D-15), and as\n\
        \   createSsoProvider answers on `main` today. PAC-50's branch at\n   `51aa70a` still answers\
        \ 400 there; if PAC-50 merges with another\n   status, revision 2 (the rebase) follows what merged\
        \ (spec D-15).\n4. Authorization: the write authorization of createSsoProvider\n   (PAC-50: a\
        \ live step-up grant, consumed, or break-glass with a\n   fresh session), else 403 with createSsoProvider's\
        \ 403 body.\n   Steps 1-3 are decided from the request alone and leave the\n   authorization unspent.\n\
        5. Lookup of the configuration for the lower-cased domain, whatever\n   its state: none gives\
        \ 404 `sso provider not found`; nothing is\n   created and nothing is recorded, and the authorization\
        \ is spent\n   (spec D-9, AC-19).\n6. If the configuration is already in the requested state,\
        \ nothing\n   changes and the answer is 200 with the configuration as stored\n   (spec AC-20).\
        \ Otherwise only the active state is written: no\n   configuration value is read from the request\
        \ or written, so a\n   replace stored while this request is in flight keeps its values\n   and\
        \ this request keeps its state (spec AC-28).\n   `updated_at` is not changed by this operation\
        \ in either case: it\n   records the last configuration write (createSsoProvider).\n7. Recording:\
        \ every transition that found its configuration,\n   including one that changed nothing, is recorded\
        \ where PAC-50\n   records configuration writes, as `sso_provider_written` with the\n   operation\
        \ `suspend` (state `suspended`) or `resume` (state\n   `active`), naming the organisation, the\
        \ acting user and the\n   provider (spec D-10, AC-16). No operation exposes that record.\n   The\
        \ state write and its record are one transaction, as PAC-50's\n   configuration writes are: either\
        \ both happen or neither does.\n\nThis operation acts on configurations stored before PAC-22 that\n\
        createSsoProvider would refuse today (a SAML row, an incomplete OIDC\nrow) exactly as on any other\
        \ (spec AC-8).\n\n`PUT /api/admin/sso/stepup/state` (PAC-50 defines GET on\n`/api/admin/sso/stepup`)\
        \ is this operation with `{domain}` =\n`stepup`, which is never an org domain: 403 `provider_domain_mismatch`.\n"
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          minLength: 1
        description: The caller's org domain, in any casing, e.g. "acme.com".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoProviderStateRequest'
      responses:
        '200':
          description: 'The configuration after the request, as an SsoProvider; `state`

            is the requested state. The same answer when it was already in

            that state.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoProvider'
        '400':
          description: 'JSON error; nothing changes and no authorization is spent. One

            of: `invalid JSON`; `unknown property: <name>`; `duplicate

            property: state`; `state must be ''active'' or ''suspended''`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No/invalid JWT (text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: '`org membership required` / `org not found` (step 1);

            `provider_domain_mismatch`, the target is not exactly the

            caller''s org domain (step 3, spec AC-21, D-15; no authorization

            is spent); or the caller is not permitted to write SSO

            configuration (step 4). The step-4 body is the one

            createSsoProvider''s 403 uses (PAC-50: SsoWriteForbiddenResponse

            after the rebase). The configuration''s state is unchanged and

            nothing is recorded (spec AC-15, AC-21).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`sso provider not found`: the caller is permitted, but no

            configuration exists for the domain. Nothing is created or

            recorded; the authorization is spent (spec D-9, AC-19).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Storage failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21). An authorization consumed for this request stays consumed.
            The state write and its `sso_provider_written` record are one transaction, so after a 500
            the state is the one stored before the request and nothing is recorded for it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/analytics/meetings:
    get:
      operationId: listAnalyticsMeetings
      tags:
      - analytics
      summary: Meetings in the week containing a date
      description: 'Live Google Calendar read for the Monday-anchored week containing `date`.

        Only events with `start.dateTime` set (all-day events skipped) and at least one

        attendee are included; events matching one of the user''s focus blocks or a habit occurrence''s

        calendar_event_id are excluded. Sorted by `duration_minutes` descending.

        A nil slice is normalised to `[]`.

        '
      parameters:
      - name: date
        in: query
        required: false
        description: Any date inside the wanted week, `YYYY-MM-DD`. Defaults to today. An unparseable
          value silently falls back to today.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: The week's meetings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalyticsMeeting'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: 'The calendar read failed for a user who HAS a stored Google credential (a user
            with none gets the 401 `calendar not connected`). Before PAC-21 was finished a user with no
            credential got this 500 (API-054). Body: `{"error":"internal error"}`. The detail is written
            to the server log and Sentry only (PAC-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/analytics/recompute:
    post:
      operationId: recomputeAnalytics
      tags:
      - analytics
      summary: Force a background recompute of the current week
      description: 'Spawns `AnalyticsEngine.ForceCompute` for the week containing `time.Now()` on a

        detached context and returns immediately. The request body is never read, and no

        parameters select the week. Errors from the background job are swallowed.

        '
      responses:
        '202':
          description: Recompute accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsRecomputeAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/analytics/trends:
    get:
      operationId: listAnalyticsTrends
      tags:
      - analytics
      summary: Recent stored weekly analytics rows
      description: 'Reads previously persisted rows only — it never computes. Ordered

        `week_start DESC` (newest first). A nil slice is normalised to `[]`.

        Each item has the same fields as the GET /api/analytics/week response, in the

        same formats and on the same scales, minus `breakdown` (PAC-42): `week_start` is

        the calendar date of the week''s Monday (`YYYY-MM-DD`), and `habit_completion_rate`

        and `focus_score` are percentages where 100 means the whole. The `breakdown`

        array exists only on /api/analytics/week (API-055 second half, out of PAC-42''s

        scope).

        '
      parameters:
      - name: weeks
        in: query
        required: false
        description: 'Number of weeks to return (SQL LIMIT). Default 8. Only values parsing as an

          integer in [1, 52] are honoured; anything else (non-numeric, 0, negative,

          > 52) SILENTLY falls back to 8. There is no 400.

          '
        schema:
          type: integer
          minimum: 1
          maximum: 52
          default: 8
      responses:
        '200':
          description: Stored analytics weeks, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalyticsWeekRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/analytics/week:
    get:
      operationId: getAnalyticsWeek
      tags:
      - analytics
      summary: Weekly time breakdown for the week containing a date
      description: 'The week is the Monday-anchored week containing `date`. A cached row is returned

        when it was computed within the last 24h, otherwise the week is recomputed and

        upserted synchronously (this call may hit the Google Calendar API).

        The response carries the same fields as a GET /api/analytics/trends row, in the

        same formats and on the same scales, plus a `breakdown` array (PAC-42):

        `week_start` is the calendar date of the week''s Monday (`YYYY-MM-DD`), equal

        byte for byte to the trend row for the same week, and every proportion in the

        response (`habit_completion_rate`, `focus_score`, each `breakdown[].percentage`)

        is a percentage where 100 means the whole.

        '
      parameters:
      - name: date
        in: query
        required: false
        description: 'Any date inside the wanted week, `YYYY-MM-DD`. Defaults to today.

          An unparseable value is SILENTLY ignored and falls back to today — there is

          no 400 for a bad date here (see `parseDateParam`).

          '
        schema:
          type: string
          format: date
      responses:
        '200':
          description: The computed week.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsWeekWithBreakdown'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: 'Compute failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21). There is no 404 (PAC-42, audit U-01): the week is either
            served from a stored row or computed and upserted, and the upsert''s `INSERT ... ON CONFLICT
            DO UPDATE ... RETURNING` yields a row on both the insert and the conflict path (observed,
            contracts/features/PAC-42.md section 4). The former `{"error":"not found"}` branch for a nil
            result is removed; should an implementation keep a guard for it, that guard answers this 500.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/attendees/suggest:
