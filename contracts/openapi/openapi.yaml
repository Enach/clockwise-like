    NLPParseResult:
      type: object
      description: 'nlp.ParseResult. snake_case - the only snake_case RESPONSE body in this domain. Every
        field except `intent` carries `omitempty`, so absent members are normal.

        '
      properties:
        intent:
          type: string
          description: 'Values observed in the code and prompts: `schedule_meeting`, `schedule_focus`,
            `unknown`. The field is a plain string with no server-side validation, and the value ultimately
            comes from the LLM, so other values are possible.

            '
          examples:
          - schedule_meeting
          - schedule_focus
          - unknown
        title:
          type: string
        duration_minutes:
          type: integer
        attendees:
          type: array
          items:
            type: string
        range_start:
          type: string
          format: date-time
          description: 'Go `time.Time` with omitempty - which does NOT omit the zero time, so a missing
            value may still serialise as `0001-01-01T00:00:00Z`.

            '
        range_end:
          type: string
          format: date-time
          description: Same zero-time caveat as range_start.
        preferred_times:
          type: array
          items:
            type: string
          description: Free-form windows, e.g. `"10:00-12:00"`.
        avoid_times:
          type: array
          items:
            type: string
        constraints:
          type: string
          description: Reused as the event Description by /api/nlp/confirm.
        timezone_notes:
          type: string
        error:
          type: string
          description: 'Set (with intent `unknown`) when the LLM call fails or returns invalid JSON -
            still HTTP 200.

            '
        suggested_slots:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedSlot'
        participant_infos:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantInfo'
      required:
      - intent
      additionalProperties: false
    NoMeetingZone:
      type: object
