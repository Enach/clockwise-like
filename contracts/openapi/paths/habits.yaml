# Domain: habits
# Covers: habits, analytics, meeting briefs, Slack/Notion integrations.
# Source of truth: backend/api/routes.go, handlers_habits.go, handlers_analytics.go,
# handlers_meeting_briefs.go, handlers_integrations.go, backend/engine/*, backend/storage/*.
# All routes below are registered inside the `requireAuth(jwtSecret)` chi group in
# routes.go, so they inherit the global default security scheme (no local `security` key).
# GET /api/integrations/availability is deliberately omitted (public route, owned elsewhere).
paths:
  /api/habits/templates:
    get:
      operationId: listHabitTemplates
      tags: [habits]
      summary: List the 12 built-in habit starter templates
      description: |
        Returns `engine.HabitTemplates` verbatim. Static, not user-scoped, never empty.
        The handler writes no explicit status code, so Go's implicit 200 applies.
      responses:
        "200":
          description: The static template list (always 12 entries).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HabitTemplate'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/habits/reoptimize:
    post:
      operationId: reoptimizeHabits
      tags: [habits]
      summary: Kick off background re-scheduling of all active habits
      description: |
        Spawns `HabitsEngine.ReoptimizeAll` on a detached context (14-day horizon) and
        returns immediately. The request body is never read. Errors from the background
        job are swallowed and are not observable through this endpoint.
      responses:
        "200":
          description: Reoptimization started. Note the status is 200, not 202 (contrast POST /api/analytics/recompute).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitsReoptimizeAck'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List all habits for the authenticated user
      description: |
        Returns every habit owned by the caller, active and inactive alike
        (`storage.ListHabitsByUser` has no `active` filter), ordered by
        `priority DESC, created_at ASC`. A nil slice is normalised to `[]`.
      responses:
        "200":
          description: The user's habits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habit'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a habit
      description: |
        Server-side defaults are applied *before* validation:
        `days_of_week` -> [1,2,3,4,5] when the key is absent or JSON `null`;
        `window_start` -> "09:00" and `window_end` -> "17:00" when absent or blank after trimming;
        `priority` -> 50 when absent or explicitly `0`;
        `color` -> "#5B7FFF" when absent or empty.
        `title` is trimmed. On success a background `ReoptimizeAll` is started.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCreateRequest'
      responses:
        "201":
          description: The created habit, as persisted (id, user_id, active, created_at filled in by the DB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        "400":
          description: |
            Malformed JSON body ("invalid request body") or a validation failure. The
            exact `error` strings are enumerated in habits.notes.md and are stable
            because handlers_habits_validation_test.go pins them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: 'Insert failed. `error` is the literal prefix "create failed: " plus the driver error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/habits/{id}:
    parameters:
      - $ref: '#/components/parameters/HabitId'
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Partially update a habit
      description: |
        Every field is optional. Absent (or JSON `null`) fields keep the stored value —
        the handler merges the body onto the existing row and then revalidates the whole
        merged habit, so a partial update can still fail validation because of a
        pre-existing stored value. Unlike POST, an explicit `priority: 0` is honoured
        (0 is a legal priority here). On success a background `ReoptimizeAll` is started.
        Ownership is checked before the body is decoded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitUpdateRequest'
      responses:
        "200":
          description: The updated habit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        "400":
          description: '`id` is not a valid UUID ("invalid id"), the body is malformed ("invalid request body"), or the merged habit fails validation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          description: 'Lookup failed ("internal error") or the UPDATE failed ("update failed: " + driver error).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deactivateHabit
      tags: [habits]
      summary: Deactivate (soft-delete) a habit
      description: |
        Sets `active = false`. The row is never removed, and existing
        habit_occurrences rows and any already-created calendar events are left in place.
      responses:
        "204":
          description: Deactivated. Empty body, no Content-Type header.
        "400":
          description: '`id` is not a valid UUID ("invalid id").'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          description: 'Lookup failed ("internal error") or the UPDATE failed ("deactivate failed: " + driver error).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/habits/{id}/occurrences:
    parameters:
      - $ref: '#/components/parameters/HabitId'
    get:
      operationId: listHabitOccurrences
      tags: [habits]
      summary: List scheduled instances of a habit in a date range
      description: |
        The range defaults to [today-1month, today+1month] computed from `time.Now().UTC()`
        truncated to midnight. Both bounds are inclusive (`scheduled_date >= from AND <= to`).
        Results are ordered by `scheduled_date ASC`. A nil slice is normalised to `[]`.
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive lower bound, strictly `YYYY-MM-DD`. Defaults to one month before today (UTC).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive upper bound, strictly `YYYY-MM-DD`. Defaults to one month after today (UTC).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Occurrences in the range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HabitOccurrence'
        "400":
          description: |
            One of: "invalid id" (id is not a UUID); "from must use YYYY-MM-DD";
            "to must use YYYY-MM-DD"; "from must be on or before to".
            Note an empty-string query value is treated as absent, not as an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/habits/{id}/occurrences/{occurrenceId}:
    parameters:
      - $ref: '#/components/parameters/HabitId'
      - name: occurrenceId
        in: path
        required: true
        description: The habit_occurrences row id.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateHabitOccurrenceStatus
      tags: [habits]
      summary: Mark an occurrence completed or scheduled
      description: |
        Only `status` is read. It is lowercased and trimmed before comparison, so
        "Completed" and " completed " are accepted. Ownership is enforced inside the
        SQL UPDATE (join on habits.user_id); a row belonging to another user is
        indistinguishable from a missing row and yields 404, not 403.
        The engine also writes "displaced" and "missed" statuses, but neither can be
        set through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitOccurrenceStatusUpdate'
      responses:
        "200":
          description: The updated occurrence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitOccurrence'
        "400":
          description: |
            One of: "invalid habit id"; "invalid occurrence id"; "invalid request body";
            "status must be completed or scheduled".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No occurrence with that id under that habit for this user. Body is `{"error":"not found"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/analytics/week:
    get:
      operationId: getAnalyticsWeek
      tags: [analytics]
      summary: Weekly time breakdown for the week containing a date
      description: |
        The week is the Monday-anchored week containing `date`. A cached row is returned
        when it was computed within the last 24h, otherwise the week is recomputed and
        upserted synchronously (this call may hit the Google Calendar API).
        The response is a hand-built map, not the raw `storage.AnalyticsWeek` struct, so
        its `week_start` is a plain date and it carries an extra `breakdown` array.
      parameters:
        - name: date
          in: query
          required: false
          description: |
            Any date inside the wanted week, `YYYY-MM-DD`. Defaults to today.
            An unparseable value is SILENTLY ignored and falls back to today — there is
            no 400 for a bad date here (see `parseDateParam`).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The computed week.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsWeekWithBreakdown'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: |
            Emitted when the engine returns a nil result with a nil error. Body is
            `{"error":"not found"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-uncertain: "Believed unreachable in practice: compute() always returns a row from the INSERT ... RETURNING, or an error. Documented because the branch exists."
        "500":
          description: '`error` is the literal prefix "compute failed: " plus the underlying error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analytics/trends:
    get:
      operationId: listAnalyticsTrends
      tags: [analytics]
      summary: Recent stored weekly analytics rows
      description: |
        Reads previously persisted rows only — it never computes. Ordered
        `week_start DESC` (newest first). A nil slice is normalised to `[]`.
        Items are the RAW `storage.AnalyticsWeek` struct, which differs from
        /api/analytics/week: `week_start` is a full RFC3339 timestamp here, and there is
        no `breakdown` field.
      parameters:
        - name: weeks
          in: query
          required: false
          description: |
            Number of weeks to return (SQL LIMIT). Default 8. Only values parsing as an
            integer in [1, 52] are honoured; anything else (non-numeric, 0, negative,
            > 52) SILENTLY falls back to 8. There is no 400.
          schema:
            type: integer
            minimum: 1
            maximum: 52
            default: 8
      responses:
        "200":
          description: Stored analytics weeks, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalyticsWeekRow'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/analytics/meetings:
    get:
      operationId: listAnalyticsMeetings
      tags: [analytics]
      summary: Meetings in the week containing a date
      description: |
        Live Google Calendar read for the Monday-anchored week containing `date`.
        Only events with `start.dateTime` set (all-day events skipped) and at least one
        attendee are included; events matching a focus block or a habit occurrence's
        calendar_event_id are excluded. Sorted by `duration_minutes` descending.
        A nil slice is normalised to `[]`.
      parameters:
        - name: date
          in: query
          required: false
          description: Any date inside the wanted week, `YYYY-MM-DD`. Defaults to today. An unparseable value silently falls back to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The week's meetings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalyticsMeeting'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: |
            `error` is the literal prefix "internal error: " plus the underlying error.
            NOTE this is also what a user with no connected Google account receives —
            `calOpsForUser` returns "no token for user <uuid>" and the handler maps it
            to 500 rather than a 4xx.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analytics/recompute:
    post:
      operationId: recomputeAnalytics
      tags: [analytics]
      summary: Force a background recompute of the current week
      description: |
        Spawns `AnalyticsEngine.ForceCompute` for the week containing `time.Now()` on a
        detached context and returns immediately. The request body is never read, and no
        parameters select the week. Errors from the background job are swallowed.
      responses:
        "202":
          description: Recompute accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsRecomputeAck'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/meetings/{event_id}/brief:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getMeetingBrief
      tags: [meeting-briefs]
      summary: Read the cached Slack/Notion brief for a meeting
      description: |
        Pure read — it never triggers generation. When no brief row exists the handler
        returns 200 (not 404) with `{"status":"pending","sources":{"slack":[],"notion":[]}}`
        and no `generated_at` / `brief_text`.
      responses:
        "200":
          description: The brief, or a synthetic `pending` placeholder when none is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingBriefResponse'
        "400":
          description: |
            "event_id required" as PLAIN TEXT (written via `http.Error`, so
            `Content-Type: text/plain; charset=utf-8`, not the JSON error shape).
          content:
            text/plain:
              schema:
                type: string
          x-uncertain: "Believed unreachable: chi never matches an empty {event_id} segment, so this branch cannot fire through the router."
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: '"db error" as PLAIN TEXT via `http.Error` — not the JSON error shape.'
          content:
            text/plain:
              schema:
                type: string

  /api/meetings/{event_id}/brief/refresh:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: refreshMeetingBrief
      tags: [meeting-briefs]
      summary: Force-regenerate a meeting brief
      description: |
        Synchronous and slow — bounded by a 60s server-side context timeout. Calls
        `MeetingBriefService.Generate(..., force=true)`, which searches Slack and Notion
        and (when an LLM is configured in settings) writes `brief_text`.
        The handler builds a stub `calendar.Event{Id: event_id}` rather than fetching the
        real event, so the brief's search terms come from the stored/derived context only.
        The request body is never read.
        The returned `status` is "ready" on success and "failed" when the source fetch or
        LLM step failed — a "failed" brief is still returned with HTTP 200.
      responses:
        "200":
          description: The regenerated brief.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingBriefResponse'
        "400":
          description: '"event_id required" as PLAIN TEXT. Believed unreachable via chi routing.'
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: 'PLAIN TEXT "generation error: " plus the underlying error.'
          content:
            text/plain:
              schema:
                type: string

  /api/integrations/slack/connect:
    get:
      operationId: connectSlack
      tags: [integrations]
      summary: Begin the Slack OAuth flow (redirect)
      description: |
        Sets an HttpOnly `slack_oauth_state` cookie (Path=/, Max-Age=300) and 302-redirects
        to Slack. This is a browser navigation endpoint, not a JSON API: it returns no body.
        Requested scopes: `search:read,users:read,channels:read,chat:write`; user_scope `search:read`.
        Note this route sits inside the authenticated group, so the browser must already
        carry the `auth_token` cookie when it navigates here.
      responses:
        "302":
          description: Redirect to Slack's authorize page.
          headers:
            Location:
              description: '`https://slack.com/oauth/v2/authorize?client_id=…&redirect_uri=…&scope=…&user_scope=search%3Aread&state=…`'
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: '`slack_oauth_state=<random>; Path=/; Max-Age=300; HttpOnly`'
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "503":
          description: '`SLACK_CLIENT_ID` is unset. PLAIN TEXT body "Slack not configured".'
          content:
            text/plain:
              schema:
                type: string

  /api/integrations/slack/callback:
    get:
      operationId: slackOauthCallback
      tags: [integrations]
      summary: Slack OAuth redirect target (redirect)
      description: |
        Validates the `state` query value against the `slack_oauth_state` cookie, exchanges
        `code` at `https://slack.com/api/oauth.v2.access`, upserts the workspace connection
        and 302-redirects into the SPA. Never returns JSON on success.
      parameters:
        - name: code
          in: query
          required: false
          description: |
            Slack's authorization code. Marked optional because the handler does not check
            for its presence — a missing code is forwarded to Slack and surfaces as a 502.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: Must equal the `slack_oauth_state` cookie value exactly.
          schema:
            type: string
      responses:
        "302":
          description: Connection stored; redirect back into the app.
          headers:
            Location:
              description: Always the literal `/app/settings?tab=integrations&slack=connected`.
              schema:
                type: string
        "400":
          description: 'Cookie missing or state mismatch. PLAIN TEXT "invalid state".'
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: 'PLAIN TEXT "db error" — the upsert failed.'
          content:
            text/plain:
              schema:
                type: string
        "502":
          description: 'PLAIN TEXT "token exchange failed: " plus the error (transport error, unparseable JSON, or Slack''s `error` string when `ok:false`).'
          content:
            text/plain:
              schema:
                type: string

  /api/integrations/slack/status:
    get:
      operationId: getSlackStatus
      tags: [integrations]
      summary: Whether Slack is connected for this user
      description: |
        Always 200. Any storage error (including "no row") is collapsed into
        `{"connected": false}` — the `workspace_name` key is then absent entirely.
      responses:
        "200":
          description: Connection status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatus'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/integrations/slack:
    delete:
      operationId: disconnectSlack
      tags: [integrations]
      summary: Delete the stored Slack connection
      description: |
        Deletes the `workspace_connections` row for (user, "slack"). The storage error is
        explicitly discarded, so a failed delete is still reported as 204. Deleting a
        connection that does not exist is also 204 — this endpoint is idempotent and
        never reports 404.
      responses:
        "204":
          description: Disconnected. Empty body.
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/integrations/notion/connect:
    get:
      operationId: connectNotion
      tags: [integrations]
      summary: Begin the Notion OAuth flow (redirect)
      description: |
        Sets an HttpOnly `notion_oauth_state` cookie (Path=/, Max-Age=300) and 302-redirects
        to Notion. Browser navigation endpoint, no body. Unlike Slack, no `scope` is
        requested — the query carries `response_type=code` and `owner=user`.
      responses:
        "302":
          description: Redirect to Notion's authorize page.
          headers:
            Location:
              description: '`https://api.notion.com/v1/oauth/authorize?client_id=…&redirect_uri=…&response_type=code&owner=user&state=…`'
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: '`notion_oauth_state=<random>; Path=/; Max-Age=300; HttpOnly`'
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "503":
          description: '`NOTION_CLIENT_ID` is unset. PLAIN TEXT body "Notion not configured".'
          content:
            text/plain:
              schema:
                type: string

  /api/integrations/notion/callback:
    get:
      operationId: notionOauthCallback
      tags: [integrations]
      summary: Notion OAuth redirect target (redirect)
      description: |
        Validates `state` against the `notion_oauth_state` cookie, exchanges `code` at
        `https://api.notion.com/v1/oauth/token` (HTTP Basic with client id/secret),
        upserts the connection and 302-redirects into the SPA.
        The stored connection has no bot token and no scopes (Notion returns none here).
      parameters:
        - name: code
          in: query
          required: false
          description: Notion's authorization code. Presence is not checked by the handler; a missing code surfaces as a 502.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: Must equal the `notion_oauth_state` cookie value exactly.
          schema:
            type: string
      responses:
        "302":
          description: Connection stored; redirect back into the app.
          headers:
            Location:
              description: Always the literal `/app/settings?tab=integrations&notion=connected`.
              schema:
                type: string
        "400":
          description: 'Cookie missing or state mismatch. PLAIN TEXT "invalid state".'
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: 'PLAIN TEXT "db error" — the upsert failed.'
          content:
            text/plain:
              schema:
                type: string
        "502":
          description: 'PLAIN TEXT "token exchange failed: " plus the error (transport error, unparseable JSON, or a non-empty `error` field from Notion).'
          content:
            text/plain:
              schema:
                type: string

  /api/integrations/notion/status:
    get:
      operationId: getNotionStatus
      tags: [integrations]
      summary: Whether Notion is connected for this user
      description: 'Always 200. Any storage error collapses into `{"connected": false}` with no `workspace_name` key.'
      responses:
        "200":
          description: Connection status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatus'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/integrations/notion:
    delete:
      operationId: disconnectNotion
      tags: [integrations]
      summary: Delete the stored Notion connection
      description: Idempotent. The storage error is discarded, so this is always 204.
      responses:
        "204":
          description: Disconnected. Empty body.
        "401":
          $ref: '#/components/responses/Unauthorized'

components:
  parameters:
    HabitId:
      name: id
      in: path
      required: true
      description: Habit id. Parsed with `uuid.Parse`, which also accepts the unhyphenated, braced and `urn:uuid:` spellings.
      schema:
        type: string
        format: uuid
    EventId:
      name: event_id
      in: path
      required: true
      description: |
        The provider calendar event id (`calendar_event_id` in meeting_briefs), used as an
        opaque string — no UUID or format validation is performed. Because it is a single
        chi path segment it cannot contain an unencoded `/`.
      schema:
        type: string
        minLength: 1

  responses:
    Unauthorized:
      description: |
        No `auth_token` cookie and no `Authorization: Bearer <jwt>` header, or the token
        failed validation, or its `sub` is not a UUID. Emitted by `requireAuth`.
        QUIRK: the body is the JSON text `{"error":"unauthorized"}` but it is written with
        `http.Error`, which overwrites the Content-Type to `text/plain; charset=utf-8`.
        Clients must not rely on the declared media type here.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The habit exists but belongs to another user. Body is `{"error":"forbidden"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No habit with that id. Body is `{"error":"not found"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Body is `{"error":"internal error"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      description: |
        The shared JSON error shape produced by `writeError` (backend/api/handlers_settings.go).
        Exactly one key. Handlers that use `http.Error` instead do NOT produce this shape —
        those responses are plain text and are called out per-operation.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Human-readable message. Several handlers concatenate the driver/underlying error onto a fixed prefix, so this is not a stable machine-readable code.

    HabitTemplate:
      type: object
      description: A built-in starter template (engine.HabitTemplate). Has no id and is not user-scoped.
      required: [title, duration_minutes, days_of_week, window_start, window_end, priority, color]
      additionalProperties: false
      properties:
        title:
          type: string
        duration_minutes:
          type: integer
        days_of_week:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        window_start:
          type: string
          pattern: '^[0-9]{2}:[0-9]{2}$'
        window_end:
          type: string
          pattern: '^[0-9]{2}:[0-9]{2}$'
        priority:
          type: integer
        color:
          type: string

    Habit:
      type: object
      description: storage.Habit. Every field is emitted — no `omitempty` anywhere on this struct.
      required: [id, user_id, title, duration_minutes, days_of_week, window_start, window_end, priority, color, active, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        days_of_week:
          type: array
          description: Monday=1 … Sunday=7. Non-empty, unique, ascending only by convention (insertion order is preserved by the DB array).
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        window_start:
          type: string
          description: Local clock time, exactly `HH:MM` (5 chars, zero-padded).
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        window_end:
          type: string
          description: Local clock time, exactly `HH:MM`. Strictly greater than `window_start`.
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        priority:
          type: integer
          description: Higher wins when habits compete for the same slot. Scheduling order is `priority DESC, created_at ASC`.
          minimum: 0
          maximum: 100
        color:
          type: string
          description: |
            Hex color. NOT validated by the backend — any string is accepted and stored.
            Only "#5B7FFF", "#E9B949" and "#9B7AE0" map to a dedicated Google Calendar
            color id; everything else falls back to graphite.
        active:
          type: boolean
          description: Set false by DELETE. Never settable at creation; settable via PATCH.
        created_at:
          type: string
          format: date-time

    HabitCreateRequest:
      type: object
      description: |
        Anonymous request struct in handlers_habits.go `create`. Unknown keys are ignored
        (the decoder does not call DisallowUnknownFields). `active` cannot be set here.
      required: [title, duration_minutes]
      properties:
        title:
          type: string
          description: Trimmed server-side. Must be non-empty and ≤200 runes after trimming.
          maxLength: 200
        duration_minutes:
          type: integer
          description: Required in practice — the Go zero value 0 fails validation.
          minimum: 1
          maximum: 1440
        days_of_week:
          type: array
          description: |
            Monday=1 … Sunday=7. Absent or `null` defaults to [1,2,3,4,5]. An explicitly
            empty array `[]` is NOT defaulted and fails validation.
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        window_start:
          type: string
          description: Defaults to "09:00" when absent or blank after trimming.
          default: "09:00"
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        window_end:
          type: string
          description: Defaults to "17:00" when absent or blank after trimming. Must be strictly after `window_start`.
          default: "17:00"
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        priority:
          type: integer
          description: |
            Defaults to 50. WARNING: the handler tests `if body.Priority == 0`, so an
            explicit `"priority": 0` is indistinguishable from omission and also becomes 50.
            Priority 0 can only be reached via PATCH.
          default: 50
          minimum: 1
          maximum: 100
        color:
          type: string
          description: Defaults to "#5B7FFF" when absent or empty. Not validated.
          default: "#5B7FFF"

    HabitUpdateRequest:
      type: object
      description: |
        Anonymous request struct in handlers_habits.go `update`. All fields are Go
        pointers (or a nil-able slice), so absent/`null` means "leave unchanged".
        The merged result is validated as a whole.
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        days_of_week:
          type: array
          description: '`null` or absent leaves the stored value; `[]` replaces it and then fails validation.'
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        window_start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        window_end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        priority:
          type: integer
          description: Unlike create, an explicit 0 is honoured.
          minimum: 0
          maximum: 100
        color:
          type: string
        active:
          type: boolean
          description: The only way to reactivate a habit that DELETE deactivated.

    HabitOccurrence:
      type: object
      description: storage.HabitOccurrence — one materialised instance of a habit on a date.
      required: [id, habit_id, scheduled_date, start_time, end_time, status, calendar_event_id, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        habit_id:
          type: string
          format: uuid
        scheduled_date:
          type: string
          format: date-time
          description: |
            The DB column is a DATE, but the Go field is `time.Time`, so it serialises as a
            full RFC3339 timestamp at midnight UTC (e.g. "2026-03-04T00:00:00Z"), NOT as
            "2026-03-04". Parsed from the DB with a failure-swallowing `time.Parse`, so a
            malformed stored value would surface as the zero time "0001-01-01T00:00:00Z".
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string
          description: |
            Written by the engine as well as by the API. "scheduled" (placed), "completed"
            (user-confirmed; survives reoptimization), "displaced" (its slot was taken and
            rescheduling is being attempted), "missed" (no slot fit in the window).
            Only "scheduled" and "completed" are settable via the API.
          enum: [scheduled, completed, displaced, missed]
        calendar_event_id:
          type: string
          description: Google Calendar event id for the mirrored event. Empty string when no calendar is connected or event creation failed. Never null.
        created_at:
          type: string
          format: date-time

    HabitOccurrenceStatusUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          description: Trimmed and lowercased before validation, so mixed case is accepted.
          enum: [completed, scheduled]

    HabitsReoptimizeAck:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: reoptimization started

    AnalyticsRecomputeAck:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: recompute accepted

    MeetingTitle:
      type: object
      description: storage.MeetingTitle — one entry of `top_meeting_titles` (top 5 by duration).
      required: [title, duration_minutes]
      additionalProperties: false
      properties:
        title:
          type: string
        duration_minutes:
          type: integer

    AnalyticsBreakdownEntry:
      type: object
      description: |
        api.breakdownEntry. Exactly 5 entries in a fixed order, with fixed colors:
        meeting #FF6B6B, focus #5B7FFF, habit #9B7AE0, personal #E9B949, free #B0BEC5.
      required: [category, minutes, percentage, color]
      additionalProperties: false
      properties:
        category:
          type: string
          enum: [meeting, focus, habit, personal, free]
        minutes:
          type: integer
        percentage:
          type: number
          format: double
          description: '`minutes / total_working_minutes * 100`, or 0 when total is 0. Not rounded. Note buffer_minutes is excluded from the breakdown, so the five percentages need not sum to 100.'
        color:
          type: string

    AnalyticsWeekWithBreakdown:
      type: object
      description: |
        Response of GET /api/analytics/week. Built by `weekWithBreakdown` as a
        `map[string]any`, so it deliberately differs from AnalyticsWeekRow: `week_start`
        is a plain date string and `breakdown` is added.
      required:
        - id
        - user_id
        - week_start
        - total_working_minutes
        - meeting_minutes
        - focus_minutes
        - habit_minutes
        - buffer_minutes
        - personal_minutes
        - free_minutes
        - meeting_count
        - focus_block_count
        - habit_completion_rate
        - largest_focus_block_minutes
        - top_meeting_titles
        - focus_score
        - estimated_meeting_cost_minutes
        - computed_at
        - breakdown
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        week_start:
          type: string
          format: date
          description: The Monday of the week, formatted "2006-01-02". DIFFERENT from the trends endpoint, which emits a full timestamp.
        total_working_minutes:
          type: integer
          description: Sum of the configured work windows Mon–Fri. Falls back to 2400 (480×5) when it computes to ≤0 and the working-hours mode is not "by_day".
        meeting_minutes:
          type: integer
        focus_minutes:
          type: integer
        habit_minutes:
          type: integer
        buffer_minutes:
          type: integer
          description: Never populated by `compute` — the engine leaves it at 0 in every write path.
          x-uncertain: "The column exists and round-trips through storage, but AnalyticsEngine.compute never sets BufferMinutes, so this is always 0 for engine-computed weeks."
        personal_minutes:
          type: integer
          description: Calendar events with zero attendees.
        free_minutes:
          type: integer
          description: total_working − meeting − focus − habit − personal, floored at 0.
        meeting_count:
          type: integer
        focus_block_count:
          type: integer
        habit_completion_rate:
          type: number
          format: double
          description: completed / (scheduled + completed) occurrences in the week, as a 0..1 FRACTION (not a percentage). 0 when there are none.
        largest_focus_block_minutes:
          type: integer
        top_meeting_titles:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/MeetingTitle'
        focus_score:
          type: integer
          description: '`focus*100/(focus+meeting)` clamped to ≤100; 50 when both are 0.'
          minimum: 0
          maximum: 100
        estimated_meeting_cost_minutes:
          type: integer
          description: Sum over meetings of duration × attendee count (person-minutes).
        computed_at:
          type: string
          format: date-time
        breakdown:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/AnalyticsBreakdownEntry'

    AnalyticsWeekRow:
      type: object
      description: |
        Raw `storage.AnalyticsWeek` as returned by GET /api/analytics/trends. Same field
        set as AnalyticsWeekWithBreakdown minus `breakdown`, and with `week_start`
        serialised as a full RFC3339 timestamp because the Go field is a `time.Time`.
      required:
        - id
        - user_id
        - week_start
        - total_working_minutes
        - meeting_minutes
        - focus_minutes
        - habit_minutes
        - buffer_minutes
        - personal_minutes
        - free_minutes
        - meeting_count
        - focus_block_count
        - habit_completion_rate
        - largest_focus_block_minutes
        - top_meeting_titles
        - focus_score
        - estimated_meeting_cost_minutes
        - computed_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        week_start:
          type: string
          format: date-time
          description: 'Midnight UTC of the Monday, e.g. "2026-03-02T00:00:00Z" — NOT the "2026-03-02" shape used by /api/analytics/week.'
        total_working_minutes:
          type: integer
        meeting_minutes:
          type: integer
        focus_minutes:
          type: integer
        habit_minutes:
          type: integer
        buffer_minutes:
          type: integer
        personal_minutes:
          type: integer
        free_minutes:
          type: integer
        meeting_count:
          type: integer
        focus_block_count:
          type: integer
        habit_completion_rate:
          type: number
          format: double
          description: 0..1 fraction.
        largest_focus_block_minutes:
          type: integer
        top_meeting_titles:
          type: array
          description: 'May serialise as `null` rather than `[]`: it is populated by a failure-swallowing `json.Unmarshal` of the JSONB column into a nil slice.'
          nullable: true
          maxItems: 5
          items:
            $ref: '#/components/schemas/MeetingTitle'
        focus_score:
          type: integer
        estimated_meeting_cost_minutes:
          type: integer
        computed_at:
          type: string
          format: date-time

    AnalyticsMeeting:
      type: object
      description: |
        One entry of GET /api/analytics/meetings. Built as an ad-hoc `map[string]any` in
        `AnalyticsEngine.WeekMeetings`; these four keys are always present.
      required: [title, duration_minutes, attendee_count, start_time]
      additionalProperties: false
      properties:
        title:
          type: string
          description: The calendar event summary. Empty string for an untitled event.
        duration_minutes:
          type: integer
        attendee_count:
          type: integer
          minimum: 1
        start_time:
          type: string
          format: date-time
          description: RFC3339, in the offset the calendar returned.

    SlackMessage:
      type: object
      description: storage.SlackMessage — one Slack search hit backing a brief.
      required: [channel_name, author_name, text, timestamp, permalink]
      additionalProperties: false
      properties:
        channel_name:
          type: string
        author_name:
          type: string
        text:
          type: string
          description: Excerpt, truncated server-side to roughly 200 characters.
        timestamp:
          type: string
          description: Slack's `ts` value (a string, e.g. "1712345678.123456") — NOT an RFC3339 date-time.
        permalink:
          type: string

    NotionPage:
      type: object
      description: storage.NotionPage — one Notion search hit backing a brief.
      required: [title, url, last_edited_time, parent_name]
      additionalProperties: false
      properties:
        title:
          type: string
        url:
          type: string
        last_edited_time:
          type: string
          description: 'Notion''s `last_edited_time` string. NOTE the Go field is named `LastEditedAt` but the json tag is `last_edited_time` — the tag wins.'
          format: date-time
        parent_name:
          type: string

    MeetingBriefSources:
      type: object
      description: Always present on a brief response. Both arrays are normalised from nil to `[]`, so neither is ever null.
      required: [slack, notion]
      additionalProperties: false
      properties:
        slack:
          type: array
          items:
            $ref: '#/components/schemas/SlackMessage'
        notion:
          type: array
          items:
            $ref: '#/components/schemas/NotionPage'

    MeetingBriefResponse:
      type: object
      description: |
        api.briefResponse. Note this is NOT the `storage.MeetingBrief` struct (which has
        no json tags at all and is never serialised) — id, user_id and calendar_event_id
        are not exposed.
      required: [status, sources]
      additionalProperties: false
      properties:
        status:
          type: string
          description: |
            "pending" — no stored brief, or generation is in flight;
            "ready" — brief_text and sources are usable;
            "failed" — generation ran and errored. A failed brief is still returned with HTTP 200.
          enum: [pending, ready, failed]
        generated_at:
          type: string
          format: date-time
          description: |
            RFC3339. `omitempty`, and omitted only in the "no stored brief" path of GET.
            When a stored brief exists this is always present — even a zero timestamp
            formats to the non-empty "0001-01-01T00:00:00Z".
        brief_text:
          type: string
          description: '`omitempty` — absent when no LLM is configured in settings, when generation failed, or in the synthetic pending response.'
        sources:
          $ref: '#/components/schemas/MeetingBriefSources'

    IntegrationStatus:
      type: object
      description: |
        Shared shape for GET /api/integrations/slack/status and .../notion/status.
        Built as a `map[string]interface{}`, so `workspace_name` is absent (not null)
        when not connected.
      required: [connected]
      additionalProperties: false
      properties:
        connected:
          type: boolean
        workspace_name:
          type: string
          description: Present only when `connected` is true. May be an empty string if the provider returned no workspace name at connect time.
