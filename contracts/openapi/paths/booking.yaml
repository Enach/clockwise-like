# Domain: booking
# Source of truth: backend/api/routes.go, handlers_booking.go,
# handlers_scheduling_links.go, handlers_conferencing.go,
# backend/storage/scheduling_links.go, backend/conference/*.go
# Every field below is traceable to a Go json tag, a chi route, or a handler write.
paths:

  # ---------------------------------------------------------------------------
  # PUBLIC booking surface (registered outside requireAuth in routes.go:24-27)
  # ---------------------------------------------------------------------------

  /api/book/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: Scheduling-link slug (chi URLParam "slug"). Lookup is `slug = $1 AND active = true`.
        schema:
          type: string
    get:
      operationId: getPublicLinkInfo
      tags: [booking]
      summary: Public metadata for a bookable scheduling link.
      security: []
      responses:
        '200':
          description: Link is bookable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLinkInfo'
        '404':
          description: 'No active link with that slug. Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: 'Link exhausted (single_use with >=1 use, or recurring at max_uses). Body: {"error":"link is no longer accepting bookings"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Storage failure. Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    post:
      operationId: createPublicBooking
      tags: [booking]
      summary: Book a slot on a public scheduling link.
      security: []
      description: >-
        Rate limited per client (NEW-booking-rate-limit). A client may make at
        most 20 requests to this operation per fixed 10-minute window; the
        window starts at the client's first counted request and is not extended
        by refused requests. The limit is checked and the request counted
        atomically, as the very first step of the handler: before the link
        lookup, before the body is read and before any validation, so every
        request counts whatever it would otherwise have answered (201, 400, 404,
        409, 410, 422 or 500), and a refused request answers 429 even for an
        unknown slug and never writes a booking. Concurrent requests cannot
        exceed the limit. The count is per client across all links, not per
        link or per host, and is separate from the slot-listing budget of
        `getPublicBookingSlots`. A client is identified exactly as for
        `detectAuthProvider` (PAC-39): the socket peer address, or the
        `X-Real-IP` header only when the socket peer is inside `TRUSTED_PROXIES`
        (comma-separated IPs or CIDRs; empty or unset trusts nobody; an
        unparseable entry trusts less, never more). `X-Forwarded-For` is never
        read. A client is one exact IPv4 or IPv6 address, with no prefix
        grouping. Counts live in process memory: the limit is per backend
        process (20 per replica, as API-062's residue), and a restart clears
        them. Clients whose window has ended are forgotten by a sweep that runs
        on a request, at most once per window, so memory stays bounded. CORS
        preflight (`OPTIONS`) is answered by the CORS middleware and is not
        counted. Not checked (API-094, open): the requested time is never
        checked against the hosts' availability, the link's days or hours, or
        any upper date bound. The only time checks are the minimum notice (422)
        and overlap with this link's own non-cancelled bookings (409); any other
        start is accepted. The booking row is saved, then a calendar event (with
        the booker email as a guest) is attempted on each accepted host's
        calendar, best effort: a host whose user record or calendar client
        cannot be loaded is skipped and a failed event creation is ignored, so a
        201 does not mean any host's calendar was written. Operation-level
        `security: []` is kept: this operation is public and is registered
        outside requireAuth; the rate limit is not authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicBookingRequest'
      responses:
        '201':
          description: Booking confirmed and host calendar events written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBookingConfirmation'
        '400':
          description: >-
            Validation failure. Messages: "invalid request body";
            "name, email, and start are required"; "invalid start time, use RFC3339";
            "invalid end time, use RFC3339"; "duration does not match end time";
            "invalid duration"; "end must be after start" (reachable only when
            the end computed from `duration_minutes` overflows, which needs a
            link duration option above about 153,722,867 minutes; an ordinary
            end at or before start answers "duration does not match end time" or
            "invalid duration" instead).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'No active link with that slug. Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: 'An overlapping non-cancelled booking already exists. Body: {"error":"slot is no longer available"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: 'Link exhausted. Body: {"error":"link is no longer accepting bookings"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          description: 'Start is inside the min_notice_minutes window. Body: {"error":"booking is too soon"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '429':
          $ref: '#/components/responses/BookingCreateRateLimited'
        '500':
          description: >-
            Storage or engine failure. `error` is one of "internal error" or "booking
            conflict check failed". The detail is written to the server log and Sentry only
            (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/book/{slug}/slots:
    get:
      operationId: getPublicBookingSlots
      tags: [booking]
      summary: Available slots for a date, or the list of dates that have any slot.
      description: >-
        Two distinct modes. With `date`: `slots` is populated and `available_dates` is
        always the empty array. Without `date`: the handler probes the next 60 calendar
        days from `time.Now()` and returns those day strings in `available_dates`, with
        `slots` always the empty array. Both keys are always present in both modes.
        Rate limited per client (NEW-booking-rate-limit), separately from and more
        loosely than `createPublicBooking`: at most 120 requests per client per
        fixed 1-minute window, with or without `date`. The limit is checked and the
        request counted atomically as the handler's first step, before the link
        lookup and before the query is validated, so every request counts whatever
        it would otherwise have answered, and a refused request answers 429 even
        for an unknown slug. Booking requests do not consume this budget and slot
        requests do not consume the booking budget. Client identification, the
        per-process caveat, the sweep and the CORS preflight exemption are exactly
        as described on `createPublicBooking`; this limiter has its own counts and
        its own sweep.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: false
          description: Day to enumerate, parsed with Go layout "2006-01-02". Omit for the 60-day availability summary.
          schema:
            type: string
            format: date
            example: '2026-08-12'
        - name: duration
          in: query
          required: false
          description: >-
            Meeting length in minutes. Must be one of the link's `durations`
            (or exactly 30 when the link has none). Default is `durations[0]`, else 30.
          schema:
            type: integer
            minimum: 1
            example: 30
      responses:
        '200':
          description: Slot list or availability summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSlotsResponse'
        '400':
          description: >-
            "invalid duration" (non-numeric or not in the link's duration set) or
            "invalid date format, use YYYY-MM-DD".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'No active link with that slug. Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: 'Link exhausted. Body: {"error":"link is no longer accepting bookings"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '429':
          $ref: '#/components/responses/BookingSlotsRateLimited'
        '500':
          description: 'Storage or engine failure. Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  # ---------------------------------------------------------------------------
  # PUBLIC Zoom OAuth (routes.go:37-38, inside /api/auth but OUTSIDE the
  # requireAuth sub-group at routes.go:44-48 -> no JWT required)
  # ---------------------------------------------------------------------------

  /api/auth/zoom:
    get:
      operationId: startZoomOAuth
      tags: [conferencing]
      summary: Begin the Zoom OAuth authorization-code flow.
      description: >-
        Sets a 300-second HttpOnly `zoom_oauth_state` cookie (SameSite=Lax, Path=/)
        and 302-redirects to Zoom's authorize endpoint. Not a JSON endpoint.
        Requires a signed-in user since PAC-24: Zoom is connected to the
        caller's own settings, so there must be a caller (session cookie, which
        the browser sends on this top-level navigation).
      responses:
        '500':
          $ref: '#/components/responses/SessionGenerationUnavailable'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '302':
          description: Redirect to Zoom's authorize URL.
          headers:
            Location:
              description: >-
                Zoom authorize URL with query params response_type=code, client_id,
                redirect_uri (ZOOM_REDIRECT_URL), state (32 hex chars).
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: 'zoom_oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax'
              schema:
                type: string
        '503':
          description: 'ZOOM_CLIENT_ID is unset. Body: {"error":"Zoom OAuth not configured"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/auth/zoom/callback:
    get:
      operationId: handleZoomOAuthCallback
      tags: [conferencing]
      summary: Zoom OAuth redirect target; exchanges the code and stores tokens.
      description: >-
        Compares `state` against the `zoom_oauth_state` cookie, clears that cookie,
        exchanges `code` for tokens, persists them on the CALLER'S OWN settings row
        (making Zoom the caller's conferencing provider, and nobody else's), then
        302-redirects to the app root. Requires a signed-in user since PAC-24 (401
        otherwise); before PAC-24 it wrote the single shared settings row.
        Error bodies here use `http.Error`, i.e. `text/plain; charset=utf-8` plain text,
        NOT the shared JSON error envelope.


        Since PAC-67 (spec AC-3, AC-11, AC-12, AC-24) this is also the Zoom
        RECONNECT, and what it stores changes; no response, status or Location
        changes. The access token's expiry (from the exchange's `expires_in`) is
        stored with the tokens so the credential can be renewed when it expires.
        When the exchange returns no refresh token, the caller's stored refresh
        token is kept rather than overwritten with an empty one (AC-11). Storing
        the credential ends any recorded loss of the caller's Zoom connection, so
        the `zoom` row of `listConferenceProviders` reports connected again.
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code from Zoom. Absent/blank values are forwarded to the token exchange, which then fails with 500.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Must equal the `zoom_oauth_state` cookie value, otherwise 400.
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '302':
          description: Tokens stored; redirect back to the app.
          headers:
            Location:
              description: Always the literal string `/?connected=true&provider=zoom`.
              schema:
                type: string
                const: /?connected=true&provider=zoom
            Set-Cookie:
              description: 'zoom_oauth_state=; Path=/; Max-Age=0 (clears the state cookie)'
              schema:
                type: string
        '400':
          description: Missing cookie or state mismatch.
          content:
            text/plain:
              schema:
                type: string
                const: "invalid state\n"
        '500':
          description: >-
            Token exchange or token persistence failed. Body: `{"error":"internal error"}`.
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  # ---------------------------------------------------------------------------
  # PROTECTED scheduling links (routes.go:153-169, inside requireAuth group)
  # ---------------------------------------------------------------------------

  /api/scheduling-links:
    post:
      operationId: createSchedulingLink
      tags: [scheduling-links]
      summary: Create a scheduling link owned by the caller.
      description: >-
        The caller is inserted as an `accepted` host. Each entry of `co_host_emails`
        is resolved by lowercased email; unknown emails are silently skipped (no error,
        no host row). An empty/omitted `slug` is auto-generated from the owner's name.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): an entry of `co_host_emails` resolves to an account only when
        exactly one account holds that address DOMAIN-CONFIRMED (compared
        case-insensitively); an address carried only unconfirmed, by several accounts
        (letter-case collision), or by none is skipped exactly as an unknown email is
        today (no error, no host row).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchedulingLinkRequest'
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: 'Body is not valid JSON. Body: {"error":"invalid request body"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '409':
          description: 'Explicit slug collides with an existing link. Body: {"error":"slug already exists"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          $ref: '#/components/responses/SchedulingLinkValidationError'
        '500':
          description: >-
            `error` is one of "user not found", "slug generation failed", "slug check
            failed" or "internal error" (insert or owner-host insert failed). The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    get:
      operationId: listSchedulingLinks
      tags: [scheduling-links]
      summary: Links the caller owns or co-hosts with an accepted status.
      responses:
        '200':
          description: Partitioned into owned vs shared by `is_owner`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkListResponse'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/host-invites:
    get:
      operationId: listSchedulingLinkHostInvites
      tags: [scheduling-links]
      summary: Pending co-host invitations addressed to the caller.
      description: >-
        Invites whose link or owner can no longer be loaded are silently dropped from
        the list. Returns `[]` (never null) when there are none.
      responses:
        '200':
          description: Pending invites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulingLinkHostInvite'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/invites:
    get:
      operationId: listSchedulingLinkInvitesAlias
      tags: [scheduling-links]
      summary: Alias of GET /api/scheduling-links/host-invites (identical handler).
      description: >-
        routes.go:157-158 registers `slh.listHostInvites` at BOTH `/host-invites` and
        `/invites`. Byte-for-byte identical behaviour and response; neither is
        deprecated in code. The frontend only ever calls `/host-invites`.
      responses:
        '200':
          description: Pending invites (same payload as listSchedulingLinkHostInvites).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulingLinkHostInvite'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/host-invites/{id}/accept:
    post:
      operationId: acceptSchedulingLinkHostInvite
      tags: [scheduling-links]
      summary: Accept a co-host invitation.
      description: >-
        `{id}` is the SCHEDULING LINK id, not the invite/host-row id -- the handler runs
        `UPDATE scheduling_link_hosts SET status=... WHERE link_id=$1 AND user_id=$2`.
        This matches the `link_id` field of the invite list payload. The UPDATE must
        affect exactly the caller's row: when it affects zero rows (the caller has no
        host row on that link, or `{id}` is not a link id, e.g. the host-row `id` from
        `SchedulingLinkHostRecord`) the answer is 404 and nothing changes (PAC-30,
        API-020; before PAC-30 this was a 200 that changed nothing). Any existing host
        row matches, whatever its current status, so accepting twice is a 200 both
        times and a declined host may still accept. The owner's own row is a host row
        too, so the owner gets 200 (see PAC-30.md follow-ups). A deactivated link
        (`active=false`, see `deleteSchedulingLink`) keeps its host rows, so accept/decline
        on it match and return 200 (PAC-30 D-5); "no link has that id" in the 404 means
        no row at all, not an inactive one.
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `accepted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: accepted
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists). Nothing is written.
            Body: `{"error":"not found"}` (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/host-invites/{id}/decline:
    post:
      operationId: declineSchedulingLinkHostInvite
      tags: [scheduling-links]
      summary: Decline a co-host invitation.
      description: >-
        Same handler as accept, with status `declined`. `{id}` is the scheduling-link id.
        Same 404 rule as accept: zero rows updated is a 404 and nothing changes (PAC-30,
        API-020). Any existing host row matches, whatever its status. A deactivated link
        (`active=false`, see `deleteSchedulingLink`) keeps its host rows, so accept/decline
        on it match and return 200 (PAC-30 D-5).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `declined`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: declined
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists). Nothing is written.
            Body: `{"error":"not found"}` (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}:
    parameters:
      - $ref: '#/components/parameters/SchedulingLinkIdPath'
    get:
      operationId: getSchedulingLink
      tags: [scheduling-links]
      summary: Fetch one scheduling link by id (owner or accepted co-host).
      description: >-
        Readable only by the link's owner and by co-hosts whose host row on the link
        is `accepted` (PAC-25, API-006). That is the same set of callers who receive the
        link from `GET /api/scheduling-links`, so this read discloses nothing the list
        does not. Every other authenticated caller (no host row, a `pending` or
        `declined` invitation, a co-host who left or was removed) receives the same
        `404 {"error":"not found"}` as for an id that matches no link, with no part of
        the link in the body, so the answer does not reveal whether a link exists. A
        refused read is never `403` (PAC-25 D-1; contrast the owner-only siblings
        PATCH, DELETE, `/bookings` and `/hosts`, which still answer `403` and are out
        of scope). Check order: `400` malformed id; then the link lookup; then the
        caller's own host-status lookup on that link; then `404` for no link or a caller
        who may not read it; then `200`. A storage error on either lookup answers `500`
        `{"error":"internal error"}`, never `404` (an outage is not reported as "not
        found") and never `200` (the reader check does not fail open). An allowed reader
        receives the full record including every host row (accepted, pending and
        declined) with each host's email, name and avatar; `is_owner` is computed
        against the caller and `my_status` is the caller's own host status. Building
        that record reads the roster (the link's host rows and each host's user record);
        a storage error on that read also answers `500` `{"error":"internal error"}`,
        never `200` with `hosts: []` or with a host's email missing (PAC-25 C-2). An
        accepted co-host therefore still sees pending and declined invitees' emails, as
        through the list (PAC-25 D-2).
      responses:
        '200':
          description: >-
            The link, with hosts. Returned only to the owner (`is_owner: true`) or an
            accepted co-host (`is_owner: false`, `my_status: accepted`), and only when
            the whole roster was read: `hosts` is never emptied and no host's email is
            dropped because a storage read failed. A failed roster read is `500`, not
            this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            Body exactly `{"error":"not found"}`. Returned when no link has that id, AND
            when the link exists but the caller is neither its owner nor an accepted
            co-host (never invited, invitation pending or declined, left or removed).
            The two cases are indistinguishable by status and body (PAC-25 D-1). A
            soft-deleted link (`active=false`) is NOT a 404 for its owner or accepted
            co-hosts: GetSchedulingLinkByID ignores `active`, so they still receive 200
            (API-050, not resolved by PAC-25).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              example:
                error: not found
        '500':
          description: >-
            Body: {"error":"internal error"}. A storage error on the link lookup, on the
            caller's host-status lookup, or on the roster read (PAC-25 C-2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    patch:
      operationId: updateSchedulingLink
      tags: [scheduling-links]
      summary: Partially update a scheduling link (owner only).
      description: >-
        Every field is optional; absent fields keep their stored value. The whole
        merged record is re-validated, so a patch can fail 422 on a field it did not
        touch. When `co_host_emails` is present (even `[]`) it sets the co-host list by
        difference (PAC-61): non-owner hosts whose email is not listed are removed,
        listed emails that are not yet hosts are added as `pending`, and listed hosts
        keep their status (accepted, pending or declined).

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): the two halves follow different rules. KEEP SET (revoking and
        keeping): an existing host is kept when its account's stored address equals a
        listed address case-insensitively, at ANY standing, so an accepted co-host stored
        as `Pat@Acme.com` is kept by a list containing `pat@acme.com` (before PAC-71 the
        lowercased lookup missed it and removed the host). NEW ENTRIES (granting): a
        listed address that matches no existing host is invited as `pending` only when
        exactly one account holds it DOMAIN-CONFIRMED; otherwise it is skipped, as an
        unknown address is today.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchedulingLinkRequest'
      responses:
        '200':
          description: Updated link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: '"invalid id" or "invalid request body"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'Caller is not the owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: 'New slug collides with another link. Body: {"error":"slug already exists"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          $ref: '#/components/responses/SchedulingLinkValidationError'
        '500':
          description: >-
            `error` is "internal error" (lookup or update failed) or "slug check failed".
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    delete:
      operationId: deleteSchedulingLink
      tags: [scheduling-links]
      summary: Deactivate a scheduling link (owner only).
      description: >-
        Soft delete -- `UPDATE scheduling_links SET active=false`. The row and its
        bookings survive; the public `/api/book/{slug}` lookup filters on `active=true`
        and will start returning 404, while `GET /api/scheduling-links/{id}` still
        returns the link.
      responses:
        '204':
          description: Deactivated. Empty body.
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'Caller is not the owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Lookup or delete failed. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/bookings:
    get:
      operationId: listSchedulingLinkBookings
      tags: [scheduling-links]
      summary: Bookings made on a link (owner only).
      description: >-
        Returns the raw `storage.Booking` rows, ordered by `start_time DESC`, never
        null. NOTE the field names differ from the public booking confirmation DTO
        (`start_time`/`end_time` here vs `start`/`end` there).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Booking rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulingLinkBookingRecord'
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'Caller is not the owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
