                status: declined
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists); or the link was deleted
            (PAC-40), before the request or while it was handled and before the host
            row was written (PAC-101). Nothing is written. Body: `{"error":"not found"}`
            (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed, or the lock on the link was not obtained within 10 seconds
            (PAC-101); the host row is unchanged. Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/leave:
    post:
      operationId: leaveSchedulingLink
      tags: [scheduling-links]
      summary: Remove the caller from a link's host list.
      description: >-
        Deletes the caller's `scheduling_link_hosts` row, whatever its status (pending,
        accepted or declined). Checked in this order: `{id}` not a UUID -> 400 "invalid
        id"; no link with that id, or the link was deleted -> 404 for every caller,
        owner and pending invitee included, and no host row is removed (PAC-40 AC-5);
        caller is the owner -> 400 "owner cannot leave link"; the DELETE removes zero
        rows (the caller has no host row on the link) -> 404 and nothing changes
        (PAC-30, API-020; before PAC-30 a non-host got 204). PAC-101: A link deleted while the request is handled: the write and the check that the link is not deleted are one atomic step ordered against the delete. If the delete commits first, the answer is the same 404 `{"error":"not found"}` as for a link deleted before the request arrived and no host row changes; if the write commits first it takes full effect and the delete then keeps the resulting host rows (PAC-40 D-2). A paused link does not block it. A write that must wait for a delete or edit of the same link still in progress waits at most 10 seconds; past that it is the 500 and nothing changes.
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '204':
          description: The caller's host row was deleted. Empty body.
        '400':
          description: '"invalid id" or "owner cannot leave link"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            No link with that id, the link was deleted (PAC-40; before the request, or
            while it was handled and before the host row was removed, PAC-101), or the
            caller (not the owner) has no host row on it. All are `{"error":"not found"}`
            and nothing is deleted (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Lookup or leave failed, or the lock on the link was not obtained within 10
            seconds (PAC-101); the host row is kept. Body: `{"error":"internal error"}`.
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

