# Domain: booking
# Source of truth: backend/api/routes.go, handlers_booking.go,
# handlers_scheduling_links.go, handlers_conferencing.go,
# backend/storage/scheduling_links.go, backend/conference/*.go
# Every field below is traceable to a Go json tag, a chi route, or a handler write.
paths:

  # ---------------------------------------------------------------------------
  # PUBLIC booking surface (registered outside requireAuth in routes.go:24-27)
  # ---------------------------------------------------------------------------

  /api/book/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: >-
          Scheduling-link slug (chi URLParam "slug"). Only a live link answers: a
          paused link (`active=false`) and a deleted link both answer 404 exactly as a
          slug that never existed (PAC-40 AC-4).
        schema:
          type: string
    get:
      operationId: getPublicLinkInfo
      tags: [booking]
      summary: Public metadata for a bookable scheduling link.
      security: []
      responses:
        '200':
          description: Link is bookable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLinkInfo'
        '404':
          description: 'No live link with that slug: never existed, paused (`active=false`) or deleted (PAC-40). Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: >-
            Link exhausted: single_use with `uses_count` >= 1, or recurring with
            `uses_count` >= max_uses. `uses_count` counts every booking ever made on the
            link, cancelled ones included, so cancelling a booking never re-opens a
            used-up link (PAC-40, API-051). Body: {"error":"link is no longer accepting bookings"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Storage failure. Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    post:
      operationId: createPublicBooking
      tags: [booking]
      summary: Book a slot on a public scheduling link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicBookingRequest'
      responses:
        '201':
          description: Booking confirmed and host calendar events written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBookingConfirmation'
        '400':
          description: >-
            Validation failure. Messages: "invalid request body";
            "name, email, and start are required"; "invalid start time, use RFC3339";
            "invalid end time, use RFC3339" (`end` is not RFC3339); "duration does not
            match end time"; "invalid duration"; "end must be after start". For a
            request whose `end` is at or before its `start`: when the stated duration
            (`duration` if present and not null, even 0, else `duration_minutes`) is
            non-zero and differs from end minus start in whole minutes the answer is
            "duration does not match end time", otherwise "invalid duration". "end must
            be after start" is reached when no `end` is sent and start + the duration,
            computed as a wrapping int64 nanosecond product, lands at or before start.
            That happens for some duration options of 153,722,868 minutes or more (for
            example 153,722,868-307,445,734) but not all: 307,445,735-461,168,601, for
            example, wrap to an end after start and are not rejected by this check (the
            request then goes on to the later checks with that wrapped end). The
            contract sets no maximum on duration options (PAC-40 AC-20a, OQ-6).
            PAC-40 removes two unreachable re-checks (API-073) without changing any of
            these answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'No live link with that slug: never existed, paused (`active=false`) or deleted (PAC-40). Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: 'An overlapping non-cancelled booking already exists. Body: {"error":"slot is no longer available"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: >-
            Link exhausted (same rule as getPublicLinkInfo: `uses_count` counts every
            booking made, cancelled ones included; PAC-40). Body:
            {"error":"link is no longer accepting bookings"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          description: 'Start is inside the min_notice_minutes window. Body: {"error":"booking is too soon"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Storage or engine failure. `error` is one of "internal error" or "booking
            conflict check failed". The detail is written to the server log and Sentry only
            (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/book/{slug}/slots:
    get:
      operationId: getPublicBookingSlots
      tags: [booking]
      summary: Available slots for a date, or the list of dates that have any slot.
      description: >-
        Two distinct modes. With `date`: `slots` is populated and `available_dates` is
        always the empty array. Without `date`: the handler probes the next 60 calendar
        days from `time.Now()` and returns those day strings in `available_dates`, with
        `slots` always the empty array. Both keys are always present in both modes.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: false
          description: Day to enumerate, parsed with Go layout "2006-01-02". Omit for the 60-day availability summary.
          schema:
            type: string
            format: date
            example: '2026-08-12'
        - name: duration
          in: query
          required: false
          description: >-
            Meeting length in minutes. Must be one of the link's `durations`
            (or exactly 30 when the link has none). Default is `durations[0]`, else 30.
          schema:
            type: integer
            minimum: 1
            example: 30
      responses:
        '200':
          description: Slot list or availability summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSlotsResponse'
        '400':
          description: >-
            "invalid duration" (non-numeric or not in the link's duration set) or
            "invalid date format, use YYYY-MM-DD".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'No live link with that slug: never existed, paused (`active=false`) or deleted (PAC-40). Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: >-
            Link exhausted (same rule as getPublicLinkInfo: `uses_count` counts every
            booking made, cancelled ones included; PAC-40). Body:
            {"error":"link is no longer accepting bookings"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Storage or engine failure. Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  # ---------------------------------------------------------------------------
  # PUBLIC Zoom OAuth (routes.go:37-38, inside /api/auth but OUTSIDE the
  # requireAuth sub-group at routes.go:44-48 -> no JWT required)
  # ---------------------------------------------------------------------------

  /api/auth/zoom:
    get:
      operationId: startZoomOAuth
      tags: [conferencing]
      summary: Begin the Zoom OAuth authorization-code flow.
      description: >-
        Sets a 300-second HttpOnly `zoom_oauth_state` cookie (SameSite=Lax, Path=/)
        and 302-redirects to Zoom's authorize endpoint. Not a JSON endpoint.
        Requires a signed-in user since PAC-24: Zoom is connected to the
        caller's own settings, so there must be a caller (session cookie, which
        the browser sends on this top-level navigation).
      responses:
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '302':
          description: Redirect to Zoom's authorize URL.
          headers:
            Location:
              description: >-
                Zoom authorize URL with query params response_type=code, client_id,
                redirect_uri (ZOOM_REDIRECT_URL), state (32 hex chars).
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: 'zoom_oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax'
              schema:
                type: string
        '503':
          description: 'ZOOM_CLIENT_ID is unset. Body: {"error":"Zoom OAuth not configured"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/auth/zoom/callback:
    get:
      operationId: handleZoomOAuthCallback
      tags: [conferencing]
      summary: Zoom OAuth redirect target; exchanges the code and stores tokens.
      description: >-
        Compares `state` against the `zoom_oauth_state` cookie, clears that cookie,
        exchanges `code` for tokens, persists them on the CALLER'S OWN settings row
        (making Zoom the caller's conferencing provider, and nobody else's), then
        302-redirects to the app root. Requires a signed-in user since PAC-24 (401
        otherwise); before PAC-24 it wrote the single shared settings row.
        Error bodies here use `http.Error`, i.e. `text/plain; charset=utf-8` plain text,
        NOT the shared JSON error envelope.
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code from Zoom. Absent/blank values are forwarded to the token exchange, which then fails with 500.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Must equal the `zoom_oauth_state` cookie value, otherwise 400.
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '302':
          description: Tokens stored; redirect back to the app.
          headers:
            Location:
              description: Always the literal string `/?connected=true&provider=zoom`.
              schema:
                type: string
                const: /?connected=true&provider=zoom
            Set-Cookie:
              description: 'zoom_oauth_state=; Path=/; Max-Age=0 (clears the state cookie)'
              schema:
                type: string
        '400':
          description: Missing cookie or state mismatch.
          content:
            text/plain:
              schema:
                type: string
                const: "invalid state\n"
        '500':
          description: >-
            Token exchange or token persistence failed. Body: `{"error":"internal error"}`.
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  # ---------------------------------------------------------------------------
  # PROTECTED scheduling links (routes.go:153-169, inside requireAuth group)
  # ---------------------------------------------------------------------------

  /api/scheduling-links:
    post:
      operationId: createSchedulingLink
      tags: [scheduling-links]
      summary: Create a scheduling link owned by the caller.
      description: >-
        The caller is inserted as an `accepted` host. Each entry of `co_host_emails`
        is resolved by lowercased email; unknown emails are silently skipped (no error,
        no host row). An empty/omitted `slug` is auto-generated from the owner's name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchedulingLinkRequest'
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: 'Body is not valid JSON. Body: {"error":"invalid request body"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '409':
          description: 'Explicit slug collides with an existing link, deleted links included: a deleted link keeps its slug (PAC-40 D-3). Body: {"error":"slug already exists"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          $ref: '#/components/responses/SchedulingLinkValidationError'
        '500':
          description: >-
            `error` is one of "user not found", "slug generation failed", "slug check
            failed" or "internal error" (insert or owner-host insert failed). The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    get:
      operationId: listSchedulingLinks
      tags: [scheduling-links]
      summary: Links the caller owns or co-hosts with an accepted status.
      description: >-
        Deleted links are never listed, in either group (PAC-40 AC-1). Paused links
        (`active=false`), including every link that was inactive before PAC-40 (D-1),
        are listed with `active: false`.
      responses:
        '200':
          description: Partitioned into owned vs shared by `is_owner`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkListResponse'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/host-invites:
    get:
      operationId: listSchedulingLinkHostInvites
      tags: [scheduling-links]
      summary: Pending co-host invitations addressed to the caller.
      description: >-
        Invites whose link or owner can no longer be loaded are silently dropped from
        the list, and so are invites to a deleted link (PAC-40 AC-5). Invites to a
        paused link (`active=false`) are still listed (PAC-30 D-5). Returns `[]`
        (never null) when there are none.
      responses:
        '200':
          description: Pending invites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulingLinkHostInvite'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/invites:
    get:
      operationId: listSchedulingLinkInvitesAlias
      tags: [scheduling-links]
      summary: Alias of GET /api/scheduling-links/host-invites (identical handler).
      description: >-
        routes.go:157-158 registers `slh.listHostInvites` at BOTH `/host-invites` and
        `/invites`. Byte-for-byte identical behaviour and response; neither is
        deprecated in code. The frontend only ever calls `/host-invites`. Invites to a
        deleted link are omitted, as there (PAC-40).
      responses:
        '200':
          description: Pending invites (same payload as listSchedulingLinkHostInvites).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulingLinkHostInvite'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/host-invites/{id}/accept:
    post:
      operationId: acceptSchedulingLinkHostInvite
      tags: [scheduling-links]
      summary: Accept a co-host invitation.
      description: >-
        `{id}` is the SCHEDULING LINK id, not the invite/host-row id -- the handler runs
        `UPDATE scheduling_link_hosts SET status=... WHERE link_id=$1 AND user_id=$2`.
        This matches the `link_id` field of the invite list payload. The UPDATE must
        affect exactly the caller's row: when it affects zero rows (the caller has no
        host row on that link, or `{id}` is not a link id, e.g. the host-row `id` from
        `SchedulingLinkHostRecord`) the answer is 404 and nothing changes (PAC-30,
        API-020; before PAC-30 this was a 200 that changed nothing). Any existing host
        row matches, whatever its current status, so accepting twice is a 200 both
        times and a declined host may still accept. The owner's own row is a host row
        too, so the owner gets 200 (see PAC-30.md follow-ups). A paused link
        (`active=false`) keeps its host rows, so accept/decline on it match and return
        200 (PAC-30 D-5). A deleted link answers 404 to every caller and no host row
        changes (PAC-40 AC-5), even though its host rows are kept in storage.
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `accepted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: accepted
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists); or the link was deleted
            (PAC-40). Nothing is written. Body: `{"error":"not found"}` (PAC-30,
            API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/host-invites/{id}/decline:
    post:
      operationId: declineSchedulingLinkHostInvite
      tags: [scheduling-links]
      summary: Decline a co-host invitation.
      description: >-
        Same handler as accept, with status `declined`. `{id}` is the scheduling-link id.
        Same 404 rule as accept: zero rows updated is a 404 and nothing changes (PAC-30,
        API-020). Any existing host row matches, whatever its status. A paused link
        (`active=false`) keeps its host rows, so accept/decline on it match and return
        200 (PAC-30 D-5). A deleted link answers 404 and no host row changes (PAC-40
        AC-5).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `declined`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: declined
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists); or the link was deleted
            (PAC-40). Nothing is written. Body: `{"error":"not found"}` (PAC-30,
            API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}:
    parameters:
      - $ref: '#/components/parameters/SchedulingLinkIdPath'
    get:
      operationId: getSchedulingLink
      tags: [scheduling-links]
      summary: Fetch one scheduling link by id (owner or accepted co-host).
      description: >-
        Readable by the people who see the link in `listSchedulingLinks`: its owner and
        its accepted co-hosts (PAC-40 D-7, resolving API-006 / U-08). Checked in this
        order: `{id}` not a UUID -> 400; no link with that id, or the link was deleted
        -> 404 for every caller, whatever their role (PAC-40 D-9); caller is neither the
        owner nor an accepted co-host (a pending or declined invitee, or a stranger) ->
        403 with no link field in the body; otherwise 200. A paused link
        (`active=false`) is still returned to its owner and accepted co-hosts.
        `is_owner` is computed against the caller and `my_status` is the caller's own
        host status.
      responses:
        '200':
          description: The link, with hosts. The caller is its owner or an accepted co-host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            No link with that id, or the link was deleted. Same answer for every
            caller, so a deleted id is indistinguishable from one that never existed
            (PAC-40 AC-2, AC-6a). Body: {"error":"not found"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '403':
          description: >-
            The link exists and is not deleted, but the caller is neither its owner nor
            an accepted co-host. Body exactly {"error":"forbidden"}: none of the link's
            fields or host details (PAC-40 AC-19, API-006).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    patch:
      operationId: updateSchedulingLink
      tags: [scheduling-links]
      summary: Partially update a scheduling link (owner only).
      description: >-
        Every field is optional; absent fields keep their stored value. The whole
        merged record is re-validated, so a patch can fail 422 on a field it did not
        touch. When `co_host_emails` is present (even `[]`) it sets the co-host list by
        difference (PAC-61): non-owner hosts whose email is not listed are removed,
        listed emails that are not yet hosts are added as `pending`, and listed hosts
        keep their status (accepted, pending or declined). For `duration_options` /
        `durations` and `days_of_week` / `days` the canonical spelling wins when both
        are carried, exactly as on create (PAC-40 D-5, API-049). A deleted link answers
        404 to every caller before the owner check and before the body is read, and
        stays deleted whatever the body says, `active: true` included (PAC-40 AC-3,
        AC-6a).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchedulingLinkRequest'
      responses:
        '200':
          description: Updated link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: '"invalid id" or "invalid request body"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'The link is live or paused and the caller is not its owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: >-
            No link with that id, or the link was deleted: the same answer for every
            caller, owner included, and nothing changes (PAC-40 AC-3, AC-6, AC-6a).
            Body: {"error":"not found"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: 'New slug collides with another link, deleted links included (PAC-40 D-3). Body: {"error":"slug already exists"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          $ref: '#/components/responses/SchedulingLinkValidationError'
        '500':
          description: >-
            `error` is "internal error" (lookup or update failed) or "slug check failed".
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    delete:
      operationId: deleteSchedulingLink
      tags: [scheduling-links]
      summary: Delete a scheduling link (owner only).
      description: >-
        Soft delete, distinct from pausing (PAC-40). The link record, its bookings and
        its host rows are kept (D-2) and its slug stays reserved (D-3), but from then on
        the link does not exist through the API: it is absent from
        `listSchedulingLinks` and from the co-host invite list, and every operation that
        names it by id, and every public operation that names it by slug
        (`/api/book/{slug}` and its slots), answers the same 404 as an id or slug that
        never existed, for every caller (D-4, D-9). Creating or patching another link to
        its slug is still a 409 "slug already exists" (D-3), so a signed-in user can
        learn that the slug was once used. There is no un-delete; PATCH `active: true` cannot
        bring it back. Its bookings still make their hosts busy. Deleting a link that
        is already deleted is a 404, not a 204. Pausing (PATCH `active: false`) is a
        different state and keeps the link visible. Links that were inactive before
        PAC-40 are paused, not deleted (D-1).
      responses:
        '204':
          description: Deleted. Empty body.
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'The link is live or paused and the caller is not its owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: >-
            No link with that id, or the link was deleted: the same answer for every
            caller, owner included, and nothing changes (PAC-40 AC-3, AC-6, AC-6a).
            Body: {"error":"not found"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Lookup or delete failed. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/bookings:
    get:
      operationId: listSchedulingLinkBookings
      tags: [scheduling-links]
      summary: Bookings made on a link (owner only).
      description: >-
        Returns the raw `storage.Booking` rows, ordered by `start_time DESC`, never
        null, cancelled bookings included. NOTE the field names differ from the public
        booking confirmation DTO (`start_time`/`end_time` here vs `start`/`end` there).
        A deleted link answers 404 to every caller (PAC-40 AC-6, OQ-1).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Booking rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulingLinkBookingRecord'
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'The link is live or paused and the caller is not its owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: >-
            No link with that id, or the link was deleted: the same answer for every
            caller, owner included, and nothing changes (PAC-40 AC-3, AC-6, AC-6a).
            Body: {"error":"not found"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/hosts:
    post:
      operationId: inviteSchedulingLinkHost
      tags: [scheduling-links]
      summary: Invite an existing user as a co-host (owner only).
      description: >-
        The invitee must already have an account; the email is lowercased and trimmed.
        A new invitee gets a `pending` row (201). Re-inviting someone who is already a
        host of the link changes nothing: their row is returned as is with 200, so an
        accepted or declined host keeps that status (PAC-61). Response is the raw
        `storage.LinkHost` row, not the host DTO used inside SchedulingLink. A deleted
        link answers 404 "not found" to every caller, before the owner check and before
        the body is read, and no host row is written (PAC-40 AC-6, AC-6a).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteSchedulingLinkHostRequest'
      responses:
        '200':
          description: Already a host of this link; their row, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkHostRecord'
        '201':
          description: New invitee; a `pending` host row was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkHostRecord'
        '400':
          description: '"invalid id", or "email is required" (also returned when the JSON body is malformed).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'The link is live or paused and the caller is not its owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: >-
            "not found" (no such link, or the link was deleted: same answer for every
            caller, PAC-40) or "user not found" (no account with that email).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Lookup or invite failed. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/accept:
    post:
      operationId: acceptSchedulingLinkInviteByLink
      tags: [scheduling-links]
      summary: Accept a co-host invitation, addressed by link id.
      description: >-
        routes.go:166 binds the SAME `slh.acceptInvite` handler already bound at
        `/host-invites/{id}/accept` (routes.go:159). Because both handlers key on the
        link id, the two paths are exactly equivalent -- this is a second spelling of
        the same operation, not a different resource. The frontend only uses the
        `/host-invites/...` form. Same 404 rule: a caller with no host row on the link
        gets 404 and nothing changes (PAC-30, API-020). The duplicate spelling itself
        (API-069) is not resolved by PAC-30. A paused link (`active=false`) keeps its
        host rows, so accept/decline on it match and return 200 (PAC-30 D-5). A deleted
        link answers 404 and no host row changes (PAC-40 AC-5).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `accepted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: accepted
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists); or the link was deleted
            (PAC-40). Nothing is written. Body: `{"error":"not found"}` (PAC-30,
            API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/decline:
    post:
      operationId: declineSchedulingLinkInviteByLink
      tags: [scheduling-links]
      summary: Decline a co-host invitation, addressed by link id.
      description: >-
        Equivalent to POST /api/scheduling-links/host-invites/{id}/decline (same handler,
        same key, same PAC-30 404 when the caller has no host row on the link). A paused
        link (`active=false`) keeps its host rows, so accept/decline on it match and
        return 200 (PAC-30 D-5). A deleted link answers 404 and no host row changes
        (PAC-40 AC-5).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `declined`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: declined
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists); or the link was deleted
            (PAC-40). Nothing is written. Body: `{"error":"not found"}` (PAC-30,
            API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/leave:
    post:
      operationId: leaveSchedulingLink
      tags: [scheduling-links]
      summary: Remove the caller from a link's host list.
      description: >-
        Deletes the caller's `scheduling_link_hosts` row, whatever its status (pending,
        accepted or declined). Checked in this order: `{id}` not a UUID -> 400 "invalid
        id"; no link with that id, or the link was deleted -> 404 for every caller,
        owner and pending invitee included, and no host row is removed (PAC-40 AC-5);
        caller is the owner -> 400 "owner cannot leave link"; the DELETE removes zero
        rows (the caller has no host row on the link) -> 404 and nothing changes
        (PAC-30, API-020; before PAC-30 a non-host got 204).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '204':
          description: The caller's host row was deleted. Empty body.
        '400':
          description: '"invalid id" or "owner cannot leave link"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            No link with that id, the link was deleted (PAC-40), or the caller (not the
            owner) has no host row on it. All are `{"error":"not found"}` and nothing is
            deleted (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Lookup or leave failed. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  # ---------------------------------------------------------------------------
  # PROTECTED conferencing (routes.go:123-128)
  # ---------------------------------------------------------------------------

  /api/conference/create:
    post:
      operationId: createConferenceLink
      tags: [conferencing]
      summary: Create a standalone conference meeting with the configured provider.
      description: >-
        Provider comes from the CALLER'S stored settings (`ConferencingProvider`),
        not from the request; the Teams credential is the caller's own (PAC-24;
        before it, both came from the single shared settings row). No field validation at all: a missing `title`, `start` or `end`
        decodes to the Go zero value and is forwarded to the provider as-is.
        Not referenced anywhere in the frontend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConferenceRequest'
      responses:
        '200':
          description: Meeting created. Note the camelCase keys, unlike every other schema in this domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConferenceMeetingDetails'
        '400':
          description: >-
            One of these fixed messages (PAC-21: no Go error text is appended). The
            dash in the three provider sentences is U+2014 EM DASH, exactly as the
            server writes it today; the new stored-credential sentence uses the same
            character on purpose, so the three read alike:
            "invalid body"; "teams: not connected — visit /api/auth/microsoft to
            authenticate" (also returned when reading the stored Microsoft token
            fails, not only when there is none: the server does not separate the two
            on this path; see the PAC-21 contract's doesNotResolve); "zoom: not
            connected — visit /api/auth/zoom to authenticate"; "zoom: stored
            credential is invalid — reconnect at /api/auth/zoom" (the stored Zoom
            token does not decode; before PAC-21 was finished this was
            "zoom: invalid token: " plus the JSON decoder's error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: >-
            Settings load or meeting creation failed. Body: `{"error":"internal error"}`.
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/conference/providers:
    get:
      operationId: listConferenceProviders
      tags: [conferencing]
      summary: Conferencing providers this server can offer, and their connection state.
      description: >-
        Order is fixed: google_meet (only when Google OAuth env is configured), zoom
        (only when Zoom env is configured), teams (only when Microsoft env is
        configured), then `custom`, which is always last and always `connected: true`.
        Connection state and the Meet email describe the CALLER'S own settings and
        credentials (PAC-24).
        Length is therefore 1..4.
      responses:
        '200':
          description: Provider statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConferenceProviderStatus'
                minItems: 1
                maxItems: 4
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: >-
            Settings load failed. Body: `{"error":"internal error"}`. The detail is written
            to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/conference/zoom/disconnect:
    post:
      operationId: disconnectZoom
      tags: [conferencing]
      summary: Clear the stored Zoom tokens.
      description: >-
        Takes no request body. Clears the CALLER'S Zoom tokens and returns the
        caller's conferencing provider to `meet`; other users are untouched.
        Before PAC-24 the tokens were server-wide.
      responses:
        '204':
          description: Tokens cleared. Empty body.
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: >-
            Clearing the tokens failed. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/events/{id}/conference:
    parameters:
      - name: id
        in: path
        required: true
        description: Provider calendar event id (an opaque Google Calendar event id string, not a UUID - it is never parsed).
        schema:
          type: string
    post:
      operationId: addEventConference
      tags: [conferencing]
      summary: Attach a conference link to an existing calendar event.
      description: >-
        Uses the CALLER'S stored settings and credentials (PAC-24). Four branches.
        (1) The event already has a conference: returns 200 with the
        EXISTING link when the stored provider matches, or when `provider` is
        `custom`; otherwise 409. (2) `custom`: stores the supplied `url` in the event's
        private extended properties. (3) `google_meet`: asks Google to mint a Meet link.
        (4) anything else (`zoom`, `teams`): creates a meeting through the provider
        factory and stores the join URL in extended properties.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEventConferenceRequest'
      responses:
        '200':
          description: >-
            Conference attached, or the pre-existing conference echoed back. `label` is
            the stored provider string on the echo branch, "Custom link" for custom,
            "Google Meet" for google_meet, and the uppercased provider name otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventConferenceLink'
        '400':
          description: >-
            One of these fixed messages (PAC-21: no Go error text is appended):
            The dash in the three provider sentences is U+2014 EM DASH, exactly as
            the server writes it.
            "invalid body"; "provider is required"; "url is required for custom
            conferences"; "event has no time" (the existing literal, kept: the event
            has no start or end, or, new in PAC-21, Google's value does not parse;
            before PAC-21 was finished a parse failure returned Go's time.Parse error
            text); 'unsupported conference provider "<provider>"' (echoes the
            request's own `provider`); "teams: not connected — visit
            /api/auth/microsoft to authenticate" (also returned when reading the
            stored Microsoft token fails); "zoom: not connected — visit
            /api/auth/zoom to authenticate"; "zoom: stored credential is invalid —
            reconnect at /api/auth/zoom".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '404':
          description: >-
            Body: `{"error":"event not found"}` (fixed text; the Google error is not
            appended, PAC-21). Any GetEvent failure maps to 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: 'Event already has a conference from a different provider. Body: {"error":"event already has a conference"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Google Meet creation, settings load, or the event update failed, or the
            stored credential could not be read. Body:
            `{"error":"internal error"}`. The detail is written to the server log and Sentry
            only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '502':
          description: >-
            Upstream provider problem. `error` is one of "Google Meet creation is still
            pending", "upstream provider error" (the provider's create-meeting call failed)
            or "conference provider returned no join URL". The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    delete:
      operationId: removeEventConference
      tags: [conferencing]
      summary: Remove any conference from a calendar event.
      description: >-
        Clears a Google Meet if present and strips the `paceday_conference_provider` /
        `paceday_conference_url` private extended properties. Idempotent: an event with
        no conference also returns 204 without writing anything.
      responses:
        '204':
          description: Conference removed (or there was none). Empty body.
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '404':
          description: >-
            Body: `{"error":"event not found"}` (fixed text; the Google error is not
            appended, PAC-21). Any GetEvent failure maps to 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Removing the Google Meet or the conference properties failed, or the stored
            credential could not be read. Body:
            `{"error":"internal error"}`. The detail is written to the server log and Sentry
            only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

components:

  parameters:
    SchedulingLinkIdPath:
      name: id
      in: path
      required: true
      description: Scheduling-link UUID. Parsed with uuid.Parse; a non-UUID value yields 400 "invalid id".
      schema:
        type: string
        format: uuid

  responses:
    BookingUnauthorized:
      description: >-
        Emitted by the requireAuth middleware when the `auth_token` cookie and the
        `Authorization: Bearer` header are both absent or invalid. The body is the JSON
        text `{"error":"unauthorized"}` but the response is sent with `http.Error`, so
        the Content-Type header is `text/plain; charset=utf-8`, not application/json.
      content:
        text/plain:
          schema:
            type: string
            const: "{\"error\":\"unauthorized\"}\n"

    SchedulingLinkValidationError:
      description: >-
        Validation failure from validateSchedulingLink / parseClock. Messages:
        "title is required"; "at least one duration is required"; "durations must be
        positive integers"; "at least one day is required"; "days_of_week must contain
        values between 0 and 6"; "window times must use HH:MM"; "window_start must be
        before window_end"; "buffers must be zero or positive"; "min_notice_minutes
        must be zero or positive"; "usage_type must be reusable, recurring, or
        single_use"; "max_uses must be set to a positive integer for recurring links";
        "slug cannot be empty" (PATCH only).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingError'

  schemas:

    BookingError:
      type: object
      description: >-
        Shared error envelope written by api.writeError (handlers_settings.go:206):
        Content-Type application/json, body `{"error": "<message>"}`. The one
        exception in this domain is the requireAuth 401 (text/plain). Every 5xx,
        including the Zoom OAuth callback's, is this envelope (PAC-21).
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: >-
            Human-readable, server-chosen message. Never the text of a Go, driver or
            provider error (PAC-21): those go to the server log and Sentry only.

    # ---- Public booking ------------------------------------------------------

    PublicHost:
      type: object
      description: A host shown on the public booking page. Only accepted hosts appear.
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          description: Omitted when the user record has no name (json `name,omitempty`).
        avatar_url:
          type: string
          description: Omitted when empty (json `avatar_url,omitempty`).

    PublicLinkCoverage:
      type: object
      description: >-
        How many accepted hosts had a loadable calendar token when the page was
        rendered. `total` counts accepted hosts whose user record resolved; `checked`
        counts those with a usable OAuth token. Always present, even as {0,0}.
      required: [total, checked]
      additionalProperties: false
      properties:
        total:
          type: integer
        checked:
          type: integer

    PublicLinkInfo:
      type: object
      description: backend/api/handlers_booking.go publicLinkDTO.
      required: [slug, title, durations, hosts, min_notice_minutes, usage_type, coverage]
      additionalProperties: false
      properties:
        slug:
          type: string
        title:
          type: string
        durations:
          type: array
          description: Allowed meeting lengths in minutes, straight from the link's duration_options column.
          items:
            type: integer
        hosts:
          type: array
          description: Accepted hosts only. Always an array, never null.
          items:
            $ref: '#/components/schemas/PublicHost'
        min_notice_minutes:
          type: integer
        usage_type:
          type: string
          description: Defaults to `reusable` when the stored value is empty.
          enum: [reusable, recurring, single_use]
        coverage:
          $ref: '#/components/schemas/PublicLinkCoverage'

    PublicBookingSlot:
      type: object
      description: engine.AvailableSlot. Times are Go time.Time marshalled as RFC3339 with nanoseconds.
      required: [start, end]
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    PublicSlotsResponse:
      type: object
      description: >-
        Both keys are always present. Exactly one is populated depending on whether the
        `date` query parameter was supplied.
      required: [slots, available_dates]
      additionalProperties: false
      properties:
        slots:
          type: array
          description: Populated only when `date` was given; otherwise the empty array.
          items:
            $ref: '#/components/schemas/PublicBookingSlot'
        available_dates:
          type: array
          description: >-
            Populated only when `date` was omitted; YYYY-MM-DD strings for days within
            the next 60 that have at least one bookable slot. Otherwise the empty array.
          items:
            type: string
            format: date

    CreatePublicBookingRequest:
      type: object
      description: >-
        Anonymous request body of POST /api/book/{slug}. `name`, `email` and `start`
        are required by the handler; `end`, `duration` and `duration_minutes` are three
        overlapping ways to express the length.
      required: [name, email, start]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Trimmed; must be non-empty after trimming.
          minLength: 1
        email:
          type: string
          description: Trimmed; must be non-empty after trimming. Never validated as an email address.
          minLength: 1
        start:
          type: string
          format: date-time
          description: RFC3339. Must be at least `min_notice_minutes` in the future, else 422.
        end:
          type: string
          format: date-time
          description: >-
            RFC3339, optional. When present it wins: the resulting length must equal
            `duration`/`duration_minutes` if either was also sent, else 400. When
            absent, end = start + resolved duration.
        notes:
          type: string
          description: Free text; no length limit enforced.
        duration:
          type: integer
          nullable: true
          description: >-
            Minutes. Takes precedence over `duration_minutes` when both are sent. This
            is the field the frontend actually populates.
        duration_minutes:
          type: integer
          nullable: true
          description: >-
            Minutes. Overridden by `duration` when both are present. When neither is
            sent and `end` is absent, the length falls back to durations[0] (else 30).
            The resolved value must be in the link's duration set, else 400.

    PublicBookingConfirmation:
      type: object
      description: >-
        backend/api/handlers_booking.go bookingConfirmationDTO, returned by
        POST /api/book/{slug} with 201.
      required: [id, link_slug, title, start, end, duration_minutes, hosts, booker_name, booker_email]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        link_slug:
          type: string
        title:
          type: string
          description: The link's title, not a per-booking title.
        start:
          type: string
          format: date-time
          description: UTC, formatted with time.RFC3339 (second precision, always a `Z` offset).
        end:
          type: string
          format: date-time
          description: UTC, formatted with time.RFC3339.
        duration_minutes:
          type: integer
          description: Computed as end-start, truncated to whole minutes.
        hosts:
          type: array
          description: Accepted hosts. Always an array, never null.
          items:
            $ref: '#/components/schemas/PublicHost'
        booker_name:
          type: string
        booker_email:
          type: string
        notes:
          type: string
          description: Omitted when empty (json `notes,omitempty`).

    # ---- Scheduling links ----------------------------------------------------

    SchedulingLinkHost:
      type: object
      description: >-
        backend/api/handlers_scheduling_links.go schedulingHostDTO - the host shape
        embedded in SchedulingLink. Distinct from SchedulingLinkHostRecord, which is
        the raw DB row returned by POST /{id}/hosts.
      required: [user_id, email, is_owner, status]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
          description: >-
            Declared `user_id,omitempty` but always populated from a uuid.UUID, so in
            practice always present.
        email:
          type: string
          format: email
          description: Empty string when the user record could not be loaded.
        name:
          type: string
          description: Omitted when empty.
        avatar_url:
          type: string
          description: Omitted when empty.
        is_owner:
          type: boolean
        status:
          type: string
          enum: [pending, accepted, declined]
          description: Not constrained by the DB layer; these are the only three values the handlers write.

    SchedulingLink:
      type: object
      description: >-
        backend/api/handlers_scheduling_links.go schedulingLinkDTO. Note the DTO field
        names deliberately differ from the storage json tags (`durations` vs
        `duration_options`, `days` vs `days_of_week`, `owner_id` vs `owner_user_id`,
        `window_start` vs `window_start_time`).
      required:
        [id, owner_id, title, slug, durations, days, window_start, window_end,
         buffer_before, buffer_after, min_notice_minutes, usage_type, uses_count,
         active, hosts, created_at, is_owner]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
          description: Lowercase alphanumerics separated by single dashes (normalizeSlug).
        durations:
          type: array
          items:
            type: integer
        days:
          type: array
          description: Weekday abbreviations mapped from the stored 0-6 integers, Sunday = "sun".
          items:
            type: string
            enum: [sun, mon, tue, wed, thu, fri, sat]
        window_start:
          type: string
          description: >-
            Read back from the Postgres TIME column, so it comes out as "HH:MM:SS"
            even though the handler normalises the input to "HH:MM" before writing
            (confirmed by handlers_scheduling_links_test.go:91 expecting "10:00:00").
          example: '09:00:00'
        window_end:
          type: string
          example: '17:00:00'
        buffer_before:
          type: integer
          minimum: 0
        buffer_after:
          type: integer
          minimum: 0
        min_notice_minutes:
          type: integer
          minimum: 0
        usage_type:
          type: string
          enum: [reusable, recurring, single_use]
        max_uses:
          type: integer
          description: >-
            Present only for `recurring` links. Forced to null (and therefore omitted,
            json `max_uses,omitempty`) for reusable and single_use.
        uses_count:
          type: integer
          minimum: 0
          description: >-
            Number of booking rows stored for this link, whatever their status, so
            cancelled bookings are included and the figure never goes down when a
            booking is cancelled (PAC-40 D-6, API-051). Bookings made before PAC-40 count
            under the same rule (D-8). Exhaustion (410 on the public paths) is judged on
            this figure. No product path removes a booking row (cancel keeps it, delete
            of a link is a soft delete, D-2), so through the API the figure only grows.
            A row removed outside the product (e2e teardown, a manual database edit) is
            no longer counted (PAC-40 C-3). Whether the server stores or computes the
            figure is not part of the contract, provided it equals this count.
        active:
          type: boolean
          description: >-
            false means paused: the owner switched the link off and can switch it back on
            with PATCH. A deleted link is never returned, so this field never describes
            one (PAC-40).
        hosts:
          type: array
          description: Every host regardless of status, ordered by invited_at. Always an array, never null.
          items:
            $ref: '#/components/schemas/SchedulingLinkHost'
        created_at:
          type: string
          format: date-time
          description: UTC, Go layout "2006-01-02T15:04:05.000Z07:00" (millisecond precision).
          example: '2026-08-12T10:00:00.000Z'
        is_owner:
          type: boolean
          description: True when owner_id equals the authenticated caller.
        my_status:
          type: string
          enum: [pending, accepted, declined]
          description: >-
            The caller's own host status. Omitted (json `my_status,omitempty`) when the
            caller is not among the link's hosts.

    SchedulingLinkListResponse:
      type: object
      description: GET /api/scheduling-links. Both arrays are always present, never null.
      required: [owned, shared]
      additionalProperties: false
      properties:
        owned:
          type: array
          items:
            $ref: '#/components/schemas/SchedulingLink'
        shared:
          type: array
          description: Links where the caller is an accepted co-host but not the owner. Deleted links are never included (PAC-40).
          items:
            $ref: '#/components/schemas/SchedulingLink'

    CreateSchedulingLinkRequest:
      type: object
      description: >-
        backend/api/handlers_scheduling_links.go schedulingLinkInput. Several fields
        have two accepted spellings. For durations and days the canonical spelling wins
        whenever it is carried (present and not null; `[]` counts as carried), on create
        and PATCH alike (PAC-40 D-5). The window aliases follow their own rule (see
        each field). Nothing is required at the JSON level, but validation rejects an
        empty title.
      additionalProperties: false
      properties:
        title:
          type: string
          description: Trimmed. Required in effect - an empty title is a 422.
        slug:
          type: string
          description: >-
            Normalised to lowercase alphanumerics and dashes. When it normalises to
            the empty string a slug is generated from the owner's name plus the first
            duration.
        duration_options:
          type: array
          nullable: true
          description: >-
            Canonical spelling. Wins over `durations` whenever it is carried (present
            and not null), even as `[]`, which is then a 422 "at least one duration is
            required" whatever `durations` says. Defaults to [30] when both are absent
            or null.
          items:
            type: integer
            minimum: 1
        durations:
          type: array
          nullable: true
          description: Alias for duration_options, used only when duration_options is absent or null.
          items:
            type: integer
            minimum: 1
        days_of_week:
          type: array
          nullable: true
          description: >-
            Canonical spelling, 0=Sunday..6=Saturday. Wins over `days` whenever it is
            carried (present and not null), even as `[]` (then a 422). Defaults to
            [1,2,3,4,5] when both are absent or null.
          items:
            type: integer
            minimum: 0
            maximum: 6
        days:
          type: array
          nullable: true
          description: >-
            Alias for days_of_week, used only when days_of_week is absent or null. Accepts
            "mon"/"monday"/"1" etc, case-insensitive; unrecognised entries are silently
            dropped, which can turn a non-empty list into a 422 "at least one day".
          items:
            type: string
        window_start_time:
          type: string
          nullable: true
          description: >-
            Canonical spelling. "HH:MM" or "HH:MM:SS". Defaults to "09:00". An explicit
            null is the same as absent (the server decodes it to the empty string).
          example: '09:00'
        window_start:
          type: string
          nullable: true
          description: >-
            Alias, used only when window_start_time is absent, null or the empty string.
            Not covered by PAC-40's precedence rule: PATCH treats an empty canonical
            value differently (PAC-40 D-10, OQ-7).
        window_end_time:
          type: string
          nullable: true
          description: >-
            Canonical spelling. "HH:MM" or "HH:MM:SS". Defaults to "17:00". An explicit
            null is the same as absent (the server decodes it to the empty string).
          example: '17:00'
        window_end:
          type: string
          nullable: true
          description: >-
            Alias, used only when window_end_time is absent, null or the empty string.
            Not covered by PAC-40's precedence rule (D-10, OQ-7).
        buffer_before:
          type: integer
          minimum: 0
          default: 0
        buffer_after:
          type: integer
          minimum: 0
          default: 0
        min_notice_minutes:
          type: integer
          minimum: 0
          default: 0
        usage_type:
          type: string
          enum: [reusable, recurring, single_use]
          default: reusable
          description: Lowercased and trimmed before validation; an empty string becomes `reusable`.
        max_uses:
          type: integer
          nullable: true
          minimum: 1
          description: Required and must be positive when usage_type is `recurring`. Ignored (forced to null) otherwise.
        co_host_emails:
          type: array
          description: >-
            Emails are lowercased and trimmed, then resolved to existing accounts and
            added as `pending` hosts. Addresses with no account are skipped silently -
            the response gives no indication that an invite was dropped.
          items:
            type: string
            format: email

    UpdateSchedulingLinkRequest:
      type: object
      description: >-
        backend/api/handlers_scheduling_links.go schedulingLinkPatch. Scalars are Go
        pointers, so an absent key leaves the stored value alone; slices are plain
        slices, so an absent key and an explicit `null` are indistinguishable and both
        mean "leave unchanged", while `[]` means "clear" (and then usually fails 422).
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
          description: Normalised. If it normalises to empty the request is a 422 "slug cannot be empty".
        duration_options:
          type: array
          nullable: true
          description: >-
            Canonical spelling. When carried (present and not null) it wins over
            `durations`, as on create (PAC-40 D-5, API-049); `[]` counts as carried and
            fails 422 "at least one duration is required", leaving the link unchanged.
          items:
            type: integer
        durations:
          type: array
          nullable: true
          description: >-
            Alias for duration_options, applied only when duration_options is absent or
            null. Ignored when duration_options is carried (PAC-40; before PAC-40 the
            alias won on PATCH).
          items:
            type: integer
        days_of_week:
          type: array
          nullable: true
          description: >-
            Canonical spelling. When carried (present and not null) it wins over `days`,
            as on create (PAC-40 D-5); `[]` counts as carried and fails 422.
          items:
            type: integer
            minimum: 0
            maximum: 6
        days:
          type: array
          nullable: true
          description: >-
            Alias for days_of_week, applied only when days_of_week is absent or null.
            Ignored when days_of_week is carried (PAC-40; before PAC-40 the alias won
            on PATCH).
          items:
            type: string
        window_start_time:
          type: string
          nullable: true
        window_start:
          type: string
          nullable: true
          description: >-
            Alias, applied only when window_start_time is absent or null. An empty-string
            window_start_time is carried and wins (then 422), unlike create; unchanged by
            PAC-40 (D-10, OQ-7).
        window_end_time:
          type: string
          nullable: true
        window_end:
          type: string
          nullable: true
          description: >-
            Alias, applied only when window_end_time is absent or null; same empty-string
            caveat as window_start (PAC-40 D-10, OQ-7).
        buffer_before:
          type: integer
          nullable: true
          minimum: 0
        buffer_after:
          type: integer
          nullable: true
          minimum: 0
        min_notice_minutes:
          type: integer
          nullable: true
          minimum: 0
        usage_type:
          type: string
          nullable: true
          enum: [reusable, recurring, single_use]
        max_uses:
          type: integer
          nullable: true
          description: >-
            An explicit null is indistinguishable from an absent key (both leave the
            stored value), so max_uses cannot be cleared by PATCH except by switching
            usage_type away from `recurring`.
        active:
          type: boolean
          nullable: true
          description: >-
            Pause (false) or resume (true). Not the same as DELETE: a paused link stays
            listed and fetchable by its owner and accepted co-hosts, and its public page
            answers 404 until resumed. Cannot reach a deleted link: PATCH on one answers
            404 whatever this value is (PAC-40 AC-3, AC-11).
        co_host_emails:
          type: array
          description: >-
            When present, the complete co-host list: unlisted non-owner hosts are removed,
            new ones are added as `pending`, existing ones keep their status (PAC-61).
            Unknown emails are skipped silently.
          items:
            type: string
            format: email

    SchedulingLinkHostInvite:
      type: object
      description: backend/api/handlers_scheduling_links.go hostInviteDTO.
      required: [link_id, link_title, owner_name, owner_email, invited_at]
      additionalProperties: false
      properties:
        link_id:
          type: string
          format: uuid
          description: The value to pass as `{id}` when accepting or declining.
        link_title:
          type: string
        owner_name:
          type: string
          description: May be the empty string if the owner record has no name.
        owner_email:
          type: string
          format: email
        invited_at:
          type: string
          format: date-time
          description: UTC, Go layout "2006-01-02T15:04:05.000Z07:00".

    SchedulingLinkInviteResponse:
      type: object
      description: Echo of the status that was written. The only 200 body accept/decline returns.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [accepted, declined]

    InviteSchedulingLinkHostRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Must be non-empty after trimming and must match an existing account (lowercased before lookup).

    SchedulingLinkHostRecord:
      type: object
      description: >-
        Raw backend/storage/scheduling_links.go LinkHost row, returned by
        POST /api/scheduling-links/{id}/hosts. Not the same shape as the `hosts[]`
        entries inside SchedulingLink.
      required: [id, link_id, user_id, status, invited_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Host-row id. Note that accept/decline key on link_id, so this id is never used as a path parameter.
        link_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, declined]
        invited_at:
          type: string
          format: date-time
          description: Raw time.Time marshalling (RFC3339 with nanoseconds and the DB offset), not the DTO millisecond format.
        responded_at:
          type: string
          format: date-time
          description: Omitted while null (json `responded_at,omitempty`). Set by accept/decline.

    SchedulingLinkBookingRecord:
      type: object
      description: >-
        Raw backend/storage/scheduling_links.go Booking row, returned by
        GET /api/scheduling-links/{id}/bookings. Field names differ from
        PublicBookingConfirmation.
      required: [id, link_id, booker_name, booker_email, start_time, end_time, status, notes, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        link_id:
          type: string
          format: uuid
        booker_name:
          type: string
        booker_email:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string
          description: >-
            DB default is `confirmed`. `cancelled` rows are excluded from conflict checks
            but still count in the link's `uses_count` (PAC-40 D-6). No API path sets
            `cancelled` today.
          examples: [confirmed, cancelled]
        notes:
          type: string
          description: No omitempty - always present, possibly the empty string.
        created_at:
          type: string
          format: date-time

    # ---- Conferencing --------------------------------------------------------

    CreateConferenceRequest:
      type: object
      description: >-
        POST /api/conference/create. No handler-side validation; every field silently
        defaults to the Go zero value when absent.
      additionalProperties: false
      properties:
        title:
          type: string
        start:
          type: string
          format: date-time
          description: Decoded into time.Time. Absent means the zero time, which is forwarded to the provider.
        end:
          type: string
          format: date-time

    ConferenceMeetingDetails:
      type: object
      description: >-
        backend/conference/provider.go Details. camelCase json tags, unlike every other
        response in this domain.
      required: [provider, joinUrl]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: Provider-supplied label.
        joinUrl:
          type: string
          format: uri
        meetingId:
          type: string
          description: Omitted when empty.
        password:
          type: string
          description: Omitted when empty.
      x-uncertain: >-
        `provider` is whatever the concrete provider implementation puts there; the
        exact string set was not verified against meet.go / zoom.go / teams.go.

    ConferenceProviderStatus:
      type: object
      description: backend/api/handlers_conferencing.go conferenceProviderStatus.
      required: [provider, connected]
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [google_meet, zoom, teams, custom]
        connected:
          type: boolean
          description: Always present. `custom` is hardcoded to true.
        email:
          type: string
          description: Set only for google_meet (the configured calendar email); omitted when empty.
        enabled:
          type: boolean
          description: >-
            json `enabled,omitempty` on a bool, so `false` is OMITTED entirely - the key
            only ever appears as `true`, and only for teams. Absence must be read as false.
        auto_with:
          type: string
          enum: [google, outlook]
          description: '"google" for google_meet, "outlook" for teams. Omitted for zoom and custom.'

    AddEventConferenceRequest:
      type: object
      description: POST /api/events/{id}/conference.
      required: [provider]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: >-
            Lowercased and trimmed. `custom` and `google_meet` are handled inline;
            `zoom` and `teams` go through the provider factory; anything else is a 400
            from the factory.
          enum: [google_meet, zoom, teams, custom]
        url:
          type: string
          format: uri
          description: >-
            Required (non-empty after trimming) when provider is `custom`, ignored for
            every other provider. Never validated as a URL by the backend.

    EventConferenceLink:
      type: object
      description: backend/api/handlers_conferencing.go conferenceLinkResponse.
      required: [provider, url]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: >-
            The requested provider, EXCEPT on the already-has-a-conference echo branch,
            where it is the provider already stored on the event (which can differ from
            the requested one when `custom` was requested).
        url:
          type: string
          format: uri
        label:
          type: string
          description: >-
            Omitted when empty. "Custom link" for custom, "Google Meet" for google_meet,
            the uppercased provider name (e.g. "ZOOM", "TEAMS") for factory providers,
            and the bare stored provider string on the echo branch.
