# Domain: booking
# Source of truth: backend/api/routes.go, handlers_booking.go,
# handlers_scheduling_links.go, handlers_conferencing.go,
# backend/storage/scheduling_links.go, backend/conference/*.go
# Every field below is traceable to a Go json tag, a chi route, or a handler write.
paths:

  # ---------------------------------------------------------------------------
  # PUBLIC booking surface (registered outside requireAuth in routes.go:24-27)
  # ---------------------------------------------------------------------------

  /api/book/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: >-
          Scheduling-link slug (chi URLParam "slug"). Only a live link answers: a
          paused link (`active=false`) and a deleted link both answer 404 exactly as a
          slug that never existed (PAC-40 AC-4).
        schema:
          type: string
    get:
      operationId: getPublicLinkInfo
      tags: [booking]
      summary: Public metadata for a bookable scheduling link.
      security: []
      responses:
        '200':
          description: Link is bookable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLinkInfo'
        '404':
          description: 'No live link with that slug: never existed, paused (`active=false`) or deleted (PAC-40). Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: >-
            Link exhausted: single_use with `uses_count` >= 1, or recurring with
            `uses_count` >= max_uses. `uses_count` counts every booking ever made on the
            link, cancelled ones included, so cancelling a booking never re-opens a
            used-up link (PAC-40, API-051). Body: {"error":"link is no longer accepting bookings"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Storage failure. Body: {"error":"internal error"}. Includes a failed
            read of the link owner's settings, needed for `time_zone` (PAC-72
            revision 3.1): never answered with the UTC fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    post:
      operationId: createPublicBooking
      tags: [booking]
      summary: Book a slot on a public scheduling link.
      security: []
      description: >-
        Rate limited per client (NEW-booking-rate-limit). A client may make at
        most 20 requests to this operation per fixed 10-minute window; the
        window starts at the client's first counted request and is not extended
        by refused requests. The limit is checked and the request counted
        atomically, as the very first step of the handler: before the link
        lookup, before the body is read and before any validation, so every
        request counts whatever it would otherwise have answered (201, 400, 404,
        409, 410, 500 or 503), and a refused request answers 429 even for an
        unknown slug and never writes a booking. Concurrent requests cannot
        exceed the limit. The count is per client across all links, not per
        link or per host, and is separate from the slot-listing budget of
        `getPublicBookingSlots`. A client is identified exactly as for
        `detectAuthProvider` (PAC-39): the socket peer address, or the
        `X-Real-IP` header only when the socket peer is inside `TRUSTED_PROXIES`
        (comma-separated IPs or CIDRs; empty or unset trusts nobody; an
        unparseable entry trusts less, never more). `X-Forwarded-For` is never
        read. A client is one exact IPv4 or IPv6 address, with no prefix
        grouping. Counts live in process memory: the limit is per backend
        process (20 per replica, as API-062's residue), and a restart clears
        them. Clients whose window has ended are forgotten by a sweep that runs
        on a request, at most once per window, so memory stays bounded. CORS
        preflight (`OPTIONS`) is answered by the CORS middleware and is not
        counted. Offerable-start rule (PAC-72, fixes API-094): a booking is
        accepted only when the interval it would store, [start, end), is exactly
        a slot that `getPublicBookingSlots` would offer for this link and this
        duration at the moment the request is handled. Listing and booking
        apply one rule: (1) the duration is one of the link's durations (else
        400, checked first); (2) the start falls on one of the link's
        `days_of_week` and inside its daily window, on the 15-minute grid
        counted from `window_start_time`, with zero seconds and zero fraction, and
        start + duration ends no later than `window_end_time` (these are the
        create/update request and storage names; the owner's `SchedulingLink`
        read model calls the same fields `days`, `window_start` and
        `window_end`); (3) every accepted
        host is free for the whole slot: no non-transparent calendar event
        (widened by the link's buffers; buffers apply to calendar events only,
        and events are read only for the daily window), no focus block, and no
        booking that is not `cancelled` (pending or confirmed) on any link the
        host owns or co-hosts, this link included; (4) the start is at least
        `min_notice_minutes` after the request is handled; (5) the start's
        date in the link's zone is today (in that zone) or one of the next
        `booking_horizon_days` - 1 days (PAC-72 revision 2, owner decision D-1:
        a per-link setting, 1..365, default 60); (6) the link has at least one
        accepted host. The link's zone (PAC-72 revision 2, owner decision D-9)
        is the link OWNER's profile time zone (`settings.timezone`), whoever
        the co-hosts are and whatever zone the server process runs in; when the
        owner has no settings row or the stored name is not a loadable IANA
        zone, the zone is UTC. A failed READ of the owner's settings (a
        storage error) is not "no settings row": it is the 500 and nothing is
        written, never the UTC fallback (PAC-72 revision 3.1, D-7). Days,
        hours, the grid, "today" and the horizon are all evaluated in that
        zone, as wall-clock times: a slot start whose wall time does not exist
        on a daylight-saving change day is not offered, and a wall time that
        occurs twice is offered once, at its first occurrence. Window edges on
        such a day: a `window_start_time` or `window_end_time` that does not
        exist that day is taken at the instant of the change (the first
        existing instant after the gap), so the window never grows; an edge in
        a repeated hour is taken at its first occurrence; the 15-minute grid
        stays counted in wall time from `window_start_time`. The zone used is
        exposed as `PublicLinkInfo.time_zone`, to anyone who has the link
        (owner decision D-9 makes it the page's default display). Order of
        evaluation: the owner's zone is read first; a start refused by the
        horizon, the days/hours/grid or the notice is refused with that reason
        without reading any host's busy time, so a storage failure on busy
        time cannot turn such a start into a 500 (the listing likewise answers
        a date outside the horizon before any host read). A start on a day
        before today (link zone) is not `beyond_horizon` (that names the far
        edge only); it is always inside the notice, so it is `too_soon` unless
        `outside_link_hours` comes first. `start` is
        compared as an instant, so any UTC offset denoting a grid instant is
        the same start; the stored and returned start and end are exactly the
        slot's, in UTC. A start the rule does not offer answers 409 and nothing
        is written: no booking row, no calendar event, no email. The 409 body
        depends on the link's `refusal_message` setting (PAC-72 revision 2,
        owner decisions D-2/D-5): `generic` (the default) answers the single
        body `{"error":"slot is no longer available"}` whatever rule failed;
        `specific` answers one reason, see the 409 response. The 409 check runs
        after the 429, 404, 410 and 400 checks. Host calendars must be readable
        (owner decision PAC-72 D-6, 2026-11-01, as implemented by PAC-81 Part
        A): each accepted host's calendar is read for the slot's day window
        (at most 4 concurrent reads, each limited as on
        `getPublicBookingSlots`); a host whose calendar cannot be read (not
        connected, a provider error, a refused credential, or its own time
        limit) is busy for the whole window, so the slot is not offered and the
        booking is refused with the 409 (reason `host_busy`); nothing is
        written. A host not read because the request budget ran out is the
        503, never a 409. A storage failure while reading the link's accepted
        hosts, a host's focus blocks or the bookings on the hosts' links
        answers 500 and writes nothing, never 409. Concurrent requests (PAC-82)
        are decided as if they had arrived one after the other: see the
        concurrency paragraph below. `uses_count` counts every booking ever
        made on the link, cancelled ones included (PAC-40, API-051 Fixed), see
        the 410. When the start is accepted, the booking row
        is saved, then a calendar event (with
        the booker email as a guest) is attempted on each accepted host's
        calendar, best effort: a host whose user record or calendar client
        cannot be loaded is skipped and a failed event creation is ignored, so a
        201 does not mean any host's calendar was written. Operation-level
        `security: []` is kept: this operation is public and is registered
        outside requireAuth; the rate limit is not authentication.


        A link deleted or paused while the request is handled (PAC-101): the
        booking row is saved only if, at the moment it is saved, the link is
        still live (not deleted, not paused), and that check and the save are
        one atomic step ordered against the link's delete and pause. A booking
        that would otherwise have been saved but whose link was deleted or
        paused first answers exactly the 404 `{"error":"not found"}` of a link
        deleted before the request arrived, never 201, 409, 410 or 503, and
        nothing is written: no booking row, no host calendar event, no
        confirmation email. A booking saved first is a booking made before the
        delete: it is kept in full, answered 201, and listed in the owner's
        archive after the delete (its `created_at` may be a few milliseconds
        after the link's deletion instant, which is the delete's start, not its
        commit). A request refused for another reason (400, 409, 410, 429, 503)
        keeps that answer even when the link was deleted meanwhile, and writes
        nothing either way. This ordering against the delete never makes two
        bookings wait for each other; the PAC-82 ordering below can, only for
        the length of a save. A save that must wait for a delete, pause or
        edit of the same link, or for another booking's save, still in
        progress waits at most 10 seconds per wait; past that it is the 500
        and nothing is written.


        Concurrent bookings (PAC-82). However many requests arrive at once, a
        host is never booked twice for overlapping time through public booking
        links, on the same link or on two links that share the host (owner or
        accepted co-host), and a link with a use limit (`single_use`, or
        `recurring` with `max_uses`) never stores more bookings than its
        limit. When requests conflict, exactly one is saved and each other one
        gets the answer it would have got had it arrived after the winner was
        saved: the 409 (`taken` on the same link, `host_busy` on another link,
        same body rules as the 409 below) or the 410, and writes nothing (no
        row, no event, no email). The decision is made again when the booking
        is saved, after the checks that read host calendars, so a request that
        passed those checks can still lose there. Two saves wait for each
        other only when they could conflict: overlapping or near time for a
        common host (two slots at least 15 minutes apart, end of one to start
        of the other, never wait for each other, except that a save whose
        number of hosts times the 15-minute UTC blocks its slot touches is
        above 64 waits for every other save of those hosts), or any two
        bookings of one use-limited link. No such wait includes a call to a
        calendar provider; each is bounded by the 10 seconds above. Conflicts
        with calendar events or focus blocks written by something other than
        a booking during the request are not ordered (the provider is outside
        the database); the calendar read stays the only check for those.


        Idempotent retry (PAC-82). A client may label one booking attempt with
        the optional `Idempotency-Key` request header (see the parameter for
        format, scope and window) and send the same attempt again with the same
        key when it did not get the answer. Sending the same attempt again never
        creates a second booking: when a booking with that key was saved on
        this link less than 24 hours ago and its details match (name and email
        after trimming, start and end as instants, and notes byte for byte),
        the answer is that booking's 201 (see the 201), even when the link has
        since been used up, the start is now too soon, outside the link's
        hours or beyond its horizon, the slot is now busy or taken, or the
        duration is no longer one of the link's durations; nothing is written
        and no calendar event or email is sent again. When the key exists on
        this link with different details, or was saved 24 hours ago or more,
        the answer is the 409 `{"error":"idempotency key already used"}`,
        whatever the link's `refusal_message`, and nothing is written; it never
        reveals the stored booking's details. When no booking with that key
        exists on this link, the request is handled as a new one and, if
        saved, carries the key. A key is scoped to its link: the same key on
        another link is a new request there. Order of evaluation for a request
        that carries a key: 429, 404, the key's 400, the body's 400s that do
        not depend on the link (invalid body, required fields, start and end
        format, duration not matching end, a length that is not whole
        minutes, end not after start), then the replay decision, then the 410,
        the "invalid duration" 400, and the remaining checks as for a request
        without a key. A request without a key (or with an empty one) is
        answered exactly as before PAC-82 apart from the concurrency rules
        above. A request that carries a key and would be refused with a 409
        or 410 looks for its key again just before answering; if a booking
        with that key was saved meanwhile, the answer is the replay (or the
        key-reused 409) instead. A link deleted or paused since the original
        save answers the 404 (never a replay). The 503 and the 500 keep their
        meaning for the request that receives them.


        CORS: `Idempotency-Key` is an allowed request header for this
        operation (the server's `Access-Control-Allow-Headers` is
        `Content-Type, Authorization, Idempotency-Key`), so a page on the
        allowed origin can send it cross-origin. A server before PAC-82
        refuses the header in a cross-origin preflight: the web ships after
        the server.
      parameters:
        - $ref: '#/components/parameters/BookingIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicBookingRequest'
      responses:
        '201':
          description: >-
            Booking saved (PAC-81, spec AC-A19). The stored and returned `start`
            and `end` equal the offered slot exactly, in UTC (PAC-72). Once the
            booking row is saved,
            the host calendar events (best effort, as described above) and the
            confirmation email are completed as one unit that does not depend on
            this request: it has its own per-call time limits, and a deploy waits
            for it within the drain (an abandoned unit is logged with the booking
            id and the hosts done and not done). The server waits for that unit
            only until the request budget runs out, then answers this 201 anyway,
            so a host's calendar event may be written after the response. The
            body is the same either way and carries no event data. With
            responsive calendars every host event exists when the 201 is sent, as
            before. Replay (PAC-82): a request carrying the `Idempotency-Key`
            of a booking saved on this link less than 24 hours ago, with
            matching details, is answered with this 201 for THAT booking: the
            same `id`, `link_slug` (the slug the request used), `start`, `end`,
            `duration_minutes`, `booker_name`, `booker_email` and `notes` as
            the original 201, built from the stored row; `title` and `hosts`
            are the link's current values, as on every 201, so they differ
            from the original answer only when the owner changed them in
            between. A replay writes nothing, starts no calendar event and no
            email, and does not wait for the original's calendar events, which
            may still be in progress. Nothing in the answer marks it as a
            replay. A request without a key never receives another request's
            booking; with a key, only the booking that key saved on this link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBookingConfirmation'
        '400':
          description: >-
            Validation failure, checked before the offerable-start rule (a 400
            is never turned into a 409). Messages: "invalid request body";
            "name, email, and start are required"; "invalid start time, use RFC3339";
            "invalid end time, use RFC3339"; "duration does not match end time"
            (`end` sent together with `duration` or `duration_minutes`, and
            end - start is not exactly that many minutes, seconds and fractions
            included); "invalid duration" (the resolved length is not exactly a
            whole number of minutes that is one of the link's durations, or 30
            when the link has none; never rounded or truncated to an accepted
            duration); "end must be after start" (reachable only when
            the end computed from `duration_minutes` overflows, which needs a
            link duration option above about 153,722,867 minutes; an ordinary
            end at or before start answers "duration does not match end time" or
            "invalid duration" instead). PAC-82: "invalid Idempotency-Key
            header" when the header is present, not empty, and not 16 to 255
            characters from `A-Z a-z 0-9 - _`, or when it is sent more than
            once (two or more field lines, even identical); checked after the
            404 and before the body is read, nothing written. With a valid key,
            "invalid duration" for a duration that is not one of the link's is
            checked after the replay decision and the 410 (a replay is never
            turned into this 400); every other message keeps its place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: >-
            No live link with that slug: never existed, paused (`active=false`) or
            deleted (PAC-40); or the link was deleted or paused while this request
            was handled, before its booking was saved (PAC-101). Nothing is
            written in either case: no booking row, no calendar event, no email.
            Also the answer to a retry carrying the `Idempotency-Key` of a
            booking saved before the link was deleted or paused: never a replay
            (PAC-82); the booking itself is kept. Body: {"error":"not found"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: >-
            The start is not one `getPublicBookingSlots` would offer now (PAC-72).
            Nothing is written. Causes and, when the link's `refusal_message` is
            `specific`, the `reason` each one answers: the start's date (link
            zone) is after today + `booking_horizon_days` - 1 (`beyond_horizon`);
            the start is on a day not in the link's `days_of_week`, outside its
            daily window, off the 15-minute grid counted from
            `window_start_time` (including any non-zero seconds or fraction), or
            start + duration ends after `window_end_time` (`outside_link_hours`);
            the start is inside `min_notice_minutes` (`too_soon`); a booking
            that is not cancelled on THIS link overlaps the slot (`taken`); an
            accepted host is busy - a calendar event widened by the link's
            buffers, a focus block, a pending or confirmed booking on another
            link the host owns or co-hosts, a calendar that could not be read
            (D-6) - or the link has no accepted host (`host_busy`). When several
            causes hold, the reason is the first in this order:
            `beyond_horizon`, `outside_link_hours`, `too_soon`, `taken`,
            `host_busy`. With `refusal_message` `generic` (the default) the body
            is always exactly `{"error":"slot is no longer available"}` and has
            no `reason`, so a refusal does not reveal which rule failed. The
            setting is read when the request is handled. PAC-82: `taken` and
            `host_busy` are also the answer of a request that passed every
            check but lost, when saved, to a concurrent booking that was saved
            first (same body rules). A second, distinct 409 body: the
            `Idempotency-Key` was already used on this link with different
            details, or was used 24 hours ago or more:
            exactly `{"error":"idempotency key already used"}`, never a
            `reason`, the same whatever the link's `refusal_message`, and
            nothing of the stored booking. Nothing is written. A client tells
            the two apart by `error` alone (see PublicBookingConflict).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBookingConflict'
        '410':
          description: >-
            Link exhausted (same rule as getPublicLinkInfo: `uses_count` counts every
            booking made, cancelled ones included; PAC-40). PAC-82: also the
            answer of a request that passed the check but, when saved, found
            the limit reached by bookings saved first (concurrent requests on a
            use-limited link). Never the answer to a replay. Nothing written.
            Body: {"error":"link is no longer accepting bookings"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '429':
          $ref: '#/components/responses/BookingCreateRateLimited'
        '500':
          description: >-
            Storage or engine failure. `error` is one of "internal error" or "booking
            conflict check failed". "booking conflict check failed" is the answer
            when busy time cannot be gathered from storage (the link's accepted
            hosts, a host's focus blocks, or the bookings on any link a host owns
            or co-hosts) or when the link owner's settings (the link's zone)
            cannot be read; nothing is written and the answer is never 409, and a
            failed settings read is never answered with the UTC fallback
            (PAC-72 revision 3.1, D-7). A host
            whose external calendar cannot be read is not a 500 (it is busy: the
            409, D-6). The detail is written to the server log and Sentry only
            (PAC-21). A 500 from this operation does NOT prove that no booking was
            saved: when the insert was sent and its result is lost (for example the
            database connection drops), the outcome is unknown and the answer is
            this 500 (PAC-81 contract revision 2). Only the 503 proves that nothing
            was saved. Also this 500, with `{"error":"internal error"}` and nothing
            written: the save waited 10 seconds for a delete, pause or edit of the
            same link still in progress (PAC-101), or for another booking's save
            on a common host or the same use-limited link (PAC-82); the client
            cannot tell this case from the others. A 500 answered to a request
            carrying an `Idempotency-Key` may be retried with the same key and
            the same details: if the first request was saved, the retry is its
            replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '503':
          description: >-
            The request budget ran out BEFORE the booking insert was sent (PAC-81,
            spec AC-A2, AC-A19; contract revision 2). From the moment the insert
            is sent this request is never answered with this 503: the server
            waits for the insert's own result (bounded by the insert's own
            duration, not by the budget) and answers 201 if the row was saved, or
            the 500 if the insert failed. So this 503 proves that no booking was
            saved for this request (no calendar event, no email), and a client
            may retry it. Shared body `{"error":"request timed out"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestBudgetExpiredError'

  /api/book/{slug}/slots:
    get:
      operationId: getPublicBookingSlots
      tags: [booking]
      summary: Available slots for one day, or the days of a bounded range that have any slot.
      description: >-
        Days are calendar days in the DAY ZONE: `display_time_zone` when the
        request carries it, otherwise the link's zone (`PublicLinkInfo.time_zone`)
        (PAC-88, owner decision PAC-72 D-9). Two distinct modes. With `date` (one
        day in the day zone): `slots` holds every offered slot whose start falls
        on that day in the day zone, in ascending start order, and
        `available_dates` is always the empty array. Without `date` (the day
        overview): `available_dates` holds, in ascending order, the days from
        `from` to `to` inclusive (at most 42 days; when both are omitted, today
        in the day zone and the next 41 days) on which at least one offered
        slot starts in the day zone, and `slots` is always the empty array.
        Every answer states the link's zone it was computed in (`time_zone`),
        the day zone (`display_time_zone`) and the days it covered
        (`range_from`, `range_to`). A day of the day zone is never cut into
        parts: every offered start is listed under exactly one day, its
        calendar date in the day zone, whichever of the link's days it belongs
        to (a day zone other than the link's makes one day overlap two, around
        an offset change three, of the link's days; they are one answer). The
        day zone changes only how offered starts are grouped into days: the set
        of offered instants, the booking rule, the refusals and the link's own
        "today", horizon, days and hours (all in the link's zone) are the same
        for every day zone. Without `display_time_zone` and with `date`, the
        lists are exactly the PAC-72 answer for that link-zone day. Both list
        keys are always present in both modes. A slot is offered by the same rule
        `createPublicBooking` accepts (PAC-72; see that operation for the six parts
        and the link's zone): duration, link days and daily window on the 15-minute
        grid, every accepted host free, minimum notice, horizon, at least one
        accepted host. Days, hours, "today" and the horizon are evaluated in the
        link's zone (the link owner's profile time zone, UTC when it has none; the
        zone used is `PublicLinkInfo.time_zone`), whatever zone the server process
        runs in; slot instants are returned in UTC. A day not in the link's
        `days_of_week` offers no slot. A `date`, or a whole `from`..`to` range,
        with no offered start (before today, after the horizon's last day, not
        a link day, fully booked) answers 200 with an empty list, never an
        error; a link with no accepted host answers 200 with no slot and no
        date in both modes. When busy time cannot be gathered from storage (the
        link's accepted hosts, a host's focus blocks, or the bookings on any
        link a host owns or co-hosts) for any link day the answer needs, both
        modes answer 500 for the whole request (PAC-88 spec section 3.4: never
        a day that silently looks empty; this replaces the earlier date-less
        behaviour of omitting that day). The cost of an answer is bounded by
        the days it covers, never by the link's horizon: the overview covers at
        most 42 days whatever `booking_horizon_days` is (1 to 365), and, in
        both modes, each accepted host's external calendar is read at most once
        per request, over one window spanning every link day the answer needs
        (link days outside the horizon or not among `days_of_week` need no
        read). That one read is complete for its whole window: every page of
        the provider's answer is read, and a read that cannot be completed (a
        later page fails, or the read's own limit ends first) is an unreadable
        calendar (busy, D-6 below), never a partial list of events. The
        storage half of busy time (focus blocks, bookings) likewise covers
        every needed link day, however many storage queries that takes. The earlier date-less read of the whole horizon (and its 503 on
        long horizons, PAC-72 revision 3.1) no longer exists: a request without
        `date`, `from` and `to` is the 42-day overview starting today in the
        day zone.
        Hosts (PAC-81, spec AC-A18): each accepted host's calendar is read on at
        most 4 concurrent reads per request, each limited to its own 15 s (shortened
        to the budget left minus a 10 s stop margin). A host whose calendar cannot be
        read is BUSY for the whole requested window (owner decision PAC-72 D-6,
        2026-11-01; it replaces the earlier "treated as free"): not connected, a
        provider error, or a read that fails on its own time limit. Every link is
        collective (every accepted host must be free; there is no round-robin or
        any-host kind), so a link with such a host offers no slot in the window
        read (no slot for that `date`, no day of that overview); the answer is
        still a 200. A
        host that was not read because the request budget ran out (a read not
        started at the stop margin, or cut short by the budget) is neither free
        nor busy: the answer is the 503. A read that hits a deadline shortened by the budget (budget left minus
        the margin was below 15 s) counts as cut short by the budget, not as failing
        on its own limit: the answer is the 503, never a 200 that silently omits that host or,
        without `date`, a day. Neither mode has a partial shape.
        Validation order (PAC-88 keeps the existing order and appends its checks
        where the `date` check was): rate limit (429), link lookup (404, 410),
        `duration` (400), the link's zone (500), then the query in this order:
        `display_time_zone`, `date` combined with `from` or `to`, `date`,
        `from`, `to`, `from` without `to` or the reverse, `to` before `from`,
        a range over 42 days (each a 400 with its own message, see the 400
        below). An empty query value (`date=`, `from=`, `to=`,
        `display_time_zone=`) is the same as an absent one. Unknown query
        parameters are ignored.
        Caching: the answer carries no `Cache-Control`, `ETag` or
        `Last-Modified` header (none before PAC-88, none added), so no browser
        stores it heuristically; it depends on the clock and on hosts'
        calendars, and a client may reuse it only within one page visit.
        Rate limited per client (NEW-booking-rate-limit), separately from and more
        loosely than `createPublicBooking`: at most 120 requests per client per
        fixed 1-minute window, in every mode and with or without
        `display_time_zone`; one overview request counts once whatever its
        range (unchanged by PAC-88). The limit is checked and the
        request counted atomically as the handler's first step, before the link
        lookup and before the query is validated, so every request counts whatever
        it would otherwise have answered, and a refused request answers 429 even
        for an unknown slug. Booking requests do not consume this budget and slot
        requests do not consume the booking budget. Client identification, the
        per-process caveat, the sweep and the CORS preflight exemption are exactly
        as described on `createPublicBooking`; this limiter has its own counts and
        its own sweep.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: display_time_zone
          in: query
          required: false
          description: >-
            PAC-88: the IANA name of the zone whose calendar days `date`, `from`,
            `to` and the answer's days are (the day zone). Optional; absent or
            empty means the link's zone. Accepted when it matches the pattern,
            is not `Local`, `localtime` or `posixrules` (files some systems link
            to the server's own zone) and does not start with `right/` (the
            leap-second variants, whose instants are off by seconds), and
            `time.LoadLocation` loads it from the server's
            tz database (the backend image's tzdata, `backend/Dockerfile`);
            names are case-sensitive and the tz database's links (e.g.
            `Asia/Calcutta`) are accepted as themselves. Anything else is the
            400 `invalid display_time_zone, use an IANA time zone name`, never
            an answer in another zone (spec AC-32). The answer echoes the name
            as sent in `display_time_zone`.
          schema:
            type: string
            maxLength: 64
            pattern: '^[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z0-9_+-]+){0,2}$'
            example: America/New_York
        - name: date
          in: query
          required: false
          description: >-
            Day to enumerate, parsed with Go layout "2006-01-02" as a calendar day
            in the day zone (`display_time_zone` when given, else the link's
            zone `PublicLinkInfo.time_zone`, PAC-72 revision 2). A day with no
            offered start (before today, after the horizon's last day) answers
            200 with no slots. Cannot be combined with `from` or `to`. Omit for
            the day overview.
          schema:
            type: string
            format: date
            example: '2026-08-12'
        - name: from
          in: query
          required: false
          description: >-
            PAC-88: first day (inclusive, YYYY-MM-DD, a calendar day in the day
            zone) of the day overview. Given together with `to` or not at all,
            and only without `date`. Omitted with `to`: today in the day zone.
          schema:
            type: string
            format: date
            example: '2027-03-01'
        - name: to
          in: query
          required: false
          description: >-
            PAC-88: last day (inclusive, YYYY-MM-DD, day zone) of the day
            overview; not before `from`, and `from`..`to` spans at most 42 days
            (a six-week month grid). Omitted with `from`: `from` + 41 days.
          schema:
            type: string
            format: date
            example: '2027-04-11'
        - name: duration
          in: query
          required: false
          description: >-
            Meeting length in minutes. Must be one of the link's `durations`
            (or exactly 30 when the link has none). Default is `durations[0]`, else 30.
          schema:
            type: integer
            minimum: 1
            example: 30
      responses:
        '200':
          description: Slot list or availability summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSlotsResponse'
        '400':
          description: >-
            The `BookingError` envelope with one of these messages, in the
            validation order given above: "invalid duration" (non-numeric or not
            in the link's duration set); "invalid display_time_zone, use an IANA
            time zone name" (PAC-88, spec AC-32: not matching the pattern,
            `Local`, `localtime`, `posixrules`, a `right/` name, or not
            loadable from the server's tz database); "date
            cannot be combined with from or to"; "invalid date format, use
            YYYY-MM-DD"; "invalid from, use YYYY-MM-DD"; "invalid to, use
            YYYY-MM-DD"; "from and to must be given together"; "to must not be
            before from"; "range must not exceed 42 days".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: 'No live link with that slug: never existed, paused (`active=false`) or deleted (PAC-40). Body: {"error":"not found"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: >-
            Link exhausted (same rule as getPublicLinkInfo: `uses_count` counts every
            booking made, cancelled ones included; PAC-40). Body:
            {"error":"link is no longer accepting bookings"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '429':
          $ref: '#/components/responses/BookingSlotsRateLimited'
        '500':
          description: >-
            Storage or engine failure, including, in both modes, busy time that
            cannot be gathered from storage for any link day the answer needs
            (PAC-72; PAC-88 extends it to the overview, which no longer omits
            such a day), and a failed read of the link owner's settings (the
            link's zone; PAC-72 revision 3.1): the whole request is this 500,
            never the UTC fallback and never a list with days omitted. Body:
            {"error":"internal error"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '503':
          $ref: '#/components/responses/RequestBudgetExpired'

  # ---------------------------------------------------------------------------
  # PUBLIC Zoom OAuth (routes.go:37-38, inside /api/auth but OUTSIDE the
  # requireAuth sub-group at routes.go:44-48 -> no JWT required)
  # ---------------------------------------------------------------------------

  /api/auth/zoom:
    get:
      operationId: startZoomOAuth
      tags: [conferencing]
      summary: Begin the Zoom OAuth authorization-code flow.
      description: >-
        Sets a 300-second HttpOnly `zoom_oauth_state` cookie (SameSite=Lax, Path=/)
        and 302-redirects to Zoom's authorize endpoint. Not a JSON endpoint.
        Requires a signed-in user since PAC-24: Zoom is connected to the
        caller's own settings, so there must be a caller (session cookie, which
        the browser sends on this top-level navigation).
      responses:
        '500':
          $ref: '#/components/responses/SessionGenerationUnavailable'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '302':
          description: Redirect to Zoom's authorize URL.
          headers:
            Location:
              description: >-
                Zoom authorize URL with query params response_type=code, client_id,
                redirect_uri (ZOOM_REDIRECT_URL), state (32 hex chars).
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: 'zoom_oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax'
              schema:
                type: string
        '503':
          description: 'ZOOM_CLIENT_ID is unset. Body: {"error":"Zoom OAuth not configured"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/auth/zoom/callback:
    get:
      operationId: handleZoomOAuthCallback
      tags: [conferencing]
      summary: Zoom OAuth redirect target; exchanges the code and stores tokens.
      description: >-
        Compares `state` against the `zoom_oauth_state` cookie, clears that cookie,
        exchanges `code` for tokens, persists them on the CALLER'S OWN settings row
        (making Zoom the caller's conferencing provider, and nobody else's), then
        302-redirects to the app root. Requires a signed-in user since PAC-24 (401
        otherwise); before PAC-24 it wrote the single shared settings row.
        Error bodies here use `http.Error`, i.e. `text/plain; charset=utf-8` plain text,
        NOT the shared JSON error envelope.


        Since PAC-67 (spec AC-3, AC-11, AC-12, AC-24) this is also the Zoom
        RECONNECT, and what it stores changes; no response, status or Location
        changes. The access token's expiry (from the exchange's `expires_in`) is
        stored with the tokens so the credential can be renewed when it expires.
        When the exchange returns no refresh token, the caller's stored refresh
        token is kept rather than overwritten with an empty one (AC-11). Storing
        the credential ends any recorded loss of the caller's Zoom connection, so
        the `zoom` row of `listConferenceProviders` reports connected again.
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code from Zoom. Absent/blank values are forwarded to the token exchange, which then fails with 500.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Must equal the `zoom_oauth_state` cookie value, otherwise 400.
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '302':
          description: Tokens stored; redirect back to the app.
          headers:
            Location:
              description: Always the literal string `/?connected=true&provider=zoom`.
              schema:
                type: string
                const: /?connected=true&provider=zoom
            Set-Cookie:
              description: 'zoom_oauth_state=; Path=/; Max-Age=0 (clears the state cookie)'
              schema:
                type: string
        '400':
          description: Missing cookie or state mismatch.
          content:
            text/plain:
              schema:
                type: string
                const: "invalid state\n"
        '500':
          description: >-
            Token exchange or token persistence failed. Body: `{"error":"internal error"}`.
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  # ---------------------------------------------------------------------------
  # PROTECTED scheduling links (routes.go:153-169, inside requireAuth group)
  # ---------------------------------------------------------------------------

  /api/scheduling-links:
    post:
      operationId: createSchedulingLink
      tags: [scheduling-links]
      summary: Create a scheduling link owned by the caller.
      description: >-
        The caller is inserted as an `accepted` host. Each entry of `co_host_emails`
        is resolved by lowercased email; unknown emails are silently skipped (no error,
        no host row). An empty/omitted `slug` is auto-generated from the owner's name.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): an entry of `co_host_emails` resolves to an account only when
        exactly one account holds that address DOMAIN-CONFIRMED (compared
        case-insensitively); an address carried only unconfirmed, by several accounts
        (letter-case collision), or by none is skipped exactly as an unknown email is
        today (no error, no host row).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchedulingLinkRequest'
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: 'Body is not valid JSON. Body: {"error":"invalid request body"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '409':
          description: 'Explicit slug collides with an existing link, deleted links included: a deleted link keeps its slug (PAC-40 D-3). Body: {"error":"slug already exists"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          $ref: '#/components/responses/SchedulingLinkValidationError'
        '500':
          description: >-
            `error` is one of "user not found", "slug generation failed", "slug check
            failed" or "internal error" (insert or owner-host insert failed, or the
            owner's settings, needed for `time_zone`, could not be read; PAC-72
            revision 3.1, never the UTC fallback). The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    get:
      operationId: listSchedulingLinks
      tags: [scheduling-links]
      summary: Links the caller owns or co-hosts with an accepted status.
      description: >-
        Deleted links are never listed, in either group (PAC-40 AC-1). Paused links
        (`active=false`), including every link that was inactive before PAC-40 (D-1),
        are listed with `active: false`.
      responses:
        '200':
          description: Partitioned into owned vs shared by `is_owner`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkListResponse'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: >-
            Body: {"error":"internal error"}. Includes a failed read of an owner's
            settings, needed for each link's `time_zone` (PAC-72 revision 3.1),
            never the UTC fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/host-invites:
    get:
      operationId: listSchedulingLinkHostInvites
      tags: [scheduling-links]
      summary: Pending co-host invitations addressed to the caller.
      description: >-
        Invites whose link or owner can no longer be loaded are silently dropped from
        the list, and so are invites to a deleted link (PAC-40 AC-5). Invites to a
        paused link (`active=false`) are still listed (PAC-30 D-5). Returns `[]`
        (never null) when there are none.
      responses:
        '200':
          description: Pending invites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulingLinkHostInvite'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/invites:
    get:
      operationId: listSchedulingLinkInvitesAlias
      tags: [scheduling-links]
      summary: Alias of GET /api/scheduling-links/host-invites (identical handler).
      description: >-
        routes.go:157-158 registers `slh.listHostInvites` at BOTH `/host-invites` and
        `/invites`. Byte-for-byte identical behaviour and response; neither is
        deprecated in code. The frontend only ever calls `/host-invites`. Invites to a
        deleted link are omitted, as there (PAC-40).
      responses:
        '200':
          description: Pending invites (same payload as listSchedulingLinkHostInvites).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulingLinkHostInvite'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/archive:
    get:
      operationId: listArchivedSchedulingLinks
      tags: [scheduling-links]
      summary: The caller's archive of the links they deleted (owner only, read-only).
      description: >-
        PAC-40 (owner decision 2026-10-27, spec §3.2, R-1, R-3). Every link the
        caller OWNS and has deleted, most recently deleted first (`deleted_at` DESC,
        then `id` ASC). Owner only by construction: the list is filtered on the
        caller being the owner, so a co-host, a pending invitee or anyone else never
        sees another user's deleted link here (AC-23). Paused links, and links that
        were inactive before PAC-40 (D-1), are never in the archive (AC-11, AC-12).
        An owner who has deleted nothing gets 200 with `links: []`, never 404 (AC-24).
        Not paginated, like `listSchedulingLinks`. Read-only: no operation under
        `/api/scheduling-links/archive` writes, and there is no restore. Static
        segment: chi matches `archive` before `/{id}`, so this path never reaches
        `getSchedulingLink` (which would have answered 400 "invalid id").
      responses:
        '200':
          description: The caller's archived links and the deployment's erasure policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivedSchedulingLinkListResponse'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: >-
            Body: {"error":"internal error"}. A storage error on the read; never a
            200 with a partial or empty list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/archive/{id}:
    parameters:
      - $ref: '#/components/parameters/SchedulingLinkIdPath'
    get:
      operationId: getArchivedSchedulingLink
      tags: [scheduling-links]
      summary: One archived link and all its bookings (owner only, read-only).
      description: >-
        PAC-40 (spec §3.2, R-2, AC-22, AC-23, AC-32). The only way anyone reaches a
        deleted link's bookings. Check order: `{id}` not a UUID -> 400 "invalid id";
        then one lookup of a DELETED link with that id OWNED by the caller; none ->
        404 `{"error":"not found"}`. That 404 is the same status and body for an id
        that never existed, a live or paused link (owner included: they are not in
        the archive), and a deleted link the caller does not own (accepted co-host,
        pending invitee, anyone else), so the answer never tells a non-owner that
        the id exists or once existed (D-9, AC-6a, AC-23). Never 403. Otherwise 200
        with the link's archive entry and EVERY booking the link received, whatever
        its status and whether its meeting is past or still ahead (R-2), ordered by
        `start_time` DESC then `id` ASC. Read-only.
      responses:
        '200':
          description: The archive entry and its bookings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivedSchedulingLinkDetail'
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            No deleted link with that id owned by the caller: never existed, live,
            paused, or deleted but owned by someone else. One answer for all of
            them. Body exactly {"error":"not found"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              example:
                error: not found
        '500':
          description: >-
            Body: {"error":"internal error"}. A storage error on the link or the
            bookings read; never a 404 and never a 200 with bookings missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/host-invites/{id}/accept:
    post:
      operationId: acceptSchedulingLinkHostInvite
      tags: [scheduling-links]
      summary: Accept a co-host invitation.
      description: >-
        `{id}` is the SCHEDULING LINK id, not the invite/host-row id -- the handler runs
        `UPDATE scheduling_link_hosts SET status=... WHERE link_id=$1 AND user_id=$2`.
        This matches the `link_id` field of the invite list payload. The UPDATE must
        affect exactly the caller's row: when it affects zero rows (the caller has no
        host row on that link, or `{id}` is not a link id, e.g. the host-row `id` from
        `SchedulingLinkHostRecord`) the answer is 404 and nothing changes (PAC-30,
        API-020; before PAC-30 this was a 200 that changed nothing). Any existing host
        row matches, whatever its current status, so accepting twice is a 200 both
        times and a declined host may still accept. The owner's own row is a host row
        too, so the owner gets 200 (see PAC-30.md follow-ups). A paused link
        (`active=false`) keeps its host rows, so accept/decline on it match and return
        200 (PAC-30 D-5). A deleted link answers 404 to every caller and no host row
        changes (PAC-40 AC-5), even though its host rows are kept in storage.
        PAC-101: A link deleted while the request is handled: the write and the check that the link is not deleted are one atomic step ordered against the delete. If the delete commits first, the answer is the same 404 `{"error":"not found"}` as for a link deleted before the request arrived and no host row changes; if the write commits first it takes full effect and the delete then keeps the resulting host rows (PAC-40 D-2). A paused link does not block it. A write that must wait for a delete or edit of the same link still in progress waits at most 10 seconds; past that it is the 500 and nothing changes.
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `accepted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: accepted
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists); or the link was deleted
            (PAC-40), before the request or while it was handled and before the host
            row was written (PAC-101). Nothing is written. Body: `{"error":"not found"}`
            (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed, or the lock on the link was not obtained within 10 seconds
            (PAC-101); the host row is unchanged. Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/host-invites/{id}/decline:
    post:
      operationId: declineSchedulingLinkHostInvite
      tags: [scheduling-links]
      summary: Decline a co-host invitation.
      description: >-
        Same handler as accept, with status `declined`. `{id}` is the scheduling-link id.
        Same 404 rule as accept: zero rows updated is a 404 and nothing changes (PAC-30,
        API-020). Any existing host row matches, whatever its status. A paused link
        (`active=false`) keeps its host rows, so accept/decline on it match and return
        200 (PAC-30 D-5). A deleted link answers 404 and no host row changes (PAC-40
        AC-5). PAC-101: as for accept, a delete committed while the request is handled
        is a 404 with nothing changed, a decline committed first is kept, and the wait
        for a delete or edit in progress is at most 10 seconds (then the 500).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `declined`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: declined
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists); or the link was deleted
            (PAC-40), before the request or while it was handled and before the host
            row was written (PAC-101). Nothing is written. Body: `{"error":"not found"}`
            (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed, or the lock on the link was not obtained within 10 seconds
            (PAC-101); the host row is unchanged. Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}:
    parameters:
      - $ref: '#/components/parameters/SchedulingLinkIdPath'
    get:
      operationId: getSchedulingLink
      tags: [scheduling-links]
      summary: Fetch one scheduling link by id (owner or accepted co-host).
      description: >-
        Readable only by the link's owner and by co-hosts whose host row on the link
        is `accepted` (PAC-25, API-006), and only while the link is not deleted: a
        deleted link answers every caller, owner and accepted co-hosts included, the
        same `404 {"error":"not found"}` as an id that matches no link (PAC-40 AC-2,
        D-9); the owner reads it through `getArchivedSchedulingLink` instead. A paused
        link (`active=false`) is still returned to its owner and accepted co-hosts. That is the same set of callers who receive the
        link from `GET /api/scheduling-links`, so this read discloses nothing the list
        does not. Every other authenticated caller (no host row, a `pending` or
        `declined` invitation, a co-host who left or was removed) receives the same
        `404 {"error":"not found"}` as for an id that matches no link, with no part of
        the link in the body, so the answer does not reveal whether a link exists. A
        refused read is never `403` (PAC-25 D-1; contrast the owner-only siblings
        PATCH, DELETE, `/bookings` and `/hosts`, which still answer `403` and are out
        of scope). Check order: `400` malformed id; then the link lookup, which does not
        find a deleted link; then the caller's own host-status lookup on that link; then
        `404` for no link (never existed or deleted) or a caller who may not read it;
        then `200`. A storage error on either lookup answers `500`
        `{"error":"internal error"}`, never `404` (an outage is not reported as "not
        found") and never `200` (the reader check does not fail open). An allowed reader
        receives the full record including every host row (accepted, pending and
        declined) with each host's email, name and avatar; `is_owner` is computed
        against the caller and `my_status` is the caller's own host status. Building
        that record reads the roster (the link's host rows and each host's user record);
        a storage error on that read also answers `500` `{"error":"internal error"}`,
        never `200` with `hosts: []` or with a host's email missing (PAC-25 C-2). An
        accepted co-host therefore still sees pending and declined invitees' emails, as
        through the list (PAC-25 D-2).
      responses:
        '200':
          description: >-
            The link, with hosts. Returned only to the owner (`is_owner: true`) or an
            accepted co-host (`is_owner: false`, `my_status: accepted`), and only when
            the whole roster was read: `hosts` is never emptied and no host's email is
            dropped because a storage read failed. A failed roster read is `500`, not
            this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            Body exactly `{"error":"not found"}`. Returned when no link has that id,
            when the link was deleted (PAC-40: for every caller, owner and accepted
            co-hosts included), AND when the link exists but the caller is neither its
            owner nor an accepted co-host (never invited, invitation pending or declined,
            left or removed). The cases are indistinguishable by status and body (PAC-25
            D-1, PAC-40 D-9). A paused link (`active=false`) is NOT a 404 for its owner or
            accepted co-hosts: they still receive 200 (PAC-40 AC-11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              example:
                error: not found
        '500':
          description: >-
            Body: {"error":"internal error"}. A storage error on the link lookup, on the
            caller's host-status lookup, on the roster read (PAC-25 C-2), or on the
            read of the owner's settings needed for `time_zone` (PAC-72 revision
            3.1, never the UTC fallback).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    patch:
      operationId: updateSchedulingLink
      tags: [scheduling-links]
      summary: Partially update a scheduling link (owner only).
      description: >-
        Every field is optional; absent fields keep their stored value. The whole
        merged record is re-validated, so a patch can fail 422 on a field it did not
        touch. When `co_host_emails` is present (even `[]`) it sets the co-host list by
        difference (PAC-61): non-owner hosts whose email is not listed are removed,
        listed emails that are not yet hosts are added as `pending`, and listed hosts
        keep their status (accepted, pending or declined).

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): the two halves follow different rules. KEEP SET (revoking and
        keeping): an existing host is kept when its account's stored address equals a
        listed address case-insensitively, at ANY standing, so an accepted co-host stored
        as `Pat@Acme.com` is kept by a list containing `pat@acme.com` (before PAC-71 the
        lowercased lookup missed it and removed the host). NEW ENTRIES (granting): a
        listed address that matches no existing host is invited as `pending` only when
        exactly one account holds it DOMAIN-CONFIRMED; otherwise it is skipped, as an
        unknown address is today.

        PAC-40: for `duration_options` / `durations` and `days_of_week` / `days` the
        canonical spelling wins whenever it is carried (present and not null; `[]`
        counts as carried), exactly as on create (D-5, API-049; before PAC-40 the
        alias won on PATCH). The window aliases are unchanged (D-10, OQ-7). A deleted
        link answers `404 {"error":"not found"}` to every caller, owner included,
        before the owner check and before the body is read, and stays deleted whatever
        the body says, `active: true` included (AC-3, AC-6, AC-6a); nothing is written.


        PAC-101: the PATCH is all or nothing. The link's fields and, when
        `co_host_emails` is present, every co-host removal and invitation are
        written together: the answer is either 200 with all of them applied or
        an error with none of them applied. In particular a co-host lookup or
        write that fails is the 500 with the link's fields unchanged too (before
        PAC-101 a failed removal or invitation was a 200 with the fields changed
        and the co-host change silently dropped, and a failed co-host lookup was
        a 500 with the fields already changed). A link deleted while the PATCH is
        handled: if the delete commits first, the PATCH answers the 404 and
        changes nothing, co-hosts included; if the PATCH has started writing
        first, the delete waits for it, the PATCH answers 200, and the link is
        then deleted with the PATCH's fields and co-host list. No host row of the
        link changes after its delete commits. A refusal decided before the write
        (400, 403, 409, 422) keeps its answer even if the link was deleted
        meanwhile. A PATCH that must wait for a booking save, host write, delete
        or other edit of the same link waits at most 10 seconds for each lock it
        needs; past that it is the 500 and nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchedulingLinkRequest'
      responses:
        '200':
          description: Updated link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLink'
        '400':
          description: '"invalid id" or "invalid request body"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'The link is live or paused and the caller is not its owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: >-
            No link with that id, or the link was deleted (before the request, or
            while it was handled and before the PATCH wrote anything, PAC-101): the
            same answer for every caller, owner included, and nothing changes, co-hosts
            included (PAC-40 AC-3, AC-6, AC-6a). Body: {"error":"not found"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: 'New slug collides with another link, deleted links included (PAC-40 D-3). Body: {"error":"slug already exists"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          $ref: '#/components/responses/SchedulingLinkValidationError'
        '500':
          description: >-
            `error` is "internal error" (lookup or update failed, or the owner's
            settings, needed for `time_zone`, could not be read; PAC-72 revision 3.1,
            never the UTC fallback) or "slug check failed". The detail is written to
            the server log and Sentry only (PAC-21). PAC-101: also "internal error"
            when a co-host lookup, removal or invitation could not be stored, or when
            a lock on the link (or on an invitee's account) was not obtained within
            10 seconds. Every 500 from this operation leaves the link exactly as it
            was: neither its fields nor any host row changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    delete:
      operationId: deleteSchedulingLink
      tags: [scheduling-links]
      summary: Delete a scheduling link (owner only).
      description: >-
        Soft delete, distinct from pausing (PAC-40). The deletion instant is recorded;
        the link record, its bookings (booker names and emails included) and its host
        rows are kept (D-2), and its slug stays reserved (D-3). From then on the link
        exists for its owner only in the archive (`listArchivedSchedulingLinks`,
        `getArchivedSchedulingLink`) and nowhere else: it is absent from
        `listSchedulingLinks` and from the co-host invite list, and every other
        operation that names it by id, and every public operation that names it by
        slug (`/api/book/{slug}` and its slots), answers the same 404 as an id or slug
        that never existed, for every caller, owner included (D-4, D-9). Creating or
        patching another link to its slug is still a 409 "slug already exists" (D-3),
        so a signed-in user can learn that the slug was once used. There is no
        un-delete; PATCH `active: true` cannot bring it back. Its bookings still make
        their hosts busy. Deleting a link that is already deleted is a 404, not a 204.
        Pausing (PATCH `active: false`) is a different state and keeps the link
        visible. Links that were inactive before PAC-40 are paused, not deleted (D-1).


        Writes in progress (PAC-101): a booking save, a co-host invite, accept,
        decline or leave, or a PATCH of this link that has already started writing
        when the delete arrives is completed first and is kept (it happened before
        the delete); the delete waits for it, at most 10 seconds (past that, the
        500 and the link is not deleted). Every such write that reaches its save
        after the delete has committed writes nothing and answers its 404. So no
        booking and no host row of the link changes after the delete has committed.


        Erasure: once `booker_erasure.enabled` is true on this deployment (see
        `BookerErasurePolicy`), the bookers' names and emails of a deleted link are
        erased automatically 90 days after the link's last booking ends (owner
        decision 2026-10-27; spec §3.5). Deleting does not erase anything at the
        time. The answer stays an empty 204 (it carries neither the archive entry nor
        the erasure instant): the confirmation copy is built before the request from
        `ArchivedSchedulingLinkListResponse.booker_erasure`, and the instant is read
        from the archive afterwards (contracts/features/PAC-40.md §2.4).
      responses:
        '204':
          description: Deleted. Empty body.
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'The link is live or paused and the caller is not its owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: >-
            No link with that id, or the link was deleted: the same answer for every
            caller, owner included, and nothing changes (PAC-40 AC-3, AC-6, AC-6a).
            Body: {"error":"not found"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Lookup or delete failed, or the lock on the link was not obtained within
            10 seconds because a write of the link was still in progress (PAC-101); the
            link is not deleted. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/bookings:
    get:
      operationId: listSchedulingLinkBookings
      tags: [scheduling-links]
      summary: Bookings made on a link (owner only).
      description: >-
        Returns the raw `storage.Booking` rows, ordered by `start_time DESC`, never
        null, cancelled bookings included. NOTE the field names differ from the public
        booking confirmation DTO (`start_time`/`end_time` here vs `start`/`end` there).
        A deleted link answers 404 to every caller, owner included (PAC-40 AC-6,
        D-9); its owner reads its bookings through `getArchivedSchedulingLink`. A
        live or paused link never holds an erased booking (erasure applies only to
        deleted links), so `booker_name` and `booker_email` here are always the
        values the booker typed.
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Booking rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulingLinkBookingRecord'
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'The link is live or paused and the caller is not its owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: >-
            No link with that id, or the link was deleted: the same answer for every
            caller, owner included, and nothing changes (PAC-40 AC-3, AC-6, AC-6a).
            Body: {"error":"not found"}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: 'Body: {"error":"internal error"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/hosts:
    post:
      operationId: inviteSchedulingLinkHost
      tags: [scheduling-links]
      summary: Invite an existing user as a co-host (owner only).
      description: >-
        The invitee must already have an account; the email is lowercased and trimmed.
        A new invitee gets a `pending` row (201). Re-inviting someone who is already a
        host of the link changes nothing: their row is returned as is with 200, so an
        accepted or declined host keeps that status (PAC-61). Response is the raw
        `storage.LinkHost` row, not the host DTO used inside SchedulingLink.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): the invitee is resolved only to an account that holds the email
        DOMAIN-CONFIRMED (exactly one, compared case-insensitively). An address carried
        only unconfirmed, by several accounts, or by none answers the existing 404
        "user not found", with nothing written.

        PAC-40: a deleted link answers 404 "not found" to every caller, owner
        included, before the owner check and before the body is read, and no host row
        is written (AC-6, AC-6a).


        PAC-101: A link deleted while the request is handled: the write and the check that the link is not deleted are one atomic step ordered against the delete. If the delete commits first, the answer is the same 404 `{"error":"not found"}` as for a link deleted before the request arrived and no host row changes; if the write commits first it takes full effect and the delete then keeps the resulting host rows (PAC-40 D-2). A paused link does not block it. A write that must wait for a delete or edit of the same link still in progress waits at most 10 seconds; past that it is the 500 and nothing changes. A refusal decided before the write (400,
        403, the 404 "user not found") keeps its answer even if the link was
        deleted meanwhile; nothing is written either way.
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteSchedulingLinkHostRequest'
      responses:
        '200':
          description: Already a host of this link; their row, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkHostRecord'
        '201':
          description: New invitee; a `pending` host row was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkHostRecord'
        '400':
          description: '"invalid id", or "email is required" (also returned when the JSON body is malformed).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'The link is live or paused and the caller is not its owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: >-
            Two distinct bodies (API-072, Fixed by PAC-101): `{"error":"not found"}`
            (no such link, or the link was deleted, before the request or while it was
            handled and before the host row was written, PAC-101: the same answer for
            every caller, owner included, PAC-40 AC-6, AC-6a) or
            `{"error":"user not found"}` (the link is live or paused and owned by the
            caller, and no account holds that email domain-confirmed; PAC-71). Nothing
            is written in either case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              examples:
                linkNotFound:
                  summary: No such link, or it was deleted
                  value:
                    error: not found
                userNotFound:
                  summary: No account holds the email domain-confirmed
                  value:
                    error: user not found
        '500':
          description: >-
            Lookup or invite failed, or the lock on the link was not obtained within
            10 seconds (PAC-101); no host row was written. Body:
            `{"error":"internal error"}`. The detail is written to the server log and
            Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/accept:
    post:
      operationId: acceptSchedulingLinkInviteByLink
      tags: [scheduling-links]
      summary: Accept a co-host invitation, addressed by link id.
      description: >-
        routes.go:166 binds the SAME `slh.acceptInvite` handler already bound at
        `/host-invites/{id}/accept` (routes.go:159). Because both handlers key on the
        link id, the two paths are exactly equivalent -- this is a second spelling of
        the same operation, not a different resource. The frontend only uses the
        `/host-invites/...` form. Same 404 rule: a caller with no host row on the link
        gets 404 and nothing changes (PAC-30, API-020). The duplicate spelling itself
        (API-069) is not resolved by PAC-30. A paused link (`active=false`) keeps its
        host rows, so accept/decline on it match and return 200 (PAC-30 D-5). A deleted
        link answers 404 and no host row changes (PAC-40 AC-5). PAC-101: A link deleted while the request is handled: the write and the check that the link is not deleted are one atomic step ordered against the delete. If the delete commits first, the answer is the same 404 `{"error":"not found"}` as for a link deleted before the request arrived and no host row changes; if the write commits first it takes full effect and the delete then keeps the resulting host rows (PAC-40 D-2). A paused link does not block it. A write that must wait for a delete or edit of the same link still in progress waits at most 10 seconds; past that it is the 500 and nothing changes.
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `accepted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: accepted
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists); or the link was deleted
            (PAC-40), before the request or while it was handled and before the host
            row was written (PAC-101). Nothing is written. Body: `{"error":"not found"}`
            (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed, or the lock on the link was not obtained within 10 seconds
            (PAC-101); the host row is unchanged. Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/decline:
    post:
      operationId: declineSchedulingLinkInviteByLink
      tags: [scheduling-links]
      summary: Decline a co-host invitation, addressed by link id.
      description: >-
        Equivalent to POST /api/scheduling-links/host-invites/{id}/decline (same handler,
        same key, same PAC-30 404 when the caller has no host row on the link). A paused
        link (`active=false`) keeps its host rows, so accept/decline on it match and
        return 200 (PAC-30 D-5). A deleted link answers 404 and no host row changes
        (PAC-40 AC-5). PAC-101: as for accept, a delete committed while the request is
        handled is a 404 with nothing changed, a decline committed first is kept, and
        the wait for a delete or edit in progress is at most 10 seconds (then the 500).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `declined`.
          content:
            application/json:
