                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/hosts:
    post:
      operationId: inviteSchedulingLinkHost
      tags: [scheduling-links]
      summary: Invite an existing user as a co-host (owner only).
      description: >-
        The invitee must already have an account; the email is lowercased and trimmed.
        A new invitee gets a `pending` row (201). Re-inviting someone who is already a
        host of the link changes nothing: their row is returned as is with 200, so an
        accepted or declined host keeps that status (PAC-61). Response is the raw
        `storage.LinkHost` row, not the host DTO used inside SchedulingLink.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): the invitee is resolved only to an account that holds the email
        DOMAIN-CONFIRMED (exactly one, compared case-insensitively). An address carried
        only unconfirmed, by several accounts, or by none answers the existing 404
        "user not found", with nothing written.
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteSchedulingLinkHostRequest'
      responses:
        '200':
          description: Already a host of this link; their row, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkHostRecord'
        '201':
          description: New invitee; a `pending` host row was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkHostRecord'
        '400':
          description: '"invalid id", or "email is required" (also returned when the JSON body is malformed).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          description: 'Caller is not the owner. Body: {"error":"forbidden"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: '"not found" (no such link) or "user not found" (no account holds that email domain-confirmed; PAC-71).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Lookup or invite failed. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/accept:
    post:
      operationId: acceptSchedulingLinkInviteByLink
      tags: [scheduling-links]
      summary: Accept a co-host invitation, addressed by link id.
      description: >-
        routes.go:166 binds the SAME `slh.acceptInvite` handler already bound at
        `/host-invites/{id}/accept` (routes.go:159). Because both handlers key on the
        link id, the two paths are exactly equivalent -- this is a second spelling of
        the same operation, not a different resource. The frontend only uses the
        `/host-invites/...` form. Same 404 rule: a caller with no host row on the link
        gets 404 and nothing changes (PAC-30, API-020). The duplicate spelling itself
        (API-069) is not resolved by PAC-30. A deactivated link (`active=false`, see
        `deleteSchedulingLink`) keeps its host rows, so accept/decline on it match and
        return 200 (PAC-30 D-5).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `accepted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: accepted
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists). Nothing is written.
            Body: `{"error":"not found"}` (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/decline:
    post:
      operationId: declineSchedulingLinkInviteByLink
      tags: [scheduling-links]
      summary: Decline a co-host invitation, addressed by link id.
      description: >-
        Equivalent to POST /api/scheduling-links/host-invites/{id}/decline (same handler,
        same key, same PAC-30 404 when the caller has no host row on the link). A
        deactivated link (`active=false`, see `deleteSchedulingLink`) keeps its host rows,
        so accept/decline on it match and return 200 (PAC-30 D-5).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '200':
          description: Host status set to `declined`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingLinkInviteResponse'
              example:
                status: declined
        '400':
          description: '`{id}` is not a UUID. Body: {"error":"invalid id"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            The caller has no host row on this link: never invited, already left or
            removed, or no link has that id (the two are not distinguished, so the
            answer does not reveal whether a link exists). Nothing is written.
            Body: `{"error":"not found"}` (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Update failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/scheduling-links/{id}/leave:
    post:
      operationId: leaveSchedulingLink
      tags: [scheduling-links]
      summary: Remove the caller from a link's host list.
      description: >-
        Deletes the caller's `scheduling_link_hosts` row, whatever its status (pending,
        accepted or declined). Checked in this order: `{id}` not a UUID -> 400 "invalid
        id"; no link with that id -> 404; caller is the owner -> 400 "owner cannot leave
        link"; the DELETE removes zero rows (the caller has no host row on the link) ->
        404 and nothing changes (PAC-30, API-020; before PAC-30 a non-host got 204).
      parameters:
        - $ref: '#/components/parameters/SchedulingLinkIdPath'
      responses:
        '204':
          description: The caller's host row was deleted. Empty body.
        '400':
          description: '"invalid id" or "owner cannot leave link"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '404':
          description: >-
            No link with that id, or the caller (not the owner) has no host row on it.
            Both are `{"error":"not found"}`; in the second case nothing is deleted
            (PAC-30, API-020).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Lookup or leave failed. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  # ---------------------------------------------------------------------------
  # PROTECTED conferencing (routes.go:123-128)
  # ---------------------------------------------------------------------------

  /api/conference/create:
    post:
      operationId: createConferenceLink
      tags: [conferencing]
      summary: Create a standalone conference meeting with the configured provider.
      description: >-
        Provider comes from the CALLER'S stored settings (`ConferencingProvider`),
        not from the request; the Teams credential is the caller's own (PAC-24;
        before it, both came from the single shared settings row).


        Since PAC-67 (finding API-052, resolved here under factory section 7.1)
        the body is validated before any credential is read or any provider is
        called: `title` must be present and contain at least one character that
        is not whitespace, `start` and `end` must be present RFC 3339 date-times,
        and `end` must be after `start`. Anything else is the 400 "invalid body".
        "Whitespace" is exactly the set ECMA-262 `\s` matches (WhiteSpace and
        LineTerminator), so the server's test and the schema's `pattern: '\S'`
        on `CreateConferenceRequest.title` accept and refuse the same titles
        (contract challenge finding 1). Neither Go's `strings.TrimSpace`
        (`unicode.IsSpace`: adds U+0085, lacks U+FEFF) nor Go's `regexp` `\S`
        (ASCII only) is that set, so the server cannot use either as is. A
        `start` or `end` equal to `0001-01-01T00:00:00Z` cannot be told apart from
        an absent one and is refused as absent. Before PAC-67 a missing field
        decoded to the Go zero value and was forwarded to the provider (a blank
        title and the year 1).


        Since PAC-67 (spec AC-3 to AC-5, AC-7 to AC-12) the Teams and Zoom
        credentials are renewed when the stored access token has expired, using
        the caller's own refresh token, and the renewed credential is stored for
        the caller only (a rotated refresh token replaces the stored one). A
        token that has not expired is used as is, with no renewal request. When
        the provider PERMANENTLY refuses the renewal (OAuth `invalid_grant` or
        equivalent) the request fails with the 400 "connection lost" sentence for
        that provider, the loss is recorded for the caller (the matching row of
        `listConferenceProviders` reports not connected, and the caller's activity
        log gets ONE `connection_lost` entry per loss however many requests hit
        it, written best-effort: see CONNECTION ENTRIES on `listAuditEntries`),
        and the stored credential is kept (spec D-1). A TEMPORARY renewal
        failure (timeout, network, provider 5xx) is the 500 below: it never says
        reconnect and records nothing (AC-10).


        A Teams or Zoom credential whose access token has expired and that holds
        NO refresh token cannot be renewed: no renewal request is sent and the
        request fails with the same 400 "connection lost" sentence for that
        provider. Nothing is recorded and no activity entry is written, because
        such a credential is never reported connected (see
        `ConferenceProviderStatus.connected`), so there is no loss to start. A
        Zoom credential whose expiry is not stored (one stored before PAC-67) is
        treated as expired, so it is renewed before it is used.


        API-091 (no frontend consumer) is resolved for this operation by keeping
        it: it is the standalone meeting-creation path spec PAC-67 AC-3, AC-5 and
        AC-8 test through, so those Go contract tests are its second opinion.
        Still not referenced anywhere in the frontend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConferenceRequest'
      responses:
        '200':
          description: Meeting created. Note the camelCase keys, unlike every other schema in this domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConferenceMeetingDetails'
        '400':
          description: >-
            One of these fixed messages (PAC-21: no Go error text is appended). The
            dash in the three provider sentences is U+2014 EM DASH, exactly as the
            server writes it today; the new stored-credential sentence uses the same
            character on purpose, so the three read alike:
            "invalid body" (the body is not JSON, or, since PAC-67, fails the
            validation in the operation description: API-052); since PAC-71
            "teams: not connected — connect Outlook in Settings (POST
            /api/auth/microsoft/connect)" (before PAC-71 it pointed at the
            sign-in start /api/auth/microsoft, which since PAC-71 is a sign-in
            and never connects for a signed-in user; also returned when reading the stored Microsoft token
            fails, not only when there is none: the server does not separate the two
            on this path; see the PAC-21 contract's doesNotResolve); "zoom: not
            connected — visit /api/auth/zoom to authenticate"; "zoom: stored
            credential is invalid — reconnect at /api/auth/zoom" (the stored Zoom
            token does not decode; before PAC-21 was finished this was
            "zoom: invalid token: " plus the JSON decoder's error); NEW in PAC-67,
            "teams: connection lost — reconnect Outlook in Settings (POST
            /api/auth/microsoft/connect)" (since PAC-71; before, "reconnect at
            /api/auth/microsoft") and "zoom: connection lost — reconnect at
            /api/auth/zoom" (the provider permanently refused the renewal of the
            caller's credential, on this request or on an
            earlier one whose loss is still recorded; spec AC-8 "fails with an error
            telling A to reconnect"; also the answer when the access token has
            expired and no refresh token is stored, which records nothing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: >-
            Settings load or meeting creation failed, or (since PAC-67) renewing the
            Teams or Zoom credential failed TEMPORARILY (timeout, network, provider
            5xx; spec AC-10): nothing is recorded and the credential is still reported
            connected. Body: `{"error":"internal error"}`, which never tells the caller
            to reconnect. The detail is written to the server log and Sentry only
            (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/conference/providers:
    get:
      operationId: listConferenceProviders
      tags: [conferencing]
      summary: Conferencing providers this server can offer, and their connection state.
      description: >-
        Order is fixed: google_meet (only when Google OAuth env is configured), zoom
        (only when Zoom env is configured), teams (only when Microsoft env is
        configured), then `custom`, which is always last and always `connected: true`.
        Connection state and the Meet email describe the CALLER'S own settings and
        credentials (PAC-24).
        Length is therefore 1..4.


        Since PAC-67 `connected` means USABLE, not merely stored (spec PAC-67 §3,
        AC-8, AC-12 to AC-14, AC-21, AC-23): a credential whose renewal the provider
        permanently refused is kept (spec D-1) but reported `connected: false`
        until the caller reconnects that provider; a temporary failure never
        changes it. The exact predicate of each row is on
        `ConferenceProviderStatus.connected`: a credential that can never be
        renewed (no refresh token) is not usable either and reads
        `connected: false`. This holds for every row whatever the caller's calendar
        provider: the `teams` row reports a lost Outlook credential even when the
        calendar provider is Google, and the `google_meet` row a lost Google
        credential even when it is Outlook (AC-21). A loss recorded while the
        credential was used for someone else (team availability, a public booking
        page, a scheduled job) changes the OWNER's rows only, never the
        requester's (spec D-12).


        API-070 (resolved here under factory section 7.1, contract side): the
        variable length and the always-connected `custom` row were already
        documented above and are confirmed against `providers` in
        backend/api/handlers_conferencing.go; they are intended, not defects. What
        remains of the finding is a test that indexes the array by position and so
        passes only on a fully configured server; the PAC-67 backend stage looks
        rows up by `provider` instead (contracts/features/PAC-67.yaml
        resolvesFindings).
      responses:
        '200':
          description: Provider statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConferenceProviderStatus'
                minItems: 1
                maxItems: 4
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: >-
            Settings load failed. Body: `{"error":"internal error"}`. The detail is written
            to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/conference/zoom/disconnect:
    post:
      operationId: disconnectZoom
      tags: [conferencing]
      summary: Disconnect the caller's Zoom credential and ask Zoom to revoke it.
      description: >-
        Takes no request body. Acts on the CALLER only; other users' credentials,
        settings and activity logs are untouched. Before PAC-24 the tokens were
        server-wide.


        Since PAC-67 (spec AC-14 to AC-16, D-2, D-9), in this order:
        (1) LOCAL REMOVAL, one atomic change: the caller's stored Zoom credential is
        read into memory and then removed whether or not it decodes, any recorded
        loss of it is cleared, and the caller's conferencing provider becomes
        `meet` unconditionally (spec D-9, unchanged from before PAC-67). A failure
        up to and including this step is the 500 below, and then nothing has
        changed.
        (2) RENEWAL FOR REVOCATION, only when needed: when the removed access token
        is empty, has expired, or has no stored expiry (a credential stored before
        PAC-67), and a refresh token was stored, the server first renews it at
        Zoom's token endpoint with the removed refresh token, as a meeting creation
        would. The renewed access and refresh tokens are held in memory for this
        request only and are NEVER stored: the credential stays removed. When that
        renewal fails, refused permanently or temporarily, or when it is needed
        and no refresh token was stored, nothing is sent to the revocation
        endpoint and the answer is `revocation: unconfirmed`. That is not a loss:
        nothing is recorded and no `connection_lost` entry is written (the
        credential no longer exists). A disconnect while a loss is recorded is
        this case, since the refresh token was already refused.
        (3) REVOCATION: the unexpired or just-renewed access token is sent to Zoom's
        token revocation endpoint (`POST https://zoom.us/oauth/revoke`, client
        credentials in Basic auth, `token` = the access token). The answer is
        `revocation: confirmed` when Zoom answers success, and
        `revocation: unconfirmed` when Zoom refuses, answers an error, or cannot
        be reached. A stored credential that does not decode (non-blank
        `zoom_tokens` that is not valid JSON, the state behind the "zoom: stored
        credential is invalid" 400 of `createConferenceLink`) cannot be revoked at
        all: steps 2 and 3 send nothing and the answer is
        `revocation: unconfirmed`. The local removal stands in every case (spec
        D-2). No `connection_lost` entry is ever written by a disconnect.
        (4) ACTIVITY ENTRIES for the caller, written after the outcome is known:
        `confirmed` writes one `provider_disconnected` entry (details
        `{"provider":"zoom","revocation":"confirmed"}`); `unconfirmed`, including
        the undecodable and failed-renewal cases, writes two, one
        `provider_disconnected` (details
        `{"provider":"zoom","revocation":"unconfirmed"}`) and one
        `revocation_unconfirmed` (details `{"provider":"zoom"}`) (spec AC-15,
        AC-16; round-5 challenge NB-2). These writes are BEST-EFFORT, like every
        kind in the activity log (`storage.WriteAuditLog`): a failed insert is
        written to the server log and does not change the response, because the
        credential is already removed and the 200 is the only truthful answer.
        Such a disconnect has fewer entries than listed, possibly none; the 200
        body is then the only record the user gets of the outcome.
        A caller with no stored Zoom credential (blank `zoom_tokens`) gets 200 with
        `revocation: nothing_stored`: the conferencing provider still becomes
        `meet`, nothing is sent to Zoom and no activity entry is written.


        Before PAC-67 this answered 204 with no body and sent nothing to Zoom. The
        only consumer (smart-calendar-flow `zoomDisconnect`, typed `void`) resolves
        a 200 JSON body as it did the 204 and ignores it, so it keeps working; it
        owes the "revocation could not be confirmed" message (spec section 5).
      responses:
        '200':
          description: >-
            The Zoom credential is gone locally (or there was none); `revocation` says
            what Zoom answered. Never a failure status because of revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDisconnectResult'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '500':
          description: >-
            Reading the caller's stored Zoom credential, or the local removal (step 1),
            failed. NOTHING was changed locally, nothing was sent to Zoom and no activity
            entry was written, so a retry is safe. Nothing that fails after step 1 is a
            500: renewal and revocation failures are `revocation: unconfirmed`, and a
            failed activity-entry write is logged only. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

  /api/events/{id}/conference:
    parameters:
      - name: id
        in: path
        required: true
        description: Provider calendar event id (an opaque Google Calendar event id string, not a UUID - it is never parsed).
        schema:
          type: string
    post:
      operationId: addEventConference
      tags: [conferencing]
      summary: Attach a conference link to an existing calendar event.
      description: >-
        Uses the CALLER'S stored settings and credentials (PAC-24). Four branches.
        (1) The event already has a conference: returns 200 with the
        EXISTING link when the stored provider matches, or when `provider` is
        `custom`; otherwise 409. (2) `custom`: stores the supplied `url` in the event's
        private extended properties. (3) `google_meet`: asks Google to mint a Meet link.
        (4) anything else (`zoom`, `teams`): creates a meeting through the provider
        factory and stores the join URL in extended properties.


        Since PAC-67 (spec AC-3, AC-8, AC-10, AC-12, AC-23, D-10) every credential
        this operation uses is renewed when expired and the renewal is stored for
        the caller. The event is read with the caller's GOOGLE credential before
        the Teams or Zoom credential is touched. When Google permanently refuses
        that renewal the answer is the existing 404 "event not found" (unchanged,
        spec D-7, D-10), the Google loss is recorded for the caller (the
        `google_meet` row and, for a Google calendar provider, `getAuthStatus`
        report not connected; one `connection_lost` entry naming `google`), and the
        Teams or Zoom credential is neither read, renewed nor reported. When the
        Teams or Zoom renewal is permanently refused the answer is the 400
        "connection lost" sentence for that provider and that loss is recorded
        likewise. A temporary renewal failure records nothing: Google's gives the
        404 as today, Teams' or Zoom's gives the 502 "upstream provider error". A
        Teams or Zoom credential whose access token has expired and that holds no
        refresh token gets the same 400 "connection lost" sentence with no
        renewal request, and records nothing (as on `createConferenceLink`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEventConferenceRequest'
      responses:
        '200':
          description: >-
            Conference attached, or the pre-existing conference echoed back. `label` is
            the stored provider string on the echo branch, "Custom link" for custom,
            "Google Meet" for google_meet, and the uppercased provider name otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventConferenceLink'
        '400':
          description: >-
            One of these fixed messages (PAC-21: no Go error text is appended):
            The dash in the three provider sentences is U+2014 EM DASH, exactly as
            the server writes it.
            "invalid body"; "provider is required"; "url is required for custom
            conferences"; "event has no time" (the existing literal, kept: the event
            has no start or end, or, new in PAC-21, Google's value does not parse;
            before PAC-21 was finished a parse failure returned Go's time.Parse error
            text); 'unsupported conference provider "<provider>"' (echoes the
            request's own `provider`); "teams: not connected — connect Outlook in
            Settings (POST /api/auth/microsoft/connect)" (PAC-71 wording; also returned when reading the
            stored Microsoft token fails); "zoom: not connected — visit
            /api/auth/zoom to authenticate"; "zoom: stored credential is invalid —
            reconnect at /api/auth/zoom"; NEW in PAC-67, "teams: connection lost —
            reconnect Outlook in Settings (POST /api/auth/microsoft/connect)" (PAC-71
            wording) and "zoom: connection lost — reconnect at /api/auth/zoom" (the provider permanently refused the renewal of the
            caller's Teams or Zoom credential, or its access token has expired and no
            refresh token is stored; see the operation description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '404':
          description: >-
            Body: `{"error":"event not found"}` (fixed text; the Google error is not
            appended, PAC-21). Any GetEvent failure maps to 404, including, since
            PAC-67, a permanently refused or temporarily failing renewal of the
            caller's Google credential (spec D-10: unchanged on purpose; the loss is
            reported on Google's status surfaces and in the activity log instead).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: 'Event already has a conference from a different provider. Body: {"error":"event already has a conference"}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Google Meet creation, settings load, or the event update failed, or the
            stored credential could not be read. Body:
            `{"error":"internal error"}`. The detail is written to the server log and Sentry
            only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '502':
          description: >-
            Upstream provider problem. `error` is one of "Google Meet creation is still
            pending", "upstream provider error" (the provider's create-meeting call
            failed, or, since PAC-67, renewing the Teams or Zoom credential failed
            temporarily; spec AC-10) or "conference provider returned no join URL". The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
    delete:
      operationId: removeEventConference
      tags: [conferencing]
      summary: Remove any conference from a calendar event.
      description: >-
        Clears a Google Meet if present and strips the `paceday_conference_provider` /
        `paceday_conference_url` private extended properties. Idempotent: an event with
        no conference also returns 204 without writing anything.
      responses:
        '204':
          description: Conference removed (or there was none). Empty body.
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '404':
          description: >-
            Body: `{"error":"event not found"}` (fixed text; the Google error is not
            appended, PAC-21). Any GetEvent failure maps to 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '500':
          description: >-
            Removing the Google Meet or the conference properties failed, or the stored
            credential could not be read. Body:
            `{"error":"internal error"}`. The detail is written to the server log and Sentry
            only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'

components:

  parameters:
    SchedulingLinkIdPath:
      name: id
      in: path
      required: true
      description: Scheduling-link UUID. Parsed with uuid.Parse; a non-UUID value yields 400 "invalid id".
      schema:
        type: string
        format: uuid

  responses:
    BookingCreateRateLimited:
      description: >-
        The client has already made 20 requests to `createPublicBooking` in its
        current 10-minute window (NEW-booking-rate-limit). Nothing was looked up
        or written. Body: `{"error":"rate limit exceeded"}`, Content-Type
        application/json, the same envelope and message as the detect limiter's
        429. `Retry-After` is the whole number of seconds until the client's
        window ends, rounded up, never less than 1 and never more than 600. The
        header is not listed in `Access-Control-Expose-Headers`, so a page on
        another origin cannot read it; the web booking page does not need it.
      headers:
        Retry-After:
          required: true
          description: >-
            Delay-seconds form of RFC 9110 section 10.2.3 (never the HTTP-date
            form): seconds remaining in the client's booking window, rounded up.
          schema:
            type: integer
            minimum: 1
            maximum: 600
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingRateLimitError'

    BookingSlotsRateLimited:
      description: >-
        The client has already made 120 requests to `getPublicBookingSlots` in its
        current 1-minute window (NEW-booking-rate-limit). Nothing was looked up.
        Body: `{"error":"rate limit exceeded"}`, Content-Type application/json.
        `Retry-After` is the whole number of seconds until the client's window
        ends, rounded up, never less than 1 and never more than 60. Not exposed
        to cross-origin pages, as for `BookingCreateRateLimited`.
      headers:
        Retry-After:
          required: true
          description: >-
            Delay-seconds form of RFC 9110 section 10.2.3 (never the HTTP-date
            form): seconds remaining in the client's slot-listing window, rounded
            up.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingRateLimitError'

    BookingUnauthorized:
      description: >-
        Emitted by the requireAuth middleware when the `auth_token` cookie and the
        `Authorization: Bearer` header are both absent or invalid, or (PAC-71) when the
        session's `gen` is not the account's current session generation (also by the
        in-request re-check on account data, with the same bytes). The body is the JSON
        text `{"error":"unauthorized"}` but the response is sent with `http.Error`, so
        the Content-Type header is `text/plain; charset=utf-8`, not application/json.
      content:
        text/plain:
          schema:
            type: string
            const: "{\"error\":\"unauthorized\"}\n"

    SchedulingLinkValidationError:
      description: >-
        Validation failure from validateSchedulingLink / parseClock. Messages:
        "title is required"; "at least one duration is required"; "durations must be
        positive integers"; "at least one day is required"; "days_of_week must contain
        values between 0 and 6"; "window times must use HH:MM"; "window_start must be
        before window_end"; "buffers must be zero or positive"; "min_notice_minutes
        must be zero or positive"; "usage_type must be reusable, recurring, or
        single_use"; "max_uses must be set to a positive integer for recurring links";
        "slug cannot be empty" (PATCH only).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingError'

  schemas:

    BookingError:
      type: object
      description: >-
        Shared error envelope written by api.writeError (handlers_settings.go:388):
        Content-Type application/json, body `{"error": "<message>"}`. The one
        exception in this domain is the requireAuth 401 (text/plain). Every 5xx,
        including the Zoom OAuth callback's, is this envelope (PAC-21).
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: >-
            Human-readable, server-chosen message. Never the text of a Go, driver or
            provider error (PAC-21): those go to the server log and Sentry only.

    BookingRateLimitError:
      type: object
      description: >-
        The `BookingError` envelope with its one possible message pinned, so a
        client can tell a rate-limit refusal from every other error by status
        and body alone (NEW-booking-rate-limit). Written by api.writeError.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: ['rate limit exceeded']

    # ---- Public booking ------------------------------------------------------

    PublicHost:
      type: object
      description: A host shown on the public booking page. Only accepted hosts appear.
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          description: Omitted when the user record has no name (json `name,omitempty`).
        avatar_url:
          type: string
          description: Omitted when empty (json `avatar_url,omitempty`).

    PublicLinkCoverage:
      type: object
      description: >-
        How many accepted hosts had a STORED Google calendar token when the page was
        rendered. `total` counts accepted hosts whose user record resolved;
        `checked` counts those among them for whom a Google token row loads,
        whether or not that token still works. Nothing is renewed or tested to
        compute it. A host whose Google credential is dead, including one whose
        loss Paceday has recorded (PAC-67), still counts as checked, while the
        slots are computed without that host's calendar; a host with no Google
        token row at all (for example one on Outlook) is not counted as checked.
        This is deliberate: counting only usable tokens would tell every visitor
        with the link that a host's connection is dead (spec PAC-67 D-14, AC-28).
        Before PAC-67 this description said "a usable OAuth token", which was not
        what the server counted (factory section 7.2). Always present, even as {0,0}.
      required: [total, checked]
      additionalProperties: false
      properties:
        total:
          type: integer
        checked:
          type: integer

    PublicLinkInfo:
      type: object
      description: backend/api/handlers_booking.go publicLinkDTO.
      required: [slug, title, durations, hosts, min_notice_minutes, usage_type, coverage]
      additionalProperties: false
      properties:
        slug:
          type: string
        title:
          type: string
        durations:
          type: array
          description: Allowed meeting lengths in minutes, straight from the link's duration_options column.
          items:
            type: integer
        hosts:
          type: array
          description: Accepted hosts only. Always an array, never null.
          items:
            $ref: '#/components/schemas/PublicHost'
        min_notice_minutes:
          type: integer
        usage_type:
          type: string
          description: Defaults to `reusable` when the stored value is empty.
          enum: [reusable, recurring, single_use]
        coverage:
          $ref: '#/components/schemas/PublicLinkCoverage'

    PublicBookingSlot:
      type: object
      description: engine.AvailableSlot. Times are Go time.Time marshalled as RFC3339 with nanoseconds.
      required: [start, end]
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    PublicSlotsResponse:
      type: object
      description: >-
        Both keys are always present. Exactly one is populated depending on whether the
        `date` query parameter was supplied.
      required: [slots, available_dates]
      additionalProperties: false
      properties:
        slots:
          type: array
          description: Populated only when `date` was given; otherwise the empty array.
          items:
            $ref: '#/components/schemas/PublicBookingSlot'
        available_dates:
          type: array
          description: >-
            Populated only when `date` was omitted; YYYY-MM-DD strings for days within
            the next 60 that have at least one bookable slot. Otherwise the empty array.
          items:
            type: string
            format: date

    CreatePublicBookingRequest:
      type: object
      description: >-
        Anonymous request body of POST /api/book/{slug}. `name`, `email` and `start`
        are required by the handler; `end`, `duration` and `duration_minutes` are three
        overlapping ways to express the length.
      required: [name, email, start]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Trimmed; must be non-empty after trimming.
          minLength: 1
        email:
          type: string
          description: Trimmed; must be non-empty after trimming. Never validated as an email address.
          minLength: 1
        start:
          type: string
          format: date-time
          description: RFC3339. Must be at least `min_notice_minutes` in the future, else 422.
        end:
          type: string
          format: date-time
          description: >-
            RFC3339, optional. When present it wins: the resulting length must equal
            `duration`/`duration_minutes` if either was also sent, else 400. When
            absent, end = start + resolved duration.
        notes:
          type: string
          description: Free text; no length limit enforced.
        duration:
          type: integer
          nullable: true
          description: >-
            Minutes. Takes precedence over `duration_minutes` when both are sent. This
            is the field the frontend actually populates.
        duration_minutes:
          type: integer
          nullable: true
          description: >-
            Minutes. Overridden by `duration` when both are present. When neither is
            sent and `end` is absent, the length falls back to durations[0] (else 30).
            The resolved value must be in the link's duration set, else 400.

    PublicBookingConfirmation:
      type: object
      description: >-
        backend/api/handlers_booking.go bookingConfirmationDTO, returned by
        POST /api/book/{slug} with 201.
      required: [id, link_slug, title, start, end, duration_minutes, hosts, booker_name, booker_email]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        link_slug:
          type: string
        title:
          type: string
          description: The link's title, not a per-booking title.
        start:
          type: string
          format: date-time
          description: UTC, formatted with time.RFC3339 (second precision, always a `Z` offset).
        end:
          type: string
          format: date-time
          description: UTC, formatted with time.RFC3339.
        duration_minutes:
          type: integer
          description: Computed as end-start, truncated to whole minutes.
        hosts:
          type: array
          description: Accepted hosts. Always an array, never null.
          items:
            $ref: '#/components/schemas/PublicHost'
        booker_name:
          type: string
        booker_email:
          type: string
        notes:
          type: string
          description: Omitted when empty (json `notes,omitempty`).

    # ---- Scheduling links ----------------------------------------------------

    SchedulingLinkHost:
      type: object
      description: >-
        backend/api/handlers_scheduling_links.go schedulingHostDTO - the host shape
        embedded in SchedulingLink. Distinct from SchedulingLinkHostRecord, which is
        the raw DB row returned by POST /{id}/hosts.
      required: [user_id, email, is_owner, status]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
          description: >-
            Declared `user_id,omitempty` but always populated from a uuid.UUID, so in
            practice always present.
        email:
          type: string
          format: email
          description: Empty string when the user record could not be loaded.
        name:
          type: string
          description: Omitted when empty.
        avatar_url:
          type: string
          description: Omitted when empty.
        is_owner:
          type: boolean
        status:
          type: string
          enum: [pending, accepted, declined]
          description: Not constrained by the DB layer; these are the only three values the handlers write.

    SchedulingLink:
      type: object
      description: >-
        backend/api/handlers_scheduling_links.go schedulingLinkDTO. Note the DTO field
        names deliberately differ from the storage json tags (`durations` vs
        `duration_options`, `days` vs `days_of_week`, `owner_id` vs `owner_user_id`,
        `window_start` vs `window_start_time`).
      required:
        [id, owner_id, title, slug, durations, days, window_start, window_end,
         buffer_before, buffer_after, min_notice_minutes, usage_type, uses_count,
         active, hosts, created_at, is_owner]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
          description: Lowercase alphanumerics separated by single dashes (normalizeSlug).
        durations:
          type: array
          items:
            type: integer
        days:
          type: array
          description: Weekday abbreviations mapped from the stored 0-6 integers, Sunday = "sun".
          items:
            type: string
            enum: [sun, mon, tue, wed, thu, fri, sat]
        window_start:
          type: string
          description: >-
            Read back from the Postgres TIME column, so it comes out as "HH:MM:SS"
            even though the handler normalises the input to "HH:MM" before writing
            (confirmed by handlers_scheduling_links_test.go:91 expecting "10:00:00").
          example: '09:00:00'
        window_end:
          type: string
          example: '17:00:00'
        buffer_before:
          type: integer
          minimum: 0
        buffer_after:
          type: integer
          minimum: 0
        min_notice_minutes:
          type: integer
          minimum: 0
        usage_type:
          type: string
          enum: [reusable, recurring, single_use]
        max_uses:
          type: integer
          description: >-
            Present only for `recurring` links. Forced to null (and therefore omitted,
            json `max_uses,omitempty`) for reusable and single_use.
        uses_count:
          type: integer
          description: Count of non-cancelled bookings, computed by subquery at read time.
        active:
          type: boolean
        hosts:
          type: array
          description: Every host regardless of status, ordered by invited_at. Always an array, never null.
          items:
            $ref: '#/components/schemas/SchedulingLinkHost'
        created_at:
          type: string
          format: date-time
          description: UTC, Go layout "2006-01-02T15:04:05.000Z07:00" (millisecond precision).
          example: '2026-08-12T10:00:00.000Z'
        is_owner:
          type: boolean
          description: True when owner_id equals the authenticated caller.
        my_status:
          type: string
          enum: [pending, accepted, declined]
          description: >-
            The caller's own host status. Omitted (json `my_status,omitempty`) when the
            caller is not among the link's hosts.

    SchedulingLinkListResponse:
      type: object
      description: GET /api/scheduling-links. Both arrays are always present, never null.
      required: [owned, shared]
      additionalProperties: false
      properties:
        owned:
          type: array
          items:
            $ref: '#/components/schemas/SchedulingLink'
        shared:
          type: array
          description: Links where the caller is an accepted co-host but not the owner.
          items:
            $ref: '#/components/schemas/SchedulingLink'

    CreateSchedulingLinkRequest:
      type: object
      description: >-
        backend/api/handlers_scheduling_links.go schedulingLinkInput. Several fields
        have two accepted spellings; the canonical one wins when both are sent.
        Nothing is required at the JSON level, but validation rejects an empty title.
      additionalProperties: false
      properties:
        title:
          type: string
          description: Trimmed. Required in effect - an empty title is a 422.
        slug:
          type: string
          description: >-
            Normalised to lowercase alphanumerics and dashes. When it normalises to
            the empty string a slug is generated from the owner's name plus the first
            duration.
        duration_options:
          type: array
          description: Canonical spelling. Wins over `durations`. Defaults to [30] when both are absent (a present-but-empty array is a 422).
          items:
            type: integer
            minimum: 1
        durations:
          type: array
          description: Alias for duration_options, used only when duration_options is absent.
          items:
            type: integer
            minimum: 1
        days_of_week:
          type: array
          description: Canonical spelling, 0=Sunday..6=Saturday. Wins over `days`. Defaults to [1,2,3,4,5] when both are absent.
          items:
            type: integer
            minimum: 0
            maximum: 6
        days:
          type: array
          description: >-
            Alias for days_of_week, used only when days_of_week is absent. Accepts
            "mon"/"monday"/"1" etc, case-insensitive; unrecognised entries are silently
            dropped, which can turn a non-empty list into a 422 "at least one day".
          items:
            type: string
        window_start_time:
          type: string
          description: Canonical spelling. "HH:MM" or "HH:MM:SS". Defaults to "09:00".
          example: '09:00'
        window_start:
          type: string
          description: Alias, used only when window_start_time is empty.
        window_end_time:
          type: string
          description: Canonical spelling. "HH:MM" or "HH:MM:SS". Defaults to "17:00".
          example: '17:00'
        window_end:
          type: string
          description: Alias, used only when window_end_time is empty.
        buffer_before:
          type: integer
          minimum: 0
          default: 0
        buffer_after:
          type: integer
          minimum: 0
          default: 0
        min_notice_minutes:
          type: integer
          minimum: 0
          default: 0
        usage_type:
          type: string
          enum: [reusable, recurring, single_use]
          default: reusable
          description: Lowercased and trimmed before validation; an empty string becomes `reusable`.
        max_uses:
          type: integer
          nullable: true
          minimum: 1
          description: Required and must be positive when usage_type is `recurring`. Ignored (forced to null) otherwise.
        co_host_emails:
          type: array
          description: >-
            Emails are lowercased and trimmed, then resolved to existing accounts and
            added as `pending` hosts. Addresses with no account are skipped silently -
            the response gives no indication that an invite was dropped.
          items:
            type: string
            format: email

    UpdateSchedulingLinkRequest:
      type: object
      description: >-
        backend/api/handlers_scheduling_links.go schedulingLinkPatch. Scalars are Go
        pointers, so an absent key leaves the stored value alone; slices are plain
        slices, so an absent key and an explicit `null` are indistinguishable and both
        mean "leave unchanged", while `[]` means "clear" (and then usually fails 422).
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
          description: Normalised. If it normalises to empty the request is a 422 "slug cannot be empty".
        duration_options:
          type: array
          items:
            type: integer
        durations:
          type: array
          description: Applied AFTER duration_options, so when both are sent `durations` wins - the opposite precedence from create.
          items:
            type: integer
        days_of_week:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        days:
          type: array
          description: Applied after days_of_week, so `days` wins when both are sent - again the opposite of create.
          items:
            type: string
        window_start_time:
          type: string
          nullable: true
        window_start:
          type: string
          nullable: true
          description: Alias, applied only when window_start_time is absent.
        window_end_time:
          type: string
          nullable: true
        window_end:
          type: string
          nullable: true
          description: Alias, applied only when window_end_time is absent.
        buffer_before:
          type: integer
          nullable: true
          minimum: 0
        buffer_after:
          type: integer
          nullable: true
          minimum: 0
        min_notice_minutes:
          type: integer
          nullable: true
          minimum: 0
        usage_type:
          type: string
          nullable: true
          enum: [reusable, recurring, single_use]
        max_uses:
          type: integer
          nullable: true
          description: >-
            An explicit null is indistinguishable from an absent key (both leave the
            stored value), so max_uses cannot be cleared by PATCH except by switching
            usage_type away from `recurring`.
        active:
          type: boolean
          nullable: true
          description: Setting false is the same soft-deactivation that DELETE performs.
        co_host_emails:
          type: array
          description: >-
            When present, the complete co-host list: unlisted non-owner hosts are removed,
            new ones are added as `pending`, existing ones keep their status (PAC-61).
            Unknown emails are skipped silently.
          items:
            type: string
            format: email

    SchedulingLinkHostInvite:
      type: object
      description: backend/api/handlers_scheduling_links.go hostInviteDTO.
      required: [link_id, link_title, owner_name, owner_email, invited_at]
      additionalProperties: false
      properties:
        link_id:
          type: string
          format: uuid
          description: The value to pass as `{id}` when accepting or declining.
        link_title:
          type: string
        owner_name:
          type: string
          description: May be the empty string if the owner record has no name.
        owner_email:
          type: string
          format: email
        invited_at:
          type: string
          format: date-time
          description: UTC, Go layout "2006-01-02T15:04:05.000Z07:00".

    SchedulingLinkInviteResponse:
      type: object
      description: Echo of the status that was written. The only 200 body accept/decline returns.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [accepted, declined]

    InviteSchedulingLinkHostRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Must be non-empty after trimming and must match an existing account (lowercased before lookup).

    SchedulingLinkHostRecord:
      type: object
      description: >-
        Raw backend/storage/scheduling_links.go LinkHost row, returned by
        POST /api/scheduling-links/{id}/hosts. Not the same shape as the `hosts[]`
        entries inside SchedulingLink.
      required: [id, link_id, user_id, status, invited_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Host-row id. Note that accept/decline key on link_id, so this id is never used as a path parameter.
        link_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, declined]
        invited_at:
          type: string
          format: date-time
          description: Raw time.Time marshalling (RFC3339 with nanoseconds and the DB offset), not the DTO millisecond format.
        responded_at:
          type: string
          format: date-time
          description: Omitted while null (json `responded_at,omitempty`). Set by accept/decline.

    SchedulingLinkBookingRecord:
      type: object
      description: >-
        Raw backend/storage/scheduling_links.go Booking row, returned by
        GET /api/scheduling-links/{id}/bookings. Field names differ from
        PublicBookingConfirmation.
      required: [id, link_id, booker_name, booker_email, start_time, end_time, status, notes, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        link_id:
          type: string
          format: uuid
        booker_name:
          type: string
        booker_email:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string
          description: DB default is `confirmed`; `cancelled` rows are excluded from uses_count and from conflict checks.
          examples: [confirmed, cancelled]
        notes:
          type: string
          description: No omitempty - always present, possibly the empty string.
        created_at:
          type: string
          format: date-time

    # ---- Conferencing --------------------------------------------------------

    CreateConferenceRequest:
      type: object
      description: >-
        POST /api/conference/create. Since PAC-67 (API-052) all three fields are
        required and validated before any provider is called; a body that fails is
        the 400 "invalid body". Before PAC-67 every field silently defaulted to the
        Go zero value when absent and was forwarded to the provider.
      required: [title, start, end]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: >-
            Must contain at least one character that is not whitespace in the
            ECMA-262 `\s` sense. `pattern` states exactly the test the server
            applies (see `createConferenceLink`), so a blank title such as "   "
            cannot be expressed by a client that validates against this schema.
        start:
          type: string
          format: date-time
          description: >-
            `0001-01-01T00:00:00Z` (Go's zero time) is refused with the 400 "invalid
            body", like an absent `start`: the server cannot tell the two apart.
        end:
          type: string
          format: date-time
          description: Must be strictly after `start`.

    ConferenceMeetingDetails:
      type: object
      description: >-
        backend/conference/provider.go Details. camelCase json tags, unlike every other
        response in this domain.
      required: [provider, joinUrl]
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [meet, zoom, teams]
          description: >-
            A literal set by the concrete provider (U-12, resolved by PAC-67 from
            backend/conference: `MeetProvider.CreateMeeting` writes "meet",
            `ZoomProvider.CreateMeeting` "zoom", `TeamsProvider.CreateMeeting`
            "teams"; `grep -n 'Provider:' backend/conference/*.go` shows the three).
            Note "meet", not "google_meet": this is not the
            `ConferenceProviderStatus.provider` vocabulary.
        joinUrl:
          type: string
          description: >-
            Always present (no omitempty). The join URL for zoom and teams. For meet
            it is the EMPTY STRING: `MeetProvider` creates nothing (a Meet link is
            minted by Google Calendar on event creation), so the standalone create
            with a `meet` conferencing provider answers `{"provider":"meet","joinUrl":""}`.
            Because of that the earlier `format: uri` was not true of every response
            and is removed (U-12, factory section 7.2).
        meetingId:
          type: string
          description: Omitted when empty (always omitted for meet).
        password:
          type: string
          description: Omitted when empty.

    ConferenceProviderStatus:
      type: object
      description: backend/api/handlers_conferencing.go conferenceProviderStatus.
      required: [provider, connected]
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [google_meet, zoom, teams, custom]
        connected:
          type: boolean
          description: >-
            Always present. `custom` is hardcoded to true. Since PAC-67 the other rows
            mean USABLE (see `listConferenceProviders`), with these predicates over the
            caller's own credentials: `google_meet`, a Google token row is stored AND
            no loss of it is recorded; `zoom`, a stored Zoom credential decodes AND
            holds a refresh token AND no loss of it is recorded; `teams`, a stored
            Microsoft credential decodes AND holds a refresh token AND no loss of it
            is recorded, the same predicate as `getAuthStatus` for an Outlook
            calendar provider. Before PAC-67 `zoom` was true for any non-blank stored
            value (including one that does not decode) and `teams` for any stored
            Microsoft credential, with or without a refresh token, which could
            report a credential that can never be renewed as connected (contract
            challenge finding 5).
        email:
          type: string
          description: Set only for google_meet (the configured calendar email); omitted when empty.
        enabled:
          type: boolean
          description: >-
            json `enabled,omitempty` on a bool, so `false` is OMITTED entirely - the key
            only ever appears as `true`, and only for teams. Absence must be read as false.
            Since PAC-67 it follows teams' `connected` exactly (same predicate): a lost,
            disconnected or never-renewable (no refresh token) Microsoft credential
            omits it, so no field of the row reports Teams usable (spec PAC-67
            section 4 preamble).
        auto_with:
          type: string
          enum: [google, outlook]
          description: '"google" for google_meet, "outlook" for teams. Omitted for zoom and custom.'

    AddEventConferenceRequest:
      type: object
      description: POST /api/events/{id}/conference.
      required: [provider]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: >-
            Lowercased and trimmed. `custom` and `google_meet` are handled inline;
            `zoom` and `teams` go through the provider factory; anything else is a 400
            from the factory.
          enum: [google_meet, zoom, teams, custom]
        url:
          type: string
          format: uri
          description: >-
            Required (non-empty after trimming) when provider is `custom`, ignored for
            every other provider. Never validated as a URL by the backend.

    EventConferenceLink:
      type: object
      description: backend/api/handlers_conferencing.go conferenceLinkResponse.
      required: [provider, url]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: >-
            The requested provider, EXCEPT on the already-has-a-conference echo branch,
            where it is the provider already stored on the event (which can differ from
            the requested one when `custom` was requested).
        url:
          type: string
          format: uri
        label:
          type: string
          description: >-
            Omitted when empty. "Custom link" for custom, "Google Meet" for google_meet,
            the uppercased provider name (e.g. "ZOOM", "TEAMS") for factory providers,
            and the bare stored provider string on the echo branch.
