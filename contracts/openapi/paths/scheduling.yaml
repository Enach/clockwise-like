# Domain: scheduling
# Source of truth: backend/api/routes.go, handlers_focus.go, handlers_schedule.go,
# handlers_nlp.go, handlers_llm.go, handlers_settings.go, handlers_daily_recap.go,
# backend/engine/{focus_time,compression,smart_schedule,daily_recap}.go,
# backend/nlp/{parser,llm_factory}.go, backend/storage/settings.go.
#
# All routes below are registered inside the `requireAuth(jwtSecret)` chi group in
# routes.go, so they inherit the global default security scheme (no per-operation
# `security` key is written here, by instruction).
#
# Two distinct error encodings exist in this domain and are NOT interchangeable:
#   * writeError()  -> application/json, body {"error": "<msg>"}  (handlers_settings.go:206)
#   * http.Error()  -> text/plain; charset=utf-8, body "<msg>\n"  (Go stdlib overwrites
#                      any Content-Type the handler set beforehand)
# Each response below states which one the handler actually uses.
#
# Nil-slice caveat: Go encodes a nil slice as JSON `null`, not `[]`. Every array-typed
# field produced by these handlers from an un-appended slice is therefore nullable.

paths:
  /api/focus/run:
    post:
      operationId: runFocus
      tags: [focus]
      summary: Run the focus-time engine for a week
      description: >
        Creates focus blocks for the target week. The body is optional: an
        absent or empty body (zero bytes or only whitespace) and the JSON
        literal `null` are treated as `{}`, i.e. the current week. Any other
        body that does not decode into FocusRunRequest is a 400 `invalid JSON`:
        a syntax error, a non-object top-level value (array, string, number,
        boolean), or a member of the wrong type such as `{"week":5}`. Before
        PAC-36 such a body was silently treated as `{}` and answered 200 for the
        current week (API-035). Only the first JSON value is read; bytes after
        it are not inspected, as on every sibling endpoint. A non-empty `week`
        that fails `time.Parse("2006-01-02", ...)` is a 400 `invalid week format,
        use YYYY-MM-DD`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusRunRequest'
      responses:
        '200':
          description: Focus run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusRunResult'
        '400':
          description: >
            `invalid JSON` (the body is present, is not `null`, and does not
            decode into FocusRunRequest; PAC-36, API-035) or `invalid week format,
            use YYYY-MM-DD`. Fixed messages, JSON error shape (writeError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Engine failure for a user who HAS a stored Google credential (a user with none
            gets the 401 `calendar not connected`). Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/focus/blocks:
    get:
      operationId: listFocusBlocks
      tags: [focus]
      summary: List persisted focus blocks for a week
      description: >
        Returns the caller's rows from the `focus_blocks` table (`user_id` = the
        authenticated user) where `date >= week AND date < week+7days`, ordered by
        start_time. Other users' blocks are never listed.
        Keys are snake_case (`id`, `google_event_id`, `start_time`, `end_time`,
        `date`, `created_at`) from explicit json tags on `storage.FocusBlock`
        (PAC-26, API-014). Before PAC-26 the struct had no tags and the encoder
        emitted the Go field names (`ID`, `GoogleEventID`, `StartTime`, ...),
        which the web app's FocusBlock type could not read.
      parameters:
        - name: week
          in: query
          required: false
          description: >
            Week anchor date, format `YYYY-MM-DD` (Go layout "2006-01-02").
            Omitted or empty -> `time.Now()`. The value is used verbatim as the
            lower bound; it is NOT snapped to Monday (unlike
            POST /api/schedule/compress, which does snap via startOfWeek()).
          schema:
            type: string
            format: date
            example: '2025-01-06'
      responses:
        '200':
          description: >
            Focus block rows. `[]` when the week has no rows (PAC-28).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FocusBlockRecord'
        '400':
          description: '`invalid week format` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '500':
          description: >-
            DB failure. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    delete:
      operationId: clearFocusBlocks
      tags: [focus]
      summary: Delete the focus blocks of a week
      description: >
        Deletes the caller's focus blocks for the Monday-anchored week containing
        `week`, from the caller's calendar and from storage. Other users' blocks
        are not touched and not counted.
      parameters:
        - name: week
          in: query
          required: false
          description: >
            Week anchor date, `YYYY-MM-DD`. Omitted -> `time.Now()`.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Number of deleted blocks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusClearResult'
        '400':
          description: '`invalid week format` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Engine failure for a user who HAS a stored Google credential (a user with none
            gets the 401 `calendar not connected`). Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/schedule/compress:
    post:
      operationId: previewCompression
      tags: [schedule]
      summary: Preview meeting-compression proposals
      description: >
        Read-only: computes proposals, moves nothing.
        The body is optional: an absent or empty body (zero bytes or only
        whitespace) and the JSON literal `null` are treated as `{}`, i.e. today.
        Any other body that does not decode into CompressionRequest is a 400
        `invalid JSON` (a syntax error, a non-object top-level value, or a member
        of the wrong type). Before PAC-36 the decode error was discarded and such
        a body answered 200 for today (API-035). Only the first JSON value is read.
        If `week` is set it wins over `date`: the handler snaps the parsed date to
        Monday (startOfWeek) and computes Mon..Fri in order. A 200 in week mode
        carries exactly five CompressionResult entries, one per day, Monday
        first; a non-working day is an entry with no proposals, not a missing
        entry. If ANY day's computation fails, the whole request fails exactly as
        single-day mode fails (401 CalendarNotConnected or 500 `internal error`)
        and no per-day results are returned. Before PAC-36 week mode skipped every
        failing day and answered 200 with the survivors, `[]` if all five failed,
        which a client cannot tell apart from "nothing to compress" (API-034).
        If `week` is empty, `date` (or today) produces a single-element array and
        an engine error is the 500.
        A caller with no stored Google credential gets the 401 `calendar not connected`
        in BOTH modes, before any day is computed (PAC-21, API-054).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressionRequest'
      responses:
        '200':
          description: >
            Array of per-day results: exactly one entry in single-day mode,
            exactly five (Mon..Fri, in that order) in week mode. Never `[]`
            (PAC-36: a week in which a day failed is an error response, not a
            shorter array).
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 5
                items:
                  $ref: '#/components/schemas/CompressionResult'
        '400':
          description: >
            `invalid JSON` (the body is present, is not `null`, and does not
            decode into CompressionRequest; PAC-36, API-035), `invalid week
            format` or `invalid date format`. Fixed messages, JSON error shape
            (writeError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Both modes: an engine failure for a user who HAS a stored Google credential
            (a user with none gets the 401 `calendar not connected`), on the single day
            or on any one of the five week days (PAC-36, API-034: week mode no longer
            skips it); or reading the credential store failed (checked before any day is
            computed). Body: `{"error":"internal error"}`, with no per-day results and no
            indication of which day failed. The detail is written to the server log and
            Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/schedule/compress/apply:
    post:
      operationId: applyCompression
      tags: [schedule]
      summary: Apply selected move proposals
      description: >
        The request proposal objects are snake_case (`event_id`,
        `proposed_start`, `proposed_end`) even though the CompressionResult
        proposals returned by /api/schedule/compress are camelCase. Only these
        three fields are read; any other field on the posted object is ignored.
        A proposal whose start or end fails RFC3339 parsing is NOT an error: it
        is dropped and `"<event_id>: invalid time format"` is appended to
        `failed` (confirmed by TestApplyCompress_InvalidTime, which expects 200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressionApplyRequest'
      responses:
        '200':
          description: Applied / failed event ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompressionApplyResult'
        '400':
          description: '`invalid JSON` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Engine Apply() failure for a user who HAS a stored Google credential (a user
            with none gets the 401 `calendar not connected`). Body: `{"error":"internal
            error"}`. The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/schedule/suggest:
    post:
      operationId: suggestMeetingSlots
      tags: [schedule]
      summary: Suggest meeting slots
      description: >
        `range_start` and `range_end` are both mandatory and must parse as
        RFC3339; either one failing yields a single 400. `duration_minutes`,
        `attendees` and `title` are optional as far as the handler is concerned
        (no validation) - `duration_minutes: 0` produces zero-length candidate
        slots rather than an error.
        The engine walks candidate starts in 30-minute steps
        (engine/smart_schedule.go: `t = t.Add(30 * time.Minute)`) and returns at
        most 3 slots, each at least 1h apart (pickTopUnique(candidates, 3, time.Hour)).
        There is no 15-minute increment rule on this route: every step in
        engine/smart_schedule.go (lines 113, 121 and 135) is 30 minutes, so
        every suggested start is the start of a free interval (`range_start` or
        the end of a busy interval) plus a multiple of 30 minutes. The 15-minute stepping in
        engine/booking.go, engine/habits.go and engine/team_availability.go
        backs other domains. U-07 resolved by PAC-21 from the engine, to be
        pinned by TestSmartScheduler_Suggest_StepsThirtyMinutes (AC-6, written
        in the backend PR before the code); assumed by the
        factory, pending owner confirmation that no 15-minute rule was intended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSuggestRequest'
      responses:
        '200':
          description: Ranked slot suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSuggestions'
        '400':
          description: >
            `invalid JSON`, or
            `invalid range_start or range_end (use RFC3339)` - JSON error shape
            (writeError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Engine error (freebusy failure or settings load) for a user who HAS a stored
            Google credential (a user with none gets the 401 `calendar not connected`):
            `{"error":"internal error"}`; or the weekly out-of-hours allowance is spent:
            `{"error":"out-of-hours meeting allowance reached"}` (still a 500, not a 4xx:
            changing that status is not part of this change). The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/schedule/create:
    post:
      operationId: createScheduledMeeting
      tags: [schedule]
      summary: Create a meeting at an explicit time
      description: >
        `start` and `end` must both parse as RFC3339. The handler builds an
        `engine.ScheduleRequest` WITHOUT `duration_minutes` (the slot carries the
        times) and calls SmartScheduler.CreateMeeting, which refuses out-of-hours
        creation once the weekly allowance is spent - that refusal surfaces as a
        500 with the text `out-of-hours meeting allowance reached`, not a 4xx.
        On success an audit row `meeting_created` is written.
        The response body is the created event flattened by toCalendarEventDTO:
        the CalendarEvent DTO, the same shape as one element of
        GET /api/calendar/events, never Google's own keys (`summary`,
        `start.dateTime`, `hangoutLink`). PAC-29 (API-017, U-14): until PAC-29's
        implementation lands the server still encodes the raw `calendar/v3.Event`
        here, so this response describes the server after that PR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreateRequest'
      responses:
        '200':
          description: >-
            The created event as the CalendarEvent DTO (PAC-29). Room resource
            attendees are dropped from `attendees` / `attendee_details`, as in the
            list; `attendees` is omitted when there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          description: >
            `invalid JSON`, or `invalid start or end (use RFC3339)` - JSON error
            shape (writeError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Calendar or engine error for a user who HAS a stored Google credential (a user
            with none gets the 401 `calendar not connected`): `{"error":"internal error"}`;
            or the weekly out-of-hours allowance is spent: `{"error":"out-of-hours meeting
            allowance reached"}`. The detail is written to the server log and Sentry only
            (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/nlp/parse:
    post:
      operationId: parseNaturalLanguage
      tags: [nlp]
      summary: Parse a natural-language scheduling request
      description: >
        A malformed body and an empty `text` are collapsed into the same 400
        (`missing text field`). Note that LLM-level failures inside the parser
        do NOT surface as 5xx: the parser returns
        `{"intent":"unknown","error":"..."}` with HTTP 200. A 500 only occurs
        when Parse() itself returns a non-nil error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NLPParseRequest'
      responses:
        '200':
          description: Parse result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NLPParseResult'
        '400':
          description: '`missing text field` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '500':
          description: >-
            Parse() returned an error. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/nlp/confirm:
    post:
      operationId: confirmNaturalLanguage
      tags: [nlp]
      summary: Create the meeting for a chosen parsed slot
      description: >
        The whole ParseResult from /api/nlp/parse is echoed back. Only
        `title`, `attendees`, `constraints` (mapped to the event Description)
        and `suggested_slots[selected_slot_index]` are used; `duration_minutes`,
        `range_start`, `range_end`, `preferred_times` and `avoid_times` are
        ignored here. On success an audit row `nlp_confirmed` is written and the
        created event is returned as the CalendarEvent DTO (toCalendarEventDTO, the
        same shape as GET /api/calendar/events), never Google's own keys. PAC-29
        (API-017, U-14): until PAC-29's implementation lands the server still encodes
        the raw `calendar/v3.Event` here, so this response describes the server
        after that PR.
        A NEGATIVE `selected_slot_index` is a 400 `invalid selected_slot_index`, like
        an index past the end. Before PAC-21 was finished it passed the bounds check,
        indexed the slice out of range and panicked; the panic was re-raised by
        sentryMiddleware, so net/http aborted the response with no status and no body
        at all. That was U-06 / API-024, resolved here: a crash is not a contract to
        preserve, and the 400 is the response the handler already gives every other
        out-of-range index.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NLPConfirmRequest'
      responses:
        '200':
          description: >-
            The created event as the CalendarEvent DTO (PAC-29). Room resource
            attendees are dropped from `attendees` / `attendee_details`, as in the
            list; `attendees` is omitted when there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          description: >
            `invalid JSON`, or `invalid selected_slot_index` (empty slot list,
            index < 0, or index >= len). JSON error shape (writeError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            CreateMeeting failed for a user who HAS a stored Google credential (a user with
            none gets the 401 `calendar not connected`): `{"error":"internal error"}`; or
            the weekly out-of-hours allowance is spent: `{"error":"out-of-hours meeting
            allowance reached"}`. A negative `selected_slot_index` is a 400, never a 500
            (resolves U-06 / API-024). The detail is written to the server log and Sentry
            only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/llm/test:
    post:
      operationId: testLLMConnection
      tags: [llm]
      summary: Probe an LLM provider configuration
      description: >
        Probes a provider configuration by issuing a fixed completion
        (system "You are a helpful assistant.", user "Say hello").

        PAC-24 resolves API-037. **THE DESTINATION IS NEVER SUPPLIED BY THE
        CALLER.** Every value that contributes to the URL this server requests —
        `llmBaseUrl`, `ollamaBaseUrl`, `azureEndpoint`, `azureDeployment`,
        `azureApiVersion`, `awsRegion`, `awsProfile`, `bedrockModel`,
        `gcpProject`, `gcpLocation`, `vertexModel` — is read from the CALLER'S
        OWN stored settings and from nowhere else. The request body may carry
        only `llmProvider`, `llmModel` and `llmApiKey`, none of which reaches a
        URL (`backend/nlp/llm_factory.go:13-58`: `llmModel` is consulted only by
        the `openai` and `anthropic` branches, where it is a JSON body field, and
        `llmApiKey` only as an `Authorization` header value).

        This is a security property of the contract, not a convenience, and the
        invariant is: **a credential the caller did not supply is never sent to a
        destination the caller did supply — because the caller cannot supply a
        destination at all.** An earlier draft of this contract let a body
        override each endpoint property individually with per-property fallback
        to the stored values. That let
        `{"llmProvider":"openai","llmBaseUrl":"https://attacker.example"}` pair a
        caller-chosen host with the stored key:
        `nlp.NewLLMClientFromSettings` builds
        `OpenAIClient{APIKey: s.LLMAPIKey, BaseURL: s.LLMBaseURL}`
        (`backend/nlp/llm_factory.go:29`) and `OpenAIClient.Complete` POSTs to
        `base + "/v1/chat/completions"` with `Authorization: Bearer <key>`
        (`backend/nlp/parser.go:31,43`), so the stored key would leave the
        deployment and the 200/502 would confirm delivery. An all-or-nothing
        body (supply the endpoint AND the key together) does not close it either:
        on the `azure_openai`, `bedrock` and `vertex` branches the credential is
        AMBIENT and cannot be submitted —
        `AzureOpenAIClient.Complete` mints a token with
        `azidentity.NewDefaultAzureCredential` and sends it as
        `Authorization: Bearer <token>` to `c.Endpoint`
        (`backend/nlp/llm_azure_openai.go:28-50`) — so any submitted endpoint is
        necessarily paired with a credential the caller did not supply. Refusing
        submitted destinations outright is the only shape that holds for all six
        providers.

        What the body IS for: verifying a key that has not been saved, now that a
        stored key can never be read back (see `SettingsUpdate.llmApiKey`), and
        naming which provider the result is about (spec AC-15). The body is
        REQUIRED (revision 3): `{}` probes the caller's stored configuration
        entirely - the pre-PAC-24 behaviour - and an absent body is a 400, as the
        generated server wrapper already makes it (contract challenge r2,
        finding 3). In the body, `""` is a value like any other: `llmApiKey: ""`
        probes with no key and `llmProvider: ""` probes with no provider, which
        is the 500 `{"error":"internal error"}` (the configuration sentence is
        logged only, PAC-21).

        Before PAC-24 the handler never read r.Body at all and always probed the
        SINGLETON settings row, so this operation reported on the deployment's
        saved configuration rather than on the caller's (API-002, API-037).

        No response on any status carries the submitted or the stored
        `llmApiKey` (PAC-24 spec AC-14). Since PAC-21 the 502 body is the fixed
        `upstream provider error` and no longer echoes the provider's own text
        (`backend/api/server_errors.go`); the detail goes to the server log
        only.

        **PAC-66: the deployment's cloud identity goes only to hosts the
        OPERATOR approved.** PAC-24 left one indirect channel open: a caller
        could write `azureEndpoint` or `gcpLocation` into their OWN settings
        with `PATCH /api/settings` and then probe, and on the three
        ambient-credential providers (`azure_openai`, `vertex`, `bedrock`) the
        server sent the DEPLOYMENT'S cloud credential (an Entra ID token, a
        Google ADC token, an AWS SigV4 signature) to the host those values
        built (`backend/nlp/llm_azure_openai.go:28-50`, `llm_vertex.go:29-53`;
        a Vertex location such as `attacker.example/x` changes the URL's
        authority). PAC-66 closes it for those three providers:

        * The operator names the approved inference hosts per provider in
          deployment configuration (`PACEDAY_LLM_APPROVED_HOSTS_AZURE_OPENAI`,
          `PACEDAY_LLM_APPROVED_HOSTS_VERTEX`,
          `PACEDAY_LLM_APPROVED_HOSTS_BEDROCK`; format in
          `contracts/features/PAC-66.md` §4). No request property and no
          stored setting can add to that set. A host approved for one provider
          is not approved for another (spec D-8). Nothing approved means the
          provider is not enabled on this deployment (spec D-1, fail closed).

        * Before an ambient provider sends anything, the server computes the
          EFFECTIVE HOST of the inference request, the host it would actually
          contact after every default is applied (Azure: the stored endpoint's
          host, none when empty; Vertex: `<location>-aiplatform.googleapis.com`,
          `us-central1` when empty; Bedrock: the host the AWS SDK resolves for
          the stored region, `us-east-1` when empty, and the stored profile).
          The request is sent only if that host, over `https` on the default
          port, is approved for the provider the probe USES: the body's
          `llmProvider` when present, otherwise the stored one (spec AC-18).
          Otherwise this operation answers 422 and makes no outbound inference
          request at all (spec AC-1, AC-2, AC-4, AC-7, AC-16, AC-19, AC-20).

        * The 422 is reported whether or not a cloud credential could be
          acquired: a destination refusal never surfaces as the credential
          error (spec, shared Given "Refusal does not depend on the
          credential").

        * A redirect from an approved host is never followed with the
          deployment credential to another host or to `http` (spec AC-8). It
          is reported as the 502 below, because the approved provider
          answered and its answer was unusable.

        * The check is made on every send, not only on write, so a value stored
          before PAC-66 is refused here too (spec AC-9).

        For the three ambient providers an approved host is still approved
        whatever path, project, deployment or model the stored values put in
        the URL; that sibling problem is recorded in
        `contracts/features/PAC-66.md` §7 and is not solved by PAC-66 or
        PAC-66-B.

        **PAC-66-B: a user-set base URL goes only to a destination approved for
        the provider in use.** On the user-key and keyless providers
        (`openai`, `anthropic`, `ollama`) the destination is built from the
        caller's stored `llmBaseUrl` / `ollamaBaseUrl`. Before PAC-66-B any
        scheme, host, port, path or query was used verbatim, so a caller could
        make the server POST to any address it can reach and read the outcome
        as an oracle, and the server followed redirects, re-sending an
        Anthropic `x-api-key` to any host (spec §B1, §B2.4). PAC-66-B closes
        it (spec PAC-66 Part B; rationale in
        `contracts/features/PAC-70.md`):

        * **Approved destinations, per provider, never transferred** (spec
          D-B1, D-B2, D-B3, D-B5). `openai`: `https://api.openai.com`, built in,
          plus the hosts the operator lists in
          `PACEDAY_LLM_APPROVED_HOSTS_OPENAI`. `anthropic`:
          `https://api.anthropic.com`, built in, plus
          `PACEDAY_LLM_APPROVED_HOSTS_ANTHROPIC`. Both only over `https` on the
          default port. `ollama`: only the origins (scheme, host and port) the
          operator lists in `PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA`, where `http`
          and a non-default port are allowed because Ollama carries no key;
          nothing listed means Ollama is not enabled on this deployment (fail
          closed). A destination approved for one provider is never a
          destination for another, so a user's key never goes to an Ollama
          origin (spec AC-B11). No request property and no stored setting can
          add to any of these sets.

        * **Effective destination** (spec §B4). `openai` / `anthropic`: the
          stored `llmBaseUrl`, or the vendor's public host when it is `""`. A
          non-empty value with no usable host (e.g. `http:/`) is refused, never
          replaced by the public host. `ollama`: `ollamaBaseUrl`; when that is
          `""`, `llmBaseUrl`; when both are `""`, `http://localhost:11434`. The
          fallback order is unchanged (spec D-B9); an account's starting state
          stores `ollamaBaseUrl` as `http://localhost:11434`, so the shared
          `llmBaseUrl` is not Ollama's destination until `ollamaBaseUrl` is
          cleared.

        * **A base URL names a destination, not an operation** (spec D-B8). It
          is usable only when it is exactly `<scheme>://<host>[:<port>]` with
          at most one trailing `/`. Any other path, a `?` or `#` (even empty),
          userinfo, or surrounding whitespace makes it not approved. The
          request is sent to exactly the provider's chat operation on that
          origin (`/v1/chat/completions`, `/v1/messages`, `/api/chat`) with no
          query.

        * **The check is made on every send, against the provider the probe
          USES** (the body's `llmProvider` when present, otherwise the stored
          one), before anything else about the request. A refusal is the 422
          below and sends nothing, whether or not a key is on file or
          submitted: an `openai` or `anthropic` probe with a refused destination
          and no key is the 422, not the 500 (spec
          "Refusal does not depend on the key"). A value stored before PAC-66-B
          is refused here too and is never rewritten (spec AC-B14, D-B4).

        * **A redirect is never followed** on these three providers, whatever
          the status, target, method or query, including a redirect to another
          approved destination. The request that drew it counts as failed (the
          502 below), and the user's key appears only in that first request
          (spec AC-B7, D-B6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMTestRequest'
      responses:
        '200':
          description: Provider reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMTestResult'
        '400':
          description: >
            Malformed JSON body; a body naming an `llmProvider` outside the
            permitted set; or a body carrying any property other than
            `llmProvider`, `llmModel` and `llmApiKey`
            (`additionalProperties: false`). The last case is how a caller
            attempting to supply a destination - `llmBaseUrl`, `azureEndpoint`,
            `ollamaBaseUrl`, … - is refused, and it must be refused here rather
            than ignored, so that a client is told its override did nothing
            instead of being left to believe it probed what it named.
            JSON error shape (writeError). The response never contains the
            submitted or the stored `llmApiKey` (spec AC-14).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '422':
          description: >
            PAC-66 and PAC-66-B. The probe would send a request to a
            destination not approved for the provider it uses (as named in the
            body or stored): the deployment's cloud credential (`azure_openai`,
            `vertex`, `bedrock`; PAC-66), the caller's own key (`openai`,
            `anthropic`; PAC-66-B) or a keyless request (`ollama`; PAC-66-B).
            Nothing was sent. `reason` says which of three cases applies;
            `property` names the stored setting to correct.
            The body never carries a token, a key or any part of the
            deployment credential, and `error` is a non-empty sentence (PAC-66
            spec AC-11, AC-B16). Distinct from the 400 (the request body itself is
            malformed) and from the 502 (the provider call failed: credential
            acquisition, provider configuration, transport, or an unusable or
            redirecting answer; a 502 does not imply a request was sent). A
            422 always means nothing was sent; the converse does not hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMDestinationRefusal'
              examples:
                notEnabled:
                  value:
                    error: azure_openai is not enabled on this deployment; ask your administrator to approve an Azure OpenAI endpoint
                    reason: provider_not_enabled
                notApproved:
                  value:
                    error: azureEndpoint is not an approved Azure OpenAI endpoint on this deployment
                    reason: destination_not_approved
                    property: azureEndpoint
                notSet:
                  value:
                    error: the Azure endpoint is not set; save an approved endpoint in Settings first
                    reason: destination_not_set
                    property: azureEndpoint
                ollamaNotEnabled:
                  value:
                    error: ollama is not enabled on this deployment; ask your administrator to approve an Ollama server
                    reason: provider_not_enabled
                baseUrlNotApproved:
                  value:
                    error: llmBaseUrl is not an approved OpenAI destination on this deployment; use only the scheme, host and port of an approved server, or leave it empty for api.openai.com
                    reason: destination_not_approved
                    property: llmBaseUrl
        '500':
          description: >-
            Settings load failure, or the LLM client could not be constructed (for
            example no key on file or submitted for a key-carrying provider, or
            `llmProvider: ""`). Both answer the same fixed body,
            `{"error":"internal error"}`, in the JSON error envelope (before PAC-21
            was finished the settings-load failure was text/plain). The cause, such as
            the sentence `LLM not configured - set API key in Settings`, is never in the
            body. A PAC-66
            or PAC-66-B destination refusal is NEVER a 500; it is the 422, including on
            `openai` and `anthropic` when no key is on file or submitted. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '502':
          description: >-
            The provider call failed. Body: `{"error":"upstream provider error"}`. The
            upstream error string is NOT returned: it is redacted of both keys and written
            to the server log and Sentry only (PAC-21). A 502 does NOT imply an inference
            request was sent: the handler maps every provider-call error to 502, including
            failures before any request leaves the server - Azure or Vertex credential
            acquisition and Bedrock configuration loading (e.g. a stored `awsProfile` absent
            from the deployment's shared config). PAC-66: this includes an approved
            ambient-provider host answering with a redirect, which is not followed with the
            deployment credential to any other host or to `http` (spec AC-8). PAC-66-B: this
            also includes an approved `openai`, `anthropic` or `ollama` destination answering
            with a redirect of any status to any target; it is not followed, and the caller's
            key is in no request but the first (spec AC-B7). The body never carries the
            deployment credential or a key. It is never used for a destination refusal; see
            422.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Read the caller's settings document
      description: >
        Registered as `r.Route("/api/settings", ...)` + `r.Get("/", ...)`, so chi
        serves both `/api/settings` and `/api/settings/`.

        Returns the settings of the AUTHENTICATED CALLER. When the caller has no
        settings row yet, one is created from the SQL defaults and returned, so
        this operation never 404s and a second read returns the same row rather
        than creating another (spec AC-2).

        `llmApiKey` is never returned, by this or any other operation
        (`writeOnly: true`). `llmApiKeySet` reports whether a key is on file
        (spec AC-11, AC-12).

        Before PAC-24 this read `WHERE id = 1` - a row shared by every
        authenticated caller, which after migration 018's backfill is the
        earliest-created user's own row - and returned `llmApiKey` in cleartext
        (API-002, API-003).
      responses:
        '200':
          description: The settings document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '500':
          description: >-
            DB failure. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    patch:
      operationId: patchSettings
      tags: [settings]
      summary: Change some of the caller's settings
      description: >
        MERGE, at the top level, against the CALLER'S OWN settings. This is the
        ONLY write operation for settings: PAC-24 removes `PUT /api/settings`
        rather than retaining it as a deprecated alias, for the reasons in the
        comment on this path and in `contracts/features/PAC-24.md` §3.

        The rule is total and needs no knowledge of what is stored:

        * **Property absent** -> unchanged.
        * **Property present** -> set to exactly that value. `""`, `0` and
          `false` are values, not absences: they clear, zero and disable. This is
          how a setting is cleared, including `llmApiKey` (spec AC-7, AC-13).
        * **Property present and `null`** -> 400. No property of this body is
          nullable, so a null fails schema validation and nothing is stored
          (spec AC-8).
        * **`workingHours` and `lunchBreaks`** are replaced WHOLE when present -
          there is no deep merge and no per-day merge, so a weekday omitted from
          a supplied map is REMOVED. `lunchBreaks: {}` clears every per-day lunch
          override (spec AC-9).
        * **`llmApiKeySet` and `updatedAt`** are `readOnly`. They may be present -
          a client that submits back a document it just read will include them -
          and are ignored (spec AC-10).

        The response is a fresh read of the caller's row, so it reflects
        normalisation (e.g. `workingHours` defaulting) rather than the submitted
        body, and it does not contain `llmApiKey`.

        **PAC-66 destination rules.** When a write CHANGES `azureEndpoint`,
        `gcpLocation` or `awsRegion` to a non-empty value, that value is
        checked whichever provider is selected (spec AC-5, AC-7):
        `azureEndpoint` must be an `https` URL whose host is approved for
        `azure_openai`; `gcpLocation` must build a Vertex host approved for
        `vertex`; `awsRegion` must be a valid AWS region name (one host label;
        the Bedrock host itself is checked when a request is sent). A refused
        value is a 400 naming the property, and nothing in the body is stored.
        Three things are deliberately NOT refused here: `""` for any of the
        three (a user can always clear a bad value, spec AC-15, D-3); a value
        equal to the one already stored (the changed-only rule above, PAC-24
        AC-17, spec AC-9); and a write that changes only `llmProvider`, even
        onto a stored unapproved endpoint (spec AC-17). Each of those is refused
        when a request would be sent instead (see `testLLMConnection`). The
        server never rewrites or clears a stored value (spec D-3).

        **PAC-66-B destination rules.** When a write CHANGES `llmBaseUrl` or
        `ollamaBaseUrl` to a non-empty value, that value is checked whichever
        provider is selected (spec AC-B3, AC-B4, AC-B18, AC-B19): it must be
        exactly `<scheme>://<host>[:<port>]` with at most one trailing `/`.
        `ollamaBaseUrl` must then be an origin approved for `ollama`.
        `llmBaseUrl` is read by all three of `openai`, `anthropic` and
        `ollama`, so it must be approved for AT LEAST ONE of them (the vendors'
        public hosts count; spec D-B5); being approved for one provider does
        not make it a destination for another, which is checked when a
        request would be sent. A refused value is a 400 naming the property,
        and nothing in the body is stored. As for PAC-66, `""` is always
        accepted (a user can always clear a bad value; clearing means the
        provider's fallback, spec §B4), an unchanged value is not re-checked,
        and a write that changes only `llmProvider` is not refused (spec
        AC-B14, D-B4).

        Before PAC-24 there was no PATCH; the only write was a full-replace PUT
        that persisted every omitted field as its Go zero value (API-004).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: The re-read settings document for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/SettingsValidationError'
        '500':
          description: >-
            Load, save or re-read failure. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    # PUT /api/settings is REMOVED by PAC-24. Revision 1 of this contract
    # retained it as a deprecated merge-semantics alias, on the argument that it
    # shielded the pre-PAC-24 frontend during the factory's cross-repo window
    # (README §1). That argument does not survive checking:
    #   * The only PUT consumer is
    #     `smart-calendar-flow/src/api/client.ts:813`, which sends
    #     `settingsRequestBody(s)` - a spread of the snake_case `Settings` object
    #     (`:550-563`), so the body carries `work_start`, `llm_api_key` and 24
    #     more snake_case names. PUT and PATCH shared `SettingsUpdate`, which is
    #     `additionalProperties: false`, so that body was a 400 on PUT exactly as
    #     on PATCH. The alias covered nothing.
    #   * `mcp/client.go` defines get/post/patch/delete and no PUT at all
    #     (`:22,43,47,52`), and no MCP tool writes settings - `clockwise_get_settings`
    #     (`mcp/tools.go:236`) is a GET. The MCP server is not a consumer.
    #   * `e2e/tests/` contains no settings spec.
    # A PUT whose omissions mean "unchanged" is not a replace, and `deprecated`
    # documents an intention to remove, not a change of method semantics -
    # generated clients and any intermediary reasoning about idempotency read the
    # method. The old frontend's writes are silently discarded by the server
    # today (API-013), so a 400 from the removed route is strictly more honest
    # than a silent success. See `contracts/features/PAC-24.md` §3.

  /api/settings/daily-recap:
    get:
      operationId: getDailyRecapSettings
      tags: [daily-recap]
      summary: Read the caller's daily-recap settings
      description: >
        A snake_case projection of seven `recap*` fields of the CALLER'S OWN
        settings row - the same row GET /api/settings exposes in camelCase. The
        two representations are hand-maintained and can drift
        (`recapIncludeFocus` <-> `include_focus_blocks`).

        Before PAC-24 this read the singleton row, so every user saw and edited
        one shared recap configuration (API-002).
      responses:
        '200':
          description: Daily-recap settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapSettings'
        '500':
          description: >-
            DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    patch:
      operationId: patchDailyRecapSettings
      tags: [daily-recap]
      summary: Partially update the caller's daily-recap settings
      description: >
        A partial update of the CALLER'S OWN recap settings. A property absent
        from the body is left unchanged; a property present is applied. No
        property is nullable, so an explicit `null` is a 400 - this matches
        PATCH /api/settings (spec AC-8) and is a change: the handler's pointer
        fields previously treated `null` as "leave unchanged", which made a
        typo indistinguishable from an omission.

        Returns 204 with an EMPTY body on success - it does not echo the new
        state.

        Before PAC-24 this patched the singleton row, and the underlying write
        was a full-row write that also rewrote every NON-recap column of that
        row from the values it had just read (API-002). It now writes only the
        recap columns of the caller's row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyRecapPatch'
      responses:
        '204':
          description: Updated. No body.
        '400':
          description: >
            `invalid JSON`; `send_to must be 'dm' or 'channel'`; or - added by
            PAC-24, previously a 500 from the Postgres TIME cast -
            `send_time must be in HH:MM format`. Written with http.Error, so
            these are text/plain, NOT the JSON error shape.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: >-
            DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/settings/daily-recap/preview:
    post:
      operationId: previewDailyRecap
      tags: [daily-recap]
      summary: Render today's recap without sending it
      description: >
        Builds the Slack Block Kit payload for the authenticated user at the
        current time IN THE CALLER'S TIMEZONE (`settings.timezone`, UTC when it
        cannot be resolved) - the same rule the scheduled recap uses - and
        returns it; the header names that zone and every time in the recap is
        rendered in it. No request body is read. Nothing is sent to
        Slack and no Slack connection is required.

        Before PAC-24 the day's content was the caller's but the recap
        configuration driving it (which sections to include) came from
        the singleton row, so a preview could omit sections the caller had
        enabled (API-002), and it was built in the server's zone. Both now come
        from the caller's row.
      responses:
        '200':
          description: Rendered Slack blocks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapPreview'
        '500':
          description: >-
            DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/settings/daily-recap/test:
    post:
      operationId: sendDailyRecapTest
      tags: [daily-recap]
      summary: Send a test recap to Slack
      description: >
        Requires a stored `slack` workspace connection for the authenticated
        user. Destination comes from the CALLER'S OWN stored settings
        (`recapSendTo`, `recapChannelId`), not from the request - no request
        body is read. The message is built at the current time in the caller's
        timezone, as for the preview. The Slack call is bounded by a 10s context timeout.

        Before PAC-24 the destination came from the singleton row, so a test
        send could be addressed to a channel another user had configured
        (API-002).
      responses:
        '200':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapTestResult'
        '400':
          description: >
            `Slack not connected` (also returned when the workspace-connection
            lookup errors for any other reason). text/plain (http.Error).
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: >-
            DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '502':
          description: >-
            Sending the test message failed. Body: `{"error":"upstream provider error"}`.
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

components:
  responses:

    SettingsValidationError:
      description: >
        Malformed JSON, or a value the server refuses. JSON error shape
        (writeError). A body property set to `null` is refused here: no property
        of SettingsUpdate is nullable (spec AC-8).

        Messages that already exist:
        `invalid JSON` (the body cannot be read; fixed text, PAC-21: before, the
        read error was appended);
        `invalid JSON: the body must be an object` (the body is not a JSON
        object, or is `null`; an existing fixed literal, unchanged);
        `invalid JSON: <property> has the wrong type` (a value of the wrong JSON
        type; `<property>` is the dotted path of JSON property names from the
        request, e.g. `timeFormat` or `workingHours.days.monday.start`, never a
        Go type or struct name; before PAC-21 was finished this was the decoder's
        own error text, which named Go types);
        `<field> must be in HH:MM format` (workStart/workEnd/lunchStart/lunchEnd);
        `focusMinBlockMinutes must be positive`;
        `focusMaxBlockMinutes must be positive`;
        `focusDailyTargetMinutes must be positive`;
        `outOfHoursMeetingsPerWeek must be zero or positive`;
        `bufferBeforeMinutes must be positive`;
        `bufferAfterMinutes must be positive`;
        `autoScheduleCron must be a 5-part cron expression`;
        `autoScheduleCron is invalid` (fixed text; before PAC-21 was finished the
        cron parser's error was appended);
        `llmProvider must be one of: openai, anthropic, ollama, bedrock, azure_openai, vertex`;
        `workingHours.mode must be all_days or by_day`;
        `workingHours.mode is required when day-specific hours are provided`;
        `workingHours.days.<day> is not a valid weekday`;
        `lunchBreaks.<day> is not a valid weekday`;
        `<field> requires start and end when enabled`;
        `<field> start and end must be in HH:MM format`;
        `<field> end must be after start`.

        Messages PAC-24 adds, closing API-081 and API-082 - each of these is a
        value the server accepted before and then failed on, silently or as a
        500 (spec AC-17):
        `workEnd must be after workStart`;
        `lunchEnd must be after lunchStart`;
        `focusMinBlockMinutes must not exceed focusMaxBlockMinutes`;
        `bufferMinMeetingMinutes must be zero or positive`;
        `timezone is not a known IANA location`;
        `recapSendTo must be dm or channel` (previously reached the DB CHECK and
        surfaced as a 500 - API-081);
        `recapSendTime must be in HH:MM format` (previously reached the Postgres
        TIME cast and surfaced as a 500);
        `calendarProvider must be one of: google, outlook, webcal` (resolves
        U-18);
        `conferencingProvider must be one of: meet, zoom, teams`.

        Message PAC-55 adds: `timeFormat must be 12h or 24h`, for `""` and any
        other string (a non-string is `invalid JSON: timeFormat has the wrong type`).

        Messages revision 2 of this contract adds, each with its reason:
        `recapSendTime must be in HH:MM format` now also covers `""`. The write
        path previously substituted `08:00` for an empty value
        (`recapSendTimeOrDefault`, `backend/storage/settings.go:356-361`); under
        the merge rule a present property must be stored exactly as given, so a
        silent substitution is a contract violation and the empty value is
        refused instead. See `Settings.recapSendTime`; this is the one
        clock property for which `""` is NOT a value, and it needs a narrow
        amendment to spec AC-7.
        `workingHours.days must contain at least one weekday when mode is by_day`
        - a `by_day` document with an empty `days` map is the only remaining
        stored state that makes the consumer delete the working-hours section
        with no error (`smart-calendar-flow/src/api/client.ts:505-517,543`); the
        `all_days` equivalent is already normalised away on read
        (`backend/storage/settings.go:95-99`). Serves spec AC-20.

        `workingHours.days.<day> is not a valid weekday` and
        `lunchBreaks.<day> is not a valid weekday` are how a weekday key that is
        not exactly one of the seven lowercase names is refused: generators drop
        `propertyNames`, so the handler is the only enforcement point
        (revision 3/4).

        Messages PAC-66 adds, each produced only when the write CHANGES the
        property to a non-empty value (`""` is always accepted for all three,
        spec AC-15):
        `azureEndpoint must be an https URL whose host is approved for azure_openai on this deployment`
        (an unapproved host, a scheme other than `https`, a port other than
        443, userinfo, or a value that does not parse as an absolute URL);
        `azureEndpoint cannot be set: azure_openai is not enabled on this deployment`
        (the operator approved no Azure host);
        `gcpLocation must be a region whose Vertex host is approved on this deployment`
        (including any value that changes the URL's authority, e.g.
        `attacker.example/x`);
        `gcpLocation cannot be set: vertex is not enabled on this deployment`;
        `awsRegion must be a valid AWS region name`.
        Each names the property first, so a client can attach it to the field.

        Messages PAC-66-B adds, under the same changed-and-non-empty rule (`""`
        is always accepted for both, spec AC-B14):
        `llmBaseUrl must be the scheme, host and port of an OpenAI, Anthropic or Ollama destination approved on this deployment`
        (a value approved for none of the three providers, or one carrying a
        path, query, fragment, userinfo or whitespace; spec AC-B3, AC-B6,
        AC-B18, AC-B19);
        `ollamaBaseUrl must be the scheme, host and port of an Ollama server approved on this deployment`
        (spec AC-B4, AC-B18);
        `ollamaBaseUrl cannot be set: ollama is not enabled on this deployment`
        (the operator approved no Ollama origin).

        `""` is NOT in this catalogue for `workStart`, `workEnd`, `lunchStart`
        or `lunchEnd`. It is a valid value for all four, on read and on write
        (spec AC-7); the handler already skips the format check for it
        (`backend/api/handlers_settings.go:75`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulingErrorResponse'

  schemas:

    # ---------------------------------------------------------------- errors

    SchedulingErrorResponse:
      type: object
      description: >
        The JSON error shape produced by api.writeError (handlers_settings.go:206).
        Emitted with `Content-Type: application/json`. Every 5xx in this domain
        uses it, with a fixed server-chosen message (PAC-21). Handlers that use the
        Go stdlib `http.Error` for a 4xx return text/plain and do NOT use this
        shape; each response above says which applies.
        The 401 from requireAuth is a hybrid: the body text is
        `{"error":"unauthorized"}` but it is written through http.Error, which
        overwrites the Content-Type to `text/plain; charset=utf-8`.
      properties:
        error:
          type: string
      required: [error]
      additionalProperties: false

    # ----------------------------------------------------------------- focus

    FocusRunRequest:
      type: object
      description: >
        Optional. Absent, empty or `null` is treated as `{}`. Any other body that
        does not decode into this object is a 400 `invalid JSON` (PAC-36,
        API-035; it was silently treated as `{}` before).
      properties:
        week:
          type: string
          format: date
          description: >
            `YYYY-MM-DD`. Empty or absent -> current week (`time.Now()`).
            Not snapped to Monday by the handler.
          example: '2025-01-06'
      additionalProperties: true

    FocusRunResult:
      type: object
      description: >
        engine.FocusRunResult (backend/engine/focus_time.go). camelCase wrapper; the
        blocks inside `createdBlocks` are snake_case (FocusRunBlock, PAC-26). The
        wrapper casing is unchanged by PAC-26: the web app's snake_case FocusRunResult
        type is aligned to it by PAC-32 (API-015), which needs no contract change.
      properties:
        weekStart:
          type: string
          format: date-time
          description: RFC3339 (Go time.Time).
        createdBlocks:
          type: array
          description: '`[]` when the engine created nothing.'
          items:
            $ref: '#/components/schemas/FocusRunBlock'
        skippedDays:
          type: array
          items:
            type: string
            format: date
          description: >
            `YYYY-MM-DD` of each weekday the engine skipped (daily target already
            met, or the day is disabled in the working window). Both append sites in
            engine/focus_time.go append the same `day.Format("2006-01-02")` string
            (U-23, resolved by reading the code for PAC-26).
        totalMinutes:
          type: integer
        errors:
          type: array
          items:
            type: string
      required: [weekStart, createdBlocks, skippedDays, totalMinutes, errors]
      additionalProperties: false

    FocusRunBlock:
      type: object
      description: >
        engine.FocusBlock, with explicit snake_case json tags (PAC-26, API-014).
        The keys it shares with FocusBlockRecord (storage.FocusBlock, returned by
        GET /api/focus/blocks) are spelled the same: the Go fields `Start`/`End`
        are tagged `start_time`/`end_time` so that one block shape can be read
        from both operations. It has no `id` and no `created_at`: the engine
        reports what it created before any row id is known to the response.
        Before PAC-26 the struct had no tags and the keys were `GoogleEventID`,
        `Start`, `End`, `Date`.
      properties:
        google_event_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        date:
          type: string
          format: date
          description: '`YYYY-MM-DD`.'
      required: [google_event_id, start_time, end_time, date]
      additionalProperties: false

    FocusBlockRecord:
      type: object
      description: >
        storage.FocusBlock (backend/storage/models.go), with explicit snake_case
        json tags (PAC-26, API-014). The keys match the `focus_blocks` columns and
        the web app's FocusBlock type. Before PAC-26 the struct had no tags and
        the keys were `ID`, `GoogleEventID`, `StartTime`, `EndTime`, `Date`,
        `CreatedAt`.
      properties:
        id:
          type: integer
          format: int64
        google_event_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
      required: [id, google_event_id, start_time, end_time, date, created_at]
      additionalProperties: false

    FocusClearResult:
      type: object
      description: 'Literal `map[string]int{"deleted": n}`.'
      properties:
        deleted:
          type: integer
      required: [deleted]
      additionalProperties: false

    # ----------------------------------------------------------- compression

    CompressionRequest:
      type: object
      description: >
        Both fields optional; `week` takes precedence over `date` when non-empty.
        The whole body is optional too: absent, empty or `null` is treated as
        `{}`. Any other body that does not decode into this object is a 400
        `invalid JSON` (PAC-36, API-035; the decode error was discarded before).
      properties:
        date:
          type: string
          format: date
          description: '`YYYY-MM-DD`. Used only when `week` is empty. Default: today.'
        week:
          type: string
          format: date
          description: >
            `YYYY-MM-DD`. Snapped back to that week's Monday by startOfWeek(),
            then Mon..Fri (5 days) are evaluated.
      additionalProperties: true

    CompressionResult:
      type: object
      description: engine.CompressionResult. camelCase.
      properties:
        date:
          type: string
          description: '`YYYY-MM-DD` as produced by the engine.'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/MoveProposal'
        totalFocusGainMinutes:
          type: integer
      required: [date, proposals, totalFocusGainMinutes]
      additionalProperties: false

    MoveProposal:
      type: object
      description: engine.MoveProposal - the RESPONSE shape (camelCase).
      properties:
        eventId:
          type: string
        eventTitle:
          type: string
        currentStart:
          type: string
          format: date-time
        currentEnd:
          type: string
          format: date-time
        proposedStart:
          type: string
          format: date-time
        proposedEnd:
          type: string
          format: date-time
        reason:
          type: string
        focusGainMinutes:
          type: integer
      required:
        - eventId
        - eventTitle
        - currentStart
        - currentEnd
        - proposedStart
        - proposedEnd
        - reason
        - focusGainMinutes
      additionalProperties: false

    CompressionApplyRequest:
      type: object
      properties:
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/CompressionApplyProposal'
      additionalProperties: true

    CompressionApplyProposal:
      type: object
      description: >
        The anonymous struct in api.applyRequest. snake_case, and only these
        three fields are read - unknown members are ignored by encoding/json.
      properties:
        event_id:
          type: string
        proposed_start:
          type: string
          format: date-time
          description: RFC3339. Unparseable -> the proposal lands in `failed`, no error.
        proposed_end:
          type: string
          format: date-time
      additionalProperties: true

    CompressionApplyResult:
      type: object
      description: 'Literal map with keys `applied` and `failed`.'
      properties:
        applied:
          type: array
          items:
            type: string
          description: Event ids the engine moved.
        failed:
          type: array
          items:
            type: string
          description: >
            Mixed contents: handler-side entries read
            `"<event_id>: invalid time format"`, engine-side entries are appended
            verbatim by Compressor.Apply.
      required: [applied, failed]
      additionalProperties: false

    # ------------------------------------------------------- smart scheduling

    ScheduleSuggestRequest:
      type: object
      description: Anonymous struct in scheduleHandlers.suggestMeeting. snake_case.
      properties:
        duration_minutes:
          type: integer
          description: Not validated by the handler; 0 is accepted.
        attendees:
          type: array
          items:
            type: string
            format: email
        range_start:
          type: string
          format: date-time
          description: RFC3339. Required in practice - a parse failure is a 400.
        range_end:
          type: string
          format: date-time
          description: RFC3339. Required in practice.
        title:
          type: string
      required: [range_start, range_end]
      additionalProperties: true

    ScheduleSuggestions:
      type: object
      description: engine.ScheduleSuggestions.
      properties:
        slots:
          type: array
          description: At most 3 entries; `[]` when no candidate survived.
          items:
            $ref: '#/components/schemas/SuggestedSlot'
      required: [slots]
      additionalProperties: false

    SuggestedSlot:
      type: object
      description: engine.SuggestedSlot.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        score:
          type: integer
          description: >
            Integer score from scoreCandidate + adjustScoreForPreferences.
            No documented range or normalisation.
        reasons:
          type: array
          nullable: true
          items:
            type: string
      required: [start, end, score, reasons]
      additionalProperties: false

    ScheduleCreateRequest:
      type: object
      description: Anonymous struct in scheduleHandlers.createMeeting. snake_case.
      properties:
        title:
          type: string
          description: Becomes the Google event Summary. Not required by the handler.
        start:
          type: string
          format: date-time
          description: RFC3339. Parse failure -> 400.
        end:
          type: string
          format: date-time
          description: RFC3339. Parse failure -> 400.
        attendees:
          type: array
          items:
            type: string
            format: email
        description:
          type: string
        location:
          type: string
      required: [start, end]
      additionalProperties: true


    # ------------------------------------------------------------------- nlp

    NLPParseRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: Empty string -> 400 `missing text field`.
      required: [text]
      additionalProperties: true

    NLPParseResult:
      type: object
      description: >
        nlp.ParseResult. snake_case - the only snake_case RESPONSE body in this
        domain. Every field except `intent` carries `omitempty`, so absent
        members are normal.
      properties:
        intent:
          type: string
          description: >
            Values observed in the code and prompts: `schedule_meeting`,
            `schedule_focus`, `unknown`. The field is a plain string with no
            server-side validation, and the value ultimately comes from the LLM,
            so other values are possible.
          examples: [schedule_meeting, schedule_focus, unknown]
        title:
          type: string
        duration_minutes:
          type: integer
        attendees:
          type: array
          items:
            type: string
        range_start:
          type: string
          format: date-time
          description: >
            Go `time.Time` with omitempty - which does NOT omit the zero time,
            so a missing value may still serialise as `0001-01-01T00:00:00Z`.
        range_end:
          type: string
          format: date-time
          description: Same zero-time caveat as range_start.
        preferred_times:
          type: array
          items:
            type: string
          description: 'Free-form windows, e.g. `"10:00-12:00"`.'
        avoid_times:
          type: array
          items:
            type: string
        constraints:
          type: string
          description: Reused as the event Description by /api/nlp/confirm.
        timezone_notes:
          type: string
        error:
          type: string
          description: >
            Set (with intent `unknown`) when the LLM call fails or returns
            invalid JSON - still HTTP 200.
        suggested_slots:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedSlot'
        participant_infos:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantInfo'
      required: [intent]
      additionalProperties: false

    ParticipantInfo:
      type: object
      description: calendar.ParticipantInfo (backend/calendar/participants.go).
      properties:
        email:
          type: string
          format: email
        timezone:
          type: string
          description: Empty string = unknown.
        workStart:
          type: string
          description: '`HH:MM` or empty.'
        workEnd:
          type: string
          description: '`HH:MM` or empty.'
      required: [email, timezone, workStart, workEnd]
      additionalProperties: false

    NLPConfirmRequest:
      type: object
      properties:
        parse_result:
          $ref: '#/components/schemas/NLPParseResult'
        selected_slot_index:
          type: integer
          minimum: 0
          description: >
            Index into `parse_result.suggested_slots`. A negative value or one
            >= the slot count is a 400 `invalid selected_slot_index`.
      required: [parse_result, selected_slot_index]
      additionalProperties: true

    # ------------------------------------------------------------------- llm

    LLMTestRequest:
      type: object
      description: >
        Optional body for POST /api/llm/test. Added by PAC-24 to close API-037.

        **This schema is a closed list of three properties and that is the whole
        point of it.** Not one of them can contribute to the URL the server
        requests, so no submitted value can direct a stored or ambient credential
        anywhere. The endpoint properties a probe might plausibly want to
        override - `llmBaseUrl`, `ollamaBaseUrl`, `azureEndpoint`,
        `azureDeployment`, `azureApiVersion`, `awsRegion`, `awsProfile`,
        `bedrockModel`, `gcpProject`, `gcpLocation`, `vertexModel` - are
        DELIBERATELY ABSENT and are a 400 via `additionalProperties: false`. The
        operation description carries the full argument, including why an
        all-or-nothing body (endpoint plus credential together) does not close
        the channel on the three ambient-credential providers.

        Required. `{}` probes the caller's stored configuration - the
        pre-PAC-24 behaviour; an absent body is a 400. `{"llmApiKey": "sk-..."}` probes an unsaved key
        against the caller's stored endpoint, which is the case the settings UI
        needs because a stored key can no longer be read back to re-submit.

        This is deliberately NOT `SettingsUpdate`. Sharing that schema would
        re-admit every endpoint property by inheritance, which is precisely the
        defect this shape exists to prevent, and would make a probe read like a
        write. The three property names match the corresponding SettingsUpdate
        ones so a client can build this from the document it already holds.

        `llmApiKey` here is `writeOnly` for the same reason it is on
        SettingsUpdate: it is accepted and is never echoed, including in the 400
        and 502 bodies (spec AC-14). Nothing submitted here is persisted.
      properties:
        llmProvider:
          type: string
          enum: ['', openai, anthropic, ollama, bedrock, azure_openai, vertex]
          description: >
            Which provider branch of `nlp.NewLLMClientFromSettings` to probe.
            Selects the client; it does not select a host. On `openai` and
            `anthropic` the host is the caller's stored `llmBaseUrl` (or the
            vendor default when that is empty); on `ollama` it is the stored
            `ollamaBaseUrl`, then `llmBaseUrl`, then `http://localhost:11434`;
            on the other three it is built entirely from the caller's stored
            endpoint properties. Spec AC-15.
            PAC-66: on `azure_openai`, `vertex` and `bedrock` the operator's
            approved-host check follows THIS value when present, not the stored
            provider, so naming an ambient provider here for one probe is
            checked exactly as if it were saved (spec AC-18; a 422 when
            refused). PAC-66-B: the same holds on `openai`, `anthropic` and
            `ollama`, so naming `openai` for one probe while the stored
            `llmBaseUrl` is approved only for Ollama is a 422 and sends no key
            (spec AC-B11). Nothing submitted here is stored.
        llmModel:
          type: string
          description: >
            Consulted only by the `openai` and `anthropic` branches
            (`backend/nlp/llm_factory.go:25,34`), where it is a field of the JSON
            request body. It never appears in a URL. `bedrockModel`,
            `azureDeployment` and `vertexModel` - which DO appear in URLs - are
            not accepted here.
        llmApiKey:
          type: string
          writeOnly: true
          description: >
            An unsaved key to probe. Used only as the `Authorization` header
            value (`openai`) or the `x-api-key` header value (`anthropic`)
            (`backend/nlp/parser.go:45,80`), sent only to a destination approved
            for that provider (PAC-66-B). Ignored by the four branches that take
            no key. Never persisted and never echoed (spec AC-14).
      additionalProperties: false

    LLMTestResult:
      type: object
      description: 'Literal map: `{"ok": true, "response": ..., "provider": ...}`.'
      properties:
        ok:
          type: boolean
          description: Always literal `true` on the 200 path.
        response:
          type: string
          description: The provider's completion text for the fixed "Say hello" prompt.
        provider:
          type: string
          enum: ['', openai, anthropic, ollama, bedrock, azure_openai, vertex]
          description: >
            Echo of the `llmProvider` that was actually probed - the submitted
            one when a body was sent, the caller's stored one otherwise; empty
            string when unset. It is what tells a client which configuration the
            result is about. It never carries the key.
      required: [ok, response, provider]
      additionalProperties: false

    LLMDestinationRefusal:
      type: object
      description: >
        PAC-66 and PAC-66-B. Body of the 422 from POST /api/llm/test: the probe
        would have sent the deployment's cloud credential, the caller's own key,
        or a keyless Ollama request to a destination not approved for that
        provider, so no inference request was sent. A superset of
        `SchedulingErrorResponse` (`error` is the same member, so a client that
        reads only `error`, as the web settings page does, renders it
        unchanged). Never carries a token, a key or any part of the deployment
        credential (spec AC-11).
      properties:
        error:
          type: string
          minLength: 1
          description: A human-readable sentence saying what was refused and why.
        reason:
          type: string
          enum: [provider_not_enabled, destination_not_approved, destination_not_set]
          description: >
            `provider_not_enabled`: the operator approved no host for this
            provider (spec AC-4, AC-18 b). It wins over the other two: when
            nothing is approved for the provider, this is the reason whatever
            is stored. PAC-66-B: `ollama` with no origin in
            `PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA` (spec AC-B8). Never given for
            `openai` or `anthropic`, whose public hosts are always approved.
            `destination_not_approved`: the effective host, over `https` on
            the default port, is not approved for this provider. This includes
            an `http` endpoint, an explicit non-443 port, a host approved only
            for a DIFFERENT provider, and an empty Vertex location or Bedrock
            region whose built-in default region's host is not approved (spec
            AC-1, AC-2, AC-7, AC-16, AC-18 a/c, AC-19). PAC-66-B: the effective
            destination of `openai`, `anthropic` or `ollama` is not approved
            for that provider. This includes a base URL carrying a path, a
            query, a fragment, userinfo or whitespace; an `http` scheme or a
            non-default port on `openai` / `anthropic`; a scheme, host or port
            differing from an approved Ollama origin; a destination approved
            only for a different provider; and Ollama's built-in default
            `http://localhost:11434` when it is not approved (spec AC-B1,
            AC-B2, AC-B6, AC-B9, AC-B10, AC-B11, AC-B18, AC-B19).
            `destination_not_set`: the destination cannot be built because the
            stored value is empty and the provider has no default; today only
            an empty `azureEndpoint` (spec AC-20).
        property:
          type: string
          enum: [azureEndpoint, gcpLocation, awsRegion, awsProfile, llmBaseUrl, ollamaBaseUrl]
          description: >
            The stored setting the refused destination was built from. Present
            whenever `reason` is not `provider_not_enabled`. `awsProfile` only
            when the Bedrock host came from that profile's endpoint
            configuration rather than from the region. PAC-66-B: `llmBaseUrl`
            on `openai` and `anthropic`, and on `ollama` when the effective
            destination came from it (`ollamaBaseUrl` empty); `ollamaBaseUrl`
            on `ollama` otherwise, including when both are empty and the
            built-in `http://localhost:11434` was refused, since that is the
            setting the user would save an approved origin in.
      required: [error, reason]
      additionalProperties: false

    # -------------------------------------------------------------- settings

    DaySchedule:
      type: object
      description: storage.DaySchedule. No omitempty - all three always serialise.
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
          description: >
            `HH:MM`, validated with a shape check AND `time.Parse("15:04")`, so
            `25:00` is rejected. Empty string allowed when `enabled` is false.
            PAC-24 corrected the pattern: the previous `^[0-9]{2}:[0-9]{2}$`
            both admitted `99:99` (which the server rejects) and forbade the
            empty string (which the server accepts and which GET returns for a
            disabled day) - it was wrong in both directions.
        end:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
      required: [enabled, start, end]
      additionalProperties: false

    WorkingHoursSchedule:
      type: object
      description: >
        storage.WorkingHoursSchedule. Replaced WHOLE by a PATCH that mentions it;
        there is no deep merge (spec AC-9).

        **Normalised on read** by `Settings.normalizeSchedules`
        (`backend/storage/settings.go:92-106`), which `loadScheduleFields` calls
        on every read path (`:495`): an empty `mode` becomes
        `{mode: all_days, default: {enabled: true, start: workStart or 09:00,
        end: workEnd or 18:00}, days: {}}`; an `all_days` document whose
        `default` is entirely empty (`enabled:false, start:"", end:""`) has that
        default replaced the same way (`:95-99`); and a nil `days` map becomes
        `{}`.

        **So `{"mode":"all_days","default":{"enabled":false,"start":"","end":""},
        "days":{}}` is NOT a document GET can return** - the `:95-99` branch
        rewrites it before it reaches the wire. That matters because it is the
        one document the shipped consumer cannot render: `normalizeInterval`
        rejects an empty `start`/`end` and returns `undefined`
        (`smart-calendar-flow/src/api/client.ts:477-488`), `normalizeWorkingHours`
        then returns `undefined` because `default` is undefined and `days` is
        empty (`:505-517`), and `normalizeSettings` reaches
        `delete out.working_hours` (`:543`) - the per-day section disappears with
        no error and no empty state, which is the silent blank spec AC-20 exists
        to end.

        The `by_day` arm of the same shape IS reachable, because `:95-99` guards
        on `mode == "all_days"`: `{"mode":"by_day", …, "days":{}}` normalises to
        itself and produces the identical `undefined` in the consumer. PAC-24
        closes it at the point of entry rather than describing it - a `by_day`
        document must carry at least one weekday (400:
        `workingHours.days must contain at least one weekday when mode is
        by_day`). `by_day` with no days also means "this user never works",
        which no consumer intends and which `WorkWindow` already renders as
        `enabled:false` for every day (`:117-121`).
      properties:
        mode:
          type: string
          enum: ['', all_days, by_day]
          description: >
            Compared EXACTLY by the handler (revision 3): `"BY_DAY"` and
            `" all_days"` are a 400. Before PAC-24 the validator lower-cased and
            trimmed, then persisted whatever was sent. Migration 024 turns a
            stored mode that equals `by_day` ignoring case (and NOT trimmed:
            `" by_day"` never matched) into `by_day`, and any other non-empty
            value into `all_days` - exactly how `WorkWindow` treated them (it only
            special-cases `by_day`, case-insensitively). It also clears an
            enabled entry that would fail validation in the half the stored mode
            ignored before the upgrade (`days` under `all_days`, `default` under
            `by_day`), which `WorkWindow` never read. It does not touch the half
            in use, nor a `default` derived on read for a mode-`""` row: a write
            of `workingHours` must make those valid (see `SettingsUpdate`).

            `''` is in the enum because the server accepts it
            (`:129`, `mode != "" && mode != "all_days" && mode != "by_day"`) and
            because the contract must describe what is, not what should be
            (factory §7). Revision 1 of this contract omitted `''` while the
            description two lines below said it was accepted - a schema
            disagreeing with its own prose. It is accepted on write ONLY when
            `days` is empty; otherwise it is the existing 400
            `workingHours.mode is required when day-specific hours are provided`
            (`:132-134`). That conditional is cross-property and OpenAPI cannot
            express it, so it stays a documented 400 rather than becoming a
            schema narrowing - narrowing here would be a NEW rejection, and spec
            §6 requires both tests in
            `backend/api/handlers_settings_schedule_test.go` to keep passing
            unchanged.

            A GET never returns `''`, because normalisation rewrites it.
        default:
          $ref: '#/components/schemas/DaySchedule'
          description: >
            Validated whenever at least one of enabled/start/end is set, in
            either mode (revision 4). Ignored by WorkWindow() in by_day mode.
        days:
          type: object
          description: >
            Keys are lowercase English weekday names, and PAC-24 makes that a
            constraint THE HANDLER ENFORCES (revision 3): `propertyNames` below
            documents it, but no generator carries `propertyNames` into a
            validator, so the server's exact-match check is the enforcement point
            (contract challenge r2, finding 4). Migration 024 removes stored keys
            that are not exactly one of the seven names - they never matched
            `WorkWindow`'s lookup, so removing them changes no behaviour; it also
            removes entries whose `start`/`end` are neither empty nor a clock.
            Keys and entries are checked WHATEVER THE MODE (revision 4): a
            `days` map stored under `all_days` is still returned by GET. Before
            PAC-24 the validator lower-cased keys and only looked at `days` in
            `by_day` mode, so `"Monday"` was stored and never matched. In
            `by_day` mode a missing weekday means "not working".
          propertyNames:
            enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
          additionalProperties:
            $ref: '#/components/schemas/DaySchedule'
      required: [mode, default, days]
      additionalProperties: false

    LunchBreakSchedule:
      type: object
      description: >
        storage.LunchBreakSchedule - a bare map keyed by lowercase weekday name.
        Normalised to `{}` (never null) on read
        (`backend/storage/settings.go:103-105`). A per-day entry overrides the
        legacy global `lunchStart`/`lunchEnd`/`protectLunch` trio, including
        disabling lunch for that day. Replaced whole by a PATCH that mentions it;
        `lunchBreaks: {}` clears every per-day override (spec AC-9).

        Keys are enforced EXACTLY by the handler (revision 3; generators drop
        `propertyNames`), and migration 024 removes stored keys that are not one
        of the seven lowercase names, or whose `start`/`end` are neither empty
        nor a clock. Before PAC-24 the validator lower-cased the key, so a
        `"Monday"` key was stored and never matched `LunchWindow`'s lookup.
      propertyNames:
        enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
      additionalProperties:
        $ref: '#/components/schemas/DaySchedule'

    Settings:
      type: object
      description: >
        The settings document for ONE user, returned by GET and by PATCH. Every
        property is always present. It has NO `llmApiKey` property at all: the
        key is write-only and is never returned (spec AC-11); `llmApiKeySet`
        reports whether one is on file. Property names come straight from the
        json tags on storage.Settings, camelCase throughout. `ID`,
        `MicrosoftTokens` and `ZoomTokens` are `json:"-"` and never appear.

        PAC-24 revision 3 makes this a concrete schema rather than an `allOf`
        over a shared field set with `readOnly`/`writeOnly` markers: all three
        generators (oapi-codegen, openapi-typescript, typed-openapi) dropped
        those markers and generated a response type carrying `llmApiKey`, and
        typed-openapi also dropped the `required` list (contract challenge,
        revision 2, finding 1). The property map is shared with
        `SettingsUpdate` through a YAML anchor, so the two cannot drift; every
        `Settings` document is a valid `SettingsUpdate` body.

        Every value this schema forbids has been normalised away in storage by
        migration 024 (see `SettingsUpdate` and contracts/features/PAC-24.md,
        Revisions 3 and 4), so a GET always satisfies it.
      properties: &settingsProperties
        workStart:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
          description: >
            `HH:MM`, OR THE EMPTY STRING. DB default `09:00`. PAC-24 tightened
            the shape from `^[0-9]{2}:[0-9]{2}$`, which admitted `99:99` (the
            server's own check was the same loose regexp, so `99:99` was
            stored), and at the same time widened it to admit `""`, which the
            server both accepts and returns.

            `""` is not a modelling slip, it is the state the data is in.
            `validateSettings` skips the format check exactly when the value is
            empty (`backend/api/handlers_settings.go:75`,
            `if val != "" && !timePattern.MatchString(val)`), and every row
            zeroed by API-004 - the defect this feature exists to repair -
            already holds `""` in this column, because the pre-PAC-24 full
            replace persisted each omitted property as its Go zero value. A
            strict `HH:MM` pattern would make day-one GETs fail the contract they
            were generated from, and the generated zod schema would reject the
            body before any UI saw it. It is also what makes spec AC-7
            satisfiable: `{"workStart": ""}` is the documented way to clear this
            setting, and under the merge rule a present property is stored
            exactly as given.

            Consumers already treat `""` as meaningful rather than as damage:
            `WorkWindow` falls back to `09:00`/`18:00` when the effective start
            or end is empty (`backend/storage/settings.go:124-127`).
            The same widening, for the same reason, was already applied to
            `DaySchedule.start`/`end`. Contrast `recapSendTime`, which is
            NOT widened - see its own description.
        workEnd:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
          description: >
            `HH:MM` or `""`, as `workStart`. DB default `18:00`. PAC-24 adds the
            cross-property check that workEnd > workStart, which OpenAPI cannot
            express; it is a 400 (`workEnd must be after workStart`). That check
            applies only when BOTH values are non-empty, which is the existing
            handler behaviour and keeps `""` a clear rather than a 400. Before
            PAC-24 an inverted working day was accepted and produced a
            zero-length day at use (API-082).
        timezone:
          type: string
          description: >
            IANA name, e.g. `Europe/Paris`. DB default `UTC`. PAC-24 validates
            it with time.LoadLocation and returns 400
            `timezone is not a known IANA location`. Before PAC-24 any string was
            accepted and every engine silently fell back to UTC, so a typo moved
            a user's whole schedule with no error anywhere (API-082).
        focusMinBlockMinutes:
          type: integer
          minimum: 0
          description: 'Rejected when < 0. DB default 25.'
        focusMaxBlockMinutes:
          type: integer
          minimum: 0
          description: >
            Rejected when < 0. DB default 120. PAC-24 adds the cross-property
            check focusMinBlockMinutes <= focusMaxBlockMinutes, which OpenAPI
            cannot express; it is a 400 (API-082).
        focusDailyTargetMinutes:
          type: integer
          minimum: 0
          description: 'Rejected when < 0. DB default 240.'
        outOfHoursMeetingsPerWeek:
          type: integer
          minimum: 0
          description: >
            Weekly allowance of meetings outside working hours. 0 disables
            out-of-hours scheduling entirely (canScheduleOutOfHours returns
            false when <= 0).
        autoDeclineOutsideWorkingHours:
          type: boolean
        focusLabel:
          type: string
          description: 'DB default `Focus Time`.'
        focusColor:
          type: string
          description: 'Hex colour string. Not validated. DB default `#4F46E5`.'
        lunchStart:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
          description: >
            `HH:MM` or `""`. DB default `12:00`. Legacy global; overridden
            per-day by lunchBreaks. `""` here is the strongest case of the four:
            it is not merely tolerated but LOAD-BEARING. `LunchWindow` returns
            `enabled: false` precisely when `lunchStart` or `lunchEnd` is empty
            (`backend/storage/settings.go:141-142`), so `""` is how "this user
            has no protected lunch" is represented. Forbidding it in the schema
            would make an existing, meaningful state unrepresentable.
        lunchEnd:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
          description: >
            `HH:MM` or `""`, as `lunchStart`. DB default `13:00`. PAC-24 adds the
            cross-property check lunchEnd > lunchStart as a 400 (API-082),
            applied only when both values are non-empty.
        protectLunch:
          type: boolean
          description: 'DB default true.'
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          description: 'Rejected when < 0. DB default 5.'
        bufferAfterMinutes:
          type: integer
          minimum: 0
          description: 'Rejected when < 0. DB default 5.'
        bufferEnabled:
          type: boolean
        bufferMinMeetingMinutes:
          type: integer
          minimum: 0
          description: >
            PAC-24 adds the `>= 0` check its two siblings already had; before
            that a negative value was accepted here alone (API-082).
        bufferSkipBackToBack:
          type: boolean
        workingHours:
          $ref: '#/components/schemas/WorkingHoursSchedule'
        lunchBreaks:
          $ref: '#/components/schemas/LunchBreakSchedule'
        compressionEnabled:
          type: boolean
        autoScheduleEnabled:
          type: boolean
        autoScheduleCron:
          type: string
          description: >
            5-field cron (minute hour dom month dow), parsed with
            robfig/cron v3 using exactly those five fields. Empty string skips
            validation. DB default `0 8 * * *`.
        llmProvider:
          type: string
          enum: ['', openai, anthropic, ollama, bedrock, azure_openai, vertex]
          description: Empty string is explicitly allowed by validLLMProviders.
        llmModel:
          type: string
          description: >
            Provider default applied at call time when empty: `gpt-4o-mini`
            (openai), `claude-haiku-4-5-20251001` (anthropic).
        llmApiKeySet:
          type: boolean
          readOnly: true
          description: >
            `true` exactly when the stored key is non-empty. This is the only
            thing a reader learns about the key, and it is what lets a client
            distinguish "not configured" from "configured" without disclosing
            anything (spec AC-12).

            `readOnly`, so a client that submits back a document it just read
            may include it; it is accepted and ignored (spec AC-10). It is NOT
            the way to clear a key - send `llmApiKey: ""` for that.
        llmBaseUrl:
          type: string
          description: >
            Base URL of the `openai` or `anthropic` destination; `""` means the
            vendor's public host (`https://api.openai.com`,
            `https://api.anthropic.com`). Also Ollama's fallback when
            `ollamaBaseUrl` is `""`. PAC-66-B: a write changing it to a
            non-empty value must be exactly `<scheme>://<host>[:<port>]` (at
            most one trailing `/`) and approved for at least one of `openai`,
            `anthropic`, `ollama` (400 otherwise); a request is sent to it only
            for a provider it is approved for (see `testLLMConnection`). The
            web app writes this property from its Ollama field. No `pattern`,
            for the reason given on `awsRegion`.
        awsRegion:
          type: string
          description: >
            Bedrock region. Empty means the built-in `us-east-1`, applied as an
            explicit region that overrides the deployment's AWS region
            configuration (spec D-7). PAC-66: a write changing it to a
            non-empty value must be a valid region name (one host label); the
            Bedrock host the SDK resolves is sent to only if approved in
            `PACEDAY_LLM_APPROVED_HOSTS_BEDROCK`. Deliberately no `pattern`:
            this map is shared with `Settings`, and rows stored before PAC-66
            are kept as they are (spec D-3), so a pattern would make the
            response schema false for them.
        awsProfile:
          type: string
          description: >
            Named profile in the deployment's AWS shared config. Not checked by
            PAC-66 (spec OQ-4): it selects which deployment identity signs, but
            any endpoint it configures is still subject to the Bedrock
            approved-host check at send time.
        bedrockModel:
          type: string
        azureEndpoint:
          type: string
          description: >
            Azure OpenAI resource endpoint, e.g.
            `https://my-resource.openai.azure.com`. PAC-66: a write changing it
            to a non-empty value must be an `https` URL whose host is approved
            in `PACEDAY_LLM_APPROVED_HOSTS_AZURE_OPENAI` (400 otherwise). `""`
            is always accepted and means "not set", which is refused when a
            request would be sent. The path is not constrained (see
            `contracts/features/PAC-66.md` §7). No `format` or `pattern`, for
            the reason given on `awsRegion`.
        azureDeployment:
          type: string
        azureApiVersion:
          type: string
        gcpProject:
          type: string
        gcpLocation:
          type: string
          description: >
            Vertex region, e.g. `europe-west4`. Empty means the built-in
            `us-central1`. The server builds the host
            `<gcpLocation>-aiplatform.googleapis.com` from it. PAC-66: a write
            changing it to a non-empty value must build a host approved in
            `PACEDAY_LLM_APPROVED_HOSTS_VERTEX` (400 otherwise), so a value that
            changes the URL's authority (`attacker.example/x`) is refused. The
            same check is made when a request would be sent, including for
            `""`. No `pattern`, for the reason given on `awsRegion`.
        vertexModel:
          type: string
        ollamaBaseUrl:
          type: string
          description: >
            Falls back to llmBaseUrl, then `http://localhost:11434`. Stored as
            `http://localhost:11434` on a new account (migration 002), so it is
            Ollama's destination until cleared. PAC-66-B: a write changing it to
            a non-empty value must be exactly `<scheme>://<host>[:<port>]` (at
            most one trailing `/`) and an origin approved in
            `PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA` (400 otherwise); the same
            check is made whenever an Ollama request would be sent. No
            `pattern`, for the reason given on `awsRegion`.
        ollamaModel:
          type: string
          description: 'Falls back to llmModel, then `llama3.2`.'
        calendarProvider:
          type: string
          enum: [google, outlook, webcal]
          description: >
            DB default `google`. Which calendar the product reads and writes for
            THIS user.

            Resolves U-18. The authoritative set was settled by reading the three
            consumers that switch on this value - calendar.NewProvider
            (`backend/calendar/client_factory.go:16,22,27`), the auth-status
            handler (`backend/api/handlers_auth.go:97,105,111`) and the free/busy
            service (`backend/engine/freebusy_service.go:122`). All three accept
            exactly `outlook` and `webcal` and treat every other value, including
            a typo, as Google. PAC-24 enforces the set; before it, an unknown
            value was stored and silently behaved as `google`.

            Before PAC-24 this was a property of the singleton row, so one user
            connecting Outlook switched the whole deployment
            (`backend/auth/microsoft_oauth.go:57` writes
            `calendar_provider = 'outlook' WHERE id = 1`).
        webcalUrl:
          type: string
        calendarEmail:
          type: string
          description: >
            The address of THIS user's connected calendar. Before PAC-24 the
            auth-status handler served the singleton row's value to everyone
            (API-009).
        conferencingProvider:
          type: string
          enum: [meet, zoom, teams]
          description: >
            Read with `COALESCE(conferencing_provider,'meet')`; conference.NewProvider
            switches on `zoom`, `teams`, and treats everything else as `meet`.
            So the wire values are `meet` / `zoom` / `teams`, not the frontend's
            `google_meet` / `zoom` / `teams` / `custom`. PAC-24 enforces the set
            for the same reason as calendarProvider: an unknown value was stored
            and silently behaved as `meet`.
        recapEnabled:
          type: boolean
        recapSendTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: >
            `HH:MM`, in the same form on read and on write. **STRICT: unlike the
            four legacy clock properties above, `""` is NOT admitted here, in
            either direction.** The three reasons are specific to this column and
            do not generalise:

            (a) There is no empty state to represent. The column is
            `TIME NOT NULL DEFAULT '08:00'` (`015_daily_recap.up.sql:3`), and the
            write path passes every value through
            `recapSendTimeOrDefault` (`backend/storage/settings.go:356-361`),
            which turns `""` into `08:00`. So no row can hold an empty send time
            and no GET can return one - the `COALESCE(...,'')` at `:224` and
            `:439` is defensive and unreachable. This is the difference from
            `workStart`/`lunchStart`, where `""` both exists in the data and
            carries meaning.

            (b) Admitting `""` would make this contract lie about its own merge
            rule. `PATCH /api/settings` states that a property present is set to
            exactly the value given; `""` here would instead be silently
            rewritten to `08:00`. A client asking to clear a value and being told
            `200` while the server stored something it did not ask for is the
            exact silent-success failure mode this contract refuses for `null`.

            (c) PAC-24 therefore removes the substitution: `""` is a 400
            (`recapSendTime must be in HH:MM format`), which is the same message
            spec AC-17 already requires for a malformed value and which AC-16
            requires instead of an internal failure.

            **This requires a narrow amendment to spec AC-7**, which as written
            says an empty value of a setting's type always clears it. AC-7 must
            exempt `recapSendTime` on the ground that it has no empty state. The
            contract author may not edit the spec; the amendment is named in
            `contracts/features/PAC-24.md` §"Revision 2" and must be made before
            stage 3.

            Resolves U-19, and resolves it by CHANGING the server rather than by
            documenting what it did. The column is Postgres `TIME`
            (`015_daily_recap.up.sql:3`) and was read as `recap_send_time::TEXT`,
            which renders `HH:MM:SS` (`08:00:00`, with a fractional part when one
            was stored) - contradicting the struct comment that claims `HH:MM`
            and contradicting the write format, so no client could round-trip
            this value. PAC-24 renders the column to `HH:MM` on read and rejects
            anything else on write. Note: the marker was originally to be settled
            by observing a live response; it is settled here by fixing the
            asymmetry instead, which makes the observation unnecessary. Spec
            AC-16 is the integration test that proves the rendered form.
        recapSendTo:
          type: string
          enum: [dm, channel]
          description: >
            DB CHECK constraint enforces this. PAC-24 validates it on the settings
            write too; before that only the daily-recap PATCH did, so a bad value
            sent to PUT /api/settings reached the DB CHECK and surfaced as a 500
            (API-081).
        recapChannelId:
          type: string
        recapIncludeBriefs:
          type: boolean
          description: 'DB default true.'
        recapIncludeFocus:
          type: boolean
          description: >
            DB default true. Exposed as `include_focus_blocks` by the daily-recap
            endpoints.
        recapIncludeHabits:
          type: boolean
          description: 'DB default true.'
        timeFormat:
          type: string
          enum: ['12h', '24h']
          description: >
            How the signed-in web app shows times of day to this user (PAC-55):
            `12h` ("2:30 PM", the default, exactly as before PAC-55) or `24h`
            ("14:30", two-digit hour, no AM/PM). DB default `12h`; a user who
            never chose reads `12h`. There is no "unset": `""` and any other
            STRING are a 400 `timeFormat must be 12h or 24h`; a non-string
            (`24`, `true`, `["24h"]`) fails decoding first and is a 400
            `invalid JSON: timeFormat has the wrong type`; `null` is a 400 like every
            property of this body. Display only: the server formats
            nothing with it, and the public booking page ignores it (always
            12-hour, PAC-55 §5).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: >
            Server-managed (NOW() on every write). May be present in a request
            body - a client submitting back a document it just read will include
            it - and is ignored (spec AC-10).
      required:
        - workStart
        - workEnd
        - timezone
        - focusMinBlockMinutes
        - focusMaxBlockMinutes
        - focusDailyTargetMinutes
        - outOfHoursMeetingsPerWeek
        - autoDeclineOutsideWorkingHours
        - focusLabel
        - focusColor
        - lunchStart
        - lunchEnd
        - protectLunch
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - bufferEnabled
        - bufferMinMeetingMinutes
        - bufferSkipBackToBack
        - workingHours
        - lunchBreaks
        - compressionEnabled
        - autoScheduleEnabled
        - autoScheduleCron
        - llmProvider
        - llmModel
        - llmApiKeySet
        - llmBaseUrl
        - awsRegion
        - awsProfile
        - bedrockModel
        - azureEndpoint
        - azureDeployment
        - azureApiVersion
        - gcpProject
        - gcpLocation
        - vertexModel
        - ollamaBaseUrl
        - ollamaModel
        - calendarProvider
        - webcalUrl
        - calendarEmail
        - conferencingProvider
        - recapEnabled
        - recapSendTime
        - recapSendTo
        - recapChannelId
        - recapIncludeBriefs
        - recapIncludeFocus
        - recapIncludeHabits
        - timeFormat
        - updatedAt
      additionalProperties: false

    SettingsUpdate:
      type: object
      description: >
        PATCH /api/settings body - the only settings write. Nothing is required:
        a property absent means "leave it as it is", and `{}` is a valid no-op
        request. A property present is applied exactly as given - `""`, `0` and
        `false` are values, not absences, except where a property's enum or
        pattern excludes `""` (`recapSendTime`, `recapSendTo`,
        `calendarProvider`, `conferencingProvider`, `timeFormat`), where `""` is a 400 like
        any other value outside the set (spec AC-7 as amended 2026-10-12).

        The same properties as `Settings` (one YAML anchor) plus the write-only
        `llmApiKey`. `llmApiKeySet` and `updatedAt` are accepted and ignored, so
        a document read from GET can be submitted back unchanged (spec AC-10).

        No property is nullable: `null` is a 400 `<property> must not be null`
        and an unknown property - including a snake_case spelling of a real one
        - is a 400 `unknown property: <name>` (spec AC-8). These are enforced
        by the handler, not by a generated validator.

        Validation applies to the properties whose value the body CHANGES. A
        property sent with the value already stored is not re-validated, so a
        GET document submitted back unchanged is always accepted - including a
        legacy combination a newer cross-property rule would reject (an end
        before a start, a focus minimum above the maximum) - and a stored value
        never locks the user out of saving something else (challenge r2,
        finding 2).

        `workingHours` is ONE property and is replaced whole, so a write that
        changes it must make the whole document valid: both its `default` and
        its `days`, whatever the mode. That includes a `default` the client
        derived from legacy values - for a row whose mode was `""` the server
        derives it from `workStart`/`workEnd` on read - so a client switching
        such a row to `by_day` must send a valid `default` (revision 6).

        `workingHours` and `lunchBreaks` are replaced whole when present, not
        deep-merged (spec AC-9).

        Before PAC-24 this was the body of `PUT /api/settings`, a replace: every
        omitted property was persisted as its Go zero value (API-004). That
        operation is removed because the two repositories deploy together
        (spec PAC-24, Decisions 2026-10-12, OQ-3).
      properties:
        <<: *settingsProperties
        llmApiKey:
          type: string
          writeOnly: true
          description: >
            WRITE-ONLY. Accepted on write; never present in any response from
            any operation (spec AC-11). Required for openai and anthropic.

            Under the merge semantics this needs no special case: omit it and
            the stored key is unchanged; send `""` and it is cleared; send a
            value and it is replaced (spec AC-13). There is no way to read it
            back, by design - someone who loses their key re-enters it. Do not
            add a reveal affordance later.

            Before PAC-24 it was returned in cleartext from a row shared by every
            authenticated account (API-002 + API-003), and wiped by any write that
            omitted it (API-004). Every key configured before this ships must be
            treated as compromised and rotated - closing the read path does not
            un-expose it (spec §5, OQ-5).
      additionalProperties: false

    # ----------------------------------------------------------- daily recap

    DailyRecapSettings:
      type: object
      description: >
        Hand-built map in dailyRecapHandlers.getSettings. snake_case, and the
        key names do not mirror the camelCase Settings keys one-to-one.
      properties:
        enabled:
          type: boolean
          description: settings.recapEnabled
        send_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: >
            settings.recapSendTime, `HH:MM`. PAC-24 pins the rendered form; it
            was `HH:MM:SS` here too (U-19).
        send_to:
          type: string
          enum: [dm, channel]
          description: settings.recapSendTo
        channel_id:
          type: string
          description: settings.recapChannelId
        include_briefs:
          type: boolean
          description: settings.recapIncludeBriefs
        include_focus_blocks:
          type: boolean
          description: settings.recapIncludeFocus (name differs)
        include_habits:
          type: boolean
          description: settings.recapIncludeHabits
      required:
        - enabled
        - send_time
        - send_to
        - channel_id
        - include_briefs
        - include_focus_blocks
        - include_habits
      additionalProperties: false

    DailyRecapPatch:
      type: object
      description: >
        api.recapSettingsBody. A property absent means "leave unchanged"; a
        property present is applied.

        PAC-24 makes two changes to what this document permits, both to align it
        with PATCH /api/settings. `null` is no longer accepted anywhere: the Go
        fields are pointers, so `null` used to be indistinguishable from an
        omission, which meant a client that meant to clear something and a client
        with a serialisation bug got the same silent success. And an unknown
        property is now rejected rather than ignored, which is how a caller
        learns it has misspelt one of these seven snake_case names.
      properties:
        enabled:
          type: boolean
        send_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: >
            `HH:MM`. PAC-24 validates it; before that an unparseable value
            reached the Postgres TIME cast during the save and surfaced as a 500
            `db error`.
        send_to:
          type: string
          enum: [dm, channel]
          description: Anything else -> 400 (text/plain).
        channel_id:
          type: string
        include_briefs:
          type: boolean
        include_focus_blocks:
          type: boolean
        include_habits:
          type: boolean
      additionalProperties: false

    DailyRecapPreview:
      type: object
      description: 'Literal `{"blocks": [...]}`.'
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/SlackBlock'
      required: [blocks]
      additionalProperties: false

    SlackBlock:
      type: object
      description: >
        engine.slackBlock is `map[string]interface{}` - an untyped Slack Block Kit
        object. Nested values are themselves slackBlocks or arrays of them.

        Resolves U-20 by reading engine/daily_recap.go end to end. Every
        top-level block this API can emit is built by
        DailyRecapService.BuildMessage (`:150-236`), buildSummaryBlock
        (`:238-262`) or buildMeetingBlocks, and the complete set of top-level
        `type` values is `header`, `context`, `section`, `divider`. The only
        nested text object types are `plain_text` and `mrkdwn`.

        `additionalProperties` stays `true`: the member set of a block varies by
        type (`text`, `elements`, `emoji`), the Go type is a bare map, and
        pinning the members would be a stricter claim than the code supports.
        The `type` enum is the part that was actually determinable, and it is the
        part a client switches on. PAC-24 changes none of this behaviour - only
        what the contract says about it.
      properties:
        type:
          type: string
          enum: [header, context, section, divider]
      additionalProperties: true

    DailyRecapTestResult:
      type: object
      description: 'Literal `{"ok": true, "slack_message_ts": "..."}`.'
      properties:
        ok:
          type: boolean
          description: Always literal `true` on the 200 path.
        slack_message_ts:
          type: string
          description: Slack message timestamp returned by chat.postMessage.
      required: [ok, slack_message_ts]
      additionalProperties: false
