# Domain: scheduling
# Source of truth: backend/api/routes.go, handlers_focus.go, handlers_schedule.go,
# handlers_nlp.go, handlers_llm.go, handlers_settings.go, handlers_daily_recap.go,
# backend/engine/{focus_time,compression,smart_schedule,daily_recap}.go,
# backend/nlp/{parser,llm_factory}.go, backend/storage/settings.go.
#
# All routes below are registered inside the `requireAuth(jwtSecret)` chi group in
# routes.go, so they inherit the global default security scheme (no per-operation
# `security` key is written here, by instruction).
#
# Two distinct error encodings exist in this domain and are NOT interchangeable:
#   * writeError()  -> application/json, body {"error": "<msg>"}  (handlers_settings.go:206)
#   * http.Error()  -> text/plain; charset=utf-8, body "<msg>\n"  (Go stdlib overwrites
#                      any Content-Type the handler set beforehand)
# Each response below states which one the handler actually uses.
#
# Nil-slice caveat: Go encodes a nil slice as JSON `null`, not `[]`. Every array-typed
# field produced by these handlers from an un-appended slice is therefore nullable.

paths:
  /api/focus/run:
    post:
      operationId: runFocus
      tags: [focus]
      summary: Run the focus-time engine for a week
      description: >
        Creates focus blocks for the target week. The body is optional: an
        absent or empty body (zero bytes or only whitespace) and the JSON
        literal `null` are treated as `{}`, i.e. the current week. Any other
        body that does not decode into FocusRunRequest is a 400 `invalid JSON`:
        a syntax error, a non-object top-level value (array, string, number,
        boolean), or a member of the wrong type such as `{"week":5}`. Before
        PAC-36 such a body was silently treated as `{}` and answered 200 for the
        current week (API-035). Only the first JSON value is read; bytes after
        it are not inspected, as on every sibling endpoint. A non-empty `week`
        that fails `time.Parse("2006-01-02", ...)` is a 400 `invalid week format,
        use YYYY-MM-DD`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusRunRequest'
      responses:
        '200':
          description: Focus run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusRunResult'
        '400':
          description: >
            `invalid JSON` (the body is present, is not `null`, and does not
            decode into FocusRunRequest; PAC-36, API-035) or `invalid week format,
            use YYYY-MM-DD`. Fixed messages, JSON error shape (writeError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Engine failure for a user who HAS a stored Google credential (a user with none
            gets the 401 `calendar not connected`). Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/focus/blocks:
    get:
      operationId: listFocusBlocks
      tags: [focus]
      summary: List persisted focus blocks for a week
      description: >
        Returns the caller's rows from the `focus_blocks` table (`user_id` = the
        authenticated user) where `date >= week AND date < week+7days`, ordered by
        start_time. Other users' blocks are never listed.
        Keys are snake_case (`id`, `google_event_id`, `start_time`, `end_time`,
        `date`, `created_at`) from explicit json tags on `storage.FocusBlock`
        (PAC-26, API-014). Before PAC-26 the struct had no tags and the encoder
        emitted the Go field names (`ID`, `GoogleEventID`, `StartTime`, ...),
        which the web app's FocusBlock type could not read.
      parameters:
        - name: week
          in: query
          required: false
          description: >
            Week anchor date, format `YYYY-MM-DD` (Go layout "2006-01-02").
            Omitted or empty -> `time.Now()`. The value is used verbatim as the
            lower bound; it is NOT snapped to Monday (unlike
            POST /api/schedule/compress, which does snap via startOfWeek()).
          schema:
            type: string
            format: date
            example: '2025-01-06'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: >
            Focus block rows. `[]` when the week has no rows (PAC-28).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FocusBlockRecord'
        '400':
          description: '`invalid week format` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '500':
          description: >-
            DB failure. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    delete:
      operationId: clearFocusBlocks
      tags: [focus]
      summary: Delete the focus blocks of a week
      description: >
        Deletes the caller's focus blocks for the Monday-anchored week containing
        `week`, from the caller's calendar and from storage. Other users' blocks
        are not touched and not counted.
      parameters:
        - name: week
          in: query
          required: false
          description: >
            Week anchor date, `YYYY-MM-DD`. Omitted -> `time.Now()`.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Number of deleted blocks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusClearResult'
        '400':
          description: '`invalid week format` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Engine failure for a user who HAS a stored Google credential (a user with none
            gets the 401 `calendar not connected`). Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/schedule/compress:
    post:
      operationId: previewCompression
      tags: [schedule]
      summary: Preview meeting-compression proposals
      description: >
        Read-only: computes proposals, moves nothing.
        The body is optional: an absent or empty body (zero bytes or only
        whitespace) and the JSON literal `null` are treated as `{}`, i.e. today.
        Any other body that does not decode into CompressionRequest is a 400
        `invalid JSON` (a syntax error, a non-object top-level value, or a member
        of the wrong type). Before PAC-36 the decode error was discarded and such
        a body answered 200 for today (API-035). Only the first JSON value is read.
        If `week` is set it wins over `date`: the handler snaps the parsed date to
        Monday (startOfWeek) and computes Mon..Fri in order. A 200 in week mode
        carries exactly five CompressionResult entries, one per day, Monday
        first; a non-working day is an entry with no proposals, not a missing
        entry. If ANY day's computation fails, the whole request fails exactly as
        single-day mode fails (401 CalendarNotConnected or 500 `internal error`)
        and no per-day results are returned. Before PAC-36 week mode skipped every
        failing day and answered 200 with the survivors, `[]` if all five failed,
        which a client cannot tell apart from "nothing to compress" (API-034).
        If `week` is empty, `date` (or today) produces a single-element array and
        an engine error is the 500.
        A caller with no stored Google credential gets the 401 `calendar not connected`
        in BOTH modes, before any day is computed (PAC-21, API-054).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressionRequest'
      responses:
        '200':
          description: >
            Array of per-day results: exactly one entry in single-day mode,
            exactly five (Mon..Fri, in that order) in week mode. Never `[]`
            (PAC-36: a week in which a day failed is an error response, not a
            shorter array).
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 5
                items:
                  $ref: '#/components/schemas/CompressionResult'
        '400':
          description: >
            `invalid JSON` (the body is present, is not `null`, and does not
            decode into CompressionRequest; PAC-36, API-035), `invalid week
            format` or `invalid date format`. Fixed messages, JSON error shape
            (writeError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Both modes: an engine failure for a user who HAS a stored Google credential
            (a user with none gets the 401 `calendar not connected`), on the single day
            or on any one of the five week days (PAC-36, API-034: week mode no longer
            skips it); or reading the credential store failed (checked before any day is
            computed). Body: `{"error":"internal error"}`, with no per-day results and no
            indication of which day failed. The detail is written to the server log and
            Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/schedule/compress/apply:
    post:
      operationId: applyCompression
      tags: [schedule]
      summary: Apply selected move proposals
      description: >
        The request proposal objects are snake_case (`event_id`,
        `proposed_start`, `proposed_end`) even though the CompressionResult
        proposals returned by /api/schedule/compress are camelCase. Only these
        three fields are read; any other field on the posted object is ignored.
        A proposal whose start or end fails RFC3339 parsing is NOT an error: it
        is dropped and `"<event_id>: invalid time format"` is appended to
        `failed` (confirmed by TestApplyCompress_InvalidTime, which expects 200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressionApplyRequest'
      responses:
        '200':
          description: Applied / failed event ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompressionApplyResult'
        '400':
          description: '`invalid JSON` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Engine Apply() failure for a user who HAS a stored Google credential (a user
            with none gets the 401 `calendar not connected`). Body: `{"error":"internal
            error"}`. The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/schedule/suggest:
    post:
      operationId: suggestMeetingSlots
      tags: [schedule]
      summary: Suggest meeting slots
      description: >
        `range_start` and `range_end` are both mandatory and must parse as
        RFC3339; either one failing yields a single 400. `duration_minutes`,
        `attendees` and `title` are optional as far as the handler is concerned
        (no validation) - `duration_minutes: 0` produces zero-length candidate
        slots rather than an error.
        The engine walks candidate starts in 30-minute steps
        (engine/smart_schedule.go: `t = t.Add(30 * time.Minute)`) and returns at
        most 3 slots, each at least 1h apart (pickTopUnique(candidates, 3, time.Hour)).
        There is no 15-minute increment rule on this route: every step in
        engine/smart_schedule.go (lines 113, 121 and 135) is 30 minutes, so
        every suggested start is the start of a free interval (`range_start` or
        the end of a busy interval) plus a multiple of 30 minutes. The 15-minute stepping in
        engine/booking.go, engine/habits.go and engine/team_availability.go
        backs other domains. U-07 resolved by PAC-21 from the engine, to be
        pinned by TestSmartScheduler_Suggest_StepsThirtyMinutes (AC-6, written
        in the backend PR before the code); assumed by the
        factory, pending owner confirmation that no 15-minute rule was intended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSuggestRequest'
      responses:
        '200':
          description: Ranked slot suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSuggestions'
        '400':
          description: >
            `invalid JSON`, or
            `invalid range_start or range_end (use RFC3339)` - JSON error shape
            (writeError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Engine error (freebusy failure or settings load) for a user who HAS a stored
            Google credential (a user with none gets the 401 `calendar not connected`):
            `{"error":"internal error"}`; or the weekly out-of-hours allowance is spent:
            `{"error":"out-of-hours meeting allowance reached"}` (still a 500, not a 4xx:
            changing that status is not part of this change). The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/schedule/create:
    post:
      operationId: createScheduledMeeting
      tags: [schedule]
      summary: Create a meeting at an explicit time
      description: >
        `start` and `end` must both parse as RFC3339. The handler builds an
        `engine.ScheduleRequest` WITHOUT `duration_minutes` (the slot carries the
        times) and calls SmartScheduler.CreateMeeting, which refuses out-of-hours
        creation once the weekly allowance is spent - that refusal surfaces as a
        500 with the text `out-of-hours meeting allowance reached`, not a 4xx.
        On success an audit row `meeting_created` is written.
        The response body is the created event flattened by toCalendarEventDTO:
        the CalendarEvent DTO, the same shape as one element of
        GET /api/calendar/events, never Google's own keys (`summary`,
        `start.dateTime`, `hangoutLink`). PAC-29 (API-017, U-14): until PAC-29's
        implementation lands the server still encodes the raw `calendar/v3.Event`
        here, so this response describes the server after that PR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreateRequest'
      responses:
        '200':
          description: >-
            The created event as the CalendarEvent DTO (PAC-29). Room resource
            attendees are dropped from `attendees` / `attendee_details`, as in the
            list; `attendees` is omitted when there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          description: >
            `invalid JSON`, or `invalid start or end (use RFC3339)` - JSON error
            shape (writeError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            Calendar or engine error for a user who HAS a stored Google credential (a user
            with none gets the 401 `calendar not connected`): `{"error":"internal error"}`;
            or the weekly out-of-hours allowance is spent: `{"error":"out-of-hours meeting
            allowance reached"}`. The detail is written to the server log and Sentry only
            (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/nlp/parse:
    post:
      operationId: parseNaturalLanguage
      tags: [nlp]
      summary: Parse a natural-language scheduling request
      description: >
        A malformed body and an empty `text` are collapsed into the same 400
        (`missing text field`). Note that LLM-level failures inside the parser
        do NOT surface as 5xx: the parser returns
        `{"intent":"unknown","error":"..."}` with HTTP 200. A 500 only occurs
        when Parse() itself returns a non-nil error.

        **NEW-llm-bring-your-own: "AI not configured" is an answer, not an
        error.** Before anything is sent, the server decides which AI
        configuration the request runs on, by the table in
        `docs/specs/NEW-llm-bring-your-own.md` §3 (summarised on
        `AINotConfigured`). When the caller has none, the answer is 200 with
        `intent: "unknown"`, `error` a sentence saying that AI features are
        off, why and who can turn them on, and `not_configured` carrying the
        same facts for a client to act on without reading the sentence (spec
        AC-13). Nothing is sent to any host (spec AC-10, AC-11, AC-40).
        `not_configured` is present ONLY in that case, so its presence is how
        a client tells "AI not configured" apart from "the model did not
        understand you" (both are `intent: "unknown"`). A client that reads
        only `intent` and `error` (the web bar before this change, the MCP tool
        `clockwise_parse_command`) still shows a sentence.

        A configured request uses only the caller's own key-based provider
        with the key bound to that provider (see `testLLMConnection` for the
        provider modes). No identity of the machine Paceday runs on (AWS
        default credential chain or shared profile, Azure
        DefaultAzureCredential, Google Application Default Credentials) and no
        deployment-level key is ever used (spec O-2, O-3, AC-1, AC-2).

        A destination refusal on a configured caller (PAC-66, PAC-66-B) is
        unchanged: 200 `{"intent":"unknown","error":"<sentence>"}`, with no
        `not_configured`, and nothing sent.

        **Part 2 (spec `docs/specs/NEW-llm-bring-your-own-part2.md`,
        revision 1).** In row 4 the request uses the caller's organisation's
        configuration and nothing of the caller's (parent D-18): exactly the
        values of the `configurationVersion` the caller's stored confirmation
        names. The configuration and the confirmation are read as one
        consistent state; when the stored configuration's version is not the
        confirmed one (an administrator changed it before or while the
        request was decided), the answer is row 5 and nothing is sent. No
        request sends values of another version or combines values of two
        versions (spec P2-AC-37). In row 5 the caller has not confirmed the
        organisation's current configuration: the not-configured 200, nothing
        sent until they confirm in Paceday (owner O-13;
        confirmOrganizationAI). In row 10 (personal keys forbidden, the
        caller on their own provider) nothing is sent until the caller
        chooses "Use my organisation's AI" (patchSettings `llmProvider:
        organization`) and confirms (spec P2-D2, current default). Row 9 is
        reserved and never answered (see AINotConfigured). In row 4 a
        destination refusal's sentence names the organisation's AI
        destination and its administrator, never the caller's own Settings
        (spec P2-AC-41). The MCP tool `clockwise_parse_command` receives the
        same body; no MCP tool confirms (spec P2-AC-33).

        **No provider error text reaches the caller from the organisation's
        configuration (spec §3.1a, P2-D16, P2-AC-39; contract revision 3).**
        A provider or gateway failure of the parse is the 500 below with the
        fixed `internal error`, in every row (as before Part 2), so no answer
        carries provider or gateway error text. The provider text goes only
        to the server log and Sentry, and before it does every occurrence of
        every key sent with this request (the confirmed version's key in
        row 4, even if an administrator has replaced it since) and of the
        caller's own keys (stored and submitted) is replaced by
        `[redacted]`. That replacement is of exact strings: an encoded or
        partial echo of a key can still reach the server log or Sentry
        (operator-only; spec §5), never an answer.

        API-080 is fixed here (spec AC-35, D-20): a result with no time range
        carries neither `range_start` nor `range_end`, never
        `0001-01-01T00:00:00Z`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NLPParseRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: >-
            Parse result. Carries `not_configured` when the caller has no AI
            configuration (nothing was sent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NLPParseResult'
              examples:
                notConfigured:
                  value:
                    intent: unknown
                    error: 'AI features are off: no AI provider is set up. Add your own API key in Settings.'
                    not_configured:
                      reason: nothing_configured
                      enablers: [user]
                      message: 'AI features are off: no AI provider is set up. Add your own API key in Settings.'
                organizationUnconfirmed:
                  summary: (Part 2) row 5, the organisation uses OpenAI and the caller has not confirmed
                  value:
                    intent: unknown
                    error: 'AI features are off until you confirm: your organisation provides AI through OpenAI. Your text and meeting details (titles, attendee emails, Slack and Notion excerpts) are sent to your organisation''s AI provider account, which its administrators can access outside Paceday. Confirm in Paceday to turn AI on.'
                    not_configured:
                      reason: organization_unconfirmed
                      enablers: [user]
                      message: 'AI features are off until you confirm: your organisation provides AI through OpenAI. Your text and meeting details (titles, attendee emails, Slack and Notion excerpts) are sent to your organisation''s AI provider account, which its administrators can access outside Paceday. Confirm in Paceday to turn AI on.'
                personalKeysForbidden:
                  summary: (Part 2) row 10, the caller is on their own OpenAI key and the organisation forbids personal keys
                  value:
                    intent: unknown
                    error: 'AI features are off: your organisation does not allow personal API keys, so your own OpenAI key is kept but not used. Choose "Use my organisation''s AI" in Settings to use your organisation''s AI.'
                    not_configured:
                      reason: personal_keys_forbidden
                      enablers: [user]
                      message: 'AI features are off: your organisation does not allow personal API keys, so your own OpenAI key is kept but not used. Choose "Use my organisation''s AI" in Settings to use your organisation''s AI.'
        '400':
          description: '`missing text field` - JSON error shape (writeError).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '500':
          description: >-
            Parse() returned an error, including (NEW-llm-bring-your-own) when the
            caller's settings could not be loaded or the caller's organisation membership
            could not be read, so which AI configuration applies could not be decided; in
            that case nothing was sent. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21). "AI not configured" is
            never a 500; it is the 200 with `not_configured`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/nlp/confirm:
    post:
      operationId: confirmNaturalLanguage
      tags: [nlp]
      summary: Create the meeting for a chosen parsed slot
      description: >
        The whole ParseResult from /api/nlp/parse is echoed back. Only
        `title`, `attendees`, `constraints` (mapped to the event Description)
        and `suggested_slots[selected_slot_index]` are used; `duration_minutes`,
        `range_start`, `range_end`, `preferred_times` and `avoid_times` are
        ignored here. On success an audit row `nlp_confirmed` is written and the
        created event is returned as the CalendarEvent DTO (toCalendarEventDTO, the
        same shape as GET /api/calendar/events), never Google's own keys. PAC-29
        (API-017, U-14): until PAC-29's implementation lands the server still encodes
        the raw `calendar/v3.Event` here, so this response describes the server
        after that PR.
        A NEGATIVE `selected_slot_index` is a 400 `invalid selected_slot_index`, like
        an index past the end. Before PAC-21 was finished it passed the bounds check,
        indexed the slice out of range and panicked; the panic was re-raised by
        sentryMiddleware, so net/http aborted the response with no status and no body
        at all. That was U-06 / API-024, resolved here: a crash is not a contract to
        preserve, and the 400 is the response the handler already gives every other
        out-of-range index.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NLPConfirmRequest'
      responses:
        '200':
          description: >-
            The created event as the CalendarEvent DTO (PAC-29). Room resource
            attendees are dropped from `attendees` / `attendee_details`, as in the
            list; `attendees` is omitted when there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          description: >
            `invalid JSON`, or `invalid selected_slot_index` (empty slot list,
            index < 0, or index >= len). JSON error shape (writeError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          $ref: '#/components/responses/CalendarNotConnected'
        '500':
          description: >-
            CreateMeeting failed for a user who HAS a stored Google credential (a user with
            none gets the 401 `calendar not connected`): `{"error":"internal error"}`; or
            the weekly out-of-hours allowance is spent: `{"error":"out-of-hours meeting
            allowance reached"}`. A negative `selected_slot_index` is a 400, never a 500
            (resolves U-06 / API-024). The detail is written to the server log and Sentry
            only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/llm/test:
    post:
      operationId: testLLMConnection
      tags: [llm]
      summary: Probe an AI provider configuration
      description: >
        Probes one AI configuration by issuing a fixed completion
        (system "You are a helpful assistant.", user "Say hello").

        **NEW-llm-bring-your-own: Paceday supplies no credential.** Every
        request this server makes to an AI provider carries a key that the
        caller (or, after Part 2 of the spec, their organisation) entered, and
        nothing else that authenticates. No environment variable, credential
        file, shared profile, metadata service or managed identity of the
        machine Paceday runs on is read for an AI request; in particular the
        AWS default credential chain, Azure DefaultAzureCredential and Google
        Application Default Credentials are not used, and
        `AWS_BEARER_TOKEN_BEDROCK` in the server's environment is ignored
        (spec O-1, O-2, O-3, AC-1, AC-2). Ollama is removed (spec O-4). The
        five providers and how each carries its key (spec D-2, D-3, D-4):

        * `openai`: `Authorization: Bearer <key>`, POST
          `<destination>/v1/chat/completions`.
        * `anthropic`: `x-api-key: <key>`, POST `<destination>/v1/messages`.
        * `azure_openai`: `api-key: <key>` and NO `Authorization` header, POST
          `<azureEndpoint>/openai/deployments/<azureDeployment>/chat/completions?api-version=<azureApiVersion>`
          (spec AC-3).
        * `bedrock`: an Amazon Bedrock API key as `Authorization: Bearer <key>`,
          POST `https://bedrock-runtime.<awsRegion>.amazonaws.com/model/<bedrockModel>/converse`
          (`us-east-1` when `awsRegion` is empty). No SigV4 signature and no
          other AWS credential is sent or loaded (spec AC-4).
        * `vertex`: a Vertex AI express-mode API key in the `x-goog-api-key`
          header, never in the URL, POST
          `https://aiplatform.googleapis.com/v1/publishers/google/models/<vertexModel>:generateContent`.
          No project or location is used (spec AC-5).

        **Model IDs in the path.** `<bedrockModel>` and `<vertexModel>` are each
        sent as ONE path segment, percent-encoded with the path-segment rule of
        RFC 3986 §3.3 (Go `url.PathEscape`): `/`, `?`, `#`, `%`, `;`, `,`,
        space and every non-ASCII or control byte are encoded; letters,
        digits, `-`, `.`, `_`, `~`, `:`, `@` and the other sub-delimiters are
        sent literally. So the stored default
        `anthropic.claude-sonnet-4-5-20251001-v1:0` is requested as exactly
        `/model/anthropic.claude-sonnet-4-5-20251001-v1:0/converse` (the `:` is
        not encoded, as in the provider's own examples), and a value containing
        `/` (an inference-profile ARN) cannot add a path segment: its `/` is
        sent as `%2F`. For Vertex the `:` before `generateContent` is the
        method separator and is not part of the encoded model segment.

        A key the provider rejects (an expired Bedrock short-term key, a key
        for another region, a revoked key) is a provider failure, the 502, not
        "AI not configured" (spec D-13).

        **Which configuration is probed (spec D-19).** The body may name a
        choice in `llmProvider`:

        * **A provider** (`openai`, `anthropic`, `azure_openai`, `bedrock`,
          `vertex`), saved or not: the probe uses that provider, the caller's
          OWN stored destination values for it, and the submitted `llmApiKey`
          when the body carries one, otherwise the key bound to THAT provider on
          the caller's account (`Settings.llmApiKeysSet`). A key bound to
          another provider, and a key bound to no provider
          (`llmUnboundApiKeySet`), is never used, so "Test connection" on an
          unsaved provider choice never carries the saved provider's key (spec
          AC-37). When there is no key (none bound and none submitted, or
          `llmApiKey: ""`) the answer is the 409 with reason `needs_key` naming
          that provider, and nothing is sent.
        * **`""`** (AI off): the 409 `off`. Nothing is sent.
        * **`unsupported`**: accepted ONLY when the caller's saved choice reads
          as `unsupported` (a stored provider Paceday no longer supports,
          `ollama`), so a client that builds the probe body from the settings
          document it read (`Settings.llmProvider`) gets the same answer as
          `{}` and as the caller's parse: it is decided exactly as the absent
          case below, which for such a row is the 409 of row 7 or 8
          (`provider_removed`, or after Part 2
          `provider_removed_organization_available`). A submitted `llmModel` /
          `llmApiKey` is sent nowhere. When the saved choice does not read as
          `unsupported`, `unsupported` is a 400 (contract challenge
          2026-10-28, blocking 1).
        * **`organization`**: decided as a request of a caller who follows
          their organisation (rows 4-6). In row 4 the probe tests the
          organisation's configuration exactly as the caller's requests use
          it: its provider, model, destination and key at the confirmed
          version, nothing of the caller's (spec D-18). A submitted
          `llmModel` or `llmApiKey` is never combined with an organisation
          configuration: in row 4 it is the 400 below; in rows 5 and 6 it is
          that row's 409; while personal keys are forbidden, a submitted
          `llmApiKey` is the 409 `personal_keys_forbidden` of step 1a. Nothing
          is sent in any of these cases (spec P2-AC-20, P2-AC-28).
        * **Absent**: the caller's SAVED choice, decided exactly as their parse
          and brief refresh would decide it (spec §3 table, AC-40). When the
          saved choice is a provider, a submitted `llmModel` / `llmApiKey`
          replaces the stored model / bound key for this probe only. When it is
          not (`""`, `organization`, `unsupported`), the answer is that row's
          409, and a submitted key is sent nowhere.

        **NEW-llm-bring-your-own Part 2 (spec
        `docs/specs/NEW-llm-bring-your-own-part2.md` §3.5, revision 1).**
        "Names a provider" means `llmProvider` is one of `openai`,
        `anthropic`, `azure_openai`, `bedrock`, `vertex`; `""`,
        `organization` and `unsupported` do not name a provider. Naming a
        provider always probes the caller's OWN configuration for it, even
        when it is the organisation's provider: naming a provider never
        selects the organisation's key (spec P2-D6; this replaces the parent
        spec's "names exactly the organisation's provider" clause). The
        organisation's configuration is probed only by `{}` (saved choice in
        row 4) or `{"llmProvider":"organization"}`, and then the 200's
        `configuration` is `organization`. While the caller's organisation
        forbids personal keys (owner O-12), a probe that names a provider or
        carries `llmApiKey` (whatever `llmProvider` is, including
        `organization` and `unsupported`) is the 409 `personal_keys_forbidden`
        with `enablers: [organization_admin]`, and nothing is sent
        (P2-AC-20). Otherwise a caller whose decided row is 5, 6, 7, 8, 10 or
        11 gets that row's 409; in particular `{"llmProvider":"unsupported"}`
        with a saved `unsupported` choice in an organisation that forbids
        personal keys is row 10 (`[user]`) or 11 (`[organization_admin]`),
        decided as the saved choice. Row 9 is reserved and never answered.

        **No key in provider error text (spec §3.1a, P2-AC-39; contract
        revision 3).** The 502's body is the fixed `upstream provider error`
        in every row, so no answer carries provider or gateway error text.
        The upstream error string goes only to the server log and Sentry,
        after every occurrence of every key sent with this request (in row 4
        the confirmed version's key, even if replaced since) and of the
        caller's keys (stored and submitted) is replaced by `[redacted]`
        (exact strings; an encoded echo can reach those operator-only
        surfaces, spec §5).

        **Order of decisions.** (1) The body's shape: the 400. (1a, Part 2)
        Personal keys forbidden and the body names a provider or carries
        `llmApiKey`: the 409. Step 1a wins over every later step, so a
        confirmed follower's `{"llmApiKey":"…"}` or
        `{"llmProvider":"organization","llmApiKey":"…"}` while forbidden is
        this 409, never the 400 of step 2a (spec §3.5, P2-AC-20; contract
        revision 3). (2) Which configuration, as above: when there is
        none, the 409 and nothing is sent; (2a, Part 2) when it is the
        organisation's (row 4) and the body carries `llmModel` (or, with
        personal keys allowed, `llmApiKey`), the 400. (3) The destination check: the 422 and nothing
        sent. (4) The request: the 200 or the 502. Step 2 precedes step 3, so a caller with no
        key whose stored destination would also be refused gets the 409
        `needs_key`, not the 422: by the spec's table only a configured caller
        sends anything, so only a configured caller's destination is checked.
        This replaces PAC-70's "a refused destination with no key is a 422"
        (`contracts/features/NEW-llm-bring-your-own.md` §6); nothing is sent in
        either case.

        **THE DESTINATION IS NEVER SUPPLIED BY THE CALLER (PAC-24, unchanged).**
        Every value that contributes to the URL - `llmBaseUrl`,
        `azureEndpoint`, `azureDeployment`, `azureApiVersion`, `awsRegion`,
        `bedrockModel`, `vertexModel` - is read from the CALLER'S OWN stored
        settings (in row 4, Part 2: from the organisation's stored
        configuration at the confirmed version, and nothing of the caller's)
        and from nowhere else. The body may carry only `llmProvider`,
        `llmModel` and `llmApiKey`, none of which reaches a URL (`llmModel` is
        a JSON body field of the `openai` and `anthropic` requests only).
        PAC-24 rejected per-property overrides because
        `{"llmProvider":"openai","llmBaseUrl":"https://attacker.example"}`
        would have paired a caller-chosen host with the stored key; that
        argument holds for every key-carrying provider, so the closed body
        stays. The body is REQUIRED: `{}` probes the saved choice, and an
        absent body is a 400.

        **Approved destinations (PAC-66, PAC-66-B; carried, with the changes
        marked NEW).** A request is sent only to a destination the OPERATOR
        approved for the provider in use. No request property and no stored
        setting can add to the approved set, and a destination approved for
        one provider is never one for another.

        * `openai` / `anthropic`: the effective destination is the stored
          `llmBaseUrl`, or the vendor's public host (`https://api.openai.com`,
          `https://api.anthropic.com`, always approved) when it is `""`. Extra
          destinations come from `PACEDAY_LLM_APPROVED_HOSTS_OPENAI` /
          `_ANTHROPIC`. Only `https` on the default port. NEW (owner decision
          O-10, spec AC-18): an operator entry may carry a path prefix
          (`https://gw.example/openai`) for an OpenAI-compatible gateway. A
          stored `llmBaseUrl` is approved when it is exactly an entry's origin
          followed by exactly that entry's prefix (an entry without a prefix
          approves the bare origin only), with at most one trailing `/`, and no
          query, fragment, userinfo or whitespace. The request then goes to the
          prefix followed by the chat operation
          (`https://gw.example/openai/v1/chat/completions`) and to no other
          path. The same host with a different, longer or missing prefix is not
          approved unless another entry for that provider approves it.
        * `azure_openai`: the stored `azureEndpoint`'s host must be in
          `PACEDAY_LLM_APPROVED_HOSTS_AZURE_OPENAI`, `https`, default port; an
          empty endpoint is `destination_not_set`.
        * `bedrock`: `bedrock-runtime.<awsRegion>.amazonaws.com` must be in
          `PACEDAY_LLM_APPROVED_HOSTS_BEDROCK`.
        * `vertex`: NEW, `aiplatform.googleapis.com` must be in
          `PACEDAY_LLM_APPROVED_HOSTS_VERTEX`; otherwise `provider_not_enabled`.
          A regional `<location>-aiplatform.googleapis.com` entry approves
          nothing Paceday sends any more (express mode uses only the global
          host).
        * NEW: a stored `llmBaseUrl` approved for no remaining provider (for
          example an origin once approved for Ollama and written through the
          web's former Ollama field) is kept, and an `openai` / `anthropic`
          request with it is refused before anything is sent, naming
          `llmBaseUrl` (spec D-14, AC-39). It is never replaced by the public
          host.
        * `PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA` approves nothing; a server
          started with it set logs once that it is no longer used (spec AC-19).
        * A redirect is never followed, on any provider; the request that drew
          it counts as failed (the 502), and the key is in that first request
          only. The check is made on every send, not only on write.

        No response on any status carries the submitted key or any stored key
        (PAC-24 AC-14), including the 409. Since PAC-21 the 502 body is the
        fixed `upstream provider error`; the detail goes to the server log
        only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMTestRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: >-
            The configuration probed is configured, its destination is approved, and
            the provider answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMTestResult'
        '400':
          description: >
            Malformed JSON body; a body naming an `llmProvider` outside the
            permitted set (this includes `ollama`, spec AC-6; message
            `llmProvider must be one of: "", organization, unsupported, openai, anthropic, azure_openai, bedrock, vertex`);
            `llmProvider: "unsupported"` when the caller's saved choice does
            not read as `unsupported` (message
            `llmProvider unsupported can be probed only when it is your saved choice`);
            (Part 2) `llmModel` or `llmApiKey` when the probe decided on the
            organisation's configuration (row 4; message
            `llmModel and llmApiKey cannot be used with your organisation's AI configuration`),
            nothing sent;
            or a body carrying any property other than
            `llmProvider`, `llmModel` and `llmApiKey`
            (`additionalProperties: false`). The last case is how a caller
            attempting to supply a destination - `llmBaseUrl`, `azureEndpoint`,
            `awsRegion`, … - is refused, and it must be refused here rather
            than ignored, so that a client is told its override did nothing
            instead of being left to believe it probed what it named.
            JSON error shape (writeError). The response never contains the
            submitted or a stored key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '409':
          description: >
            NEW-llm-bring-your-own. AI is not configured for the configuration
            this probe decided on (table on AINotConfigured, rows 1, 3, 5-8, 10
            and 11), or (Part 2) the probe named a provider or carried a key
            while the caller's organisation forbids personal keys. Nothing was
            sent to any host. `error` is a non-empty sentence describing THE PROBED CHOICE:
            why it cannot be used and who can fix it (a client that reads only
            `error`, as the web settings page did before this change, renders
            it); `notConfigured` carries the same facts for a client to act on.
            When the body names a provider other than the saved one, or carries
            `llmApiKey`, the sentence is about that choice ("Anthropic needs an
            API key"), never "AI features are off": the caller's saved
            configuration may well work (spec AC-37, or `{"llmApiKey": ""}` on a
            configured account). Only when the probe decided on the caller's
            saved choice (absent `llmProvider`, or one equal to the saved
            choice, with no `llmApiKey`) does it say that AI features are off.
            This
            replaces the 500 a caller with no key used to get (spec AC-12).
            409 because the request is well formed and is refused only because
            of the current state of the caller's AI configuration (RFC 9110
            §15.5.10); it is neither a server error nor a provider error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMNotConfiguredResponse'
              examples:
                needsKey:
                  summary: '{"llmProvider":"anthropic"} while the saved choice is OpenAI with a key (spec AC-37)'
                  value:
                    error: 'Anthropic needs an API key. Enter one to test it.'
                    notConfigured:
                      reason: needs_key
                      provider: anthropic
                      enablers: [user]
                      message: 'Anthropic needs an API key. Enter one to test it.'
                savedNeedsKey:
                  summary: '{} by a caller saved on Anthropic with no key bound'
                  value:
                    error: 'AI features are off: Anthropic needs an API key. Add one in Settings.'
                    notConfigured:
                      reason: needs_key
                      provider: anthropic
                      enablers: [user]
                      message: 'AI features are off: Anthropic needs an API key. Add one in Settings.'
                providerRemoved:
                  value:
                    error: 'AI features are off: Ollama is no longer supported. Choose another provider in Settings.'
                    notConfigured:
                      reason: provider_removed
                      enablers: [user]
                      message: 'AI features are off: Ollama is no longer supported. Choose another provider in Settings.'
                personalKeyForbidden:
                  summary: '(Part 2) {"llmProvider":"openai"} while the organisation forbids personal keys'
                  value:
                    error: 'Your organisation does not allow personal API keys, so OpenAI cannot be tested. An administrator of your organisation can change this.'
                    notConfigured:
                      reason: personal_keys_forbidden
                      enablers: [organization_admin]
                      message: 'Your organisation does not allow personal API keys, so OpenAI cannot be tested. An administrator of your organisation can change this.'
        '422':
          description: >
            PAC-66 and PAC-66-B. The configuration is set up, but the probe
            would send its request to a destination not approved for the
            provider it uses. Nothing was sent. `reason` says which of three
            cases applies; `property` names the stored setting to correct.
            The body never carries a key, and `error` is a non-empty sentence.
            Distinct from the 400 (the request body itself is malformed), the
            409 (no configuration to send with) and the 502 (the provider call
            failed). A 422 always means nothing was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMDestinationRefusal'
              examples:
                notEnabled:
                  value:
                    error: azure_openai is not enabled on this deployment; ask your administrator to approve an Azure OpenAI endpoint
                    reason: provider_not_enabled
                notApproved:
                  value:
                    error: azureEndpoint is not an approved Azure OpenAI endpoint on this deployment
                    reason: destination_not_approved
                    property: azureEndpoint
                notSet:
                  value:
                    error: the Azure endpoint is not set; save an approved endpoint in Settings first
                    reason: destination_not_set
                    property: azureEndpoint
                vertexNotEnabled:
                  value:
                    error: vertex is not enabled on this deployment; ask your administrator to approve aiplatform.googleapis.com
                    reason: provider_not_enabled
                baseUrlNotApproved:
                  value:
                    error: llmBaseUrl is not an approved OpenAI destination on this deployment; clear it in Settings to use api.openai.com
                    reason: destination_not_approved
                    property: llmBaseUrl
        '500':
          description: >-
            Settings load failure, or the caller's organisation membership could not
            be read (NEW-llm-bring-your-own). Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21). A caller with no key, or
            with `llmProvider: ""`, is the 409, never a 500 (spec AC-12). A destination
            refusal is never a 500; it is the 422.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '502':
          description: >-
            The provider call failed: transport, a non-success answer (including a key
            the provider rejects, spec D-13), an unusable answer, or a redirect from an
            approved destination, which is never followed. Body:
            `{"error":"upstream provider error"}`. The upstream error string is NOT
            returned: it is redacted of every key sent with the request and of the
            caller's keys, and written to the server log and Sentry only (PAC-21;
            Part 2 spec §3.1a). There is no credential acquisition step any more, so
            no 502 comes from loading a deployment credential. It is never used for a
            destination refusal (422) or for "AI not configured" (409).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/organization/ai:
    get:
      operationId: getOrganizationAI
      tags: [organization-ai]
      summary: Read the caller's organisation's AI configuration
      description: >
        NEW-llm-bring-your-own Part 2 (spec
        `docs/specs/NEW-llm-bring-your-own-part2.md` §3.2, P2-AC-7). The
        organisation is the caller's, never a parameter, so no caller can
        name another organisation (P2-AC-8).

        **Every member reads the same bytes.** The answer depends only on the
        organisation's stored configuration, never on the caller: not on
        whether the caller is an administrator (Paceday stores no admin role;
        PAC-50's proof exists only around a write), not on whether the caller
        holds a live grant, is on the break-glass list, has confirmed, or just
        made the last change (parent spec D-7, P2-AC-7). Per-caller state
        (whether the caller has confirmed the current version) is on the
        caller's settings read (`AIStatus`), not here.

        The key is NEVER returned (owner O-7, PAC-24): `keySet` is the only
        thing a reader learns about it. An organisation that never set a
        configuration answers `configured: false`, `keySet: false`,
        `personalKeysAllowed: true`, `configurationVersion: 0` and no
        `provider`. An organisation whose configuration was removed
        (`provider: ""`) answers the same except that `configurationVersion`
        is the removal's version (never `0` again; versions are never reused
        within an organisation, contract revision 3, spec P2-D17) and
        `personalKeysAllowed` and `updatedAt` are as stored. A client keeps
        the `configurationVersion` it displayed: patchOrganizationAI and
        confirmOrganizationAI both name it.

        Checks: membership (403), then 200. Read-only: nothing is consumed,
        written or recorded.
      responses:
        '200':
          description: The organisation's AI configuration, without the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAIConfiguration'
              examples:
                configured:
                  value:
                    configured: true
                    provider: openai
                    model: gpt-4o-mini
                    baseUrl: ''
                    keySet: true
                    personalKeysAllowed: true
                    configurationVersion: 3
                    updatedAt: '2026-11-02T09:14:00Z'
                    changeableBy: organization_admin
                neverSet:
                  value:
                    configured: false
                    keySet: false
                    personalKeysAllowed: true
                    configurationVersion: 0
                    changeableBy: organization_admin
                removed:
                  summary: (contract revision 3) after provider "" removed a configuration at version 4
                  value:
                    configured: false
                    keySet: false
                    personalKeysAllowed: true
                    configurationVersion: 5
                    updatedAt: '2026-11-03T10:02:00Z'
                    changeableBy: organization_admin
        '401':
          description: No/invalid JWT (from requireAuth, text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: >
            The caller has no organisation (`org membership required`, also
            when the user lookup fails) or its organisation row is gone (`org
            not found`). The body is SsoWriteMembershipRequired, the schema of
            every membership 403 (PAC-50). A client shows no organisation AI
            section to such a caller (spec P2-AC-9, P2-AC-30); it knows in
            advance from `Settings.aiStatus.inOrganization`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoWriteMembershipRequired'
        '500':
          description: >-
            The configuration could not be read. Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    patch:
      operationId: patchOrganizationAI
      tags: [organization-ai]
      summary: Change the caller's organisation's AI configuration (proven administrators only)
      description: >
        NEW-llm-bring-your-own Part 2 (spec §3.2, P2-AC-1 to P2-AC-6,
        P2-AC-17; owner O-11, O-12). MERGE against the caller's
        organisation's configuration, with the rules on
        OrganizationAIConfigurationUpdate. The answer is the re-read
        configuration, byte-identical to what any member's getOrganizationAI
        returns right after (P2-AC-7).

        **Who may change it (owner O-11: PAC-50's admin proof, repeated per
        change).** Exactly PAC-50's write gate (`docs/specs/PAC-50.md` §4.2)
        with its own grant purpose:

        1. Membership: no organisation or its row gone is the 403
           SsoWriteMembershipRequired, before anything else (break-glass
           included).

        2. The body's shape: every 400 that can be decided from the body
           alone (the "shape" list on the 400), before anything stored is
           read and before any proof is looked at, so a refused body leaves
           a live grant unconsumed (P2-AC-4).

        2a. The version (contract revision 2, challenge B-1; spec P2-D15,
            P2-AC-40). `configurationVersion` must equal the stored
            configuration's current version (the one the admin was shown).
            Otherwise the 409 OrganizationAIConsentConflict with `reason:
            configuration_changed` and `organization` the current read;
            nothing is stored, nothing is recorded, and no proof is looked at
            or consumed, so a stale form costs no step-up. This is an early
            answer for the common case; step 4 repeats the comparison
            atomically, and step 4's is the one that decides.

        2b. The body against what is stored (contract revision 3, challenge
            revision 2 non-blocking 3): every 400 on the "state" list on the
            400, decided against the configuration at the version just
            checked. A stale form therefore gets the 409 of 2a, never a 400
            that only the newer configuration explains.

        3. Authorisation: the caller's newest
           live grant for (caller, caller's organisation) **whose purpose is
           `llm_org_key_write`** is consumed in one statement; a grant of any
           other purpose (`sso_write`) is never selected and stays live, and
           an SSO write never consumes an `llm_org_key_write` grant (PAC-50
           AC-27, P2-AC-2). Without such a grant: an address on the
           deployment's break-glass list (`PACEDAY_ADMIN_EMAILS`, compared
           case-insensitively) whose session JWT was issued less than 10
           minutes ago, and not more than one minute in the future, is
           authorised without a grant (PAC-50 AC-14a); the same address with
           an older session is the 403
           OrganizationAIWriteFreshLoginRequired; anyone else is the 403
           OrganizationAIWriteStepupRequired. One grant authorises one
           change, so a second change needs a new step-up (owner O-11).
           **One break-glass session authorises one change** (spec P2-D13,
           factory-assumed pending the owner; revision 2): a break-glass
           change is recorded with the session's issue time, and a further
           change by the same address with a session of the same issue time
           is the 403 OrganizationAIWriteFreshLoginRequired, even inside the
           10 minutes. The check that no change was recorded for (address,
           session issue time) and the recording of this one are one atomic
           step (at most one record per pair, enforced by storage), so two
           concurrent changes with one session cannot both pass (contract
           revision 3, challenge revision 2 non-blocking 2). Sessions carry
           no identifier besides `iat`, which has one-second resolution: two
           sign-ins by the same address within one second share an issue
           time and count as one session, so the second is refused. That
           fails safe. PAC-50's SSO write gate is unchanged (its break-glass
           rule still allows several SSO writes per fresh session).

        4. The write (contract revision 3, challenge revision 2 B-1'; spec
           P2-D15). Steps 3 and 4 run in ONE transaction: the grant
           consumption (or the break-glass record) and one atomic
           conditional write that stores the change only if the stored
           version still equals `configurationVersion`. The condition is
           the stored version alone, and an organisation with no stored
           configuration counts as version `0` (contract revision 3.1,
           challenge revision 3 NB-C): so the first setup names `0`, and a
           row that a `personalKeysAllowed`-only change left at version `0`
           does not make a concurrent first setup naming `0` a conflict,
           while of two first setups naming `0` exactly one is stored (the
           first advances the version). When the
           condition fails (another administrator's change was stored
           between step 2a and here), the transaction is rolled back and the
           answer is the 409 OrganizationAIConsentConflict
           `configuration_changed` with the current read: nothing stored,
           nothing recorded, the grant NOT consumed and a break-glass session
           NOT marked used. When storage fails, the transaction is rolled
           back the same way and the answer is the 500: the configuration is
           unchanged and the grant is still live (P2-AC-5, revision 3;
           revision 2 said the grant stayed consumed). So a grant is spent
           exactly when a change is stored. The operator record of a
           successful change is inserted in this same transaction (contract
           revision 3.1, challenge revision 3 NB-B), so a stored change is
           never left unrecorded and a rolled-back one is never recorded.

        Being a team owner, or having made the last change, proves nothing.
        Every successful change is recorded for operators, in the write's
        transaction (who, when,
        `stepup` or `breakglass`, the names of the properties that changed;
        never the key; P2-AC-6). No API reads that record.

        **What a change does to members** (spec §3.1): `configurationVersion`
        advances by one when the change alters `provider` (including
        `provider: ""`, the removal), writes `apiKey`
        (any present `apiKey`, including `""` and including a value equal to
        the stored key: the server never compares keys, so re-entering the
        same key re-asks members), or alters any destination property
        (`baseUrl`, `azureEndpoint`, `azureDeployment`, `azureApiVersion`,
        `awsRegion`), including removing them; members who follow the
        organisation must then confirm again before anything is sent to it
        (spec P2-D4, factory-assumed pending the owner, OQ-P2-1; P2-AC-23). A
        change of only `model` and/or `personalKeysAllowed` does not advance
        it, so such a change is never a conflict for another administrator's
        change and, for `model` and `personalKeysAllowed`, the later change
        wins. Forbidding personal keys moves nobody onto this configuration:
        members on their own provider answer row 10 or 11 until they choose
        `llmProvider: organization` and confirm (spec P2-D2, current default).

        **A version is never reused within an organisation** (contract
        revision 3, spec P2-D17, P2-AC-42), including across `provider: ""`
        and a later setup: the removal empties the configuration and keeps
        its version count, so the next setup names the removal's version
        and gets the next one. A confirmation of a removed configuration
        therefore never matches a later configuration.

        Approved destinations: the organisation's `baseUrl`, `azureEndpoint`
        and `awsRegion` are checked on write with exactly the rules of
        patchSettings for a user's (PAC-66, PAC-66-B, owner O-10 path
        prefixes), for the organisation's provider, and again on every send
        (`testLLMConnection`). Because every member reads them (spec
        P2-D18, contract revision 3), the organisation's addresses are also
        held to a stricter shape: `baseUrl` must be exactly an approved
        origin plus that entry's path prefix with no query, fragment or
        userinfo (the user rule, which leaves no room for a credential in
        the path); `azureEndpoint` must be `https://<host>` with at most one
        trailing `/` and no path, query, fragment or userinfo (stricter than
        a user's, whose path is not checked on write).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationAIConfigurationUpdate'
            examples:
              setOpenAI:
                value:
                  configurationVersion: 0
                  provider: openai
                  apiKey: sk-example-not-a-real-key
              forbidPersonalKeys:
                value:
                  configurationVersion: 3
                  personalKeysAllowed: false
              removeKey:
                value:
                  configurationVersion: 3
                  apiKey: ''
              removeAll:
                value:
                  configurationVersion: 4
                  provider: ''
      responses:
        '200':
          description: The re-read configuration, without the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAIConfiguration'
        '400':
          description: >
            The body is refused and nothing is stored; a live grant is not
            consumed (P2-AC-4). JSON error shape (writeError). Exactly one
            message per request: the first failing check in the order below.

            Shape (step 2, decided from the body alone, before the version
            check):
            (1) `invalid JSON` (unreadable, or not an object, or `null`);
            (2) `unknown property: <name>` (the first unknown name in body
            order);
            (3) `configurationVersion`, checked before every other property,
            one message per case (contract revision 3, challenge revision 2
            non-blocking 4): absent -
            `configurationVersion is required: send the version you were shown`;
            `null` - `configurationVersion must not be null`; not a JSON
            number, or a number with a fraction -
            `invalid JSON: configurationVersion has the wrong type`; below
            0 - `configurationVersion must be 0 or more`. An absent
            `configurationVersion` is never read as `0`: the server decodes
            the raw body to tell absent from `0` (the generated `int` field
            cannot), so a body without it for an organisation at version 0
            is the 400, not a write (P2-AC-4);
            (4) the other properties, one at a time in body order (contract
            revision 3.1, challenge revision 3 NB-D: this is the one reading):
            for each, `<property> must not be null` when it is `null`, else
            `invalid JSON: <property> has the wrong type` when it has the
            wrong type; the first property that fails decides;
            (5) `send at least one property to change` (only
            `configurationVersion`);
            (6) `provider must be one of: "", openai, anthropic, azure_openai, bedrock, vertex`;
            (7) `provider "" removes the whole configuration; send no other property with it`
            (`configurationVersion` excepted);
            (8) `azureEndpoint must be https://<host> with no path, query, fragment or credentials`
            (a non-empty organisation `azureEndpoint`; spec P2-D18).

            State (step 2b, decided against the stored configuration at the
            named version, after the version check):
            (9) `apiKey is required when provider changes` (spec P2-D7: a
            key is never carried from one provider to another);
            (10) `<property> requires a provider` for `apiKey` (non-empty),
            `model` and every destination property (`baseUrl`,
            `azureEndpoint`, `azureDeployment`, `azureApiVersion`,
            `awsRegion`) when no provider is stored and the body sets none
            (contract revision 2, challenge non-blocking 2);
            (11) `<property> does not apply to <provider>` (for example
            `azureEndpoint` with `openai`, and `model does not apply to
            azure_openai`, whose deployment names the model; spec §3.2:
            refused, not ignored), against the provider after this write;
            (12) the destination messages of patchSettings for `baseUrl`,
            `azureEndpoint` and `awsRegion`, naming this body's property
            (for `baseUrl` this includes a query, fragment, userinfo or a
            path other than an approved entry's prefix). Writes validate
            only what they change: a destination value equal to the stored
            one is not re-checked.

            So a stale form gets the 409, never a state 400 (P2-AC-40), and
            a shape error gets its 400 whatever version it names. No 400
            looks at a proof. The response never contains the submitted or a
            stored key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          description: No/invalid JWT (from requireAuth, text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: >
            Not permitted, configuration unchanged (P2-AC-1, P2-AC-2,
            P2-AC-17). Exactly one variant of
            OrganizationAIWriteForbiddenResponse, told apart by `error`:
            `org membership required` / `org not found` (no organisation;
            no step-up offered); `organization_ai_write_requires_admin_stepup`
            (with how to start the step-up for this purpose; a live grant of
            another purpose is left unconsumed); or
            `organization_ai_write_requires_fresh_login` (a break-glass
            address with a stale session, or with a session that already
            made one organisation-AI change, spec P2-D13). 403 because the
            request is
            understood and the caller is not permitted (RFC 9110 §15.5.4),
            as PAC-50.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAIWriteForbiddenResponse'
        '409':
          description: >
            Contract revision 2 (challenge B-1; spec P2-D15, P2-AC-40) and
            revision 3 (challenge revision 2 B-1'). `configurationVersion` is
            not the stored configuration's current version: another
            administrator changed it after this one was shown it, either
            before this request was checked (step 2a) or between that check
            and the write (step 4's atomic conditional write, including two
            concurrent first setups naming `0`). `reason` is
            `configuration_changed` and `organization` the current read
            (keyless), so the client shows what is true now. Nothing is
            stored or recorded, no grant is consumed and no break-glass
            session is marked used: at step 4 the whole transaction is rolled
            back. Never `organization_not_configured` here: a change may be
            made to an incomplete configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAIConsentConflict'
        '500':
          description: >-
            The proof could not be checked, or the change could not be stored or
            re-read. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21). A failure inside step 4's
            transaction that the server knows rolled it back leaves the
            configuration unchanged, the grant still live and a break-glass session
            not marked used (P2-AC-5, contract revision 3). The server cannot always
            know: when the connection fails during the COMMIT itself, the change and
            the spent grant (or the break-glass record) may have been stored
            together; and a failure re-reading after a committed write is the 500
            with the change stored and the grant spent. So after any 500 the client
            re-reads (getOrganizationAI) before retrying. A retry is safe either
            way: if the change was stored, a retry naming the old version is the
            409 `configuration_changed`; if not, the grant is still live (contract
            revision 3.1, challenge revision 3 NB-A).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/organization/ai/consent:
    post:
      operationId: confirmOrganizationAI
      tags: [organization-ai]
      summary: Confirm that my AI requests may go to my organisation's AI provider account
      description: >
        NEW-llm-bring-your-own Part 2 (spec §3.4, P2-AC-22 to P2-AC-25; owner
        O-13: tell and ask once, nothing is sent before the user confirms).
        The caller confirms the organisation's configuration at
        `configurationVersion`, the version they were shown (from
        getOrganizationAI). Recorded for (caller, caller's organisation): a
        later confirmation of a newer version replaces it; confirming the
        current version again is accepted and changes nothing.

        Before calling this, a client tells the user, naming the
        organisation's `provider`, that their text and meeting details (event
        titles, attendee emails, and the Slack and Notion excerpts used for
        briefs) are sent to their organisation's AI provider account, which
        its administrators can **access** outside Paceday (owner O-13: the
        wording says "access", never "read"). The client calls this only on
        the user's explicit confirmation. Choosing "Use my organisation's AI"
        in Settings shows the same notice and, on the user's confirm,
        confirms the version DISPLAYED (the client calls this with that
        version, then patchSettings with `llmProvider: organization`); if
        this answers 409, the client shows the current configuration's
        notice instead. This operation is the ONLY way a confirmation is
        recorded: patchSettings never records one, whatever its body (spec
        P2-D14, P2-AC-38), and a patchSettings that stores `""` or a provider
        DELETES the caller's confirmation (P2-AC-36).

        The confirmation is what lets row 4 of the table on AINotConfigured
        send anything, and only for the version it names; it does not change
        the caller's stored choice. It confirms nobody else (P2-AC-25). No
        MCP tool calls it (spec P2-D9).

        Checks: body (400), membership (403), then the organisation's
        current state (409), then 200. When the current configuration is
        not complete, the 409 is `organization_not_configured` whatever
        `configurationVersion` says (it wins over `configuration_changed`:
        there is nothing to confirm).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationAIConsentRequest'
      responses:
        '200':
          description: >
            Recorded. The caller's AI status afterwards, as the settings read
            would give it: for a caller who follows the organisation it is now
            `configured: true` with `configuration: organization` (row 4); for
            a caller on their own provider (rows 2, 3, 10, 11), on a removed
            provider, or on "off", it is unchanged, and the confirmation is
            kept until a settings write stores `""` or a provider (spec
            P2-D2: confirming does not move a caller off their own choice).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatus'
        '400':
          description: >
            `invalid request: send {"configurationVersion": <the version you were shown>}`
            for an unreadable body, a body that is not an object, a missing or
            non-integer `configurationVersion`, a value below 1, or any other
            property. Nothing is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '401':
          description: No/invalid JWT (from requireAuth, text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: >
            No organisation (`org membership required`) or its row is gone
            (`org not found`): SsoWriteMembershipRequired. Nothing recorded
            (P2-AC-9).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoWriteMembershipRequired'
        '409':
          description: >
            Nothing is recorded (P2-AC-24). `reason`
            `organization_not_configured`: the organisation's configuration is
            not complete, so there is nothing to confirm (this wins when both
            apply). `configuration_changed`: the configuration is complete and
            `configurationVersion` is not the current one (an administrator
            changed the configuration after the caller was shown it). `organization` carries the current configuration
            so the client can show the notice again with what is true now.
            409 because the request is well formed and conflicts with the
            current state of the organisation's configuration (RFC 9110
            §15.5.10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAIConsentConflict'
        '500':
          description: >-
            Storage failure. Body: `{"error":"internal error"}`. The detail is written to
            the server log and Sentry only (PAC-21). Nothing is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Read the caller's settings document
      description: >
        Registered as `r.Route("/api/settings", ...)` + `r.Get("/", ...)`, so chi
        serves both `/api/settings` and `/api/settings/`.

        Returns the settings of the AUTHENTICATED CALLER. When the caller has no
        settings row yet, one is created from the SQL defaults and returned, so
        this operation never 404s and a second read returns the same row rather
        than creating another (spec AC-2).

        `llmApiKey` is never returned, by this or any other operation
        (`writeOnly: true`). `llmApiKeySet` reports whether a key is on file
        (spec AC-11, AC-12).

        NEW-llm-bring-your-own: keys are bound to the provider they were
        entered for. `llmApiKeySet` reports the key of the selected provider,
        `llmApiKeysSet` every provider's, and `llmUnboundApiKeySet` a key
        stored before that change that is bound to no provider (spec D-5,
        AC-15, AC-16). `aiStatus` says whether AI works for the caller now and,
        when it does not, why and who can turn it on, by the spec's §3 table
        (AC-8). A row whose stored provider is `ollama` is returned with
        `llmProvider: "unsupported"` and `aiStatus.notConfigured.reason`
        `provider_removed`, and is valid against this schema; nothing stored is
        rewritten by the read. Reading never reveals any key, the caller's or
        an organisation's.

        Before PAC-24 this read `WHERE id = 1` - a row shared by every
        authenticated caller, which after migration 018's backfill is the
        earliest-created user's own row - and returned `llmApiKey` in cleartext
        (API-002, API-003).
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The settings document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '500':
          description: >-
            DB failure. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    patch:
      operationId: patchSettings
      tags: [settings]
      summary: Change some of the caller's settings
      description: >
        MERGE, at the top level, against the CALLER'S OWN settings. This is the
        ONLY write operation for settings: PAC-24 removes `PUT /api/settings`
        rather than retaining it as a deprecated alias, for the reasons in the
        comment on this path and in `contracts/features/PAC-24.md` §3.

        The rule is total and needs no knowledge of what is stored:

        * **Property absent** -> unchanged.
        * **Property present** -> set to exactly that value. `""`, `0` and
          `false` are values, not absences: they clear, zero and disable. This is
          how a setting is cleared, including `llmApiKey` (spec AC-7, AC-13).
        * **Property present and `null`** -> 400. No property of this body is
          nullable, so a null fails schema validation and nothing is stored
          (spec AC-8).
        * **`workingHours` and `lunchBreaks`** are replaced WHOLE when present -
          there is no deep merge and no per-day merge, so a weekday omitted from
          a supplied map is REMOVED. `lunchBreaks: {}` clears every per-day lunch
          override (spec AC-9).
        * **`llmApiKeySet`, `llmApiKeysSet`, `llmUnboundApiKeySet`, `aiStatus`
          and `updatedAt`** are `readOnly`. They may be present -
          a client that submits back a document it just read will include them -
          and are ignored (spec AC-10).

        The response is a fresh read of the caller's row, so it reflects
        normalisation (e.g. `workingHours` defaulting) rather than the submitted
        body, and it does not contain `llmApiKey`.

        **PAC-66 destination rules.** When a write CHANGES `azureEndpoint` or
        `awsRegion` to a non-empty value, that value is checked whichever
        provider is selected (spec AC-5, AC-7): `azureEndpoint` must be an
        `https` URL whose host is approved for `azure_openai`; `awsRegion` must
        be a valid AWS region name (one host label; the Bedrock host itself is
        checked when a request is sent). (`gcpLocation`, also checked here
        before, is removed by NEW-llm-bring-your-own.) A refused value is a 400
        naming the property, and nothing in the body is stored.
        Three things are deliberately NOT refused here: `""` for either
        (a user can always clear a bad value, spec AC-15, D-3); a value
        equal to the one already stored (the changed-only rule above, PAC-24
        AC-17, spec AC-9); and a write that changes only `llmProvider`, even
        onto a stored unapproved endpoint (spec AC-17). Each of those is refused
        when a request would be sent instead (see `testLLMConnection`). The
        server never rewrites or clears a stored value (spec D-3).

        **PAC-66-B destination rules (as changed by NEW-llm-bring-your-own).**
        When a write CHANGES `llmBaseUrl` to a non-empty value, that value is
        checked whichever provider is selected: it must be exactly an origin
        approved for `openai` or `anthropic` (the vendors' public hosts count)
        followed by exactly that approval's path prefix when it has one (owner
        decision O-10, spec AC-18), with at most one trailing `/`; any other
        path, a query, fragment, userinfo or whitespace is refused. Being
        approved for one provider does not make it a destination for the other,
        which is checked when a request would be sent. A refused value is a 400
        naming the property, and nothing in the body is stored. As for PAC-66,
        `""` is always accepted (a user can always clear a bad value; clearing
        means the vendor's public host), an unchanged value is not re-checked
        (so a value stored through the web's former Ollama field can be written
        back unchanged, spec D-14, AC-39), and a write that changes only
        `llmProvider` is not refused. `ollamaBaseUrl` no longer exists: writing
        it is a 400 `unknown property: ollamaBaseUrl`.

        **NEW-llm-bring-your-own: the AI choice and its keys.**

        * `llmProvider` is the caller's choice: `""` (AI off), `organization`
          (use my organisation's AI), or one of `openai`, `anthropic`,
          `azure_openai`, `bedrock`, `vertex`. `ollama` is a 400 and nothing is
          stored (spec AC-6). `unsupported` is accepted only when the caller's
          row already reads as `unsupported`, so a document read and written
          back unchanged succeeds and leaves the stored choice, the stored
          provider-specific values and the stored key exactly as they were
          (spec AC-9); any other write of `unsupported` is a 400.
        * A key is bound to the provider it was entered for (spec D-5). A
          present `llmApiKey` applies to the caller's provider AFTER this write
          (the body's `llmProvider` when present, else the stored one): a
          non-empty value replaces that provider's key, `""` removes it. Keys
          bound to other providers are untouched, so changing `llmProvider`
          neither carries a key to the new provider nor loses the old one, and
          changing back makes the earlier key usable again (spec AC-15). When
          the provider after the write is not one of the five, a non-empty
          `llmApiKey` is a 400 and nothing is stored; `""` is accepted.
        * A key stored before this change and bound to no provider
          (`llmUnboundApiKeySet`) is never deleted implicitly (spec D-5:
          "never sent, never deleted"; §3 "It is not deleted"; AC-16). A write
          carrying `llmApiKey`, with any value, touches only the key of the
          provider after the write and leaves the unbound key in storage. The
          unbound key is removed only by the explicit, write-only
          `llmUnboundApiKey: ""`; any other value of that property is a 400
          and nothing is stored. "Replace" in spec §3 is a key entered for the
          selected provider, optionally sent together with
          `llmUnboundApiKey: ""` in the same write when the user also asks to
          remove the old key.
        * Choosing a provider with no key bound to it is accepted; AI is then
          not configured, `needs_key`, until a key is written (spec row 3).
        * `llmApiKeysSet`, `llmUnboundApiKeySet` and `aiStatus` are read-only
          and, like `llmApiKeySet`, accepted and ignored on write.
        * Nothing here reads, writes or reveals an organisation's
          configuration or key: that is getOrganizationAI and
          patchOrganizationAI (Part 2). Writing `llmProvider: organization`
          does not confirm the organisation's configuration, alone or inside
          a whole settings document (confirmOrganizationAI does; spec P2-D14,
          P2-AC-38). Writing `llmProvider` as `""` or as one of the five
          providers DELETES the caller's stored confirmation for their
          organisation, whether or not the stored choice changes, so a later
          return to `organization` asks again (spec §3.4, P2-AC-36); this is a
          side effect, never a refusal. While the caller's organisation
          forbids personal keys, choosing a provider and writing a key for it
          are accepted and stored, and that key is never sent (spec P2-D8,
          P2-AC-21).

        Before PAC-24 there was no PATCH; the only write was a full-replace PUT
        that persisted every omitted field as its Go zero value (API-004).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The re-read settings document for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/SettingsValidationError'
        '500':
          description: >-
            Load, save or re-read failure. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    # PUT /api/settings is REMOVED by PAC-24. Revision 1 of this contract
    # retained it as a deprecated merge-semantics alias, on the argument that it
    # shielded the pre-PAC-24 frontend during the factory's cross-repo window
    # (README §1). That argument does not survive checking:
    #   * The only PUT consumer is
    #     `smart-calendar-flow/src/api/client.ts:813`, which sends
    #     `settingsRequestBody(s)` - a spread of the snake_case `Settings` object
    #     (`:550-563`), so the body carries `work_start`, `llm_api_key` and 24
    #     more snake_case names. PUT and PATCH shared `SettingsUpdate`, which is
    #     `additionalProperties: false`, so that body was a 400 on PUT exactly as
    #     on PATCH. The alias covered nothing.
    #   * `mcp/client.go` defines get/post/patch/delete and no PUT at all
    #     (`:22,43,47,52`), and no MCP tool writes settings - `clockwise_get_settings`
    #     (`mcp/tools.go:236`) is a GET. The MCP server is not a consumer.
    #   * `e2e/tests/` contains no settings spec.
    # A PUT whose omissions mean "unchanged" is not a replace, and `deprecated`
    # documents an intention to remove, not a change of method semantics -
    # generated clients and any intermediary reasoning about idempotency read the
    # method. The old frontend's writes are silently discarded by the server
    # today (API-013), so a 400 from the removed route is strictly more honest
    # than a silent success. See `contracts/features/PAC-24.md` §3.

  /api/settings/daily-recap:
    get:
      operationId: getDailyRecapSettings
      tags: [daily-recap]
      summary: Read the caller's daily-recap settings
      description: >
        A snake_case projection of seven `recap*` fields of the CALLER'S OWN
        settings row - the same row GET /api/settings exposes in camelCase. The
        two representations are hand-maintained and can drift
        (`recapIncludeFocus` <-> `include_focus_blocks`).

        Before PAC-24 this read the singleton row, so every user saw and edited
        one shared recap configuration (API-002).
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Daily-recap settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapSettings'
        '500':
          description: >-
            DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
    patch:
      operationId: patchDailyRecapSettings
      tags: [daily-recap]
      summary: Partially update the caller's daily-recap settings
      description: >
        A partial update of the CALLER'S OWN recap settings. A property absent
        from the body is left unchanged; a property present is applied. No
        property is nullable, so an explicit `null` is a 400 - this matches
        PATCH /api/settings (spec AC-8) and is a change: the handler's pointer
        fields previously treated `null` as "leave unchanged", which made a
        typo indistinguishable from an omission.

        Returns 204 with an EMPTY body on success - it does not echo the new
        state.

        Before PAC-24 this patched the singleton row, and the underlying write
        was a full-row write that also rewrote every NON-recap column of that
        row from the values it had just read (API-002). It now writes only the
        recap columns of the caller's row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyRecapPatch'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: Updated. No body.
        '400':
          description: >
            `invalid JSON`; `send_to must be 'dm' or 'channel'`; or - added by
            PAC-24, previously a 500 from the Postgres TIME cast -
            `send_time must be in HH:MM format`. Written with http.Error, so
            these are text/plain, NOT the JSON error shape.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: >-
            DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/settings/daily-recap/preview:
    post:
      operationId: previewDailyRecap
      tags: [daily-recap]
      summary: Render today's recap without sending it
      description: >
        Builds the Slack Block Kit payload for the authenticated user at the
        current time IN THE CALLER'S TIMEZONE (`settings.timezone`, UTC when it
        cannot be resolved) - the same rule the scheduled recap uses - and
        returns it; the header names that zone and every time in the recap is
        rendered in it. No request body is read. Nothing is sent to
        Slack and no Slack connection is required.

        Before PAC-24 the day's content was the caller's but the recap
        configuration driving it (which sections to include) came from
        the singleton row, so a preview could omit sections the caller had
        enabled (API-002), and it was built in the server's zone. Both now come
        from the caller's row.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Rendered Slack blocks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapPreview'
        '500':
          description: >-
            DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

  /api/settings/daily-recap/test:
    post:
      operationId: sendDailyRecapTest
      tags: [daily-recap]
      summary: Send a test recap to Slack
      description: >
        Requires a stored `slack` workspace connection for the authenticated
        user. Destination comes from the CALLER'S OWN stored settings
        (`recapSendTo`, `recapChannelId`), not from the request - no request
        body is read. The message is built at the current time in the caller's
        timezone, as for the preview. The Slack call is bounded by a 10s context timeout.

        Before PAC-24 the destination came from the singleton row, so a test
        send could be addressed to a channel another user had configured
        (API-002).
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecapTestResult'
        '400':
          description: >
            `Slack not connected` (also returned when the workspace-connection
            lookup errors for any other reason). text/plain (http.Error).
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: >-
            DB failure. Body: `{"error":"db error"}`. The detail is written to the server
            log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'
        '502':
          description: >-
            Sending the test message failed. Body: `{"error":"upstream provider error"}`.
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingErrorResponse'

components:
  responses:

    SettingsValidationError:
      description: >
        Malformed JSON, or a value the server refuses. JSON error shape
        (writeError). A body property set to `null` is refused here: no property
        of SettingsUpdate is nullable (spec AC-8).

        Messages that already exist:
        `invalid JSON` (the body cannot be read; fixed text, PAC-21: before, the
        read error was appended);
        `invalid JSON: the body must be an object` (the body is not a JSON
        object, or is `null`; an existing fixed literal, unchanged);
        `invalid JSON: <property> has the wrong type` (a value of the wrong JSON
        type; `<property>` is the dotted path of JSON property names from the
        request, e.g. `timeFormat` or `workingHours.days.monday.start`, never a
        Go type or struct name; before PAC-21 was finished this was the decoder's
        own error text, which named Go types);
        `<field> must be in HH:MM format` (workStart/workEnd/lunchStart/lunchEnd);
        `focusMinBlockMinutes must be positive`;
        `focusMaxBlockMinutes must be positive`;
        `focusDailyTargetMinutes must be positive`;
        `outOfHoursMeetingsPerWeek must be zero or positive`;
        `bufferBeforeMinutes must be positive`;
        `bufferAfterMinutes must be positive`;
        `autoScheduleCron must be a 5-part cron expression`;
        `autoScheduleCron is invalid` (fixed text; before PAC-21 was finished the
        cron parser's error was appended);
        `llmProvider must be one of: "", organization, openai, anthropic, azure_openai, bedrock, vertex`
        (NEW-llm-bring-your-own: replaces the message that listed `ollama`, which
        now gets this 400, spec AC-6);
        `workingHours.mode must be all_days or by_day`;
        `workingHours.mode is required when day-specific hours are provided`;
        `workingHours.days.<day> is not a valid weekday`;
        `lunchBreaks.<day> is not a valid weekday`;
        `<field> requires start and end when enabled`;
        `<field> start and end must be in HH:MM format`;
        `<field> end must be after start`.

        Messages PAC-24 adds, closing API-081 and API-082 - each of these is a
        value the server accepted before and then failed on, silently or as a
        500 (spec AC-17):
        `workEnd must be after workStart`;
        `lunchEnd must be after lunchStart`;
        `focusMinBlockMinutes must not exceed focusMaxBlockMinutes`;
        `bufferMinMeetingMinutes must be zero or positive`;
        `timezone is not a known IANA location`;
        `recapSendTo must be dm or channel` (previously reached the DB CHECK and
        surfaced as a 500 - API-081);
        `recapSendTime must be in HH:MM format` (previously reached the Postgres
        TIME cast and surfaced as a 500);
        `calendarProvider must be one of: google, outlook, webcal` (resolves
        U-18);
        `conferencingProvider must be one of: meet, zoom, teams`.

        Message PAC-55 adds: `timeFormat must be 12h or 24h`, for `""` and any
        other string (a non-string is `invalid JSON: timeFormat has the wrong type`).

        Messages revision 2 of this contract adds, each with its reason:
        `recapSendTime must be in HH:MM format` now also covers `""`. The write
        path previously substituted `08:00` for an empty value
        (`recapSendTimeOrDefault`, `backend/storage/settings.go:356-361`); under
        the merge rule a present property must be stored exactly as given, so a
        silent substitution is a contract violation and the empty value is
        refused instead. See `Settings.recapSendTime`; this is the one
        clock property for which `""` is NOT a value, and it needs a narrow
        amendment to spec AC-7.
        `workingHours.days must contain at least one weekday when mode is by_day`
        - a `by_day` document with an empty `days` map is the only remaining
        stored state that makes the consumer delete the working-hours section
        with no error (`smart-calendar-flow/src/api/client.ts:505-517,543`); the
        `all_days` equivalent is already normalised away on read
        (`backend/storage/settings.go:95-99`). Serves spec AC-20.

        `workingHours.days.<day> is not a valid weekday` and
        `lunchBreaks.<day> is not a valid weekday` are how a weekday key that is
        not exactly one of the seven lowercase names is refused: generators drop
        `propertyNames`, so the handler is the only enforcement point
        (revision 3/4).

        Messages PAC-66 adds, each produced only when the write CHANGES the
        property to a non-empty value (`""` is always accepted, spec AC-15;
        the two `gcpLocation` messages are gone with the property,
        NEW-llm-bring-your-own):
        `azureEndpoint must be an https URL whose host is approved for azure_openai on this deployment`
        (an unapproved host, a scheme other than `https`, a port other than
        443, userinfo, or a value that does not parse as an absolute URL);
        `azureEndpoint cannot be set: azure_openai is not enabled on this deployment`
        (the operator approved no Azure host);
        `awsRegion must be a valid AWS region name`.
        Each names the property first, so a client can attach it to the field.

        Message PAC-66-B adds, as changed by NEW-llm-bring-your-own, under the
        same changed-and-non-empty rule (`""` is always accepted):
        `llmBaseUrl must be an OpenAI or Anthropic destination approved on this deployment`
        (a value approved for neither provider, a path other than an approved
        gateway prefix, a query, fragment, userinfo or whitespace; spec AC-18,
        PAC-66-B AC-B3, AC-B6, AC-B19). The two `ollamaBaseUrl` messages are
        gone with the property.

        Messages NEW-llm-bring-your-own adds:
        `llmProvider unsupported cannot be chosen: choose off, organization or a key-based provider`
        (a write of `unsupported` onto a row that does not already read as
        `unsupported`);
        `llmApiKey cannot be set: choose openai, anthropic, azure_openai, bedrock or vertex as llmProvider first`
        (a non-empty `llmApiKey` when the provider after the write is `""`,
        `organization` or `unsupported`);
        `llmUnboundApiKey must be "" (it can only remove the key bound to no provider)`
        (any `llmUnboundApiKey` value other than `""`; a non-string is
        `invalid JSON: llmUnboundApiKey has the wrong type`).
        A removed property (`awsProfile`, `gcpProject`, `gcpLocation`,
        `ollamaBaseUrl`, `ollamaModel`) is the existing
        `unknown property: <name>`.

        `""` is NOT in this catalogue for `workStart`, `workEnd`, `lunchStart`
        or `lunchEnd`. It is a valid value for all four, on read and on write
        (spec AC-7); the handler already skips the format check for it
        (`backend/api/handlers_settings.go:75`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulingErrorResponse'

  schemas:

    # ---------------------------------------------------------------- errors

    SchedulingErrorResponse:
      type: object
      description: >
        The JSON error shape produced by api.writeError (handlers_settings.go:206).
        Emitted with `Content-Type: application/json`. Every 5xx in this domain
        uses it, with a fixed server-chosen message (PAC-21). Handlers that use the
        Go stdlib `http.Error` for a 4xx return text/plain and do NOT use this
        shape; each response above says which applies.
        The 401 from requireAuth is a hybrid: the body text is
        `{"error":"unauthorized"}` but it is written through http.Error, which
        overwrites the Content-Type to `text/plain; charset=utf-8`.
      properties:
        error:
          type: string
      required: [error]
      additionalProperties: false

    # ----------------------------------------------------------------- focus

    FocusRunRequest:
      type: object
      description: >
        Optional. Absent, empty or `null` is treated as `{}`. Any other body that
        does not decode into this object is a 400 `invalid JSON` (PAC-36,
        API-035; it was silently treated as `{}` before).
      properties:
        week:
          type: string
          format: date
          description: >
            `YYYY-MM-DD`. Empty or absent -> current week (`time.Now()`).
            Not snapped to Monday by the handler.
          example: '2025-01-06'
      additionalProperties: true

    FocusRunResult:
      type: object
      description: >
        engine.FocusRunResult (backend/engine/focus_time.go). camelCase wrapper; the
        blocks inside `createdBlocks` are snake_case (FocusRunBlock, PAC-26). The
        wrapper casing is unchanged by PAC-26: the web app's snake_case FocusRunResult
        type is aligned to it by PAC-32 (API-015), which needs no contract change.
      properties:
        weekStart:
          type: string
          format: date-time
          description: RFC3339 (Go time.Time).
        createdBlocks:
          type: array
          description: '`[]` when the engine created nothing.'
          items:
            $ref: '#/components/schemas/FocusRunBlock'
        skippedDays:
          type: array
          items:
            type: string
            format: date
          description: >
            `YYYY-MM-DD` of each weekday the engine skipped (daily target already
            met, or the day is disabled in the working window). Both append sites in
            engine/focus_time.go append the same `day.Format("2006-01-02")` string
            (U-23, resolved by reading the code for PAC-26).
        totalMinutes:
          type: integer
        errors:
          type: array
          items:
            type: string
      required: [weekStart, createdBlocks, skippedDays, totalMinutes, errors]
      additionalProperties: false

    FocusRunBlock:
      type: object
      description: >
        engine.FocusBlock, with explicit snake_case json tags (PAC-26, API-014).
        The keys it shares with FocusBlockRecord (storage.FocusBlock, returned by
        GET /api/focus/blocks) are spelled the same: the Go fields `Start`/`End`
        are tagged `start_time`/`end_time` so that one block shape can be read
        from both operations. It has no `id` and no `created_at`: the engine
        reports what it created before any row id is known to the response.
        Before PAC-26 the struct had no tags and the keys were `GoogleEventID`,
        `Start`, `End`, `Date`.
      properties:
        google_event_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        date:
          type: string
          format: date
          description: '`YYYY-MM-DD`.'
      required: [google_event_id, start_time, end_time, date]
      additionalProperties: false

    FocusBlockRecord:
      type: object
      description: >
        storage.FocusBlock (backend/storage/models.go), with explicit snake_case
        json tags (PAC-26, API-014). The keys match the `focus_blocks` columns and
        the web app's FocusBlock type. Before PAC-26 the struct had no tags and
        the keys were `ID`, `GoogleEventID`, `StartTime`, `EndTime`, `Date`,
        `CreatedAt`.
      properties:
        id:
          type: integer
          format: int64
        google_event_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
      required: [id, google_event_id, start_time, end_time, date, created_at]
      additionalProperties: false

    FocusClearResult:
      type: object
      description: 'Literal `map[string]int{"deleted": n}`.'
      properties:
        deleted:
          type: integer
      required: [deleted]
      additionalProperties: false

    # ----------------------------------------------------------- compression

    CompressionRequest:
      type: object
      description: >
        Both fields optional; `week` takes precedence over `date` when non-empty.
        The whole body is optional too: absent, empty or `null` is treated as
        `{}`. Any other body that does not decode into this object is a 400
        `invalid JSON` (PAC-36, API-035; the decode error was discarded before).
      properties:
        date:
          type: string
          format: date
          description: '`YYYY-MM-DD`. Used only when `week` is empty. Default: today.'
        week:
          type: string
          format: date
          description: >
            `YYYY-MM-DD`. Snapped back to that week's Monday by startOfWeek(),
            then Mon..Fri (5 days) are evaluated.
      additionalProperties: true

    CompressionResult:
      type: object
      description: engine.CompressionResult. camelCase.
      properties:
        date:
          type: string
          description: '`YYYY-MM-DD` as produced by the engine.'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/MoveProposal'
        totalFocusGainMinutes:
          type: integer
      required: [date, proposals, totalFocusGainMinutes]
      additionalProperties: false

    MoveProposal:
      type: object
      description: engine.MoveProposal - the RESPONSE shape (camelCase).
      properties:
        eventId:
          type: string
        eventTitle:
          type: string
        currentStart:
          type: string
          format: date-time
        currentEnd:
          type: string
          format: date-time
        proposedStart:
          type: string
          format: date-time
        proposedEnd:
          type: string
          format: date-time
        reason:
          type: string
        focusGainMinutes:
          type: integer
      required:
        - eventId
        - eventTitle
        - currentStart
        - currentEnd
        - proposedStart
        - proposedEnd
        - reason
        - focusGainMinutes
      additionalProperties: false

    CompressionApplyRequest:
      type: object
      properties:
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/CompressionApplyProposal'
      additionalProperties: true

    CompressionApplyProposal:
      type: object
      description: >
        The anonymous struct in api.applyRequest. snake_case, and only these
        three fields are read - unknown members are ignored by encoding/json.
      properties:
        event_id:
          type: string
        proposed_start:
          type: string
          format: date-time
          description: RFC3339. Unparseable -> the proposal lands in `failed`, no error.
        proposed_end:
          type: string
          format: date-time
      additionalProperties: true

    CompressionApplyResult:
      type: object
      description: 'Literal map with keys `applied` and `failed`.'
      properties:
        applied:
          type: array
          items:
            type: string
          description: Event ids the engine moved.
        failed:
          type: array
          items:
            type: string
          description: >
            Mixed contents: handler-side entries read
            `"<event_id>: invalid time format"`, engine-side entries are appended
            verbatim by Compressor.Apply.
      required: [applied, failed]
      additionalProperties: false

    # ------------------------------------------------------- smart scheduling

    ScheduleSuggestRequest:
      type: object
      description: Anonymous struct in scheduleHandlers.suggestMeeting. snake_case.
      properties:
        duration_minutes:
          type: integer
          description: Not validated by the handler; 0 is accepted.
        attendees:
          type: array
          items:
            type: string
            format: email
        range_start:
          type: string
          format: date-time
          description: RFC3339. Required in practice - a parse failure is a 400.
        range_end:
          type: string
          format: date-time
          description: RFC3339. Required in practice.
        title:
          type: string
      required: [range_start, range_end]
      additionalProperties: true

    ScheduleSuggestions:
      type: object
      description: engine.ScheduleSuggestions.
      properties:
        slots:
          type: array
          description: At most 3 entries; `[]` when no candidate survived.
          items:
            $ref: '#/components/schemas/SuggestedSlot'
      required: [slots]
      additionalProperties: false

    SuggestedSlot:
      type: object
      description: engine.SuggestedSlot.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        score:
          type: integer
          description: >
            Integer score from scoreCandidate + adjustScoreForPreferences.
            No documented range or normalisation.
        reasons:
          type: array
          nullable: true
          items:
            type: string
      required: [start, end, score, reasons]
      additionalProperties: false

    ScheduleCreateRequest:
      type: object
      description: Anonymous struct in scheduleHandlers.createMeeting. snake_case.
      properties:
        title:
          type: string
          description: Becomes the Google event Summary. Not required by the handler.
        start:
          type: string
          format: date-time
          description: RFC3339. Parse failure -> 400.
        end:
          type: string
          format: date-time
          description: RFC3339. Parse failure -> 400.
        attendees:
          type: array
          items:
            type: string
            format: email
        description:
          type: string
        location:
          type: string
      required: [start, end]
      additionalProperties: true


    # ------------------------------------------------------------------- nlp

    NLPParseRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: Empty string -> 400 `missing text field`.
      required: [text]
      additionalProperties: true

    NLPParseResult:
      type: object
      description: >
        nlp.ParseResult. snake_case - the only snake_case RESPONSE body in this
        domain. Every field except `intent` is omitted when empty, so absent
        members are normal; since NEW-llm-bring-your-own that includes the
        time range (API-080).
      properties:
        intent:
          type: string
          description: >
            Values observed in the code and prompts: `schedule_meeting`,
            `schedule_focus`, `unknown`. The field is a plain string with no
            server-side validation, and the value ultimately comes from the LLM,
            so other values are possible.
          examples: [schedule_meeting, schedule_focus, unknown]
        title:
          type: string
        duration_minutes:
          type: integer
        attendees:
          type: array
          items:
            type: string
        range_start:
          type: string
          format: date-time
          description: >
            Start of the time range the request named. ABSENT when the result
            has no range (an "AI not configured" answer, or an `unknown` intent
            with no range); never `0001-01-01T00:00:00Z`. Resolves API-080
            (NEW-llm-bring-your-own, spec AC-35, D-20): before, the field was a
            Go `time.Time` with `omitempty`, which does not omit the zero time.
            Present together with `range_end` or not at all.
        range_end:
          type: string
          format: date-time
          description: End of the range; absent exactly when `range_start` is (API-080).
        preferred_times:
          type: array
          items:
            type: string
          description: 'Free-form windows, e.g. `"10:00-12:00"`.'
        avoid_times:
          type: array
          items:
            type: string
        constraints:
          type: string
          description: Reused as the event Description by /api/nlp/confirm.
        timezone_notes:
          type: string
        error:
          type: string
          description: >
            Set (with intent `unknown`) when the LLM call fails or returns
            invalid JSON, when the destination is refused, and when AI is not
            configured (then equal to `not_configured.message`) - still HTTP
            200.
        not_configured:
          $ref: '#/components/schemas/AINotConfigured'
          description: >
            NEW-llm-bring-your-own (spec AC-13). Present ONLY when AI is not
            configured for the caller, in which case `intent` is `unknown`,
            `error` is set, no other property is present and nothing was sent.
            Its presence is how a client tells "AI not configured" apart from
            "the model did not understand you". Ignored by
            `/api/nlp/confirm` when echoed back.
        suggested_slots:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedSlot'
        participant_infos:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantInfo'
      required: [intent]
      additionalProperties: false

    ParticipantInfo:
      type: object
      description: calendar.ParticipantInfo (backend/calendar/participants.go).
      properties:
        email:
          type: string
          format: email
        timezone:
          type: string
          description: Empty string = unknown.
        workStart:
          type: string
          description: '`HH:MM` or empty.'
        workEnd:
          type: string
          description: '`HH:MM` or empty.'
      required: [email, timezone, workStart, workEnd]
      additionalProperties: false

    NLPConfirmRequest:
      type: object
      properties:
        parse_result:
          $ref: '#/components/schemas/NLPParseResult'
        selected_slot_index:
          type: integer
          minimum: 0
          description: >
            Index into `parse_result.suggested_slots`. A negative value or one
            >= the slot count is a 400 `invalid selected_slot_index`.
      required: [parse_result, selected_slot_index]
      additionalProperties: true

    # ------------------------------------------------------------------- llm

    LLMTestRequest:
      type: object
      description: >
        Body for POST /api/llm/test. Added by PAC-24 to close API-037.

        **This schema is a closed list of three properties and that is the whole
        point of it.** Not one of them can contribute to the URL the server
        requests, so no submitted value can direct a stored key anywhere. The
        destination properties a probe might plausibly want to override -
        `llmBaseUrl`, `azureEndpoint`, `azureDeployment`, `azureApiVersion`,
        `awsRegion`, `bedrockModel`, `vertexModel` - are DELIBERATELY ABSENT
        and are a 400 via `additionalProperties: false`. The operation
        description carries the argument.

        Required. `{}` probes the caller's saved choice; an absent body is a
        400. `{"llmProvider": "anthropic", "llmApiKey": "..."}` probes an
        unsaved key for a provider against the caller's own stored destination
        for it, which is the case the settings UI needs because a stored key
        can never be read back to re-submit.

        This is deliberately NOT `SettingsUpdate`: sharing that schema would
        re-admit every destination property by inheritance and make a probe
        read like a write. The three property names match the corresponding
        SettingsUpdate ones so a client can build this from the document it
        already holds: every `llmProvider` value a settings read can return
        (`Settings.llmProvider`, including `unsupported`) is accepted here, and
        `unsupported` is accepted only in the one state in which a read
        returns it.

        `llmApiKey` here is `writeOnly` for the same reason it is on
        SettingsUpdate: it is accepted and is never echoed, in any status.
        Nothing submitted here is persisted.
      properties:
        llmProvider:
          type: string
          enum: ['', organization, unsupported, openai, anthropic, azure_openai, bedrock, vertex]
          description: >
            The choice to probe (NEW-llm-bring-your-own, spec D-19); absent
            means the caller's saved choice. A provider name selects that
            provider, the caller's own stored destination values for it, and
            the submitted key or else the key bound to it; never a key bound
            to another provider (and, while the caller's organisation forbids
            personal keys, the 409 `personal_keys_forbidden`). `""` is the 409
            `off`. `organization` is decided as a follower's request (rows 4-6;
            in row 4 it tests the organisation's configuration at the
            confirmed version). Only the five provider values "name a
            provider" (testLLMConnection, Part 2). `unsupported` is accepted only when the
            caller's saved choice reads as `unsupported` and is then decided
            as the saved choice (the row 7/8 409, a submitted key sent
            nowhere); otherwise it is a 400. `ollama` is not in the set
            (400). The same set as `Settings.llmProvider`. The approved-destination check follows this value when
            present, not the saved provider (PAC-66 AC-18, PAC-66-B AC-B11).
            Nothing submitted here is stored.
        llmModel:
          type: string
          description: >
            Used only when the probed provider is `openai` or `anthropic`, as a
            field of the JSON request body; `""` means the provider default. It
            never appears in a URL. `azureDeployment`, `bedrockModel` and
            `vertexModel`, which DO appear in URLs, are not accepted here.
            Ignored, and never sent, for any other choice.
        llmApiKey:
          type: string
          writeOnly: true
          description: >
            An unsaved key to probe with, for the provider the probe uses. Sent
            only in that provider's key header (see the operation) and only to a
            destination approved for that provider. `""` means "no key": the
            409 `needs_key`, and the stored key is NOT used instead. Never
            combined with an organisation configuration, never persisted, never
            echoed.
      additionalProperties: false

    LLMTestResult:
      type: object
      description: 'Literal map: `{"ok": true, "response": ..., "provider": ...}`.'
      properties:
        ok:
          type: boolean
          description: Always literal `true` on the 200 path.
        response:
          type: string
          description: The provider's completion text for the fixed "Say hello" prompt.
        provider:
          type: string
          enum: [openai, anthropic, azure_openai, bedrock, vertex]
          description: >
            The provider that was actually probed: the one named in the body,
            else the caller's saved one. Never empty since
            NEW-llm-bring-your-own (a probe with no provider is the 409). It is
            what tells a client which configuration the result is about. It
            never carries the key.
        configuration:
          type: string
          enum: [own, organization]
          description: >
            NEW-llm-bring-your-own Part 2. `organization` when the probe tested
            the organisation's configuration (row 4), `own` otherwise.
      required: [ok, response, provider, configuration]
      additionalProperties: false

    LLMDestinationRefusal:
      type: object
      description: >
        PAC-66 and PAC-66-B. Body of the 422 from POST /api/llm/test: the probe
        would have sent the caller's key to a destination not approved for that
        provider, so no request was sent. A superset of
        `SchedulingErrorResponse` (`error` is the same member, so a client that
        reads only `error` renders it unchanged). Never carries a key.
      properties:
        error:
          type: string
          minLength: 1
          description: A human-readable sentence saying what was refused and why.
        reason:
          type: string
          enum: [provider_not_enabled, destination_not_approved, destination_not_set]
          description: >
            `provider_not_enabled`: the operator approved no destination for
            this provider. It wins over the other two. Given for
            `azure_openai` and `bedrock` with nothing approved, and for
            `vertex` whenever `aiplatform.googleapis.com` is not approved
            (Vertex has no other destination). Never given for `openai` or
            `anthropic`, whose public hosts are always approved.
            `destination_not_approved`: the effective destination is not
            approved for this provider. This includes an `http` scheme or a
            non-default port; a host approved only for a DIFFERENT provider; an
            empty Bedrock region whose built-in `us-east-1` host is not
            approved; and a `llmBaseUrl` that is not exactly an approved origin
            followed by exactly that entry's path prefix (a path, prefix
            mismatch, query, fragment, userinfo or whitespace), including a
            value once approved only for Ollama (spec D-14).
            `destination_not_set`: the destination cannot be built because the
            stored value is empty and the provider has no default; only an
            empty `azureEndpoint`.
        property:
          type: string
          enum: [azureEndpoint, awsRegion, llmBaseUrl]
          description: >
            The stored setting the refused destination was built from. Present
            whenever `reason` is not `provider_not_enabled`. When
            `configuration` is `organization`, it names the organisation's
            stored value (`llmBaseUrl` stands for the organisation's
            `baseUrl`). `gcpLocation`,
            `awsProfile` and `ollamaBaseUrl` are gone with the settings they
            named (NEW-llm-bring-your-own).
        configuration:
          type: string
          enum: [organization]
          description: >
            NEW-llm-bring-your-own Part 2, contract revision 2 (spec
            P2-AC-41). `organization` when the refused destination is the
            organisation's configuration's (row 4): `error` then says the
            organisation's AI destination is not approved on this deployment
            and that an administrator of the organisation can fix it, and
            never tells the caller to change their own Settings. ABSENT for
            the caller's own configuration, exactly as before Part 2: the
            server never sends `own` here (contract revision 3, challenge
            revision 2 NB-1; the enum is narrowed so it cannot), so a 422
            about the caller's own destination keeps Part 1's three keys
            (`backend/api/pac66_llm_destination_test.go` passes unchanged).
      required: [error, reason]
      additionalProperties: false

    AINotConfigured:
      type: object
      description: |
        NEW-llm-bring-your-own. Why AI is not configured for a caller, and who
        can change that. One row of the table in
        `docs/specs/NEW-llm-bring-your-own-part2.md` §3.1 (Part 2; rows 1-8
        are the parent spec's, rows 9-11 are new), decided from the caller's
        stored choice and their organisation's configuration at the moment of
        the request. Rows are evaluated IN THE ORDER LISTED (9-11 right after
        1). "Complete": the organisation's configuration is `configured`
        (OrganizationAIConfiguration). "Forbids": its `personalKeysAllowed` is
        false. "Confirmed": the caller's stored confirmation
        (confirmOrganizationAI) names exactly the `configurationVersion` the
        request reads, the two read as one consistent state; a patchSettings
        that stores `""` or a provider deletes it (spec revision 1).

        | Row | Stored choice | Condition | `reason` | `enablers` |
        |---|---|---|---|---|
        | 1 | `""` (off) | - | `off` | user |
        | 9 | (reserved) | never answered under spec P2-D2's current default (OQ-P2-2) | - | - |
        | 10 | a provider, or `unsupported` | forbids; complete | `personal_keys_forbidden` | user |
        | 11 | a provider, or `unsupported` | forbids; not complete | `personal_keys_forbidden` | organization_admin |
        | 2 | a provider | a key bound to it | (configured: own) | - |
        | 3 | a provider | no key bound to it | `needs_key` (+ `provider`) | user |
        | 4 | `organization` | complete; confirmed | (configured: organisation) | - |
        | 5 | `organization` | complete; not confirmed | `organization_unconfirmed` | user |
        | 6 | `organization` | no organisation, or not complete | `nothing_configured` | user, plus organization_admin in an organisation; organization_admin only when it forbids |
        | 7 | `unsupported` (Ollama) | complete | `provider_removed_organization_available` | user |
        | 8 | `unsupported` (Ollama) | otherwise | `provider_removed` | user, plus organization_admin in an organisation |

        The same caller state gives the same `reason` and `enablers` on parse,
        brief refresh, the probe naming nothing, and the settings read (spec
        P2-AC-29). Row 1 wins over everything: "off" is never overridden by
        the organisation (parent D-9, P2-AC-16). While the organisation
        forbids personal keys, no personal key, stored or submitted, is ever
        sent (owner O-12), and nobody is moved onto the organisation's
        configuration (spec P2-D2, current default, pending the owner): a
        caller on their own or a removed provider answers row 10 or 11 and
        nothing is sent until they choose `organization` (patchSettings) and
        confirm. The caller's stored choice and keys are not rewritten, so
        allowing personal keys again puts the caller back in row 2 or 3.
        `organization_unconfirmed` means the caller can turn AI on in one step
        by confirming (owner O-13; nothing is sent before);
        `personal_keys_forbidden` with `enablers: [user]` (row 10) means the
        caller can turn AI on by choosing "Use my organisation's AI", which
        shows the O-13 notice and confirms. Only rows 2 and 4 send anything. A stored `bedrock`,
        `azure_openai` or `vertex` choice is a supported provider: with no key
        bound it is `needs_key`, never a removed-provider reason (spec D-17).

        A probe can also give `personal_keys_forbidden` with `enablers:
        [organization_admin]` when it names a provider or carries a key while
        the organisation forbids personal keys (see testLLMConnection).
        Carries no key, and nothing about any key beyond the facts above.
        Before Part 2 only `off`, `needs_key`, `nothing_configured` and
        `provider_removed` occurred, always with `enablers: [user]`.
      properties:
        reason:
          type: string
          enum: ['off', needs_key, organization_unconfirmed, nothing_configured, provider_removed_organization_available, provider_removed, personal_keys_forbidden]
        provider:
          type: string
          enum: [openai, anthropic, azure_openai, bedrock, vertex]
          description: Present exactly when `reason` is `needs_key`; the provider that needs a key.
        enablers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [user, organization_admin]
          description: >
            Who can turn AI on for this caller, by the table above: `user`
            (the caller, in Settings or by confirming) and/or
            `organization_admin` (an administrator of the caller's
            organisation, who can change its configuration with PAC-50's
            proof). `organization_admin` appears only for a caller who belongs
            to an organisation. It is the ONLY value in row 11, in row 6 when
            the organisation forbids personal keys, and in a probe refused for
            naming a personal provider or key while forbidden. Never names a
            person. (Before Part 2 it was `[user]` in every answer.)
        message:
          type: string
          minLength: 1
          description: >
            A sentence for the user saying why the configuration decided on
            cannot be used and who can fix it. When that configuration is the
            caller's saved choice (parse, brief refresh, the settings read, and
            a probe that names no other choice and carries no `llmApiKey`) it
            says that AI features are off. When a probe named a different
            choice or carried `llmApiKey`, it describes only the probed choice
            ("Anthropic needs an API key") and never says AI features are off,
            which may be false for the caller (see `testLLMConnection`).
            For `organization_unconfirmed` it says that the caller's text and
            meeting details would be sent to their organisation's AI provider
            account, which its administrators can access outside Paceday, and
            that nothing is sent until they confirm in Paceday (owner O-13).
            For `personal_keys_forbidden` with `enablers: [user]` (row 10) it
            says the organisation does not allow personal keys, that the
            caller's own provider and key are kept but not used, and to choose
            "Use my organisation's AI" in Settings (spec P2-AC-18). No
            message, in any row, contains the words "read", "reads" or "see"
            (spec P2-AC-26). Wording is not contractual beyond that, and it
            never carries a key.
      required: [reason, enablers, message]
      additionalProperties: false

    LLMNotConfiguredResponse:
      type: object
      description: >
        NEW-llm-bring-your-own. Body of the 409 from POST /api/llm/test and
        POST /api/meetings/{event_id}/brief/refresh: AI is not configured for
        the caller, and nothing was sent. A superset of the JSON error shape
        (`error` is the same member as in `SchedulingErrorResponse` and
        `ErrorResponse`), so a client that reads only `error` shows the
        sentence.
      properties:
        error:
          type: string
          minLength: 1
          description: Equal to `notConfigured.message`.
        notConfigured:
          $ref: '#/components/schemas/AINotConfigured'
      required: [error, notConfigured]
      additionalProperties: false

    AIStatus:
      type: object
      description: >
        NEW-llm-bring-your-own. Read-only summary on the settings document of
        whether AI works for the caller right now, by the same table as
        `AINotConfigured` (spec AC-8). Exactly one of `provider` and
        `notConfigured` is present: `provider` (with `configuration`) exactly
        when `configured` is true, `notConfigured` exactly when `configured`
        is false (rows 1, 3, 5-8, 10, 11), so a client always has the reason
        and the enablers to render the notice of spec AC-21. Also the 200 of
        confirmOrganizationAI (Part 2). It does not check the destination: a
        configured caller whose stored destination is refused is
        `configured: true` and gets the 422 / refusal sentence when a request
        is attempted.
      properties:
        configured:
          type: boolean
          description: True exactly in rows 2 and 4 (row 9 is reserved).
        provider:
          type: string
          enum: [openai, anthropic, azure_openai, bedrock, vertex]
          description: Present exactly when `configured` is true; the provider requests go to.
        configuration:
          type: string
          enum: [own, organization]
          description: >
            NEW-llm-bring-your-own Part 2. Present exactly when `configured` is
            true: `own` in row 2 (the caller's provider, key and destination),
            `organization` in row 4 (the organisation's at the confirmed
            version, and nothing of the caller's, parent D-18).
        inOrganization:
          type: boolean
          description: >
            Whether the caller belongs to an organisation. Lets a client offer
            "use my organisation's AI" only to a member (spec AC-21; Part 2). Says nothing else about the organisation.
        notConfigured:
          $ref: '#/components/schemas/AINotConfigured'
          description: >
            Present exactly when `configured` is false; absent exactly when it
            is true. Why AI does not work for the caller and who can turn it
            on: the same reason the caller's parse, brief refresh and probe
            `{}` give (spec AC-8, AC-40).
      required: [configured, inOrganization]
      additionalProperties: false

    LLMApiKeysSet:
      type: object
      description: >
        NEW-llm-bring-your-own (spec D-5). For each key-based provider, whether
        a key bound to it is on file for the caller. The only thing a reader
        learns about the keys; the keys themselves are never returned.
      properties:
        openai:
          type: boolean
        anthropic:
          type: boolean
        azure_openai:
          type: boolean
        bedrock:
          type: boolean
        vertex:
          type: boolean
      required: [openai, anthropic, azure_openai, bedrock, vertex]
      additionalProperties: false

    # ------------------------------------------------- organisation AI (Part 2)

    OrganizationAIConfiguration:
      type: object
      description: |
        NEW-llm-bring-your-own Part 2 (spec §3.2, parent D-7). The
        organisation's AI configuration as every member reads it, identical
        for every member (getOrganizationAI, and the 200 of
        patchOrganizationAI). NEVER carries the key: `keySet` is the only fact
        about it.

        `configured` is true exactly when the configuration is complete: a
        `provider`, a key for it, and for `azure_openai` a non-empty
        `azureEndpoint` and `azureDeployment` (every other value has a
        default: `model` the provider's default model, `baseUrl` the vendor's
        public host, `azureApiVersion` the default API version, `awsRegion`
        `us-east-1`). Only a complete configuration can be used (row 4 of the
        table on AINotConfigured) or confirmed (confirmOrganizationAI).

        Destination properties appear only for the provider they apply to:
        `baseUrl` for `openai` and `anthropic`; `azureEndpoint`,
        `azureDeployment` and `azureApiVersion` for `azure_openai`;
        `awsRegion` for `bedrock`; none for `vertex`. `model` is the model for
        `openai`, `anthropic`, `bedrock` and `vertex` (absent for
        `azure_openai`, whose deployment names it). An empty string means the
        default. All are absent when `provider` is absent.
      required: [configured, keySet, personalKeysAllowed, configurationVersion, changeableBy]
      properties:
        configured:
          type: boolean
        provider:
          type: string
          enum: [openai, anthropic, azure_openai, bedrock, vertex]
          description: Present exactly when a provider is set.
        model:
          type: string
        baseUrl:
          type: string
          description: '`openai` / `anthropic` only. `""` is the vendor''s public host.'
        azureEndpoint:
          type: string
        azureDeployment:
          type: string
        azureApiVersion:
          type: string
        awsRegion:
          type: string
        keySet:
          type: boolean
          description: Whether a key bound to `provider` is stored. Never the key.
        personalKeysAllowed:
          type: boolean
          description: >
            Owner O-12. `true` (the default) means a member's own provider and
            key take precedence for that member (rows 2-3). `false` means no
            member's personal key is sent: a member on their own or a removed
            provider has no AI (rows 10-11) until they choose "Use my
            organisation's AI" and confirm (spec P2-D2, current default,
            pending the owner); followers are unaffected (rows 4-6).
        configurationVersion:
          type: integer
          minimum: 0
          description: >
            `0` when no configuration was ever set. Advances by one on every
            change of `provider` (including the removal, `provider: ""`),
            every write of `apiKey` (keys are never compared), and every
            change of a destination property (spec P2-D4), never otherwise.
            Never reused within an organisation: removal keeps the count, so
            a configuration set after a removal never has a version an
            earlier configuration had (contract revision 3, spec P2-D17,
            P2-AC-42). A version fixes `provider`, the key and the
            destination properties; `model` and `personalKeysAllowed` are not
            part of it, and a request in row 4 sends the model read together
            with the version. A member's confirmation is for one version
            (confirmOrganizationAI); an administrator's change names the
            version it was made from (patchOrganizationAI).
        updatedAt:
          type: string
          format: date-time
          description: When the configuration last changed. Absent when it never was set.
        changeableBy:
          type: string
          const: organization_admin
          description: >
            Who can change this: an administrator of the organisation proven
            per change by PAC-50's step-up (purpose `llm_org_key_write`) or the
            deployment's break-glass list. Never names a person.
      additionalProperties: false

    OrganizationAIConfigurationUpdate:
      type: object
      description: |
        NEW-llm-bring-your-own Part 2. Body of patchOrganizationAI. MERGE:
        an absent property is unchanged; a present one is set to exactly that
        value; `null` is a 400. `configurationVersion` (required, contract
        revision 2) names the version the change was made from, plus at
        least one property to change.

        * `provider` set to a provider DIFFERENT from the stored one replaces
          the whole configuration: `apiKey` (non-empty) is required, and every
          property not in the body takes its default (`""`), except
          `personalKeysAllowed`, which is kept unless the body names it
          (contract revision 3.1, spec revision 2.1). A key is never
          carried from one provider to another (spec P2-D7).
        * `provider: ""` removes the whole configuration, key included. No
          other property may be sent with it (400), so the removal is
          unambiguous (`configurationVersion` excepted); the stored
          `personalKeysAllowed` is kept, and so is the version count: the
          removal advances `configurationVersion` and the next setup names
          that version (never reused, contract revision 3).
        * `apiKey: ""` removes only the key (the configuration is then not
          complete; followers answer `nothing_configured`, P2-AC-13). A
          non-empty `apiKey` replaces the key for the provider after this
          write; with no provider stored or sent it is a 400. Because
          `configurationVersion` must be current, a key typed against one
          provider is never stored under another provider that a concurrent
          change installed (challenge B-1).
        * `model` and every destination property with no provider stored
          or sent is a 400 (`<property> requires a provider`).
        * A destination property that does not apply to the provider after
          this write is a 400 (`<property> does not apply to <provider>`),
          not ignored; so is `model` with `azure_openai`.
        * `personalKeysAllowed` may be changed whether or not the
          configuration is complete (spec P2-D3).
      required: [configurationVersion]
      minProperties: 2
      properties:
        configurationVersion:
          type: integer
          minimum: 0
          description: >
            Contract revision 2 (challenge B-1). The `configurationVersion`
            of the configuration the administrator was shown
            (getOrganizationAI; `0` for an organisation that never set one).
            Required: an absent value is the 400, never read as `0`
            (contract revision 3). Not equal to the current version: the
            409, checked early (step 2a) and decided by the atomic
            conditional write (step 4); a conflict never consumes the proof.
        provider:
          type: string
          enum: ['', openai, anthropic, azure_openai, bedrock, vertex]
        model:
          type: string
        apiKey:
          type: string
          writeOnly: true
          description: Never returned, by any operation, in any status (PAC-24, owner O-7).
        baseUrl:
          type: string
        azureEndpoint:
          type: string
          description: >
            Contract revision 3 (spec P2-D18): for the organisation,
            `https://<host>` with at most one trailing `/` and no path,
            query, fragment or userinfo, because every member reads it;
            otherwise the 400 (shape). The host must be approved as for a
            user's (PAC-66).
        azureDeployment:
          type: string
        azureApiVersion:
          type: string
        awsRegion:
          type: string
        personalKeysAllowed:
          type: boolean
      additionalProperties: false

    OrganizationAIWriteForbiddenResponse:
      description: |
        The 403 of patchOrganizationAI (NEW-llm-bring-your-own Part 2), the
        shapes of PAC-50's SsoWriteForbiddenResponse for this purpose.
        Exactly one variant applies, told apart by `error`; all keep the
        shared `{error}` envelope.
      oneOf:
        - $ref: '#/components/schemas/SsoWriteMembershipRequired'
        - $ref: '#/components/schemas/OrganizationAIWriteStepupRequired'
        - $ref: '#/components/schemas/OrganizationAIWriteFreshLoginRequired'

    OrganizationAIWriteStepupRequired:
      type: object
      description: |
        A member with no live `llm_org_key_write` grant who is not a
        break-glass address. As PAC-50's SsoWriteStepupRequired: the step-up
        is optional; before navigating, the client explains `without_stepup`
        and `stepup_scopes` and lets the user decline. If the user goes
        ahead, the client asks which provider administers the organisation
        (only keys of `stepup_scopes`) and navigates the browser to
        `stepup_url` with `?provider=<p>&purpose=<stepup_purpose>`. The
        landing page then carries `&purpose=llm_org_key_write`. A live
        `sso_write` grant the caller may hold was not consumed.
      required: [error, stepup_url, stepup_purpose, stepup_scopes, without_stepup]
      properties:
        error:
          type: string
          const: organization_ai_write_requires_admin_stepup
        stepup_url:
          $ref: '#/components/schemas/SsoStepupUrl'
        stepup_purpose:
          type: string
          const: llm_org_key_write
          description: The `purpose` query value the client sends to startSsoAdminStepup.
        stepup_scopes:
          $ref: '#/components/schemas/SsoStepupScopes'
        without_stepup:
          $ref: '#/components/schemas/SsoWithoutStepup'
      additionalProperties: false

    OrganizationAIWriteFreshLoginRequired:
      type: object
      description: |
        The caller's email is on the break-glass list but the session JWT was
        issued 10 minutes ago or more, or more than one minute in the future
        (PAC-50 AC-14a), or the same session already made one
        organisation-AI change (spec P2-D13, contract revision 2). The client
        sends the user through sign-in again; an `llm_org_key_write` grant
        also satisfies the gate.
      required: [error]
      properties:
        error:
          type: string
          const: organization_ai_write_requires_fresh_login
      additionalProperties: false

    OrganizationAIConsentRequest:
      type: object
      description: Body of confirmOrganizationAI.
      required: [configurationVersion]
      properties:
        configurationVersion:
          type: integer
          minimum: 1
          description: The `configurationVersion` of the configuration the user was shown and confirmed.
      additionalProperties: false

    OrganizationAIConsentConflict:
      type: object
      description: >
        409 of confirmOrganizationAI and (contract revision 2) of
        patchOrganizationAI: nothing recorded or stored, no grant consumed.
        A superset of the JSON error shape. patchOrganizationAI gives only
        `configuration_changed`.
      required: [error, reason, organization]
      properties:
        error:
          type: string
          minLength: 1
        reason:
          type: string
          enum: [organization_not_configured, configuration_changed]
        organization:
          $ref: '#/components/schemas/OrganizationAIConfiguration'
      additionalProperties: false

    # -------------------------------------------------------------- settings

    DaySchedule:
      type: object
      description: storage.DaySchedule. No omitempty - all three always serialise.
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
          description: >
            `HH:MM`, validated with a shape check AND `time.Parse("15:04")`, so
            `25:00` is rejected. Empty string allowed when `enabled` is false.
            PAC-24 corrected the pattern: the previous `^[0-9]{2}:[0-9]{2}$`
            both admitted `99:99` (which the server rejects) and forbade the
            empty string (which the server accepts and which GET returns for a
            disabled day) - it was wrong in both directions.
        end:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
      required: [enabled, start, end]
      additionalProperties: false

    WorkingHoursSchedule:
      type: object
      description: >
        storage.WorkingHoursSchedule. Replaced WHOLE by a PATCH that mentions it;
        there is no deep merge (spec AC-9).

        **Normalised on read** by `Settings.normalizeSchedules`
        (`backend/storage/settings.go:92-106`), which `loadScheduleFields` calls
        on every read path (`:495`): an empty `mode` becomes
        `{mode: all_days, default: {enabled: true, start: workStart or 09:00,
        end: workEnd or 18:00}, days: {}}`; an `all_days` document whose
        `default` is entirely empty (`enabled:false, start:"", end:""`) has that
        default replaced the same way (`:95-99`); and a nil `days` map becomes
        `{}`.

        **So `{"mode":"all_days","default":{"enabled":false,"start":"","end":""},
        "days":{}}` is NOT a document GET can return** - the `:95-99` branch
        rewrites it before it reaches the wire. That matters because it is the
        one document the shipped consumer cannot render: `normalizeInterval`
        rejects an empty `start`/`end` and returns `undefined`
        (`smart-calendar-flow/src/api/client.ts:477-488`), `normalizeWorkingHours`
        then returns `undefined` because `default` is undefined and `days` is
        empty (`:505-517`), and `normalizeSettings` reaches
        `delete out.working_hours` (`:543`) - the per-day section disappears with
        no error and no empty state, which is the silent blank spec AC-20 exists
        to end.

        The `by_day` arm of the same shape IS reachable, because `:95-99` guards
        on `mode == "all_days"`: `{"mode":"by_day", …, "days":{}}` normalises to
        itself and produces the identical `undefined` in the consumer. PAC-24
        closes it at the point of entry rather than describing it - a `by_day`
        document must carry at least one weekday (400:
        `workingHours.days must contain at least one weekday when mode is
        by_day`). `by_day` with no days also means "this user never works",
        which no consumer intends and which `WorkWindow` already renders as
        `enabled:false` for every day (`:117-121`).
      properties:
        mode:
          type: string
          enum: ['', all_days, by_day]
          description: >
            Compared EXACTLY by the handler (revision 3): `"BY_DAY"` and
            `" all_days"` are a 400. Before PAC-24 the validator lower-cased and
            trimmed, then persisted whatever was sent. Migration 024 turns a
            stored mode that equals `by_day` ignoring case (and NOT trimmed:
            `" by_day"` never matched) into `by_day`, and any other non-empty
            value into `all_days` - exactly how `WorkWindow` treated them (it only
            special-cases `by_day`, case-insensitively). It also clears an
            enabled entry that would fail validation in the half the stored mode
            ignored before the upgrade (`days` under `all_days`, `default` under
            `by_day`), which `WorkWindow` never read. It does not touch the half
            in use, nor a `default` derived on read for a mode-`""` row: a write
            of `workingHours` must make those valid (see `SettingsUpdate`).

            `''` is in the enum because the server accepts it
            (`:129`, `mode != "" && mode != "all_days" && mode != "by_day"`) and
            because the contract must describe what is, not what should be
            (factory §7). Revision 1 of this contract omitted `''` while the
            description two lines below said it was accepted - a schema
            disagreeing with its own prose. It is accepted on write ONLY when
            `days` is empty; otherwise it is the existing 400
            `workingHours.mode is required when day-specific hours are provided`
            (`:132-134`). That conditional is cross-property and OpenAPI cannot
            express it, so it stays a documented 400 rather than becoming a
            schema narrowing - narrowing here would be a NEW rejection, and spec
            §6 requires both tests in
            `backend/api/handlers_settings_schedule_test.go` to keep passing
            unchanged.

            A GET never returns `''`, because normalisation rewrites it.
        default:
          $ref: '#/components/schemas/DaySchedule'
          description: >
            Validated whenever at least one of enabled/start/end is set, in
            either mode (revision 4). Ignored by WorkWindow() in by_day mode.
        days:
          type: object
          description: >
            Keys are lowercase English weekday names, and PAC-24 makes that a
            constraint THE HANDLER ENFORCES (revision 3): `propertyNames` below
            documents it, but no generator carries `propertyNames` into a
            validator, so the server's exact-match check is the enforcement point
            (contract challenge r2, finding 4). Migration 024 removes stored keys
            that are not exactly one of the seven names - they never matched
            `WorkWindow`'s lookup, so removing them changes no behaviour; it also
            removes entries whose `start`/`end` are neither empty nor a clock.
            Keys and entries are checked WHATEVER THE MODE (revision 4): a
            `days` map stored under `all_days` is still returned by GET. Before
            PAC-24 the validator lower-cased keys and only looked at `days` in
            `by_day` mode, so `"Monday"` was stored and never matched. In
            `by_day` mode a missing weekday means "not working".
          propertyNames:
            enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
          additionalProperties:
            $ref: '#/components/schemas/DaySchedule'
      required: [mode, default, days]
      additionalProperties: false

    LunchBreakSchedule:
      type: object
      description: >
        storage.LunchBreakSchedule - a bare map keyed by lowercase weekday name.
        Normalised to `{}` (never null) on read
        (`backend/storage/settings.go:103-105`). A per-day entry overrides the
        legacy global `lunchStart`/`lunchEnd`/`protectLunch` trio, including
        disabling lunch for that day. Replaced whole by a PATCH that mentions it;
        `lunchBreaks: {}` clears every per-day override (spec AC-9).

        Keys are enforced EXACTLY by the handler (revision 3; generators drop
        `propertyNames`), and migration 024 removes stored keys that are not one
        of the seven lowercase names, or whose `start`/`end` are neither empty
        nor a clock. Before PAC-24 the validator lower-cased the key, so a
        `"Monday"` key was stored and never matched `LunchWindow`'s lookup.
      propertyNames:
        enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
      additionalProperties:
        $ref: '#/components/schemas/DaySchedule'

    Settings:
      type: object
      description: >
        The settings document for ONE user, returned by GET and by PATCH. Every
        property is always present. It has NO `llmApiKey` property at all: the
        key is write-only and is never returned (spec AC-11); `llmApiKeySet`
        reports whether one is on file. Property names come straight from the
        json tags on storage.Settings, camelCase throughout. `ID`,
        `MicrosoftTokens` and `ZoomTokens` are `json:"-"` and never appear.

        PAC-24 revision 3 makes this a concrete schema rather than an `allOf`
        over a shared field set with `readOnly`/`writeOnly` markers: all three
        generators (oapi-codegen, openapi-typescript, typed-openapi) dropped
        those markers and generated a response type carrying `llmApiKey`, and
        typed-openapi also dropped the `required` list (contract challenge,
        revision 2, finding 1). The property map is shared with
        `SettingsUpdate` through a YAML anchor, so the two cannot drift; every
        `Settings` document is a valid `SettingsUpdate` body.

        Every value this schema forbids has been normalised away in storage by
        migration 024 (see `SettingsUpdate` and contracts/features/PAC-24.md,
        Revisions 3 and 4), so a GET always satisfies it.
      properties: &settingsProperties
        workStart:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
          description: >
            `HH:MM`, OR THE EMPTY STRING. DB default `09:00`. PAC-24 tightened
            the shape from `^[0-9]{2}:[0-9]{2}$`, which admitted `99:99` (the
            server's own check was the same loose regexp, so `99:99` was
            stored), and at the same time widened it to admit `""`, which the
            server both accepts and returns.

            `""` is not a modelling slip, it is the state the data is in.
            `validateSettings` skips the format check exactly when the value is
            empty (`backend/api/handlers_settings.go:75`,
            `if val != "" && !timePattern.MatchString(val)`), and every row
            zeroed by API-004 - the defect this feature exists to repair -
            already holds `""` in this column, because the pre-PAC-24 full
            replace persisted each omitted property as its Go zero value. A
            strict `HH:MM` pattern would make day-one GETs fail the contract they
            were generated from, and the generated zod schema would reject the
            body before any UI saw it. It is also what makes spec AC-7
            satisfiable: `{"workStart": ""}` is the documented way to clear this
            setting, and under the merge rule a present property is stored
            exactly as given.

            Consumers already treat `""` as meaningful rather than as damage:
            `WorkWindow` falls back to `09:00`/`18:00` when the effective start
            or end is empty (`backend/storage/settings.go:124-127`).
            The same widening, for the same reason, was already applied to
            `DaySchedule.start`/`end`. Contrast `recapSendTime`, which is
            NOT widened - see its own description.
        workEnd:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
          description: >
            `HH:MM` or `""`, as `workStart`. DB default `18:00`. PAC-24 adds the
            cross-property check that workEnd > workStart, which OpenAPI cannot
            express; it is a 400 (`workEnd must be after workStart`). That check
            applies only when BOTH values are non-empty, which is the existing
            handler behaviour and keeps `""` a clear rather than a 400. Before
            PAC-24 an inverted working day was accepted and produced a
            zero-length day at use (API-082).
        timezone:
          type: string
          description: >
            IANA name, e.g. `Europe/Paris`. DB default `UTC`. PAC-24 validates
            it with time.LoadLocation and returns 400
            `timezone is not a known IANA location`. Before PAC-24 any string was
            accepted and every engine silently fell back to UTC, so a typo moved
            a user's whole schedule with no error anywhere (API-082).
        focusMinBlockMinutes:
          type: integer
          minimum: 0
          description: 'Rejected when < 0. DB default 25.'
        focusMaxBlockMinutes:
          type: integer
          minimum: 0
          description: >
            Rejected when < 0. DB default 120. PAC-24 adds the cross-property
            check focusMinBlockMinutes <= focusMaxBlockMinutes, which OpenAPI
            cannot express; it is a 400 (API-082).
        focusDailyTargetMinutes:
          type: integer
          minimum: 0
          description: 'Rejected when < 0. DB default 240.'
        outOfHoursMeetingsPerWeek:
          type: integer
          minimum: 0
          description: >
            Weekly allowance of meetings outside working hours. 0 disables
            out-of-hours scheduling entirely (canScheduleOutOfHours returns
            false when <= 0).
        autoDeclineOutsideWorkingHours:
          type: boolean
        focusLabel:
          type: string
          description: 'DB default `Focus Time`.'
        focusColor:
          type: string
          description: 'Hex colour string. Not validated. DB default `#4F46E5`.'
        lunchStart:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
          description: >
            `HH:MM` or `""`. DB default `12:00`. Legacy global; overridden
            per-day by lunchBreaks. `""` here is the strongest case of the four:
            it is not merely tolerated but LOAD-BEARING. `LunchWindow` returns
            `enabled: false` precisely when `lunchStart` or `lunchEnd` is empty
            (`backend/storage/settings.go:141-142`), so `""` is how "this user
            has no protected lunch" is represented. Forbidding it in the schema
            would make an existing, meaningful state unrepresentable.
        lunchEnd:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
          description: >
            `HH:MM` or `""`, as `lunchStart`. DB default `13:00`. PAC-24 adds the
            cross-property check lunchEnd > lunchStart as a 400 (API-082),
            applied only when both values are non-empty.
        protectLunch:
          type: boolean
          description: 'DB default true.'
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          description: 'Rejected when < 0. DB default 5.'
        bufferAfterMinutes:
          type: integer
          minimum: 0
          description: 'Rejected when < 0. DB default 5.'
        bufferEnabled:
          type: boolean
        bufferMinMeetingMinutes:
          type: integer
          minimum: 0
          description: >
            PAC-24 adds the `>= 0` check its two siblings already had; before
            that a negative value was accepted here alone (API-082).
        bufferSkipBackToBack:
          type: boolean
        workingHours:
          $ref: '#/components/schemas/WorkingHoursSchedule'
        lunchBreaks:
          $ref: '#/components/schemas/LunchBreakSchedule'
        compressionEnabled:
          type: boolean
        autoScheduleEnabled:
          type: boolean
        autoScheduleCron:
          type: string
          description: >
            5-field cron (minute hour dom month dow), parsed with
            robfig/cron v3 using exactly those five fields. Empty string skips
            validation. DB default `0 8 * * *`.
        llmProvider:
          type: string
          enum: ['', organization, unsupported, openai, anthropic, azure_openai, bedrock, vertex]
          description: >
            The caller's AI choice (NEW-llm-bring-your-own, spec §3; the table
            is on `AINotConfigured`).
            `""`: AI off by the caller's own choice (row 1). A row stored as
            `""` before this change stays off and never follows the
            organisation (spec AC-17, D-9).
            `organization`: use my organisation's AI (rows 4-6). The stored
            default for an account created after Part 1 (owner decision
            O-5). Part 2: requests then use the organisation's configuration
            once it is complete and the caller has confirmed it
            (confirmOrganizationAI). Accepted on write whether or not the
            caller belongs to an organisation (for a caller with none it is
            row 6 with `enablers: [user]`).
            `openai`, `anthropic`, `azure_openai`, `bedrock`, `vertex`: the
            caller's own key-based provider (rows 2-3; rows 10-11 while the
            caller's organisation forbids personal keys, Part 2). Writing
            `""` or a provider deletes the caller's organisation
            confirmation (Part 2, spec P2-AC-36). A row stored on
            `bedrock`, `azure_openai` or `vertex` before this change keeps that
            choice and its stored destination values, and needs a key (spec
            AC-8, AC-40).
            `unsupported`: a READ value only in effect. The stored choice is a
            provider Paceday no longer supports (`ollama`; rows 7-8). The
            stored value is not rewritten (spec D-10), so a rollback restores
            it. A write carrying `unsupported` is accepted only when the
            caller's row already reads as `unsupported` (the document read and
            written back unchanged, spec AC-9); otherwise it is a 400.
            `ollama` is never returned and is a 400 on write (spec AC-6, AC-7).
        llmModel:
          type: string
          description: >
            Model for `openai` and `anthropic`. Provider default applied at
            call time when empty: `gpt-4o-mini` (openai),
            `claude-haiku-4-5-20251001` (anthropic). Not used by
            `azure_openai` (`azureDeployment`), `bedrock` (`bedrockModel`) or
            `vertex` (`vertexModel`).
        llmApiKeySet:
          type: boolean
          readOnly: true
          description: >
            `true` exactly when a key bound to the CURRENT `llmProvider` is on
            file; always `false` when `llmProvider` is `""`, `organization` or
            `unsupported` (NEW-llm-bring-your-own, spec D-5). Before that change
            it meant "the single key slot is non-empty". It never says anything
            about an organisation's key.

            `readOnly`, so a client that submits back a document it just read
            may include it; it is accepted and ignored (PAC-24 AC-10). It is NOT
            the way to clear a key - send `llmApiKey: ""` for that.
        llmApiKeysSet:
          $ref: '#/components/schemas/LLMApiKeysSet'
          readOnly: true
          description: >
            Read-only (NEW-llm-bring-your-own, spec D-5, AC-15): which providers
            have a key bound to them for the caller, so a client can show that
            switching back to a provider makes its earlier key usable again.
            Accepted and ignored on write, like `llmApiKeySet`.
        llmUnboundApiKeySet:
          type: boolean
          readOnly: true
          description: >
            Read-only (NEW-llm-bring-your-own, spec AC-16). `true` when a key
            stored before this change is on file that is bound to no provider:
            the account's provider at the upgrade was not `openai` or
            `anthropic`. Such a key is never sent anywhere and is never deleted
            implicitly (spec D-5): not by the upgrade and not by a write of
            `llmApiKey`. Only the explicit write-only `llmUnboundApiKey: ""`
            removes it (see `patchSettings`). Accepted and ignored on write.
        aiStatus:
          $ref: '#/components/schemas/AIStatus'
          readOnly: true
          description: >
            Read-only (NEW-llm-bring-your-own, spec AC-8, AC-21): whether AI
            works for the caller now and, when it does not, why and who can turn
            it on. The same reason the caller's parse, brief refresh and probe
            would give. Accepted and ignored on write.
        llmBaseUrl:
          type: string
          description: >
            Destination of the `openai` or `anthropic` provider; `""` means the
            vendor's public host (`https://api.openai.com`,
            `https://api.anthropic.com`). Read by no other provider
            (NEW-llm-bring-your-own: the Ollama fallback is gone). A request is
            sent to it only when it is exactly an origin approved for the
            provider in use followed by exactly that approval's path prefix, if
            it has one (owner decision O-10), with at most one trailing `/` (see
            `testLLMConnection`). A write changing it to a non-empty value must
            be approved, in that sense, for `openai` or `anthropic` (400
            otherwise). A value stored earlier that is approved for neither
            (for example an origin written through the web's former Ollama
            field, spec D-14) is kept and returned, sent nowhere, can be written
            back unchanged and can always be cleared with `""` (spec AC-39). No
            `pattern`, for the reason given on `awsRegion`.
        awsRegion:
          type: string
          description: >
            Bedrock region. Empty means the built-in `us-east-1`. The request
            goes to `bedrock-runtime.<awsRegion>.amazonaws.com`, only if that
            host is approved in `PACEDAY_LLM_APPROVED_HOSTS_BEDROCK`. No AWS
            configuration of the deployment is read (NEW-llm-bring-your-own,
            spec D-3). A write changing it to a non-empty value must be a valid
            region name (one host label; PAC-66). Deliberately no `pattern`:
            this map is shared with `Settings`, and rows stored before PAC-66
            are kept as they are (PAC-66 spec D-3), so a pattern would make the
            response schema false for them.
        bedrockModel:
          type: string
          description: >
            The Bedrock model ID requests use (NEW-llm-bring-your-own, spec
            D-16). This is the property the server has always read for Bedrock;
            the web app's Bedrock picker writes it from this change on (before,
            it wrote `llmModel`, which never reached the server, and that earlier
            pick is not copied). DB default
            `anthropic.claude-sonnet-4-5-20251001-v1:0`.
        azureEndpoint:
          type: string
          description: >
            Azure OpenAI resource endpoint, e.g.
            `https://my-resource.openai.azure.com`. PAC-66: a write changing it
            to a non-empty value must be an `https` URL whose host is approved
            in `PACEDAY_LLM_APPROVED_HOSTS_AZURE_OPENAI` (400 otherwise). `""`
            is always accepted and means "not set", which is refused when a
            request would be sent. The path is not constrained (see
            `contracts/features/PAC-66.md` §7). No `format` or `pattern`, for
            the reason given on `awsRegion`.
        azureDeployment:
          type: string
          description: The Azure OpenAI deployment name requests use.
        azureApiVersion:
          type: string
          description: The `api-version` query value of Azure OpenAI requests.
        vertexModel:
          type: string
          description: >
            The Vertex AI model requests use, in express mode
            (NEW-llm-bring-your-own, spec D-4). DB default
            `gemini-2.0-flash-001`. `awsProfile`, `gcpProject`, `gcpLocation`,
            `ollamaBaseUrl` and `ollamaModel` are removed from this document:
            they only meant something in the removed modes. Their stored values
            are left untouched, are no longer read, and come back on a rollback
            (spec D-10); writing one is a 400 `unknown property: <name>`.
        calendarProvider:
          type: string
          enum: [google, outlook, webcal]
          description: >
            DB default `google`. Which calendar the product reads and writes for
            THIS user.

            Resolves U-18. The authoritative set was settled by reading the three
            consumers that switch on this value - calendar.NewProvider
            (`backend/calendar/client_factory.go:16,22,27`), the auth-status
            handler (`backend/api/handlers_auth.go:97,105,111`) and the free/busy
            service (`backend/engine/freebusy_service.go:122`). All three accept
            exactly `outlook` and `webcal` and treat every other value, including
            a typo, as Google. PAC-24 enforces the set; before it, an unknown
            value was stored and silently behaved as `google`.

            Before PAC-24 this was a property of the singleton row, so one user
            connecting Outlook switched the whole deployment
            (`backend/auth/microsoft_oauth.go:57` writes
            `calendar_provider = 'outlook' WHERE id = 1`).
        webcalUrl:
          type: string
        calendarEmail:
          type: string
          description: >
            The address of THIS user's connected calendar. Before PAC-24 the
            auth-status handler served the singleton row's value to everyone
            (API-009).
        conferencingProvider:
          type: string
          enum: [meet, zoom, teams]
          description: >
            Read with `COALESCE(conferencing_provider,'meet')`; conference.NewProvider
            switches on `zoom`, `teams`, and treats everything else as `meet`.
            So the wire values are `meet` / `zoom` / `teams`, not the frontend's
            `google_meet` / `zoom` / `teams` / `custom`. PAC-24 enforces the set
            for the same reason as calendarProvider: an unknown value was stored
            and silently behaved as `meet`.
        recapEnabled:
          type: boolean
        recapSendTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: >
            `HH:MM`, in the same form on read and on write. **STRICT: unlike the
            four legacy clock properties above, `""` is NOT admitted here, in
            either direction.** The three reasons are specific to this column and
            do not generalise:

            (a) There is no empty state to represent. The column is
            `TIME NOT NULL DEFAULT '08:00'` (`015_daily_recap.up.sql:3`), and the
            write path passes every value through
            `recapSendTimeOrDefault` (`backend/storage/settings.go:356-361`),
            which turns `""` into `08:00`. So no row can hold an empty send time
            and no GET can return one - the `COALESCE(...,'')` at `:224` and
            `:439` is defensive and unreachable. This is the difference from
            `workStart`/`lunchStart`, where `""` both exists in the data and
            carries meaning.

            (b) Admitting `""` would make this contract lie about its own merge
            rule. `PATCH /api/settings` states that a property present is set to
            exactly the value given; `""` here would instead be silently
            rewritten to `08:00`. A client asking to clear a value and being told
            `200` while the server stored something it did not ask for is the
            exact silent-success failure mode this contract refuses for `null`.

            (c) PAC-24 therefore removes the substitution: `""` is a 400
            (`recapSendTime must be in HH:MM format`), which is the same message
            spec AC-17 already requires for a malformed value and which AC-16
            requires instead of an internal failure.

            **This requires a narrow amendment to spec AC-7**, which as written
            says an empty value of a setting's type always clears it. AC-7 must
            exempt `recapSendTime` on the ground that it has no empty state. The
            contract author may not edit the spec; the amendment is named in
            `contracts/features/PAC-24.md` §"Revision 2" and must be made before
            stage 3.

            Resolves U-19, and resolves it by CHANGING the server rather than by
            documenting what it did. The column is Postgres `TIME`
            (`015_daily_recap.up.sql:3`) and was read as `recap_send_time::TEXT`,
            which renders `HH:MM:SS` (`08:00:00`, with a fractional part when one
            was stored) - contradicting the struct comment that claims `HH:MM`
            and contradicting the write format, so no client could round-trip
            this value. PAC-24 renders the column to `HH:MM` on read and rejects
            anything else on write. Note: the marker was originally to be settled
            by observing a live response; it is settled here by fixing the
            asymmetry instead, which makes the observation unnecessary. Spec
            AC-16 is the integration test that proves the rendered form.
        recapSendTo:
          type: string
          enum: [dm, channel]
          description: >
            DB CHECK constraint enforces this. PAC-24 validates it on the settings
            write too; before that only the daily-recap PATCH did, so a bad value
            sent to PUT /api/settings reached the DB CHECK and surfaced as a 500
            (API-081).
        recapChannelId:
          type: string
        recapIncludeBriefs:
          type: boolean
          description: 'DB default true.'
        recapIncludeFocus:
          type: boolean
          description: >
            DB default true. Exposed as `include_focus_blocks` by the daily-recap
            endpoints.
        recapIncludeHabits:
          type: boolean
          description: 'DB default true.'
        timeFormat:
          type: string
          enum: ['12h', '24h']
          description: >
            How the signed-in web app shows times of day to this user (PAC-55):
            `12h` ("2:30 PM", the default, exactly as before PAC-55) or `24h`
            ("14:30", two-digit hour, no AM/PM). DB default `12h`; a user who
            never chose reads `12h`. There is no "unset": `""` and any other
            STRING are a 400 `timeFormat must be 12h or 24h`; a non-string
            (`24`, `true`, `["24h"]`) fails decoding first and is a 400
            `invalid JSON: timeFormat has the wrong type`; `null` is a 400 like every
            property of this body. Display only: the server formats
            nothing with it, and the public booking page ignores it (always
            12-hour, PAC-55 §5).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: >
            Server-managed (NOW() on every write). May be present in a request
            body - a client submitting back a document it just read will include
            it - and is ignored (spec AC-10).
      required:
        - workStart
        - workEnd
        - timezone
        - focusMinBlockMinutes
        - focusMaxBlockMinutes
        - focusDailyTargetMinutes
        - outOfHoursMeetingsPerWeek
        - autoDeclineOutsideWorkingHours
        - focusLabel
        - focusColor
        - lunchStart
        - lunchEnd
        - protectLunch
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - bufferEnabled
        - bufferMinMeetingMinutes
        - bufferSkipBackToBack
        - workingHours
        - lunchBreaks
        - compressionEnabled
        - autoScheduleEnabled
        - autoScheduleCron
        - llmProvider
        - llmModel
        - llmApiKeySet
        - llmApiKeysSet
        - llmUnboundApiKeySet
        - aiStatus
        - llmBaseUrl
        - awsRegion
        - bedrockModel
        - azureEndpoint
        - azureDeployment
        - azureApiVersion
        - vertexModel
        - calendarProvider
        - webcalUrl
        - calendarEmail
        - conferencingProvider
        - recapEnabled
        - recapSendTime
        - recapSendTo
        - recapChannelId
        - recapIncludeBriefs
        - recapIncludeFocus
        - recapIncludeHabits
        - timeFormat
        - updatedAt
      additionalProperties: false

    SettingsUpdate:
      type: object
      description: >
        PATCH /api/settings body - the only settings write. Nothing is required:
        a property absent means "leave it as it is", and `{}` is a valid no-op
        request. A property present is applied exactly as given - `""`, `0` and
        `false` are values, not absences, except where a property's enum or
        pattern excludes `""` (`recapSendTime`, `recapSendTo`,
        `calendarProvider`, `conferencingProvider`, `timeFormat`), where `""` is a 400 like
        any other value outside the set (spec AC-7 as amended 2026-10-12).

        The same properties as `Settings` (one YAML anchor) plus the write-only
        `llmApiKey` and `llmUnboundApiKey`. `llmApiKeySet`, `llmApiKeysSet`,
        `llmUnboundApiKeySet`, `aiStatus` and `updatedAt` are accepted and ignored, so a document read
        from GET can be submitted back unchanged (spec AC-10;
        NEW-llm-bring-your-own AC-9).

        No property is nullable: `null` is a 400 `<property> must not be null`
        and an unknown property - including a snake_case spelling of a real one
        - is a 400 `unknown property: <name>` (spec AC-8). These are enforced
        by the handler, not by a generated validator.

        Validation applies to the properties whose value the body CHANGES. A
        property sent with the value already stored is not re-validated, so a
        GET document submitted back unchanged is always accepted - including a
        legacy combination a newer cross-property rule would reject (an end
        before a start, a focus minimum above the maximum) - and a stored value
        never locks the user out of saving something else (challenge r2,
        finding 2).

        `workingHours` is ONE property and is replaced whole, so a write that
        changes it must make the whole document valid: both its `default` and
        its `days`, whatever the mode. That includes a `default` the client
        derived from legacy values - for a row whose mode was `""` the server
        derives it from `workStart`/`workEnd` on read - so a client switching
        such a row to `by_day` must send a valid `default` (revision 6).

        `workingHours` and `lunchBreaks` are replaced whole when present, not
        deep-merged (spec AC-9).

        Before PAC-24 this was the body of `PUT /api/settings`, a replace: every
        omitted property was persisted as its Go zero value (API-004). That
        operation is removed because the two repositories deploy together
        (spec PAC-24, Decisions 2026-10-12, OQ-3).
      properties:
        <<: *settingsProperties
        llmApiKey:
          type: string
          writeOnly: true
          description: >
            WRITE-ONLY. Accepted on write; never present in any response from
            any operation (spec AC-11). NEW-llm-bring-your-own: bound to the
            provider the row has after the write (see `patchSettings`); every
            one of the five providers needs one, and a non-empty value is a 400
            when that provider is `""`, `organization` or `unsupported`. It
            never touches a key bound to no provider (`llmUnboundApiKeySet`);
            only `llmUnboundApiKey: ""` removes that one.

            Under the merge semantics this needs no special case: omit it and
            the stored key is unchanged; send `""` and it is cleared; send a
            value and it is replaced (spec AC-13). There is no way to read it
            back, by design - someone who loses their key re-enters it. Do not
            add a reveal affordance later.

            Before PAC-24 it was returned in cleartext from a row shared by every
            authenticated account (API-002 + API-003), and wiped by any write that
            omitted it (API-004). Every key configured before this ships must be
            treated as compromised and rotated - closing the read path does not
            un-expose it (spec §5, OQ-5).
        llmUnboundApiKey:
          type: string
          enum: ['']
          writeOnly: true
          description: >
            WRITE-ONLY, NEW-llm-bring-your-own (spec D-5, AC-16; contract
            challenge 2026-10-28, blocking 2). The one way to remove a key
            stored before that change and bound to no provider
            (`Settings.llmUnboundApiKeySet`). The only accepted value is `""`,
            which removes it (a no-op when there is none); any other value is
            the 400 `llmUnboundApiKey must be "" (it can only remove the key bound to no provider)`
            and nothing is stored. A legacy key cannot be written or replaced
            through this property: a new key is always entered for a provider,
            through `llmApiKey`. Never present in any response.
      additionalProperties: false

    # ----------------------------------------------------------- daily recap

    DailyRecapSettings:
      type: object
      description: >
        Hand-built map in dailyRecapHandlers.getSettings. snake_case, and the
        key names do not mirror the camelCase Settings keys one-to-one.
      properties:
        enabled:
          type: boolean
          description: settings.recapEnabled
        send_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: >
            settings.recapSendTime, `HH:MM`. PAC-24 pins the rendered form; it
            was `HH:MM:SS` here too (U-19).
        send_to:
          type: string
          enum: [dm, channel]
          description: settings.recapSendTo
        channel_id:
          type: string
          description: settings.recapChannelId
        include_briefs:
          type: boolean
          description: settings.recapIncludeBriefs
        include_focus_blocks:
          type: boolean
          description: settings.recapIncludeFocus (name differs)
        include_habits:
          type: boolean
          description: settings.recapIncludeHabits
      required:
        - enabled
        - send_time
        - send_to
        - channel_id
        - include_briefs
        - include_focus_blocks
        - include_habits
      additionalProperties: false

    DailyRecapPatch:
      type: object
      description: >
        api.recapSettingsBody. A property absent means "leave unchanged"; a
        property present is applied.

        PAC-24 makes two changes to what this document permits, both to align it
        with PATCH /api/settings. `null` is no longer accepted anywhere: the Go
        fields are pointers, so `null` used to be indistinguishable from an
        omission, which meant a client that meant to clear something and a client
        with a serialisation bug got the same silent success. And an unknown
        property is now rejected rather than ignored, which is how a caller
        learns it has misspelt one of these seven snake_case names.
      properties:
        enabled:
          type: boolean
        send_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: >
            `HH:MM`. PAC-24 validates it; before that an unparseable value
            reached the Postgres TIME cast during the save and surfaced as a 500
            `db error`.
        send_to:
          type: string
          enum: [dm, channel]
          description: Anything else -> 400 (text/plain).
        channel_id:
          type: string
        include_briefs:
          type: boolean
        include_focus_blocks:
          type: boolean
        include_habits:
          type: boolean
      additionalProperties: false

    DailyRecapPreview:
      type: object
      description: 'Literal `{"blocks": [...]}`.'
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/SlackBlock'
      required: [blocks]
      additionalProperties: false

    SlackBlock:
      type: object
      description: >
        engine.slackBlock is `map[string]interface{}` - an untyped Slack Block Kit
        object. Nested values are themselves slackBlocks or arrays of them.

        Resolves U-20 by reading engine/daily_recap.go end to end. Every
        top-level block this API can emit is built by
        DailyRecapService.BuildMessage (`:150-236`), buildSummaryBlock
        (`:238-262`) or buildMeetingBlocks, and the complete set of top-level
        `type` values is `header`, `context`, `section`, `divider`. The only
        nested text object types are `plain_text` and `mrkdwn`.

        `additionalProperties` stays `true`: the member set of a block varies by
        type (`text`, `elements`, `emoji`), the Go type is a bare map, and
        pinning the members would be a stricter claim than the code supports.
        The `type` enum is the part that was actually determinable, and it is the
        part a client switches on. PAC-24 changes none of this behaviour - only
        what the contract says about it.
      properties:
        type:
          type: string
          enum: [header, context, section, divider]
      additionalProperties: true

    DailyRecapTestResult:
      type: object
      description: 'Literal `{"ok": true, "slack_message_ts": "..."}`.'
      properties:
        ok:
          type: boolean
          description: Always literal `true` on the 200 path.
        slack_message_ts:
          type: string
          description: Slack message timestamp returned by chat.postMessage.
      required: [ok, slack_message_ts]
      additionalProperties: false
