# Domain: teams
# Source of truth: backend/api/routes.go, backend/api/handlers_manager.go,
# backend/api/handlers_teams.go, backend/storage/manager.go, backend/storage/teams.go,
# backend/engine/manager.go, backend/engine/team_availability.go.
# Contract tests consulted: backend/api/manager_contract_test.go,
# backend/storage/manager_contract_test.go, backend/api/handlers_teams_test.go,
# backend/api/handlers_manager_test.go.
#
# All routes below are registered inside the `requireAuth` group in routes.go and
# therefore inherit the global default security scheme. This includes
# GET /api/teams/invites/{token}, whose handler comment says "(public)" but which is
# in fact mounted behind JWT auth (see teams.notes.md).
#
# TWO ERROR SHAPES EXIST. `writeError` (handlers_settings.go:206) emits
# application/json {"error": "..."}; `http.Error` emits text/plain with a bare
# message and no JSON envelope. Each response below names which one applies.
# Every 5xx is the JSON envelope with a fixed message (PAC-21); text/plain remains
# only on some 4xx responses.

paths:
  /api/manager/profile:
    get:
      operationId: getManagerProfile
      tags: [manager]
      summary: Manager flag, detection timestamp and global roster size.
      description: >
        Not team-scoped. `team_member_count` counts rows in manager_team_members for the
        caller (the global identity table), not assignments to any one formal team.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Manager profile summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerProfileSummary" }
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: setManagerProfile
      tags: [manager]
      summary: Set the caller's is_manager flag; may trigger background detection.
      description: >
        When `is_manager` is true and the profile has no `detected_at` yet, the handler
        spawns a background goroutine running DetectTeam with a 30s timeout. That
        background run persists detected members into the GLOBAL manager_team_members
        table only; it never creates team assignments, and since PAC-130 it looks up no
        account and stores no `member_user_id` (see previewManagerDetection). The response
        is written before the goroutine completes. A failed profile write is the 500 (PAC-122 SF-009): the
        200 echoes only a stored value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagerProfileUpdate" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: >
            The storage.UserProfile Go struct, with explicit snake_case json tags since
            PAC-26 (API-030). Before PAC-26 the struct had no tags and the keys were
            PascalCase. The shape still differs from the GET response on the same
            path (GET is a summary with team_member_count; POST is the profile row).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileGoStruct" }
        "400":
          $ref: "#/components/responses/JsonError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/detect:
    post:
      operationId: previewManagerDetection
      tags: [manager]
      summary: Preview detected 1:1 candidates for a team. Assigns nothing.
      description: >
        PREVIEW half of the preview-then-confirm flow. Runs DetectTeam (which does write
        the global manager_team_members identity rows and one_on_one_occurrences as a side
        effect of scanning the calendar) and then reports, per candidate, whether that
        email is ALREADY assigned to the selected team. `assigned` is hard-coded to 0:
        this endpoint never creates a manager_team_member_assignments row for any team.
        `team_id` is REQUIRED here and the caller must be the team OWNER.

        PAC-130 (spec D-2, D-6, AC-7, AC-18; contract PAC-130 §3.5): detection, here and in
        the weekly job and the background run of setManagerProfile, performs NO account
        lookup. Every identity row it writes or refreshes is written with `member_user_id`
        null; a link kept by migration 042 is left as it is (never written, refreshed or
        erased). The preview's entries depend only on the manager's calendar and roster,
        never on whether an account holds an address. Before PAC-130 (PAC-71 rule) the
        import resolved each detected address to its one DOMAIN-CONFIRMED holder and stored
        that link, which the roster and analytics then surfaced (PAC-130 O-7); a failed
        lookup was the error (PAC-122 SF-010), a step that no longer exists.
      parameters:
        - $ref: "#/components/parameters/RequiredTeamIdQuery"
      requestBody:
        required: false
        description: Body is ignored entirely.
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Detection preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanPreview" }
        "400":
          description: >
            JSON error. "team_id is required" when the query param is absent or blank;
            "team_id must be a valid UUID" when unparseable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/CalendarNotConnected"
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          description: >-
            Detection failed for a user who HAS a stored Google credential (a user with none
            gets the 401 `calendar not connected`): `{"error":"internal error"}`; or the
            per-candidate assignment lookup failed: `{"error":"db error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/manager/detect/confirm:
    post:
      operationId: confirmManagerDetection
      tags: [manager]
      summary: Explicitly assign selected candidate emails to one team.
      description: >
        CONFIRM half of the preview-then-confirm flow. The only endpoint that creates
        manager_team_member_assignments rows from detection. Runs in a single transaction
        (storage.ConfirmManagerTeamMembers) and is idempotent: a second confirm of the same
        email counts as skipped, not assigned. Emails are lowercased/trimmed by the handler
        before storage sees them. The request decoder uses DisallowUnknownFields, so any
        field other than `emails` yields 400 "invalid JSON". PAC-130: the counts depend only
        on roster rows and assignments; confirming reads and writes no account link.
      parameters:
        - $ref: "#/components/parameters/RequiredTeamIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanConfirmRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Assignment counts. `total` is the post-commit assignment count for this team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanConfirmation" }
        "400":
          description: >
            JSON error. "team_id is required", "team_id must be a valid UUID", or
            "invalid JSON" (malformed body OR an unknown field, via DisallowUnknownFields).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: >
            JSON error. "emails is required" when the key is absent or JSON null (an empty
            array is accepted and returns assigned=0, skipped=0); "email is required" for a
            blank entry; "email must be a valid email address" for an unparseable entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/team:
    get:
      operationId: getManagerRoster
      tags: [manager]
      summary: Team-scoped manager roster with this-week / last-week stats.
      description: >
        `team_id` is REQUIRED (unlike the member-mutation routes below), and membership —
        not ownership — suffices. The roster is the union of (a) manager assignments for
        this team and (b) formal team_members of this team that have no assignment yet,
        synthesised with source="formal" and cadence="none". The caller is always excluded
        from (b). Sorted case-insensitively by display_name. `members` is always an array,
        never null. A failed read of a member's week (this week or last week) is the 500,
        never a member shown with zeroes (PAC-122 SF-040).

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): merging formal members with roster entries is a keeping site:
        a roster entry represents a formal member whose stored address equals the entry's
        address case-insensitively, at ANY standing. Nothing is granted here.

        PAC-129 (spec §3.9, AC-31; contract PAC-129 §5.1): with `include_added=true` the
        union gains (c): every person ADDED to this team (no Paceday access) for whom the
        caller has no assignment on this team and who is not a formal member, as a
        read-only entry with source="added", cadence="none", cadence_custom_days null,
        last_one_on_one_at null, is_paceday_user false (never an account signal, whatever
        account holds the address), this_week and last_week zero-valued with
        data_available=false, and focus_trend_pct 0. Nothing is read from any calendar
        and nothing is stored for such an entry. Precedence for one address is: an
        assignment (today's entry, unchanged), then a formal member, then an added
        person. Without `include_added`, or with `false`, the answer is exactly today's:
        a client built before PAC-129 (whose strict schema knows only auto, manual and
        formal) never receives source="added".

        PAC-130 (spec §3.1-§3.4, D-1, D-3, D-5, D-7, D-9, D-10; contract PAC-130 §2): an
        entry's `is_paceday_user` and its week figures are decided at READ time from the
        caller's current teams and organisation. They never depend on a stored
        `member_user_id`, and no address is looked up outside those teams and that
        organisation. `is_paceday_user` is the visibility rule stated on
        ManagerRosterMember.is_paceday_user. Every entry other than source "added" takes
        exactly one of three branches, decided once per entry per request before any of
        its weeks is read, so the flag and every week of the entry agree:
        (1) PACEDAY FIGURES: the entry is visible, its account is known, the caller OWNS a
        team that account is a Paceday member of (PAC-60), and that account shares
        analytics with its manager. The account is known through team membership for
        source "formal" (the team member itself, at any address standing, as before
        PAC-130). For source "manual" or "auto" it is the one account holding the address
        DOMAIN-CONFIRMED, ignoring letter case (PAC-71 granting site); that lookup runs
        only once the address is visible. The figures are that account's stored weekly
        analytics; a week with no stored row has data_available false.
        (2) NO READ: visible, but a condition of (1) fails (the caller is a co-member or
        same-organisation only, there is no single domain-confirmed holder for a manual or
        auto entry, or consent is withheld). The entry has is_paceday_user true and
        zero-valued weeks with data_available false. No week figure is read, no free/busy
        request is made, the analytics cache is neither read nor written.
        (3) ESTIMATE: not visible. The entry has is_paceday_user false and is measured
        exactly as an address no account holds: free/busy read through the CALLER's own
        calendar credential, focus_minutes 0, meeting_minutes the busy minutes,
        free_minutes 2400 minus busy floored at 0; unknown coverage is data_available
        false and is not cached. No Paceday-held data of any account is read.
        The analytics cache (4 h, keyed by caller, address and week) serves a row only on
        the branch that computed it: (1) only a row stored with Paceday figures, (3) only
        a row stored as an estimate, (2) never. The branch, consent included, is decided
        before the cache is consulted. So a person who leaves the caller's last shared
        team gets the estimate on the next read; a cached estimate is not served once the
        person becomes visible; figures cached before PAC-130 for a caller who now sees
        the address as not visible are never served.
        For an address that is not visible, the server does the same work whether or not
        an account holds it: one visibility statement of the same shape, then branch (3)
        (spec AC-8).
        A failed visibility read, holder lookup, ownership check or consent read is the
        500 `{"error":"internal error"}`; it is never an entry shown as not visible and
        never an estimate, and nothing is cached (spec D-9, SF-010's rule carried
        forward).
        Before PAC-130, `is_paceday_user` was `member_user_id` set, a link stored by an
        address lookup on add and detection, so this answer revealed whether any address
        had a Paceday account (spec O-4).
      parameters:
        - $ref: "#/components/parameters/RequiredTeamIdQuery"
        - $ref: "#/components/parameters/IncludeAddedQuery"
        - name: week
          in: query
          required: false
          description: >
            Monday of the target week, YYYY-MM-DD, parsed as UTC midnight. Defaults to the
            current ISO week's Monday in UTC. Not validated to actually be a Monday.
          schema: { type: string, format: date }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Manager roster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerRoster" }
        "400":
          description: >
            JSON error. "team_id is required", "team_id must be a valid UUID", or
            "week must be YYYY-MM-DD".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/team/members:
    post:
      operationId: addManagerTeamMember
      tags: [manager]
      summary: Add or upsert a roster member, optionally scoped to a team.
      description: >
        `team_id` is OPTIONAL here. Without it the member is written to the global
        manager_team_members table only. With it the write is transactional across
        manager_team_members plus manager_team_member_assignments, and the caller must
        be the team OWNER. Adding a member never creates a team_invites row (asserted by
        TestManagerTeam_AddMemberCreatesOnlySelectedTeamAssignment).

        PAC-129 (spec §3.9, D-13, AC-31): this explicit manager action creates a roster
        entry even when the address is also a person added to the team without Paceday
        access; that person stays an added person of the team (team membership and the
        manager's roster are separate). It never adds anyone to the team. Since PAC-130
        the entry follows the PAC-130 rule of getManagerRoster: no `is_paceday_user`
        unless the address is visible to the caller, and no stored link.

        PAC-130 (spec §3.2, D-2, D-4, D-11, AC-1, AC-2, AC-3, AC-16): the add performs NO
        account lookup. Whether, how many and at what standing accounts carry `email`
        changes nothing in the answer, the status, the stored row or the work done: the
        201 for an address held by an account and for one held by nobody are equal byte
        for byte once the address, `id`, `created_at` and `updated_at` are replaced. The
        row is stored with `member_user_id` null; an existing row's link kept by migration
        042 is left as it is and is never returned. With and without `team_id` alike; the
        form without `team_id` is the caller's own global roster (API-088, accepted).
        Before PAC-130 (PAC-71 rule) the add stored and returned the id of the address's
        one DOMAIN-CONFIRMED holder, which revealed whether any address had a Paceday
        account, and its id (spec O-1, O-2); a failed lookup was the 500 (PAC-122 SF-010),
        a step that no longer exists.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddManagerMemberRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "201":
          description: >
            The member row as stored, read back after the upsert commits (PAC-26,
            API-031), as storage.ManagerTeamMember with explicit snake_case json tags
            (API-030). Without `team_id` it is the global manager_team_members row; with
            `team_id` it is that row seen through this team's assignment (display name
            override, assignment cadence and cadence_custom_days), exactly as
            patchManagerTeamMember returns it. `id`, `created_at` and `updated_at` are
            the stored values. Before PAC-26 the body was the pre-insert struct in
            PascalCase with the zero UUID and "0001-01-01T00:00:00Z" timestamps. If the
            read-back fails the response is the 500 below, although the upsert has
            committed; the upsert is idempotent, so a retry is safe. `member_user_id` is
            always null since PAC-130 (deprecated; see the schema).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerTeamMemberGoStruct" }
        "400":
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: >
            JSON error. "email is required"; "email must be a valid email address";
            "cadence must be weekly, biweekly, monthly, custom, or none";
            "custom_cadence_days must be between 1 and 365";
            "custom_cadence_days is only valid with custom cadence".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/team/members/{email}:
    parameters:
      - $ref: "#/components/parameters/MemberEmailPath"
    delete:
      operationId: removeManagerTeamMember
      tags: [manager]
      summary: Remove a member globally, or unassign them from one team.
      description: >
        Without `team_id`: deletes the global manager_team_members row outright.
        With `team_id` (owner required): removes the formal team_members row if the email
        maps to a Paceday user, deletes the manager assignment for this team only, deletes
        pending team_invites for this email on this team, and LEAVES the global
        manager_team_members identity row and its 1:1 history intact. PAC-122 (SF-001):
        every storage error on this path is the 500 {"error":"internal error"}; with
        `team_id` the membership, assignment and pending-invite deletes run in one
        transaction, so a failed delete removes nothing.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): with `team_id`, the formal team membership is removed for EVERY
        account that carries the address in any letter case and at any standing (a
        revoking site): two accounts that differ only in letter case are both removed,
        and an unconfirmed carrier is removed too, never a silent no-op. If one of them is
        the team owner the answer is the 422 and nothing is removed. If no account carries
        the address, the assignment and pending invites are still removed and the answer
        is still 204 (spec §6). The global path (no `team_id`) is unchanged.

        PAC-129 (spec §3.8, D-5, D-8, AC-16b, AC-30, AC-37; contract PAC-129 §4): with
        `team_id` the whole decision moves inside ONE storage-owned transaction, in this order: the
        PAC-71 re-check (a stale session is the 401 and nothing is written); the team row
        locked FOR NO KEY UPDATE (the PAC-25 lock; no row is the 403); the owner check
        (not an owner is the 403); the carrier lookup and the membership reads (an owner
        among the carriers is the 422, nothing removed); then, in addition to today's
        deletes, the team's ADDED entry for the address and EVERY team_invites row of the
        team for the address, whatever its status (before PAC-129 only `pending` rows).
        Acceptance and the team removal take the same lock first, so an acceptance that
        committed before this removal is removed by it, and one that waits for it finds no
        invitation (404). The manager's global roster row and its 1:1 history are kept;
        only this team's assignment goes, as before. Cached manager figures
        (team_analytics_cache) are the manager's data and are kept. The answer is still 204
        whatever was found. A storage error in the owner check inside the transaction is
        the 500 (PAC-122 SF-074; before it, the 403, spec OQ-12).
        Without `team_id` (the global delete) nothing about team membership changes: a
        person added to a team stays on it.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/SessionGenerationUnavailable'
        "204":
          description: Deleted (or nothing to delete). Empty body.
        "400":
          description: JSON error — "team_id must be a valid UUID".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: JSON error — "the team owner cannot be removed".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: patchManagerTeamMember
      tags: [manager]
      summary: Update display name and/or cadence for a roster member.
      description: >
        Omitted fields keep their current value. Supplying `cadence` as anything other
        than "custom" clears cadence_custom_days; omitting `cadence` preserves it
        (TestManagerPatchMember_PreservesOmittedCustomDays). A blank display_name falls
        back to the local part of the email. With `team_id`, only team-scoped preferences
        change (display_name_override, cadence, cadence_custom_days on the assignment row);
        the canonical global display name is never overwritten. Also, with `team_id`, a
        formal team member with no assignment yet is materialised into an assignment on
        first patch.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): that materialisation is a granting site: a formal member is matched
        to `{email}` only when that member's account holds `{email}` DOMAIN-CONFIRMED
        (case-insensitive); a formal member whose address is unconfirmed is not matched,
        and the answer is the one for an address with no roster entry.

        PAC-130 (spec §3.5, D-4, D-6, AC-5, AC-18): the materialised roster row is written
        with `member_user_id` null (before PAC-130 it stored the formal member's account),
        behind the same DOMAIN-CONFIRMED entry check. No patch writes, refreshes or erases
        a link; a link kept by migration 042 is left as it is. The 200 never carries a
        link, and for an address that is not visible to the caller it is the same whether
        or not an account holds the address (spec O-3).

        PAC-129 (spec §3.9, D-13, AC-31): with `team_id`, an address that has no
        assignment of the caller on this team, is not matched to a formal member, and is
        a person ADDED to this team is refused with the 422
        "this person was added to the team without Paceday access; add them with Add person to track 1:1s".
        Nothing is written: no roster row and no assignment. The check runs after the
        body is validated. Without `team_id` nothing changes.

        PAC-150 (silent-failures SF-114): a storage error in any read of that match (the
        roster entry, the team's formal members, the DOMAIN-CONFIRMED holder lookup, the
        added-person read) is the 500 {"error":"internal error"}, logged and reported
        without the address, and nothing is written. Before PAC-150 a failed holder
        lookup was read as "not matched", so the answer was the 404.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchManagerMemberRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: >
            The re-read storage.ManagerTeamMember, with explicit snake_case json tags
            since PAC-26 (API-030). Never `null`: since PAC-26 (API-032) a failed
            re-read is the 500 below instead of a 200 whose body is the JSON literal
            `null`. The patch has committed when that 500 is sent. `member_user_id` is
            always null since PAC-130 (deprecated; see the schema).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerTeamMemberGoStruct"
        "400":
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "404":
          description: >-
            text/plain "not found" — no such member in scope: no roster entry of the
            caller for `{email}` (in this team, with `team_id`), and, with `team_id`, no
            formal member matched (PAC-71) and no person added to the team. Only a
            genuine no-match: a failed read while matching is the 500 (PAC-150).
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: >
            JSON error — cadence validation, same messages as addManagerTeamMember; or,
            with `team_id` (PAC-129), exactly
            "this person was added to the team without Paceday access; add them with Add person to track 1:1s"
            for a person added to the team who has no roster entry on it. Nothing is
            written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/team/members/{email}/schedule:
    parameters:
      - $ref: "#/components/parameters/MemberEmailPath"
    post:
      operationId: scheduleManagerOneOnOne
      tags: [manager]
      summary: Build a server-side /app prefill URL for a 1:1 with this member.
      description: >
        Creates nothing on any calendar. Returns a relative URL of the form
        `/app?attendees=<email>&duration=30&title=1%3A1+with+<display_name>` plus
        `&date=<suggested_date>` when supplied (query params are Go url.Values-encoded, so
        alphabetically ordered). An empty body is accepted (io.EOF is tolerated).

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): the roster entry this operation may materialise for a formal team
        member follows the same DOMAIN-CONFIRMED rule as patchManagerTeamMember, and since
        PAC-130 it is written with `member_user_id` null (spec D-6, AC-18).

        PAC-129 (spec §3.9, D-13, AC-31): the same refusal as patchManagerTeamMember for a
        person added to the team who has no roster entry on it: the 422 below, no roster
        row, no assignment, no prefill URL.

        PAC-150 (silent-failures SF-114): the same match as patchManagerTeamMember, so a
        storage error in any of its reads is the 500 {"error":"internal error"}, never
        the 404, and nothing is written.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleOneOnOneRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Prefill URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrefillUrlResponse" }
        "400":
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "404":
          description: >-
            text/plain "not found" — no such member in scope, as for
            patchManagerTeamMember. Only a genuine no-match: a failed read while
            matching is the 500 (PAC-150).
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: >
            JSON error — "suggested_date must be YYYY-MM-DD"; or, with `team_id` (PAC-129),
            exactly
            "this person was added to the team without Paceday access; add them with Add person to track 1:1s".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/gaps:
    get:
      operationId: getManagerCadenceGaps
      tags: [manager]
      summary: Members whose 1:1 cadence is overdue or due within 7 days.
      description: >
        Gaps are computed over the roster in scope: the manager's global roster, or, when
        `team_id` is supplied, the team-scoped roster with that team's cadences. Members
        with cadence="none" never appear. A member never met is due now. A member with
        a recorded 1:1 occurrence in the next 14 days is suppressed. Sorted by
        days_overdue descending. `gaps` is always an array, never null.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Cadence gaps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CadenceGapList" }
        "400":
          description: JSON error — "team_id must be a valid UUID".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          description: >-
            Gap detection or a database read failed. `error` is "internal error" or "db
            error". The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/manager/analytics:
    get:
      operationId: getManagerAnalytics
      tags: [manager]
      summary: Twelve weeks of per-member focus/meeting/free minutes.
      description: >
        Returns exactly 12 week buckets per member (months=3 is hard-coded and numWeeks =
        months*4), ordered NEWEST FIRST: weeks[0].week_start == the resolved `week`, each
        subsequent entry is 7 days earlier. A member with no data still gets 12 buckets of
        zeroes with data_available=false. `members` is always an array, never null.
        Members are the caller's global roster without `team_id`, or the team-scoped roster
        with it (formal members included, as getManagerRoster).
        Visibility and figures (PAC-130, spec §3.1-§3.4, D-1, D-3, D-5, D-7, D-10;
        replacing the PAC-60 paragraph that stood here): each member and each of its 12
        weeks follows exactly the rule and the three branches stated on getManagerRoster.
        `is_paceday_user` is the visibility rule of ManagerRosterMember.is_paceday_user;
        Paceday figures need visibility, a known account (the team member for "formal",
        the one DOMAIN-CONFIRMED holder for "manual" and "auto"), ownership of a team that
        account is a Paceday member of (PAC-60, unchanged), and consent; a visible member
        without all of them is "no data" with nothing read; a member who is not visible is
        estimated from free/busy through the caller's own credential, exactly like an
        address no account holds, whatever account holds it. The decision is the same
        with and without `team_id` (API-088, accepted). Before PAC-130 a Paceday user
        outside the caller's owned teams was all zeroes with data_available=false while an
        address with no account at a readable domain was measured, so the answer revealed
        account existence (spec O-5).
        PAC-34 (API-022): each member also carries is_paceday_user (the same value
        ManagerRosterMember.is_paceday_user carries for this caller and address) and a
        member-level data_available that is true iff at least one of its 12 buckets has
        data_available=true. A client must render a bucket with data_available=false, and a
        member with data_available=false, as "no data", never as zero minutes. Neither
        field widens visibility: is_paceday_user shows only what the team member list and
        the organisation member list already show the caller, and data_available is derived
        only from the buckets this response already returns.

        PAC-122 SF-040: a failed read of any member's week (the PAC-60 ownership check, the
        cached figures, the consent or analytics read, the FreeBusy query, or the cache
        write) is the 500, never a bucket of zeroes with data_available=false. Since
        PAC-130 (spec D-9, AC-13) a failed visibility read or holder lookup is the 500 too,
        never a member shown as not visible and never an estimate, and nothing is cached.
        A member whose FreeBusy coverage is unknown (a provider failure, PAC-67 D-6) is
        data_available=false for this answer and is not cached, so a later request asks
        again.

        PAC-129 (spec §3.6, §3.9, AC-31): with `team_id` and `include_added=true`, the
        members gain every person added to the team who has no assignment of the caller on
        it and is not a formal member, with is_paceday_user false, data_available false
        and 12 zero buckets. No calendar is read for such a member and no figure is stored
        (team_analytics_cache is never written for them). Owners see an added person's
        availability figures through getFormalTeamAnalytics instead. Without the flag the
        answer is exactly today's. A roster entry the manager created explicitly (add, or
        detection confirm) is measured by the PAC-130 rule above, like any other roster
        entry.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
        - $ref: "#/components/parameters/IncludeAddedQuery"
        - name: week
          in: query
          required: false
          description: Monday of the newest week, YYYY-MM-DD. Defaults to the current UTC ISO week's Monday.
          schema: { type: string, format: date }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Per-member weekly analytics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerAnalytics" }
        "400":
          description: JSON error — "team_id must be a valid UUID" or "week must be YYYY-MM-DD".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams:
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a formal team; the caller becomes its owner.
      description: >
        Registered via chi `r.Route("/api/teams")` + `r.Post("/")`, so both `/api/teams`
        and `/api/teams/` route here. The team row and the caller's owner team_members row
        are written in one transaction (PAC-122 SF-008): a failed owner insert is the 500
        and leaves no team. Before PAC-122 the owner row was inserted after the team with its
        error discarded, so a failed insert still returned 201 with an ownerless team.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamNameRequest" }
      responses:
        "201":
          description: Created team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          description: >
            JSON error "name is required" — covers both a malformed body and a blank/
            whitespace-only name (one branch, one message). Or "name must not
            contain line breaks" when the name holds CR, LF or NUL: the team's
            name is interpolated into the Subject header of every invitation
            the team sends, where a line break would end the header and let the
            rest of the name write headers and a body of its own (2026-11-22
            security audit, finding 1). Checked after the blank check, so a
            blank name keeps its message; nothing is written either way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/JsonUnauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      operationId: listTeams
      tags: [teams]
      summary: All teams the caller belongs to, newest first.
      description: >
        Bare JSON array (no envelope), ordered by teams.created_at DESC. Always an array,
        never null.
      responses:
        "200":
          description: Teams.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401":
          $ref: "#/components/responses/JsonUnauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/invites/{token}:
    get:
      operationId: getTeamInvite
      tags: [teams]
      summary: Preview a pending team invite by token.
      description: >
        Registered inside the requireAuth group and therefore requires a valid JWT. The
        handler comment says "(public)", which is wrong (API-089); PAC-34 corrects the
        comment, not the routing. Calls ExpireOldInvites first, so an invite past
        expires_at is reported as 410 "invite is expired" rather than 200.
        PAC-34 (API-021): the 200 also carries team_id, expires_at and inviter_email, so the
        invite page can show who invited the caller and when the link expires. The audience
        is unchanged: any authenticated caller holding the token, as before (the invitee
        email is checked on accept, not on preview). The token is still not echoed; the
        caller already has it in the path.
      parameters:
        - $ref: "#/components/parameters/InviteTokenPath"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Invite preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamInvitePreview" }
        "404":
          description: JSON error "invite not found".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: >
            JSON error "invite is <status>" where status is accepted, declined or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/invites/{token}/accept:
    post:
      operationId: acceptTeamInvite
      tags: [teams]
      summary: Accept a pending invite as the logged-in user.
      description: >
        The authenticated user's email must case-insensitively equal invitee_email.
        Membership is added with role "member" via an ON CONFLICT DO NOTHING insert, so
        accepting twice cannot demote an existing owner. Returns no body.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): the invite is accepted only when the caller's ACCOUNT holds
        invitee_email DOMAIN-CONFIRMED: its stored address equals invitee_email
        case-insensitively AND its addressStanding (getCurrentUser) is domain_confirmed.
        An account that carries the address unconfirmed (bound with mailbox evidence, or
        created before PAC-71 and not bound yet) gets exactly today's mismatch answer,
        the 403 "this invite is for a different email address", and nothing changes.
        The session's email claim is not consulted.

        PAC-129 (spec §3.7, §3.8, §3.10, D-4, D-8, AC-19, AC-19b, AC-22, AC-25, AC-30;
        contract PAC-129 §3.4, §4): after the checks above, the write is ONE storage-owned
        transaction:
        the PAC-71 re-check (a stale session is the 401, nothing written); the invitation's
        team row locked FOR NO KEY UPDATE (the PAC-25 lock); the invitation read again
        under the lock. No row (the person was removed meanwhile, or the team deleted) is
        the 404 "invite not found"; a status that is no longer pending, or an expiry not
        after the database's now(), is the 410 "invite is <status>". Then exactly one of:
        (a) the caller is already a member: the invitation is marked accepted, 204;
        (b) the address is a person ADDED to the team: that entry is deleted and the
        caller's membership (role "member") inserted, and the invitation marked accepted,
        all in this transaction; it never changes the member count, so it is allowed at or
        over the cap, 204;
        (c) a legacy invitation with no added entry: when the team holds 50 or more
        members of both kinds, the 422 "this team is full; ask its owner to remove someone before you accept"
        and nothing changes; otherwise the membership is inserted and the invitation
        marked accepted, 204.
        A failure at any step rolls the whole transaction back: the person stays added and
        the invitation pending (AC-19). Before PAC-129 the membership insert and the status
        update were two separate writes with no lock and no cap.
      parameters:
        - $ref: "#/components/parameters/InviteTokenPath"
      responses:
        "204":
          description: Invite accepted; membership created or upgraded from an added entry. Empty body.
        "401":
          $ref: "#/components/responses/JsonUnauthorized"
        "403":
          description: JSON error "this invite is for a different email address".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: >
            JSON error "invite not found". Also (PAC-129) when the invitation was deleted
            by a removal of the person, or by the team's deletion, before this
            acceptance took the team lock: nothing is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: JSON error "invite is <status>".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: >
            PAC-129 (spec §3.10, AC-19b): a legacy invitation (no added entry for the
            address) on a team that already holds 50 or more members, owner included, both
            kinds counted. Decided under the team lock. Nothing changes; the invitation
            stays pending. Never given for an upgrade of an added person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamFullError" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}:
    parameters:
      - $ref: "#/components/parameters/TeamIdPath"
    get:
      operationId: getTeam
      tags: [teams]
      summary: One team plus its members.
      description: >
        Membership required (a Paceday membership: a person added without Paceday access
        is not a member and gets the 403, even when signed in to an account holding the
        address, PAC-129 AC-9).

        `members` is ListTeamMembers ordered by joined_at ASC: the PAC-29-era shape, and,
        since PAC-129, the PACEDAY members only, exactly as a client built before PAC-129
        saw it (spec §3.2, AC-8). It is `[]` only when the team has no member rows.

        `people` (PAC-129, spec §3.2, AC-1, AC-2): every member of both kinds, in this
        order: the Paceday members in `members` order, then the added people by the time
        they were added. Every member sees it, as today's `members`, except that
        `invitation` is null for a caller who is not an owner (contract 1.1, m-6). An added person's
        entry never carries an account identifier, whether or not an account holds the
        address (spec D-3).

        PAC-129 (SF-039, AC-6): a failed member read (either kind) is the 500, never a
        team with an empty list.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Team detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamDetail" }
        "400":
          description: JSON error "invalid team id".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "404":
          description: >
            JSON error "not found". Reachable only in a race: the membership read
            (requireMember) and the team read (storage.GetTeam) are two separate statements
            with no transaction (backend/api/handlers_teams.go getTeam), and a team_members
            row cannot outlive its team (team_members.team_id REFERENCES teams ON DELETE
            CASCADE, migration 013_teams.up.sql). So the 404 is answered exactly when the team
            is deleted (deleteTeam, or the cascade from its creator's account) after the
            membership read succeeded and before the team read; a team that is already gone
            when the request arrives is the 403. Resolved by PAC-71 at stage 2 (this
            operation is touched for its 401); the plan owes a seam test that deletes the
            team between the two reads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: renameTeam
      tags: [teams]
      summary: Rename a team. Owner only.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: >
            The re-read team. Never `null`: since PAC-26 (API-032) a failed re-read is
            the 500 `internal error` below instead of a 200 whose body is the JSON
            literal `null`. The rename has committed when that 500 is sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: >
            JSON error "invalid team id", "name is required", or "name must not
            contain line breaks" when the name holds CR, LF or NUL (the same
            rule and reason as on createTeam; nothing is renamed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamNameRequest" }
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team. Owner only.
      description: >
        Cascades to team_members, team_invites, no_meeting_zones and
        manager_team_member_assignments via FK ON DELETE CASCADE.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "204":
          description: Deleted. Empty body.
        "400":
          description: JSON error "invalid team id".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/members/invite:
    post:
      operationId: inviteTeamMember
      tags: [teams]
      summary: Invite an address to Paceday on this team; an address not on the team is also added. Owner only.
      description: >
        PAC-129 (spec §3.7, §3.10, D-4, D-8, D-12, AC-18, AC-20, AC-23, AC-25; contract
        PAC-129 §3.0, §3.3, §4). The address is normalised by the one address normaliser
        of AddTeamPersonRequest.email (trim set of contract §2.2, which since revision
        1.2 includes U+FEFF; lowercase; ParseAddress), and every check below compares
        that form. The write is ONE storage-owned transaction: the PAC-71 re-check (stale session: 401,
        nothing written); the team row locked FOR NO KEY UPDATE (no row: 403); the owner
        check (not an owner: 403; a storage error there is the 500 since PAC-122 SF-074,
        which closed spec OQ-12 for this operation). Then, judged under the lock, with
        "pending" meaning stored status `pending` AND expires_at after the database's
        now() (spec D-12):

        1. the address is held by a Paceday member of the team (compared on the
        account's single address, lowercased): 200, outcome `already_member`, no
        invitation, no email;

        2. the address is not on the team (neither kind) and the team holds 50 or more
        members of both kinds, owner included: the 422 TeamMemberLimitError, nothing
        written;

        3. the address is not on the team: it is ADDED (an added person, named by `name`,
        trimmed, or "" when absent, `added_by` the caller). If it already is an added
        person whose adder is no longer an owner of the team (or whose account is gone),
        `added_by` becomes the caller, exactly as in addTeamPerson (contract 1.1, m-9);
        nothing else of the entry changes;

        4. a pending invitation for the address exists on the team: 200, outcome
        `already_pending`, carrying that invitation (its token included); no second
        invitation, no second email (SF-012, API-090);

        5. otherwise every stored-`pending` row for the address on the team whose expiry
        has passed (a lapsed invitation) is set to `expired`, and a new invitation is
        created (7 days) and committed; its email is then sent as before (a tracked unit;
        without SMTP the skip is logged with the invite id, PAC-122 SF-066): 201, outcome
        `added_and_invited` when step 3 added the person, else `invited`.

        At most one invitation per team and address is ever stored `pending`
        (migration 041's partial unique index). Before PAC-129 every call inserted a new
        invitation and sent a new email, the name was not accepted, and the address was
        never put on the team.
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteEmailRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "201":
          description: >
            A new invitation was created (outcome `added_and_invited`: the address was not on
            the team and is now an added person; or `invited`: it already was an added
            person); its raw `token` is included so the owner can share the link
            out of band. expires_at is now + 7 days. `person` is the address's entry on the
            team after this call (an added person, with this invitation). Email delivery is
            fire-and-forget and skipped when SMTP_HOST/SMTP_FROM are unset; the skip is
            logged with the invite id, and the server warns at startup that email is off
            (PAC-122 SF-066). The answer is the same either way and never claims delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamInviteResult" }
        "200":
          description: >
            Success-shaped, nothing sent, no invitation created. Outcome `already_pending`: `invitation` is the
            existing pending invitation (token included) and `person` the entry (added now
            by step 3 if the address was not on the team). Outcome `already_member`:
            `invitation` is null and `person` is the Paceday member's entry; nothing
            written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamInviteResult" }
        "400":
          description: JSON error "invalid team id" or "email is required".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: >
            "email must be a valid email address" (ErrorResponse, before any write), or
            the cap refusal of step 2 (TeamMemberLimitError, under the team lock, nothing
            written).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TeamMemberLimitError"
                  - $ref: "#/components/schemas/InvalidEmailError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/people:
    post:
      operationId: addTeamPerson
      tags: [teams]
      summary: Add a person to the team by email, without an invitation or Paceday access. Owner only.
      description: >
        PAC-129 (spec §3.1, §3.3, §3.10, D-1, D-3, D-8, D-9, AC-1, AC-2, AC-4, AC-5, AC-7,
        AC-23, AC-23b, AC-24, AC-25; contract PAC-129 §3.1, §4). New. The person is on the
        team at once as an ADDED person. Nothing is sent to them, nothing is asked of
        them, and the address is never resolved to an account: the answer and the member
        list are identical whether or not an account holds the address. Their free/busy is
        read through the calendar credential of the owner who added them, for any member's
        Find a time (spec §3.4).

        Order: 401 (requireAuth); 400 "invalid team id"; 400 "invalid body" (the body does
        not decode, or `email` is not a JSON string); 400 "email is required" (blank after
        trimming); 422 "email must be a valid email address" (refused by the normaliser
        described on AddTeamPersonRequest.email); then ONE storage-owned transaction: the PAC-71 re-check (stale session:
        401, nothing written); the team row locked FOR NO KEY UPDATE (no row: 403); the
        owner check (not a member or not an owner: 403; a storage error: the 500, SF-074
        fixed for this new operation, spec OQ-12); the caller's own address: 422
        `you cannot add your own address`; the address of a Paceday member of the team:
        422 `this address belongs to a Paceday member of this team`; an existing added
        entry for the address: 200 with that entry, unchanged (the stored name is kept)
        except that when the owner who added it is no longer an owner of the team (or
        their account is gone) the caller becomes the owner whose credential reads it
        (spec OQ-1); 50 or more members of both kinds, owner included: 422
        `this team has reached its limit of 50 members; remove someone before adding another`;
        otherwise the entry is stored (address lowercased, name trimmed) and the answer is
        201. Teams already over 50 at deploy keep their members and get the 422 until
        they are below 50.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddTeamPersonRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "201":
          description: The added person's entry, as the member list shows it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamPerson" }
        "200":
          description: >
            The address already was an added person of the team: that entry, unchanged
            (spec §3.1 "Repeats"). No second entry is ever created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamPerson" }
        "400":
          description: JSON error "invalid team id", "invalid body" or "email is required".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: >
            A refusal with its reason; nothing is stored. Exactly one of the four values
            of AddTeamPersonError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddTeamPersonError" }
        "500":
          $ref: "#/components/responses/ServerError"
    parameters:
      - $ref: "#/components/parameters/TeamIdPath"

  /api/teams/{id}/people/{email}:
    parameters:
      - $ref: "#/components/parameters/TeamIdPath"
      - $ref: "#/components/parameters/TeamPersonEmailPath"
    delete:
      operationId: removeTeamPerson
      tags: [teams]
      summary: Remove a person of either kind from the team, named by address. Owner, or a Paceday member removing themselves.
      description: >
        PAC-129 (spec §3.8, D-5, D-8, AC-15, AC-25, AC-30, AC-37; contract PAC-129 §3.2,
        §4). New. The person is named by address within the team. Order: 401; 400
        "invalid team id"; 400 "invalid email" (the path does not normalise to a valid
        address); then ONE storage-owned transaction: the PAC-71 re-check (stale session:
        401, nothing written); the team row locked FOR NO KEY UPDATE (no row: 403); the caller's
        membership (not a member: 403; a storage error: the 500); unless the address is
        the caller's own, the caller must be an owner (403); then, read under the lock:
        the Paceday members whose account address is the address, the added entry for it,
        and every invitation of the team for it, whatever its status. None of these: 404
        `person not found`, nothing written. A Paceday member there who is an owner, with
        no other owner remaining: 422 "the team owner cannot be removed" (PAC-25 rule),
        nothing written. Otherwise all of them are deleted: memberships, the added entry,
        every invitation of the team for the address (pending, accepted, declined,
        expired), so no old link can bring the person back; 204. Nothing of the person is
        stored elsewhere on the team path (added people's figures are never stored).

        The acceptance takes the same lock first: removal first, the acceptance finds no
        invitation (404, nothing written); acceptance first, this removal deletes the
        membership the acceptance created. Either way the person ends absent with no
        invitation (AC-30). A manager's roster row and assignment for the address are
        that manager's data and are never touched here (AC-37). removeTeamMember (by user
        id) is unchanged and stays the PAC-25 path for Paceday members.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "204":
          description: Removed. Empty body. Something was deleted.
        "400":
          description: JSON error "invalid team id" or "invalid email".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "404":
          description: >
            Exactly `{"error":"person not found"}`: no member of either kind and no
            invitation for the address on this team. Nothing written. The web must not say
            "removed" for this answer (SF-089).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamPersonNotFoundError" }
        "422":
          description: JSON error "the team owner cannot be removed". Nothing written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a member by user id. Owner, or the member themselves; never the last owner.
      description: >
        An owner of the team may remove anyone; any caller may remove themselves. A
        removal that would leave the team with zero owners is refused with 422 and
        changes nothing (PAC-25, API-023). Check order, fixed so that a non-owner cannot
        learn who the owner is from the answer: 400 malformed ids; then, when the caller
        is not the target, 403 unless the caller is an owner; then 422 if the target is
        an owner and no other owner of the team would remain; then the removal, 204. The
        guard counts owners ("would leave zero owners", PAC-25 D-4), it does not refuse
        every owner: in a team with two owners either may leave, and the second to try
        is refused. No interleaving of concurrent removals may leave the team with zero
        owners (PAC-25 D-6). A sole owner who is also the only member is refused too;
        deleting the team (DELETE /api/teams/{id}) stays the way to be rid of it (PAC-25
        D-5). The manager-domain DELETE /api/manager/team/members/{email} keeps its own,
        role-based rule (it refuses removing any owner) with the same 422 wording (PAC-25
        D-3).

        PAC-129: unchanged. It names a Paceday member by user id and cannot name a person
        added without Paceday access, who has none; removeTeamPerson (by address) removes
        either kind and also deletes the team's invitations for the address.
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - name: userId
          in: path
          required: true
          description: The Paceday user id (UUID) of the member to remove.
          schema: { type: string, format: uuid }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "204":
          description: Removed (idempotent — removing a non-member also returns 204). Empty body.
        "400":
          description: JSON error "invalid team id" or "invalid user id".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: >
            JSON error "the team owner cannot be removed" (the manager-domain wording).
            The target is an owner of the team and removing them would leave the team
            with no owner. Evaluated after the 403 check, so a caller who is not an owner
            never receives it (naming someone else is 403; naming themselves, they are
            not an owner). Nothing is written: the membership and its role are unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: "the team owner cannot be removed" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/no-meeting-zones:
    parameters:
      - $ref: "#/components/parameters/TeamIdPath"
    post:
      operationId: createNoMeetingZone
      tags: [teams]
      summary: Create a recurring weekly no-meeting zone. Owner only.
      description: >
        The WIRE weekday convention is Monday=1 .. Sunday=7. Storage uses Go's
        Sunday=0 .. Saturday=6; the handler converts 7 -> 0 on write and 0 -> 7 on read
        (TestNoMeetingZone_ValidatesAndConvertsWeekdayAtBoundary asserts both halves).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoMeetingZoneRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "201":
          description: Created zone, dayOfWeek already converted back to the 1..7 wire convention.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoMeetingZone" }
        "400":
          description: JSON error "invalid team id" or "invalid JSON".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: >
            JSON error. "dayOfWeek must be between 1 and 7" (note: 0 is rejected, so an
            omitted dayOfWeek always fails); "startTime and endTime are required";
            "startTime must be HH:MM"; "endTime must be HH:MM";
            "startTime must be before endTime" (equal times are rejected).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      operationId: listNoMeetingZones
      tags: [teams]
      summary: All no-meeting zones for a team. Membership required.
      description: >
        Bare JSON array, always present (never null), ordered by the STORED day_of_week
        then start_time — which means Sunday sorts FIRST because it is stored as 0, even
        though it is emitted as dayOfWeek 7.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Zones.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NoMeetingZone" }
        "400":
          description: JSON error "invalid team id".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/no-meeting-zones/{zoneId}:
    parameters:
      - $ref: "#/components/parameters/TeamIdPath"
      - name: zoneId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateNoMeetingZone
      tags: [teams]
      summary: Replace a no-meeting zone. Owner only.
      description: >
        PATCH by name, PUT by behaviour: every field is taken from the body with no merge
        against the stored row, so an omitted dayOfWeek becomes 0 and fails validation with
        422. The update is scoped by BOTH zone id and team id, so a zone belonging to
        another team returns 404. Ownership is checked before the zoneId is even parsed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoMeetingZoneRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Updated zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoMeetingZone" }
        "400":
          description: JSON error "invalid team id", "invalid zone id" or "invalid JSON".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "404":
          description: JSON error "zone not found".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: JSON error — same validation messages as createNoMeetingZone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteNoMeetingZone
      tags: [teams]
      summary: Delete a no-meeting zone. Owner only.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "204":
          description: Deleted (idempotent — deleting an unknown zone also returns 204). Empty body.
        "400":
          description: JSON error "invalid team id" or "invalid zone id".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/availability:
    get:
      operationId: getTeamAvailability
      tags: [teams]
      summary: Slots on one day where no team member is busy, with free and unknown counts.
      description: >
        Membership required. The engine searches a fixed 09:00-18:00 UTC window on `date`,
        steps the cursor in 15-minute increments, treats no-meeting zones and busy calendar
        events as hard blocks, and scores each slot 0-100 by how few members' focus blocks
        it disrupts. A member whose calendar token is missing or whose calendar call fails
        contributes no busy intervals and is silently treated as fully free. `slots` is
        always an array, never null.
        Members (PAC-81, spec AC-A18): each member's calendar is read on at most 4
        concurrent reads per request, each limited to its own 15 s (shortened to the
        budget left minus a 10 s stop margin). "Fails" includes, new with PAC-81, a read
        that fails on its own time limit: a member whose calendar answers too slowly now
        looks free, where before the request waited for it. A member who was not read
        because the request budget ran out (a read not started at the stop margin, or
        cut short by the budget) is never treated as free; a read that hits a deadline
        shortened by the budget (budget left minus the margin was below 15 s) counts as
        cut short by the budget, not as failing on its own limit: the answer is the 503, never
        a 200 that silently omits that member. There is no partial shape.

        PAC-129 (spec §3.3-§3.5, D-2, D-11, AC-9, AC-10, AC-11, AC-13, AC-14, AC-29;
        contract PAC-129 §3.5, §6). Searched: the Paceday members (as above) and the
        people ADDED to the team. An added person's free/busy for the day is read ONLY
        through the calendar credential of the owner who added them, whichever member
        asks; never through the requester's credential, never through the added person's
        own account even when one holds the address, and none of that account's focus
        blocks, habits or settings are read. If that owner is no longer an owner of the
        team, has no calendar connected, or their credential is lost, the person is
        unknown. A refused renewal during any member's request is recorded as that
        OWNER's credential loss (PAC-67), never the requester's. Every member's request
        spends the owner's provider quota, and the provider's audit log attributes the
        read to the owner's account and Paceday's OAuth client; Paceday's activity log
        does not record it.

        Coverage is decided per address: a person whose calendar the provider reports as
        unreadable (PAC-133 AC-1/AC-5 for Google, AC-4/AC-6 for Microsoft), whose address is at a personal-mail domain, or whose batch
        failed on its own time limit is unknown; unknown is never free. A busy added person
        blocks a slot exactly as a busy Paceday member. Blocking follows PAC-133 D-11
        (contract 1.1, M-4): busy windows the provider REPORTED for an address block a
        slot even when that address is unknown; only an unknown person with no reported
        windows does not block. A Paceday member whose calendar could not be read is
        counted unknown and, as before, does not block. Each slot carries free_count,
        unknown_count and total_count; a person who is unknown is counted unknown even
        when their reported windows blocked other slots, and no offered slot overlaps
        any reported window.

        Focus blocks (PAC-141 SF-112): a Paceday member whose focus blocks cannot be read
        is counted unknown, never free, even when their calendar was read; busy windows
        already read from their calendar still block. Their focus time is then not in
        the slot's quality_score.

        Batching (spec §3.5, D-11): the added people are requested from the owner's
        provider in batches of at most 50 addresses (Google `freebusy.query`) or 20
        (Microsoft Graph `getSchedule`), at most 3 batches at a time, each on its own
        5 s time limit (shortened to the budget left minus the PAC-81 stop margin). A
        batch that fails or hits its own limit makes only its own addresses unknown. A
        batch the budget prevents from starting, or cuts short, is the 503 below, as for a
        member read. With the team cap of 50 the worst case is 3 Microsoft batches in one
        round.

        Caching (contract 1.1, M-3; PAC-133 §5 hands this decision to PAC-129): results go
        through the existing process-wide 15-minute free/busy cache (the one
        FreeBusyService of the engine built once in newTeamHandlers), keyed by the
        credential owner, the address and the range (PAC-133 owns the key). A batch that
        the request budget prevents from starting, or cuts short, writes NOTHING to the
        cache, so a retry asks the provider again instead of answering 200 with those
        people unknown. A batch that fails on its own 5 s limit, or that the provider
        refuses, is cached as unknown for 15 minutes: today's behaviour (PAC-67,
        TestPAC67_TemporaryFailureLookupIsStillCached, unchanged). A result computed while
        the owner's credential is recorded as lost is not cached (PAC-67 AC-20). Nothing
        else about an added person is stored.

        Inference (spec §3.4, accepted by the owner): a member learns, at 15-minute
        granularity inside 09:00-18:00 UTC on `date`, the union of the busy times of
        everyone counted and, for each offered slot, how many members are free and how
        many unknown. With one added person a missing slot can reveal that this person is
        busy then. No per-person busy interval and no per-person coverage is returned.
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - name: date
          in: query
          required: true
          description: Day to search, YYYY-MM-DD, interpreted in UTC. Missing or malformed yields 400.
          schema: { type: string, format: date }
        - name: duration
          in: query
          required: false
          description: Slot length in minutes. Defaults to 60. Must be 1..1440.
          schema: { type: integer, minimum: 1, maximum: 1440, default: 60 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Candidate slots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSlotList" }
        "400":
          description: >
            JSON error "invalid team id", "date must be YYYY-MM-DD", or
            "duration must be a positive integer (minutes)".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/RequestBudgetExpired"

  /api/teams/{id}/analytics:
    get:
      operationId: getFormalTeamAnalytics
      tags: [teams]
      summary: Aggregate meeting/focus minutes across a formal team for one week.
      description: >
        Membership required. Unlike GET /api/manager/analytics this reads the
        analytics_weeks table directly per Paceday member, with no consent check (not
        widened, not narrowed by PAC-129, spec §5).

        PAC-129 (spec §3.6, D-6, AC-9, AC-16, AC-17; SF-041, SF-053; contract PAC-129
        §3.6). `week_start` is the Monday of the week asked for. `people` lists every
        member of both kinds (the order of TeamDetail.people), each with `figures`:
        `measured` (figures present), `no_data` (no stored week, or the read failed, or an
        added person whose availability is unknown: never zero), or `withheld` (an ADDED
        person's row seen by a caller who is not an owner of the team: name, email and
        kind only). An added person's row is availability-only: meeting_minutes from the
        owner's free/busy over the week (Monday 00:00 to the next Monday 00:00 UTC), read,
        batched and cached exactly as getTeamAvailability reads it (its "Caching"
        paragraph: a budget-cut batch is never cached and is the 503); focus_minutes and focus_score
        are always null. Their figures are read only when the caller is an owner, and are
        never stored (beyond the 15-minute free/busy cache). Averages divide by the number
        of Paceday members whose figures are `measured` (by 1 when none), integer
        division; added people never count. A failed analytics_weeks read is `no_data`
        for that row, never zero.

        `member_breakdown` is kept for clients built before PAC-129: Paceday members only,
        today's shape, a member with no stored week still shown with zeroes (SF-041 is
        fixed in `people`, not here). New clients read `people`.
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - name: date
          in: query
          required: false
          description: >
            Any date in the target week, YYYY-MM-DD. Snapped to that week's Monday in the
            parsed value's location (UTC). Defaults to the current local week's Monday.
          schema: { type: string, format: date }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Team analytics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamAnalytics" }
        "400":
          description: JSON error "invalid team id" or "date must be YYYY-MM-DD".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/RequestBudgetExpired"

components:
  parameters:
    RequiredTeamIdQuery:
      name: team_id
      in: query
      required: true
      description: >
        Formal team UUID. Required on this route: a missing or whitespace-only value is
        400 "team_id is required".
      schema: { type: string, format: uuid }

    OptionalTeamIdQuery:
      name: team_id
      in: query
      required: false
      description: >
        Formal team UUID. Optional on this route. When ABSENT the handler operates on the
        manager's global (un-scoped) roster and performs NO authorization check beyond
        JWT. When present it must parse as a UUID and the caller must be a member (reads)
        or the owner (writes) of that team.
      schema: { type: string, format: uuid }

    TeamIdPath:
      name: id
      in: path
      required: true
      description: Formal team UUID.
      schema: { type: string, format: uuid }

    InviteTokenPath:
      name: token
      in: path
      required: true
      description: >
        Opaque invite token — a UUID string generated by CreateTeamInvite. Not validated
        as a UUID by the handler; any string is looked up verbatim.
      schema: { type: string }

    IncludeAddedQuery:
      name: include_added
      in: query
      required: false
      description: >
        PAC-129. `true` adds the team's people added without Paceday access who have no
        roster entry (source "added"); absent or `false` gives exactly the answer of a
        client built before PAC-129. Only meaningful with `team_id`; ignored without it.
        Any value other than `true` or `false` is treated as `false`.
      schema: { type: boolean, default: false }

    TeamPersonEmailPath:
      name: email
      in: path
      required: true
      description: >
        PAC-129. The person's address, percent-encoded (`@` as %40). Unescaped, then
        normalised by the one address normaliser of AddTeamPersonRequest.email before
        matching; blank, or refused by it, is the 400 "invalid email".
      schema: { type: string, format: email }

    MemberEmailPath:
      name: email
      in: path
      required: true
      description: >
        The roster member's email address, percent-encoded in the path (the `@` MUST be
        sent as %40 — chi splits on `/` only, but the frontend and the Go tests both use
        encodeURIComponent/%40 form). The handler applies url.PathUnescape to the raw chi
        param and falls back to the raw value if unescaping fails. Storage lowercases and
        trims before matching, so lookup is case-insensitive even though this path segment
        is not normalized by the handler itself.
      schema: { type: string, format: email }
      examples:
        encoded:
          value: "member%40example.com"

  responses:
    JsonError:
      description: JSON error envelope from writeError.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    JsonForbidden:
      description: >
        JSON error "forbidden". Emitted when the caller is not a member of `team_id`, when
        the route requires ownership and the caller's role is not "owner", AND when the
        team simply does not exist (no membership row either way). A failed membership
        read is never this 403: on the manager routes' `team_id` scope and on any owner
        check (PAC-122 SF-074), and on the formal-team member checks (team detail, zone
        list, availability, analytics; PAC-122 SF-107), it is the 500.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    JsonUnauthorized:
      description: >
        JSON error "unauthorized" from the handler's own uuid.Nil check. In production
        this is shadowed by the requireAuth middleware, which emits its own
        `{"error":"unauthorized"}` via http.Error with a Content-Type of application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    ServerError:
      description: >
        A server-side failure. JSON error envelope (application/json) with a fixed,
        server-chosen message: "internal error" on the /api/teams routes, "internal error"
        or "db error" on the /api/manager routes. Never the storage or engine error text,
        which is written to the server log and Sentry only (PAC-21). Replaces
        PlainTextServerError, the text/plain response these routes documented before
        PAC-21 was finished.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      description: The shared error envelope produced by writeError.
      properties:
        error: { type: string }
      required: [error]
      additionalProperties: false

    Cadence:
      type: string
      description: 1:1 cadence. "none" disables gap detection for that member.
      enum: [weekly, biweekly, monthly, custom, none]

    ManagerMemberSource:
      type: string
      description: >
        "auto" = created by calendar detection, "manual" = created by an explicit add,
        "formal" = SYNTHETIC, returned only by getManagerRoster for a formal team_members
        row that has no manager assignment yet. "formal" is never persisted (the
        manager_team_members CHECK constraint permits only auto/manual).
        "added" (PAC-129) = SYNTHETIC and READ-ONLY, returned only by getManagerRoster
        with include_added=true, for a person added to the team without Paceday access
        who has no assignment and is not a formal member. Never persisted, never
        returned without include_added.
      enum: [auto, manual, formal, added]

    ManagerProfileSummary:
      type: object
      properties:
        is_manager: { type: boolean }
        detected_at:
          type: [string, "null"]
          format: date-time
          description: RFC3339 UTC timestamp of the last successful detection, or null.
        team_member_count:
          type: integer
          description: >
            COUNT(*) over manager_team_members for this manager — the GLOBAL roster size,
            not the size of any one team. A failed count is the 500 (PAC-122 SF-076);
            before PAC-122 it was reported as 0.
      required: [is_manager, detected_at, team_member_count]
      additionalProperties: false

    ManagerProfileUpdate:
      type: object
      properties:
        is_manager: { type: boolean }
      required: [is_manager]
      additionalProperties: true
      description: >
        Unknown fields are ignored (the decoder does not call DisallowUnknownFields here).
        A missing is_manager decodes to false and will clear the flag.

    UserProfileGoStruct:
      type: object
      description: >
        storage.UserProfile with explicit snake_case json tags (PAC-26, API-030); the keys
        match the user_profiles columns. The schema name is kept from before PAC-26, when
        the struct had no tags and the keys were the Go field names (`UserID`,
        `IsManager`, `DetectedAt`, `AnalyticsSharedWithManager`, `UpdatedAt`).
      properties:
        user_id: { type: string, format: uuid }
        is_manager: { type: boolean }
        detected_at:
          type: [string, "null"]
          format: date-time
        analytics_shared_with_manager:
          type: boolean
          description: Member-side consent flag, defaulting to true. No endpoint in this domain sets it.
        updated_at:
          type: string
          format: date-time
          description: The value read BEFORE the upsert, not the newly written now().
      required: [user_id, is_manager, detected_at, analytics_shared_with_manager, updated_at]
      additionalProperties: false

    ManagerTeamMemberGoStruct:
      type: object
      description: >
        storage.ManagerTeamMember with explicit snake_case json tags (PAC-26, API-030); the
        keys match the manager_team_members columns. Returned by addManagerTeamMember (201)
        and patchManagerTeamMember (200), both read back from storage after the write. The
        schema name is kept from before PAC-26, when the struct had no tags and the keys
        were the Go field names (`ID`, `ManagerUserID`, `MemberEmail`, ...). Note the key
        is `member_email` here but `email` on ManagerRosterMember: this is the stored row,
        the roster is a view.
      properties:
        id:
          type: string
          format: uuid
          description: >
            The stored row id. Since PAC-26 (API-031) never the zero UUID on the 201 add
            response.
        manager_user_id: { type: string, format: uuid }
        member_email: { type: string, format: email }
        member_user_id:
          type: [string, "null"]
          format: uuid
          deprecated: true
          description: >
            DEPRECATED, always null since PAC-130 (spec D-4, AC-1, AC-5, AC-16). The key
            stays, and stays required, so that a client built on the previous contract
            (which required it as a nullable uuid) parses every answer unchanged; it may be
            removed by a later ticket no earlier than the first release after the one that
            ships PAC-130. It is null whatever account holds `member_email`, and also for a
            row whose stored link was kept by migration 042: no answer depends on a stored
            link. Before PAC-130 it carried the id of the address's one domain-confirmed
            holder (PAC-71), which revealed whether any address had a Paceday account, and
            that account's internal id (spec O-1 to O-3). Whether a roster person is shown
            as a Paceday user is ManagerRosterMember.is_paceday_user.
        display_name: { type: string }
        source: { $ref: "#/components/schemas/ManagerMemberSource" }
        cadence: { $ref: "#/components/schemas/Cadence" }
        cadence_custom_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
        last_one_on_one_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
          description: Stored value; since PAC-26 (API-031) never "0001-01-01T00:00:00Z".
        updated_at:
          type: string
          format: date-time
          description: Stored value; since PAC-26 (API-031) never "0001-01-01T00:00:00Z".
      required:
        [id, manager_user_id, member_email, member_user_id, display_name, source, cadence,
         cadence_custom_days, last_one_on_one_at, created_at, updated_at]
      additionalProperties: false

    AddManagerMemberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            Lowercased and trimmed, then validated with net/mail.ParseAddress; the parsed
            address must equal the normalized input, so display-name forms like
            "A <a@b.com>" are rejected.
        display_name:
          type: string
          description: Trimmed. When blank, defaults to the local part of the email.
        cadence:
          allOf: [{ $ref: "#/components/schemas/Cadence" }]
          description: Lowercased and trimmed. Defaults to "none" when omitted or empty.
        cadence_custom_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: Required iff cadence == "custom"; must be absent/null otherwise.
      required: [email]
      additionalProperties: true

    PatchManagerMemberRequest:
      type: object
      description: >
        All fields optional. Present-but-null is indistinguishable from absent for
        cadence_custom_days (both decode to a nil *int and preserve the stored value).
      properties:
        display_name: { type: [string, "null"] }
        cadence: { $ref: "#/components/schemas/Cadence" }
        cadence_custom_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
      additionalProperties: true

    ScanCandidate:
      type: object
      properties:
        email: { type: string, format: email }
        display_name:
          type: string
          description: >
            Taken from the calendar attendee's displayName; can be the empty string when
            the provider supplied none.
        already_assigned:
          type: boolean
          description: True when this email already has an assignment on the selected team.
      required: [email, display_name, already_assigned]
      additionalProperties: false

    ScanPreview:
      type: object
      properties:
        team_id: { type: string, format: uuid }
        scanned_at:
          type: string
          format: date-time
          description: RFC3339 UTC, set by the engine at the start of the scan.
        detected:
          type: integer
          minimum: 0
          description: Total candidates returned by the scan (== candidates.length).
        eligible:
          type: integer
          minimum: 0
          description: Candidates not already assigned to this team.
        assigned:
          type: integer
          const: 0
          description: Always 0. Preview assigns nothing; see POST /api/manager/detect/confirm.
        skipped:
          type: integer
          minimum: 0
          description: detected - eligible, i.e. candidates already assigned to this team.
        candidates:
          type: array
          description: Always an array (the engine initialises it to an empty slice). Sorted by email ascending.
          items: { $ref: "#/components/schemas/ScanCandidate" }
      required: [team_id, scanned_at, detected, eligible, assigned, skipped, candidates]
      additionalProperties: false

    ScanConfirmRequest:
      type: object
      properties:
        emails:
          type: array
          description: >
            Required and non-null; an empty array is legal. Each entry is lowercased,
            trimmed and validated. Decoded with DisallowUnknownFields.
          items: { type: string, format: email }
      required: [emails]
      additionalProperties: false

    ScanConfirmation:
      type: object
      properties:
        team_id: { type: string, format: uuid }
        assigned:
          type: integer
          minimum: 0
          description: Assignments newly created by THIS call.
        skipped:
          type: integer
          minimum: 0
          description: >
            Counts blank entries, duplicates within this request, emails with no global
            manager_team_members identity, and emails already assigned to this team.
        total:
          type: integer
          minimum: 0
          description: Total assignments for this manager+team after the transaction commits.
      required: [team_id, assigned, skipped, total]
      additionalProperties: false

    MemberWeekStats:
      type: object
      description: >
        engine.MemberWeekStats. When data_available is false the three minute counters are
        all 0 — callers must branch on data_available rather than treating 0 as measured.
        Which figures a week carries is the PAC-130 branch of getManagerRoster: Paceday
        figures (visible, known account, PAC-60 owner, consent), no read (visible but not
        entitled: zeroes, data_available false), or an estimate (not visible).
      properties:
        focus_minutes:
          type: integer
          description: >
            Always 0 on the estimate branch (a person not visible to the caller, whatever
            account holds the address); free/busy yields no focus signal. On the Paceday
            branch, the stored analytics_weeks value.
        meeting_minutes: { type: integer }
        free_minutes:
          type: integer
          description: >
            On the estimate branch, 2400 (5 days x 8h) minus busy minutes, floored at 0.
            On the Paceday branch, the stored analytics_weeks value.
        data_available: { type: boolean }
      required: [focus_minutes, meeting_minutes, free_minutes, data_available]
      additionalProperties: false

    ManagerRosterMember:
      type: object
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        source: { $ref: "#/components/schemas/ManagerMemberSource" }
        cadence: { $ref: "#/components/schemas/Cadence" }
        cadence_custom_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
        last_one_on_one_at:
          type: [string, "null"]
          format: date-time
        is_paceday_user:
          type: boolean
          description: >
            PAC-130 (spec §3.1, D-1, D-5, AC-4, AC-10, AC-17): true iff the entry's address
            is VISIBLE ON PACEDAY to the caller, decided at read time. It is visible when
            some account whose stored address equals the entry's address ignoring letter
            case, at ANY address standing, is (a) a Paceday member (a team_members row,
            owner or member; never a person added under PAC-129) of a team the caller is
            also a Paceday member of, in either role, or (b) an account the organisation
            member list (listOrgMembers, GET /api/org/members) returns to the caller.
            Rule (b) IS that list, not a separate organisation rule: whatever narrows the
            list narrows (b) with it. Since PAC-148 (spec §3.6, D-9) the list holds only
            accounts that belong to the caller's organisation under the organisation
            membership rule stated on listOrgMembers (domain-confirmed, not at a
            consumer-list domain, in the organisation of their address's domain), and
            only when the caller belongs to one: a caller that is not domain-confirmed,
            or is at a consumer domain, has an empty (b), and an unconfirmed account at
            the caller's own company domain is outside (b) (estimated, unless (a)
            holds). No Paceday figure moves: such an entry goes from "no data" to the
            estimate, the answer for an address no account holds. (Before PAC-148, (b)
            carried the list's exposure for consumer domains missing from the
            generic-domain list.)
            An account outside (a) and (b) is never consulted, so the value is the same
            for an address no account holds and for one held only outside them. true does
            not promise figures (see getManagerRoster's branches), false does NOT mean
            "has no Paceday account", and a client must not say so. Always true for source
            "formal" (a co-member by construction); always false for source "added"
            (PAC-129). Before PAC-130: true iff a stored member_user_id was set, which
            revealed account existence for any address.
        this_week:
          allOf: [{ $ref: "#/components/schemas/MemberWeekStats" }]
          description: >
            Never null — the handler substitutes a zero-valued MemberWeekStats when the
            engine returns nil (a person added to the team: no calendar read). A failed
            engine read is the 500, never zeroes (PAC-122 SF-040).
        last_week:
          allOf: [{ $ref: "#/components/schemas/MemberWeekStats" }]
          description: Same nil-substitution and failure rule as this_week; the week 7 days before `week`.
        focus_trend_pct:
          type: number
          description: >
            engine.TrendPct(this_week.focus, last_week.focus). Clamped to [-200, 200],
            rounded to one decimal. Returns exactly 200 when prior is 0 and current is
            non-zero, and 0 when both are 0. Never NaN or Inf.
          minimum: -200
          maximum: 200
      required:
        [email, display_name, source, cadence, cadence_custom_days, last_one_on_one_at,
         is_paceday_user, this_week, last_week, focus_trend_pct]
      additionalProperties: false

    ManagerRoster:
      type: object
      properties:
        team_id:
          type: string
          format: uuid
          description: >
            Echo of the requested team_id. The frontend treats a mismatch as a stale
            response and discards it.
        members:
          type: array
          items: { $ref: "#/components/schemas/ManagerRosterMember" }
      required: [team_id, members]
      additionalProperties: false

    CadenceGap:
      type: object
      description: engine.CadenceGap.
      properties:
        member_email: { type: string, format: email }
        display_name: { type: string }
        cadence: { $ref: "#/components/schemas/Cadence" }
        last_one_on_one_at:
          type: [string, "null"]
          format: date-time
        next_expected_by:
          type: string
          format: date-time
          description: >
            last_one_on_one_at plus the cadence interval; now when the member was never met.
            Monthly uses calendar-month arithmetic; the rest use day addition.
        days_overdue:
          type: integer
          minimum: 0
          description: >
            0 when the next 1:1 is still upcoming within the 7-day warning window; positive
            when already past due. Never negative — upcoming-ness is not encoded here.
      required: [member_email, display_name, cadence, last_one_on_one_at, next_expected_by, days_overdue]
      additionalProperties: false

    CadenceGapList:
      type: object
      properties:
        gaps:
          type: array
          items: { $ref: "#/components/schemas/CadenceGap" }
      required: [gaps]
      additionalProperties: false

    ManagerAnalyticsWeek:
      type: object
      properties:
        week_start:
          type: string
          format: date
          description: YYYY-MM-DD, the Monday of this bucket.
        focus_minutes: { type: integer }
        meeting_minutes: { type: integer }
        free_minutes: { type: integer }
        data_available:
          type: boolean
          description: False when the member's week could not be measured (see degraded-analytics invariant).
      required: [week_start, focus_minutes, meeting_minutes, free_minutes, data_available]
      additionalProperties: false

    ManagerAnalyticsMember:
      type: object
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        is_paceday_user:
          type: boolean
          description: >
            The visibility rule of ManagerRosterMember.is_paceday_user (PAC-130), applied
            to this caller and address: the same value the roster carries for them
            (PAC-34). false does NOT mean "has no Paceday account".
        data_available:
          type: boolean
          description: >
            True iff at least one entry of `weeks` has data_available=true (PAC-34). Derived
            from the buckets of this response, never read or cached separately, so it cannot
            disagree with them. False means no bucket is measured (degraded FreeBusy, no
            analytics_weeks rows, or the PAC-130 no-read branch: visible but not entitled,
            which covers consent withheld and the PAC-60 gate): the
            member's minutes must be shown as "no data", not as zeroes. True does NOT mean
            every bucket is measured; each bucket's own data_available still decides how
            that bucket is drawn.
        weeks:
          type: array
          minItems: 12
          maxItems: 12
          description: Exactly 12 buckets, newest first.
          items: { $ref: "#/components/schemas/ManagerAnalyticsWeek" }
      required: [email, display_name, is_paceday_user, data_available, weeks]
      additionalProperties: false

    ManagerAnalytics:
      type: object
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/ManagerAnalyticsMember" }
      required: [members]
      additionalProperties: false

    ScheduleOneOnOneRequest:
      type: object
      properties:
        suggested_date:
          type: string
          format: date
          description: >
            YYYY-MM-DD. Optional; when present it is appended to the prefill URL as `date`.
            An empty string is treated as absent.
      additionalProperties: true

    PrefillUrlResponse:
      type: object
      properties:
        prefill_url:
          type: string
          description: Relative URL beginning with "/app?".
      required: [prefill_url]
      additionalProperties: false

    TeamNameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed before storage. No maximum length is enforced by the backend.
      required: [name]
      additionalProperties: true

    InviteEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            Normalised by the one address normaliser of AddTeamPersonRequest.email
            (PAC-129 revision 1.2: the trim set now includes U+FEFF); every check of
            inviteTeamMember compares the normalised form, and it is the form stored.
        name:
          type: string
          description: >
            PAC-129 (SF-051). Optional display name, trimmed. Used only when the call adds
            the address to the team (inviteTeamMember step 3); an existing entry's name is
            never changed. Absent or blank: "".
      required: [email]
      additionalProperties: true

    AddTeamPersonRequest:
      type: object
      description: PAC-129. Unknown keys are ignored (the generated decoder does not refuse them).
      properties:
        email:
          type: string
          description: >
            PAC-129 contract 1.1 (challenge B-1): a plain string, deliberately WITHOUT
            `format: email`, so the generated decoder accepts any JSON string and the
            server's one address normaliser is the only validator (contract PAC-129 §3.0,
            revision 1.2): trim the 26 code points of contract §2.2 from both ends
            (ECMAScript WhiteSpace and LineTerminator plus Go's unicode.IsSpace: U+0009-
            U+000D, U+0020, U+0085, U+00A0, U+1680, U+2000-U+200A, U+2028, U+2029,
            U+202F, U+205F, U+3000, U+FEFF), lowercase, then net/mail.ParseAddress, whose
            parsed address must equal the result. Every check of this operation compares
            that form, and it is the form stored. Blank after trimming: 400
            "email is required". Refused by the normaliser: 422 "email must be a valid
            email address". Stored normalised. A body that is not JSON, or an `email`
            that is not a JSON string, is the wrapper's 400 "invalid body".
        name:
          type: string
          description: Optional display name, trimmed; absent or blank stores "".
      required: [email]
      additionalProperties: true

    AddTeamPersonError:
      type: object
      description: >
        PAC-129. The 422 of addTeamPerson; nothing is stored. The values are exact.
      properties:
        error:
          type: string
          enum:
            - email must be a valid email address
            - you cannot add your own address
            - this address belongs to a Paceday member of this team
            - this team has reached its limit of 50 members; remove someone before adding another
          x-enum-varnames:
            - AddTeamPersonInvalidEmail
            - AddTeamPersonOwnAddress
            - AddTeamPersonPacedayMember
            - AddTeamPersonLimitReached
      required: [error]
      additionalProperties: false

    TeamMemberLimitError:
      type: object
      description: >
        PAC-129 (spec §3.10). The cap refusal of inviteTeamMember for an address not yet on
        the team; the same text as addTeamPerson's limit refusal.
      properties:
        error:
          type: string
          enum:
            - this team has reached its limit of 50 members; remove someone before adding another
          x-enum-varnames: [TeamMemberLimitReached]
      required: [error]
      additionalProperties: false

    InvalidEmailError:
      type: object
      description: The address did not validate (normalizeManagerEmail).
      properties:
        error:
          type: string
          enum: [email must be a valid email address]
          x-enum-varnames: [InvalidEmailAddress]
      required: [error]
      additionalProperties: false

    TeamFullError:
      type: object
      description: >
        PAC-129 (spec §3.7, §3.10, AC-19b). The 422 of acceptTeamInvite for a legacy
        invitation on a full team.
      properties:
        error:
          type: string
          enum:
            - this team is full; ask its owner to remove someone before you accept
          x-enum-varnames: [TeamFull]
      required: [error]
      additionalProperties: false

    TeamPersonNotFoundError:
      type: object
      description: PAC-129. The 404 of removeTeamPerson.
      properties:
        error:
          type: string
          enum: [person not found]
          x-enum-varnames: [TeamPersonNotFound]
      required: [error]
      additionalProperties: false

    TeamPersonKind:
      type: string
      description: >
        PAC-129 (spec §3.2). `paceday`: joined by accepting an invitation (a team_members
        row). `added`: added without Paceday access (no account link, whatever account
        holds the address). The kind depends only on whether the person accepted an
        invitation.
      enum: [paceday, added]

    TeamPersonRole:
      type: string
      description: PAC-129. A Paceday member's role (team_members.role).
      enum: [owner, member]

    TeamPersonInvitation:
      type: object
      description: >
        PAC-129. The address's pending invitation on the team (stored status pending and
        expiry after now). The token is not listed (it is returned only to the owner, by
        inviteTeamMember).
      properties:
        expiresAt: { type: string, format: date-time }
      required: [expiresAt]
      additionalProperties: false

    TeamPerson:
      type: object
      description: >
        PAC-129. One member of the team, of either kind, as every member sees it. No
        timestamp: two adds of different addresses answer bodies that differ only in
        `email` and `name` (AC-2).
      properties:
        email:
          type: string
          description: >
            Lowercase. For a Paceday member, the account's address. No `format: email`
            (contract 1.1, B-1): an address the server's normaliser accepts (for example
            `pat@localhost`) must encode, so the generated encoder may not apply a
            stricter pattern than the one that admitted it.
        name:
          type: string
          description: >
            Paceday member: the account's name ("" when it has none). Added person: the name
            given when they were added ("" when none). Always present, possibly "".
        kind: { $ref: "#/components/schemas/TeamPersonKind" }
        userId:
          type: [string, "null"]
          format: uuid
          description: The account id for kind `paceday`; null, always, for kind `added`.
        role:
          description: The membership role for kind `paceday`; null, always, for kind `added`.
          oneOf:
            - $ref: "#/components/schemas/TeamPersonRole"
            - type: "null"
        invitation:
          description: >
            For kind `added`, the pending invitation for the address, or null when there is
            none. Always null for kind `paceday`. Contract 1.1 (challenge m-6): shown ONLY
            to an owner of the team; for any other member it is always null, so who was
            invited and when it lapses stay visible only to owners, as before PAC-129.
          oneOf:
            - $ref: "#/components/schemas/TeamPersonInvitation"
            - type: "null"
      required: [email, name, kind, userId, role, invitation]
      additionalProperties: false

    TeamInviteOutcome:
      type: string
      description: >
        PAC-129. What inviteTeamMember did. `added_and_invited` (201): the address was not
        on the team; it is now an added person and a new invitation was created.
        `invited` (201): the address already was an added person; a new invitation was
        created. `already_pending` (200): a pending invitation existed; no new invitation
        (the person may have been added by this call, step 3). `already_member` (200): a
        Paceday member holds the address; nothing written.
      enum: [added_and_invited, invited, already_pending, already_member]

    TeamInviteResult:
      type: object
      description: >
        PAC-129. The 201 and 200 of inviteTeamMember. `invitation` is null exactly when
        outcome is `already_member`. The caller is always an owner, so
        `person.invitation` is shown. Replaces the bare TeamInvite of the 201 (consumers:
        contract PAC-129 §8).
      properties:
        outcome: { $ref: "#/components/schemas/TeamInviteOutcome" }
        invitation:
          oneOf:
            - $ref: "#/components/schemas/TeamInvite"
            - type: "null"
        person: { $ref: "#/components/schemas/TeamPerson" }
      required: [outcome, invitation, person]
      additionalProperties: false

    Team:
      type: object
      description: storage.Team. Note the camelCase json tags — unlike the manager domain's snake_case.
      properties:
        id: { type: string, format: uuid }
        orgId:
          type: string
          format: uuid
          description: Omitted entirely when the team has no organization (omitempty on a *uuid.UUID).
        name: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
      required: [id, name, createdBy, createdAt]
      additionalProperties: false

    TeamMember:
      type: object
      description: storage.TeamMember, as returned inside TeamDetail.
      properties:
        teamId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role:
          type: string
          enum: [owner, member]
        joinedAt: { type: string, format: date-time }
        name:
          type: string
          description: >
            Joined from users.name via COALESCE(...,''), and tagged omitempty — so a user
            with no name causes the key to be OMITTED, not sent as "".
        email:
          type: string
          description: >
            Joined from users.email, also omitempty. No `format: email` (PAC-138, as
            TeamPerson.email since PAC-129 contract 1.1, B-1): a response may not apply a
            stricter pattern than the server's address normaliser (net/mail), which
            accepts addresses such as `a&b@x.example` or `pat@x.y`.
      required: [teamId, userId, role, joinedAt]
      additionalProperties: false

    TeamDetail:
      type: object
      properties:
        team: { $ref: "#/components/schemas/Team" }
        members:
          type: array
          description: >
            The Paceday members only, in today's shape (spec §3.2, AC-8): what a client
            built before PAC-129 reads. `[]` only when the team has no member rows; since
            PAC-129 a failed read is the 500 (SF-039).
          items: { $ref: "#/components/schemas/TeamMember" }
        people:
          type: array
          description: >
            PAC-129. Every member of both kinds: the Paceday members (in `members` order),
            then the added people by the time they were added.
          items: { $ref: "#/components/schemas/TeamPerson" }
      required: [team, members, people]
      additionalProperties: false

    TeamInvite:
      type: object
      description: storage.TeamInvite, returned in full (token included) by inviteTeamMember.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        inviteeEmail:
          type: string
          description: >
            The stored form of the invited address, written by the one address
            normaliser of AddTeamPersonRequest.email (PAC-129 §3.0). No `format: email`
            (PAC-138): the normaliser (net/mail) accepts addresses such as
            `a&b@x.example` or `pat@x.y`, so a stricter pattern here would refuse an
            invitation the server already created.
        invitedBy: { type: string, format: uuid }
        token:
          type: string
          description: A freshly generated UUID string used as the invite link path segment.
        status:
          type: string
          enum: [pending, accepted, declined, expired]
          # PAC-149: pinned so the generated Go names do not change when an unrelated
          # enum with the same values (SchedulingLinkHostRecord.status) is removed.
          x-enum-varnames: [TeamInviteStatusPending, TeamInviteStatusAccepted, TeamInviteStatusDeclined, TeamInviteStatusExpired]
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: createdAt + 7 days (computed in Go, not by the database).
      required: [id, teamId, inviteeEmail, invitedBy, token, status, createdAt, expiresAt]
      additionalProperties: false

    TeamInvitePreview:
      type: object
      description: >
        A narrow projection of a pending invite, NOT a TeamInvite (no id, token, status,
        invitedBy or createdAt). The three original keys are camelCase and stay so for
        existing readers; the three keys added by PAC-34 are snake_case, the spelling the
        PAC-34 acceptance criteria name and the web normalizer reads (see
        contracts/features/PAC-34.md section 3 for the rejected alternatives). team_id and
        expires_at come from the invite row itself, so they are always present. The team
        and inviter rows are read separately. A failed read of either is the operation's
        500, never a 200 with a blank name (PAC-141 SF-110; before PAC-141 it was a 200
        with teamName and inviterName "" and inviter_email null). A row that does not
        exist (not a failed read) still gives "" and null; team_id and invited_by both
        cascade on delete, so it does not arise in practice.
      properties:
        teamName:
          type: string
          description: >
            Empty string when the team row does not exist. A failed read is the 500
            (PAC-141).
        inviterName:
          type: string
          description: >
            The inviter's DISPLAY NAME, not their email. Empty string when the user row
            does not exist or holds no name. A failed read is the 500 (PAC-141).
        email:
          type: string
          format: email
          description: The invitee email the invite was issued to.
        team_id:
          type: string
          format: uuid
          description: team_invites.team_id of this invite (PAC-34). Never empty.
        expires_at:
          type: string
          format: date-time
          description: >
            team_invites.expires_at, RFC 3339 (PAC-34): createdAt + 7 days, computed in Go
            when the invite was created. A 200 is returned only while the invite is pending
            and ExpireOldInvites runs first, so a client normally sees a future instant; a
            client must still treat a past value as expired rather than assume otherwise.
        inviter_email:
          type: [string, "null"]
          format: email
          description: >
            The inviter's account email, users.email of team_invites.invited_by (PAC-34).
            null, never "", when the inviter's user row holds no email or does not exist.
            invited_by is NOT NULL with ON DELETE CASCADE, so a deleted inviter removes the
            invite (404). A failed read of the row is the 500, never null (PAC-141).
      required: [teamName, inviterName, email, team_id, expires_at, inviter_email]
      additionalProperties: false

    NoMeetingZoneRequest:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Monday=1 .. Sunday=7. 0 is rejected, so this field is effectively required.
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: HH:MM, 24-hour, parsed with Go layout "15:04". Trimmed before use.
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: HH:MM. Must be strictly after startTime.
        label:
          type: string
          description: Trimmed. Optional; the column defaults to an empty string.
      required: [dayOfWeek, startTime, endTime]
      additionalProperties: true

    NoMeetingZone:
      type: object
      description: storage.NoMeetingZone after the handler's storage->wire weekday conversion.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Monday=1 .. Sunday=7 on the wire (0 in the database).
        startTime:
          type: string
          description: Rendered by the Postgres driver from a TIME column.
          x-uncertain: >
            Request format is strictly HH:MM, but the response is the driver's text form of
            a TIME column, which is "HH:MM:SS" (e.g. "09:00:00"). No test asserts the
            response string, so the exact shape is unconfirmed. Clients must not assume
            request and response formats are identical.
        endTime:
          type: string
          x-uncertain: Same TIME-column formatting question as startTime.
        label: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, teamId, dayOfWeek, startTime, endTime, label, createdAt]
      additionalProperties: false

    TeamSlot:
      type: object
      description: engine.TeamSlot.
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        quality_score:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            100 - (members_with_disrupted_focus / total_members) * 100, integer division.
            Focus blocks are a Paceday member's only; the divisor (PAC-129) is the Paceday
            members, so adding people does not change a slot's score.
        free_count:
          type: integer
          minimum: 0
          description: >
            PAC-129 (SF-054). Members of both kinds whose availability is known for the
            day; since an offered slot never has a busy member, all of them are free in
            this slot. free_count + unknown_count = total_count.
        unknown_count:
          type: integer
          minimum: 0
          description: >
            PAC-129. Members of both kinds whose availability could not be read for the
            day (the same for every slot of one answer). Unknown is never counted free.
        total_count:
          type: integer
          minimum: 1
          description: PAC-129. Members of both kinds on the team when it was read.
      required: [start, end, quality_score, free_count, unknown_count, total_count]
      additionalProperties: false

    TeamSlotList:
      type: object
      properties:
        slots:
          type: array
          items: { $ref: "#/components/schemas/TeamSlot" }
      required: [slots]
      additionalProperties: false

    MemberAnalyticsSummary:
      type: object
      description: engine.MemberAnalyticsSummary.
      properties:
        user_id: { type: string, format: uuid }
        name:
          type: string
          description: >
            The user's display name, which may be "" (COALESCE default). No email is
            included, which is why the frontend has to match breakdown rows by name or
            positional index.
        meeting_minutes: { type: integer }
        focus_minutes: { type: integer }
        focus_score: { type: integer }
      required: [user_id, name, meeting_minutes, focus_minutes, focus_score]
      additionalProperties: false

    TeamAnalytics:
      type: object
      description: engine.TeamAnalytics.
      properties:
        week_start:
          type: string
          format: date
          description: PAC-129 (SF-053). The Monday of the week these figures are for, YYYY-MM-DD.
        avg_meeting_minutes:
          type: integer
          description: >
            PAC-129 (SF-041): integer division over the Paceday members whose figures are
            `measured` (by 1 when there are none). Added people and `no_data` members are
            never counted. Before PAC-129 the divisor was every member.
        avg_focus_minutes:
          type: integer
          description: Same divisor as avg_meeting_minutes.
        member_breakdown:
          type: array
          description: >
            Kept for clients built before PAC-129: the Paceday members only, today's shape;
            a member with no stored week still appears with zeroes. `[]` when the team has
            no Paceday members. New clients read `people`.
          items: { $ref: "#/components/schemas/MemberAnalyticsSummary" }
        people:
          type: array
          description: PAC-129. One row per member of both kinds, in TeamDetail.people order.
          items: { $ref: "#/components/schemas/TeamAnalyticsPerson" }
      required: [week_start, avg_meeting_minutes, avg_focus_minutes, member_breakdown, people]
      additionalProperties: false

    TeamAnalyticsFigures:
      type: string
      description: >
        PAC-129. `measured`: the figures are present. `no_data`: nothing was measured
        (show "no data", never zero). `withheld`: an added person's figures, hidden from a
        caller who is not an owner.
      enum: [measured, no_data, withheld]

    TeamAnalyticsPerson:
      type: object
      description: >
        PAC-129. One member's row. Every figure is null unless `figures` is `measured`;
        for kind `added`, focus_minutes and focus_score are always null (availability
        only).
      properties:
        email:
          type: string
          description: As TeamPerson.email (no `format`, contract 1.1 B-1).
        name: { type: string }
        kind: { $ref: "#/components/schemas/TeamPersonKind" }
        userId:
          type: [string, "null"]
          format: uuid
          description: As TeamPerson.userId.
        figures: { $ref: "#/components/schemas/TeamAnalyticsFigures" }
        meeting_minutes:
          type: [integer, "null"]
          minimum: 0
          description: >
            Paceday member: the stored week. Added person: busy minutes from free/busy
            through the adding owner's credential over the week.
        focus_minutes:
          type: [integer, "null"]
          minimum: 0
        focus_score:
          type: [integer, "null"]
      required: [email, name, kind, userId, figures, meeting_minutes, focus_minutes, focus_score]
      additionalProperties: false
