# Domain: teams
# Source of truth: backend/api/routes.go, backend/api/handlers_manager.go,
# backend/api/handlers_teams.go, backend/storage/manager.go, backend/storage/teams.go,
# backend/engine/manager.go, backend/engine/team_availability.go.
# Contract tests consulted: backend/api/manager_contract_test.go,
# backend/storage/manager_contract_test.go, backend/api/handlers_teams_test.go,
# backend/api/handlers_manager_test.go.
#
# All routes below are registered inside the `requireAuth` group in routes.go and
# therefore inherit the global default security scheme. This includes
# GET /api/teams/invites/{token}, whose handler comment says "(public)" but which is
# in fact mounted behind JWT auth (see teams.notes.md).
#
# TWO ERROR SHAPES EXIST. `writeError` (handlers_settings.go:206) emits
# application/json {"error": "..."}; `http.Error` emits text/plain with a bare
# message and no JSON envelope. Each response below names which one applies.
# Every 5xx is the JSON envelope with a fixed message (PAC-21); text/plain remains
# only on some 4xx responses.

paths:
  /api/manager/profile:
    get:
      operationId: getManagerProfile
      tags: [manager]
      summary: Manager flag, detection timestamp and global roster size.
      description: >
        Not team-scoped. `team_member_count` counts rows in manager_team_members for the
        caller (the global identity table), not assignments to any one formal team.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Manager profile summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerProfileSummary" }
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: setManagerProfile
      tags: [manager]
      summary: Set the caller's is_manager flag; may trigger background detection.
      description: >
        When `is_manager` is true and the profile has no `detected_at` yet, the handler
        spawns a background goroutine running DetectTeam with a 30s timeout. That
        background run persists detected members into the GLOBAL manager_team_members
        table only; it never creates team assignments. The response is written before
        the goroutine completes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagerProfileUpdate" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: >
            The storage.UserProfile Go struct, with explicit snake_case json tags since
            PAC-26 (API-030). Before PAC-26 the struct had no tags and the keys were
            PascalCase. The shape still differs from the GET response on the same
            path (GET is a summary with team_member_count; POST is the profile row).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileGoStruct" }
        "400":
          $ref: "#/components/responses/JsonError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/detect:
    post:
      operationId: previewManagerDetection
      tags: [manager]
      summary: Preview detected 1:1 candidates for a team. Assigns nothing.
      description: >
        PREVIEW half of the preview-then-confirm flow. Runs DetectTeam (which does write
        the global manager_team_members identity rows and one_on_one_occurrences as a side
        effect of scanning the calendar) and then reports, per candidate, whether that
        email is ALREADY assigned to the selected team. `assigned` is hard-coded to 0:
        this endpoint never creates a manager_team_member_assignments row for any team.
        `team_id` is REQUIRED here and the caller must be the team OWNER.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): the roster import (DetectTeam) resolves each detected address to an
        account (`member_user_id`) only when exactly one account holds it DOMAIN-CONFIRMED
        (case-insensitive); otherwise the identity row is written with `member_user_id`
        null, as for a non-Paceday address.
      parameters:
        - $ref: "#/components/parameters/RequiredTeamIdQuery"
      requestBody:
        required: false
        description: Body is ignored entirely.
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Detection preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanPreview" }
        "400":
          description: >
            JSON error. "team_id is required" when the query param is absent or blank;
            "team_id must be a valid UUID" when unparseable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/CalendarNotConnected"
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          description: >-
            Detection failed for a user who HAS a stored Google credential (a user with none
            gets the 401 `calendar not connected`): `{"error":"internal error"}`; or the
            per-candidate assignment lookup failed: `{"error":"db error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/manager/detect/confirm:
    post:
      operationId: confirmManagerDetection
      tags: [manager]
      summary: Explicitly assign selected candidate emails to one team.
      description: >
        CONFIRM half of the preview-then-confirm flow. The only endpoint that creates
        manager_team_member_assignments rows from detection. Runs in a single transaction
        (storage.ConfirmManagerTeamMembers) and is idempotent: a second confirm of the same
        email counts as skipped, not assigned. Emails are lowercased/trimmed by the handler
        before storage sees them. The request decoder uses DisallowUnknownFields, so any
        field other than `emails` yields 400 "invalid JSON".
      parameters:
        - $ref: "#/components/parameters/RequiredTeamIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanConfirmRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Assignment counts. `total` is the post-commit assignment count for this team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanConfirmation" }
        "400":
          description: >
            JSON error. "team_id is required", "team_id must be a valid UUID", or
            "invalid JSON" (malformed body OR an unknown field, via DisallowUnknownFields).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: >
            JSON error. "emails is required" when the key is absent or JSON null (an empty
            array is accepted and returns assigned=0, skipped=0); "email is required" for a
            blank entry; "email must be a valid email address" for an unparseable entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/team:
    get:
      operationId: getManagerRoster
      tags: [manager]
      summary: Team-scoped manager roster with this-week / last-week stats.
      description: >
        `team_id` is REQUIRED (unlike the member-mutation routes below), and membership —
        not ownership — suffices. The roster is the union of (a) manager assignments for
        this team and (b) formal team_members of this team that have no assignment yet,
        synthesised with source="formal" and cadence="none". The caller is always excluded
        from (b). Sorted case-insensitively by display_name. `members` is always an array,
        never null.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): merging formal members with roster entries is a keeping site:
        a roster entry represents a formal member whose stored address equals the entry's
        address case-insensitively, at ANY standing. Nothing is granted here.
      parameters:
        - $ref: "#/components/parameters/RequiredTeamIdQuery"
        - name: week
          in: query
          required: false
          description: >
            Monday of the target week, YYYY-MM-DD, parsed as UTC midnight. Defaults to the
            current ISO week's Monday in UTC. Not validated to actually be a Monday.
          schema: { type: string, format: date }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Manager roster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerRoster" }
        "400":
          description: >
            JSON error. "team_id is required", "team_id must be a valid UUID", or
            "week must be YYYY-MM-DD".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/team/members:
    post:
      operationId: addManagerTeamMember
      tags: [manager]
      summary: Add or upsert a roster member, optionally scoped to a team.
      description: >
        `team_id` is OPTIONAL here. Without it the member is written to the global
        manager_team_members table only. With it the write is transactional across
        manager_team_members plus manager_team_member_assignments, and the caller must
        be the team OWNER. Adding a member never creates a team_invites row (asserted by
        TestManagerTeam_AddMemberCreatesOnlySelectedTeamAssignment).

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): `member_user_id` is resolved to an account only when exactly
        one account holds `email` DOMAIN-CONFIRMED (compared case-insensitively; before
        PAC-71 an exact-case match on any account). An address that is carried only
        unconfirmed, by several accounts (a letter-case collision), or by none resolves to
        nobody: the roster row is stored with `member_user_id` null, as for a non-Paceday
        address today.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddManagerMemberRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "201":
          description: >
            The member row as stored, read back after the upsert commits (PAC-26,
            API-031), as storage.ManagerTeamMember with explicit snake_case json tags
            (API-030). Without `team_id` it is the global manager_team_members row; with
            `team_id` it is that row seen through this team's assignment (display name
            override, assignment cadence and cadence_custom_days), exactly as
            patchManagerTeamMember returns it. `id`, `created_at` and `updated_at` are
            the stored values. Before PAC-26 the body was the pre-insert struct in
            PascalCase with the zero UUID and "0001-01-01T00:00:00Z" timestamps. If the
            read-back fails the response is the 500 below, although the upsert has
            committed; the upsert is idempotent, so a retry is safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerTeamMemberGoStruct" }
        "400":
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: >
            JSON error. "email is required"; "email must be a valid email address";
            "cadence must be weekly, biweekly, monthly, custom, or none";
            "custom_cadence_days must be between 1 and 365";
            "custom_cadence_days is only valid with custom cadence".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/team/members/{email}:
    parameters:
      - $ref: "#/components/parameters/MemberEmailPath"
    delete:
      operationId: removeManagerTeamMember
      tags: [manager]
      summary: Remove a member globally, or unassign them from one team.
      description: >
        Without `team_id`: deletes the global manager_team_members row outright.
        With `team_id` (owner required): removes the formal team_members row if the email
        maps to a Paceday user, deletes the manager assignment for this team only, deletes
        pending team_invites for this email on this team, and LEAVES the global
        manager_team_members identity row and its 1:1 history intact. Every storage error
        on this path is swallowed, so a failed delete still returns 204.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): with `team_id`, the formal team membership is removed for EVERY
        account that carries the address in any letter case and at any standing (a
        revoking site): two accounts that differ only in letter case are both removed,
        and an unconfirmed carrier is removed too, never a silent no-op. If one of them is
        the team owner the answer is the 422 and nothing is removed. If no account carries
        the address, the assignment and pending invites are still removed and the answer
        is still 204 (spec §6). The global path (no `team_id`) is unchanged.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/SessionGenerationUnavailable'
        "204":
          description: Deleted (or silently no-op). Empty body.
        "400":
          description: JSON error — "team_id must be a valid UUID".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: JSON error — "the team owner cannot be removed".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: patchManagerTeamMember
      tags: [manager]
      summary: Update display name and/or cadence for a roster member.
      description: >
        Omitted fields keep their current value. Supplying `cadence` as anything other
        than "custom" clears cadence_custom_days; omitting `cadence` preserves it
        (TestManagerPatchMember_PreservesOmittedCustomDays). A blank display_name falls
        back to the local part of the email. With `team_id`, only team-scoped preferences
        change (display_name_override, cadence, cadence_custom_days on the assignment row);
        the canonical global display name is never overwritten. Also, with `team_id`, a
        formal team member with no assignment yet is materialised into an assignment on
        first patch.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): that materialisation is a granting site: a formal member is matched
        to `{email}` only when that member's account holds `{email}` DOMAIN-CONFIRMED
        (case-insensitive); a formal member whose address is unconfirmed is not matched,
        and the answer is the one for an address with no roster entry.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchManagerMemberRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: >
            The re-read storage.ManagerTeamMember, with explicit snake_case json tags
            since PAC-26 (API-030). Never `null`: since PAC-26 (API-032) a failed
            re-read is the 500 below instead of a 200 whose body is the JSON literal
            `null`. The patch has committed when that 500 is sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerTeamMemberGoStruct"
        "400":
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "404":
          description: text/plain "not found" — no such member in scope.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: JSON error — cadence validation, same messages as addManagerTeamMember.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/team/members/{email}/schedule:
    parameters:
      - $ref: "#/components/parameters/MemberEmailPath"
    post:
      operationId: scheduleManagerOneOnOne
      tags: [manager]
      summary: Build a server-side /app prefill URL for a 1:1 with this member.
      description: >
        Creates nothing on any calendar. Returns a relative URL of the form
        `/app?attendees=<email>&duration=30&title=1%3A1+with+<display_name>` plus
        `&date=<suggested_date>` when supplied (query params are Go url.Values-encoded, so
        alphabetically ordered). An empty body is accepted (io.EOF is tolerated).

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): the roster entry this operation may materialise for a formal team
        member follows the same DOMAIN-CONFIRMED rule as patchManagerTeamMember.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleOneOnOneRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Prefill URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrefillUrlResponse" }
        "400":
          description: JSON error — "team_id must be a valid UUID" or "invalid JSON".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "404":
          description: text/plain "not found".
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: JSON error — "suggested_date must be YYYY-MM-DD".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/manager/gaps:
    get:
      operationId: getManagerCadenceGaps
      tags: [manager]
      summary: Members whose 1:1 cadence is overdue or due within 7 days.
      description: >
        Gaps are computed over the roster in scope: the manager's global roster, or, when
        `team_id` is supplied, the team-scoped roster with that team's cadences. Members
        with cadence="none" never appear. A member never met is due now. A member with
        a recorded 1:1 occurrence in the next 14 days is suppressed. Sorted by
        days_overdue descending. `gaps` is always an array, never null.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Cadence gaps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CadenceGapList" }
        "400":
          description: JSON error — "team_id must be a valid UUID".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          description: >-
            Gap detection or a database read failed. `error` is "internal error" or "db
            error". The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/manager/analytics:
    get:
      operationId: getManagerAnalytics
      tags: [manager]
      summary: Twelve weeks of per-member focus/meeting/free minutes.
      description: >
        Returns exactly 12 week buckets per member (months=3 is hard-coded and numWeeks =
        months*4), ordered NEWEST FIRST: weeks[0].week_start == the resolved `week`, each
        subsequent entry is 7 days earlier. A member with no data still gets 12 buckets of
        zeroes with data_available=false. `members` is always an array, never null.
        Visibility (PAC-60): a member who is a Paceday user has measured minutes only when the
        caller owns at least one team that member belongs to; otherwise every bucket is zeroes
        with data_available=false, whatever the route or `team_id` that put the member on the
        caller's list. External (non-Paceday) members are unaffected (FreeBusy).
        PAC-34 (API-022): each member also carries is_paceday_user (same derivation as the
        roster's) and a member-level data_available that is true iff at least one of its 12
        buckets has data_available=true. A client must render a bucket with
        data_available=false, and a member with data_available=false, as "no data", never as
        zero minutes. Neither field widens visibility: is_paceday_user is already on the
        roster for the same caller and members, and data_available is derived only from the
        buckets this response already returns.
      parameters:
        - $ref: "#/components/parameters/OptionalTeamIdQuery"
        - name: week
          in: query
          required: false
          description: Monday of the newest week, YYYY-MM-DD. Defaults to the current UTC ISO week's Monday.
          schema: { type: string, format: date }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Per-member weekly analytics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerAnalytics" }
        "400":
          description: JSON error — "team_id must be a valid UUID" or "week must be YYYY-MM-DD".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams:
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a formal team; the caller becomes its owner.
      description: >
        Registered via chi `r.Route("/api/teams")` + `r.Post("/")`, so both `/api/teams`
        and `/api/teams/` route here. The owner team_members row is inserted with its
        error discarded, so a failed AddTeamMember still returns 201 with an ownerless team.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamNameRequest" }
      responses:
        "201":
          description: Created team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          description: >
            JSON error "name is required" — covers both a malformed body and a blank/
            whitespace-only name (one branch, one message).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/JsonUnauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      operationId: listTeams
      tags: [teams]
      summary: All teams the caller belongs to, newest first.
      description: >
        Bare JSON array (no envelope), ordered by teams.created_at DESC. Always an array,
        never null.
      responses:
        "200":
          description: Teams.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401":
          $ref: "#/components/responses/JsonUnauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/invites/{token}:
    get:
      operationId: getTeamInvite
      tags: [teams]
      summary: Preview a pending team invite by token.
      description: >
        Registered inside the requireAuth group and therefore requires a valid JWT. The
        handler comment says "(public)", which is wrong (API-089); PAC-34 corrects the
        comment, not the routing. Calls ExpireOldInvites first, so an invite past
        expires_at is reported as 410 "invite is expired" rather than 200.
        PAC-34 (API-021): the 200 also carries team_id, expires_at and inviter_email, so the
        invite page can show who invited the caller and when the link expires. The audience
        is unchanged: any authenticated caller holding the token, as before (the invitee
        email is checked on accept, not on preview). The token is still not echoed; the
        caller already has it in the path.
      parameters:
        - $ref: "#/components/parameters/InviteTokenPath"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Invite preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamInvitePreview" }
        "404":
          description: JSON error "invite not found".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: >
            JSON error "invite is <status>" where status is accepted, declined or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/invites/{token}/accept:
    post:
      operationId: acceptTeamInvite
      tags: [teams]
      summary: Accept a pending invite as the logged-in user.
      description: >
        The authenticated user's email must case-insensitively equal invitee_email.
        Membership is added with role "member" via an ON CONFLICT DO NOTHING insert, so
        accepting twice cannot demote an existing owner. Returns no body.

        PAC-71 (spec §3 "What standing allows", AC-28, AC-29, AC-40, AC-43; D-5, D-17): the invite is accepted only when the caller's ACCOUNT holds
        invitee_email DOMAIN-CONFIRMED: its stored address equals invitee_email
        case-insensitively AND its addressStanding (getCurrentUser) is domain_confirmed.
        An account that carries the address unconfirmed (bound with mailbox evidence, or
        created before PAC-71 and not bound yet) gets exactly today's mismatch answer,
        the 403 "this invite is for a different email address", and nothing changes.
        The session's email claim is not consulted.
      parameters:
        - $ref: "#/components/parameters/InviteTokenPath"
      responses:
        "204":
          description: Invite accepted; membership created. Empty body.
        "401":
          $ref: "#/components/responses/JsonUnauthorized"
        "403":
          description: JSON error "this invite is for a different email address".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: JSON error "invite not found".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: JSON error "invite is <status>".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}:
    parameters:
      - $ref: "#/components/parameters/TeamIdPath"
    get:
      operationId: getTeam
      tags: [teams]
      summary: One team plus its members.
      description: >
        Membership required. `members` is the raw result of ListTeamMembers with its error
        discarded, ordered by joined_at ASC, and is `[]` whenever the list is empty or the
        query failed (PAC-28).
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Team detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamDetail" }
        "400":
          description: JSON error "invalid team id".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "404":
          description: >
            JSON error "not found". Reachable only in a race: the membership read
            (requireMember) and the team read (storage.GetTeam) are two separate statements
            with no transaction (backend/api/handlers_teams.go getTeam), and a team_members
            row cannot outlive its team (team_members.team_id REFERENCES teams ON DELETE
            CASCADE, migration 013_teams.up.sql). So the 404 is answered exactly when the team
            is deleted (deleteTeam, or the cascade from its creator's account) after the
            membership read succeeded and before the team read; a team that is already gone
            when the request arrives is the 403. Resolved by PAC-71 at stage 2 (this
            operation is touched for its 401); the plan owes a seam test that deletes the
            team between the two reads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: renameTeam
      tags: [teams]
      summary: Rename a team. Owner only.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: >
            The re-read team. Never `null`: since PAC-26 (API-032) a failed re-read is
            the 500 `internal error` below instead of a 200 whose body is the JSON
            literal `null`. The rename has committed when that 500 is sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: JSON error "invalid team id" or "name is required".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamNameRequest" }
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team. Owner only.
      description: >
        Cascades to team_members, team_invites, no_meeting_zones and
        manager_team_member_assignments via FK ON DELETE CASCADE.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "204":
          description: Deleted. Empty body.
        "400":
          description: JSON error "invalid team id".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/members/invite:
    post:
      operationId: inviteTeamMember
      tags: [teams]
      summary: Create a 7-day team invite and email it. Owner only.
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteEmailRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "201":
          description: >
            The created invite INCLUDING its raw `token`, so the owner can share the link
            out of band. expires_at is now + 7 days. Email delivery is fire-and-forget and
            silently skipped when SMTP_HOST/SMTP_FROM are unset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamInvite" }
        "400":
          description: JSON error "invalid team id" or "email is required".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: JSON error "email must be a valid email address".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a member by user id. Owner, or the member themselves; never the last owner.
      description: >
        An owner of the team may remove anyone; any caller may remove themselves. A
        removal that would leave the team with zero owners is refused with 422 and
        changes nothing (PAC-25, API-023). Check order, fixed so that a non-owner cannot
        learn who the owner is from the answer: 400 malformed ids; then, when the caller
        is not the target, 403 unless the caller is an owner; then 422 if the target is
        an owner and no other owner of the team would remain; then the removal, 204. The
        guard counts owners ("would leave zero owners", PAC-25 D-4), it does not refuse
        every owner: in a team with two owners either may leave, and the second to try
        is refused. No interleaving of concurrent removals may leave the team with zero
        owners (PAC-25 D-6). A sole owner who is also the only member is refused too;
        deleting the team (DELETE /api/teams/{id}) stays the way to be rid of it (PAC-25
        D-5). The manager-domain DELETE /api/manager/team/members/{email} keeps its own,
        role-based rule (it refuses removing any owner) with the same 422 wording (PAC-25
        D-3).
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - name: userId
          in: path
          required: true
          description: The Paceday user id (UUID) of the member to remove.
          schema: { type: string, format: uuid }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "204":
          description: Removed (idempotent — removing a non-member also returns 204). Empty body.
        "400":
          description: JSON error "invalid team id" or "invalid user id".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: >
            JSON error "the team owner cannot be removed" (the manager-domain wording).
            The target is an owner of the team and removing them would leave the team
            with no owner. Evaluated after the 403 check, so a caller who is not an owner
            never receives it (naming someone else is 403; naming themselves, they are
            not an owner). Nothing is written: the membership and its role are unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: "the team owner cannot be removed" }
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/no-meeting-zones:
    parameters:
      - $ref: "#/components/parameters/TeamIdPath"
    post:
      operationId: createNoMeetingZone
      tags: [teams]
      summary: Create a recurring weekly no-meeting zone. Owner only.
      description: >
        The WIRE weekday convention is Monday=1 .. Sunday=7. Storage uses Go's
        Sunday=0 .. Saturday=6; the handler converts 7 -> 0 on write and 0 -> 7 on read
        (TestNoMeetingZone_ValidatesAndConvertsWeekdayAtBoundary asserts both halves).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoMeetingZoneRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "201":
          description: Created zone, dayOfWeek already converted back to the 1..7 wire convention.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoMeetingZone" }
        "400":
          description: JSON error "invalid team id" or "invalid JSON".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "422":
          description: >
            JSON error. "dayOfWeek must be between 1 and 7" (note: 0 is rejected, so an
            omitted dayOfWeek always fails); "startTime and endTime are required";
            "startTime must be HH:MM"; "endTime must be HH:MM";
            "startTime must be before endTime" (equal times are rejected).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      operationId: listNoMeetingZones
      tags: [teams]
      summary: All no-meeting zones for a team. Membership required.
      description: >
        Bare JSON array, always present (never null), ordered by the STORED day_of_week
        then start_time — which means Sunday sorts FIRST because it is stored as 0, even
        though it is emitted as dayOfWeek 7.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Zones.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NoMeetingZone" }
        "400":
          description: JSON error "invalid team id".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/no-meeting-zones/{zoneId}:
    parameters:
      - $ref: "#/components/parameters/TeamIdPath"
      - name: zoneId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateNoMeetingZone
      tags: [teams]
      summary: Replace a no-meeting zone. Owner only.
      description: >
        PATCH by name, PUT by behaviour: every field is taken from the body with no merge
        against the stored row, so an omitted dayOfWeek becomes 0 and fails validation with
        422. The update is scoped by BOTH zone id and team id, so a zone belonging to
        another team returns 404. Ownership is checked before the zoneId is even parsed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoMeetingZoneRequest" }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Updated zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoMeetingZone" }
        "400":
          description: JSON error "invalid team id", "invalid zone id" or "invalid JSON".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "404":
          description: JSON error "zone not found".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: JSON error — same validation messages as createNoMeetingZone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteNoMeetingZone
      tags: [teams]
      summary: Delete a no-meeting zone. Owner only.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "204":
          description: Deleted (idempotent — deleting an unknown zone also returns 204). Empty body.
        "400":
          description: JSON error "invalid team id" or "invalid zone id".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/availability:
    get:
      operationId: getTeamAvailability
      tags: [teams]
      summary: Slots on one day where every team member is free.
      description: >
        Membership required. The engine searches a fixed 09:00-18:00 UTC window on `date`,
        steps the cursor in 15-minute increments, treats no-meeting zones and busy calendar
        events as hard blocks, and scores each slot 0-100 by how few members' focus blocks
        it disrupts. A member whose calendar token is missing or whose calendar call fails
        contributes no busy intervals and is silently treated as fully free. `slots` is
        always an array, never null.
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - name: date
          in: query
          required: true
          description: Day to search, YYYY-MM-DD, interpreted in UTC. Missing or malformed yields 400.
          schema: { type: string, format: date }
        - name: duration
          in: query
          required: false
          description: Slot length in minutes. Defaults to 60. Must be 1..1440.
          schema: { type: integer, minimum: 1, maximum: 1440, default: 60 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Candidate slots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSlotList" }
        "400":
          description: >
            JSON error "invalid team id", "date must be YYYY-MM-DD", or
            "duration must be a positive integer (minutes)".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/teams/{id}/analytics:
    get:
      operationId: getFormalTeamAnalytics
      tags: [teams]
      summary: Aggregate meeting/focus minutes across a formal team for one week.
      description: >
        Membership required. Unlike GET /api/manager/analytics this reads the
        analytics_weeks table directly per team member, with no consent check and no
        FreeBusy fallback. Averages divide by the member count (or by 1 when the team is
        empty) using integer division.
      parameters:
        - $ref: "#/components/parameters/TeamIdPath"
        - name: date
          in: query
          required: false
          description: >
            Any date in the target week, YYYY-MM-DD. Snapped to that week's Monday in the
            parsed value's location (UTC). Defaults to the current local week's Monday.
          schema: { type: string, format: date }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        "200":
          description: Team analytics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamAnalytics" }
        "400":
          description: JSON error "invalid team id" or "date must be YYYY-MM-DD".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/JsonForbidden"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  parameters:
    RequiredTeamIdQuery:
      name: team_id
      in: query
      required: true
      description: >
        Formal team UUID. Required on this route: a missing or whitespace-only value is
        400 "team_id is required".
      schema: { type: string, format: uuid }

    OptionalTeamIdQuery:
      name: team_id
      in: query
      required: false
      description: >
        Formal team UUID. Optional on this route. When ABSENT the handler operates on the
        manager's global (un-scoped) roster and performs NO authorization check beyond
        JWT. When present it must parse as a UUID and the caller must be a member (reads)
        or the owner (writes) of that team.
      schema: { type: string, format: uuid }

    TeamIdPath:
      name: id
      in: path
      required: true
      description: Formal team UUID.
      schema: { type: string, format: uuid }

    InviteTokenPath:
      name: token
      in: path
      required: true
      description: >
        Opaque invite token — a UUID string generated by CreateTeamInvite. Not validated
        as a UUID by the handler; any string is looked up verbatim.
      schema: { type: string }

    MemberEmailPath:
      name: email
      in: path
      required: true
      description: >
        The roster member's email address, percent-encoded in the path (the `@` MUST be
        sent as %40 — chi splits on `/` only, but the frontend and the Go tests both use
        encodeURIComponent/%40 form). The handler applies url.PathUnescape to the raw chi
        param and falls back to the raw value if unescaping fails. Storage lowercases and
        trims before matching, so lookup is case-insensitive even though this path segment
        is not normalized by the handler itself.
      schema: { type: string, format: email }
      examples:
        encoded:
          value: "member%40example.com"

  responses:
    JsonError:
      description: JSON error envelope from writeError.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    JsonForbidden:
      description: >
        JSON error "forbidden". Emitted when the caller is not a member of `team_id`, when
        the route requires ownership and the caller's role is not "owner", AND when the
        team simply does not exist — the membership lookup error is not distinguished from
        a role mismatch.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    JsonUnauthorized:
      description: >
        JSON error "unauthorized" from the handler's own uuid.Nil check. In production
        this is shadowed by the requireAuth middleware, which emits its own
        `{"error":"unauthorized"}` via http.Error with a Content-Type of application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    ServerError:
      description: >
        A server-side failure. JSON error envelope (application/json) with a fixed,
        server-chosen message: "internal error" on the /api/teams routes, "internal error"
        or "db error" on the /api/manager routes. Never the storage or engine error text,
        which is written to the server log and Sentry only (PAC-21). Replaces
        PlainTextServerError, the text/plain response these routes documented before
        PAC-21 was finished.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      description: The shared error envelope produced by writeError.
      properties:
        error: { type: string }
      required: [error]
      additionalProperties: false

    Cadence:
      type: string
      description: 1:1 cadence. "none" disables gap detection for that member.
      enum: [weekly, biweekly, monthly, custom, none]

    ManagerMemberSource:
      type: string
      description: >
        "auto" = created by calendar detection, "manual" = created by an explicit add,
        "formal" = SYNTHETIC, returned only by getManagerRoster for a formal team_members
        row that has no manager assignment yet. "formal" is never persisted (the
        manager_team_members CHECK constraint permits only auto/manual).
      enum: [auto, manual, formal]

    ManagerProfileSummary:
      type: object
      properties:
        is_manager: { type: boolean }
        detected_at:
          type: [string, "null"]
          format: date-time
          description: RFC3339 UTC timestamp of the last successful detection, or null.
        team_member_count:
          type: integer
          description: >
            COUNT(*) over manager_team_members for this manager — the GLOBAL roster size,
            not the size of any one team. The query's error is discarded, so a failed count
            is reported as 0.
      required: [is_manager, detected_at, team_member_count]
      additionalProperties: false

    ManagerProfileUpdate:
      type: object
      properties:
        is_manager: { type: boolean }
      required: [is_manager]
      additionalProperties: true
      description: >
        Unknown fields are ignored (the decoder does not call DisallowUnknownFields here).
        A missing is_manager decodes to false and will clear the flag.

    UserProfileGoStruct:
      type: object
      description: >
        storage.UserProfile with explicit snake_case json tags (PAC-26, API-030); the keys
        match the user_profiles columns. The schema name is kept from before PAC-26, when
        the struct had no tags and the keys were the Go field names (`UserID`,
        `IsManager`, `DetectedAt`, `AnalyticsSharedWithManager`, `UpdatedAt`).
      properties:
        user_id: { type: string, format: uuid }
        is_manager: { type: boolean }
        detected_at:
          type: [string, "null"]
          format: date-time
        analytics_shared_with_manager:
          type: boolean
          description: Member-side consent flag, defaulting to true. No endpoint in this domain sets it.
        updated_at:
          type: string
          format: date-time
          description: The value read BEFORE the upsert, not the newly written now().
      required: [user_id, is_manager, detected_at, analytics_shared_with_manager, updated_at]
      additionalProperties: false

    ManagerTeamMemberGoStruct:
      type: object
      description: >
        storage.ManagerTeamMember with explicit snake_case json tags (PAC-26, API-030); the
        keys match the manager_team_members columns. Returned by addManagerTeamMember (201)
        and patchManagerTeamMember (200), both read back from storage after the write. The
        schema name is kept from before PAC-26, when the struct had no tags and the keys
        were the Go field names (`ID`, `ManagerUserID`, `MemberEmail`, ...). Note the key
        is `member_email` here but `email` on ManagerRosterMember: this is the stored row,
        the roster is a view.
      properties:
        id:
          type: string
          format: uuid
          description: >
            The stored row id. Since PAC-26 (API-031) never the zero UUID on the 201 add
            response.
        manager_user_id: { type: string, format: uuid }
        member_email: { type: string, format: email }
        member_user_id:
          type: [string, "null"]
          format: uuid
          description: Set when the email matches a Paceday user; null for external members.
        display_name: { type: string }
        source: { $ref: "#/components/schemas/ManagerMemberSource" }
        cadence: { $ref: "#/components/schemas/Cadence" }
        cadence_custom_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
        last_one_on_one_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
          description: Stored value; since PAC-26 (API-031) never "0001-01-01T00:00:00Z".
        updated_at:
          type: string
          format: date-time
          description: Stored value; since PAC-26 (API-031) never "0001-01-01T00:00:00Z".
      required:
        [id, manager_user_id, member_email, member_user_id, display_name, source, cadence,
         cadence_custom_days, last_one_on_one_at, created_at, updated_at]
      additionalProperties: false

    AddManagerMemberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            Lowercased and trimmed, then validated with net/mail.ParseAddress; the parsed
            address must equal the normalized input, so display-name forms like
            "A <a@b.com>" are rejected.
        display_name:
          type: string
          description: Trimmed. When blank, defaults to the local part of the email.
        cadence:
          allOf: [{ $ref: "#/components/schemas/Cadence" }]
          description: Lowercased and trimmed. Defaults to "none" when omitted or empty.
        cadence_custom_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: Required iff cadence == "custom"; must be absent/null otherwise.
      required: [email]
      additionalProperties: true

    PatchManagerMemberRequest:
      type: object
      description: >
        All fields optional. Present-but-null is indistinguishable from absent for
        cadence_custom_days (both decode to a nil *int and preserve the stored value).
      properties:
        display_name: { type: [string, "null"] }
        cadence: { $ref: "#/components/schemas/Cadence" }
        cadence_custom_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
      additionalProperties: true

    ScanCandidate:
      type: object
      properties:
        email: { type: string, format: email }
        display_name:
          type: string
          description: >
            Taken from the calendar attendee's displayName; can be the empty string when
            the provider supplied none.
        already_assigned:
          type: boolean
          description: True when this email already has an assignment on the selected team.
      required: [email, display_name, already_assigned]
      additionalProperties: false

    ScanPreview:
      type: object
      properties:
        team_id: { type: string, format: uuid }
        scanned_at:
          type: string
          format: date-time
          description: RFC3339 UTC, set by the engine at the start of the scan.
        detected:
          type: integer
          minimum: 0
          description: Total candidates returned by the scan (== candidates.length).
        eligible:
          type: integer
          minimum: 0
          description: Candidates not already assigned to this team.
        assigned:
          type: integer
          const: 0
          description: Always 0. Preview assigns nothing; see POST /api/manager/detect/confirm.
        skipped:
          type: integer
          minimum: 0
          description: detected - eligible, i.e. candidates already assigned to this team.
        candidates:
          type: array
          description: Always an array (the engine initialises it to an empty slice). Sorted by email ascending.
          items: { $ref: "#/components/schemas/ScanCandidate" }
      required: [team_id, scanned_at, detected, eligible, assigned, skipped, candidates]
      additionalProperties: false

    ScanConfirmRequest:
      type: object
      properties:
        emails:
          type: array
          description: >
            Required and non-null; an empty array is legal. Each entry is lowercased,
            trimmed and validated. Decoded with DisallowUnknownFields.
          items: { type: string, format: email }
      required: [emails]
      additionalProperties: false

    ScanConfirmation:
      type: object
      properties:
        team_id: { type: string, format: uuid }
        assigned:
          type: integer
          minimum: 0
          description: Assignments newly created by THIS call.
        skipped:
          type: integer
          minimum: 0
          description: >
            Counts blank entries, duplicates within this request, emails with no global
            manager_team_members identity, and emails already assigned to this team.
        total:
          type: integer
          minimum: 0
          description: Total assignments for this manager+team after the transaction commits.
      required: [team_id, assigned, skipped, total]
      additionalProperties: false

    MemberWeekStats:
      type: object
      description: >
        engine.MemberWeekStats. When data_available is false the three minute counters are
        all 0 — callers must branch on data_available rather than treating 0 as measured.
        For a Paceday member, data_available is also false unless the caller owns a team the
        member belongs to (PAC-60); see getManagerAnalytics.
      properties:
        focus_minutes:
          type: integer
          description: Always 0 for an external (non-Paceday) member; FreeBusy yields no focus signal.
        meeting_minutes: { type: integer }
        free_minutes:
          type: integer
          description: >
            For an external member, 2400 (5 days x 8h) minus busy minutes, floored at 0.
            For a Paceday member, the stored analytics_weeks value.
        data_available: { type: boolean }
      required: [focus_minutes, meeting_minutes, free_minutes, data_available]
      additionalProperties: false

    ManagerRosterMember:
      type: object
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        source: { $ref: "#/components/schemas/ManagerMemberSource" }
        cadence: { $ref: "#/components/schemas/Cadence" }
        cadence_custom_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
        last_one_on_one_at:
          type: [string, "null"]
          format: date-time
        is_paceday_user:
          type: boolean
          description: True iff member_user_id resolved to a Paceday user row.
        this_week:
          allOf: [{ $ref: "#/components/schemas/MemberWeekStats" }]
          description: >
            Never null — the handler substitutes a zero-valued MemberWeekStats when the
            engine returns nil or errors (the engine error is discarded).
        last_week:
          allOf: [{ $ref: "#/components/schemas/MemberWeekStats" }]
          description: Same nil-substitution as this_week; the week 7 days before `week`.
        focus_trend_pct:
          type: number
          description: >
            engine.TrendPct(this_week.focus, last_week.focus). Clamped to [-200, 200],
            rounded to one decimal. Returns exactly 200 when prior is 0 and current is
            non-zero, and 0 when both are 0. Never NaN or Inf.
          minimum: -200
          maximum: 200
      required:
        [email, display_name, source, cadence, cadence_custom_days, last_one_on_one_at,
         is_paceday_user, this_week, last_week, focus_trend_pct]
      additionalProperties: false

    ManagerRoster:
      type: object
      properties:
        team_id:
          type: string
          format: uuid
          description: >
            Echo of the requested team_id. The frontend treats a mismatch as a stale
            response and discards it.
        members:
          type: array
          items: { $ref: "#/components/schemas/ManagerRosterMember" }
      required: [team_id, members]
      additionalProperties: false

    CadenceGap:
      type: object
      description: engine.CadenceGap.
      properties:
        member_email: { type: string, format: email }
        display_name: { type: string }
        cadence: { $ref: "#/components/schemas/Cadence" }
        last_one_on_one_at:
          type: [string, "null"]
          format: date-time
        next_expected_by:
          type: string
          format: date-time
          description: >
            last_one_on_one_at plus the cadence interval; now when the member was never met.
            Monthly uses calendar-month arithmetic; the rest use day addition.
        days_overdue:
          type: integer
          minimum: 0
          description: >
            0 when the next 1:1 is still upcoming within the 7-day warning window; positive
            when already past due. Never negative — upcoming-ness is not encoded here.
      required: [member_email, display_name, cadence, last_one_on_one_at, next_expected_by, days_overdue]
      additionalProperties: false

    CadenceGapList:
      type: object
      properties:
        gaps:
          type: array
          items: { $ref: "#/components/schemas/CadenceGap" }
      required: [gaps]
      additionalProperties: false

    ManagerAnalyticsWeek:
      type: object
      properties:
        week_start:
          type: string
          format: date
          description: YYYY-MM-DD, the Monday of this bucket.
        focus_minutes: { type: integer }
        meeting_minutes: { type: integer }
        free_minutes: { type: integer }
        data_available:
          type: boolean
          description: False when the member's week could not be measured (see degraded-analytics invariant).
      required: [week_start, focus_minutes, meeting_minutes, free_minutes, data_available]
      additionalProperties: false

    ManagerAnalyticsMember:
      type: object
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        is_paceday_user:
          type: boolean
          description: >
            True iff the member's member_user_id resolved to a Paceday user row; the same
            value ManagerRosterMember.is_paceday_user carries for this member (PAC-34).
        data_available:
          type: boolean
          description: >
            True iff at least one entry of `weeks` has data_available=true (PAC-34). Derived
            from the buckets of this response, never read or cached separately, so it cannot
            disagree with them. False means no bucket is measured (degraded FreeBusy, no
            analytics_weeks rows, consent withheld, or the PAC-60 visibility gate): the
            member's minutes must be shown as "no data", not as zeroes. True does NOT mean
            every bucket is measured; each bucket's own data_available still decides how
            that bucket is drawn.
        weeks:
          type: array
          minItems: 12
          maxItems: 12
          description: Exactly 12 buckets, newest first.
          items: { $ref: "#/components/schemas/ManagerAnalyticsWeek" }
      required: [email, display_name, is_paceday_user, data_available, weeks]
      additionalProperties: false

    ManagerAnalytics:
      type: object
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/ManagerAnalyticsMember" }
      required: [members]
      additionalProperties: false

    ScheduleOneOnOneRequest:
      type: object
      properties:
        suggested_date:
          type: string
          format: date
          description: >
            YYYY-MM-DD. Optional; when present it is appended to the prefill URL as `date`.
            An empty string is treated as absent.
      additionalProperties: true

    PrefillUrlResponse:
      type: object
      properties:
        prefill_url:
          type: string
          description: Relative URL beginning with "/app?".
      required: [prefill_url]
      additionalProperties: false

    TeamNameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed before storage. No maximum length is enforced by the backend.
      required: [name]
      additionalProperties: true

    InviteEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Lowercased, trimmed and validated with net/mail.ParseAddress.
      required: [email]
      additionalProperties: true

    Team:
      type: object
      description: storage.Team. Note the camelCase json tags — unlike the manager domain's snake_case.
      properties:
        id: { type: string, format: uuid }
        orgId:
          type: string
          format: uuid
          description: Omitted entirely when the team has no organization (omitempty on a *uuid.UUID).
        name: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
      required: [id, name, createdBy, createdAt]
      additionalProperties: false

    TeamMember:
      type: object
      description: storage.TeamMember, as returned inside TeamDetail.
      properties:
        teamId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role:
          type: string
          enum: [owner, member]
        joinedAt: { type: string, format: date-time }
        name:
          type: string
          description: >
            Joined from users.name via COALESCE(...,''), and tagged omitempty — so a user
            with no name causes the key to be OMITTED, not sent as "".
        email:
          type: string
          format: email
          description: Joined from users.email, also omitempty.
      required: [teamId, userId, role, joinedAt]
      additionalProperties: false

    TeamDetail:
      type: object
      properties:
        team: { $ref: "#/components/schemas/Team" }
        members:
          type: array
          description: "`[]` when the team has no members or the query failed."
          items: { $ref: "#/components/schemas/TeamMember" }
      required: [team, members]
      additionalProperties: false

    TeamInvite:
      type: object
      description: storage.TeamInvite, returned in full (token included) by inviteTeamMember.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        inviteeEmail: { type: string, format: email }
        invitedBy: { type: string, format: uuid }
        token:
          type: string
          description: A freshly generated UUID string used as the invite link path segment.
        status:
          type: string
          enum: [pending, accepted, declined, expired]
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: createdAt + 7 days (computed in Go, not by the database).
      required: [id, teamId, inviteeEmail, invitedBy, token, status, createdAt, expiresAt]
      additionalProperties: false

    TeamInvitePreview:
      type: object
      description: >
        A narrow projection of a pending invite, NOT a TeamInvite (no id, token, status,
        invitedBy or createdAt). The three original keys are camelCase and stay so for
        existing readers; the three keys added by PAC-34 are snake_case, the spelling the
        PAC-34 acceptance criteria name and the web normalizer reads (see
        contracts/features/PAC-34.md section 3 for the rejected alternatives). team_id and
        expires_at come from the invite row itself, so they are always present. The team
        and inviter rows are read separately and a failed read is not an error: teamName
        and inviterName become "" and inviter_email becomes null.
      properties:
        teamName:
          type: string
          description: Empty string when the team row could not be read.
        inviterName:
          type: string
          description: >
            The inviter's DISPLAY NAME, not their email. Empty string when the user row
            could not be read.
        email:
          type: string
          format: email
          description: The invitee email the invite was issued to.
        team_id:
          type: string
          format: uuid
          description: team_invites.team_id of this invite (PAC-34). Never empty.
        expires_at:
          type: string
          format: date-time
          description: >
            team_invites.expires_at, RFC 3339 (PAC-34): createdAt + 7 days, computed in Go
            when the invite was created. A 200 is returned only while the invite is pending
            and ExpireOldInvites runs first, so a client normally sees a future instant; a
            client must still treat a past value as expired rather than assume otherwise.
        inviter_email:
          type: [string, "null"]
          format: email
          description: >
            The inviter's account email, users.email of team_invites.invited_by (PAC-34).
            null, never "", when the inviter's user row could not be read. invited_by is
            NOT NULL with ON DELETE CASCADE, so a deleted inviter removes the invite (404),
            and null only arises from a failed read.
      required: [teamName, inviterName, email, team_id, expires_at, inviter_email]
      additionalProperties: false

    NoMeetingZoneRequest:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Monday=1 .. Sunday=7. 0 is rejected, so this field is effectively required.
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: HH:MM, 24-hour, parsed with Go layout "15:04". Trimmed before use.
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: HH:MM. Must be strictly after startTime.
        label:
          type: string
          description: Trimmed. Optional; the column defaults to an empty string.
      required: [dayOfWeek, startTime, endTime]
      additionalProperties: true

    NoMeetingZone:
      type: object
      description: storage.NoMeetingZone after the handler's storage->wire weekday conversion.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Monday=1 .. Sunday=7 on the wire (0 in the database).
        startTime:
          type: string
          description: Rendered by the Postgres driver from a TIME column.
          x-uncertain: >
            Request format is strictly HH:MM, but the response is the driver's text form of
            a TIME column, which is "HH:MM:SS" (e.g. "09:00:00"). No test asserts the
            response string, so the exact shape is unconfirmed. Clients must not assume
            request and response formats are identical.
        endTime:
          type: string
          x-uncertain: Same TIME-column formatting question as startTime.
        label: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, teamId, dayOfWeek, startTime, endTime, label, createdAt]
      additionalProperties: false

    TeamSlot:
      type: object
      description: engine.TeamSlot.
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        quality_score:
          type: integer
          minimum: 0
          maximum: 100
          description: 100 - (members_with_disrupted_focus / total_members) * 100, integer division.
      required: [start, end, quality_score]
      additionalProperties: false

    TeamSlotList:
      type: object
      properties:
        slots:
          type: array
          items: { $ref: "#/components/schemas/TeamSlot" }
      required: [slots]
      additionalProperties: false

    MemberAnalyticsSummary:
      type: object
      description: engine.MemberAnalyticsSummary.
      properties:
        user_id: { type: string, format: uuid }
        name:
          type: string
          description: >
            The user's display name, which may be "" (COALESCE default). No email is
            included, which is why the frontend has to match breakdown rows by name or
            positional index.
        meeting_minutes: { type: integer }
        focus_minutes: { type: integer }
        focus_score: { type: integer }
      required: [user_id, name, meeting_minutes, focus_minutes, focus_score]
      additionalProperties: false

    TeamAnalytics:
      type: object
      description: engine.TeamAnalytics.
      properties:
        avg_meeting_minutes:
          type: integer
          description: Integer division by member count (or by 1 for an empty team).
        avg_focus_minutes: { type: integer }
        member_breakdown:
          type: array
          description: "`[]` when the team has no members."
          items: { $ref: "#/components/schemas/MemberAnalyticsSummary" }
      required: [avg_meeting_minutes, avg_focus_minutes, member_breakdown]
      additionalProperties: false
