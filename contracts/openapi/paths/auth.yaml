# Domain: auth
# Extracted from backend/api/{routes,middleware,handlers_auth,handlers_sso,handlers_me,
# handlers_health,integration_availability,handlers_microsoft_auth}.go and
# backend/auth/*.go + backend/storage/{users,orgs,sso_providers}.go.
#
# Auth transport note (backend/api/middleware.go requireAuth):
#   since PAC-39 (#215, API-008) an `Authorization: Bearer <jwt>` header wins:
#   when the header has the `Bearer ` prefix its token is the ONLY credential
#   considered (an invalid one is a 401, never retried with the cookie). Only a
#   request with no `Bearer` header (none, or another scheme) falls back to the
#   `auth_token` cookie. Both work.
#   Protected operations below carry no `security:` key and therefore inherit the
#   global requirement (`bearerAuth` OR `cookieAuth`); OpenAPI alternatives cannot
#   express the Bearer-over-cookie order, so it lives in the scheme descriptions.
#   `cookieAuth` is the transport the shipped frontend actually uses (it never
#   sets an Authorization header).
paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [auth]
      summary: Liveness probe
      description: |
        Static JSON. Never touches the database. Source: handlers_health.go —
        the version string "0.1.0" is hardcoded in the handler.
      security: []
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/google:
    get:
      operationId: startGoogleOAuth
      tags: [auth]
      summary: Begin Google OAuth
      description: |
        Sets an httpOnly `oauth_state` cookie (MaxAge 300, SameSite=Lax) and
        redirects to Google's consent screen. Never returns a body.
        Since PAC-35 (API-064) a valid `login_hint` is forwarded to Google so the
        account the user typed is preselected. Google still shows its consent
        screen every time (`oauth2.ApprovalForce`); the hint chooses the
        account, it does not skip the screen.
      security: []
      parameters:
        - $ref: '#/components/parameters/LoginHint'
      responses:
        '302':
          description: |
            Redirect to Google's authorization endpoint. Always a 302, whatever
            `login_hint` holds: an invalid hint is dropped, never a 400.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: |
                auth.GetAuthURL(oauthConfig, state), plus `login_hint=<hint>`
                (URL-encoded) when the request's `login_hint` passed the
                LoginHint rule. No other query parameter of this request is
                copied into it.
            Set-Cookie:
              schema:
                type: string
              description: 'oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax'

  /api/auth/callback:
    get:
      operationId: googleOAuthCallback
      tags: [auth]
      summary: Google OAuth callback
      description: |
        Validates the `oauth_state` cookie against the `state` query param,
        exchanges the code, upserts the user, stores the OAuth token, associates
        the org, issues the `auth_token` JWT cookie, then redirects to
        `<FRONTEND_URL>/auth/callback`.
        Since PAC-35 (API-011) the redirect to `/auth/callback` happens only when
        the session cookie was actually set. If the session cannot be issued
        (empty signing secret, or token generation fails) the user is sent to
        the sign-in failure state instead; see the `302` response.

        Since PAC-67 a successful Google sign-in is also the Google RECONNECT
        (spec PAC-67 AC-12, AC-24): storing the new token ends any recorded
        loss of the Google connection for the user it resolves to, so
        `getAuthStatus` (Google calendar provider) and the `google_meet` row of
        `listConferenceProviders` report connected again, and a later loss of
        the new credential is a new loss with its own `connection_lost`
        activity entry. The user is still resolved by the Google account's
        email, exactly as before (spec PAC-67 OQ-10: sign-in matching is not
        changed). No response of this operation changes.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: |
            One of exactly two destinations (PAC-35, API-011):
            - Success: the `auth_token` cookie is set and Location is
              `<FRONTEND_URL>/auth/callback` (no query string, unlike the
              Microsoft/SSO callbacks).
            - Session not issued (signing secret empty, or token generation
              failed) after the user and token were saved: NO `auth_token`
              cookie is set or expired, and Location is the sign-in failure
              state `<FRONTEND_URL>/?error=auth_failed`. Never `/auth/callback`.
            The user row and stored Google token written before that point are
            kept; nothing is deleted on the failure path. The cause is written
            to the server log and Sentry only; the Location carries no cause.
          headers:
            Location:
              schema:
                type: string
              description: |
                `<FRONTEND_URL>/auth/callback` on success;
                `<FRONTEND_URL>/?error=auth_failed` when the session could not be issued.
            Set-Cookie:
              schema:
                type: string
              description: |
                On success: auth_token=<HS256 JWT>; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax.
                On the failure redirect: no `auth_token` cookie at all.
        '400':
          description: Missing or mismatched `oauth_state` cookie ("invalid state").
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: >-
            Token exchange, userinfo fetch, user upsert or token save failed. Body:
            `{"error":"internal error"}`. The detail is written to the server log and Sentry
            only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/microsoft:
    get:
      operationId: startMicrosoftOAuth
      tags: [auth]
      summary: Begin Microsoft OAuth
      description: |
        Sets an httpOnly `ms_oauth_state` cookie and redirects to Microsoft.
        Configuration is read from env at request time (MICROSOFT_CLIENT_ID);
        if the client id is blank the route 503s.
        Since PAC-35 (API-064) a valid `login_hint` is forwarded to Microsoft.
      security: []
      parameters:
        - $ref: '#/components/parameters/LoginHint'
      responses:
        '302':
          description: |
            Redirect to Microsoft's authorization endpoint. An invalid
            `login_hint` is dropped, never a 400.
          headers:
            Location:
              schema: { type: string, format: uri }
              description: |
                auth.GetMicrosoftAuthURL(cfg, state), plus `login_hint=<hint>`
                (URL-encoded) when the request's `login_hint` passed the
                LoginHint rule. No other query parameter of this request is
                copied into it.
            Set-Cookie:
              schema: { type: string }
              description: 'ms_oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax'
        '503':
          description: '`MICROSOFT_CLIENT_ID` is unset — "Microsoft OAuth not configured".'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/microsoft/callback:
    get:
      operationId: microsoftOAuthCallback
      tags: [auth]
      summary: Microsoft OAuth callback
      description: |
        Validates `ms_oauth_state`, exchanges the code, fetches the Graph profile
        and upserts the user, then saves the Microsoft token on THAT USER'S OWN
        settings row (making Outlook their calendar provider), sets the session
        cookie and redirects. Since PAC-24 the profile fetch is required, not
        best-effort: without it there is no user to attach the credential to, so
        nothing is saved. Before PAC-24 the token was saved on the single shared
        settings row and the provider flipped for everyone.
        Since PAC-35 (API-011, API-012) three failures after a successful code
        exchange end on the app's sign-in failure state rather than on a JSON
        error page on the API origin: the Graph profile could not be read (or
        carried no email), the user could not be saved, or the session could
        not be issued. See the `302` response.

        Since PAC-67 this sign-in is also the Outlook RECONNECT, and what it
        stores changes in two ways; no response, status or Location changes.
        (1) When the code exchange returns an access token but NO refresh
        token, the user's stored refresh token is kept, never overwritten with
        an empty one, so a working connection is never erased by a reconnect
        (spec PAC-67 AC-11). With no refresh token stored before either, the
        result is a credential with no refresh token. It can never be renewed,
        so it is reported not connected both by `getAuthStatus` (as today) and,
        since PAC-67, by the `teams` row of `listConferenceProviders` (which
        before PAC-67 reported it connected and enabled); once its access token
        expires, Teams meeting creation with it answers the 400 "teams:
        connection lost — reconnect at /api/auth/microsoft" without recording a
        loss (contract challenge finding 5). (2) Storing the credential ends any recorded loss of
        the Outlook connection for the user it resolves to (AC-12, AC-24), so
        `getAuthStatus` (Outlook calendar provider) and the `teams` row of
        `listConferenceProviders` report connected again. The credential is
        still attached to the user matched by the Microsoft account's email,
        and every sign-in still sets that user's calendar provider to
        `outlook`, including a sign-in after `disconnectMicrosoft` (spec
        PAC-67 D-4, OQ-5, OQ-10: unchanged on purpose).
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: |
            One of exactly two destinations (PAC-35):
            - Success: Location `<FRONTEND_URL>/auth/callback?provider=outlook`,
              with the `auth_token` cookie set.
            - Sign-in failure state, Location `<FRONTEND_URL>/?error=auth_failed`,
              with NO `auth_token` cookie set or expired, when any of these
              happens after the code exchange succeeded:
              (a) the Graph profile could not be read, or carried no email
                  (nothing is saved; API-012, was a 502);
              (b) the user upsert failed (nothing is saved; API-012, was a 500
                  with `{"error":"save user failed"}`);
              (c) the session could not be issued (signing secret empty, or
                  token generation failed) after the user and the Microsoft
                  token were saved; they are kept (API-011).
            The cause is written to the server log and Sentry only; the
            Location carries no cause, provider name or detail.
            State mismatch, token exchange failure, token save failure and an
            unconfigured client are NOT redirects; they are the 400, 500 and
            503 below (spec PAC-35 D-1).
          headers:
            Location:
              schema: { type: string }
              description: |
                `<FRONTEND_URL>/auth/callback?provider=outlook` on success;
                `<FRONTEND_URL>/?error=auth_failed` on the failures (a)-(c).
            Set-Cookie:
              schema: { type: string }
              description: |
                On success: auth_token JWT for the upserted user. On the failure
                redirect: no `auth_token` cookie at all.
        '400':
          description: Missing or mismatched `ms_oauth_state` cookie ("invalid state").
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: >-
            Token exchange or token save failed. Body: `{"error":"internal error"}`. The
            detail is written to the server log and Sentry only (PAC-21). A failed user
            upsert is no longer a 500, and an unreadable Graph profile is no longer a 502:
            since PAC-35 both are the failure redirect under `302`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            `MICROSOFT_CLIENT_ID` is unset. Body: `{"error":"Microsoft OAuth not
            configured"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/microsoft/disconnect:
    post:
      operationId: disconnectMicrosoft
      tags: [auth]
      summary: Disconnect the caller's Outlook (Microsoft) credential (the session is kept)
      description: |
        New in PAC-67 (spec AC-13, AC-16, AC-17, D-3, D-5, D-8). Protected by
        requireAuth. Takes no request body (any body is ignored). Acts on the
        CALLER only; no other user's credential, settings or activity log is
        read or written.

        Effects, in this order. Steps 1 and 2 are ONE atomic change: either
        both happen or neither does (then the answer is the 500 below).
        1. The caller's stored Microsoft credential (access token, refresh
           token, expiry) is removed WHETHER OR NOT IT DECODES (a stored value
           that is not valid JSON, on which `LoadMicrosoftToken` fails, is
           removed like any other, answers `not_offered` and writes the entry
           of step 5; it is never a 500), and any recorded loss of it is
           cleared: a later Microsoft sign-in starts a fresh connection.
        2. When the caller's conferencing provider is `teams` it becomes
           `meet` (spec D-8); any other conferencing provider is unchanged.
        3. The caller's calendar provider is NOT changed (spec D-3): a caller
           on `outlook` stays on `outlook` and `getAuthStatus` reports
           `{connected: false, provider: "outlook"}` until they sign in with
           Microsoft again or choose another provider in settings.
        4. Nothing is sent to Microsoft. Microsoft offers no revocation of one
           application's grant for one user that Paceday can call with the
           user's own delegated token: deleting the delegated permission
           grant (`DELETE /oauth2PermissionGrants/{id}`) needs
           `DelegatedPermissionGrant.ReadWrite.All` and an administrator role
           for work or school accounts and is not supported for personal
           accounts, and the only per-user server call left
           (`revokeSignInSessions`) signs the user out of every application,
           which spec D-5 forbids (OQ-1, resolved in
           contracts/features/PAC-67.md §3). The answer therefore always
           carries `revocation: not_offered` when a credential was removed,
           and the client tells the user the grant can be removed from their
           Microsoft account (AC-17).
        5. One `provider_disconnected` activity entry is written for the
           caller, details `{"provider":"outlook","revocation":"not_offered"}`,
           after steps 1 and 2 have succeeded. The write is BEST-EFFORT, like
           every kind in the activity log (`storage.WriteAuditLog`): a failed
           insert is written to the server log and the 200 stands, because
           the credential is already removed; that disconnect then has no
           entry. No `revocation_unconfirmed` entry is written: nothing was
           attempted, so nothing failed (round-5 challenge NB-2).

        A caller with no stored Microsoft credential gets 200 with
        `revocation: nothing_stored`: step 2 still applies, nothing else
        changes, and no activity entry is written.

        After a 200 the `teams` row of `listConferenceProviders` reports
        `connected: false` with `enabled` omitted.

        Unlike `disconnectCalendar`, there is no 409: the operation applies to
        every caller whatever their calendar provider, and it does not touch
        the Google credential or the webcal link.
      responses:
        '200':
          description: |
            The Microsoft credential is gone (or there was none). The session
            is kept: no Set-Cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDisconnectResult'
        '401':
          description: No/invalid JWT (text/plain body carrying JSON text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: >-
            The caller's settings could not be read, or the atomic change of steps 1
            and 2 failed. NOTHING was changed: the credential is still stored, the
            conferencing provider is unchanged and no activity entry is written, so a
            retry is safe. A stored credential that does not decode is NOT this case
            (see step 1), and nothing that fails after steps 1 and 2 is a 500: a failed
            activity-entry write is logged only. Body: `{"error":"internal error"}`. The detail
            is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/detect:
    post:
      operationId: detectAuthProvider
      tags: [auth]
      summary: Detect which auth provider an email address should use
      description: |
        Rate limited to 20 requests per minute per client IP (fixed one-minute
        window per key, in-process map; expired buckets are swept at most once a
        minute). Since PAC-39 (#215, API-062) the key is the IP of the socket peer
        (`RemoteAddr` without its port). `X-Forwarded-For` is never read. A
        client-supplied `X-Real-IP` is ignored; `X-Real-IP` is used only when the
        socket peer is inside the operator's `TRUSTED_PROXIES` allowlist (empty
        by default, so no proxy is trusted) and holds a valid IP. Still open
        (API-062): the map is per process, so the effective limit is
        20/min x replicas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoDetectRequest'
      responses:
        '200':
          description: Detection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoDetectResponse'
        '400':
          description: Body is not JSON, or `email` is empty ("email required").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '"rate limit exceeded" — more than 20 detects in the current one-minute window from this client IP (socket peer, or X-Real-IP from a trusted proxy).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            The SSO provider lookup failed. Body: `{"error":"internal error"}`. The detail
            is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/sso/{domain}:
    get:
      operationId: startSsoLogin
      tags: [auth]
      summary: Begin OIDC SSO login for a configured domain
      description: |
        Looks up the SSO provider row for `{domain}`, builds the OIDC redirect
        URL as `os.Getenv("APP_URL") + "/api/auth/callback/oidc/" + domain`, sets
        an `sso_state` cookie of the form `<state>|<domain>`, and redirects.
        This is the destination `detectAuthProvider` names in `redirect_url`;
        the web app reaches it by resolving that path against the API origin and
        appending `?login_hint=<typed email>` (PAC-35, API-010).
        Since PAC-35 (API-064) a `login_hint` that passes the LoginHint rule AND
        whose domain is exactly `{domain}` (case-insensitive, no subdomains, the
        same test as the callback's PAC-45 check) is forwarded to the IdP. A hint
        at another domain is dropped, so this route never sends one
        organisation's IdP an address outside that organisation's domain.
        Unchanged by PAC-35 (spec D-5): the 404, 500 and 501 answers below.
        API-060 (SAML and incomplete OIDC rows accepted at create time) stays
        with PAC-22.
      security: []
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
          description: Email domain, e.g. "acme.com".
        - $ref: '#/components/parameters/LoginHint'
      responses:
        '302':
          description: |
            Redirect to the identity provider. Always a 302 for a usable OIDC
            row, whatever `login_hint` holds: an invalid or other-domain hint is
            dropped, never a 400.
          headers:
            Location:
              schema: { type: string, format: uri }
              description: |
                The IdP authorization URL (OIDCClient.AuthURL(state)), plus
                `login_hint=<hint>` (URL-encoded) when the hint passed the
                LoginHint rule and belongs to `{domain}`. No other query
                parameter of this request is copied into it.
            Set-Cookie:
              schema: { type: string }
              description: 'sso_state=<32 hex chars>|<domain>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax'
        '404':
          description: '"SSO not configured for this domain" — no provider row (also returned when the lookup errors).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            Issuer discovery failed. Body: `{"error":"internal error"}`. The detail is
            written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: '"SAML not yet supported" — the stored provider_type is "saml".'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/callback/oidc/{domain}:
    get:
      operationId: ssoOidcCallback
      tags: [auth]
      summary: OIDC SSO callback
      description: |
        Verifies `sso_state` (both the random half and the embedded domain),
        re-discovers the OIDC client, exchanges the code, checks that the
        asserted email belongs to `{domain}` (PAC-45), upserts the user with
        provider="sso", and issues the JWT cookie.
        Since PAC-35 (API-011) the redirect to `/auth/callback?provider=sso`
        happens only when the session cookie was actually set; otherwise the
        user goes to the sign-in failure state (see `302`).
        Inconsistent error encoding: the 404 and 500 use the JSON helpers while
        the 400s and the 403 use http.Error (text/plain).
      security: []
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: |
            One of exactly two destinations (PAC-35, API-011):
            - Success: the `auth_token` cookie is set and Location is
              `<FRONTEND_URL>/auth/callback?provider=sso`.
            - Session not issued (signing secret empty, or token generation
              failed) after the user was saved: NO `auth_token` cookie is set
              or expired, and Location is the sign-in failure state
              `<FRONTEND_URL>/?error=auth_failed`. The saved user row is kept.
            Every other failure stays a non-302 response below (spec PAC-35
            D-1).
          headers:
            Location:
              schema: { type: string }
              description: |
                `<FRONTEND_URL>/auth/callback?provider=sso` on success;
                `<FRONTEND_URL>/?error=auth_failed` when the session could not be issued.
            Set-Cookie:
              schema: { type: string }
              description: |
                On success: auth_token JWT cookie. On the failure redirect: no
                `auth_token` cookie at all.
        '400':
          description: '"missing state cookie", "invalid state", or "no email in OIDC token claims".'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: |
            "email domain does not match SSO provider domain": the IdP asserted
            an email whose domain is not exactly `{domain}` (PAC-45). No user is
            upserted and no session is issued. text/plain (http.Error).
            Documented by PAC-35: the response has existed since PAC-45 (#172)
            but was missing from this contract.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '404':
          description: '"SSO not configured for this domain" — JSON, unlike the other errors here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            OIDC setup, code exchange or user upsert failed. Body: `{"error":"internal
            error"}`. The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Calendar connection status for the current session
      description: |
        Protected by requireAuth (cookie `auth_token` or `Authorization: Bearer`).
        Reports the CALLER'S own calendar connection: it branches on the caller's
        `calendarProvider` and, on the outlook branch, reads the caller's own
        stored Microsoft credential.
        On an internal failure it does NOT error — it 200s with
        {connected:false, provider:"google", email:""}.

        Since PAC-67 `connected` means USABLE, not merely stored (spec PAC-67
        §3, AC-8, AC-12, AC-13, AC-21). A credential whose renewal the provider
        permanently refused (OAuth `invalid_grant` or equivalent) is kept
        (spec D-1) but is recorded as lost, and while that loss is recorded
        this operation reports `connected: false` for it. A temporary failure
        (network, timeout, provider 5xx) is never recorded as a loss and never
        turns this to false (AC-10). Per branch:
        - `outlook`: true when the caller holds a stored Microsoft credential
          with a refresh token AND no loss of it is recorded; false after
          `disconnectMicrosoft` (the credential is gone) and after a loss.
        - `google` (blank or any unrecognised provider): true when the caller
          holds a stored Google token row AND no loss of it is recorded.
        - `webcal`: unchanged.
        Only the caller's own credentials are consulted. A loss recorded while
        the credential was being used for someone else (a teammate's team
        availability request, a public booking page, a scheduled job) is the
        OWNER's: it changes the owner's answer here, never the requester's
        (spec D-12). The response shape is unchanged; no field is added.

        PAC-24 resolves API-009. Before it, this branched on the SINGLETON
        settings row's calendar_provider and returned that row's
        `calendar_email`, and `auth.LoadMicrosoftToken` took no user id at all
        (`backend/auth/microsoft_oauth.go:61`, `WHERE id = 1`) — so one user's
        Outlook address and connection state were reported to everybody, and
        only the google branch consulted the caller.
        The response shape is unchanged; what changes is whose state it
        describes. See `docs/specs/PAC-24.md` §2.5 for the wider problem the same
        singleton created on the write side, which is in PAC-24's scope but is
        not visible on this operation.
      responses:
        '200':
          description: Connection status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '401':
          description: |
            No/invalid JWT. Body is the literal JSON text `{"error":"unauthorized"}`
            but Content-Type is `text/plain; charset=utf-8` because http.Error
            overwrites the header the middleware just set.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'

  /api/auth/disconnect:
    delete:
      operationId: disconnectCalendar
      tags: [auth]
      summary: Disconnect the caller's Google calendar (the session is kept)
      description: |
        Never touches the session: no response of this operation sets or
        expires the `auth_token` cookie (PAC-35, API-061; before PAC-35 the
        204 expired it and so logged the user out).

        Branches on the caller's calendar provider exactly as `getAuthStatus`
        does (`calendarProvider` from the caller's own settings row; blank or
        any value other than `outlook` / `webcal` means Google; a caller with
        no settings row yet gets the default row, provider `google`, exactly as
        `getAuthStatus` creates it), so the server and the app classify every
        user the same way (spec PAC-35 D-8):
        - Google: deletes the caller's stored Google OAuth token row and answers
          204. As before, this also turns Google Meet to not connected for the
          caller (it depends on the same credential). A caller with no stored
          token gets 204 too.
        - `outlook` or `webcal`: deletes NOTHING (the stored Google token, if
          the caller holds one, the Microsoft credential and the webcal link
          are all kept) and answers 409 `CalendarDisconnectUnsupported`.
          Disconnect for these calendars is not implemented HERE (spec PAC-35
          OQ-5). Since PAC-67 the Microsoft credential has its own operation,
          `disconnectMicrosoft` (`POST /api/auth/microsoft/disconnect`); this
          operation's 409 for `outlook` and `webcal` is unchanged by it (spec
          PAC-67 OQ-3).
        - The settings row cannot be read (or created): deletes nothing and
          answers 500.
          The provider is never guessed as Google on this path, so a read
          failure cannot delete an Outlook or webcal user's Google token.
          (`getAuthStatus` still answers "google" on its own read failure;
          disconnect deliberately does not follow it there.)
      responses:
        '204':
          description: |
            The caller's calendar is Google and its stored token row is gone
            (or there was none). No body. No Set-Cookie.
        '401':
          description: No/invalid JWT (text/plain body carrying JSON text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '409':
          description: |
            The caller's calendar provider is `outlook` or `webcal`. Nothing was
            deleted and the session is kept. This is the only 409 this
            operation returns, so a client can tell "disconnect is not available
            for this kind of calendar" from every other failure by status
            alone; `provider` says which kind. A client must treat it as a
            failure, never as a success (spec PAC-35 D-8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDisconnectUnsupported'
        '500':
          description: >-
            The caller's settings could not be read, or the token delete failed. Nothing
            else is changed and the session is kept. Body: `{"error":"internal error"}`.
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The authenticated user
      description: |
        Since PAC-35 (API-065) the user's picture has one name in the
        current-user read: `avatarUrl`, the name the server already sends.
        Clients read it under that name; the server does not rename it.
        Scheduling-link and booking hosts carry the same stored value as
        `avatar_url` (`SchedulingLinkHost`, `PublicHost`), unchanged by PAC-35.
      responses:
        '200':
          description: The user row (with its org when one is associated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: |
            No/invalid JWT. Returned by requireAuth, or by the handler itself when
            the context user id is uuid.Nil. Body text is `{"error":"unauthorized"}`
            served as text/plain.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '404':
          description: |
            Valid JWT but no matching users row — body text is
            `{"error":"user not found"}` served as text/plain.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'

  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the session cookie
      description: |
        Expires the `auth_token` cookie. Note it is behind requireAuth, so logging
        out with an already-expired token returns 401 rather than succeeding
        (unchanged by PAC-35, spec section 5).
      responses:
        '204':
          description: |
            Logged out. No body (PAC-35, API-063; before PAC-35 this was a 200
            with an empty body and no Content-Type, which the strict web client
            would classify as "server unreachable").
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 'auth_token=; Path=/; Max-Age=-1; HttpOnly; SameSite=Lax'
        '401':
          description: No/invalid JWT.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'

  /api/integrations/availability:
    get:
      operationId: getIntegrationAvailability
      tags: [auth]
      summary: Which OAuth providers this server is configured to start
      description: |
        Public by design (routes.go comment) so the login screen can hide
        providers the server cannot start. Derived purely from environment
        variables; never returns credential values.
      security: []
      responses:
        '200':
          description: Availability snapshot — all six keys are always present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationAvailabilityResponse'

  /api/admin/sso:
    post:
      operationId: createSsoProvider
      tags: [auth]
      summary: Create or update the SSO provider for the caller's org domain
      description: |
        Upsert keyed on domain: a second POST for the same domain is the update
        (there is no PATCH/PUT). Since PAC-50 (spec docs/specs/PAC-50.md §4.2)
        every write passes this gate, in this order, before the provider store
        is touched; the first step that fails decides the response:

        1. Membership: the caller must belong to an org, and the org is always
           the caller's own; nothing in the body chooses it. Otherwise 403
           `org membership required` (or `org not found` when the org row is
           gone). This runs before the break-glass check, so a break-glass
           email with no org gets this same 403. It carries no `stepup_url`.
        2. Body shape: `domain`, `provider_name` and `provider_type` non-empty,
           `provider_type` in the enum, and NO property outside the schema.
           An undeclared property (for instance `org_id`) is a 400
           `unknown property: <name>`, never silently dropped. (Before PAC-50
           the decoder ignored undeclared properties although the schema said
           `additionalProperties: false`.)
        3. Domain: `domain` must equal the caller's org domain, exact and
           case-insensitive. Otherwise 400 `provider_domain_mismatch`. A
           subdomain does NOT match: with org `example.com`, `sub.example.com`
           is a 400. Nothing is trimmed: `" acme.com "` is a 400 too. (Before PAC-50 this was the suffix rule
           domain.DomainMatchesOrg, which accepted any subdomain, and a
           mismatch was a 403; ex-PAC-46.)
        4. Authorization, one of:
           a. a live admin step-up grant for (caller, caller's org), obtained
              through GET /api/admin/sso/stepup less than 10 minutes earlier.
              The request carries nothing that names it: the server selects
              the caller's newest live grant and consumes it in the same
              statement, so one grant authorizes exactly one write, and two
              concurrent writes on one grant yield one success and one 403.
              Every 400 above happens before this step and leaves the grant
              live; a failure after it (the 500 below) leaves it consumed.
           b. break-glass: the caller's session email is listed in the
              deployment's `PACEDAY_ADMIN_EMAILS` (exact, lower-cased) AND the
              session JWT was issued less than 10 minutes ago. Listed with an
              older session gives 403 `sso_write_requires_fresh_login`.
           (a) is tried first: a break-glass caller who also holds a live
           grant consumes that grant on the write.
           Neither gives 403 `sso_write_requires_admin_stepup` with
           `stepup_url`. A 403 rather than a 401: the session is valid, the
           privilege is not there. Every 403 leaves the provider table
           unchanged.
        5. Write: the domain is stored lower-cased, so `ACME.com` updates the
           existing `acme.com` row rather than adding a second one. Each
           successful write is recorded server-side for operators (spec §4.6);
           no operation exposes that record.

        `enabled` is always forced to true; there is no way to disable a
        provider through this API (API-066, not changed by PAC-50).
        `provider_type: "saml"` and an `oidc` row with an empty issuer or
        client id are still accepted and only fail at sign-in (API-060, not
        changed by PAC-50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoProviderCreateRequest'
      responses:
        '201':
          description: |
            The stored provider row, for a create and for an update alike.
            It carries the client secret in plaintext (API-001; the projection
            is PAC-22's, which lands after PAC-50).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoProviderResponse'
        '400':
          description: |
            JSON error, one of: `invalid JSON`; `unknown property: <name>`
            (added by PAC-50); `domain, provider_name and provider_type are
            required`; `provider_type must be 'oidc' or 'saml'`;
            `provider_domain_mismatch` (added by PAC-50; replaces the 403
            `can only configure SSO for your own domain`). No row is written
            and a live grant is NOT consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No/invalid JWT (from requireAuth, text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: |
            The caller may not write SSO configuration. The `error` field tells
            the three cases apart (see SsoWriteForbiddenResponse); only
            `sso_write_requires_admin_stepup` carries `stepup_url`. The
            provider table is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoWriteForbiddenResponse'
        '500':
          description: >-
            Storage failed: the grant lookup in step 4a, or the save after the gate
            passed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21). A grant consumed for this request
            stays consumed; the retry needs a new step-up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listSsoProviders
      tags: [auth]
      summary: List the SSO providers belonging to the caller's org
      responses:
        '200':
          description: Providers for the caller's org; `[]` when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SsoProviderResponse'
        '401':
          description: No/invalid JWT (text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: '"org membership required" — the user has no org_id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            Query failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/sso/{domain}:
    delete:
      operationId: deleteSsoProvider
      tags: [auth]
      summary: Delete the SSO provider for the caller's org domain
      description: |
        Same gate as createSsoProvider, in the same order (spec §4.2):
        membership (403 `org membership required` / `org not found`), then the
        `{domain}` segment, lower-cased and not trimmed, must equal the
        caller's org domain exactly (400 `provider_domain_mismatch`; a
        subdomain does not match, nor does `%20acme.com`),
        then authorization (a live step-up grant, consumed, or break-glass with
        a fresh session; otherwise 403 `sso_write_requires_admin_stepup` with
        `stepup_url`, or `sso_write_requires_fresh_login`).
        The segment is a target, never an authorization: it chooses which row,
        and only ever within the caller's own org domain.

        The row deleted is the lower-cased domain, so `DELETE
        /api/admin/sso/ACME.com` removes the `acme.com` row. Since PAC-50 a
        delete that removes no row is a 404 and is not recorded (API-067 fixed;
        before PAC-50 it answered 204 having deleted nothing). The grant is
        consumed before the delete runs, so a 404 has used it.

        `DELETE /api/admin/sso/stepup` is this operation with `{domain}` =
        `stepup` (the step-up paths define only GET): it gets the same gate,
        so an org member gets 400 `provider_domain_mismatch` and nothing is
        consumed.
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: The caller's org domain, in any casing, e.g. "acme.com".
      responses:
        '204':
          description: The row existed and was deleted. No body.
        '400':
          description: |
            `provider_domain_mismatch`: `{domain}` is not the caller's org
            domain (added by PAC-50; replaces the 403 `can only delete SSO for
            your own domain`). No grant is consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No/invalid JWT (text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: |
            The caller may not write SSO configuration; see
            SsoWriteForbiddenResponse. Nothing is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoWriteForbiddenResponse'
        '404':
          description: |
            `sso provider not found`: authorized, but no provider row exists
            for the org domain (added by PAC-50, API-067). Nothing is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            Storage failed: the grant lookup, or the delete after the gate passed.
            Body: `{"error":"internal error"}`. The detail is written to the server
            log and Sentry only (PAC-21). A grant consumed for this request stays
            consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/sso/stepup:
    get:
      operationId: startSsoAdminStepup
      tags: [auth]
      summary: Begin an admin step-up for an SSO write
      description: |
        Added by PAC-50 (spec §4.3). Behind the session; the org is the
        caller's, never a parameter. Sets a purpose-bound state cookie and
        redirects the browser to the chosen identity provider for a fresh
        sign-in whose result is checked for administrator status over the
        caller's org domain (Google: `hd` equals the org domain and the
        Directory reports `isAdmin` or `isDelegatedAdmin`; Microsoft: the
        tenant has the org domain verified and the user holds a qualifying
        Entra role). The outcome comes back through
        GET /api/admin/sso/stepup/callback.

        This is the `stepup_url` of SsoWriteStepupRequired: the client appends
        `?provider=google` or `?provider=microsoft` after asking the user
        which account administers their organisation, then navigates the
        browser there (a top-level navigation, not a fetch), resolving the
        path against its configured API base's origin, not the page's.

        Scopes are requested for this round-trip only and the resulting
        tokens are discarded after the check; nothing is written to the
        user's settings or token store, and the calendar consent is not
        widened. Google adds the read-only directory-user scope; Microsoft
        adds delegated directory-role and organisation read scopes (whether
        `User.Read` suffices for the organisation's verified domains is spec
        OQ-2, open for the plan; it does not change this interface).
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SsoStepupProvider'
          description: Which identity provider to step up with. Missing, or any other value, is a 400.
      responses:
        '302':
          description: Redirect to the identity provider's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
              description: |
                The provider's authorization URL; its redirect_uri is
                `<APP_URL>/api/admin/sso/stepup/callback`.
            Set-Cookie:
              schema: { type: string }
              description: |
                `sso_stepup_state=<opaque>; Path=/api/admin/sso/stepup;
                Max-Age=600; HttpOnly; SameSite=Lax`, plus `Secure` unless the
                deployment sets `PACEDAY_INSECURE_COOKIES=true` (the PAC-20
                rule every cookie follows, `config.DecideSecureCookies`; a
                deployment property, not observed per request; spec §4.3). The value binds the caller's user id, org id, the
                chosen provider and a nonce, and cannot be forged, nor replayed
                by or for another user.
        '400':
          description: |
            No state cookie is set. Two forms:
            - `provider` missing or empty: text/plain
              `Query argument provider is required, but not found`, from the
              generated request wrapper's default error handler (the server
              installs no JSON error handler for generated operations).
            - `provider` present but not in the enum: JSON
              `provider must be 'google' or 'microsoft'`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '401':
          description: No/invalid JWT (from requireAuth, text/plain). No state cookie is set.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: |
            `org membership required`: the caller has no org, so there is no
            org domain to step up for. No state cookie is set. (Assumed by the
            factory at stage 2, pending owner confirmation; spec "Decisions",
            D-1.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `<provider> step-up not configured`: the deployment has no OAuth
            client for the chosen provider, or has no `APP_URL` (the
            callback's redirect_uri cannot be built without it, so with
            `APP_URL` unset every provider answers this 503). No state cookie
            is set. Same
            precedent as startMicrosoftOAuth's 503. (Assumed by the factory at
            stage 2, pending owner confirmation; spec "Decisions", D-2.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            The state value could not be generated. Body:
            `{"error":"internal error"}`; the detail is written to the server
            log and Sentry only (PAC-21). No state cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/sso/stepup/callback:
    get:
      operationId: ssoAdminStepupCallback
      tags: [auth]
      summary: Finish an admin step-up and record its outcome
      description: |
        Added by PAC-50 (spec §4.3). The identity provider's redirect target.
        Behind the session: the browser's top-level navigation back from the
        provider carries the SameSite=Lax `auth_token` cookie. Without a
        session the answer is 401 and nothing is issued or recorded.

        With a session, every outcome is a 302 to the web app's settings page,
        `<FRONTEND_URL>/settings`, with the outcome in the query string (see
        the 302's Location). Checks run in this order
        and the first failure decides the `reason`:

        0. The `sso_stepup_state` cookie is present, unexpired, untampered,
           matches `state`, and is bound to the session's user and current
           org; else `state_mismatch`.
        1. The authorization code is exchanged and the ID token verified
           (signature, audience, issuer, expiry). A provider `error`, a
           missing `code` or any failure here gives `token_invalid`.
        2. Google: `hd` present (`no_hd`) and equal to the org domain
           (`hd_mismatch`). Microsoft: the organisation answer's id equals
           the token's `tid` and its verified domains contain the org domain
           (`tid_mismatch`; a failed organisation lookup is also
           `tid_mismatch`); an org already pinned to a different tenant gives
           `tid_changed` and the pin stays. On success the org's tenant is
           pinned (idempotent).
        3. The token's email (Microsoft: `preferred_username`/`email`) equals
           the session email; else `email_mismatch`. A Google token whose
           `email_verified` is not true is also `email_mismatch`.
        4. Administrator: Google Directory `isAdmin` or `isDelegatedAdmin`;
           Microsoft `wids` (or, when absent, the directory-role lookup)
           containing a qualifying role template id (spec §4.4). Anything
           else, including a lookup error, gives `not_admin`.
        5. A grant for (caller, caller's org, provider) is issued, valid for
           10 minutes and good for one SSO write.

        Every outcome with a session, granted or denied, is recorded
        server-side for operators (spec §4.6) and clears the state cookie.
        No outcome touches the session, the user's settings or token store.
        The mapping of a provider `error`, a missing `code`, a failed
        organisation lookup and an unverified Google email onto the enum is
        assumed by the factory at stage 2, pending owner confirmation (spec
        "Decisions", D-3).
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string }
          description: Echo of the state the start operation sent. Absent, or not matching the cookie, gives denied/`state_mismatch`.
        - name: code
          in: query
          required: false
          schema: { type: string }
          description: Authorization code. Absent gives denied/`token_invalid`.
        - name: error
          in: query
          required: false
          schema: { type: string }
          description: Set by the provider when the user cancelled or the provider refused. Present gives denied/`token_invalid`.
      responses:
        '302':
          description: Redirect to the web app's settings page with the outcome.
          headers:
            Location:
              schema:
                type: string
                pattern: '/settings\?stepup=(granted|denied&reason=(state_mismatch|token_invalid|no_hd|hd_mismatch|tid_mismatch|tid_changed|email_mismatch|not_admin))$'
              description: |
                `<FRONTEND_URL>/settings?stepup=granted`, or
                `<FRONTEND_URL>/settings?stepup=denied&reason=<reason>`, where
                `<reason>` is one of the eight values in the pattern (spec
                §4.6; the same enum the server records): `state_mismatch`,
                `token_invalid`, `no_hd`, `hd_mismatch` (Google only),
                `tid_mismatch`, `tid_changed` (Microsoft only),
                `email_mismatch`, `not_admin`. Never a raw token or provider
                error text. Built from the configured frontend URL, never a
                literal path (contrast API-084).
            Set-Cookie:
              schema: { type: string }
              description: |
                `sso_stepup_state=; Path=/api/admin/sso/stepup; Max-Age=0;
                HttpOnly; SameSite=Lax` (Go `MaxAge: -1`, which net/http
                serialises as `Max-Age=0`), plus `Secure` under the same
                deployment rule as the start's cookie (PAC-20). The state is
                single-use.
        '401':
          description: |
            No grant, no record, no redirect. Two forms:
            - no/invalid JWT: text/plain, from requireAuth;
            - a valid JWT whose user row no longer exists: JSON
              `{"error":"unauthorized"}`, the convention `main`'s handlers
              already use for that case (handlers_me.go, handlers_org.go).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            Issuing the grant, pinning the tenant or writing the record failed
            in storage. Body: `{"error":"internal error"}`; the detail is
            written to the server log and Sentry only (PAC-21). No usable grant
            exists afterwards. (Assumed by the factory at stage 2, pending owner
            confirmation; spec "Decisions", D-4.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT issued by backend/auth/jwt.go GenerateToken. Claims: `sub`
        (user uuid, string), `email`, `exp` (+7 days), `iat`.
        middleware.requireAuth accepts it as `Authorization: Bearer <jwt>`.
        Since PAC-39 (API-008) the header wins over the `auth_token` cookie: when
        a `Bearer ` header is present its token is the only credential
        considered, whatever the cookie holds, and an invalid bearer token is a
        401 with no fallback to the cookie.
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: |
        The same HS256 JWT, set httpOnly / SameSite=Lax / Max-Age=604800 / Path=/
        by the OAuth and OIDC callbacks. This is the transport the shipped
        frontend uses (both fetch wrappers send `credentials: "include"` and
        never set an Authorization header). It is consulted only when the request
        carries no `Authorization: Bearer` header (PAC-39, API-008).

  parameters:
    LoginHint:
      name: login_hint
      in: query
      required: false
      schema:
        type: string
      description: |
        The email the user typed, forwarded to the provider as the OAuth/OIDC
        `login_hint` so it can preselect or prefill that account (PAC-35,
        API-064). Advisory only (spec PAC-35 D-4): it never selects, creates or
        links a Paceday account; the account signed in is the one the provider
        authenticates, checked exactly as before.
        The LoginHint rule: the value is forwarded only when it is a bare email
        address, meaning all of: (1) at most 254 characters; (2) exactly one
        `@`; (3) Go's `net/mail.ParseAddress` accepts it with an empty display
        name and an `Address` equal to the whole value (so no `<...>`, display
        name, comment, whitespace or other extra text); (4) the local part
        (before `@`) uses only `A-Z a-z 0-9 . _ + - '` (the apostrophe allows
        names such as `o'brien`); (5) the domain (after
        `@`) is a DNS hostname: two or more dot-separated labels, each matching
        `[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?`, the last one containing at
        least one letter, so no IP literal (`[127.0.0.1]` or `127.0.0.1`) and
        no single-label host (`localhost`). Anything else, including an empty
        value, is dropped silently and sign-in starts without a hint. Examples
        dropped (spec AC-10, "a hint carrying extra URL parameters"):
        `alice@acme.com&prompt=none`, `alice&prompt=none@acme.com`,
        `alice@acme.com?x=y`, `alice@acme.com#frag`, `alice@[127.0.0.1]`,
        `alice@localhost`, `alice@acme`. Examples forwarded: `alice@acme.com`,
        `o'brien@acme.com`.
        When `login_hint` is repeated, only the first value is considered
        (`url.Values.Get`); the others are ignored.
        It is never a 400: the schema is a plain string on purpose, because a
        malformed hint must not stop a sign-in (spec AC-10). The forwarded
        value is URL-encoded by the OAuth library, so it cannot add a parameter
        to the provider request, and no other query parameter of the start
        request is forwarded.

  schemas:
    ErrorResponse:
      type: object
      description: |
        The shared JSON error envelope, written by writeError()
        (backend/api/handlers_settings.go:206). Content-Type: application/json.
        `error` is a server-chosen message, never the text of a Go, driver or
        provider error; every 5xx in this document uses this envelope (PAC-21).
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false

    PlainTextError:
      type: string
      description: |
        Several handlers (and requireAuth) use Go's http.Error instead of
        writeError. http.Error forces `Content-Type: text/plain; charset=utf-8`
        and appends a newline, so these responses are NOT JSON documents even
        when the message text happens to be JSON-shaped
        (e.g. `{"error":"unauthorized"}` from requireAuth and handlers_me.go).

    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          const: 0.1.0
          description: Hardcoded literal in handlers_health.go, not a build-injected value.
      additionalProperties: false

    AuthStatusResponse:
      type: object
      description: |
        Assembled from map[string]interface{} literals in authHandlers.status —
        all three keys are always emitted (no omitempty).
      required: [connected, provider, email]
      properties:
        connected:
          type: boolean
          description: |
            Whether the caller's calendar connection for `provider` is usable
            (PAC-67): stored, and not recorded as lost after a permanent
            refusal of its renewal. See `getAuthStatus`.
        provider:
          type: string
          enum: [google, outlook, webcal]
          description: |
            Settings.calendar_provider, defaulting to "google" when blank. The
            error/fallback paths also report "google", so "google" does not prove
            Google was configured.
        email:
          type: string
          description: |
            For outlook/webcal this is the caller's own settings.calendar_email
            verbatim. For google it is the caller's own account email: the Google
            token is stored by the sign-in callback against the user it upserted by
            that same Google email, so they are the same account. No outbound call
            is made (PAC-65; before it, this was fetched live from Google's
            userinfo endpoint with the caller's access token on every request).
            Before PAC-24 the outlook/webcal value came from the shared settings
            row and was therefore some other user's address (API-009).
      additionalProperties: false

    CalendarDisconnectUnsupported:
      type: object
      description: |
        Body of `disconnectCalendar`'s 409 (PAC-35, spec D-8): the caller's
        calendar is not Google, disconnect for that kind of calendar is not
        implemented, and nothing was deleted. `error` keeps the shared
        `{error}` member so a client that only shows `data.error` still shows a
        true sentence.
      required: [error, provider]
      properties:
        error:
          type: string
          const: disconnecting this kind of calendar is not available yet
        provider:
          type: string
          enum: [outlook, webcal]
          description: The caller's calendar provider, as `getAuthStatus` reports it.
      additionalProperties: false

    ProviderDisconnectResult:
      type: object
      description: |
        Body of the 200 of `disconnectMicrosoft` and `disconnectZoom` (PAC-67,
        spec AC-13 to AC-17, D-2). Says which provider was disconnected and
        what became of the grant at the provider. The local credential is gone
        whatever `revocation` says: a revocation that could not be confirmed
        never blocks local removal (spec D-2). Carries no token material.
      required: [provider, revocation]
      properties:
        provider:
          type: string
          enum: [outlook, zoom]
          description: '`outlook` from `disconnectMicrosoft`, `zoom` from `disconnectZoom`.'
        revocation:
          type: string
          enum: [confirmed, unconfirmed, not_offered, nothing_stored]
          description: |
            - `confirmed`: the provider answered success to the revocation
              request (Zoom only).
            - `unconfirmed`: a credential was removed and its revocation is
              not confirmed (Zoom only): either a revocation was attempted and
              the provider refused it, answered an error, or could not be
              reached; or no revocation could be attempted, because the stored
              credential does not decode or its expired access token could not
              be renewed (see `disconnectZoom`). The client must tell the user
              that revocation at the provider could not be confirmed (spec
              AC-15, D-2) and must not show a plain success.
            - `not_offered`: the provider offers no revocation of this one
              grant that Paceday may call, so none was attempted (Outlook
              always, spec AC-17, D-5). The client tells the user the grant
              can be removed from their account at the provider.
            - `nothing_stored`: the caller held no credential for this
              provider; nothing was removed or sent, and no activity entry
              was written.
      additionalProperties: false

    CurrentUserResponse:
      type: object
      description: storage.User (backend/storage/users.go) serialized directly.
      required: [id, email, name, avatarUrl, provider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          description: |
            The user's picture URL. In the current-user read (`getCurrentUser`)
            this is the only name for it; clients read it as `avatarUrl`, not
            `avatar` (PAC-35, API-065: the web app read it as `avatar`, or not at
            all). Scheduling-link and booking hosts carry the same stored value
            as `avatar_url` (`SchedulingLinkHost`, `PublicHost`), unchanged by
            PAC-35. May be the empty string. Every sign-in overwrites it: Google
            writes the Google picture, Microsoft and SSO always write "" (so a
            Microsoft or SSO sign-in clears a picture an earlier Google sign-in
            stored). Not omitempty, so the key is always present.
        provider:
          type: string
          enum: [google, microsoft, sso]
          description: |
            The provider of the user's FIRST sign-in: set when the row is
            inserted and never updated (UpsertUser's ON CONFLICT does not touch
            `provider`), so a user who first signed in with Google and later
            with Microsoft still reads "google".
            Closed by PAC-35 (U-13): `users.provider` has no CHECK constraint
            (migration 006, `TEXT NOT NULL DEFAULT 'google'`), but its only
            writer is storage.UpsertUser, and every call site in the history
            of the repository passes one of these three literals
            (handlers_auth.go "google", handlers_microsoft_auth.go "microsoft",
            handlers_sso.go "sso"; tests and the e2e seed write "google").
            A CHECK constraint is not added (spec PAC-35 section 7: no
            migration).
        org:
          description: |
            Present only when the user has an org_id AND the org row loads
            (json tag "org,omitempty"). org_id itself is `json:"-"` and never
            serialized.
          $ref: '#/components/schemas/OrgSummary'
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    OrgSummary:
      type: object
      description: storage.Org (backend/storage/orgs.go).
      required: [id, name, domain, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    SsoDetectRequest:
      type: object
      description: Anonymous struct in ssoHandlers.detect.
      required: [email]
      properties:
        email:
          type: string
          description: Rejected with 400 when empty; not otherwise validated server-side.
      additionalProperties: true

    SsoDetectResponse:
      type: object
      description: auth.DetectResult (backend/auth/sso_detect.go).
      required: [type]
      properties:
        type:
          type: string
          enum: [google, microsoft, sso, generic]
          description: |
            "generic" for consumer/unparseable domains, "sso" when a provider row
            exists for the domain, "microsoft" from a live tenant probe against
            login.microsoftonline.com (2s timeout, 1h cache), else "google".
        provider_name:
          type: string
          description: Display name of the SSO provider. Omitted unless type == "sso".
        redirect_url:
          type: string
          description: |
            Relative path `/api/auth/sso/<domain>` (the email's domain,
            lowercased and trimmed, not URL-escaped). Omitted unless
            type == "sso". It is a path on the API's origin, not the web app's:
            a client resolves it against its API base URL, which may be a
            different origin (PAC-35 AC-7). The client appends
            `?login_hint=<email>` itself (see `startSsoLogin`); the detection
            answer does not carry the email. This is the only field a client
            needs to reach SSO; there is no `domain` field (API-010).
      additionalProperties: false

    IntegrationAvailabilityResponse:
      type: object
      description: |
        map[string]integrationAvailability from
        integrationAvailabilitySnapshot(); the six keys below are always present.
      required: [google, microsoft, zoom, slack, notion, webcal]
      properties:
        google:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
        microsoft:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
        zoom:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
        slack:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
        notion:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
        webcal:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
      additionalProperties: false

    IntegrationAvailabilityStatus:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          type: string
          enum: [configured, missing_credentials, invalid_redirect_uri, built_in]
          description: |
            `reason,omitempty` — in practice one of the four values is always set
            by the current code paths, so the key is never actually omitted.
      additionalProperties: false

    SsoProviderCreateRequest:
      type: object
      description: |
        Anonymous struct in ssoHandlers.createSSOProvider. Since PAC-50 an
        undeclared property is rejected with 400 `unknown property: <name>`
        (before, the decoder ignored it despite `additionalProperties: false`).
        Determined at stage 2 from the handler (resolves U-21): the server
        validates exactly `domain`, `provider_name` and `provider_type` as
        non-empty, `provider_type` against the enum, and (PAC-50) `domain`
        against the org domain. Nothing else is validated: an `oidc` provider
        can be stored with an empty issuer, client id or secret and fails only
        later, at sign-in, as a 500 from /api/auth/sso/{domain} (API-060, not
        changed by PAC-50).
      required: [domain, provider_name, provider_type]
      properties:
        domain:
          type: string
          minLength: 1
          description: |
            Must equal the caller's org domain, exact and case-insensitive,
            else 400 `provider_domain_mismatch`; a subdomain does not match,
            and surrounding whitespace is not trimmed (`" acme.com "` is a
            400). Stored lower-cased.
        provider_name:
          type: string
          minLength: 1
        provider_type:
          type: string
          enum: [oidc, saml]
          description: |
            "saml" is accepted and stored, but /api/auth/sso/{domain} rejects it
            with 501, so a SAML row can be created that can never be used to
            log in (API-060).
        oidc_issuer:
          type: string
        oidc_client_id:
          type: string
        oidc_client_secret:
          type: string
        saml_entry_point:
          type: string
        saml_issuer:
          type: string
        saml_cert:
          type: string
      additionalProperties: false

    SsoProviderResponse:
      type: object
      description: |
        storage.SSOProvider (backend/storage/sso_providers.go) marshalled directly.
        The struct has NO json tags, so encoding/json emits the exact Go field
        names below: PascalCase, all thirteen always present, including the
        client secret and SAML cert. Determined at stage 2 (resolves U-22) by
        marshalling a storage.SSOProvider with encoding/json, which printed
        exactly these keys. Returning `OIDCClientSecret` is a defect
        (API-001), documented because it is what the code does; the
        projection is PAC-22's, which lands after PAC-50.
      required:
        - ID
        - Domain
        - ProviderName
        - ProviderType
        - Enabled
        - OIDCIssuer
        - OIDCClientID
        - OIDCClientSecret
        - SAMLEntryPoint
        - SAMLIssuer
        - SAMLCert
        - CreatedAt
        - UpdatedAt
      properties:
        ID:
          type: string
          format: uuid
        Domain:
          type: string
          description: Lower-case for every row written since PAC-50; migration 028 (`028_sso_admin_stepup`) lower-cases existing rows.
        ProviderName:
          type: string
        ProviderType:
          type: string
          enum: [oidc, saml]
        Enabled:
          type: boolean
          description: Always true when written through this API (API-066).
        OIDCIssuer:
          type: string
        OIDCClientID:
          type: string
        OIDCClientSecret:
          type: string
          description: >-
            Returned in plaintext to any org member by both POST and GET
            /api/admin/sso (API-001). Documented because it is what the code
            does, not because it is intended; PAC-22 removes it.
        SAMLEntryPoint:
          type: string
        SAMLIssuer:
          type: string
        SAMLCert:
          type: string
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
      additionalProperties: false

    SsoWriteForbiddenResponse:
      description: |
        The 403 of createSsoProvider and deleteSsoProvider (PAC-50). Exactly
        one variant applies, told apart by `error`; `stepup_url` is present
        on, and only on, `sso_write_requires_admin_stepup`. All three keep the
        shared `{error}` envelope, so a client that reads only `error` still
        shows a specific message (the web client renders a 403 without
        `error` as a generic "no permission" text).
      oneOf:
        - $ref: '#/components/schemas/SsoWriteMembershipRequired'
        - $ref: '#/components/schemas/SsoWriteStepupRequired'
        - $ref: '#/components/schemas/SsoWriteFreshLoginRequired'

    SsoWriteMembershipRequired:
      type: object
      description: |
        The caller has no org (or its org row is gone). Checked before
        anything else, including break-glass. No `stepup_url`: there is no org
        to step up for.
      required: [error]
      properties:
        error:
          type: string
          enum: [org membership required, org not found]
      additionalProperties: false

    SsoWriteStepupRequired:
      type: object
      description: |
        An org member with no live step-up grant for (caller, caller's org)
        who is not a break-glass admin. The client asks the user which
        provider administers their organisation, appends
        `?provider=google` or `?provider=microsoft` to `stepup_url` and
        navigates the browser there.
      required: [error, stepup_url]
      properties:
        error:
          type: string
          const: sso_write_requires_admin_stepup
        stepup_url:
          type: string
          const: /api/admin/sso/stepup
          description: |
            Path of startSsoAdminStepup on the API's origin, without the
            `provider` parameter (spec §4.3 and OQ-8). It has the same form as
            every operation path in this document, and a client resolves it
            the way it resolves those: against the origin of its configured
            API base (for the web app, the base it already uses for
            `/api/auth/...` navigations), never against the page's origin.
            The API need not share an origin with the page: the web's API
            base is set at runtime (`API_BASE_URL`) or at build time
            (`VITE_API_BASE_URL`), and the session cookie is host-only on
            the API host, so the page's origin can lack the session.
      additionalProperties: false

    SsoWriteFreshLoginRequired:
      type: object
      description: |
        The caller's email is on the deployment's break-glass list but the
        session JWT was issued 10 minutes ago or more. The client sends the
        user through sign-in again; a step-up grant also satisfies the gate.
      required: [error]
      properties:
        error:
          type: string
          const: sso_write_requires_fresh_login
      additionalProperties: false

    SsoStepupProvider:
      type: string
      enum: [google, microsoft]
      description: Identity provider an SSO admin step-up runs against (PAC-50).
