# Domain: auth
# Extracted from backend/api/{routes,middleware,handlers_auth,handlers_sso,handlers_me,
# handlers_health,integration_availability,handlers_microsoft_auth}.go and
# backend/auth/*.go + backend/storage/{users,orgs,sso_providers}.go.
#
# Auth transport note (backend/api/middleware.go requireAuth):
#   the JWT is read from the `auth_token` cookie FIRST; only if that cookie is
#   absent/empty is `Authorization: Bearer <jwt>` consulted. Both work.
#   Protected operations below carry no `security:` key and therefore inherit the
#   global scheme (`bearerAuth`); `cookieAuth` is the transport the shipped
#   frontend actually uses (it never sets an Authorization header).
paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [auth]
      summary: Liveness probe
      description: |
        Static JSON. Never touches the database. Source: handlers_health.go —
        the version string "0.1.0" is hardcoded in the handler.
      security: []
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/google:
    get:
      operationId: startGoogleOAuth
      tags: [auth]
      summary: Begin Google OAuth
      description: |
        Sets an httpOnly `oauth_state` cookie (MaxAge 300, SameSite=Lax) and
        redirects to Google's consent screen. Never returns a body.
      security: []
      parameters:
        - name: login_hint
          in: query
          required: false
          schema:
            type: string
            format: email
          description: |
            Sent by the frontend (src/components/auth/AuthDialog.tsx) but the Go
            handler (authHandlers.startOAuth) reads no query parameters at all,
            so it is silently discarded and NOT forwarded to Google.
      responses:
        '302':
          description: Redirect to Google's authorization endpoint.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: auth.GetAuthURL(oauthConfig, state)
            Set-Cookie:
              schema:
                type: string
              description: 'oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax'

  /api/auth/callback:
    get:
      operationId: googleOAuthCallback
      tags: [auth]
      summary: Google OAuth callback
      description: |
        Validates the `oauth_state` cookie against the `state` query param,
        exchanges the code, upserts the user, stores the OAuth token, associates
        the org, issues the `auth_token` JWT cookie, then redirects to
        `<FRONTEND_URL>/auth/callback`.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Success — JWT cookie issued, redirect to the SPA.
          headers:
            Location:
              schema:
                type: string
              description: '<FRONTEND_URL>/auth/callback (no query string, unlike the Microsoft/SSO callbacks)'
            Set-Cookie:
              schema:
                type: string
              description: |
                auth_token=<HS256 JWT>; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax.
                NOTE: if jwtSecret is empty, authHandlers.issueJWT returns silently
                and NO cookie is set — the 302 still happens and the user lands
                logged-out.
        '400':
          description: Missing or mismatched `oauth_state` cookie ("invalid state").
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: |
            Token exchange, userinfo fetch, user upsert or token save failed.
            Body is the bare message + ": " + err.Error().
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'

  /api/auth/microsoft:
    get:
      operationId: startMicrosoftOAuth
      tags: [auth]
      summary: Begin Microsoft OAuth
      description: |
        Sets an httpOnly `ms_oauth_state` cookie and redirects to Microsoft.
        Configuration is read from env at request time (MICROSOFT_CLIENT_ID);
        if the client id is blank the route 503s.
      security: []
      parameters:
        - name: login_hint
          in: query
          required: false
          schema:
            type: string
            format: email
          description: Sent by the frontend; ignored by the handler (same as /api/auth/google).
      responses:
        '302':
          description: Redirect to Microsoft's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
              description: 'ms_oauth_state=<32 hex chars>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax'
        '503':
          description: '`MICROSOFT_CLIENT_ID` is unset — "Microsoft OAuth not configured".'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/microsoft/callback:
    get:
      operationId: microsoftOAuthCallback
      tags: [auth]
      summary: Microsoft OAuth callback
      description: |
        Validates `ms_oauth_state`, exchanges the code, fetches the Graph profile
        and upserts the user, then saves the Microsoft token on THAT USER'S OWN
        settings row (making Outlook their calendar provider), sets the session
        cookie and redirects. Since PAC-24 the profile fetch is required, not
        best-effort: without it there is no user to attach the credential to, so
        a failed fetch is a 502 and nothing is saved. Before PAC-24 the token was
        saved on the single shared settings row and the provider flipped for
        everyone.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: |
            Redirect to `<FRONTEND_URL>/auth/callback?provider=outlook`, with the
            `auth_token` cookie set. Every failure is a non-302 response below.
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
              description: auth_token JWT for the upserted user.
        '400':
          description: Missing or mismatched `ms_oauth_state` cookie ("invalid state").
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: >
            Token exchange, user upsert (`save user failed`) or token save
            (`save token failed: <err>`) failed (text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '502':
          description: >
            The Graph profile could not be read, or carried no email
            (`could not read the Microsoft account`, text/plain). Added by PAC-24.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '503':
          description: '`MICROSOFT_CLIENT_ID` unset — JSON error, unlike the other failures here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/detect:
    post:
      operationId: detectAuthProvider
      tags: [auth]
      summary: Detect which auth provider an email address should use
      description: |
        Rate limited to 20 requests per minute per client IP (sliding window,
        in-process map keyed by X-Real-IP / first X-Forwarded-For / RemoteAddr).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoDetectRequest'
      responses:
        '200':
          description: Detection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoDetectResponse'
        '400':
          description: Body is not JSON, or `email` is empty ("email required").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '"rate limit exceeded" — more than 20 detects/minute from this IP.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '"detection failed: <err>" — the SSO provider lookup errored.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/sso/{domain}:
    get:
      operationId: startSsoLogin
      tags: [auth]
      summary: Begin OIDC SSO login for a configured domain
      description: |
        Looks up the SSO provider row for `{domain}`, builds the OIDC redirect
        URL as `os.Getenv("APP_URL") + "/api/auth/callback/oidc/" + domain`, sets
        an `sso_state` cookie of the form `<state>|<domain>`, and redirects.
      security: []
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
          description: Email domain, e.g. "acme.com".
      responses:
        '302':
          description: Redirect to the identity provider.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
              description: 'sso_state=<32 hex chars>|<domain>; Path=/; Max-Age=300; HttpOnly; SameSite=Lax'
        '404':
          description: '"SSO not configured for this domain" — no provider row (also returned when the lookup errors).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '"OIDC setup: <err>" — issuer discovery failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: '"SAML not yet supported" — the stored provider_type is "saml".'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/callback/oidc/{domain}:
    get:
      operationId: ssoOidcCallback
      tags: [auth]
      summary: OIDC SSO callback
      description: |
        Verifies `sso_state` (both the random half and the embedded domain),
        re-discovers the OIDC client, exchanges the code, upserts the user with
        provider="sso", and issues the JWT cookie.
        Inconsistent error encoding: the 404 uses the JSON helper while every
        other failure in this handler uses http.Error (text/plain).
      security: []
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to `<FRONTEND_URL>/auth/callback?provider=sso`.
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
              description: auth_token JWT cookie (skipped silently when jwtSecret is empty).
        '400':
          description: '"missing state cookie", "invalid state", or "no email in OIDC token claims".'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '404':
          description: '"SSO not configured for this domain" — JSON, unlike the other errors here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '"OIDC setup: <err>", "OIDC exchange: <err>" or "upsert user: <err>".'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'

  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Calendar connection status for the current session
      description: |
        Protected by requireAuth (cookie `auth_token` or `Authorization: Bearer`).
        Reports the CALLER'S own calendar connection: it branches on the caller's
        `calendarProvider` and, on the outlook branch, reads the caller's own
        stored Microsoft credential.
        On an internal failure it does NOT error — it 200s with
        {connected:false, provider:"google", email:""}.

        PAC-24 resolves API-009. Before it, this branched on the SINGLETON
        settings row's calendar_provider and returned that row's
        `calendar_email`, and `auth.LoadMicrosoftToken` took no user id at all
        (`backend/auth/microsoft_oauth.go:61`, `WHERE id = 1`) — so one user's
        Outlook address and connection state were reported to everybody, and
        only the google branch consulted the caller.
        The response shape is unchanged; what changes is whose state it
        describes. See `docs/specs/PAC-24.md` §2.5 for the wider problem the same
        singleton created on the write side, which is in PAC-24's scope but is
        not visible on this operation.
      responses:
        '200':
          description: Connection status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '401':
          description: |
            No/invalid JWT. Body is the literal JSON text `{"error":"unauthorized"}`
            but Content-Type is `text/plain; charset=utf-8` because http.Error
            overwrites the header the middleware just set.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'

  /api/auth/disconnect:
    delete:
      operationId: disconnectCalendar
      tags: [auth]
      summary: Delete the stored calendar OAuth token and clear the session cookie
      description: |
        Deletes the current user's OAuth token row and expires the `auth_token`
        cookie — i.e. this also logs the user out, which the name does not suggest.
      responses:
        '204':
          description: Disconnected. No body.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 'auth_token=; Path=/; Max-Age=-1; HttpOnly; SameSite=Lax'
        '401':
          description: No/invalid JWT (text/plain body carrying JSON text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: Token delete failed — body is the raw err.Error() string.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'

  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The authenticated user
      responses:
        '200':
          description: The user row (with its org when one is associated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: |
            No/invalid JWT. Returned by requireAuth, or by the handler itself when
            the context user id is uuid.Nil. Body text is `{"error":"unauthorized"}`
            served as text/plain.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '404':
          description: |
            Valid JWT but no matching users row — body text is
            `{"error":"user not found"}` served as text/plain.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'

  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the session cookie
      description: |
        Expires the `auth_token` cookie. Note it is behind requireAuth, so logging
        out with an already-expired token returns 401 rather than succeeding.
      responses:
        '200':
          description: |
            Logged out. Empty body and NO Content-Type header (w.WriteHeader(200)
            with nothing written) — a 204 would be the honest status.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 'auth_token=; Path=/; Max-Age=-1; HttpOnly; SameSite=Lax'
        '401':
          description: No/invalid JWT.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'

  /api/integrations/availability:
    get:
      operationId: getIntegrationAvailability
      tags: [auth]
      summary: Which OAuth providers this server is configured to start
      description: |
        Public by design (routes.go comment) so the login screen can hide
        providers the server cannot start. Derived purely from environment
        variables; never returns credential values.
      security: []
      responses:
        '200':
          description: Availability snapshot — all six keys are always present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationAvailabilityResponse'

  /api/admin/sso:
    post:
      operationId: createSsoProvider
      tags: [auth]
      summary: Create or update the SSO provider for the caller's org domain
      description: |
        Upsert keyed on domain: a second POST for the same domain is the update
        (there is no PATCH/PUT). Since PAC-50 (spec docs/specs/PAC-50.md §4.2)
        every write passes this gate, in this order, before the provider store
        is touched; the first step that fails decides the response:

        1. Membership: the caller must belong to an org, and the org is always
           the caller's own; nothing in the body chooses it. Otherwise 403
           `org membership required` (or `org not found` when the org row is
           gone). This runs before the break-glass check, so a break-glass
           email with no org gets this same 403. It carries no `stepup_url`.
        2. Body shape: `domain`, `provider_name` and `provider_type` non-empty,
           `provider_type` in the enum, and NO property outside the schema.
           An undeclared property (for instance `org_id`) is a 400
           `unknown property: <name>`, never silently dropped. (Before PAC-50
           the decoder ignored undeclared properties although the schema said
           `additionalProperties: false`.)
        3. Domain: `domain` must equal the caller's org domain, exact and
           case-insensitive. Otherwise 400 `provider_domain_mismatch`. A
           subdomain does NOT match: with org `example.com`, `sub.example.com`
           is a 400. (Before PAC-50 this was the suffix rule
           domain.DomainMatchesOrg, which accepted any subdomain, and a
           mismatch was a 403; ex-PAC-46.)
        4. Authorization, one of:
           a. a live admin step-up grant for (caller, caller's org), obtained
              through GET /api/admin/sso/stepup less than 10 minutes earlier.
              The request carries nothing that names it: the server selects
              the caller's newest live grant and consumes it in the same
              statement, so one grant authorizes exactly one write, and two
              concurrent writes on one grant yield one success and one 403.
              Every 400 above happens before this step and leaves the grant
              live; a failure after it (the 500 below) leaves it consumed.
           b. break-glass: the caller's session email is listed in the
              deployment's `PACEDAY_ADMIN_EMAILS` (exact, lower-cased) AND the
              session JWT was issued less than 10 minutes ago. Listed with an
              older session gives 403 `sso_write_requires_fresh_login`.
           Neither gives 403 `sso_write_requires_admin_stepup` with
           `stepup_url`. A 403 rather than a 401: the session is valid, the
           privilege is not there. Every 403 leaves the provider table
           unchanged.
        5. Write: the domain is stored lower-cased, so `ACME.com` updates the
           existing `acme.com` row rather than adding a second one. Each
           successful write is recorded server-side for operators (spec §4.6);
           no operation exposes that record.

        `enabled` is always forced to true; there is no way to disable a
        provider through this API (API-066, not changed by PAC-50).
        `provider_type: "saml"` and an `oidc` row with an empty issuer or
        client id are still accepted and only fail at sign-in (API-060, not
        changed by PAC-50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoProviderCreateRequest'
      responses:
        '201':
          description: |
            The stored provider row, for a create and for an update alike.
            It carries the client secret in plaintext (API-001; the projection
            is PAC-22's, which lands after PAC-50).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoProviderResponse'
        '400':
          description: |
            JSON error, one of: `invalid JSON`; `unknown property: <name>`
            (added by PAC-50); `domain, provider_name and provider_type are
            required`; `provider_type must be 'oidc' or 'saml'`;
            `provider_domain_mismatch` (added by PAC-50; replaces the 403
            `can only configure SSO for your own domain`). No row is written
            and a live grant is NOT consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No/invalid JWT (from requireAuth, text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: |
            The caller may not write SSO configuration. The `error` field tells
            the three cases apart (see SsoWriteForbiddenResponse); only
            `sso_write_requires_admin_stepup` carries `stepup_url`. The
            provider table is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoWriteForbiddenResponse'
        '500':
          description: |
            `save failed: <err>`: the gate passed and the provider store
            failed. A grant used for this request is consumed; the retry needs
            a new step-up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listSsoProviders
      tags: [auth]
      summary: List the SSO providers belonging to the caller's org
      responses:
        '200':
          description: Providers for the caller's org; `[]` when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SsoProviderResponse'
        '401':
          description: No/invalid JWT (text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: '"org membership required" — the user has no org_id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Query failed — body is the raw err.Error() in the JSON error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/sso/{domain}:
    delete:
      operationId: deleteSsoProvider
      tags: [auth]
      summary: Delete the SSO provider for the caller's org domain
      description: |
        Same gate as createSsoProvider, in the same order (spec §4.2):
        membership (403 `org membership required` / `org not found`), then the
        `{domain}` segment, lower-cased, must equal the caller's org domain
        exactly (400 `provider_domain_mismatch`; a subdomain does not match),
        then authorization (a live step-up grant, consumed, or break-glass with
        a fresh session; otherwise 403 `sso_write_requires_admin_stepup` with
        `stepup_url`, or `sso_write_requires_fresh_login`).
        The segment is a target, never an authorization: it chooses which row,
        and only ever within the caller's own org domain.

        The row deleted is the lower-cased domain, so `DELETE
        /api/admin/sso/ACME.com` removes the `acme.com` row. Since PAC-50 a
        delete that removes no row is a 404 and is not recorded (API-067 fixed;
        before PAC-50 it answered 204 having deleted nothing). The grant is
        consumed before the delete runs, so a 404 has used it.
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: The caller's org domain, in any casing, e.g. "acme.com".
      responses:
        '204':
          description: The row existed and was deleted. No body.
        '400':
          description: |
            `provider_domain_mismatch`: `{domain}` is not the caller's org
            domain (added by PAC-50; replaces the 403 `can only delete SSO for
            your own domain`). No grant is consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No/invalid JWT (text/plain).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: |
            The caller may not write SSO configuration; see
            SsoWriteForbiddenResponse. Nothing is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoWriteForbiddenResponse'
        '404':
          description: |
            `sso provider not found`: authorized, but no provider row exists
            for the org domain (added by PAC-50, API-067). Nothing is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Delete failed — raw err.Error() in the JSON error envelope. A grant used for this request is consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/sso/stepup:
    get:
      operationId: startSsoAdminStepup
      tags: [auth]
      summary: Begin an admin step-up for an SSO write
      description: |
        Added by PAC-50 (spec §4.3). Behind the session; the org is the
        caller's, never a parameter. Sets a purpose-bound state cookie and
        redirects the browser to the chosen identity provider for a fresh
        sign-in whose result is checked for administrator status over the
        caller's org domain (Google: `hd` equals the org domain and the
        Directory reports `isAdmin` or `isDelegatedAdmin`; Microsoft: the
        tenant has the org domain verified and the user holds a qualifying
        Entra role). The outcome comes back through
        GET /api/admin/sso/stepup/callback.

        This is the `stepup_url` of SsoWriteStepupRequired: the client appends
        `?provider=google` or `?provider=microsoft` after asking the user
        which account administers their organisation, then navigates the
        browser there (a top-level navigation, not a fetch).

        Scopes are requested for this round-trip only and the resulting
        tokens are discarded after the check; nothing is written to the
        user's settings or token store, and the calendar consent is not
        widened. Google adds the read-only directory-user scope; Microsoft
        adds delegated directory-role and organisation read scopes (whether
        `User.Read` suffices for the organisation's verified domains is spec
        OQ-2, open for the plan; it does not change this interface).
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SsoStepupProvider'
          description: Which identity provider to step up with. Missing, or any other value, is a 400.
      responses:
        '302':
          description: Redirect to the identity provider's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
              description: |
                The provider's authorization URL; its redirect_uri is
                `<APP_URL>/api/admin/sso/stepup/callback`.
            Set-Cookie:
              schema: { type: string }
              description: |
                `sso_stepup_state=<opaque>; Path=/api/admin/sso/stepup;
                Max-Age=600; HttpOnly; SameSite=Lax`, plus `Secure` in
                production (a deployment property, not observed per request;
                spec §4.3). The value binds the caller's user id, org id, the
                chosen provider and a nonce, and cannot be forged, nor replayed
                by or for another user.
        '400':
          description: |
            `provider must be 'google' or 'microsoft'`: `provider` is missing
            or not in the enum. No state cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No/invalid JWT (from requireAuth, text/plain). No state cookie is set.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '403':
          description: |
            `org membership required`: the caller has no org, so there is no
            org domain to step up for. No state cookie is set. (Assumed by the
            factory at stage 2, pending owner confirmation; spec "Decisions",
            D-1.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `<provider> step-up not configured`: the deployment has no OAuth
            client for the chosen provider. No state cookie is set. Same
            precedent as startMicrosoftOAuth's 503. (Assumed by the factory at
            stage 2, pending owner confirmation; spec "Decisions", D-2.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/sso/stepup/callback:
    get:
      operationId: ssoAdminStepupCallback
      tags: [auth]
      summary: Finish an admin step-up and record its outcome
      description: |
        Added by PAC-50 (spec §4.3). The identity provider's redirect target.
        Behind the session: the browser's top-level navigation back from the
        provider carries the SameSite=Lax `auth_token` cookie. Without a
        session the answer is 401 and nothing is issued or recorded.

        With a session, every outcome is a 302 to the web app's settings page,
        `<FRONTEND_URL>/settings`, with the outcome in the query string (see
        the 302's Location). Checks run in this order
        and the first failure decides the `reason`:

        0. The `sso_stepup_state` cookie is present, unexpired, untampered,
           matches `state`, and is bound to the session's user and current
           org; else `state_mismatch`.
        1. The authorization code is exchanged and the ID token verified
           (signature, audience, issuer, expiry). A provider `error`, a
           missing `code` or any failure here gives `token_invalid`.
        2. Google: `hd` present (`no_hd`) and equal to the org domain
           (`hd_mismatch`). Microsoft: the organisation answer's id equals
           the token's `tid` and its verified domains contain the org domain
           (`tid_mismatch`; a failed organisation lookup is also
           `tid_mismatch`); an org already pinned to a different tenant gives
           `tid_changed` and the pin stays. On success the org's tenant is
           pinned (idempotent).
        3. The token's email (Microsoft: `preferred_username`/`email`) equals
           the session email; else `email_mismatch`. A Google token whose
           `email_verified` is not true is also `email_mismatch`.
        4. Administrator: Google Directory `isAdmin` or `isDelegatedAdmin`;
           Microsoft `wids` (or, when absent, the directory-role lookup)
           containing a qualifying role template id (spec §4.4). Anything
           else, including a lookup error, gives `not_admin`.
        5. A grant for (caller, caller's org, provider) is issued, valid for
           10 minutes and good for one SSO write.

        Every outcome with a session, granted or denied, is recorded
        server-side for operators (spec §4.6) and clears the state cookie.
        No outcome touches the session, the user's settings or token store.
        The mapping of a provider `error`, a missing `code`, a failed
        organisation lookup and an unverified Google email onto the enum is
        assumed by the factory at stage 2, pending owner confirmation (spec
        "Decisions", D-3).
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string }
          description: Echo of the state the start operation sent. Absent, or not matching the cookie, gives denied/`state_mismatch`.
        - name: code
          in: query
          required: false
          schema: { type: string }
          description: Authorization code. Absent gives denied/`token_invalid`.
        - name: error
          in: query
          required: false
          schema: { type: string }
          description: Set by the provider when the user cancelled or the provider refused. Present gives denied/`token_invalid`.
      responses:
        '302':
          description: Redirect to the web app's settings page with the outcome.
          headers:
            Location:
              schema:
                type: string
                pattern: '/settings\?stepup=(granted|denied&reason=(state_mismatch|token_invalid|no_hd|hd_mismatch|tid_mismatch|tid_changed|email_mismatch|not_admin))$'
              description: |
                `<FRONTEND_URL>/settings?stepup=granted`, or
                `<FRONTEND_URL>/settings?stepup=denied&reason=<reason>`, where
                `<reason>` is one of the eight values in the pattern (spec
                §4.6; the same enum the server records): `state_mismatch`,
                `token_invalid`, `no_hd`, `hd_mismatch` (Google only),
                `tid_mismatch`, `tid_changed` (Microsoft only),
                `email_mismatch`, `not_admin`. Never a raw token or provider
                error text. Built from the configured frontend URL, never a
                literal path (contrast API-084).
            Set-Cookie:
              schema: { type: string }
              description: '`sso_stepup_state=; Path=/api/admin/sso/stepup; Max-Age=-1; HttpOnly; SameSite=Lax`: the state is single-use.'
        '401':
          description: No/invalid JWT (from requireAuth, text/plain). No grant, no record.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: |
            Issuing the grant, pinning the tenant or writing the record failed
            in storage. JSON error; no usable grant exists afterwards. (Assumed
            by the factory at stage 2, pending owner confirmation; spec
            "Decisions", D-4.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT issued by backend/auth/jwt.go GenerateToken. Claims: `sub`
        (user uuid, string), `email`, `exp` (+7 days), `iat`.
        middleware.requireAuth accepts it as `Authorization: Bearer <jwt>` ONLY
        when the `auth_token` cookie is absent or empty — the cookie wins.
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: |
        The same HS256 JWT, set httpOnly / SameSite=Lax / Max-Age=604800 / Path=/
        by the OAuth and OIDC callbacks. This is the transport the shipped
        frontend uses (both fetch wrappers send `credentials: "include"` and
        never set an Authorization header). It is checked before bearerAuth.

  schemas:
    ErrorResponse:
      type: object
      description: |
        The shared JSON error envelope, written by writeError()
        (backend/api/handlers_settings.go:206). Content-Type: application/json.
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false

    PlainTextError:
      type: string
      description: |
        Several handlers (and requireAuth) use Go's http.Error instead of
        writeError. http.Error forces `Content-Type: text/plain; charset=utf-8`
        and appends a newline, so these responses are NOT JSON documents even
        when the message text happens to be JSON-shaped
        (e.g. `{"error":"unauthorized"}` from requireAuth and handlers_me.go).

    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          const: 0.1.0
          description: Hardcoded literal in handlers_health.go, not a build-injected value.
      additionalProperties: false

    AuthStatusResponse:
      type: object
      description: |
        Assembled from map[string]interface{} literals in authHandlers.status —
        all three keys are always emitted (no omitempty).
      required: [connected, provider, email]
      properties:
        connected:
          type: boolean
        provider:
          type: string
          enum: [google, outlook, webcal]
          description: |
            Settings.calendar_provider, defaulting to "google" when blank. The
            error/fallback paths also report "google", so "google" does not prove
            Google was configured.
        email:
          type: string
          description: |
            For outlook/webcal this is the caller's own settings.calendar_email
            verbatim. For google it is the caller's own account email: the Google
            token is stored by the sign-in callback against the user it upserted by
            that same Google email, so they are the same account. No outbound call
            is made (PAC-65; before it, this was fetched live from Google's
            userinfo endpoint with the caller's access token on every request).
            Before PAC-24 the outlook/webcal value came from the shared settings
            row and was therefore some other user's address (API-009).
      additionalProperties: false

    CurrentUserResponse:
      type: object
      description: storage.User (backend/storage/users.go) serialized directly.
      required: [id, email, name, avatarUrl, provider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          description: |
            May be the empty string (Microsoft and SSO logins always upsert "").
            Not omitempty, so the key is always present.
        provider:
          type: string
          description: |
            Login provider recorded at upsert time.
            x-uncertain applies — see property-level note.
          x-uncertain: >-
            Observed writers pass "google", "microsoft" and "sso", but the column
            is free text with no CHECK constraint found, so this is not a closed
            enum in the spec.
        org:
          description: |
            Present only when the user has an org_id AND the org row loads
            (json tag "org,omitempty"). org_id itself is `json:"-"` and never
            serialized.
          $ref: '#/components/schemas/OrgSummary'
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    OrgSummary:
      type: object
      description: storage.Org (backend/storage/orgs.go).
      required: [id, name, domain, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    SsoDetectRequest:
      type: object
      description: Anonymous struct in ssoHandlers.detect.
      required: [email]
      properties:
        email:
          type: string
          description: Rejected with 400 when empty; not otherwise validated server-side.
      additionalProperties: true

    SsoDetectResponse:
      type: object
      description: auth.DetectResult (backend/auth/sso_detect.go).
      required: [type]
      properties:
        type:
          type: string
          enum: [google, microsoft, sso, generic]
          description: |
            "generic" for consumer/unparseable domains, "sso" when a provider row
            exists for the domain, "microsoft" from a live tenant probe against
            login.microsoftonline.com (2s timeout, 1h cache), else "google".
        provider_name:
          type: string
          description: Display name of the SSO provider. Omitted unless type == "sso".
        redirect_url:
          type: string
          description: |
            Relative path `/api/auth/sso/<domain>`. Omitted unless type == "sso".
      additionalProperties: false

    IntegrationAvailabilityResponse:
      type: object
      description: |
        map[string]integrationAvailability from
        integrationAvailabilitySnapshot(); the six keys below are always present.
      required: [google, microsoft, zoom, slack, notion, webcal]
      properties:
        google:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
        microsoft:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
        zoom:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
        slack:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
        notion:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
        webcal:
          $ref: '#/components/schemas/IntegrationAvailabilityStatus'
      additionalProperties: false

    IntegrationAvailabilityStatus:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          type: string
          enum: [configured, missing_credentials, invalid_redirect_uri, built_in]
          description: |
            `reason,omitempty` — in practice one of the four values is always set
            by the current code paths, so the key is never actually omitted.
      additionalProperties: false

    SsoProviderCreateRequest:
      type: object
      description: |
        Anonymous struct in ssoHandlers.createSSOProvider. Since PAC-50 an
        undeclared property is rejected with 400 `unknown property: <name>`
        (before, the decoder ignored it despite `additionalProperties: false`).
        Determined at stage 2 from the handler (resolves U-21): the server
        validates exactly `domain`, `provider_name` and `provider_type` as
        non-empty, `provider_type` against the enum, and (PAC-50) `domain`
        against the org domain. Nothing else is validated: an `oidc` provider
        can be stored with an empty issuer, client id or secret and fails only
        later, at sign-in, as a 500 from /api/auth/sso/{domain} (API-060, not
        changed by PAC-50).
      required: [domain, provider_name, provider_type]
      properties:
        domain:
          type: string
          minLength: 1
          description: |
            Must equal the caller's org domain, exact and case-insensitive,
            else 400 `provider_domain_mismatch`; a subdomain does not match.
            Stored lower-cased.
        provider_name:
          type: string
          minLength: 1
        provider_type:
          type: string
          enum: [oidc, saml]
          description: |
            "saml" is accepted and stored, but /api/auth/sso/{domain} rejects it
            with 501, so a SAML row can be created that can never be used to
            log in (API-060).
        oidc_issuer:
          type: string
        oidc_client_id:
          type: string
        oidc_client_secret:
          type: string
        saml_entry_point:
          type: string
        saml_issuer:
          type: string
        saml_cert:
          type: string
      additionalProperties: false

    SsoProviderResponse:
      type: object
      description: |
        storage.SSOProvider (backend/storage/sso_providers.go) marshalled directly.
        The struct has NO json tags, so encoding/json emits the exact Go field
        names below: PascalCase, all thirteen always present, including the
        client secret and SAML cert. Determined at stage 2 (resolves U-22) by
        marshalling a storage.SSOProvider with encoding/json, which printed
        exactly these keys. Returning `OIDCClientSecret` is a defect
        (API-001), documented because it is what the code does; the
        projection is PAC-22's, which lands after PAC-50.
      required:
        - ID
        - Domain
        - ProviderName
        - ProviderType
        - Enabled
        - OIDCIssuer
        - OIDCClientID
        - OIDCClientSecret
        - SAMLEntryPoint
        - SAMLIssuer
        - SAMLCert
        - CreatedAt
        - UpdatedAt
      properties:
        ID:
          type: string
          format: uuid
        Domain:
          type: string
          description: Lower-case for every row written since PAC-50; migration 027 lower-cases existing rows.
        ProviderName:
          type: string
        ProviderType:
          type: string
          enum: [oidc, saml]
        Enabled:
          type: boolean
          description: Always true when written through this API (API-066).
        OIDCIssuer:
          type: string
        OIDCClientID:
          type: string
        OIDCClientSecret:
          type: string
          description: >-
            Returned in plaintext to any org member by both POST and GET
            /api/admin/sso (API-001). Documented because it is what the code
            does, not because it is intended; PAC-22 removes it.
        SAMLEntryPoint:
          type: string
        SAMLIssuer:
          type: string
        SAMLCert:
          type: string
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
      additionalProperties: false

    SsoWriteForbiddenResponse:
      description: |
        The 403 of createSsoProvider and deleteSsoProvider (PAC-50). Exactly
        one variant applies, told apart by `error`; `stepup_url` is present
        on, and only on, `sso_write_requires_admin_stepup`. All three keep the
        shared `{error}` envelope, so a client that reads only `error` still
        shows a specific message (the web client renders a 403 without
        `error` as a generic "no permission" text).
      oneOf:
        - $ref: '#/components/schemas/SsoWriteMembershipRequired'
        - $ref: '#/components/schemas/SsoWriteStepupRequired'
        - $ref: '#/components/schemas/SsoWriteFreshLoginRequired'

    SsoWriteMembershipRequired:
      type: object
      description: |
        The caller has no org (or its org row is gone). Checked before
        anything else, including break-glass. No `stepup_url`: there is no org
        to step up for.
      required: [error]
      properties:
        error:
          type: string
          enum: [org membership required, org not found]
      additionalProperties: false

    SsoWriteStepupRequired:
      type: object
      description: |
        An org member with no live step-up grant for (caller, caller's org)
        who is not a break-glass admin. The client asks the user which
        provider administers their organisation, appends
        `?provider=google` or `?provider=microsoft` to `stepup_url` and
        navigates the browser there.
      required: [error, stepup_url]
      properties:
        error:
          type: string
          const: sso_write_requires_admin_stepup
        stepup_url:
          type: string
          const: /api/admin/sso/stepup
          description: |
            Root-relative path of startSsoAdminStepup, without the `provider`
            parameter (spec §4.3 and OQ-8; same precedent as
            SsoDetectResponse.redirect_url). The web app and the API share an
            origin behind nginx (`/api/` is proxied to the backend), so the
            browser resolves it against the page's origin.
      additionalProperties: false

    SsoWriteFreshLoginRequired:
      type: object
      description: |
        The caller's email is on the deployment's break-glass list but the
        session JWT was issued 10 minutes ago or more. The client sends the
        user through sign-in again; a step-up grant also satisfies the gate.
      required: [error]
      properties:
        error:
          type: string
          const: sso_write_requires_fresh_login
      additionalProperties: false

    SsoStepupProvider:
      type: string
      enum: [google, microsoft]
      description: Identity provider an SSO admin step-up runs against (PAC-50).
