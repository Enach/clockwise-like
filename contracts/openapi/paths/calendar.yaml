# Domain: calendar
# Source of truth: backend/api/routes.go, handlers_calendar.go, handlers_events.go,
# handlers_freebusy.go, handlers_personal.go, handlers_org.go, handlers_audit.go,
# backend/calendar/*.go, backend/engine/freebusy_service.go, backend/storage/*.go
#
# All routes below are registered inside the `requireAuth(jwtSecret)` chi group in
# routes.go, so they inherit the globally-declared security scheme. No `security`
# key is written here on purpose.
#
# Two DIFFERENT error bodies exist in this domain and they are NOT interchangeable:
#   * writeError() (backend/api/handlers_settings.go:371) -> Content-Type: application/json,
#     body {"error": "<msg>"}  -> schema ErrorResponse
#   * http.Error() (net/http) -> Content-Type: text/plain; charset=utf-8, body is the
#     message plus a trailing "\n" -> schema PlainTextError
# Each operation below records which one it actually emits.
#
# The 401 produced by the requireAuth middleware itself (middleware.go:36-52) is a
# special case: the handler sets Content-Type: application/json, but http.Error
# overwrites it with text/plain; charset=utf-8 while the body stays the JSON literal
# `{"error":"unauthorized"}\n`. That is modelled as MiddlewareUnauthorized.

paths:
  /api/calendar/events:
    get:
      operationId: listCalendarEvents
      tags: [calendar]
      summary: List Google Calendar events in a time window
      description: >-
        Reads the authenticated user's primary Google calendar
        (calendar.CalendarClient.CalendarID, hardcoded to "primary" in
        backend/calendar/client.go) and flattens each event into the frontend-facing
        CalendarEvent shape. Room resource attendees
        (`*@resource.calendar.google.com`) are dropped from both `attendees` and
        `attendee_details`.
      parameters:
        - name: start
          in: query
          required: true
          description: >-
            Window start. Parsed with time.Parse(time.RFC3339, ...). Missing or
            unparseable -> 400. There is no default, so it is effectively required.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: >-
            Window end. Parsed with time.Parse(time.RFC3339, ...). Missing or
            unparseable -> 400.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Events in the window. Always a JSON array, `[]` when empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: >-
            `invalid start param` or `invalid end param`. Emitted with http.Error,
            so the body is plain text, not JSON.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PlainTextError"
        "401":
          $ref: "#/components/responses/CalendarNotConnected"
        "500":
          description: >-
            Google Calendar API error, or the stored credential could not be read. Body:
            `{"error":"internal error"}`. The detail is written to the server log and Sentry
            only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/calendar/freebusy:
    get:
      operationId: getCalendarFreeBusy
      tags: [calendar]
      summary: Raw Google free/busy lookup for the caller's own calendar and a comma-separated attendee list
      description: >-
        Google only (an Outlook-only user gets the 401 `calendar not connected`).
        One Google `freebusy.query` call covers the caller's own calendar (Google's
        `primary`), which the server ALWAYS adds, plus every element of `attendees`
        (PAC-133 §3.3 item 1, D-6). A request therefore never asks the provider
        about zero calendars.


        **Outcomes (PAC-133 §3.1, D-1).** Every calendar in the answer is either
        `known` (readable: its busy windows are complete, possibly none) or
        `unknown` (the provider reported an error for it, did not mention it, or
        its group expansion failed). An `unknown` calendar carries the busy
        windows the provider DID report for it, when there are any, and no `busy`
        member otherwise: an unknown calendar is never shown with an empty busy
        list, so `[]` always means "readable and free". `unknown` means "not
        checked", never "free". A Google group address is answered with its
        expansion: `group.members` lists the calendars it expanded into with
        their own outcomes, and the group's own `busy` carries every window its
        members reported. The group is `known` only when its expansion has no
        error and every member is `known`.


        **The blocking rule (PAC-133 D-11, binding on every consumer).** A
        reported busy window blocks wherever it appears, whatever the outcome of
        the calendar that carries it (known, unknown, or a group's member). An
        `unknown` calendar with no reported windows blocks nothing, and is never
        presented or used as free.


        **Order of answers.** `start` and `end` must parse as RFC3339 (400
        `invalid start param` / `invalid end param`), then `end` must be after
        `start` (400 `end must be after start`, PAC-133 D-4, API-077/SF-034).
        All three 400s come BEFORE the credential is loaded, so a caller with no
        Google credential sending a bad or inverted window gets the 400, not the
        401. Then the credential (401 / 500), then the one provider call (a
        failed call is the 500). The caller's own calendar being unknown is NOT
        a 500: it is `own.status: unknown` in a 200.


        Consumer: the MCP tool `clockwise_find_free_slots`, which relays the
        body as text (contracts/features/PAC-133.md §6.1). No web code calls
        this operation. PAC-133 changed the 200 shape (it was
        `map[string][]calendar.TimeSlot` keyed by the id Google echoed, with an
        unreadable address shown as `[]` and an unmentioned one absent; SF-032,
        SF-102). Window keys stay `start` / `end` (PAC-26). U-03 stays resolved
        as "keep" (assumed by the factory for PAC-21, pending owner
        confirmation; PAC-133 OQ-2).
      parameters:
        - name: start
          in: query
          required: true
          description: RFC3339. Missing or unparseable -> 400.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: >-
            RFC3339. Missing or unparseable -> 400. Not after `start` (equal or
            earlier) -> 400 `end must be after start`, before the credential is
            loaded and with no provider call (PAC-133).
          schema:
            type: string
            format: date-time
        - name: attendees
          in: query
          required: false
          description: >-
            Comma-separated addresses, split on "," with no trimming, no
            lowercasing and no validation. Each distinct element is asked of
            Google and appears once in `calendars`, in first-appearance order,
            spelled exactly as sent. Absent or empty: no attendee, and the answer
            still carries `own`. Never needed for the caller's own calendar: the
            server adds it.
          schema:
            type: string
          example: alice@example.com,bob@example.com
      responses:
        "200":
          description: >-
            The caller's own calendar under `own`, and one entry per requested
            attendee under `calendars` (none absent, none added: a calendar
            Google answered that is neither requested nor a member of a
            requested group is dropped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawFreeBusyAnswer"
        "400":
          description: >-
            Plain text (http.Error), in this order: `invalid start param`,
            `invalid end param`, `end must be after start`. All three come
            before the credential is loaded and before any provider call.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PlainTextError"
        "401":
          $ref: "#/components/responses/CalendarNotConnected"
        "500":
          description: >-
            The Google free/busy call failed as a whole, or the stored credential could
            not be read. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21). A per-calendar error, including on the
            caller's own calendar, is never this 500: it is `unknown` in the 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/freebusy:
    post:
      operationId: queryFreeBusy
      tags: [calendar]
      summary: Participant free/busy with coverage classification
      description: >-
        Backed by engine.FreeBusyService, with the requester's own Google or Outlook
        credential (PAC-67). Emails on known consumer domains (gmail.com,
        googlemail.com, outlook.com, hotmail.com, yahoo.com, icloud.com, live.com,
        msn.com, proton.me, protonmail.com) are never queried and come back with
        coverage/status "unknown" and an empty busy list. Emails are lowercased and
        trimmed before lookup. One provider call per request, under a 5 s timeout;
        a timeout or a failed call makes every queried address "unknown" rather
        than an error.


        **Coverage (PAC-133 §3.2, SF-032).** An address is `known` only when the
        provider answered it without error (a Google group: its expansion and
        every member). It is `unknown` when the provider reported an error for
        it, did not mention it, or the call failed. An `unknown` address carries
        the busy windows the provider DID report for it (a partial answer, or a
        group's readable members), possibly none; those windows block like any
        other (PAC-133 D-11). `unknown` never means free. The same status and
        windows appear in all three views (`participants`, `busy`, `results`).


        **Cache (PAC-133 §3.2 items 2-4, D-2, D-3; SF-033).** A result is reused
        only for the same requester, the same (lowercased) address and the same
        range, start and end both equal as instants; any other range is asked of
        the provider. Entries live 15 minutes, `unknown` cached exactly as
        `known`. Nothing is cached from a call made while the requester's
        credential is recorded as lost (PAC-67 AC-20). A lookup cut short by its
        own request's deadline (budget expiry, or the client gone) is outside
        this contract (PAC-133 spec §5): PAC-129 §6 rules it, and under that
        rule such a lookup is never cached. The cache is
        a least-recently-used cache of at most 10,000 entries per server process:
        adding one past the maximum evicts the least recently used; an expired
        entry is never served and is removed when found or evicted. Personal
        domains are never cached (no call is made for them).
        The response carries the same data three times for backwards compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreeBusyQueryRequest"
      responses:
        "200":
          description: Free/busy result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeBusyQueryResponse"
        "400":
          description: >-
            JSON error (writeError). In this order: `invalid JSON` (fixed text: the
            decoder's error is not appended, PAC-21), `emails is required` (empty or
            missing array), `max 20 emails per request`, `start_time must be RFC3339`,
            `end_time must be RFC3339`, `end_time must be after start_time` (PAC-133:
            the end equal to or before the start; API-077, SF-034). Every 400 comes
            before the cache and before any provider call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            `{"error":"unauthorized"}` as JSON via writeError when the user id is
            missing from the request context, or MiddlewareUnauthorized from the
            middleware (text/plain content type).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            engine.FreeBusyService.Query failed - in practice only a settings-read failure.
            Body: `{"error":"internal error"}`. The detail is written to the server log and
            Sentry only (PAC-21). A provider failure is never this 500 (every queried
            address is `unknown` instead).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          Google Calendar event id, taken verbatim from the URL. Not validated or
          decoded by the handler.
        schema:
          type: string
    patch:
      operationId: patchEvent
      tags: [calendar]
      summary: Partially update a Google Calendar event
      description: >-
        Fetches the event, applies the non-null fields of the body, and writes it back
        with calendar.CalendarClient.UpdateEvent. An ABSENT key and an explicit `null`
        are indistinguishable and both mean "leave unchanged". The field-by-field
        semantics are on EventPatchRequest. In short, since PAC-29: `send_updates`
        is passed to Google (absent means `none`, which is what every PATCH did
        before PAC-29); a bare `YYYY-MM-DD` `start` / `end` keeps the event all-day
        (API-043); `attendees` replaces the non-room guests but keeps each existing
        guest's Google entry (name, RSVP) and every room resource attendee (API-044);
        `room_resource_email` adds that room (API-018); `attendee_details` is
        declared, accepted and ignored (API-018). The 200 body is the event
        UpdateEvent returned, flattened by the same toCalendarEventDTO as
        GET /api/calendar/events: the CalendarEvent DTO (`title`, `start`, `end`,
        `attendees: string[]`, ...), never Google's own keys (`summary`,
        `start.dateTime`, `htmlLink`, `hangoutLink`) (API-017, U-04). Like the list,
        the DTO drops room resource attendees (`*@resource.calendar.google.com`) from
        `attendees` and `attendee_details`, so a room on the event is not visible in
        this body even though PATCH keeps it. Only a Google 404 or 410 from the
        initial GetEvent, or a GetEvent answer whose `status` is `cancelled` (Google
        returns recently deleted events that way), is a 404; any other GetEvent
        failure is a 500 (API-045). Error precedence (PAC-29): checks that need only
        the request come first (`invalid body`, `invalid send_updates`,
        `invalid room_resource_email`: 400), then the stored credential (401 / 500),
        then GetEvent (404 / 500), then the start/end kind check against the stored
        event (400); Google is written only after all of them pass.
        PAC-29: until PAC-29's implementation lands the server still encodes the raw
        google.golang.org/api/calendar/v3.Event, ignores `send_updates`,
        `room_resource_email` and `attendee_details`, decodes `start` / `end` as
        date-times only (a bare date is a 400 `invalid body`) and writes them as
        UTC `dateTime` (converting an all-day event to a timed one), replaces the
        whole attendee list with email-only entries (dropping names, RSVPs and the
        room), maps every GetEvent failure to 404, and writes to a cancelled event
        like any other. This operation describes the server after that PR, not
        before it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPatchRequest"
      responses:
        "200":
          description: >-
            The updated event as the CalendarEvent DTO, the same shape as one element
            of GET /api/calendar/events (PAC-29).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: >-
            Nothing is written to Google. One of these fixed bodies:
            `{"error":"invalid body"}` (the body is not valid JSON, or `start` / `end`
            is neither an RFC3339 date-time nor a `YYYY-MM-DD` date);
            `{"error":"invalid send_updates"}` (a value other than `all` / `none`);
            `{"error":"invalid room_resource_email"}` (non-empty and not a
            `*@resource.calendar.google.com` address);
            `{"error":"start and end must both be dates or both be date-times"}`
            (after applying the patch to the stored event, one of start / end is a
            bare date and the other a date-time, e.g. a date-time `start` alone on an
            all-day event). The last three are PAC-29.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/CalendarNotConnected"
        "404":
          description: >-
            Body: `{"error":"event not found"}` (fixed text; the Google error is not
            appended, PAC-21). Since PAC-29 (API-045) only when GetEvent fails with a
            Google 404 or 410, or returns the event with `status: cancelled` (a
            deleted event; it is not written, so PATCH never restores it); any other
            GetEvent failure (transport, permission, quota) is a 500.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            The Google update call failed, GetEvent failed with anything other than a
            Google 404 / 410 (PAC-29, API-045), or the stored credential could not be
            read. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEvent
      tags: [calendar]
      summary: Delete a Google Calendar event
      description: >-
        Deletes the event from the user's primary calendar. Since PAC-29 the
        `send_updates` query parameter is passed to Google's delete call (API-042),
        and a Google 404 or 410 is a 404 like PATCH (API-045). PAC-29: until PAC-29's
        implementation lands the server reads no query parameter (so guests are never
        notified and an invalid `send_updates` is not rejected) and every delete
        failure, including a missing event, is a 500. This operation describes the
        server after that PR, not before it. Error precedence (PAC-29): an invalid
        `send_updates` is a 400 before the stored credential is read (401 / 500)
        and before any Google call.
      parameters:
        - name: send_updates
          in: query
          required: false
          description: >-
            Whether Google emails the guests about the cancellation. Absent means
            `none`, which is what every DELETE did before PAC-29. Any other value is a
            400 and nothing is deleted.
          schema:
            type: string
            enum: [all, none]
            default: none
      responses:
        "204":
          description: Deleted. Empty body, no Content-Type header set.
        "400":
          description: >-
            `{"error":"invalid send_updates"}`: the query parameter is present and is
            neither `all` nor `none`. Nothing is deleted (PAC-29).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/CalendarNotConnected"
        "404":
          description: >-
            `{"error":"event not found"}`: Google answered the delete with 404 or 410
            (the event does not exist or is already deleted). PAC-29, API-045.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            The Google delete call failed with anything other than 404 / 410, or the
            stored credential could not be read. Body: `{"error":"internal error"}`.
            The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/rooms:
    get:
      operationId: listRooms
      tags: [calendar]
      summary: List Google Workspace room resources
      description: >-
        Enumerates the user's Google CalendarList and keeps entries whose id contains
        `resource.calendar.google.com`, optionally filtered by a case-insensitive
        substring match against the summary or the id. Returns `[]` rather than null
        when nothing matches. `q` is the only parameter the handler reads: there is no
        time-window filter and no availability check, so any other query parameter
        (`start`, `end` included) is ignored and changes nothing; clients send `q` only
        (API-040, PAC-41). Each room is exactly `{id, name}` (CalendarRoom): the server reads no
        building, floor, capacity or availability for a room (API-041; PAC-41 D-1).
        The list reads the caller's stored Google credential whatever `calendar_provider`
        is: a caller with no stored Google credential gets the 401 `calendar not
        connected` (every Outlook-only caller is one); an Outlook-selected caller who also
        holds a Google credential (one who connected Google while signed in, or whose
        Google sign-in reached the same account, PAC-71) gets that Google calendar's
        rooms. A stored Google credential decides this even when it cannot be used: one
        the provider has permanently refused to renew (a PAC-67 loss), one that expired
        with no refresh token, and one that cannot be decrypted (PAC-84) all answer the
        500, never the 401. The credential load and its 401/500 mapping are the ones
        TestPAC84_GoogleUndecryptable pins on `GET /api/calendar/events`; no test pins
        them on this operation. The 401 is shared: a session that has ended answers it
        too, with the `{"error":"unauthorized"}` body (MiddlewareUnauthorized), so a
        client tells "calendar not connected" apart by the body, never by the status.
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Case-insensitive substring filter, lowercased by the handler before
            matching. Absent or empty means no filtering. Not trimmed.
          schema:
            type: string
      responses:
        "200":
          description: Matching rooms, capped only by what Google returns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarRoom"
        "401":
          $ref: "#/components/responses/CalendarNotConnected"
        "500":
          description: >-
            Google CalendarList API error, or the stored Google credential could not be
            read, decrypted or renewed (PAC-67, PAC-84). Body:
            `{"error":"internal error"}`. The detail is written to the server log and Sentry
            only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/attendees/suggest:
    get:
      operationId: suggestAttendees
      tags: [calendar]
      summary: Suggest attendees seen on recent events
      description: >-
        Scans the user's primary calendar over a FIXED 30-day lookback ending now
        (the window is not configurable via query parameters), de-duplicates attendees
        by lowercased email, sorts ascending by the original-cased email, and returns
        at most 20 entries. Unlike GET /api/calendar/events, room resource attendees
        are NOT filtered out here.
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Case-insensitive substring filter matched against the attendee email or
            display name, lowercased by the handler. Absent or empty means no filtering.
          schema:
            type: string
      responses:
        "200":
          description: Up to 20 suggestions. `[]` when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendeeSuggestion"
        "401":
          $ref: "#/components/responses/CalendarNotConnected"
        "500":
          description: >-
            Google Calendar API error, or the stored credential could not be read. Body:
            `{"error":"internal error"}`. The detail is written to the server log and Sentry
            only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/personal-calendars:
    get:
      operationId: listPersonalCalendars
      tags: [calendar]
      summary: List the caller's personal calendars
      description: >-
        Rows from `personal_calendars` owned by the authenticated user, ordered by id
        ascending. Always an array, `[]` when empty.
      responses:
        "200":
          description: Personal calendars.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalCalendar"
        "401":
          description: MiddlewareUnauthorized (text/plain body containing JSON).
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/MiddlewareUnauthorized"
        "500":
          description: >-
            Database error. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createPersonalCalendar
      tags: [calendar]
      summary: Connect a personal calendar
      description: >-
        Inserts a row owned by the authenticated user. `name` defaults to the literal
        string "Personal" when empty or absent. `enabled` has no default handling, so
        an omitted key becomes the Go zero value `false`. `credentials_json` is never
        settable through this endpoint and is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalCalendarCreateRequest"
      responses:
        "201":
          description: Created calendar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCalendar"
        "400":
          description: "`invalid body` (unparseable JSON) or `provider required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/MiddlewareUnauthorized"
        "500":
          description: Insert failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/personal-calendars/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          Personal calendar id. Parsed with strconv.ParseInt(..., 10, 64); a
          non-integer path segment yields 400 `invalid id`. Note the response DTO
          returns this same id as a STRING.
        schema:
          type: integer
          format: int64
    patch:
      operationId: updatePersonalCalendar
      tags: [calendar]
      summary: Rename, re-point or enable/disable a personal calendar
      description: >-
        Applies COALESCE semantics in SQL: a null or absent field leaves the column
        unchanged. `provider` cannot be changed. The UPDATE is scoped by
        `user_id`, so another user's calendar behaves exactly like a missing one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalCalendarPatchRequest"
      responses:
        "200":
          description: Updated calendar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCalendar"
        "400":
          description: "`invalid id` or `invalid body`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/MiddlewareUnauthorized"
        "404":
          description: "`personal calendar not found` — unknown id, or owned by another user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePersonalCalendar
      tags: [calendar]
      summary: Disconnect a personal calendar
      description: >-
        Deletes the row scoped by `user_id`. Note this removes only the
        personal_calendars row; associated personal_blockers rows are not touched by
        this handler.
      responses:
        "204":
          description: Deleted. Empty body.
        "400":
          description: "`invalid id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/MiddlewareUnauthorized"
        "404":
          description: "`personal calendar not found` — nothing was deleted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/personal-calendars/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: previewPersonalCalendar
      tags: [calendar]
      summary: Preview the events a personal calendar would block
      description: >-
        Reads events through engine.PersonalBlocker.Preview over a FIXED window of
        `time.Now().Truncate(24h)` to that value plus 14 days. The window is not
        configurable and Truncate operates on the Unix epoch, so the start is a UTC
        midnight regardless of the caller's timezone. Returns `[]` rather than null
        when the provider yields nothing.

        For a webcal feed, since PAC-122 (SF-044): an event with no DTEND is read
        through its DURATION (or, with neither, as one day for a date and an
        instant for a date-time) instead of being left out; a recurring event
        (RRULE, with RDATE, EXDATE and per-instance overrides) is listed once
        per instance in the window, each with `id` `<UID>/<instance start in UTC,
        YYYYMMDDTHHMMSSZ>` (a non-recurring event keeps its UID), local times
        following the event's TZID across DST changes, and a comma-separated
        EXDATE or RDATE list read value by value with its TZID and VALUE; and an
        event whose time or recurrence cannot be read is not listed (the sync
        keeps any blocker it has rather than reading it as gone). Expansion is
        bounded: FREQ=SECONDLY and MINUTELY are unreadable, a series needing
        more than 100000 occurrences to reach the end of the window is
        unreadable, and a series with more than 500 instances in the window
        lists its first 500 and is otherwise treated as unreadable (the sync
        keeps the blockers of its other instances).
      responses:
        "200":
          description: >-
            Preview events. The element type is calendar.GenericEvent
            (backend/calendar/provider.go), with explicit json tags since PAC-26
            (API-029): keys `id`, `title`, `start`, `end`. Before PAC-26 the struct
            had no tags and the keys were `ID`, `Title`, `Start`, `End`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalCalendarPreviewEvent"
        "400":
          description: "`invalid id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/MiddlewareUnauthorized"
        "404":
          description: >-
            `personal calendar not found`. Also returned when the ownership lookup
            itself errors, since any error from ownedCalendar maps to 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Preview failed (e.g. the webcal/ICS fetch errored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/personal-calendars/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: syncPersonalCalendar
      tags: [calendar]
      summary: Run a personal-calendar sync now
      description: >-
        Runs engine.PersonalBlocker.Sync, stamps `last_synced_at = NOW()`, then
        re-reads and returns the calendar. Takes no request body. The sync writes
        busy blocks into the user's work calendar, so it is calendar-dependent: a
        user with no stored Google credential gets the 401 CalendarNotConnected
        (PAC-21; before, a 500).
      responses:
        "200":
          description: The calendar after syncing; `last_synced_at` is always populated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCalendar"
        "400":
          description: "`invalid id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/CalendarNotConnected"
        "404":
          description: "`personal calendar not found` (before or after the sync)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            The blocker's Sync returned an error other than "no stored Google
            credential" (for example the personal feed could not be read, or
            reading the credential store failed), or the last_synced_at update
            failed. Since PAC-122 also: the user's settings could not be read
            (SF-021; before, every event was treated as inside work hours), a
            blocker lookup failed (SF-021; before, read as "no blocker" and a
            duplicate was created), or a stale blocker's work-calendar event could
            not be deleted (SF-020; its row is kept so a later sync retries it,
            where before the row was dropped and the event stayed). Body
            `{"error":"internal error"}`. Verified by
            TestPersonalCalendarSyncPropagatesBlockerError.
            "The personal feed could not be read" includes, since PAC-81 (spec
            AC-A17), a feed fetch over its 15 s limit or a feed over 10 MiB: no
            blocker is created from a partial feed and `last_synced_at` is not
            stamped; the log names which limit was hit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The request budget ran out before every blocker was created (PAC-81,
            spec AC-A2, AC-A17). Creates run on at most 4 concurrent workers, and
            a create starts only while its full 15 s limit plus the 10 s stop
            margin remain, so no create is cut short. Every create whose provider
            answer arrived is recorded and kept; `last_synced_at` is NOT stamped.
            Running the sync again (or the next scheduled run) creates the
            remaining blockers without duplicating recorded ones. Residual: a
            create that fails on its own 15 s limit after the provider accepted
            it is not recorded, so a re-run creates that blocker again. Shared
            body `{"error":"request timed out"}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestBudgetExpiredError"

  /api/org/members:
    get:
      operationId: listOrgMembers
      tags: [calendar]
      summary: List users in the caller's organization
      description: |-
        Returns the accounts that BELONG to the caller's organisation (the
        organisation membership rule below), the caller included, ordered by
        `created_at` ascending. A caller that belongs to no organisation gets
        `[]`.

        **Organisation membership (PAC-148, spec §3.1, §3.2, D-1, D-3; contract
        `contracts/features/PAC-148.md` §2).** This is the one statement of the
        rule; every other operation that answers or acts on membership points
        here. An account belongs to an organisation only while all three hold:
        (1) its `addressStanding` is `domain_confirmed` (PAC-71: the identity
        provider that bound it is the domain's own: Google Workspace for that
        domain, an Entra tenant that verified it, or the domain's SSO issuer);
        (2) the domain of its stored address is not on the consumer list (the
        running release's generic-domain list, which PAC-148 extends with
        Microsoft's personal-account domains); and (3) the organisation's stored
        domain equals the domain of its stored address, exactly. The domain of
        an address is the text after its first `@`, with surrounding Unicode
        white space removed and lower-cased (none when there is no `@`): the
        derivation that named the organisation when it was created.
        Every other account belongs to NO organisation, whatever association is
        stored (by an older release, an operator step, a fixture or a restore
        rehearsal). The rule is applied at every read, by every operation that
        answers or acts on membership: this list (and so rule (b) of the
        Manager visibility rule, ManagerRosterMember.is_paceday_user),
        getCurrentUser's `org`, `AIStatus.inOrganization`, getOrganizationAI,
        patchOrganizationAI, confirmOrganizationAI, every AI call that would use
        the organisation's AI (the parse, including MCP's parse tool through
        it, a meeting-brief refresh, the provider probe), listSsoProviders,
        createSsoProvider, deleteSsoProvider, startSsoAdminStepup,
        getSsoStepupOptions and ssoAdminStepupCallback. An account that does not
        belong is answered exactly as an account with no organisation: `[]`
        here, no `org`, `inOrganization` false, the membership 403
        (SsoWriteMembershipRequired), no use of the organisation's AI or
        policy, `state_mismatch` at the step-up callback.
        After every successful sign-in the stored association is brought in
        line: an account that qualifies joins its address's domain's
        organisation (created on first join); one that does not leaves any
        organisation, and its organisation-AI confirmations end with it (PAC-87).
        Whether it qualifies is decided from its own standing, address and the
        consumer list before anything keyed on the domain is read, so a caller
        that does not qualify causes no organisation to be looked up or created.
        Before PAC-148 every account joined its address's domain's organisation
        at any standing, unless the domain was on the 21-entry consumer list, so
        anyone signing in with an address at an unlisted consumer provider
        listed every Paceday account there (PAC-130 O-11).

        For a caller that belongs to no organisation the answer, and the work
        done to produce it, are the same whatever accounts exist at its
        address's domain (spec AC-1).

        PAC-130 (spec §3.1, D-1, AC-17): the set of accounts this list returns
        to a caller IS rule (b) of the Manager visibility rule
        (ManagerRosterMember.is_paceday_user): both use one definition, so
        PAC-148's narrowing of this list narrows Manager visibility with it
        (PAC-148 D-9). The Manager read does not take this list's `[]` for a
        missing caller row: a failure to load the caller there is the 500,
        never "no organisation".
      responses:
        "200":
          description: >-
            The accounts that belong to the caller's organisation, or `[]` when
            the caller belongs to no organisation or its users row does not
            exist (an account deleted under a live session, PAC-148 D-8: such an
            account belongs to nothing, so `[]` is the true answer). The `org`
            property is never populated by this endpoint — storage.GetOrgMembers
            does not hydrate it, so it is always omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgMember"
        "401":
          description: >-
            Body is the JSON literal `{"error":"unauthorized"}` but http.Error
            overwrites Content-Type with text/plain; charset=utf-8. Also reachable as
            MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/MiddlewareUnauthorized"
        "500":
          description: >-
            Database error: the caller's users row could not be read (any failure
            other than the row not existing; PAC-148 D-8, API-047, SF-075: before
            PAC-148 this answered `200 []`, indistinguishable from "no
            organisation"), or the member read failed. Never `[]` for a fault.
            Body: `{"error":"internal"}`, served as application/json (until
            PAC-21 was finished it was this same JSON literal with a text/plain
            Content-Type). The detail is written to the server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/audit:
    get:
      operationId: listAuditEntries
      tags: [calendar]
      summary: The calling user's own activity entries
      description: >-
        Returns the calling user's own `audit_log` rows, ordered by
        `created_at DESC, id DESC`. The query is scoped by the authenticated user id
        that `requireAuth` puts in the request context under `auth.UserIDKey`
        (backend/api/middleware.go) and that handlers read back with `userIDFromCtx`
        or `auth.UserIDFromContext`; there is no parameter that widens it, and no
        caller can address another user's entries.


        SERVER BEHAVIOUR SINCE PAC-23 (finding API-005, fixed): `auditHandler`
        (backend/api/handlers_audit.go:13-32) reads the caller from the request
        context and passes it to `storage.ListAuditLog`, whose query is `SELECT id,
        action, details, created_at FROM audit_log WHERE user_id = $1 ORDER BY
        created_at DESC, id DESC LIMIT $2` (backend/storage/audit_log.go:34);
        migration `026_audit_log_user_id` added the `user_id` column, and
        `storage.WriteAuditLog` (backend/storage/focus_blocks.go) records the subject
        at all seven call sites. Before PAC-23 the query had no predicate, the table
        had no user column, and every authenticated caller received every user's
        rows. Falsify with `grep -n "WHERE user_id" backend/storage/audit_log.go`
        and `grep -l audit_log backend/storage/migrations/*` (`001_initial` and
        `026_audit_log_user_id`).


        A NOTE ON CITATIONS, because three revisions of this contract have now been
        rejected for stale ones. Every `file:line` below was re-derived against the
        tree at revision 5 (2026-10-22) **after** regenerating the bundle,
        `backend/api/gen/paceday.gen.go` and the web repo's
        `src/api/generated/{types.ts,schemas.ts,schemas.types.d.ts}`. This description
        is emitted verbatim as a doc comment into `paceday.gen.go` and into
        `types.ts`, and the schema descriptions below into those two and
        `schemas.types.d.ts` as well, so a line number written here is copied into
        generated files in both repos that other features regenerate after every
        contract merge. Four kinds of reference are therefore
        deliberately NOT given as line numbers: anything in
        `backend/api/gen/paceday.gen.go` or in the web repo's `src/api/generated/`
        is cited by **symbol**, because editing this text moves every line it could
        cite; the seven `storage.WriteAuditLog` call sites and the three `requireAuth`
        rejections are cited by **file and enclosing function** with the falsifying
        `grep` beside them, because eleven merges between revisions 4 and 5 moved
        every one of their line numbers while leaving the functions in place;
        anything in `docs/factory/PAC-23-plan.md` is cited by **section**, because
        that document is edited by other features; and anything in either `Makefile`
        is cited by **target**. A bare `file:line` remains only where no symbol
        encloses the claim (a column in a migration, one line of a short handler, a
        constant in the web client). Where a claim is cheap to check by command, the
        command is given instead of or beside the citation.


        Entries recorded before the PAC-23 migration have no subject and are
        therefore returned to **nobody**. They are retained rather than deleted — they
        cannot be attributed, and inferring an audit record's subject after the fact is
        not acceptable (spec §3.3). How "no subject" is represented in storage is the
        migration's business: a conforming server returns an entry only to its
        subject, and an entry with no subject has none. This description deliberately
        no longer spells that predicate `user_id IS NULL`, because the identification
        "no subject ⟺ pre-migration" is exact under only one of two delete actions
        that docs/factory/PAC-23-plan.md §7 item 1 leaves open —
        `ON DELETE CASCADE`, as drafted in that plan's §2 up-migration step 1
        (`ALTER TABLE audit_log ADD COLUMN user_id UUID REFERENCES users(id) ON
        DELETE CASCADE`), keeps it exact, while
        `ON DELETE SET NULL` would give a deleted user's rows the same marker and make
        the sentence false. The contract must not be the artifact that goes stale when
        a plan question resolves. The observable effect is the same either way: on the
        release of PAC-23 every user's log appears to start empty and refills as they
        use the product.


        This log is a **per-user activity feed**, not a security audit trail: it has
        no authentication events, no client address, and no actor field, and it is
        readable only by its subject. Since PAC-67 it records the subject's own
        provider connections being lost or disconnected (CONNECTION ENTRIES below),
        so the subject can see why a connection reads not connected; that does not
        make it an audit trail. See
        docs/specs/PAC-23.md §3.5 — do not build anything on it that needs a third
        party to be able to review it.


        The subject of an entry is whose calendar (or, since PAC-67, whose provider
        connection) it happened to, which is not necessarily who caused it. Every
        entry written by the seven PAC-23 writers has actor = subject, and that is
        true for a narrow reason worth stating: the one path where they differ
        writes no such entry at all. PAC-67 adds the first entries whose actor can
        differ from the subject; see CONNECTION ENTRIES below. `POST /api/book/{slug}` is
        registered outside the `requireAuth` group (backend/api/routes.go:27 —
        `:26` is the `GET .../slots` route, not this one) and
        reaches `calClient.CreateEvent` inside `BookingEngine.ConfirmBooking`
        (backend/engine/booking.go:269), so an
        unauthenticated third party puts a real event on a host's calendar and
        nothing is recorded. If booking is ever recorded — PAC-23 does not add it —
        the subject is the host, which is already in scope as `h.UserID` throughout
        that function's per-host loop (booking.go:244-271, from `GetUserByID` to
        `SaveBookingEvent`); the booker is not a user of this system and gets no
        identity here, because a fabricated actor in a record whose purpose is
        attribution is worse than an absent one (spec §3.2). The feed would then say
        that a meeting appeared on your calendar and would still be unable to say who
        put it there. Do not read the absence of an actor field as a claim that the
        subject acted.


        The scoping guarantees who may READ a row, not that the row's contents
        originated with the reader. `details` carries free text supplied by whoever
        made the request, at four of the seven writers: a meeting title from the
        request body in `SmartScheduler.CreateMeeting` (backend/engine/smart_schedule.go)
        and `scheduleHandlers.createMeeting` (backend/api/handlers_schedule.go), a
        typed prompt in `NLPService.Parse` (backend/nlp/parser.go), and a
        client-supplied `event_id` copied unvalidated from the request body in
        `CompressionEngine.Apply` (backend/engine/compression.go) — the fourth is
        the one the `details` schema below calls the worst of them, because the value
        can carry JSON structure rather than merely a stray quote. So a writer whose
        actor is not the subject would place a third party's words in the subject's
        feed. No writer
        does that today — all seven have actor = subject — but this contract is the
        artifact that makes subject ≠ actor a legal shape, so it states the rule
        rather than leaving the direction unguarded: a writer whose actor is not the
        subject must not put text supplied by the actor in `details`; where that is
        unavoidable the entry needs the redacted projection spec §3.5 describes, not
        this operation. Spec AC-3 forbids only the mirror image, another user's text
        reaching a non-subject.


        CONNECTION ENTRIES (PAC-67, spec PAC-67 AC-8, AC-9, AC-15, AC-16, AC-22 to
        AC-29, D-12, D-13). Three kinds record the lifecycle of the subject's own
        Outlook, Zoom and Google credentials: `connection_lost`,
        `provider_disconnected` and `revocation_unconfirmed` (see `action`). Their
        subject is always the credential's OWNER. A `connection_lost` entry is
        written whenever a renewal of the owner's credential is permanently refused,
        on ANY path that renews it (spec D-13), including paths where the actor is
        not the owner: a teammate's `GET /api/teams/{id}/availability` reading the
        owner's Google calendar, an unauthenticated visitor on
        `GET /api/book/{slug}/slots` or `POST /api/book/{slug}`, and scheduled jobs
        acting for the owner. The entry goes to the owner's log only; the
        requester's log is never written, and nothing in these entries identifies
        the requester or visitor. They obey the rule in the previous paragraph by
        construction: `details` holds only server-chosen enum values (the provider
        and, for a disconnect, the revocation outcome), never text supplied by
        the actor, and never token material. Each LOSS writes exactly one
        `connection_lost` entry: a loss starts at the first permanent refusal of a
        credential that was usable and ends when the owner reconnects or
        disconnects that provider, so further refusals within one loss, and
        concurrent refusals within one backend process, add no entry, while a
        loss of a later, reconnected credential adds a new one (spec AC-9, AC-24,
        AC-25; across several backend processes is spec OQ-9). A temporary failure
        (timeout, network, provider 5xx) never writes one. Disconnects write
        `provider_disconnected`, plus `revocation_unconfirmed` when the revocation
        is not confirmed; the per-case counts are on `disconnectMicrosoft` and
        `disconnectZoom`.


        Like every kind in this log, these entries are written BEST-EFFORT
        (`storage.WriteAuditLog`, backend/storage/focus_blocks.go: a failed insert
        is written to the server log and never fails the caller). Each is written
        after the outcome it records is known, so a failed insert cannot change a
        response: a disconnect still answers its 200, and a loss is still recorded
        and still reported on the status surfaces, which do not read this log. The
        counts above are therefore what is WRITTEN when the insert succeeds; an
        entry whose insert failed is not retried, and its loss or disconnect then
        has no entry (contract challenge finding 2). The response of a disconnect,
        and the status surfaces for a loss, are the authoritative record.


        There is no pagination — no `offset`, no cursor, no `before`. Entries older
        than the most recent `limit` (at most 500) cannot be retrieved through this API
        at all, and because this operation is the only reader of the table in the whole
        codebase (one SELECT, in `storage.ListAuditLog`, backend/storage/audit_log.go;
        one INSERT, in `storage.WriteAuditLog`, backend/storage/focus_blocks.go; no
        view, no join, no second reader) they
        cannot be retrieved any other way either.


        WHICH SERVER ANSWERS THIS (rewritten by PAC-53, spec §3.4 and AC-12; the
        PAC-23 text said that no generated server code was mounted anywhere and
        cited routes.go:180, and both had been false since PAC-67): the
        hand-written `auditHandler` (backend/api/handlers_audit.go), registered
        directly on chi inside the `requireAuth` group at backend/api/routes.go:216
        at f074b4d (`grep -n '"/api/audit"' backend/api/routes.go` finds that one
        line wherever it moves). The generated strict server IS mounted for other
        operations (see `contracts/openapi/MIGRATION.md`), but not for this one,
        and the falsifying command is scoped to this operation:
        `grep -rn "ListAuditEntries" --include=*.go backend/ | grep -v
        "^backend/api/gen/" | grep -v "_test\.go:"` returns nothing: no
        non-generated, non-test Go code refers to any generated symbol of this
        operation. `backend/api/gen/paceday.gen.go` (generated from this bundle,
        committed, drift-checked by the `openapi-check` make target) still contains
        a complete, unmounted server surface for it (`ServerInterface.ListAuditEntries`,
        `ListAuditEntriesParams`, `ServerInterfaceWrapper.ListAuditEntries`, the
        strict handler's `ListAuditEntries` and its `ListAuditEntries…Response`
        types). `contracts/openapi/MIGRATION.md` records this operation as
        `handwritten`; PAC-53 does not move it.


        ON MIGRATION TO THE GENERATED SERVER. The `limit` rule belongs to the
        operation, not to one implementation: it holds, with the same status, body
        and precedence, however the operation is served. A migrating author will
        follow the repo's actual pattern, which is NOT `ServerInterfaceWrapper`: a
        chi-mounted hand-written function parses its own parameters (refusing bad
        ones with `writeError`), fills the generated `…Params` struct, and calls
        `gen.NewStrictHandlerWithOptions(...).<Operation>(w, r, params)`; see
        `getStepupOptions` in backend/api/handlers_sso_stepup.go. Under that
        pattern the generated binder never runs, so the hand-parsing code is the
        whole of the validation and must carry EVERY row of the `limit` rule
        (C-1 to C-10); parsing `limit` more loosely there reintroduces PAC-53. If
        `ServerInterfaceWrapper.ListAuditEntries` were adopted instead, its
        `runtime.BindQueryParameter` call already refuses C-2, C-3, the
        int64-overflowing part of C-7 and C-8, and the handler behind it must refuse
        C-5, the in-range part of C-7 and C-9. Three residual differences between
        that wrapper and this contract are recorded here rather than left implicit:
        (1) its default `ErrorHandlerFunc` (set in `HandlerWithOptions`) is
        `http.Error(..., http.StatusBadRequest)`, text/plain carrying the binder's
        error text, not the fixed JSON body declared below, so adopting it means
        installing an error handler that writes that body; (2) C-9 is invisible to
        the binder, because `r.URL.Query()` silently drops undecodable and
        `;`-carrying pairs before binding, so the handler behind it must check the
        raw query itself; (3) it binds `limit` BEFORE running `HandlerMiddlewares`,
        so if authentication were a wrapper middleware an unauthenticated
        `?limit=abc` would get 400 instead of 401; a correct configuration
        authenticates before binding, as `requireAuth` on the chi group does
        today. Generated symbols are cited by name, never by line, because this
        paragraph is emitted into the generated files.
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of entries to return. PAC-53 replaced PAC-23's five-case
            resolution table, under which every input resolved to some number and
            none was refused, with ONE RULE: the request either says nothing about
            `limit`, or says it exactly once as a whole number from `minimum` to
            `maximum`; every other request is refused with the `400` declared on
            this operation, and the server never substitutes a number the caller did
            not ask for. The rule is examined only after authentication: an
            unauthenticated request gets the `401` whatever its query.


            FIRST, THE QUERY AS A WHOLE. C-9: if the raw query string contains an
            unencoded `;` anywhere (as a separator or inside a value), or any `%`
            sequence that does not URL-decode, under ANY parameter name, the request
            is refused; equivalently, `url.ParseQuery` on the raw query returns an
            error. Examples: `?limit=%zz`, `?limit=%zz&limit=10`, `?x=%zz&limit=10`,
            `?limit=10;x=1`, `?x=a;b&limit=10`. This is checked before anything
            else, so `?limit=%zz` is refused, not treated as absent; and it refuses
            the whole request rather than ignoring the bad pair because the server
            cannot tell whether that pair was `limit` (`%6Cimit` is `limit`). It
            applies to this operation only.


            THEN `limit` ITSELF, matched by its exact, case-sensitive name after
            URL-decoding (`?%6Cimit=5` is `?limit=5`):

            C-1 absent: `default`, 50 entries at most.

            C-2 present with an empty value (`?limit=`) or bare (`?limit`):
            refused.

            C-3 not a base-10 integer: letters, decimals, exponents, `0x…`,
            underscores, any internal or surrounding whitespace, including a raw
            `+`, which URL-decodes to a space (`?limit=abc`, `?limit=50.5`,
            `?limit=1e2`, `?limit=0x10`, `?limit=1_0`, `?limit=+50`,
            `?limit=%2050`, `?limit=50%20`): refused.

            C-4 an optional single leading `+` or `-` followed by one or more ASCII
            digits, leading zeros allowed (`?limit=%2B50`, `?limit=050`): read as
            that integer, then C-5 to C-7.

            C-5 an integer below 1 (`0`, `-0`, `-5`, and any negative value
            however large, `-9223372036854775809` included): refused.

            C-6 an integer from 1 to 500 inclusive: at most that many entries.
            This is the conforming request and the only one the shipped web client
            sends (50 from the activity page, 10 from the quick-actions preview).

            C-7 an integer above 500, whether or not it fits in 64 bits (`501`,
            `10000`, `9223372036854775807`, `99999999999999999999`): refused, not
            capped (PAC-53 decision D-5, superseding PAC-23 AC-11).

            C-8 `limit` supplied more than once, even with identical values
            (`?limit=10&limit=500`, `?limit=10&limit=10`): refused.

            C-10 every other parameter, including a differently-cased `LIMIT`, is
            ignored (subject to C-9).


            Every refusal is the same response: status 400, `Content-Type:
            application/json`, body exactly `{"error":"limit must be an integer
            from 1 to 500"}`, which never contains the submitted text, and no
            entries. `minimum`, `maximum` and `default` below are therefore the
            whole of what is accepted (C-1 and C-6), not a hint about it.


            THE DEFAULT AND THE WEB CLIENT (from PAC-23, finding API-074, fixed).
            The web client states the same 50 by hand (`DEFAULT_AUDIT_LIMIT` in
            `smart-calendar-flow/src/api/client.ts`) because neither pinned frontend
            generator hands `default` over as a value: in the committed
            `src/api/generated/types.ts` the `listAuditEntries` query type is
            `limit?: number` with the default surviving only as prose, and
            `src/api/generated/schemas.ts` (`--schemas-only`) emits component
            schemas only. Its literal is pinned against this `default` by test; see
            contracts/features/PAC-23.yaml `consumersAffected`.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: >-
            The caller's own audit entries. ALWAYS a JSON array — `[]` when they have
            none, never `null`. The bundle is `openapi: 3.1.0`, where `type: array`
            already excludes `null`, so a `null` body is non-conforming and spec AC-2
            is expressible; what makes it true at runtime is the single line
            `entries := make([]AuditEntry, 0)` in `storage.ListAuditLog`
            (backend/storage/audit_log.go:40), and `var entries []AuditEntry` in
            place of the `make` would emit `null` and break this guarantee.
            Stated here because the empty case is the release-day case for every user:
            `[]` is also what a user sees for activity recorded before the PAC-23
            migration.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "400":
          description: >-
            PAC-53. The request breaks the `limit` rule stated on that parameter:
            the raw query carries an unencoded `;` or an undecodable `%` sequence
            anywhere (C-9), or `limit` is empty or bare, not a base-10 integer,
            below 1, above 500 (int64 overflow included), or supplied more than
            once. One fixed body for every case,
            `{"error":"limit must be an integer from 1 to 500"}` (writeError,
            `Content-Type: application/json`); it never echoes the submitted text,
            and no entries are returned. Authentication comes first: a request that
            is both unauthenticated and malformed gets the 401.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: MiddlewareUnauthorized.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/MiddlewareUnauthorized"
        "500":
          description: >-
            Query failed. Body: `{"error":"internal error"}`. The detail is written to the
            server log and Sentry only (PAC-21).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  responses:
    CalendarNotConnected:
      description: >-
        Either the requireAuth middleware rejected the request (text/plain,
        MiddlewareUnauthorized), or the session is valid but the caller has no stored
        Google Calendar credential, so an operation that must read or write their
        calendar cannot run. The second case is application/json with the exact body
        `{"error":"calendar not connected"}`: no provider, Go or storage error text and
        no user id (PAC-21, API-054). A failure to READ the credential store is not
        this response; it is the operation's 500. The two cases are told apart by
        Content-Type, or by the body. The web app's Dashboard decides "not connected"
        from GET /api/auth/status, not from this 401; no web code signs the user out on
        this 401 (only a 401 on GET /api/auth/me does).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalendarNotConnectedError"
        text/plain:
          schema:
            $ref: "#/components/schemas/MiddlewareUnauthorized"

  schemas:
    # ---------------------------------------------------------------- errors

    CalendarNotConnectedError:
      type: object
      description: >-
        The JSON error envelope for "this user has no calendar connected". The message
        is a single fixed value so a client can branch on it.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: ["calendar not connected"]

    ErrorResponse:
      type: object
      description: >-
        The shared JSON error body produced by writeError
        (backend/api/handlers_settings.go:371). Exactly one key.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: >-
            Human-readable, server-chosen message. Never the text of a Go, driver or
            provider error (PAC-21): those go to the server log and Sentry only.

    PlainTextError:
      type: string
      description: >-
        Body produced by net/http's http.Error: the message followed by a newline,
        served as `text/plain; charset=utf-8` with `X-Content-Type-Options: nosniff`.
        It is NOT JSON, so a client that blindly JSON-parses error bodies will throw.
      example: "invalid start param\n"

    MiddlewareUnauthorized:
      type: string
      description: >-
        A JSON literal delivered with a text/plain Content-Type, because the handler
        sets application/json and http.Error then overwrites the header. Every
        producer of this exact body in backend/api/ is an `http.Error` with the
        literal `{"error":"unauthorized"}`: the three in `requireAuth`
        (backend/api/middleware.go — one per rejection reason: no token, a token
        that fails `auth.ValidateToken`, a `UserID` claim that is not a UUID; cited
        by function because this description is emitted into generated files in
        both repos),
        `orgHandlers.members` (backend/api/handlers_org.go:21), and
        `meHandlers.me` (backend/api/handlers_me.go:19, reached at
        `GET /api/auth/me`). The falsifying command, excluding the generated package,
        is `grep -rn error.:.unauthorized --include=*.go backend/api/`, which returns
        exactly those five lines.
        Since PAC-71 the same bytes are also written, with the same headers, for a
        session whose `gen` claim is not the account's current session generation: by
        `requireAuth` and by the in-request re-check on account data (security scheme
        `bearerAuth`, SESSION GENERATION). The grep then also returns those producers;
        the response itself is unchanged.
        The third is listed for completeness only: `getCurrentUser` declares its 401
        against `PlainTextError`, not this schema, and lives in paths/auth.yaml, which
        PAC-23 does not own and does not touch.


        Precisely, because PAC-23 AC-12 requires this response to be unchanged: as
        net/http's `http.Error` produces it the header is
        `text/plain; charset=utf-8`, `X-Content-Type-Options: nosniff` is set, and the
        message is written with `Fprintln`, so the body is 25 bytes — the example
        below, trailing newline included. The two headers are stated here because the
        sibling `PlainTextError` states them and "exactly as today" includes them.


        The trailing newline is part of the VALUE a generated handler must supply.
        oapi-codegen's per-operation `…401TextResponse` types set
        `Content-Type: text/plain` with no charset, do not set `nosniff`, and write
        the value verbatim without appending anything (see
        `ListAuditEntries401TextResponse` in backend/api/gen/paceday.gen.go; cited by
        symbol because this description is emitted into that file). A handler adopting
        the generated interface must therefore include the `\n` in the string and set
        both headers itself, or its 401 is not byte-identical to the middleware's.
      example: "{\"error\":\"unauthorized\"}\n"

    # ------------------------------------------------------- calendar events

    CalendarEvent:
      type: object
      description: >-
        api.calendarEventDTO, built by toCalendarEventDTO — the flattened event shape
        returned by GET /api/calendar/events (one per array element) and, since
        PAC-29, as the whole 200 body of PATCH /api/events/{id},
        POST /api/schedule/create and POST /api/nlp/confirm. One converter, so the
        four operations cannot disagree about the same event.
      required: [id, title, start, end]
      properties:
        id:
          type: string
          description: Google Calendar event id. Always present as a key; may be "".
        title:
          type: string
          description: Google `summary`. Always present as a key; may be "".
        start:
          type: string
          description: >-
            Either an RFC3339 date-time (timed event, Google `start.dateTime`,
            preserving the event's original UTC offset) OR a bare `YYYY-MM-DD` date
            (all-day event, Google `start.date`). Callers must handle both. Empty
            string when Google returned no start at all.
          examples:
            - "2026-05-01T10:00:00+02:00"
            - "2026-05-01"
        end:
          type: string
          description: Same dual format as `start`. For all-day events this is the exclusive end date.
          examples:
            - "2026-05-01T10:30:00+02:00"
            - "2026-05-02"
        color:
          type: string
          description: >-
            Hex colour mapped from Google's numeric `colorId` via a fixed 11-entry
            table. Omitted when the event has no colorId or an unrecognised one.
          enum:
            - "#7986CB"
            - "#33B679"
            - "#8E24AA"
            - "#E67C73"
            - "#F6BF26"
            - "#F4511E"
            - "#039BE5"
            - "#3F51B5"
            - "#0B8043"
            - "#D50000"
            - "#616161"
        attendees:
          type: array
          description: >-
            Attendee emails with room resources (`*@resource.calendar.google.com`)
            removed. Omitted entirely when the event has no non-resource attendees.
          items:
            type: string
            format: email
        attendee_details:
          type: array
          description: Parallel to `attendees`, same ordering and same filtering. Omitted when empty.
          items:
            $ref: "#/components/schemas/CalendarEventAttendee"
        is_personal_block:
          type: boolean
          description: >-
            `true` when the event is a "[Personal] Busy" blocker that the
            personal-calendar sync put on the work calendar: it carries the
            private extended property `paceday_personal_blocker=1` (set on every
            blocker since PAC-122), or, for a blocker created before that, both
            the blocker's title `[Personal] Busy` and its description
            `Auto-created personal time blocker`. Omitted otherwise (`omitempty`;
            never `false`), on every response that carries this schema (the
            events list, PATCH /api/events/{id}, POST /api/schedule/create and
            POST /api/nlp/confirm). Before PAC-122 (SF-035, API-076) the field was
            never set, so it was always omitted and the web gave blockers meeting
            controls; that resolves the x-uncertain this property carried.
        description:
          type: string
          description: Omitted when empty.
        location:
          type: string
          description: Omitted when empty.
        conference:
          $ref: "#/components/schemas/CalendarEventConference"

    CalendarEventAttendee:
      type: object
      description: api.attendeeDTO.
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          description: Google `displayName`. Omitted when empty.
        rsvp:
          type: string
          description: >-
            Mapped from Google `responseStatus`. Anything other than
            accepted/declined/tentative — including Google's `needsAction` and an
            empty value — collapses to `pending`. Because `pending` is a non-empty
            string it is always emitted despite the omitempty tag.
          enum: [accepted, declined, tentative, pending]
        organizer:
          type: boolean
          description: Omitted when false.

    CalendarEventConference:
      type: object
      description: >-
        api.conferenceDTO. Populated from `hangoutLink` first; otherwise from the
        conferenceData entry point or the Paceday-private extended properties.
      required: [provider, url]
      properties:
        provider:
          type: string
          description: >-
            `google_meet` when derived from a Google hangout link or conference entry
            point, otherwise whatever string was stored in the event's private
            extended properties by the conferencing handlers (e.g. `zoom`, `custom`).
            Not constrained by an enum in Go.
        url:
          type: string
          format: uri
        label:
          type: string
          description: >-
            "Google Meet" for hangout links, otherwise the provider string uppercased
            (e.g. "ZOOM", "CUSTOM"). Omitted when empty.

    EventPatchRequest:
      type: object
      description: >-
        Body of PATCH /api/events/{id}. Every field is optional; null or absent leaves
        the corresponding part of the event unchanged. Since PAC-29 the schema declares
        every key the web client sends (`send_updates`, `room_resource_email`,
        `attendee_details`, API-018). The server's decoder still ignores undeclared
        keys; the contract forbids them so a generated client cannot send a key that
        would be a silent no-op.
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
          description: Maps to Google `summary`. Null or absent leaves it unchanged.
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        start:
          type: string
          nullable: true
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2}))?$'
          description: >-
            Either an RFC3339 date-time, written as Google `start.dateTime` in UTC
            (the event becomes or stays timed), or a bare `YYYY-MM-DD` date, written
            as Google `start.date` (the event becomes or stays all-day). The same dual
            format as CalendarEvent.start, so a client can write back what it read.
            PAC-29, API-043: before PAC-29 only a date-time was accepted and an
            all-day event was always converted to a timed one. After applying the
            patch, start and end must be of the same kind or the request is a 400.
          examples:
            - "2026-05-01T10:00:00Z"
            - "2026-05-01"
        end:
          type: string
          nullable: true
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2}))?$'
          description: >-
            Same handling as `start`. For a bare date this is Google's exclusive end
            date, as in CalendarEvent.end.
          examples:
            - "2026-05-01T10:30:00Z"
            - "2026-05-02"
        attendees:
          type: array
          nullable: true
          description: >-
            Replaces the event's NON-ROOM attendees with this list (emails compared
            case-insensitively, duplicates collapsed). An email already on the event
            keeps its existing Google attendee entry (display name, RSVP, organizer,
            optional); a new email is added as an email-only entry. Room resource
            attendees already on the event (`resource: true` or
            `*@resource.calendar.google.com`) are always kept, so writing back the
            list GET /api/calendar/events returned (which omits rooms) does not drop
            the room. `[]` removes every non-room attendee. The two room rules differ
            on purpose: the DTO hides only the `*@resource.calendar.google.com`
            suffix, so a `resource: true` attendee without that suffix is shown as an
            ordinary guest, yet PATCH still keeps it if the client leaves it out. The
            difference can only keep an attendee, never drop one. PAC-29, API-044: before
            PAC-29 this replaced the whole list with email-only entries, dropping
            names, RSVPs and the room.
          items:
            type: string
            format: email
        send_updates:
          type: string
          nullable: true
          enum: [all, none]
          description: >-
            Passed to Google's update call as `sendUpdates`: `all` emails the guests
            about the change, `none` does not. Null or absent means `none`, which is
            what every PATCH did before PAC-29. Any other value is a 400 and nothing
            is written. PAC-29, API-018.
        room_resource_email:
          type: string
          nullable: true
          pattern: '^$|^[^@\s]+@resource\.calendar\.google\.com$'
          description: >-
            A Google room resource calendar address (as returned by GET /api/rooms).
            When non-empty and not already an attendee, the room is added as a
            resource attendee. Rooms already on the event are kept: this endpoint
            never removes a room (PAC-29 decision D-6). Null, absent or `""` leaves the
            rooms unchanged. A non-empty value that is not a
            `*@resource.calendar.google.com` address is a 400. PAC-29, API-018.
        attendee_details:
          type: array
          nullable: true
          description: >-
            Accepted and ignored by the server. Declared because the web client sends
            it alongside `attendees` on every edit (API-018). Who attends comes from
            `attendees`; existing attendees keep their names and RSVPs from Google
            (see `attendees`); a client never sets another person's RSVP. PAC-29
            decision D-7.
          items:
            type: object
            additionalProperties: true

    # ------------------------------------------------------------- free/busy

    RawFreeBusyAnswer:
      type: object
      description: >-
        200 of GET /api/calendar/freebusy (PAC-133). `own` is the caller's own
        calendar (Google `primary`), always read and identified by its key, never
        by an address. `calendars` has exactly one entry per distinct requested
        attendee, in first-appearance order. Outcome and blocking rules: the
        operation's description (PAC-133 §3.1, D-11).
      required: [own, calendars]
      additionalProperties: false
      properties:
        own:
          $ref: "#/components/schemas/RawFreeBusyOwnCalendar"
        calendars:
          type: array
          items:
            $ref: "#/components/schemas/RawFreeBusyCalendar"

    RawFreeBusyOwnCalendar:
      description: >-
        The caller's own calendar. Exactly one variant applies, told apart by
        `status` alone (disjoint enums; the PublicBookingConflict pattern).
      oneOf:
        - $ref: "#/components/schemas/RawFreeBusyOwnKnown"
        - $ref: "#/components/schemas/RawFreeBusyOwnUnknown"

    RawFreeBusyOwnKnown:
      type: object
      description: The caller's own calendar, readable. `busy` is complete; `[]` means free.
      required: [status, busy]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [known]
          x-enum-varnames: [RawFreeBusyOwnStatusKnown]
        busy:
          type: array
          items:
            $ref: "#/components/schemas/RawGoogleBusyWindow"

    RawFreeBusyOwnUnknown:
      type: object
      description: >-
        The caller's own calendar, not readable (Google reported an error for
        it, or did not mention it). Not checked, never free. `busy` is present
        only when Google reported windows anyway, and then is non-empty; those
        windows block.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [unknown]
          x-enum-varnames: [RawFreeBusyOwnStatusUnknown]
        busy:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RawGoogleBusyWindow"

    RawFreeBusyCalendar:
      description: >-
        One requested attendee. Exactly one variant applies, told apart by
        `status` alone (disjoint enums). Group members use RawFreeBusyMember.
      oneOf:
        - $ref: "#/components/schemas/RawFreeBusyCalendarKnown"
        - $ref: "#/components/schemas/RawFreeBusyCalendarUnknown"

    RawFreeBusyCalendarKnown:
      type: object
      description: >-
        A readable calendar: `busy` is complete, `[]` means free. For a group,
        its expansion had no error and every member is known; `busy` is every
        window its members reported.
      required: [address, status, busy]
      additionalProperties: false
      properties:
        address:
          type: string
          description: The attendee exactly as sent (an element of `attendees`).
        status:
          type: string
          enum: [known]
          x-enum-varnames: [RawFreeBusyCalendarStatusKnown]
        busy:
          type: array
          items:
            $ref: "#/components/schemas/RawGoogleBusyWindow"
        group:
          $ref: "#/components/schemas/RawFreeBusyGroup"

    RawFreeBusyCalendarUnknown:
      type: object
      description: >-
        A calendar Google could not read: an error was reported for it, it was
        not mentioned in the answer, or (a group) its expansion failed or one of
        its members is unknown. Not checked, never free. `busy` is present only
        when windows were reported (a partial answer, or a group's members), and
        then is non-empty; those windows block (PAC-133 D-11). An unknown
        calendar is never shown with an empty busy list.
      required: [address, status]
      additionalProperties: false
      properties:
        address:
          type: string
          description: As on RawFreeBusyCalendarKnown.
        status:
          type: string
          enum: [unknown]
          x-enum-varnames: [RawFreeBusyCalendarStatusUnknown]
        busy:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RawGoogleBusyWindow"
        group:
          $ref: "#/components/schemas/RawFreeBusyGroup"

    RawFreeBusyGroup:
      type: object
      description: >-
        Present only on an address Google answered as a group (its `groups`
        expansion). `members` are the calendars it expanded into, each with its
        own outcome, in Google's order; `[]` when the expansion failed. Members
        are RawFreeBusyMember, which has no `group` property. A member is part of the group's answer,
        not an unrequested extra.
      required: [members]
      additionalProperties: false
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/RawFreeBusyMember"

    RawFreeBusyMember:
      description: >-
        One calendar a group expanded into. Exactly one variant applies, told
        apart by `status` alone (disjoint enums). Neither variant has a `group`
        property, so a nested group cannot be expressed (PAC-133 revision 1.1,
        challenge m-5).
      oneOf:
        - $ref: "#/components/schemas/RawFreeBusyMemberKnown"
        - $ref: "#/components/schemas/RawFreeBusyMemberUnknown"

    RawFreeBusyMemberKnown:
      type: object
      description: A readable group member. `busy` is complete; `[]` means free.
      required: [address, status, busy]
      additionalProperties: false
      properties:
        address:
          type: string
          description: The calendar id Google listed in the group's expansion.
        status:
          type: string
          enum: [known]
          x-enum-varnames: [RawFreeBusyMemberStatusKnown]
        busy:
          type: array
          items:
            $ref: "#/components/schemas/RawGoogleBusyWindow"

    RawFreeBusyMemberUnknown:
      type: object
      description: >-
        A group member Google could not read (an error for it, or not in the
        answer). Not checked, never free. `busy` is present only when windows
        were reported, and then is non-empty; those windows block.
      required: [address, status]
      additionalProperties: false
      properties:
        address:
          type: string
          description: The calendar id Google listed in the group's expansion.
        status:
          type: string
          enum: [unknown]
          x-enum-varnames: [RawFreeBusyMemberStatusUnknown]
        busy:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RawGoogleBusyWindow"

    RawGoogleBusyWindow:
      type: object
      description: >-
        calendar.TimeSlot, with explicit json tags `start` / `end` since PAC-26
        (API-028, API-029). Used by GET /api/calendar/freebusy (RawFreeBusyAnswer)
        and by the legacy `results` view of POST /api/freebusy. Same keys as FreeBusyWindow; kept as its own schema
        because it is a different Go type with a different failure mode: a Google
        timestamp that fails to parse becomes the Go zero time
        `0001-01-01T00:00:00Z` because the parse error is discarded. Before PAC-26
        the struct had no tags and the keys were `Start` / `End`.
      required: [start, end]
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    FreeBusyQueryRequest:
      type: object
      description: Body of POST /api/freebusy.
      required: [emails, start_time, end_time]
      additionalProperties: false
      properties:
        emails:
          type: array
          description: >-
            1 to 20 addresses. Empty or absent -> 400 `emails is required`;
            more than 20 -> 400 `max 20 emails per request`. Each entry is trimmed
            and lowercased before lookup. No format validation is performed.
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: email
        start_time:
          type: string
          format: date-time
          description: RFC3339. Must parse or the request is rejected with 400.
        end_time:
          type: string
          format: date-time
          description: >-
            RFC3339. Must parse or the request is rejected with 400. Must be after
            `start_time`, else 400 `end_time must be after start_time` (PAC-133,
            API-077, SF-034).

    FreeBusyQueryResponse:
      type: object
      description: >-
        The same free/busy data is returned three ways for compatibility:
        `participants` (canonical), `busy` (map form) and `results` (legacy). All
        three are always present. Since PAC-26 (API-028) every busy window in all
        three uses the same `{"start","end"}` keys; before it, `results[].busy[]`
        alone was `{"Start","End"}`.
      required: [start_time, end_time, participants, busy, results]
      additionalProperties: false
      properties:
        start_time:
          type: string
          format: date-time
          description: Echo of the parsed request start, marshalled from Go time.Time.
        end_time:
          type: string
          format: date-time
        participants:
          type: array
          description: One entry per requested email, in the order personal-domain/cached entries were resolved.
          items:
            $ref: "#/components/schemas/FreeBusyParticipant"
        busy:
          type: object
          description: >-
            Busy windows keyed by the lowercased email. Same data as
            `participants[].busy`. Always an object; a participant with no busy time
            maps to `[]`.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/FreeBusyWindow"
        results:
          type: array
          description: >-
            Legacy view. Uses `coverage` instead of `status`. Its busy windows are
            calendar.TimeSlot values, `{"start","end"}` since PAC-26 (API-028).
          items:
            $ref: "#/components/schemas/FreeBusyLegacyResult"

    FreeBusyParticipant:
      type: object
      description: >-
        api.freeBusyParticipantDTO. Exactly three keys. There is no provider key (the
        answer does not say which calendar provider supplied the data) and no status
        saying whether the address belongs to a Paceday user; `status` has two values
        only (API-046; PAC-41 D-2).
      required: [email, status, busy]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Lowercased and trimmed form of the requested address.
        status:
          type: string
          description: >-
            `known` when the provider answered this address without error (a Google
            group: its expansion and every member); `unknown` when the domain is a
            known consumer domain, when no calendar credentials are stored, when the
            provider call failed or timed out, when the provider reported an error
            for the address, or when the provider did not mention it (PAC-133,
            SF-032). Two values only (PAC-41 D-2): a partial answer is `unknown`.
          enum: [known, unknown]
        busy:
          type: array
          description: >-
            Always present. `known`: complete, `[]` when free. `unknown`: the
            windows the provider did report for the address (possibly none); they
            block (PAC-133 D-11), and `[]` here means "not checked", not free.
          items:
            $ref: "#/components/schemas/FreeBusyWindow"

    FreeBusyWindow:
      type: object
      description: api.freeBusyWindowDTO — the lowercase-keyed busy window.
      required: [start, end]
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    FreeBusyLegacyResult:
      type: object
      description: engine.ParticipantBusy, as emitted under the `results` key.
      required: [email, coverage, busy]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        coverage:
          type: string
          description: Same value as `participants[].status` for this address (PAC-133).
          enum: [known, unknown]
        busy:
          type: array
          description: Same windows as `participants[].busy` (PAC-133, partial windows on `unknown` included).
          items:
            $ref: "#/components/schemas/RawGoogleBusyWindow"

    # ----------------------------------------------------- rooms / attendees

    CalendarRoom:
      type: object
      description: >-
        calendar.Room — only two fields exist server-side, and both are always
        emitted. There is no building, floor, capacity, email or availability field
        (API-041; PAC-41 D-1): a client that needs the room's bookable address reads
        `id`. This is the only room type; clients consume this generated shape rather
        than a hand-written one (PAC-41).
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: string
          description: >-
            The Google resource calendar id, which is also the room's bookable email
            address (contains `resource.calendar.google.com`). To book the room, send
            this value unchanged as EventPatchRequest.room_resource_email. The list
            keeps any id that contains that substring and does not itself check the
            stricter `^[^@\s]+@resource\.calendar\.google\.com$` that PATCH
            enforces; Google room resource ids have that form.
        name:
          type: string
          description: The calendar list entry's `summary`.

    AttendeeSuggestion:
      type: object
      description: >-
        calendar.AttendeeSuggestion. Both keys are always emitted (no omitempty);
        `name` is "" when Google supplied no display name.
      required: [email, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Original casing from the Google event, not the lowercased dedupe key.
        name:
          type: string

    # ---------------------------------------------------- personal calendars

    PersonalCalendar:
      type: object
      description: api.personalCalendarDTO.
      required: [id, label, type, enabled]
      additionalProperties: false
      properties:
        id:
          type: string
          description: >-
            The int64 database id rendered as a decimal STRING. Path parameters for
            this resource are integers, so clients must convert.
        label:
          type: string
          description: Renamed from the storage column `name`.
        type:
          type: string
          description: >-
            Renamed from the storage column `provider`. Stored as a free-form string
            — the backend enforces only that it is non-empty on create, so values
            outside google/outlook/webcal are accepted and echoed back.
        url:
          type: string
          description: Subscription URL (webcal/ICS). Omitted when empty.
        enabled:
          type: boolean
        last_synced_at:
          type: string
          format: date-time
          description: >-
            UTC RFC3339. Omitted entirely (not null) when the calendar has never
            been synced.

    PersonalCalendarCreateRequest:
      type: object
      description: Body of POST /api/personal-calendars. Note these are storage-side names, not DTO names.
      required: [provider]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: >-
            Required and must be non-empty, otherwise 400 `provider required`. Any
            non-empty string is accepted; there is no allow-list.
        name:
          type: string
          description: Defaults to the literal "Personal" when empty or absent.
        url:
          type: string
          description: Optional; stored as "" when absent.
        enabled:
          type: boolean
          default: false
          description: >-
            Not a pointer in Go, so an ABSENT key becomes `false` — the calendar is
            created disabled. Clients that want it active must send `true` explicitly.

    PersonalCalendarPatchRequest:
      type: object
      description: >-
        Body of PATCH /api/personal-calendars/{id}. Pointer fields with SQL COALESCE,
        so null and absent both mean "unchanged". `provider` is not patchable.
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        enabled:
          type: boolean
          nullable: true

    PersonalCalendarPreviewEvent:
      type: object
      description: >-
        calendar.GenericEvent, with explicit json tags since PAC-26 (API-029).
        All four keys are always present (no omitempty). Before PAC-26 the struct
        had no tags and the keys were `ID`, `Title`, `Start`, `End`.
      required: [id, title, start, end]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    # ------------------------------------------------------------- org / audit

    OrgMember:
      type: object
      description: >-
        storage.User as returned by GET /api/org/members: an account that belongs
        to the caller's organisation under PAC-148's membership rule
        (listOrgMembers). The fields are unchanged by PAC-148.
      required: [id, email, name, avatarUrl, provider, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          description: camelCase, unlike most other fields in this domain. May be "".
        provider:
          type: string
          enum: [google, microsoft, sso]
          x-enum-varnames: [OrgMemberProviderGoogle, OrgMemberProviderMicrosoft, OrgMemberProviderSso]
          description: >-
            The provider of the account's FIRST sign-in: the same `users.provider`
            column, and the same three values, as CurrentUserResponse.provider.
            Resolved by PAC-148 (spec D-8; the x-uncertain this property carried,
            PAC-35 non-blocking 2): the column has no CHECK constraint (migration
            006, `TEXT NOT NULL DEFAULT 'google'`), and its only writer is the
            account insert of storage.ResolveSignIn, whose `FirstProvider` is one
            of three literals: `google` (Google sign-in), `microsoft` (Microsoft
            sign-in) and `sso` (SSO sign-in); storage.UpsertUser has no production
            caller, and tests and the e2e seed write `google`. No migration adds a
            constraint.
        org:
          $ref: "#/components/schemas/Org"
        createdAt:
          type: string
          format: date-time

    Org:
      type: object
      description: >-
        storage.Org. Present in the User struct with `omitempty`, but
        storage.GetOrgMembers never hydrates it, so it never appears on
        GET /api/org/members responses.
      required: [id, name, domain, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        createdAt:
          type: string
          format: date-time

    AuditEntry:
      type: object
      description: >-
        storage.AuditEntry. One recorded action, always about the calling user's own
        calendar or, since PAC-67, one of the calling user's own provider connections
        (Outlook, Zoom, Google; the three connection kinds of `action`) — the subject
        is the scoping predicate and is deliberately NOT echoed
        back as a field, because it is the same value on every entry of every response
        (see contracts/features/PAC-23.md §2, rejected alternative A).
      required: [id, action, details, created_at]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          description: >-
            `audit_log.id`, declared `SERIAL` at
            backend/storage/migrations/001_initial.up.sql:45 — a 32-bit signed
            sequence. `storage.AuditEntry.ID` is a Go `int64`
            (backend/storage/audit_log.go:18), but that widening is a Go type choice,
            not a range the table can reach, so `int64` here would over-declare the
            server. `int32` is declared instead because the sole consumer coerces
            with `Number(e.id)` (smart-calendar-flow/src/api/client.ts:448, inside
            `normalizeAuditEntries`) and uses
            the result as a React list key (src/pages/Audit.tsx:95): every `int32` is
            exactly representable as a JS number, so the coercion is lossless and
            keys stay distinct. Values above 2^53 would collide into one key and drop
            rows — the table cannot produce them, and this declaration is what keeps
            that true for a generated client.
        action:
          type: string
          description: >-
            What was recorded. Underscore-separated, lower-case; there is no dotted
            key convention on this endpoint and never was.


            This is the complete set the server can emit, enumerated from every
            `storage.WriteAuditLog` call site in `backend/` (the action argument is a
            string literal at all seven, and `storage.WriteAuditLog`, in
            backend/storage/focus_blocks.go, holds the only INSERT against the
            table): `focus_created` (`FocusTimeEngine.RunForUser`,
            backend/engine/focus_time.go), `focus_cleared`
            (`FocusTimeEngine.ClearWeek`, backend/engine/focus_time_cleaner.go),
            `meeting_scheduled` (`SmartScheduler.CreateMeeting`,
            backend/engine/smart_schedule.go), `meeting_moved`
            (`CompressionEngine.Apply`, backend/engine/compression.go),
            `meeting_created` (`scheduleHandlers.createMeeting`,
            backend/api/handlers_schedule.go), `nlp_parsed` (`NLPService.Parse`,
            backend/nlp/parser.go), `nlp_confirmed` (`nlpHandlers.confirm`,
            backend/api/handlers_nlp.go). Cited by enclosing function rather than
            line because this text is emitted into generated files in both repos; the
            falsifying command is
            `grep -rn 'WriteAuditLog(' --include='*.go' backend/ | grep -v _test.go`,
            which returns the definition and exactly these seven call sites.
            PAC-67 adds three kinds, none of which redefines the seven above: they
            are written by the credential lifecycle, not by a scheduling feature,
            and their writers are named by the PAC-67 plan:
            `connection_lost` (the provider permanently refused renewing the
            subject's credential; one per loss, see the operation description),
            `provider_disconnected` (the subject disconnected Outlook or Zoom), and
            `revocation_unconfirmed` (a revocation sent to the provider on that
            disconnect was not confirmed, or could not be attempted; Zoom only).
            After PAC-67 the falsifying command above must return these writers as
            well. No test checks this enum against the writers today (none exists
            in backend/api or backend/storage; contract challenge, non-blocking);
            the PAC-67 backend stage ADDS one covering all ten (manifest
            CONTRACT-6).
            PAC-40 adds one kind, written by the booker-erasure job, not by a request:
            `scheduling_link_bookers_erased` (the bookers' names and emails of one of
            the subject's deleted scheduling links were erased; exactly one entry per
            link per erasure, spec §3.5, AC-31). The subject is the link's owner. The
            entry is written in the same database transaction as the erasure, so its
            writer is a transactional sibling of `storage.WriteAuditLog` that returns
            its error instead of logging it; CONTRACT-6's test is amended to recognise
            that writer and to expect eleven values (contracts/features/PAC-40.md §5).


            The enum is closed on purpose. `audit_log.action` is an unconstrained
            `TEXT` column, so the set is held by this contract rather than by the
            database: adding an eighth action is a contract change, and once the
            PAC-67 enum test exists a writer added without one makes it fail, which
            is the intended alarm. Spec AC-14 requires that this set never shrinks.


            Because the body of the 200 is an array of this schema, a value outside
            this enum makes the WHOLE response non-conforming, not just the one row —
            one operator `INSERT`, one writer added without a contract change, or one
            restored backup, and a validating consumer rejects six good rows along
            with the odd one. That is the intended alarm in a test and the wrong
            behaviour in a UI, so the expected handling is stated rather than left to
            each consumer: **render the row, substituting a placeholder such as
            `unknown` for the unrecognised value, rather than discarding the
            response.**


            No consumer implements that today, and the correction matters because an
            earlier revision of this paragraph claimed one did. The shipped client's
            normaliser is
            `action: typeof e.action === "string" && e.action ? e.action : "unknown"`
            (smart-calendar-flow/src/api/client.ts:451, inside
            `normalizeAuditEntries`). It substitutes `unknown` only
            for an action that is MISSING, NON-STRING or EMPTY; an unrecognised
            non-empty string — `focus.run`, `weird_action` — passes through verbatim.
            The row still renders, but for a different reason: that client's
            `AuditEntry` is hand-written with `action: string`
            (smart-calendar-flow/src/api/types.ts:224, in the interface at
            `:222-227`), so nothing validates against this enum at all. A stage-4
            frontend implementer must not read this paragraph as describing work
            already done. The generated zod schema factory §4 mandates exists —
            `src/api/generated/schemas.ts` exports `AuditEntry = z.strictObject(…)`
            with `action: z.enum([…])` over exactly these seven values, committed
            since smart-calendar-flow #87 (2026-10-10) and regenerated after every
            contract merge — and is not applied to the audit path: the only import
            from `generated/schemas` in that repo is `SettingsUpdate`
            (`src/api/client.ts:2`). The day it is applied to `getAudit`, an
            out-of-enum value is a thrown validation error and the whole response is
            lost, which is the case this paragraph is for.


            It names WHAT happened, not WHO did it. Every entry's subject is the
            calling user (see the operation description); no entry carries an actor,
            and no value in this enum distinguishes an action a person took from one
            the scheduler took on their behalf.
          enum:
            - focus_created
            - focus_cleared
            - meeting_scheduled
            - meeting_moved
            - meeting_created
            - nlp_parsed
            - nlp_confirmed
            - connection_lost
            - provider_disconnected
            - revocation_unconfirmed
            - scheduling_link_bookers_erased
        details:
          type: string
          description: >-
            Scanned from the DB into a Go `string`, so on the wire this is ALWAYS a
            JSON string — even when the text inside it happens to be JSON. A
            generator should emit `string`, and that is correct and complete for the
            transport.


            Whether the text inside parses as JSON depends on which `action` produced
            it, so the useful statement is per-writer rather than a blanket warning.
            ALWAYS VALID JSON, for every action. `focus_created` and `focus_cleared`
            marshal a map with `encoding/json` (`FocusTimeEngine.RunForUser` in
            backend/engine/focus_time.go, `FocusTimeEngine.ClearWeek` in
            backend/engine/focus_time_cleaner.go). Since PAC-122 (SF-070)
            `meeting_scheduled` (`{"event_id","title"}`, `SmartScheduler.CreateMeeting`
            in backend/engine/smart_schedule.go), `meeting_created`
            (`{"event_id","title"}`, `scheduleHandlers.createMeeting` in
            backend/api/handlers_schedule.go), `meeting_moved`
            (`{"event_id","new_start"}`, `CompressionEngine.Apply` in
            backend/engine/compression.go), `nlp_confirmed` (`{"event_id"}`,
            `nlpHandlers.confirm` in backend/api/handlers_nlp.go) and `nlp_parsed`
            (`{"text","intent"}`, `NLPService.Parse` in backend/nlp/parser.go) are
            encoded with `encoding/json` too (`storage.AuditJSON`), so a title or
            text containing `"`, `\`, a newline or a control character is escaped.
            Before PAC-122 the first four were built by concatenating values into a
            JSON literal with no escaping, and `nlp_parsed` used `fmt.Sprintf` with
            `%q`, whose escapes (`\x01`, `\a`) are not JSON; rows written then
            stay as they were written. The three PAC-67 connection kinds marshal a
            struct with `encoding/json` and hold only server-chosen values:
            `connection_lost` is `{"provider":"outlook"|"zoom"|"google"}`,
            `provider_disconnected` is `{"provider":"outlook"|"zoom","revocation":
            "confirmed"|"unconfirmed"|"not_offered"}` (the `revocation` vocabulary of
            `ProviderDisconnectResult`), and `revocation_unconfirmed` is
            `{"provider":"zoom"}`. No token material and no actor-supplied text ever
            appears in them. PAC-40's `scheduling_link_bookers_erased` marshals a
            struct with `encoding/json`:
            `{"link_id":"<uuid>","link_title":"<the owner's title>","bookings_erased":<n>,
            "last_booking_end_at":"<RFC3339>","ran_at":"<RFC3339>"}`. It never carries a
            booker's name or email (AC-31); `link_title` is the subject's own text.
            Sites are cited by enclosing function, not line, for the reason given in
            the operation description.


            Consequence for a consumer: an entry written since PAC-122 parses; one
            written before it by `meeting_scheduled`, `meeting_created`,
            `meeting_moved`, `nlp_confirmed` or `nlp_parsed` may not, so a consumer
            reading history should still treat a value that does not parse as
            opaque text, as the shipped client does (`formatAuditDetails`,
            smart-calendar-flow/src/api/client.ts, never calls JSON.parse). This
            resolves docs/specs/PAC-23.md OQ-6.
        created_at:
          type: string
          format: date-time
