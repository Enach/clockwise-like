  "ownerQuestionsOpen": [
    "OQ-1 (F1): may a connect later offer to add a sign-in method? Default: only through an explicit step. Not blocking.",
    "OQ-2: may SSO reach existing members? Default no (applied). Not blocking.",
    "OQ-8: accept refused Microsoft sign-in during a /organization outage? Default yes (applied). Before release.",
    "OQ-6: advance every account's generation at deploy? No default. The operator command exists either way; the release decides; AC-44 is conditional. Needed before stage 7.",
    "Personal Microsoft accounts (outlook.com/hotmail) cannot sign in or sign up under PAC-71 until PAC-77 ships, and EXISTING accounts whose only sign-in is a personal Microsoft account are locked out until then (they can still connect an Outlook calendar). Acceptable, or must PAC-77 ship with PAC-71? Default: acceptable, release-noted (applied). Asked 2026-10-28 (owner-decisions.md). Before release."
  ],

