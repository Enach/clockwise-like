  "operationsAdded": [
    { "operationId": "startGoogleConnect", "method": "POST", "path": "/api/auth/google/connect", "change": "NEW. Protected (session gen rules). No body. 200 ConnectStartResponse {authorize_url} + Set-Cookie google_connect_state (HttpOnly, SameSite=Lax, Max-Age 300). Never redirects. State bound to (caller, session gen, google, 300 s), server-checkable. authorize_url = startGoogleOAuth's URL with this state, no login_hint, same scopes. 401 PlainTextError; 500 ErrorResponse. Implemented through the generated interface (MIGRATION.md row flips in the backend PR)." },
    { "operationId": "startMicrosoftConnect", "method": "POST", "path": "/api/auth/microsoft/connect", "change": "NEW. As startGoogleConnect with ms_connect_state and provider outlook; 503 when MICROSOFT_CLIENT_ID is unset (no cookie). Implemented through the generated interface." }
  ],

  "operationsChanged": [
    { "operationId": "googleOAuthCallback", "method": "GET", "path": "/api/auth/callback", "change": "Branch by state cookie: google_connect_state -> CONNECT, oauth_state -> SIGN-IN, neither -> existing 400. SIGN-IN: identity google+userinfo id; evidence AUTHORITATIVE (verified_email and hd == address domain, or gmail.com/googlemail.com) / MAILBOX (verified) / NONE; bound identity reaches its account; case collision, bound carrier, unknown identity on a carried address -> REFUSED; unbound legacy account binds atomically under rule (a) (provider_id ^[0-9]{1,255}$ == id, evidence >= MAILBOX) or (b) (AUTHORITATIVE and empty) else REFUSED; no carrier -> create (AUTHORITATIVE domain_confirmed, MAILBOX unconfirmed) or REFUSED (NONE). REFUSED = 302 <FRONTEND_URL>/?error=signin_refused, no auth_token Set-Cookie, nothing written. Session carries gen. CONNECT: state valid for google, session is U at gen g, U's current gen g (else 302 /?connect=not_credited); exchange; store on U in a transaction re-checking g (moved -> not_credited); credited 302 /auth/callback?provider=google&connect=credited. Connect never sets/expires auth_token, binds nothing, changes nothing but U's Google credential (and its recorded loss); expires google_connect_state. 500 adds: binding/creation failure, generation read (connect). Revision 2: CONNECT step 4, no code (provider error, e.g. the user cancelled) -> 302 /?connect=not_credited, nothing exchanged; code becomes optional and the provider error parameter is documented (generated Params.Code becomes *string, Params.Error added; the callbacks stay handwritten); google_connect_state is expired on every connect-branch response, the 500 included. SIGN-IN keeps today's 500 for a missing code." },
    { "operationId": "microsoftOAuthCallback", "method": "GET", "path": "/api/auth/microsoft/callback", "change": "Branch by ms_connect_state / ms_oauth_state. SIGN-IN adds Graph GET /v1.0/organization?$select=id,verifiedDomains: work account iff 200 with exactly one entry, GUID id, GUID /me id; else REFUSED (tenant unobtainable or unclassifiable; personal accounts refused, PAC-77). Evidence AUTHORITATIVE iff verifiedDomains names the mail domain, else NONE. Same resolution as Google; rule (a) needs a GUID provider_id equal to /me id (case-insensitive) and AUTHORITATIVE evidence. A migration binding never changes calendar_provider; a created account gets outlook (today); a bound sign-in keeps today's outlook reset (PAC-47 removes it). Failure (b) is now 'creating or binding failed'. CONNECT reads neither /me nor /organization, stores the credential as PAC-67 does in the gen-checked transaction, never sets calendar_provider. Locations: /auth/callback?provider=outlook[&connect=credited], /?error=signin_refused|auth_failed, /?connect=not_credited (also when the provider returns no code, e.g. the user cancelled: revision 2). code optional, provider error documented; ms_connect_state expired on every connect-branch response including the 500." },
    { "operationId": "ssoOidcCallback", "method": "GET", "path": "/api/auth/callback/oidc/{domain}", "change": "Identity = verified iss + sub. After the PAC-45 403: bound -> reach; any carrier of the address (any case, bound or not) -> REFUSED; else create domain_confirmed unless email_verified is present and false (REFUSED). Never binds a pre-existing account (D-10). Location adds /?error=signin_refused." },
    { "operationId": "startGoogleOAuth", "method": "GET", "path": "/api/auth/google", "change": "Description only: sign-in start only, never a connect." },
    { "operationId": "startMicrosoftOAuth", "method": "GET", "path": "/api/auth/microsoft", "change": "Description only: sign-in start only, never a connect." },
    { "operationId": "ALL 114 protected operations", "method": "*", "path": "*", "change": "Security scheme: JWT claim gen (absent = 0); gen != account's current generation -> existing 401 (requireAuth or the in-request re-check on account data D1-D14, PAC-71.md section 5); generation unreadable -> 500 {\"error\":\"internal error\"} application/json, cookie untouched. 401 declared on the 31 operations that lacked it (shared Unauthorized), 500 on the 15 that lacked it (new shared SessionGenerationUnavailable)." },
    { "operationId": "getAuthStatus", "method": "GET", "path": "/api/auth/status", "change": "The 200-on-internal-failure fallback excludes a stale generation (401) and an unreadable one (500, now declared)." },
    { "operationId": "getCurrentUser", "method": "GET", "path": "/api/auth/me", "change": "CurrentUserResponse.addressStanding enum [domain_confirmed, unconfirmed], required. 500 declared (generation unreadable only)." },
    { "operationId": "logout", "method": "POST", "path": "/api/auth/logout", "change": "Description: stale generation is 401; logout does not advance the generation. 500 declared (generation unreadable; cookie not expired)." },
    { "operationId": "ssoAdminStepupCallback", "method": "GET", "path": "/api/admin/sso/stepup/callback", "change": "Check 4b after every existing check: when the account is bound at the step-up's authority (Google, or Microsoft same tid), the step-up sub/oid must equal the bound subject, else reason identity_mismatch. Location pattern gains identity_mismatch (nine reasons)." },
    { "operationId": "createSsoProvider", "method": "POST", "path": "/api/admin/sso", "change": "Break-glass (step 5b): the session's ACCOUNT stored address (lower-cased) is listed AND addressStanding is domain_confirmed, plus today's freshness; the email claim is no longer compared. SsoWriteFreshLoginRequired description follows. Shapes unchanged. The same break-glass rule governs deleteSsoProvider and setSsoProviderState, which reference it." },
    { "operationId": "patchOrganizationAI", "method": "PATCH", "path": "/api/organization/ai", "change": "Added at the backend implementation (review of #242): break-glass, which PAC-73 part 2 also compared on the session's email claim, now follows the same PAC-71 rule as createSsoProvider: the session's ACCOUNT stored address (lower-cased) is listed AND addressStanding is domain_confirmed, plus the fresh-session rule. Description only; shapes unchanged." },
    { "operationId": "acceptTeamInvite", "method": "POST", "path": "/api/teams/invites/{token}/accept", "change": "Accepted only when the caller's account holds invitee_email domain-confirmed (case-insensitive); unconfirmed gets today's 403 'this invite is for a different email address'." },
    { "operationId": "createSchedulingLink", "method": "POST", "path": "/api/scheduling-links", "change": "co_host_emails resolve only to exactly one domain-confirmed holder; otherwise skipped as unknown today." },
    { "operationId": "inviteSchedulingLinkHost", "method": "POST", "path": "/api/scheduling-links/{id}/hosts", "change": "Invitee resolved only to exactly one domain-confirmed holder; otherwise the existing 404 'user not found'." },
    { "operationId": "updateSchedulingLink", "method": "PATCH", "path": "/api/scheduling-links/{id}", "change": "Keep set compares stored host addresses case-insensitively at any standing (accepted Pat@Acme.com kept by pat@acme.com, AC-43); new entries only for a domain-confirmed holder." },
    { "operationId": "addManagerTeamMember", "method": "POST", "path": "/api/manager/team/members", "change": "member_user_id only for exactly one domain-confirmed holder (case-insensitive), else null. 401 declared." },
    { "operationId": "removeManagerTeamMember", "method": "DELETE", "path": "/api/manager/team/members/{email}", "change": "With team_id: removes formal membership of every carrier, any case, any standing; owner among them -> 422, nothing removed; no carrier -> still 204 (spec section 6). 401 and 500 declared." },
    { "operationId": "previewManagerDetection", "method": "POST", "path": "/api/manager/detect", "change": "Roster import resolves member_user_id only to exactly one domain-confirmed holder." },
    { "operationId": "patchManagerTeamMember", "method": "PATCH", "path": "/api/manager/team/members/{email}", "change": "Materialising a formal member matches only a member holding {email} domain-confirmed. 401 declared." },
    { "operationId": "scheduleManagerOneOnOne", "method": "POST", "path": "/api/manager/team/members/{email}/schedule", "change": "Same rule as patchManagerTeamMember. 401 declared." },
    { "operationId": "getManagerRoster", "method": "GET", "path": "/api/manager/team", "change": "Merging formal members with roster entries compares stored addresses case-insensitively at any standing (keeping site). 401 declared." },
    { "operationId": "getTeam", "method": "GET", "path": "/api/teams/{id}", "change": "401 declared; 404 x-uncertain resolved (reachable only when the team is deleted between the membership read and the team read)." }
  ],

  "schemasChanged": [
    "ConnectStartResponse: NEW (auth). {authorize_url: string uri}, required, additionalProperties false.",
    "CurrentUserResponse: + addressStanding enum [domain_confirmed, unconfirmed], required; x-enum-varnames [AddressStandingDomainConfirmed, AddressStandingUnconfirmed] so oapi-codegen does not rename the existing ProviderDisconnectResult.revocation constants. provider description: still the first sign-in, not the bound identity.",
    "components.responses.SessionGenerationUnavailable: NEW (auth). 500 ErrorResponse {\"error\":\"internal error\"}.",
    "components.responses.Unauthorized, BookingUnauthorized; components.schemas.MiddlewareUnauthorized, SsoWriteFreshLoginRequired: descriptions only.",
    "securitySchemes bearerAuth, cookieAuth: descriptions (gen claim, 401/500 split, in-request re-check)."
  ],

  "interfaceChoicesMadeHere": {
    "sessionGenerationClaim": "JWT claim `gen`, non-negative integer, initial 0 for every account; a token without it reads as 0; present but not a non-negative integer -> invalid token. PAC-71.md section 5.",
    "staleGeneration": "Existing requireAuth 401 bytes; never a new status. Generation unreadable -> 500 application/json {\"error\":\"internal error\"}, cookie untouched, never 401 (AC-48).",
    "refusal": "One fixed redirect <FRONTEND_URL>/?error=signin_refused on all three callbacks, no auth_token Set-Cookie (D-6, AC-19). PAC-71.md section 2.",
    "connectStart": "POST /api/auth/{google,microsoft}/connect behind requireAuth answering JSON {authorize_url} and a per-provider HttpOnly Lax 300 s state cookie; never a redirect; state bound to (user, gen, provider, expiry) and server-checkable. Defeats every request of the spec's cross-site model (AC-14 d). PAC-71.md section 4.",
    "connectCallback": "Same registered redirect URIs as sign-in; the branch is chosen only by which state cookie equals `state`. Outcomes /auth/callback?provider=<google|outlook>&connect=credited and /?connect=not_credited. Rejected: separate callback URLs (new redirect-URI registration per deployment).",
    "microsoftTenantSource": "Graph /v1.0/organization?$select=id,verifiedDomains with the sign-in token (User.Read); rejected: access-token tid (opaque to clients), client_info (MSAL-internal). OQ-3 item 1.",
    "personalMicrosoft": "No positive personal signal adopted; anything not classified work is refused at sign-in; PAC-77 (https://linear.app/paceday/issue/PAC-77) is due; existing personal-Microsoft-only accounts are locked out until then (owner question, see ownerQuestionsOpen). Connect accepts any Microsoft account. OQ-3 items 2, 3.",
    "identifierFormats": "Rule (a): Google ^[0-9]{1,255}$; Microsoft work a GUID compared case-insensitively; disjoint; SSO never. OQ-3 item 6.",
    "accountData": "Closed list D1-D14 (PAC-71.md section 5) and the named load sites, Microsoft and personal calendars included; other accounts' data and scheduled jobs excluded. Challenge r4 Non-blocking 1.",
    "preferenceDefaults": "Per-column defaults and the normalizeSchedules normal form, PAC-71.md section 6; unnamed column counts as changed; llm_provider '' or 'ollama' (pre-029 rows) counts as changed. Challenge r4 Non-blocking 3.",
    "addressStandingField": "CurrentUserResponse.addressStanding, required. PAC-71.md section 7.",
    "stepupIdentityMismatch": "New reason identity_mismatch, checked after every existing check so existing failures keep their reasons. PAC-71.md section 8.",
    "operatorSteps": "Server-side command only (free address; unbind and reassign; advance every account's generation). No OpenAPI operation; AC-49's contract half: the bundle has no operation that writes a binding. OQ-6 decides only whether a release runs the third. PAC-71.md section 9."
  },

  "assumedByTheFactory": [
    "The refusal value signin_refused and the connect outcome values connect=credited / connect=not_credited. Pending owner confirmation.",
    "The tenant source is Graph /organization (one call shared with PAC-68's verified-domain lookup), so a Graph /organization outage refuses Microsoft sign-in (OQ-8 default: accept).",
    "Unmanaged Microsoft directories (OQ-3 item 4) are treated as authoritative until the plan records evidence otherwise; residual release-noted.",
    "Google userinfo under userinfo.email carries verified_email and hd (OQ-3 item 5) until the plan's recorded call; if hd is absent Workspace users get mailbox evidence (fail-safe direction).",
    "A pre-029 settings row's llm_provider ('' or 'ollama') counts as changed under rule (b) (fail closed; lock-out only).",
    "Logout does not advance the generation (spec section 3; F3 decides)."
  ],

