  "migration": "040_scheduling_link_create_keys: table scheduling_link_create_keys (owner_user_id FK users CASCADE, idempotency_key format CHECK, link_id FK scheduling_links CASCADE UNIQUE, created_at DEFAULT now(), request_sha256 BYTEA NULL 32 bytes, co_host_changes JSONB NULL only with a digest); PRIMARY KEY scheduling_link_create_keys_owner_key (owner_user_id, idempotency_key); partial index on created_at WHERE request_sha256 IS NOT NULL. Additive. Applied under PAC-116 stop-traffic. Down drops the table; links and hosts survive.",
  "nonHttpInterface": {
    "digest": "md 2.3: SHA-256 of encoding/json of the fixed-order canonical v1 struct over the validated link values plus the trimmed, lowerAll-lowered, deduplicated, byte-sorted co-host list (null = no list); computed once in R1.",
    "resolution": "md 4.1: READ COMMITTED transaction; guardedCallHook; re-check; (R1) lowerAll; key read joined to the link; afterLinkCreateKeyRead(ctx, key); re-check (redundant in production, where advances take FOR UPDATE via lockAccountExclusive; kept as cheap defence); commit; decide deleted > expired > same > different; afterLinkCreateKeyResolved(ctx, key) when nothing is stored.",
    "create": "md 4.2: re-check; lock_timeout; link insert; key-row insert (keyed); owner row; co-host list; co_host_changes update (keyed with a list); beforeLinkCreateCommit; commit. 23505 identified with isUniqueViolationOn (pgconn.PgError.ConstraintName) on scheduling_links_slug_key or scheduling_link_create_keys_owner_key -> rollback -> R3 (keyed). co_host_changes is a storage-owned JSON encoding of storage.CoHostChanges (explicit tags = wire names), replayed through toCoHostChangesDTO.",
    "cleanup": "md 3.3: UPDATE ... SET request_sha256 = NULL, co_host_changes = NULL WHERE request_sha256 IS NOT NULL AND created_at <= now() - 24 h, under lock_timeout; cronJob link-create-key-cleanup @every 1h plus a start-up run."
  },
