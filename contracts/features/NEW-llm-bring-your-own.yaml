  "operationsChanged": [
    { "operationId": "parseNaturalLanguage", "method": "POST", "path": "/api/nlp/parse", "change": "200 gains optional not_configured (AINotConfigured), present only when the caller has no AI configuration; then intent is unknown, error is the same sentence, nothing else is present and nothing was sent. range_start/range_end absent when there is no range (API-080). Description: key-only providers, no deployment identity." },
    { "operationId": "testLLMConnection", "method": "POST", "path": "/api/llm/test", "change": "New 409 LLMNotConfiguredResponse (replaces the 500 for no key / llmProvider \"\"). 500 is now settings-load failure only. Which configuration is probed is defined (spec D-19): a named provider uses only the submitted key or the key bound to it. Order: 400, 409, 422, then 200/502 (supersedes PAC-70's no-key 422). Provider modes: openai Bearer, anthropic x-api-key, azure_openai api-key header, bedrock Bedrock API key as Bearer to bedrock-runtime.<region>.amazonaws.com Converse, vertex express x-goog-api-key to aiplatform.googleapis.com. Gateway path prefixes (O-10). PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA approves nothing." },
    { "operationId": "refreshMeetingBrief", "method": "POST", "path": "/api/meetings/{event_id}/brief/refresh", "change": "New 409 LLMNotConfiguredResponse: decided before any brief is written or any Slack/Notion search; nothing written, nothing fetched, nothing sent (spec AC-14, D-12)." },
    { "operationId": "getSettings", "method": "GET", "path": "/api/settings", "change": "Settings document: llmProvider set ['', organization, unsupported, openai, anthropic, azure_openai, bedrock, vertex]; a stored ollama reads as unsupported. llmApiKeySet now means a key bound to the selected provider. New read-only llmApiKeysSet, llmUnboundApiKeySet, aiStatus. Removed awsProfile, gcpProject, gcpLocation, ollamaBaseUrl, ollamaModel." },
    { "operationId": "patchSettings", "method": "PATCH", "path": "/api/settings", "change": "llmProvider ollama is a 400 (AC-6); unsupported only as an unchanged write-back (AC-9). llmApiKey binds to the provider after the write; a non-empty key with no provider is a 400; any llmApiKey write removes the unbound key. llmBaseUrl must be approved for openai or anthropic (gateway prefix allowed). Removed properties are 400 unknown property. Messages: llmProvider set message changed; two new; gcpLocation and ollamaBaseUrl messages removed; llmBaseUrl message changed." }
  ],

