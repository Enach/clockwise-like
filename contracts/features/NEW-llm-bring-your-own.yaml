  "operatorConfiguration": {
    "removed": {
      "PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA": "approves nothing; a server started with it set starts and logs once that it is no longer used (AC-19). Removed from docker-compose.yml, docker-compose.prod.yml, e2e/docker-compose.e2e.yml and .env.example (AC-20).",
      "ambientIdentities": "No AWS, Azure or Google credential of the deployment is read for AI requests; .env.example states that Paceday supplies no LLM credential (AC-20). AWS_BEARER_TOKEN_BEDROCK is ignored."
    },
    "changed": {
      "PACEDAY_LLM_APPROVED_HOSTS_OPENAI / _ANTHROPIC": "An entry is a bare DNS host name, https://<host>, or https://<host>/<prefix> with an optional single trailing '/'. <prefix> is one or more '/'-separated segments of [A-Za-z0-9._~-], none of them '.' or '..', no percent-encoding. Anything else (other scheme, port, query, fragment, userinfo, wildcard, IP literal, trailing dot on the host) is malformed: logged at startup, approves nothing, siblings stay approved (PAC-70 rule). A user llmBaseUrl is approved by an entry when it equals https://<host> (host ASCII case-insensitive) followed by exactly the entry's prefix (byte-for-byte, case-sensitive; none for an entry without prefix), with at most one trailing '/'. The request path is <prefix>/v1/chat/completions (openai) or <prefix>/v1/messages (anthropic), no query. The built-in public hosts are approved without prefix only.",
      "PACEDAY_LLM_APPROVED_HOSTS_VERTEX": "Vertex express mode sends only to aiplatform.googleapis.com; the provider is enabled exactly when that host is listed. Regional <location>-aiplatform.googleapis.com entries approve nothing that is sent any more.",
      "PACEDAY_LLM_APPROVED_HOSTS_AZURE_OPENAI / _BEDROCK": "unchanged (PAC-66 part A); Bedrock's host is bedrock-runtime.<awsRegion>.amazonaws.com computed from the stored region (us-east-1 when empty), with no AWS SDK endpoint resolution from profiles."
    }
  },

