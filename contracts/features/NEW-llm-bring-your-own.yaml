    "AIStatus {configured, provider?, inOrganization, notConfigured?}: provider present exactly when configured is true, notConfigured exactly when it is false (rev. 2).",
    "LLMApiKeysSet {openai, anthropic, azure_openai, bedrock, vertex: boolean}."
  ],
