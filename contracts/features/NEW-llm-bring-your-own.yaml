  "operationsChanged": [
    { "operationId": "parseNaturalLanguage", "method": "POST", "path": "/api/nlp/parse", "change": "200 gains optional not_configured (AINotConfigured), present only when the caller has no AI configuration; then intent is unknown, error is the same sentence, nothing else is present and nothing was sent. range_start/range_end absent when there is no range (API-080). Description: key-only providers, no deployment identity." },
    { "operationId": "testLLMConnection", "method": "POST", "path": "/api/llm/test", "change": "New 409 LLMNotConfiguredResponse (replaces the 500 for no key / llmProvider \"\"). 500 is now settings-load failure only. Which configuration is probed is defined (spec D-19): a named provider uses only the submitted key or the key bound to it. Order: 400, 409, 422, then 200/502 (supersedes PAC-70's no-key 422). Rev. 2: llmProvider unsupported accepted only when the saved choice reads unsupported, then decided as the saved choice (row 7/8 409, submitted key sent nowhere), otherwise 400 'llmProvider unsupported can be probed only when it is your saved choice'. The 409 sentence describes the probed choice; it says 'AI features are off' only when the saved choice was probed. bedrockModel/vertexModel sent as one percent-encoded path segment (url.PathEscape: ':' literal, '/' as %2F). Provider modes: openai Bearer, anthropic x-api-key, azure_openai api-key header, bedrock Bedrock API key as Bearer to bedrock-runtime.<region>.amazonaws.com Converse, vertex express x-goog-api-key to aiplatform.googleapis.com. Gateway path prefixes (O-10). PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA approves nothing." },
    { "operationId": "refreshMeetingBrief", "method": "POST", "path": "/api/meetings/{event_id}/brief/refresh", "change": "New 409 LLMNotConfiguredResponse: decided before any brief is written or any Slack/Notion search; nothing written, nothing fetched, nothing sent (spec AC-14, D-12). Rev. 2: the 500 also covers a settings-load failure, with nothing written, fetched or sent." },
    { "operationId": "getSettings", "method": "GET", "path": "/api/settings", "change": "Settings document: llmProvider set ['', organization, unsupported, openai, anthropic, azure_openai, bedrock, vertex]; a stored ollama reads as unsupported. llmApiKeySet now means a key bound to the selected provider. New read-only llmApiKeysSet, llmUnboundApiKeySet, aiStatus (rev. 2: aiStatus.notConfigured present exactly when configured is false, provider exactly when true). Removed awsProfile, gcpProject, gcpLocation, ollamaBaseUrl, ollamaModel." },
    { "operationId": "patchSettings", "method": "PATCH", "path": "/api/settings", "change": "llmProvider ollama is a 400 (AC-6); unsupported only as an unchanged write-back (AC-9). llmApiKey binds to the provider after the write and touches no other key; a non-empty key with no provider is a 400. Rev. 2: the unbound legacy key is removed only by the new write-only llmUnboundApiKey: \"\" (enum ['']); any other value is the 400 'llmUnboundApiKey must be \"\" (it can only remove the key bound to no provider)'. llmBaseUrl must be approved for openai or anthropic (gateway prefix allowed). Removed properties are 400 unknown property. Messages: llmProvider set message changed; two new; gcpLocation and ollamaBaseUrl messages removed; llmBaseUrl message changed." }
  ],

  "schemasAdded": [
    "AINotConfigured {reason, provider?, enablers, message}: reason in ['off', needs_key, organization_unconfirmed, nothing_configured, provider_removed_organization_available, provider_removed]; the last-but-one and organization_unconfirmed are not produced before Part 2.",
