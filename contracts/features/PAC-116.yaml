  "sourceOfTruth": "Enach/clockwise-like",
  "scope": "Pending migrations are applied only while the app is not serving. One storage procedure (md section 3): if pending, on a dedicated one-connection handle named 'paceday-migrate: <caller>', take the maintenance lock (8400,1), re-read the version, refuse when a backend heartbeat is live (90 s) or any other client session is connected to the database, else apply and release. Used by the backend at start (before its pool), the mutating paceday-operator encryption subcommands (today encryption.go:181; status is a read-only probe that never migrates or refuses) and PAC-71's free-address/reassign/advance-all (today main.go:56). Backends refuse to start, and running backends shut down, when the lock has a migrating holder. No override. PAC-84 and PAC-82 contracts amended; runbook stop-migrate-start procedure. No HTTP change. Revision 3: version state read first (unknown version -> today's error; dirty with a migrating holder -> lock held, else today's dirty error); paceday-migrate: sessions not counted as serving; operator checks for a migrating holder after nothing to do.",
  "ownerDecisions": {
    "Q1": "2026-11-14: the live-read tables are bookings, scheduling_links, scheduling_link_hosts, users (kept as the statement of what is at risk; the rule now protects every table).",
    "Q2": "2026-11-14, REVERSED the same day: the SQL-reading checker is dropped.",
    "Q3": "2026-11-14, REVERSED the same day: operator behaviour changes (refuses to migrate while serving); PAC-84 contract amended.",
    "revision": "2026-11-14, after the challenge on #281: 'stop traffic' - pending migrations applied only when the app is not serving; the operator tool refuses otherwise."
  },
  "decisions": {
    "serving": "live heartbeat (encryption_backend_heartbeats, seen within 90 s) OR any other client session on current_database() (backend_type client backend or NULL, i.e. hidden sessions of other roles count), whatever its application_name except paceday-migrate: (spec D-1, D-9, D-13).",
    "gate": "existing maintenance lock (8400,1), held by the migrator under application_name 'paceday-migrate: <caller>'; write-then-check with the backend's heartbeat (spec D-2).",
    "backendStart": "the backend is a migrator like any other, only when something is pending; single-backend deploys unchanged; several backends must all be stopped (spec D-3).",
    "override": "none (spec D-4; owner may revisit, OQ-1).",
    "onlyWhenPending": "no lock and no check when nothing is pending (spec D-5).",
    "migratorSessions": "sessions named paceday-migrate: are not counted: each belongs to a process inside the procedure that has not served and checks the lock before acting; makes exactly one of two simultaneous migrators apply (spec D-13, challenge S4 option a).",
    "versionState": "unknown version -> today's golang-migrate error before any check; dirty + migrating holder -> lock held (operator exit 5, backend non-zero); dirty without holder -> today's dirty error (spec D-11, D-12).",
    "status": "encryption status is a read-only probe: never migrates, never takes (8400,1), never refuses as serving; reports pending migrations and serving state; exits as today (in progress: exit 5) (spec D-10, factory decision 2026-11-14).",
    "operatorAfterNothing": "an operator subcommand that gets nothing to do opens its working connection, then refuses (exit 5 encryption / 1 PAC-71) on a migrating holder (spec D-14)."
  },
