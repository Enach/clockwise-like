  "scope": "Manager mode stops revealing whether an address has a Paceday account. The add, the patch and schedule materialisation, and detection perform no account lookup and store no link; member_user_id is always null and deprecated. is_paceday_user means 'visible on Paceday' to the caller: an account carrying the address (any standing, case-insensitive) that is a Paceday member of a team the caller is a Paceday member of, or that the organisation member list returns to the caller. Figures by three branches decided once per entry per request: Paceday figures (visible, known account, PAC-60 owner, consent), no read (visible but not entitled), estimate (not visible: free/busy through the caller's credential, exactly as for an address with no account). The analytics cache serves a row only on the branch that computed it. A failed visibility read is the 500. Migration 042 erases stored links outside the rule. Web: badge only from the flag, neutral note, the demo guesses nothing.",
