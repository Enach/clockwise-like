  "operationsAdded": [
    { "operationId": "setSsoProviderState", "method": "PUT", "path": "/api/admin/sso/{domain}/state", "summary": "Body SsoProviderStateRequest {state: active|suspended}, nothing else (400 unknown property). Order: membership 403 -> body 400 -> exact domain 400 provider_domain_mismatch -> createSsoProvider's write authorization 403 -> lookup 404 'sso provider not found' (authorization spent, nothing recorded) -> 200 SsoProvider (unchanged when already in that state). Changes only enabled; updated_at untouched. Recorded as sso_provider_written op suspend|resume. Not implementable before PAC-50 merges (spec D-5, D-6)." }
  ],

  "operationsChanged": [
    { "operationId": "listSsoProviders", "method": "GET", "path": "/api/admin/sso", "change": "200: bare array of the storage row -> SsoProviderList {providers: SsoProvider[]}. No secret under any name. Suspended rows listed with state suspended. 401, 403, 500 unchanged." },
    { "operationId": "createSsoProvider", "method": "POST", "path": "/api/admin/sso", "change": "201: storage row -> SsoProvider. Request: all six properties required non-empty, provider_type oidc only, saml_* refused by name. 400 messages (in order): invalid JSON; saml_entry_point|saml_issuer|saml_cert is not supported; domain, provider_name and provider_type are required; provider_type 'saml' is not supported; provider_type must be 'oidc' (replaces 'oidc' or 'saml'); oidc_issuer|oidc_client_id|oidc_client_secret is required. All before any authorization. Active state: create -> active; replace keeps the stored state (was forced true). 401, 403 (PAC-50's), 500 unchanged." },
    { "operationId": "startSsoLogin", "method": "GET", "path": "/api/auth/sso/{domain}", "change": "Description only: 404 also covers a suspended row (already true); 501 and empty-issuer 500 reachable only for rows stored before PAC-22." },
    { "operationId": "detectAuthProvider", "method": "POST", "path": "/api/auth/detect", "change": "Description only (SsoDetectResponse.type): a suspended row is ignored (already true)." }
  ],

  "schemasChanged": [
    "SsoProviderResponse: REMOVED (resolves U-22).",
    "SsoProvider: NEW. id (uuid), domain, provider_name, provider_type [oidc, saml], state (SsoProviderState), oidc_issuer, oidc_client_id, has_oidc_client_secret (bool), saml_entry_point, saml_issuer, has_saml_cert (bool), created_at, updated_at (last configuration write; not changed by setSsoProviderState). All required, additionalProperties false.",
    "SsoProviderList: NEW. {providers: SsoProvider[]} ordered by created_at, required, additionalProperties false.",
    "SsoProviderState: NEW. enum [active, suspended]; stored as the existing enabled column (true = active).",
    "SsoProviderStateRequest: NEW. {state: SsoProviderState} required, additionalProperties false.",
    "SsoProviderCreateRequest: REWRITTEN (resolves U-21). required [domain, provider_name, provider_type, oidc_issuer, oidc_client_id, oidc_client_secret], each minLength 1; provider_type enum [oidc]; saml_entry_point, saml_issuer, saml_cert removed; additionalProperties false."
  ],

  "interfaceChoicesMadeHere": {
    "projectionNotTaggedRow": "A separate wire type, not json tags on storage.SSOProvider: a field added to the row later cannot reach the wire by default. PAC-22.md 2.1.",
    "secretIndicators": "has_oidc_client_secret and has_saml_cert, one boolean per secret; masked values and a single list rejected. PAC-22.md 2.2.",
    "stateEnum": "state: enum [active, suspended] in request and response; a boolean enabled rejected (toggle shape). PAC-22.md 2.3.",
    "transitionShape": "PUT /api/admin/sso/{domain}/state; PATCH on the configuration and separate suspend/resume operations rejected. PAC-22.md 2.4.",
    "updatedAtSemantics": "updated_at is the last configuration write; the transition does not change it (AC-10, AC-20 say every described value but the state is unchanged). PAC-22.md 2.5.",
    "validationOrderAndMessages": "Ten fixed 400 messages in a fixed order; SAML properties named first; whitespace not trimmed, minLength 1 only (D-2 says non-empty). PAC-22.md 2.6.",
    "samlNonSecretValuesKept": "saml_entry_point and saml_issuer stay readable for rows stored before PAC-22. PAC-22.md 2.8."
