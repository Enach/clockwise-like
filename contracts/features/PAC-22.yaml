  "operationsAdded": [
    { "operationId": "setSsoProviderState", "method": "PUT", "path": "/api/admin/sso/{domain}/state", "summary": "Body SsoProviderStateRequest {state: active|suspended}, nothing else (400 unknown property; a second state key is 400 'duplicate property: state', revision 1.1). State write and sso_provider_written record are one transaction: after a 500 the state is unchanged and nothing recorded (revision 1.1). Order: membership 403 -> body 400 -> exact domain 400 provider_domain_mismatch -> createSsoProvider's write authorization 403 -> lookup 404 'sso provider not found' (authorization spent, nothing recorded) -> 200 SsoProvider (unchanged when already in that state). Changes only enabled; updated_at untouched. Recorded as sso_provider_written op suspend|resume. Not implementable before PAC-50 merges (spec D-5, D-6)." }
  ],

  "operationsChanged": [
    { "operationId": "listSsoProviders", "method": "GET", "path": "/api/admin/sso", "change": "200: bare array of the storage row -> SsoProviderList {providers: SsoProvider[]}. No secret under any name. Suspended rows listed with state suspended. 401, 403, 500 unchanged." },
    { "operationId": "createSsoProvider", "method": "POST", "path": "/api/admin/sso", "change": "201: storage row -> SsoProvider. Request: all six properties required non-empty, provider_type oidc only, saml_* refused by name. Order (revision 1.1): membership 403 'org membership required' first, before the body is read, as today; then the 400 checks; then org lookup 403, domain match 403 and any PAC-50 authorization. 400 messages (in order): invalid JSON; saml_entry_point|saml_issuer|saml_cert is not supported; domain, provider_name and provider_type are required; provider_type 'saml' is not supported; provider_type must be 'oidc' (replaces 'oidc' or 'saml'); oidc_issuer|oidc_client_id|oidc_client_secret is required. Active state: create -> active; replace keeps the stored state (was forced true). 401, 403 (PAC-50's), 500 unchanged." },
    { "operationId": "startSsoLogin", "method": "GET", "path": "/api/auth/sso/{domain}", "change": "Description only: 404 also covers a suspended row (already true); 501 reachable only for rows stored before PAC-22; the 500 (issuer discovery failed) stays reachable for any row whose discovery fails, including rows written since PAC-22 with an unreachable or whitespace issuer (revision 1.1)." },
    { "operationId": "ssoOidcCallback", "method": "GET", "path": "/api/auth/callback/oidc/{domain}", "change": "Description only (revision 1.1): the 404 also covers a suspended row, so a sign-in started before a suspension and finished after it gets 404 and no session (already true, handlers_sso.go:112-116)." },
    { "operationId": "detectAuthProvider", "method": "POST", "path": "/api/auth/detect", "change": "Description only (SsoDetectResponse.type): a suspended row is ignored (already true)." }
  ],

  "schemasChanged": [
    "SsoProviderResponse: REMOVED (resolves U-22).",
    "SsoProvider: NEW. id (uuid), domain, provider_name, provider_type [oidc, saml], state (SsoProviderState), oidc_issuer, oidc_client_id, has_oidc_client_secret (bool), saml_entry_point, saml_issuer, has_saml_cert (bool), created_at, updated_at (last configuration write; not changed by setSsoProviderState). All required, additionalProperties false.",
    "SsoProviderList: NEW. {providers: SsoProvider[]} ordered by created_at, required, additionalProperties false. At most one item today (both domains UNIQUE, exact join; revision 1.1); the array is kept so the type does not change.",
    "SsoProviderState: NEW. enum [active, suspended]; stored as the existing enabled column (true = active).",
    "SsoProviderStateRequest: NEW. {state: SsoProviderState} required, additionalProperties false; a duplicate state key is refused (revision 1.1).",
    "SsoProviderCreateRequest: REWRITTEN (resolves U-21). required [domain, provider_name, provider_type, oidc_issuer, oidc_client_id, oidc_client_secret], each minLength 1; provider_type enum [oidc]; saml_entry_point, saml_issuer, saml_cert removed; additionalProperties false."
  ],

  "interfaceChoicesMadeHere": {
    "projectionNotTaggedRow": "A separate wire type, not json tags on storage.SSOProvider: a field added to the row later cannot reach the wire by default. PAC-22.md 2.1.",
    "secretIndicators": "has_oidc_client_secret and has_saml_cert, one boolean per secret; masked values and a single list rejected. PAC-22.md 2.2.",
    "stateEnum": "state: enum [active, suspended] in request and response; a boolean enabled rejected (toggle shape). PAC-22.md 2.3.",
    "transitionShape": "PUT /api/admin/sso/{domain}/state; PATCH on the configuration and separate suspend/resume operations rejected. PAC-22.md 2.4.",
    "updatedAtSemantics": "updated_at is the last configuration write; the transition does not change it (AC-10, AC-20 say every described value but the state is unchanged). PAC-22.md 2.5.",
    "validationOrderAndMessages": "Ten fixed 400 messages in a fixed order; SAML properties named first; whitespace not trimmed, minLength 1 only (D-2 says non-empty). PAC-22.md 2.6.",
    "samlNonSecretValuesKept": "saml_entry_point and saml_issuer stay readable for rows stored before PAC-22. PAC-22.md 2.8.",
    "duplicateStateKey": "A second state key is 400 'duplicate property: state'; 'last one wins' rejected. PAC-22.md 2.5 (revision 1.1).",
    "transitionAtomicity": "State write and its sso_provider_written record in one transaction, as PAC-50's recorded writes; record-outside-the-transaction rejected. PAC-22.md 2.5 (revision 1.1).",
    "listCardinality": "providers holds at most one item today; kept an array. PAC-22.md 2.7 (revision 1.1)."
  },

