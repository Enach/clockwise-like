    "AC-2  [contract] Permitted caller submits a complete OIDC config with a non-empty secret and it succeeds: response describes the stored config, no value equals the secret. Same config plus saml_cert: refused (AC-18), response contains neither secret. Non-permitted member, either submission: response, whatever its status, contains neither secret.",
    "AC-3  [contract] has_oidc_client_secret true for a non-empty stored secret, false for an empty one; has_saml_cert likewise (rows with a cert arranged through storage). Each checked once with its own secret present and the other absent.",
    "AC-4  [contract] Replace changing only provider_name and supplying the same secret: has_oidc_client_secret still true, no described property other than provider_name and timestamps changes. Then a replace with an empty secret: refused 400 'oidc_client_secret is required' (AC-7), indicator still true.",
    "AC-5  [contract] Row stored before the change with empty secret and empty cert: response validates against SsoProvider, both indicators false, properties present.",
    "AC-6  [contract] Org with 0, then 1 configuration, through listSsoProviders: response top level is SsoProviderList (not an array) and validates each time ({\"providers\":[]}, then exactly one item). More than one cannot be arranged through the API (sso_providers.domain UNIQUE 008_sso_providers.up.sql:3, organizations.domain UNIQUE 007_organizations.up.sql:4, exact join backend/storage/sso_providers.go:89), so the multi-item shape is covered by validating a constructed SsoProviderList holding two SsoProvider items against the bundle's schema (revision 1.1).",
    "AC-7  [contract] For each of oidc_issuer, oidc_client_id, oidc_client_secret missing/empty: 400 '<name> is required', no configuration afterwards; with a stored working config, same 400 and the stored config unchanged.",
    "AC-8  [contract] provider_type saml: 400 \"provider_type 'saml' is not supported\", nothing stored or changed. A saml row written through storage can be listed, suspended, resumed and deleted exactly as any other.",
    "AC-18 [contract] Otherwise-complete OIDC body plus each of saml_entry_point, saml_issuer, saml_cert: 400 '<name> is not supported', no configuration afterwards; with a stored working config, same 400 and unchanged.",
    "AC-9  [e2e] Suspend an active config: detection does not answer sso (negative only), startSsoLogin 404, list shows state suspended. Resume: detection answers sso, list shows active.",
    "AC-10 [unit] Suspend then resume with no secret supplied: a sign-in through the in-process fake IdP that worked before still completes and issues a session; every described value but state unchanged (updated_at included).",
