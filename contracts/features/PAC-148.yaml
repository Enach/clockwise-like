  "nonHttpInterface": {
    "rule": "md 2.1: org_id = O.id AND domain_confirmed AND O.domain not listed AND O.domain = addrDomain(email).",
    "addrDomainSQL": "md 2.2: CASE WHEN strpos(e,'@')=0 THEN '' ELSE lower(btrim(substr(e, strpos(e,'@')+1), <the 25 unicode.IsSpace code points>)) END; default collation (not ICU); verified 25/25 equal to ExtractDomain on postgres:16.15-alpine en_US.utf8; used verbatim by the read rule, migration 043 and pre-deploy query 1. The test reads the production tag from docker-compose.prod.yml and compares it with server_version (N-4); scripts/test-backend.sh pinned to the production tag; e2e and dev compose stay on floating 16-alpine.",
    "effectiveOrgSQL": "md 2.2: one storage expression, consumer list as a literal built once from domain.GenericDomains(); reads only the account's row and the organisation its org_id names.",
    "readers": "md 2.3: getUserRow/GetUserByEmail (User.OrgID is the effective organisation), orgMemberSetSQL (both sides), ReadOrgAIState, UserInOrganization, lockUserRow. Writers keep the raw column. User.OrgID means the effective organisation; any caller needing the stored value reads users.org_id with SQL directly (revision 2, B-1). lockUserRow locks only the users row (scalar subquery or FOR NO KEY UPDATE OF u), never organizations (N-2). GetUserByEmail has no production caller. The operator tools neither read nor write org_id (N-6).",
    "signIn": "md 2.4: ReconcileUserOrg after binding: lock the users row FOR NO KEY UPDATE, decide from stored standing and address in Go, then join (UpsertOrg + SetUserOrg semantics) or leave (delete every confirmation, org_id NULL); nothing keyed on the domain before the decision; a failure is lifecycle.Fail org-association, the sign-in goes on. Lock order: users row, then organizations (UpsertOrg); a deadlock victim is reported through SF-071 and the sign-in goes on (N-2). SF-071 covers both branches, join and leave (B-1).",
    "memberSet": "md 2.5 (binding shape, revision 2 N-1): the viewer's effective organisation computed once; listed side o.org_id = <it> AND effectiveOrgSQL(o) = o.org_id, so idx_users_org_id carries the join; never two correlated effectiveOrgSQL subqueries as the join; PAC-130 AC-17 unchanged.",
    "equalWork": "md 2.6: for a non-member, the same statements whatever accounts exist at the domain; none keyed on the domain.",
    "seams": "md 7: InstallOrgMembershipStatement (user-row, membership-lock, org-upsert, membership-set, membership-leave, members-read; observe only); existing InstallUserRead, InstallOrgRead, InstallOrgMembersExclude.",
    "reviewLog": "md 4 (revision 2 N-3): PAC-71's 'pac71: REVIEW ...' line (storage/signin.go:277) stops firing for a mailbox binding at the 17 added domains (consumer domains); intended."
