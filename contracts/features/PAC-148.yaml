  "scope": "Organisation membership requires the domain to vouch for the person. An account belongs to an organisation only while (1) address_standing is domain_confirmed, (2) the organisation's domain is not on the consumer list, and (3) the organisation's domain equals ExtractDomain(stored address), through one SQL expression addrDomainSQL tested against ExtractDomain on postgres:16.15-alpine. Decided at every read through one expression effectiveOrgSQL (User.OrgID, orgMemberSetSQL, ReadOrgAIState, UserInOrganization, lockUserRow), so every consumer (member list, /api/auth/me org, AIStatus.inOrganization, organisation AI read/patch/confirm and AI spend, SSO list/create/delete, step-up start/options/callback, PAC-130 rule (b)) treats a failing stored association as no organisation. Sign-in joins or leaves (leave under PAC-87's lock, confirmations deleted). The consumer list gains 17 Microsoft personal-account domains (detection: generic). Migration 043 ends failing memberships and their confirmations, gated on configurations at listed domains (abort leaves 43 dirty, force to 42 recovers). The member list answers 500 for an unreadable caller, 200 [] for a missing one. OrgMember.provider is the enum google/microsoft/sso.",
