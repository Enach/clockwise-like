      "change": "Optional query purpose (SsoStepupPurpose: sso_write default | llm_org_key_write), bound into the signed state cookie. New 400 JSON `purpose must be 'sso_write' or 'llm_org_key_write'` after the provider 400. Absent purpose: byte-identical to PAC-50. Revision 2: a repeated purpose parameter is the 400."
