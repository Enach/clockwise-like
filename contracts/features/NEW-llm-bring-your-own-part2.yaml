      "operationId": "startSsoAdminStepup",
      "method": "GET",
      "path": "/api/admin/sso/stepup",
      "change": "Optional query purpose (SsoStepupPurpose: sso_write default | llm_org_key_write), bound into the signed state cookie. New 400 JSON `purpose must be 'sso_write' or 'llm_org_key_write'` after the provider 400. Absent purpose: byte-identical to PAC-50."
