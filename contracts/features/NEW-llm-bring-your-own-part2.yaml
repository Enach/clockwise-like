    },
    {
      "operationId": "parseNaturalLanguage",
      "method": "POST",
      "path": "/api/nlp/parse",
      "change": "Description and examples only: row 4 uses the organisation's configuration at exactly the confirmed version (read with the confirmation as one consistent state, else row 5); rows 5, 10, 11 are the not-configured 200 (examples organizationUnconfirmed, personalKeysForbidden); row 9 reserved. The 200 error sentence, logs and Sentry have the org key and the caller's keys replaced by [redacted] (spec §3.1a). Response schema unchanged except AINotConfigured (below)."
    },
    {
      "operationId": "refreshMeetingBrief",
      "method": "POST",
      "path": "/api/meetings/{event_id}/brief/refresh",
      "change": "409 description lists the Part 2 rows (5, 7, 10, 11). Nothing written or fetched (P2-AC-27). Row 4 uses the confirmed version. A failed brief's stored brief_text, logs and Sentry never contain the org key or the caller's keys (P2-AC-39). U-05's 400 untouched."
    },
    {
      "operationId": "testLLMConnection",
      "method": "POST",
      "path": "/api/llm/test",
      "change": "\"Names a provider\" = one of the five provider values. Naming a provider never selects the organisation's key (spec P2-D6). {} / organization probe the organisation's configuration in row 4. New 400 `llmModel and llmApiKey cannot be used with your organisation's AI configuration` (row 4 with model or key). New 409 personal_keys_forbidden [organization_admin] when the organisation forbids personal keys and the body names a provider or carries llmApiKey (whatever llmProvider is). 200 LLMTestResult gains required configuration (own | organization). 422 LLMDestinationRefusal gains optional configuration (organization when the refused destination is the organisation's). 502 detail redacted of the org key too."
    },
    {
      "operationId": "getSettings",
      "method": "GET",
      "path": "/api/settings",
      "change": "aiStatus follows the Part 2 table (rows 1-8, 10, 11; row 9 reserved); AIStatus gains configuration (own | organization) present exactly when configured. llmProvider description updated."
    },
