  "operationsAdded": [
    {
      "operationId": "getOrganizationAI",
      "method": "GET",
      "path": "/api/organization/ai",
      "change": "Members only (403 SsoWriteMembershipRequired otherwise). 200 OrganizationAIConfiguration: identical bytes for every member, never the key (keySet only), configurationVersion, personalKeysAllowed, changeableBy organization_admin. 500 on read failure. Read-only. Planned generated (MIGRATION.md row noted)."
    },
    {
      "operationId": "patchOrganizationAI",
      "method": "PATCH",
      "path": "/api/organization/ai",
      "change": "Merge write of OrganizationAIConfigurationUpdate (required configurationVersion, minProperties 2, additionalProperties false). Gate order = PAC-50 §4.2: membership 403 -> body 400s (unknown/null property, missing configurationVersion, nothing to change, provider change without apiKey, apiKey/model/destination without a provider, provider \"\" with anything else, property not applying to the provider incl. model with azure_openai, unapproved destination) -> configurationVersion not current: 409 OrganizationAIConsentConflict configuration_changed with the current read, nothing stored, no grant consumed (revision 2, challenge B-1) -> consume newest live grant with purpose llm_org_key_write (never sso_write) -> else break-glass with session < 10 min and no earlier org-AI change by that session (403 organization_ai_write_requires_fresh_login when stale or already used, spec P2-D13) -> else 403 organization_ai_write_requires_admin_stepup {stepup_url, stepup_purpose: llm_org_key_write, stepup_scopes, without_stepup: [organization_ai_configuration_writes]} -> write -> 200 re-read. 500 after consume leaves the grant consumed. configurationVersion +1 on a change of provider, any apiKey write (keys never compared) or any destination property. Every write recorded for operators (never the key). Planned generated."
    },
    {
      "operationId": "confirmOrganizationAI",
      "method": "POST",
      "path": "/api/organization/ai/consent",
      "change": "Body {configurationVersion >= 1} (additionalProperties false). 400 bad body; 403 SsoWriteMembershipRequired; 409 OrganizationAIConsentConflict {reason organization_not_configured (wins when both apply) | configuration_changed, organization: current read}, nothing recorded; 200 AIStatus after recording. Idempotent for the current version. The only way a confirmation is recorded (patchSettings never records one). No MCP tool calls it. Planned generated."
    }
  ],
  "operationsChanged": [
