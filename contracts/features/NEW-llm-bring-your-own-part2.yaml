      "change": "Description and example only: rows 4 and 9 use the organisation's configuration; rows 5, 10, 11 are the not-configured 200 (new example organizationUnconfirmed). Response schema unchanged except AINotConfigured (below)."
    },
    {
      "operationId": "refreshMeetingBrief",
      "method": "POST",
      "path": "/api/meetings/{event_id}/brief/refresh",
      "change": "409 description lists the Part 2 rows (5, 7, 10, 11). Nothing written or fetched (P2-AC-27). U-05's 400 untouched."
    },
    {
      "operationId": "testLLMConnection",
      "method": "POST",
      "path": "/api/llm/test",
      "change": "Naming a provider never selects the organisation's key (spec P2-D6). {} / organization probe the organisation's configuration in rows 4/9. New 400 `llmModel and llmApiKey cannot be used with your organisation's AI configuration` (rows 4/9 with model or key). New 409 personal_keys_forbidden [organization_admin] when the organisation forbids personal keys and the body names a provider or carries llmApiKey. 200 LLMTestResult gains required configuration (own | organization)."
    },
    {
      "operationId": "getSettings",
      "method": "GET",
      "path": "/api/settings",
      "change": "aiStatus follows the Part 2 table (rows 1-11); AIStatus gains configuration (own | organization) present exactly when configured. llmProvider description updated."
    },
    {
      "operationId": "patchSettings",
      "method": "PATCH",
      "path": "/api/settings",
      "change": "Description only: llmProvider organization does not confirm; own provider/key writes accepted and stored while personal keys are forbidden, never sent (P2-D8). No new 400."
    }
