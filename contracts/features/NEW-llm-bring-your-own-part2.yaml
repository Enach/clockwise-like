  "operationsAdded": [
    {
      "operationId": "getOrganizationAI",
      "method": "GET",
      "path": "/api/organization/ai",
      "change": "Members only (403 SsoWriteMembershipRequired otherwise). 200 OrganizationAIConfiguration: identical bytes for every member, never the key (keySet only), configurationVersion, personalKeysAllowed, changeableBy organization_admin. 500 on read failure. Read-only. Planned generated (MIGRATION.md row noted)."
    },
    {
      "operationId": "patchOrganizationAI",
      "method": "PATCH",
      "path": "/api/organization/ai",
      "change": "Merge write of OrganizationAIConfigurationUpdate (minProperties 1, additionalProperties false). Gate order = PAC-50 §4.2: membership 403 -> body 400s (unknown/null property, empty body, provider change without apiKey, apiKey without provider, provider \"\" with anything else, property not applying to the provider, unapproved destination) -> consume newest live grant with purpose llm_org_key_write (never sso_write) -> else break-glass with session < 10 min (403 organization_ai_write_requires_fresh_login when stale) -> else 403 organization_ai_write_requires_admin_stepup {stepup_url, stepup_purpose: llm_org_key_write, stepup_scopes, without_stepup: [organization_ai_configuration_writes]} -> write -> 200 re-read. 500 after consume leaves the grant consumed. configurationVersion +1 on a change of provider, key or any destination property. Every write recorded for operators (never the key). Planned generated."
    },
    {
      "operationId": "confirmOrganizationAI",
      "method": "POST",
      "path": "/api/organization/ai/consent",
      "change": "Body {configurationVersion >= 1} (additionalProperties false). 400 bad body; 403 SsoWriteMembershipRequired; 409 OrganizationAIConsentConflict {reason organization_not_configured | configuration_changed, organization: current read}, nothing recorded; 200 AIStatus after recording. Idempotent for the current version. No MCP tool calls it. Planned generated."
    }
  ],
  "operationsChanged": [
