  "stage4Notes": [
    "2026-11-12 backend-implementer: factory decision on the plan's open item - a member who leaves an organisation has their org-AI confirmation removed when they leave, so rejoining asks again. The only membership change in the backend is storage.SetUserOrg (sign-in by email domain); it now deletes the member's confirmations for every other organisation in the same transaction, and ConfirmOrgAI re-checks membership under the users-row lock (a confirmation racing a move records nothing; the operation answers its existing 403 org_membership_required). Paths added above: backend/storage/orgs.go, backend/storage/settings.go. No interface change.",
    "Embedding 036 makes PAC-84's downgrade-schema tests (which require version 034) fail on main's base, exactly as PAC-71's 035 did; PAC-71 fixed it with a test-only migration ceiling. That mechanism and the two test edits are ported verbatim (no production behaviour change: the ceiling is 0 outside tests). If PAC-71 merges first these hunks already exist on main.",
    "Review finding 3 (2026-11-12): SetUserOrg reads the previous org_id under the users-row lock; when the organisation changes it deletes ALL the user's confirmations, so a confirmation kept from before PAC-87 for the organisation being rejoined never confirms the rejoin (supersedes the earlier 'removed at the next sign-in' note). The migration text was not extended (normative).",
    "2026-11-12 merge with main after PAC-71 (80f68a4) and PAC-91 (36f5936): PAC-87 keeps 036 above PAC-71's 035. PAC-71's session re-check runs first in ConfirmOrgAI (PAC-71's own) and, added here per review finding 1, first in SaveSettingsEndingOrgAIConfirmation's transaction before the users-row lock; PAC-71's guarded DeleteOrgAIConfirmations is kept (no production caller). The ported SetMigrationCeilingForTest hunks are identical to main's. contractHash recomputed for the PAC-71 + PAC-87 bundle."
  ],
