    "readers": "md 3: every requested id answered readable / unknown with windows / unknown, or the whole call fails. Google: groups expanded (readable iff no expansion error and every member readable; group windows = members' windows), per-calendar errors -> unknown with windows kept, omitted -> unknown, unrequested non-member entries dropped, exact then case-insensitive key match. Microsoft: value[].error -> unknown with non-free items kept, omitted -> unknown. WebCal (dead) answers unknown.",
    "blockingRule": "md 5.1, D-11: reported windows block whatever the outcome; unknown with no windows does not block; unknown never presented or used as free. Binding on PAC-129.",
    "cache": "md 4: key requester+lowercased address+start instant+end instant; TTL 15 min from store; unknown cached; credential-lost not cached; LRU max 10,000 (unexported field, 0 = default).",
    "mcpTools": {
      "clockwise_find_free_slots": "args start (req), end (req), attendees (new, optional, comma-separated, trimmed); relays RawFreeBusyAnswer as text; description states unknown means not checked, never free (md 6.1, exact text).",
      "clockwise_create_event": "args title, attendees, duration, preferred_date, location (unchanged), start (new, RFC3339), accept_unknown (new, boolean), accepted_unknown (new, comma-separated). Without start: suggest; no unknown -> book first slot; unknown -> book nothing, return exact S/E, unknown names and how to accept. With start: one raw lookup over [S, S+duration]; refuse (own unknown, any overlapping window, unknown set not within accepted) with 'Not booked: ... Call clockwise_create_event again without start ...'; unknowns accepted but accept_unknown not true -> first-call answer for S; else book exactly S/E (md 6.2, exact texts).",
      "clockwise_suggest_meeting": "schema unchanged; description names unknown_attendees (md 6.3, exact text)."
    },
    "testDoubles": "md 7: engine mockCalOps answers own id readable, listed attendees as told, others unknown, records calls; e2e Google stand-in answers a fixture credential's calendar readable even when empty/cleared (AC-37); backend Graph stand-in via the graphBaseURL seam, shareable with PAC-129 AC-14.",
    "seams": "md 8: calendar.InstallGraphBaseURL (new, PAC-80 rules); engine FreeBusyService cache maximum and Clock (unexported fields); existing newOutlook, budget.Middleware with a short budget, mcp fake backend."
  },
