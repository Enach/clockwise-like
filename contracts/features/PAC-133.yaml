      "change": "BREAKING 200: RawFreeBusyAnswer {own, calendars[]} replaces RawGoogleFreeBusyMap; own calendar always read; one entry per requested attendee (none absent); known (busy required) / unknown (busy only when reported, minItems 1) as oneOf on disjoint status; groups with members; unrequested extras dropped. New plain-text 400 'end must be after start' after the parse 400s and before the credential (so before any 401). 500 unchanged; per-calendar errors (own included) are never the 500.",
      "statuses": {"200": "reshaped", "400": "new message", "401": "unchanged", "500": "unchanged"}
    },
    {
      "operationId": "queryFreeBusy",
      "change": "Shape unchanged. unknown also for a per-address error, an omitted address, a group not fully read; unknown carries reported windows in all three views. New JSON 400 'end_time must be after start_time', last of the 400s, before cache and provider. Cache: exact start/end instants, 15 min, unknown cached, credential-lost not cached, LRU max 10,000.",
      "statuses": {"200": "values", "400": "new message", "401": "unchanged", "500": "unchanged"}
    },
    {
      "operationId": "suggestMeetingSlots",
      "change": "ScheduleSuggestions.unknown_attendees (required, [] when all read; named as sent, request order, groups by group address). Unknown attendee does not constrain beyond reported windows. Own calendar unknown -> 500 internal error. 500 description corrected: never the out-of-hours allowance text.",
      "statuses": {"200": "new required member", "400": "unchanged", "401": "unchanged", "500": "new cause, description corrected"}
    },
    {
      "operationId": "previewCompression",
      "change": "No position proposed where an attendee is unknown or a reported window overlaps; at most one free/busy call per evaluated candidate; 503 RequestBudgetExpiredError listed (never a partial 200); info.description lists previewCompression among the operations that reach the budget.",
      "statuses": {"200": "values", "400": "unchanged", "401": "unchanged", "500": "unchanged", "503": "listed"}
    },
    {
      "operationId": "applyCompression",
      "change": "Shape unchanged. Event read first, then one free/busy call for its non-self non-declined attendees over the proposed interval minus the current one; conflict -> 'attendee conflict at proposed time', else failed call or unknown -> new 'attendee availability unverified'; no attendee -> moved without a call. failed reasons documented.",
      "statuses": {"200": "values", "400": "unchanged", "401": "unchanged", "500": "unchanged"}
    },
    {
      "operationId": "parseNaturalLanguage",
      "change": "Shape unchanged. On a failed suggestion step with no error already set: error = 'No Google calendar is connected, so Paceday cannot suggest meeting times.' (ErrCalendarNotConnected) or 'Paceday could not suggest meeting times for this request. Try again later.' (other); suggested_slots absent; an error already set wins.",
      "statuses": {"200": "values", "others": "unchanged"}
    }
