  "operationsAdded": [
    { "operationId": "disconnectMicrosoft", "method": "POST", "path": "/api/auth/microsoft/disconnect", "change": "NEW. Protected. Atomically removes the caller's Microsoft credential (whether or not it decodes) and clears any recorded loss, and resets conferencing teams -> meet (D-8); calendar provider unchanged (D-3); nothing sent to Microsoft (OQ-1 resolved: no single-grant revocation callable, D-5). 200 ProviderDisconnectResult {provider: outlook, revocation: not_offered | nothing_stored}; one provider_disconnected entry (best-effort, written after the removal) when a credential was removed, none otherwise. 401 PlainTextError. 500 ErrorResponse only before the atomic change commits: nothing changed. No 409. Implemented through the generated interface (factory section 4; MIGRATION.md row flips in the backend PR)." }
  ],

  "operationsChanged": [
    { "operationId": "disconnectZoom", "method": "POST", "path": "/api/conference/zoom/disconnect", "change": "204 (empty) -> 200 ProviderDisconnectResult {provider: zoom, revocation: confirmed | unconfirmed | nothing_stored}. (1) Atomic local removal first (whether or not the stored value decodes; loss cleared; conferencing -> meet unconditionally, D-9). (2) An empty, expired or expiry-unknown access token is renewed with the removed refresh token; the renewed tokens are held in memory only, never stored; a failed renewal (or none possible) -> unconfirmed, nothing sent, no connection_lost. (3) Revocation at POST https://zoom.us/oauth/revoke with the unexpired or renewed access token; undecodable credential -> unconfirmed, nothing sent. Local removal stands whatever happens (D-2). (4) Entries, best-effort, after the outcome is known: confirmed -> 1 provider_disconnected; unconfirmed -> provider_disconnected + revocation_unconfirmed; nothing_stored -> none; a failed insert is logged and the 200 stands. 500 only before the removal commits: nothing changed and nothing was sent." },
    { "operationId": "createConferenceLink", "method": "POST", "path": "/api/conference/create", "change": "Teams/Zoom credential renewed when expired and stored for the caller. New 400 sentences 'teams: connection lost — reconnect at /api/auth/microsoft' and 'zoom: connection lost — reconnect at /api/auth/zoom' on a permanent refusal (loss recorded once). Temporary renewal failure is the existing 500. An expired Teams or Zoom access token with no stored refresh token: the same 400 'connection lost' sentence, no renewal request, nothing recorded. A Zoom credential with no stored expiry is treated as expired. API-052: body validated (title contains a non-whitespace character in the ECMA-262 sense, start and end required and not the zero time, end after start), failure is 400 'invalid body'. Request schema gains required [title, start, end], title minLength 1 and pattern '\\S'." },
    { "operationId": "addEventConference", "method": "POST", "path": "/api/events/{id}/conference", "change": "Renewal of Google, Teams and Zoom credentials. Same two new 400 sentences for Teams/Zoom permanent refusal. Google refusal (permanent or temporary) stays the 404 'event not found' (D-7, D-10); Teams/Zoom not touched then (AC-23). Teams/Zoom temporary failure is the existing 502 'upstream provider error'. Expired Teams/Zoom access token with no refresh token: the same 400 'connection lost' sentence, nothing recorded. No new status." },
    { "operationId": "listConferenceProviders", "method": "GET", "path": "/api/conference/providers", "change": "Description: connected means usable, whatever the calendar provider (AC-21): google_meet = Google token row stored AND not lost; zoom = stored credential decodes AND holds a refresh token AND not lost; teams = stored Microsoft credential decodes AND holds a refresh token AND not lost (the getAuthStatus outlook predicate); teams `enabled` follows `connected` exactly. Behaviour change vs today: a credential with no refresh token (or an undecodable Zoom value) now reads not connected. Shape unchanged. API-070 resolved on the contract side." },
    { "operationId": "getAuthStatus", "method": "GET", "path": "/api/auth/status", "change": "Description: connected means usable (stored and not recorded lost) on the outlook and google branches; owner-only (D-12). Shape unchanged; AuthStatusResponse.connected gains a description." },
    { "operationId": "listAuditEntries", "method": "GET", "path": "/api/audit", "change": "AuditEntry.action enum grows from 7 to 10: + connection_lost, provider_disconnected, revocation_unconfirmed (AC-22; the seven are unchanged, PAC-23 AC-14). Descriptions: entry subject may be a provider connection; CONNECTION ENTRIES paragraph (owner-only, actor may differ, one per loss, details are server-chosen JSON)." },
    { "operationId": "microsoftOAuthCallback", "method": "GET", "path": "/api/auth/microsoft/callback", "change": "Description only: a response without a refresh token keeps the stored one (AC-11); a credential left with no refresh token reads not connected on getAuthStatus and on the teams row; storing ends a recorded loss (AC-12). No response change." },
    { "operationId": "handleZoomOAuthCallback", "method": "GET", "path": "/api/auth/zoom/callback", "change": "Description only: stores expiry; keeps the stored refresh token when none is returned (AC-11); ends a recorded loss. No response change." },
    { "operationId": "googleOAuthCallback", "method": "GET", "path": "/api/auth/callback", "change": "Description only: a Google sign-in ends a recorded Google loss (AC-12, AC-24). No response change." },
    { "operationId": "disconnectCalendar", "method": "DELETE", "path": "/api/auth/disconnect", "change": "Description only: points to disconnectMicrosoft; its 409 for outlook/webcal is unchanged (OQ-3)." }
  ],

  "schemasChanged": [
    "ProviderDisconnectResult: NEW (auth fragment). {provider: enum [outlook, zoom], revocation: enum [confirmed, unconfirmed, not_offered, nothing_stored]}, both required, additionalProperties false.",
    "AuditEntry.action: enum + connection_lost, provider_disconnected, revocation_unconfirmed. AuditEntry description and details description extended (details for the new kinds: {provider}, {provider, revocation}, {provider}; always valid JSON).",
    "CreateConferenceRequest: required [title, start, end]; title minLength 1 and pattern '\\S' (API-052; the server's whitespace set is ECMA-262 \\s, so the schema and the server refuse the same titles); start documents that the zero time is refused as absent.",
    "ConferenceMeetingDetails: U-12 resolved. provider enum [meet, zoom, teams]; joinUrl loses format: uri (meet answers \"\"); x-uncertain removed.",
    "ConferenceProviderStatus.connected and .enabled: descriptions only, now stating each row's predicate (stored, decodable, with a refresh token for zoom and teams, and not lost).",
    "AuthStatusResponse.connected: description only.",
    "ProviderDisconnectResult.revocation: `unconfirmed` widened to cover a revocation that could not be attempted (undecodable credential, failed renewal); description only, enum unchanged.",
    "PublicLinkCoverage: description only, now says what is counted (stored Google token row, usable or not; D-14, spec section 6)."
  ],

  "interfaceChoicesMadeHere": {
    "oq1MicrosoftRevocation": "No single-grant revocation callable with the user's delegated token (oAuth2PermissionGrant delete needs DelegatedPermissionGrant.ReadWrite.All plus an admin role, unsupported for personal accounts; revokeSignInSessions is account-wide, forbidden by D-5). AC-17 'none' branch. PAC-67.md section 3.",
    "oq2ZoomRevocation": "POST https://zoom.us/oauth/revoke, Basic client credentials, token = access token, success body {status: success}. Zoom's OAuth page documents revoking the access token; it does not state on that page that this deauthorizes the app for the user. `confirmed` therefore means exactly 'Zoom answered success', and the plan verifies the deauthorization effect against a Zoom development app (never production). PAC-67.md section 3.",
    "oq3OutlookDisconnectLocation": "New operation POST /api/auth/microsoft/disconnect; DELETE /api/auth/disconnect and its PAC-35 409 untouched. PAC-67.md section 2.",
    "oq4CallbackBehaviour": "AC-11 changes what the Microsoft and Zoom callbacks store, not any response; descriptions updated. API-011 and API-012 are already Fixed (PAC-35), so nothing is inherited.",
    "reconnectError": "400 with the existing BookingError envelope and two new fixed sentences, beside the existing 'not connected' and 'stored credential is invalid — reconnect' sentences. PAC-67.md section 4.",
    "statusShape": "No field added to AuthStatusResponse or ConferenceProviderStatus; connected becomes 'usable'. PAC-67.md section 5.",
    "disconnectEntryCounts": "Zoom confirmed: 1 (provider_disconnected); Zoom unconfirmed, including undecodable credential and failed renewal: 2 (provider_disconnected + revocation_unconfirmed); Outlook: 1 (provider_disconnected, revocation not_offered); nothing stored: 0. All best-effort and written after the outcome is known: a failed insert is logged and the response stands. Answers round-5 challenge NB-2 and contract challenge finding 2. PAC-67.md section 6 and Revision 1.",
    "disconnectOrder": "Atomic local removal first, then (Zoom) renewal in memory if the access token is expired, then revocation, then entries. A 500 happens only before the removal commits and means nothing changed and nothing was sent. PAC-67.md section 6 and Revision 1.",
    "zoomRenewBeforeRevoke": "An empty, expired or expiry-unknown Zoom access token is renewed with the removed refresh token before revocation; the renewed tokens are never stored; a failed renewal is unconfirmed with no connection_lost. Contract challenge finding 4. PAC-67.md Revision 1.",
    "noRefreshTokenMeansNotConnected": "A Teams or Zoom credential with no refresh token reads not connected on its row (and Outlook on getAuthStatus, as today); once its access token expires, meeting creation answers the provider's 400 'connection lost' sentence and records nothing. Contract challenge finding 5. PAC-67.md Revision 1."
  },

  "assumedByTheFactory": [
    "A disconnect of a provider the caller holds no credential for answers 200 revocation nothing_stored and writes no activity entry (nothing about the caller's data changed beyond the conferencing reset that Zoom disconnect already did). Pending owner confirmation; to be recorded in the spec's Decisions on its branch.",
    "Zoom `confirmed` means Zoom answered success to the token revocation; whether that also deauthorizes the app for the user is verified by the plan against a Zoom development app. Pending owner confirmation.",
    "Activity entries for connection losses and disconnects are best-effort, like every existing kind: a failed insert is logged, the response stands, and that loss or disconnect has no entry (contract challenge finding 2; the alternative, a status for 'removed but not recorded', would make a disconnect that did happen look failed). Pending owner confirmation; recorded in the spec as D-16.",
    "An unconfirmed Zoom revocation offers no later retry: the token is not kept after removal, because keeping it would mean storing a credential the user asked to remove. Pending owner confirmation (contract challenge, non-blocking OWNER question); recorded in the spec as D-17.",
    "Until the PAC-67 frontend stage gives them wording, the activity log shows connection_lost, provider_disconnected and revocation_unconfirmed as raw identifiers, as it shows every kind today (Audit.tsx renders action raw). The frontend PR for this feature is expected to add the wording. Pending owner confirmation (contract challenge, non-blocking OWNER question)."
  ],

