      "pinned": "201 saved; 503 with RequestBudgetExpiredError body = no booking saved (the only answer that proves it); every other 5xx (500, a non-budget JSON 503, a proxy's JSON 502/504), a gateway error, a lost answer = outcome unknown; 4xx handling unchanged."
