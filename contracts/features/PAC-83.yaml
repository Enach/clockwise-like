    {
      "operationId": "* (every operation)",
      "pinned": "Budget 503 recognised iff status 503 AND JSON body AND RequestBudgetExpiredError.safeParse succeeds (never status alone). 413 recognised by status alone (backend and nginx both send {\"error\":\"request body too large\"}). A 5xx whose Content-Type is not application/json or whose body does not parse is a gateway error (backend 5xx are always the PAC-21 JSON envelope; nginx 502/504 are its default HTML). A handler panic is re-raised past every middleware (no recoverer), so it reaches the browser as nginx's 502 HTML (dev: the Vite proxy's text/plain 500): a gateway error. A proxy's JSON 5xx is an ApiHttpError, not a gateway error."
    }
  ],
