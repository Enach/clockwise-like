  "acceptanceTests": [
    "AC-1  [unit] For each former leak site (listCalendarEvents/getCalendarFreeBusy `not connected: `, patchEvent/addEventConference/removeEventConference `event not found: `, queryFreeBusy/patchSettings `invalid JSON: `, addEventConference eventTime, conference provider construction, autoScheduleCron), force the error with a distinctive marker string in the underlying error; assert the status is unchanged, Content-Type application/json, the body is exactly the documented fixed message, and the marker is absent. Extend pac21_error_bodies_test.go's source scan to fail on any writeError/http.Error whose message is built from an error value at ANY status, not only 5xx. Named exemptions (revision 4, round-3 challenge): the scan allows exactly these ten fixed-sentence validator call sites, each of the shape `writeError(w, err.Error(), <literal 4xx>)` where err is the result of the named validator called in the same function: handlers_habits.go create (:117) and update (:229) -> validateHabitFields; handlers_manager.go confirmDetection (:166) and addMember (:276) -> normalizeManagerEmail; handlers_manager.go addMember (:284) and patchMember (:386) -> validateManagerCadence; handlers_teams.go inviteMember (:188) -> normalizeManagerEmail; handlers_teams.go createZone (:340) and updateZone (:386) -> validateNoMeetingZone; handlers_settings.go patchSettings (:136) -> validateChangedSettings. The exemption table is keyed by (file, enclosing function, validator), is passed to scanErrorBodies as an argument, and matches only when the status is a literal 4xx and err comes from a call to that validator in that function; the same shape anywhere else, at any other status, or with any other err source is a violation. The test also checks, for validateHabitFields, normalizeManagerEmail, validateManagerCadence and validateNoMeetingZone, that every non-nil return is fmt.Errorf or errors.New with a single string literal and no further arguments; validateChangedSettings returns &validationError{msg} whose catalogue is SettingsValidationError, made all-fixed by the patchSettings entry (autoScheduleCron) and pinned by this AC's autoScheduleCron marker case. Response text at all ten sites does not change. Adding an exemption later requires naming its file, function and validator in this table and showing that the validator returns only fixed sentences.",
    "AC-2  [unit][e2e] A signed-in user with no stored Google credential calls each of the 18 operations that declare CalendarNotConnected: 401, application/json, body exactly {\"error\":\"calendar not connected\"}, no user id in the body. previewCompression in both modes, for the 401 and for the 500 (week mode with a closed DB: 500 {\"error\":\"internal error\"}, not 200 []); syncPersonalCalendar with a personal calendar whose feed reads successfully. A credential-store read error on the same operations is a 500 {\"error\":\"internal error\"}, not a 401. e2e: focus-time.spec.ts no-calendar scenario asserts 401 + that body; one analytics meetings scenario (API-054).",
    "AC-3  [contract][unit] A test over contracts/openapi/openapi.yaml fails if any 5xx response has a content type other than application/json, or a schema other than an {error: string} envelope, or a description matching /<err>|err\\.Error|raw (Go )?err|verbatim|underlying error|driver error/. Handler side: no writeServerErrorText or http.Error remains for a 5xx in backend/api (source scan); every 5xx path in pac21_error_bodies_test.go asserts Content-Type application/json.",
    "AC-3b [unit] confirmNaturalLanguage with selected_slot_index -1: 400 {\"error\":\"invalid selected_slot_index\"}, no panic.",
    "AC-6  [unit] Pin the two x-uncertain resolutions (written before the code): TestPatchEvent_SuccessBodyIsRawGoogleEvent (backend/api) PATCHes an event through a stub client and asserts the 200 body carries Google's own keys (`summary`, `htmlLink`, `start.dateTime`) and none of CalendarEvent's (`title`, `start_time`) (U-04). TestSmartScheduler_Suggest_StepsThirtyMinutes (backend/engine) runs Suggest over an empty calendar from a range_start at :07 and asserts every returned start minus range_start is a multiple of 30 minutes and at least one is not a multiple of 15 from the hour (U-07).",
    "AC-4  [process] PAC-21 moves to Done only after the implementation PRs merge with api-gate, web-gate and e2e-gate rc=0 on their final commits.",
