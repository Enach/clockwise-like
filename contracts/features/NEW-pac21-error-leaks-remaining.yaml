    { "consumer": "backend/api/pac21_error_bodies_test.go:158-171 TestPAC21WriteServerErrorTextKeepsPlainContentType", "breaks": "yes, by design (deletion authorised)", "detail": "Tests writeServerErrorText itself. AC-3 requires that no writeServerErrorText remains, so the helper is removed and this test is DELETED with it, in the same commit. This deletion is authorised by this contract; it is not a test deleted to go green. What replaces it: (a) the AC-3 source scan, which fails if writeServerErrorText or an http.Error on a 5xx reappears in backend/api; (b) TestPAC21WriteServerErrorGenericPerStatus (:127), which already covers the JSON writer's body, log and Sentry behaviour, and continues to. The log-and-Sentry assertion this test made for the text writer is therefore not lost." },
    { "consumer": "backend/api/pac21_error_bodies_test.go:376-399 TestPAC21CreateMeetingKeepsPolicyRefusalTextOnly", "breaks": "yes, by design", "detail": "Asserts TrimSpace(body) equals `out-of-hours meeting allowance reached` or `internal error` on createMeeting and on writeCreateMeetingFailure (nlp confirm). Both bodies become the JSON envelope. Replacement: the same two cases and both paths, asserting status 500, Content-Type application/json and the body exactly {\"error\":\"out-of-hours meeting allowance reached\"} / {\"error\":\"internal error\"}. The test may be renamed to drop `TextOnly`; its cases may not be reduced." },
    { "consumer": "backend/api/pac21_error_bodies_test.go:267-302 scanErrorBodies, :304 TestPAC21NoRawErrorsIn5xxBodies, :334 TestPAC21GuardCatchesKnownBadPatterns", "breaks": "yes, by design", "detail": "AC-1 extends the scan to error-derived messages at ANY status and AC-3 forbids writeServerErrorText. The guard fixture currently treats `writeError(w, err.Error(), http.StatusBadRequest)` (fixture line 13) as allowed and the http.Error hint names writeServerErrorText. Replacement: fixture line 13 moves to the violation list (wantLines gains 13), the hint names writeServerError, and the fixture gains at least one 4xx http.Error with an error-derived message as a violation. No allowed shape that is still allowed may be removed from the fixture. Revision 4 (round-3 challenge): the real scan exempts exactly the ten validator call sites named in AC-1 (handlers_habits.go create (:117) and update (:229) -> validateHabitFields; handlers_manager.go confirmDetection (:166) and addMember (:276) -> normalizeManagerEmail; handlers_manager.go addMember (:284) and patchMember (:386) -> validateManagerCadence; handlers_teams.go inviteMember (:188) -> normalizeManagerEmail; handlers_teams.go createZone (:340) and updateZone (:386) -> validateNoMeetingZone; handlers_settings.go patchSettings (:136) -> validateChangedSettings), via a table keyed by (file, enclosing function, validator). The guard test passes its own one-entry table (fixture.go, a function named `exempted`, validateHabitFields) and the fixture gains (a) one ALLOWED case: in `exempted`, `if err := validateHabitFields(...); err != nil { writeError(w, err.Error(), http.StatusBadRequest) }`; (b) one VIOLATION: the same validator call and write in a function not in the table; (c) one VIOLATION: in `exempted`, the same write at a 5xx status. Line 13 (`writeError(w, err.Error(), http.StatusBadRequest)` in f, err not from an exempted validator) stays a violation. TestPAC21NoRawErrorsIn5xxBodies may be renamed to reflect its widened scope; its exemption table may hold only the ten sites. None of the ten responses changes." },
