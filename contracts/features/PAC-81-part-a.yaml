  "mergeInterplay": [
    "PAC-71 (#242, origin/impl/pac-71-identity-binding-backend) rewrites auth.yaml; this contract does not touch auth.yaml, so there is no textual conflict there. There IS a semantic one, corrected in rev 2: PAC-71 gives googleOAuthCallback and microsoftOAuthCallback a CONNECT branch whose Location pattern allows only connect=credited or connect=not_credited and requires the connect state cookie to be expired. This contract's info paragraph now states the connect-branch budget answer (/?connect=not_credited, cookie expired, never signin_refused), which fits PAC-71's pattern. Reconciliation by whichever lands second: if PAC-71 lands first, this branch regenerates the bundle on top of it and the info paragraph already matches; if this lands first, PAC-71's stage-4 PR implements the budget answer on the connect branch and its tests cover it (the info paragraph names it), and followUps.callbackProseAfterPac71 folds the rule into the four 302 descriptions. PAC-71 also inserts a 401 at the top of the responses of getTeamAvailability (teams.yaml) and parseNaturalLanguage (scheduling.yaml); this contract appends 503 after 500 and edits description lines PAC-71 does not touch, so git should merge both without conflict. The regenerated openapi.yaml, MIGRATION.md and paceday.gen.go will conflict textually whichever lands second: resolve by regenerating (make openapi), never by hand.",
    "PAC-72 (origin/impl/pac-72-offerable-start-backend) rewrites createPublicBooking's description, its 201 description and the 429 status list (it removes 422), and getPublicBookingSlots' description. Whichever merges second must hand-merge: keep PAC-72's 201 sentence about start/end and add this contract's AC-A19 text; keep 503 in the 429 status list; keep PAC-72's offerable-slot paragraph and this contract's host-read paragraph. The PAC-72 pre-insert per-host read loop falls under AC-A18 (shared 503, no booking written)."
