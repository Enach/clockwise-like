  "operationsAdded": [
    { "operationId": "getReadiness", "method": "GET", "path": "/api/ready", "fragment": "contracts/openapi/paths/ops.yaml (new)", "change": "Readiness probe. security: []. 200 {status: ready} when not shutting down and a DB ping answers within 2 s (the 2 s includes the wait for a pooled connection); 503 {error: 'not ready'} (PAC-21 envelope; rev 2, was {status: not_ready}) otherwise, within 2 s + 1 s, including for the whole 5 s unready notice after SIGTERM/SIGINT. Single flight: at most one ping in flight per process, concurrent calls share its result, so readiness never holds more than one pooled connection (rev 2). No cause in the body. Unreachable during migrations (listener not open); through nginx that is nginx's 502. Outside every abuse limit; operators may restrict it at their proxy (docs/security.md B8)." }
  ],

  "operationsChanged": [
    { "operationId": "createPublicBooking", "method": "POST", "path": "/api/book/{slug}", "change": "201 description replaced (AC-A19): post-save host events and email run as one detached, drain-tracked unit; the 201 is sent when it finishes or the budget runs out, so a host event may be written after the response; body unchanged. 503 added (schema RequestBudgetExpiredError): only before the booking insert is sent (rev 2); once it is sent the handler waits for the insert's own result and answers 201 (saved) or 500 (failed), never 503. The 503 proves no booking was saved; the 500 does not (lost connection = unknown outcome), stated on the 500. 429 paragraph's status list gains 503." },
    { "operationId": "getPublicBookingSlots", "method": "GET", "path": "/api/book/{slug}/slots", "change": "Description: per-host reads on <= 4 workers, 15 s each (shortened to budget - 10 s margin); provider error, not connected or own-limit timeout -> host treated as free (timeout case new, named); a read hitting a budget-shortened deadline counts as cut by the budget (rev 2); a host or day not read because of the budget -> 503, never a truncated 200 (AC-A18, AC-A2's 60-day case). 503 RequestBudgetExpired added." },
    { "operationId": "getTeamAvailability", "method": "GET", "path": "/api/teams/{id}/availability", "change": "Description: same per-member rule as slot listing (AC-A18); own-limit timeout named as treated-as-free; a budget-shortened deadline counts as a budget cut (rev 2); budget cut -> 503. 503 RequestBudgetExpired added." },
    { "operationId": "syncPersonalCalendar", "method": "POST", "path": "/api/personal-calendars/{id}/sync", "change": "503 added (AC-A17): budget stop; recorded creates kept; last_synced_at not stamped; re-run completes without duplicating recorded creates; residual (create timing out after provider accepted) stated. 500 description: ICS over 15 s or 10 MiB is 'the personal feed could not be read'." },
    { "operationId": "parseNaturalLanguage", "method": "POST", "path": "/api/nlp/parse", "change": "503 added (AC-A2; pool wait). 500 description: an LLM call failing on its own 30 s limit is a provider failure, not the 503." }
  ],

