    "AC-25  [web unit] Settings carries an entry point for the SSO administrator step-up (owner 2026-10-27, spec §9 D-11/D-13, revision 7): before any navigation it explains the scopes each configured provider's step-up requests and what is lost without it (the same stepup_scopes and without_stepup the step-up 403 carries, obtained without an SSO write), says a grant lasts 10 minutes and covers one SSO write, offers only configured providers (none, and says so, when none is), and navigates to stepup_url with the chosen provider only on go-ahead; declining navigates nowhere. On return with stepup=granted or stepup=denied&reason=<reason> it states the outcome. Not offered to a user with no organisation. Revision 8: the values come from GET /api/admin/sso/stepup/options (never from a write); its 403 means no entry point; on stepup=granted Settings says the grant is live for 10 minutes from the step-up and is spent by the next SSO configuration write (create, replace or delete), and makes no write and starts nothing itself; an unknown reason is shown as a denial without detail; no or another stepup value shows no outcome. Revision 8.1 (N6): PAC-50 serves no suspend or resume, so Settings neither names them nor offers any SSO write, suspend or resume control.",
