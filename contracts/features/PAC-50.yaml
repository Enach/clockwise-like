  "operationsChanged": [
    {
      "operationId": "createSsoProvider",
      "method": "POST",
      "path": "/api/admin/sso",
      "change": "Write gate of spec §4.2 documented in order (membership 403, body shape 400, exact domain 400, step-up grant or fresh break-glass, else 403). 400 gains `unknown property: <name>` and `provider_domain_mismatch` (replaces the 403 `can only configure SSO for your own domain`); 403 body becomes SsoWriteForbiddenResponse. Domain rule exact and case-insensitive, stored lower-cased."
    },
    {
      "operationId": "deleteSsoProvider",
      "method": "DELETE",
      "path": "/api/admin/sso/{domain}",
      "change": "Same gate. {domain} lower-cased and compared exactly (400 `provider_domain_mismatch` replaces the 403). 403 body becomes SsoWriteForbiddenResponse. New 404 `sso provider not found` when no row is deleted (API-067); 204 now means a row was deleted."
    }
  ],
  "operationsAdded": [
    {
      "operationId": "startSsoAdminStepup",
      "method": "GET",
      "path": "/api/admin/sso/stepup",
      "change": "New, behind the session. ?provider=google|microsoft (SsoStepupProvider). 302 to the IdP with the sso_stepup_state cookie; 400 missing/unknown provider; 401; 403 no org (D-1); 503 provider not configured (D-2)."
    },
    {
      "operationId": "ssoAdminStepupCallback",
      "method": "GET",
      "path": "/api/admin/sso/stepup/callback",
      "change": "New, behind the session. 302 to <FRONTEND_URL>/settings?stepup=granted or ?stepup=denied&reason=<8-value enum>, enforced by a pattern on Location; clears the state cookie. 401 without a session; 500 on storage failure (D-4)."
    }
  ],
  "operationsUnchanged": [
    "listSsoProviders - read authorization and secret projection are PAC-22's (lands after PAC-50, spec §4.9)."
  ],
  "schemasChanged": [
    "SsoProviderCreateRequest - minLength 1 on domain and provider_name (what the handler already enforces); x-uncertain U-21 replaced by the determined answer; undeclared properties now rejected by the server, matching the existing additionalProperties: false.",
    "SsoProviderResponse - shape unchanged; x-uncertain U-22 replaced by the observed answer; OIDCClientSecret linked to API-001 / PAC-22."
  ],
  "schemasAdded": [
    "SsoWriteForbiddenResponse - oneOf SsoWriteMembershipRequired | SsoWriteStepupRequired | SsoWriteFreshLoginRequired, disjoint on `error`.",
    "SsoWriteMembershipRequired - error in {org membership required, org not found}.",
    "SsoWriteStepupRequired - error const sso_write_requires_admin_stepup; stepup_url const /api/admin/sso/stepup (required).",
    "SsoWriteFreshLoginRequired - error const sso_write_requires_fresh_login.",
    "SsoStepupProvider - enum google, microsoft."
  ],
