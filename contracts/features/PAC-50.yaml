  "operationsChanged": [
    {
      "operationId": "createSsoProvider",
      "method": "POST",
      "path": "/api/admin/sso",
      "change": "Write gate of spec §4.2 documented in order: membership 403, body shape 400, exact domain 403 provider_domain_mismatch (SsoWriteDomainMismatch), step-up grant or fresh break-glass, else 403. The domain rule is exact and case-insensitive; the domain is stored lower-cased and not trimmed (' acme.com ', sub.acme.com and other.com are each 403 provider_domain_mismatch); the domain check runs before authorization, so nothing is written and a live grant is not consumed. 400 gains `unknown property: <name>`. 403 body becomes SsoWriteForbiddenResponse (four variants); the step-up variant carries stepup_url, stepup_scopes and without_stepup. A live grant is tried before break-glass, so a break-glass caller holding one consumes it. 500 body is main's PAC-21 {\"error\":\"internal error\"} and covers the grant lookup too. History: revision 1 replaced the old 403 `can only configure SSO for your own domain`; revisions 1-4 answered a domain mismatch with a 400, withdrawn in revision 5 (owner, 2026-10-27, spec §9 D-10)."
    },
    {
      "operationId": "deleteSsoProvider",
      "method": "DELETE",
      "path": "/api/admin/sso/{domain}",
      "change": "Same gate. {domain} lower-cased and compared exactly, not trimmed: a {domain} that is not exactly the org domain (/sub.acme.com, /other.com, /%20acme.com, and DELETE /api/admin/sso/stepup, which is this operation with {domain}=stepup) is 403 provider_domain_mismatch, nothing deleted, grant not consumed. 403 body becomes SsoWriteForbiddenResponse. New 404 `sso provider not found` when no row is deleted (API-067); 204 now means a row was deleted. 500 body is main's PAC-21 {\"error\":\"internal error\"} and covers the grant lookup too. The delete has no 400. History: revision 1 replaced the old 403 for a foreign domain; revisions 1-4 answered a mismatch with a 400, withdrawn in revision 5 (owner, 2026-10-27, spec §9 D-10)."
    }
  ],
  "operationsAdded": [
    {
      "operationId": "startSsoAdminStepup",
      "method": "GET",
      "path": "/api/admin/sso/stepup",
      "change": "New, behind the session. ?provider=google|microsoft (SsoStepupProvider). 302 to the IdP with the sso_stepup_state cookie; 400 missing/unknown provider; 401; 403 no org (D-1); 503 provider not configured (D-2); 500 {\"error\":\"internal error\"} when the state value cannot be generated (revision 3). Revision 4: missing/empty provider is the generated wrapper's text/plain 400; 503 also when APP_URL is unset; Secure follows PAC-20 (config.DecideSecureCookies / PACEDAY_INSECURE_COOKIES). Revision 5: description records the owner decision that the step-up is optional and that sign-in never requests its scopes (spec §9 D-11)."
    },
    {
      "operationId": "ssoAdminStepupCallback",
      "method": "GET",
      "path": "/api/admin/sso/stepup/callback",
      "change": "New, behind the session. 302 to <FRONTEND_URL>/settings?stepup=granted or ?stepup=denied&reason=<8-value enum>, enforced by a pattern on Location; clears the state cookie. 401 without a session; 500 on storage failure (D-4), body {\"error\":\"internal error\"} (PAC-21, revision 3). Revision 4: clearing cookie documented as Max-Age=0 plus PAC-20 Secure; 401 also JSON {\"error\":\"unauthorized\"} when the session's user row is gone."
    }
  ],
  "operationsUnchanged": [
    "listSsoProviders - read authorization and secret projection are PAC-22's. PAC-22 lands first (spec §9 D-12); the PAC-50 revision written after it lands describes PAC-22's response on these operations."
  ],
  "schemasChanged": [
    "SsoProviderCreateRequest - minLength 1 on domain and provider_name (what the handler already enforces); x-uncertain U-21 replaced by the determined answer; undeclared properties now rejected by the server, matching the existing additionalProperties: false.",
    "SsoProviderResponse - shape unchanged; x-uncertain U-22 replaced by the observed answer; OIDCClientSecret linked to API-001 / PAC-22.",
    "SsoProviderResponse.Domain - description names migration 029 (029_sso_admin_stepup), revision 5; main took 028 for 028_credential_losses.",
    "SsoProviderCreateRequest.domain - description: mismatch is 403 provider_domain_mismatch (revision 5)."
  ],
  "schemasAdded": [
    "SsoWriteForbiddenResponse - oneOf SsoWriteMembershipRequired | SsoWriteDomainMismatch | SsoWriteStepupRequired | SsoWriteFreshLoginRequired, disjoint on `error` (fourth variant added in revision 5).",
    "SsoWriteMembershipRequired - error in {org membership required, org not found}.",
    "SsoWriteStepupRequired - error const sso_write_requires_admin_stepup; stepup_url const /api/admin/sso/stepup; stepup_scopes {google?: string[], microsoft?: string[]} (the scopes the step-up requests beyond identity scopes; since revision 6 neither key is required, a key is present if and only if that provider's step-up is configured, i.e. startSsoAdminStepup would not answer 503 for it, and each present list has minItems 1); without_stepup: string[] of non-empty codes (since revision 6 not an enum, so a later value still validates; today only sso_configuration_writes). All four properties required (scopes and without_stepup added in revision 5, spec §9 D-11).",
    "SsoWriteFreshLoginRequired - error const sso_write_requires_fresh_login.",
    "SsoStepupProvider - enum google, microsoft.",
    "SsoWriteDomainMismatch - error const provider_domain_mismatch (revision 5, spec §9 D-10, owner 2026-10-27)."
  ],
