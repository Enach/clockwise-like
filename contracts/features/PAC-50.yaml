  "decisionsAssumed": [
    "D-1 startSsoAdminStepup for an orgless caller: 403 org membership required, no cookie.",
    "D-2 startSsoAdminStepup with the chosen provider unconfigured: 503 `<provider> step-up not configured`, no cookie.",
    "D-3 Callback cases spec §4.3 does not name mapped onto the existing enum: provider error / missing code / exchange or token failure -> token_invalid; absent/expired/tampered cookie, state mismatch, cookie for another org -> state_mismatch; Microsoft organisation lookup failure -> tid_mismatch; Microsoft role lookup failure -> not_admin; Google email_verified not true -> email_mismatch.",
    "D-4 Callback storage failure: 500 JSON, no usable grant.",
    "D-5 A 404 delete has consumed the grant; 404 body `sso provider not found`.",
