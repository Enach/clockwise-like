  "operationsChanged": [
    {
      "operationId": "createSsoProvider",
      "method": "POST",
      "path": "/api/admin/sso",
      "change": "Revision 8 (main merged, PAC-22 on it): request, 201 and 400 list are PAC-22's (SsoProviderCreateRequest OIDC only with an optional secret on a replace; 201 SsoProvider, no secret or certificate), placed inside PAC-50's gate. Gate order: membership 403 (org membership required / org not found, before the body is read) -> body 400s in PAC-22's order with PAC-50's `unknown property: <name>` after the three named SAML refusals -> exact domain 403 provider_domain_mismatch (SsoWriteDomainMismatch; ' acme.com ', sub.acme.com, other.com) -> PAC-22's stored-row 400 (secret left out) -> authorization (live step-up grant consumed, tried first; or break-glass with a session issued < 10 min ago and not > 1 min in the future) else 403 sso_write_requires_admin_stepup / sso_write_requires_fresh_login -> store lower-cased. Every 400/403 before authorization leaves the grant live; PAC-22's store-time refusal (its D-14) comes after the consume and spends it (spec §9 D-14). 403 body is SsoWriteForbiddenResponse (four variants). 500 {\"error\":\"internal error\"} covers the stored-row read, the grant lookup and the save. History: revision 1 replaced the 403 `can only configure SSO for your own domain`; revisions 1-4 answered a domain mismatch with 400, withdrawn in revision 5 (owner, 2026-10-27, spec §9 D-10); revisions 1-7 described the pre-PAC-22 request and the SsoProviderResponse 201, replaced in revision 8."
    },
    {
      "operationId": "deleteSsoProvider",
      "method": "DELETE",
      "path": "/api/admin/sso/{domain}",
      "change": "Same gate without a body. {domain} lower-cased and compared exactly, not trimmed: a {domain} that is not exactly the org domain (/sub.acme.com, /other.com, /%20acme.com, and DELETE /api/admin/sso/stepup, which is this operation with {domain}=stepup) is 403 provider_domain_mismatch, nothing deleted, grant not consumed. 403 body becomes SsoWriteForbiddenResponse. New 404 `sso provider not found` when no row is deleted (API-067), which has spent the grant (D-5); 204 now means a row was deleted, whatever its PAC-22 state. 500 {\"error\":\"internal error\"} covers the grant lookup too. The delete has no 400. History: revision 1 replaced the old 403 for a foreign domain; revisions 1-4 answered a mismatch with a 400, withdrawn in revision 5."
    },
    {
      "operationId": "setSsoProviderState",
      "method": "PUT",
      "path": "/api/admin/sso/{domain}/state",
      "change": "PAC-22's operation (on main since 0da1b8c), put behind PAC-50's gate in revision 8 (spec §9 D-12 item 1): 403 is SsoWriteForbiddenResponse (was ErrorResponse with the note 'PAC-50: SsoWriteForbiddenResponse after the rebase'); step 3 is 403 provider_domain_mismatch (SsoWriteDomainMismatch) as on the other writes; step 4 is createSsoProvider's authorization step; recorded as sso_provider_written op suspend/resume with via stepup/breakglass. Not served before PAC-50 is on main (PAC-22 D-16); serving it is PAC-22's follow-up and inherits this gate. Nothing else of PAC-22's description changes."
    }
  ],
  "operationsAdded": [
    {
      "operationId": "startSsoAdminStepup",
      "method": "GET",
      "path": "/api/admin/sso/stepup",
      "change": "New, behind the session. ?provider=google|microsoft (SsoStepupProvider). 302 to the IdP with the sso_stepup_state cookie; 400 missing/unknown provider; 401; 403 no org (D-1); 503 provider not configured (D-2); 500 {\"error\":\"internal error\"} when the state value cannot be generated (revision 3). Revision 4: missing/empty provider is the generated wrapper's text/plain 400; 503 also when APP_URL is unset; Secure follows PAC-20 (config.DecideSecureCookies / PACEDAY_INSECURE_COOKIES). Revision 5: description records the owner decision that the step-up is optional and that sign-in never requests its scopes (spec §9 D-11). Revision 8: check order stated (provider 400 -> membership 403 -> 503 -> 500; spec §9 D-14); the text/plain 400 is written by the handler (route mounted directly) with the generated wrapper's bytes; the 403 says org membership required also for a missing org row; getSsoStepupOptions named as the source of the values outside a write."
    },
    {
      "operationId": "ssoAdminStepupCallback",
      "method": "GET",
      "path": "/api/admin/sso/stepup/callback",
      "change": "New, behind the session. 302 to <FRONTEND_URL>/settings?stepup=granted or ?stepup=denied&reason=<8-value enum>, enforced by a pattern on Location; clears the state cookie. 401 without a session; 500 on storage failure (D-4), body {\"error\":\"internal error\"} (PAC-21, revision 3). Revision 4: clearing cookie documented as Max-Age=0 plus PAC-20 Secure; 401 also JSON {\"error\":\"unauthorized\"} when the session's user row is gone. Revision 8: description says Settings reads the outcome (AC-25)."
    },
    {
      "operationId": "getSsoStepupOptions",
      "method": "GET",
      "path": "/api/admin/sso/stepup/options",
      "change": "New in revision 8 (round-5 challenge B2; spec §9 D-13, AC-25, AC-26), behind the session. 200 SsoStepupOptions {stepup_url, stepup_scopes, without_stepup}, all required, additionalProperties false, built from the components SsoWriteStepupRequired uses (SsoStepupUrl, SsoStepupScopes, SsoWithoutStepup), and equal to the step-up 403's values on the same deployment. 401 text/plain. 403 SsoWriteMembershipRequired (no org, or org row gone). Read-only: no grant consulted or consumed, no cookie, no record; same body for a break-glass caller. The sso_stepup_state cookie's Path covers this path; the operation ignores it."
    }
  ],
  "operationsUnchanged": [
    "listSsoProviders - PAC-22's (SsoProviderList of SsoProvider, on main since 0da1b8c), taken from main unchanged in revision 8. Read authorization stays membership (PAC-22 spec §5); PAC-50 gates writes only."
  ],
  "schemasChanged": [
    "SsoProviderCreateRequest - PAC-22's schema (main) with descriptions amended in revision 8: undeclared properties are refused by the server with 400 `unknown property: <name>` (additionalProperties: false is now what the server does); domain is compared exactly and case-insensitively, untrimmed, 403 provider_domain_mismatch, stored lower-cased.",
    "SsoProvider.domain - description added in revision 8: lower-case for every row written since PAC-50; migration 030_sso_admin_stepup lower-cases older rows (main took 029 for 029_llm_bring_your_own).",
    "SsoProviderResponse - removed (PAC-22 replaced it with SsoProvider; revisions 1-7 described it).",
    "SsoWriteStepupRequired - revision 8: stepup_url, stepup_scopes and without_stepup are $refs to SsoStepupUrl, SsoStepupScopes and SsoWithoutStepup (same constraints as revision 6), shared with SsoStepupOptions.",
    "SsoWithoutStepup - revision 8.1 (N6): description names create, replace and delete; suspend and resume are covered only once setSsoProviderState is served. SsoWriteMembershipRequired - revision 8.1 (N4): also the 403 of startSsoAdminStepup. SsoProviderCreateRequest via createSsoProvider step 2a - revision 8.1 (N1): null is empty, not a type error.",
    "SsoWriteForbiddenResponse - revision 8: description names the three writes (createSsoProvider, deleteSsoProvider, setSsoProviderState).",
    "SsoWriteDomainMismatch - revision 8: description covers setSsoProviderState's {domain}.",
    "SsoWriteMembershipRequired - revision 8: also the 403 of getSsoStepupOptions.",
    "SsoWriteFreshLoginRequired - revision 8: a session issued more than one minute in the future is not fresh."
  ],
  "schemasAdded": [
    "SsoWriteForbiddenResponse - oneOf SsoWriteMembershipRequired | SsoWriteDomainMismatch | SsoWriteStepupRequired | SsoWriteFreshLoginRequired, disjoint on `error` (fourth variant added in revision 5).",
    "SsoWriteMembershipRequired - error in {org membership required, org not found}.",
    "SsoWriteStepupRequired - error const sso_write_requires_admin_stepup; stepup_url (SsoStepupUrl), stepup_scopes (SsoStepupScopes), without_stepup (SsoWithoutStepup); all four required (scopes and without_stepup added in revision 5, spec §9 D-11; components extracted in revision 8).",
    "SsoWriteFreshLoginRequired - error const sso_write_requires_fresh_login.",
    "SsoStepupProvider - enum google, microsoft.",
    "SsoWriteDomainMismatch - error const provider_domain_mismatch (revision 5, spec §9 D-10, owner 2026-10-27).",
    "SsoStepupOptions - revision 8: getSsoStepupOptions 200, {stepup_url, stepup_scopes, without_stepup}, all required, additionalProperties false.",
    "SsoStepupUrl - revision 8: string const /api/admin/sso/stepup, resolved against the API base origin (was inline on SsoWriteStepupRequired).",
    "SsoStepupScopes - revision 8: {google?: string[], microsoft?: string[]}, additionalProperties false, each present list minItems 1 / uniqueItems / non-empty items; a key iff that provider's step-up is configured (was inline, revision 6 rules unchanged).",
    "SsoWithoutStepup - revision 8: array minItems 1, uniqueItems, items non-empty strings (open list); today only sso_configuration_writes, now covering create, replace, delete, suspend and resume (was inline)."
  ],
