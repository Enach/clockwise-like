      "change": "Response becomes scoped to the authenticated caller. No request body, no path parameter, no new parameter, no new response code, no change to the shape of AuditEntry. ADDED AT REVISION 5 (challenge R4-F4): the operation description now carries a CURRENT SERVER BEHAVIOUR paragraph for the scope itself, naming API-005, parallel to the one the `limit` parameter has carried for API-074 since revision 2 - as of this revision storage.ListAuditLog selects with no user predicate, audit_log has no user_id column (001_initial.up.sql:44-49; no later migration touches the table; highest on disk is 024_settings_per_user), WriteAuditLog takes no user, and auditHandler reads no identity, so every authenticated caller receives every user's rows. Revisions 1-4 declared the scoped read in the present tense with no such paragraph; three challenges did not raise it, and the fourth did. The `limit` description is REWRITTEN AT REVISION 4 as a two-step resolution procedure rather than a list of cases, because revisions 1, 2 and 3 each enumerated cases and each claimed a completeness it did not have (revision 1 gave ?limit=10000 two answers; revision 2 claimed four cases and omitted the repeated parameter; revision 3 claimed five and omitted the conforming request, which is the only one the shipped client sends, leaving its own composition rule with nothing to compose over). Step 1 says which text is read - the first `limit` value that URL-DECODES, because url.ParseQuery drops a pair it cannot unescape, so ?limit=%zz&limit=10 reads 10 and not the default; multiplicity is settled here rather than being a case. Step 2 maps any string to one of five outcomes that partition every string: nothing read 50, non-integer 50, below minimum 50, in range THAT VALUE, above maximum 500 including int64 overflow. Unchanged at revision 5, which the revision-4 challenge upheld by re-executing both probes. x-uncertain U-02 removed. Response schema: action gains an enum and id narrows int64 -> int32. Also prose-only at revisions 3-5: no pagination, the never-null guarantee on the 200 and the line that makes it true, the rule that scoping governs who may read a row and not whose words are in it (naming all four request-supplied writers, by enclosing function since revision 5), the expected handling of an out-of-enum action and the fact that no consumer implements it, and the two headers plus trailing newline that make the 401 what AC-12 calls 'exactly as today'.",
      "declaredResponses": "200, 401, 500. NO 400, decided at revision 3, UPHELD by the revision-3 challenge, which proved both halves by execution, and UPHELD AGAIN by the revision-4 challenge on 2026-10-22, which re-ran both probes against this tree; revision 5 does not re-argue it. The generated request binder does answer some inputs with 400 - the description states exactly which, and revision 3 got this wrong twice: it is an EMPTY or BARE `limit` (?limit=, ?limit - ParseInt on the empty string), a non-integer value, a value that OVERFLOWS int64 (which is a range failure, not a parse failure, so revision 3's closing sentence 'the 400 is a parse failure, not a range one' was false), and a parameter supplied with two or more DECODABLE values. It is NOT an ordinary above-maximum value: ?limit=10000 binds fine and still resolves to 500, and the binder does not enforce minimum/maximum at all, so ?limit=0, ?limit=-5 and ?limit=10000 all reach the handler. But the binder is NOT MOUNTED: nothing in backend/ outside the generated file references HandlerFromMux, gen.ServerInterface, gen.Strict or imports api/gen (the falsifying grep is in the fragment and still returns nothing at revision 5), and /api/audit is served by the hand-written auditHandler registered at backend/api/routes.go:180 (`:179` at revision 4; `grep -n audit backend/api/routes.go` finds the one line), which discards strconv.Atoi's error and answers 200. No deployed server emits a 400 on this operation, so under factory §7 rule 2 the contract may not declare one; a declared-but-unreachable 400 would also generate a ListAuditEntries400TextResponse inviting a handler to return it. MIGRATION PRECONDITION: adopting the generated wrapper for listAuditEntries is a CONTRACT change, not merely a handler change, and the 400 (text/plain, PlainTextError - the convention this fragment already uses for listCalendarEvents) must be added in the same change, never after it. ADDED AT REVISION 4, answering the one condition the challenger attached to upholding the refusal: that precondition is in the `notes` cell of this operation's row in contracts/openapi/MIGRATION.md, whose own 'Moving a row' procedure is the action being preconditioned and whose status and notes columns are human-owned and preserved across regeneration (scripts/openapi_migration_report.py docstring); revision 5's regeneration left that file byte-identical.",
