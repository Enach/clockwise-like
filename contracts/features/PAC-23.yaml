  "rollback": "Code-only. Revert the backend and frontend PRs and LEAVE the audit_log.user_id column in place; the reverted code neither reads nor writes it and the accumulated attribution survives. Running 024_audit_log_user_id.down.sql drops the column and irrecoverably destroys every attribution written since the up migration - no rows are lost, but a down-then-up cycle leaves the entire table unattributed and every user's log permanently empty. Drop the column only if the feature is abandoned. Note that reverting restores the API-005 disclosure in full."
