    {
      "name": "AuditEntry",
      "change": "No property added or removed. Three property-level changes, all narrowing or correcting: (1) action gains enum [focus_created, focus_cleared, meeting_scheduled, meeting_moved, meeting_created, nlp_parsed, nlp_confirmed], replacing a revision-1 description that claimed a dotted key convention and gave two examples (settings.update, event.delete) that exist nowhere in backend/; (2) id narrows from format int64 to format int32 to match audit_log.id SERIAL; (3) details keeps type string but replaces the blanket 'do not parse' warning with a per-action statement of which writers emit valid JSON. Revision 3 added the degradation statement the closed enum was missing; revision 4 rewrote it, because it was wrong about the consumer; revision 5 corrects its last sentence, because the generated zod schema it said did not exist does (see degradation below). NOT ADDED AT REVISION 5, on purpose: the `auto_schedule_ran` literal that docs/specs/PAC-49.md v3 needs. The enum is closed and the fragment says what an eighth action costs - a contract change to this fragment - and that change is PAC-49's contract stage's to make under PAC-49's manifest, on top of this revision; it touches the enum list and three sentences around it (the 'complete set ... at all seven' sentence, the per-action details split, and 'no value in this enum distinguishes an action a person took from one the scheduler took'), and pre-adding a literal no writer emits would make this contract describe a server that does not exist, which is the rule the whole document is built on.",
      "breaking": "The action enum is a narrowing of a response field. No current value is excluded - the seven are the complete set the server can emit - so no conforming response becomes non-conforming. id narrowing from int64 to int32 does not change the generated TS type (number) and narrows the Go type; audit_log.id is SERIAL so no stored value falls outside int32. WHERE THE ENUM LANDS IN THE WEB REPO, corrected at revision 5 (challenge R4-F2): smart-calendar-flow/src/api/generated/types.ts (openapi-typescript 7.4.4) carries components.schemas.AuditEntry with the seven-member union, and src/api/generated/schemas.ts (typed-openapi 4.1.0) carries `AuditEntry = z.strictObject({ id: z.number().int(), action: z.enum([...seven...]), details: z.string(), created_at: z.iso.datetime() })` - both committed since smart-calendar-flow #87 (2026-10-10) and regenerated by this revision. NEITHER IS APPLIED TO THE AUDIT PATH: the only import from generated/schemas anywhere in that repo is SettingsUpdate (src/api/client.ts:2), getAudit (client.ts:1159-1166) still runs normalizeAuditEntries, and the page types entries with the HAND-WRITTEN AuditEntry at src/api/types.ts:222-227 (`action: string` is :224). So the enum has no effect on the shipped frontend in either direction today. DECISION FOR THE FRONTEND STREAM, which revision 4 deferred to an event that has now happened: PAC-23's frontend stream KEEPS the hand-written AuditEntry and does not switch the audit path to the generated zod schema. Reasons: (i) applying z.strictObject with a closed enum to getAudit would make one out-of-enum row discard the whole response, which is exactly the behaviour the fragment's degradation paragraph says a UI must not have, so adopting it is not a type swap but a behaviour change needing the placeholder rule implemented first; (ii) that adoption is not asked for by any PAC-23 acceptance criterion and src/api/types.ts is not in this manifest's allowedPaths; (iii) it belongs with the broader 'apply the generated schemas to the hand-written client' work, which is a frontend issue of its own, not a security fix's rider. Where the enum does bite today is Go: AuditEntryAction is already a defined string type in backend/api/gen/paceday.gen.go.",
      "degradation": "REWRITTEN AT REVISION 4; the revision-3 text asserted consumer behaviour that does not exist. LAST SENTENCE CORRECTED AT REVISION 5. What is true and unchanged: the 200 body is an array of this schema, so a single out-of-enum action makes the WHOLE response non-conforming rather than that one row, and the contract states the expected handling - render the row with a placeholder substituted for the unrecognised value, rather than discard the response. What was FALSE at revision 3: that the shipped client already does this. src/api/client.ts:451 (inside normalizeAuditEntries; `:435` at revision 4) is `action: typeof e.action === \"string\" && e.action ? e.action : \"unknown\"`, which substitutes `unknown` only for a MISSING, NON-STRING or EMPTY action; an unrecognised non-empty string such as focus.run passes through verbatim. The row does still render, but for a different reason - that client's AuditEntry types action as `string` (src/api/types.ts:224), so nothing validates against this enum at all. What was FALSE at revision 4: 'Factory §4 mandates a generated zod schemas.ts in that repo; it does not exist (PAC-52)'. It exists - src/api/generated/schemas.ts, AuditEntry = z.strictObject(...) with action: z.enum([...]), committed since smart-calendar-flow #87 - and it is exactly as unforgiving as the paragraph predicted; it is simply not applied to the audit path (only SettingsUpdate is imported from it). The schema description now says so. The day it is applied to getAudit, an out-of-enum value is a thrown ZodError and six good rows vanish with the odd one, which is the case the paragraph is for, and which is why the frontend stream keeps the hand-written type (see breaking).",
      "deliberatelyUnchanged": "The operation description's rule that this log 'has no authentication or configuration events' is NOT loosened at revision 5, although docs/specs/PAC-50.md v2.1 §4.6 drafts sso_stepup and sso_provider_written audit rows. PAC-50 §4.6 ('Recording', decided 2026-10-22) puts every SSO write and every step-up outcome in a dedicated SSO event table `(id, user_id, org_id, kind, details JSON, created_at)` created by its migration 027 - in its own words, 'the two records do not go into the activity log at all' - so nothing about this operation needs room for them; the revision-4 challenge's analysis stands - a per-user feed readable only by its subject cannot carry an attacker's denied step-up without inverting spec §3.5 - and the right answer is the one PAC-50 took, a destination that is not this table."
