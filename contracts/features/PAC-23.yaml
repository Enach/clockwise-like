      "breaking": "The action enum is a narrowing of a response field. No current value is excluded - the seven are the complete set the server can emit - so no conforming response becomes non-conforming. id narrowing from int64 to int32 does not change the generated TS type (number) and narrows the Go type; audit_log.id is SERIAL so no stored value falls outside int32. The audit path does not use generated types at all - smart-calendar-flow/src/api/generated/ contains no types.ts - and that client's AuditEntry is HAND-WRITTEN at src/api/types.ts:219-224 with `action: string` (the `action` line is :221). Generating types.ts from this bundle does produce a seven-member union, verified at revision 3 by running openapi-typescript 7.4.4; until that file exists and the client imports from it, the enum has no effect on the frontend in either direction. Where the enum does bite today is Go: AuditEntryAction is already a defined string type in backend/api/gen/paceday.gen.go.",
