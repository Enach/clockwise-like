  "operationsAdded": [],
  "operationsChanged": [
    {
      "operationId": "getPublicBookingSlots",
      "change": "Query: optional display_time_zone (IANA, pattern, maxLength 64, not Local, loadable), from, to (date; together; <= 42 days; not with date). Response: required time_zone, display_time_zone, range_from, range_to added. Days are display-zone days; overview bounded (default today + 41 in the day zone) replaces the whole-horizon read; storage failure in the overview is 500 (was an omitted day); one calendar read per accepted host per request. 400 messages: 'invalid display_time_zone, use an IANA time zone name', 'date cannot be combined with from or to', 'invalid from, use YYYY-MM-DD', 'invalid to, use YYYY-MM-DD', 'from and to must be given together', 'to must not be before from', 'range must not exceed 42 days' (plus the existing two). No status added or removed; 429 (120/min/client) and 503 unchanged; no caching headers."
    },
    {
