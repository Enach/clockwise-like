  "acceptanceTests": [
    "AC-1 [backend unit] Given a pending invite created by user U for team T, when an authenticated caller GETs /api/teams/invites/{token}, then 200 with exactly the keys teamName, inviterName, email, team_id, expires_at, inviter_email; team_id == T.id; expires_at parses as RFC 3339 and equals the stored expires_at; inviter_email == U.email; inviterName == U.name. Given an unknown token, then 404 {\"error\":\"invite not found\"}; given an accepted/declined/expired invite, then 410 {\"error\":\"invite is <status>\"} (unchanged).",
    "AC-2 [web unit] Given the backend shape of AC-1, normalizeInvite yields team_id == T.id, expires_at == the wire value and inviter_email == U.email; teamInvites.test.ts asserts that shape instead of the old hand-written fixture. Given that invite, the TeamInvite page renders the inviter (name, and email) and the expiry date; given inviter_email null and inviterName \"\", the page renders without an inviter line rather than 'undefined'.",
    "AC-3 [backend unit] Given a manager whose list holds an external member with FreeBusy unavailable, a Paceday member on a team the manager owns with an analytics_weeks row for exactly one of the 12 weeks, and a Paceday member on no team the manager owns (PAC-60), when GET /api/manager/analytics, then: external -> is_paceday_user false, data_available false, all 12 buckets data_available false; owned Paceday -> is_paceday_user true, data_available true, exactly one bucket data_available true; unowned Paceday -> is_paceday_user true, data_available false, all buckets zero with data_available false. For every member, data_available == any(weeks[].data_available).",
    "AC-4 [web unit] normalizeAnalytics keeps each bucket's data_available and the member's data_available as sent, and never defaults a missing data_available to true. Given a member with data_available false, MembersPanel shows 'no data' instead of a zero chart; given a bucket with data_available false, that bucket is drawn as 'no data', not as zero minutes.",
    "AC-5 [e2e] Against the compose stack: the invite page for a fresh invite shows the inviter and the expiry; the manager analytics panel for a member with no measured week shows 'no data', not 0 minutes.",
    "AC-6 [gate] api-gate, web-gate and e2e-gate print rc=0 on the final commit of each implementation branch."
