  "operationsChanged": [
    { "operationId": "patchEvent", "method": "PATCH", "path": "/api/events/{id}", "change": "200 body: CalendarEvent (toCalendarEventDTO of the event UpdateEvent returned). Was: GoogleCalendarEventRaw, the raw calendar/v3.Event. Rev 2: EventPatchRequest declares send_updates (all|none, absent none, passed to Google), room_resource_email (adds a room, never removes one), attendee_details (accepted and ignored); start/end accept a bare date (kept all-day) or a date-time; attendees keeps rooms and existing attendee entries. New fixed 400 bodies: invalid send_updates, invalid room_resource_email, start and end must both be dates or both be date-times. 404 only for a Google 404/410 from GetEvent; other GetEvent failures 500. 401 unchanged." },
    { "operationId": "deleteEvent", "method": "DELETE", "path": "/api/events/{id}", "change": "Rev 2: send_updates query parameter (all|none, absent none, anything else 400 invalid send_updates) passed to Google. A Google 404/410 is 404 event not found (was 500). 204, 401 and other 500s unchanged." },
    { "operationId": "createScheduledMeeting", "method": "POST", "path": "/api/schedule/create", "change": "200 body: CalendarEvent (toCalendarEventDTO of the created event). Was: GoogleCalendarEvent. Request body, 400, 401, 500 and the audit row unchanged." },
    { "operationId": "confirmNaturalLanguage", "method": "POST", "path": "/api/nlp/confirm", "change": "200 body: CalendarEvent (toCalendarEventDTO of the created event). Was: GoogleCalendarEvent. Request body, 400, 401, 500 and the audit row unchanged." }
  ],

  "schemasChanged": [
    "EventPatchRequest (rev 2): adds send_updates, room_resource_email, attendee_details; start/end lose format date-time and gain a pattern accepting an RFC3339 date-time or a YYYY-MM-DD date; descriptions describe the merge semantics. additionalProperties stays false: every key the web sends is now declared.",
    "CalendarEvent: description only (now names all four operations that return it; is_personal_block description extended to them). Shape, required and properties unchanged.",
    "GoogleCalendarEventRaw (calendar.yaml): DELETED, no longer referenced.",
    "GoogleCalendarEvent (scheduling.yaml): DELETED, no longer referenced; its x-uncertain (U-14) goes with it.",
    "GoogleEventDateTime, GoogleEventAttendee (scheduling.yaml): DELETED, referenced only by GoogleCalendarEvent."
  ],

  "decisionsAssumed": [
    "D-1: WITHDRAWN in revision 2 (challenge B-1). Revision 1 scoped PAC-29 to API-017 and deferred API-018, API-042..045; factory section 7.1 and the issue body require resolving them, and revision 2 does (D-5..D-9).",
    "D-2: the three responses use toCalendarEventDTO unchanged, including its filtering of room resource attendees out of attendees/attendee_details. The mutation responses therefore look exactly like the same event in the list; no new field (e.g. room_resource_email) is added. Assumed by the factory, pending owner confirmation.",
    "D-3: is_personal_block stays declared and always omitted, now on all four operations. Whether it is dead or its tagging logic is missing is a product question about the DTO, not about these three operations. Assumed by the factory, pending owner confirmation.",
    "D-4: the MCP tools clockwise_create_event and clockwise_update_event pass the backend body through to the MCP client verbatim; their text output changes from Google's keys to the DTO keys with no MCP code change. Accepted as part of PAC-29 rather than freezing the raw shape for MCP. Assumed by the factory, pending owner confirmation.",
    "D-5: send_updates on PATCH (body) and DELETE (query) is all or none and is passed to Google as sendUpdates; absent or null means none (today's behaviour for every call); any other value is a 400 and nothing is written. Only an explicit all emails guests, who are already on the event. Assumed by the factory, pending owner confirmation.",
    "D-6: PATCH never removes a room. attendees replaces the non-room attendees and keeps every existing room resource attendee; a non-empty room_resource_email (must be *@resource.calendar.google.com, else 400) adds that room if absent; empty, null or absent leaves rooms unchanged. Assumed by the factory, pending owner confirmation.",
    "D-7: attendee_details is declared, accepted and ignored. An attendee still listed in attendees keeps its Google entry (display name, RSVP, organizer, optional); a new email is added email-only; a client never sets another person's RSVP. Assumed by the factory, pending owner confirmation.",
    "D-8: start/end accept a YYYY-MM-DD date (written as Google date) or an RFC3339 date-time (written as dateTime, UTC). A date/date-time mix after applying the patch is a 400 and nothing is written. The web edit form omits start/end for an all-day event whose date and times were not changed. Assumed by the factory, pending owner confirmation.",
    "D-9: a Google 404 or 410 is 404 event not found on both PATCH (GetEvent) and DELETE; any other Google failure is 500 internal error on both. Assumed by the factory, pending owner confirmation."
  ],

