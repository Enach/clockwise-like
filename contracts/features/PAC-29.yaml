  "acceptanceTests": [
    "AC-1 [backend unit, handler] Given a calendar client whose UpdateEvent returns an event {id: evt-1, summary: New, start.dateTime, end.dateTime, attendees incl. one *@resource.calendar.google.com, hangoutLink}, When PATCH /api/events/evt-1 {\"title\":\"New\"}, Then 200, Content-Type application/json, and the body decodes to exactly the JSON of toCalendarEventDTO(that event): keys id, title, start, end present; title == New; start is a string (not an object); no key summary, htmlLink, hangoutLink, kind or etag; the room attendee absent from attendees. (The PATCH analogue of TestToCalendarEventDTO_JSONShape; replaces TestPatchEvent_SuccessBodyIsRawGoogleEvent.)",
    "AC-2 [backend unit, handler] Given a scheduler whose CreateMeeting returns {id: new-evt, summary: Team Sync, start/end dateTime}, When POST /api/schedule/create with a valid body, and separately POST /api/nlp/confirm with a valid parse_result and selected_slot_index 0, Then each answers 200 with a body equal to the JSON of toCalendarEventDTO(that event): title == Team Sync, start/end strings, no summary key. The audit rows meeting_created / nlp_confirmed are still written with event_id new-evt.",
    "AC-3 [backend unit] The list and a mutation agree: for one Google event E, the element GET /api/calendar/events emits for E and the PATCH 200 body for E are the same JSON object.",
    "AC-4 [web unit] Given fetch answers each of POST /api/schedule/create, POST /api/nlp/confirm and PATCH /api/events/{id} with a CalendarEvent DTO body {id, title: 'Sync', start, end}, When api.scheduleCreate, api.nlpConfirm and api.updateEvent resolve, Then each returns an object whose title is 'Sync' (so the 'Scheduled \"Sync\"' / 'Created \"Sync\"' toasts in Dashboard.tsx and ScheduleSuggestModal.tsx show the title, not undefined), and the three methods are typed with the generated components['schemas']['CalendarEvent'] (no hand-written response type, no reference to a Google* schema).",
    "AC-5 [gate] api-gate prints rc=0 on the final commit of the backend branch, and web-gate (make verify, REGEN=1) prints rc=0 on the final commit of the frontend branch."
  ],

