  "rollback": "Revert the implementation PRs; keep this contract revision immutable. No migration and no stored data change. Revert order: web first is not required, because the web reads only ev.title and a reverted backend restores today's 'undefined' toast, not a crash. A backend revert alone restores the raw Google body; the web generated types would then disagree with the server until the contract is reverted too, so a full rollback reverts backend, contract and web types together."
