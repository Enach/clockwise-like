  "followUps": {
    "room removal": "Not an audit finding. Under D-6 PATCH cannot remove or swap a room, because the CalendarEvent DTO does not expose rooms. Exposing the room on the DTO is a product question. Owner: product owner.",
    "is_personal_block": "Remove the dead DTO field or implement the tagging (x-uncertain on CalendarEvent.is_personal_block). Owner: product owner."
