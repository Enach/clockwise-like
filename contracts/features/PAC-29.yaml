  "decisionsAssumed": [
    "D-1: PAC-29 is scoped to API-017 (and U-04, U-14). The adjacent PATCH/DELETE defects named in the issue body (API-018 discarded send_updates/room_resource_email/attendee_details, API-042 DELETE ignores send_updates, API-043 all-day conversion, API-044 room loss, API-045 PATCH 404 vs DELETE 500) are not in the acceptance criteria and are deferred to their own issues. Assumed by the factory, pending owner confirmation.",
    "D-2: the three responses use toCalendarEventDTO unchanged, including its filtering of room resource attendees out of attendees/attendee_details. The mutation responses therefore look exactly like the same event in the list; no new field (e.g. room_resource_email) is added. Assumed by the factory, pending owner confirmation.",
    "D-3: is_personal_block stays declared and always omitted, now on all four operations. Whether it is dead or its tagging logic is missing is a product question about the DTO, not about these three operations. Assumed by the factory, pending owner confirmation.",
    "D-4: the MCP tools clockwise_create_event and clockwise_update_event pass the backend body through to the MCP client verbatim; their text output changes from Google's keys to the DTO keys with no MCP code change. Accepted as part of PAC-29 rather than freezing the raw shape for MCP. Assumed by the factory, pending owner confirmation."
