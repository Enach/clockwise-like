  "operationsChanged": [
    { "operationId": "getSchedulingLink", "method": "GET", "path": "/api/scheduling-links/{id}", "change": "403 {\"error\":\"forbidden\"} ADDED for a caller who is neither the owner nor an accepted co-host (API-006, U-08; was 200 with the full link). 404 now ALSO for a deleted link, for every caller, checked before the 403 (was 200 with active:false). x-uncertain removed: answered by the audit's U-08 decision and spec D-7." },
    { "operationId": "listSchedulingLinks", "method": "GET", "path": "/api/scheduling-links", "change": "Deleted links are omitted from owned and shared (was: listed with active:false). Paused links still listed." },
    { "operationId": "updateSchedulingLink", "method": "PATCH", "path": "/api/scheduling-links/{id}", "change": "Deleted link: 404 for every caller before the owner check and the body decode (was 403 for non-owners, 200 for the owner, which could resurrect it). Canonical duration_options / days_of_week now win over durations / days when carried (present, not null; [] counts), as on create (API-049; was alias wins). `active` now means pause/resume only." },
    { "operationId": "deleteSchedulingLink", "method": "DELETE", "path": "/api/scheduling-links/{id}", "change": "Deletes (distinct from pause). Deleted link: 404 for every caller, so a repeated delete is 404 instead of 204, and a non-owner gets 404 instead of 403. Response shapes unchanged." },
    { "operationId": "listSchedulingLinkBookings", "method": "GET", "path": "/api/scheduling-links/{id}/bookings", "change": "Deleted link: 404 for every caller (was 200 for the owner, 403 otherwise)." },
    { "operationId": "inviteSchedulingLinkHost", "method": "POST", "path": "/api/scheduling-links/{id}/hosts", "change": "Deleted link: 404 \"not found\" for every caller, before the owner check and the body decode; no host row written (was 201/200 for the owner, 403 otherwise)." },
    { "operationId": "listSchedulingLinkHostInvites", "method": "GET", "path": "/api/scheduling-links/host-invites", "change": "Invites to a deleted link are omitted. Invites to a paused link still listed (PAC-30 D-5 kept for paused)." },
    { "operationId": "listSchedulingLinkInvitesAlias", "method": "GET", "path": "/api/scheduling-links/invites", "change": "Same handler as listSchedulingLinkHostInvites; same omission." },
    { "operationId": "acceptSchedulingLinkHostInvite", "method": "POST", "path": "/api/scheduling-links/host-invites/{id}/accept", "change": "Deleted link: 404, host row unchanged (was 200 and the row updated)." },
    { "operationId": "declineSchedulingLinkHostInvite", "method": "POST", "path": "/api/scheduling-links/host-invites/{id}/decline", "change": "Deleted link: 404, host row unchanged." },
    { "operationId": "acceptSchedulingLinkInviteByLink", "method": "POST", "path": "/api/scheduling-links/{id}/accept", "change": "Same handler as acceptSchedulingLinkHostInvite; same 404." },
    { "operationId": "declineSchedulingLinkInviteByLink", "method": "POST", "path": "/api/scheduling-links/{id}/decline", "change": "Same handler as declineSchedulingLinkHostInvite; same 404." },
    { "operationId": "leaveSchedulingLink", "method": "POST", "path": "/api/scheduling-links/{id}/leave", "change": "Deleted link: 404 for every caller, checked before the owner check, and no host row removed (was: 204 and row removed for a host; 400 'owner cannot leave link' for the owner)." },
    { "operationId": "createSchedulingLink", "method": "POST", "path": "/api/scheduling-links", "change": "Description only: alias rule stated with the 'carried' definition; 409 names deleted links' reserved slugs. Behaviour unchanged (AC-8, AC-13 and AC-14a create pass today)." },
    { "operationId": "getPublicLinkInfo", "method": "GET", "path": "/api/book/{slug}", "change": "410 is judged on uses_count, which now counts cancelled bookings (API-051). 404 description names paused and deleted. Shapes unchanged." },
    { "operationId": "getPublicBookingSlots", "method": "GET", "path": "/api/book/{slug}/slots", "change": "Same 410 rule as getPublicLinkInfo. 404 description names paused and deleted." },
    { "operationId": "createPublicBooking", "method": "POST", "path": "/api/book/{slug}", "change": "Same 410 rule. 400 list corrected to include the reachable \"end must be after start\" (missing from the contract before) and the end<=start partition; API-073 removes two unreachable re-checks with no change to any answer." }
  ],

  "schemasChanged": [
    "SchedulingLink.uses_count: meaning changed to 'bookings ever made, cancelled included' (API-051, D-6, D-8); minimum: 0 added. Type and name unchanged.",
    "SchedulingLink.active: description added (false = paused; a deleted link is never returned).",
    "SchedulingLinkListResponse.shared: description notes deleted links are excluded.",
    "CreateSchedulingLinkRequest: descriptions of duration_options, durations, days_of_week, days, window_start, window_end. Shape unchanged.",
    "UpdateSchedulingLinkRequest: descriptions of duration_options, durations, days_of_week, days, window_start, window_end, active. Shape unchanged.",
    "SchedulingLinkBookingRecord.status: description (cancelled rows still count in uses_count)."
  ],

  "decisionsAssumed": [
    "C-1 (spec OQ-5, owner: contract-author): a live or paused link fetched by a caller who is neither the owner nor an accepted co-host answers 403 {\"error\":\"forbidden\"}, not 404. Assumed by the factory, pending owner confirmation. Rationale and rejected alternative in PAC-40.md section 3.",
    "C-2: no new response field marks a deleted link, because no response ever contains one; `active` keeps its name and type and means paused. Assumed by the factory, pending owner confirmation.",
    "C-3: whether uses_count is stored or derived is left to the plan; the contract fixes only its meaning. Assumed by the factory, pending owner confirmation.",
    "C-4: for a deleted link every by-id operation checks 'deleted' at the same point it checks 'no such link', i.e. before the owner check and before reading the body, so a malformed body on a deleted link is 404, not 400. Assumed by the factory, pending owner confirmation.",
    "Spec decisions D-1 to D-10 are inherited unchanged, all assumed by the factory, pending owner confirmation."
  ],

