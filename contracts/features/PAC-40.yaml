    "AC-4 [contract] Given a deleted link, When anyone GETs /api/book/{slug}, GETs /api/book/{slug}/slots or POSTs /api/book/{slug}, Then each answers 404 {\"error\":\"not found\"} and no booking row is created.",
    "AC-5 [contract] Given a deleted link with a pending invite, When the invitee lists invites (both spellings), Then it is absent; When they accept or decline (all four paths), Then 404 and the host row status is unchanged. Given an accepted co-host, When they leave, Then 404. Given a pending invitee, When they leave, Then 404 and their host row still exists unchanged. Given the owner, When they leave, Then 404 (not 400) and nothing changes.",
    "AC-6 [contract] Given a deleted link, When its owner lists its bookings, invites a co-host, or deletes it again, Then each answers 404 and nothing changes.",
    "AC-6a [contract] Given a deleted link and a signed-in user who is neither its owner nor an accepted co-host, When they GET, PATCH, DELETE, list bookings of, or invite to it, Then each status and body equals what the same user gets for a never-existing id, and nothing changes.",
    "AC-7 [unit] Given a deleted link with a confirmed future booking, When a host's busy time is computed, Then the booked time is busy. (passes today; pin)",
    "AC-8 [contract] Given a deleted link with slug S, When another link is created or patched to slug S, Then 409 {\"error\":\"slug already exists\"}. (passes today; pin)",
    "AC-9 [unit] Given a link with bookings and co-hosts, When the owner deletes it, Then its bookings and host rows still exist in storage. (passes today; pin)",
    "AC-10 [e2e] Given a signed-in owner on the Links page, When they delete a link and reload, Then it is not shown, and its public booking page shows the not-found state.",
    "AC-11 [contract] Given a paused link (PATCH active:false), When the owner lists or fetches it, Then it is returned with active:false; When the owner resumes it, Then its public page takes bookings. (passes today; pin)",
    "AC-12 [contract, data migration] Given a link inactive before the migration, When its owner lists links after it, Then it is listed with active:false and can be resumed or deleted. (passes today; pin)",
    "AC-13 [contract, Go test on POST] Given a create body with duration_options [30] and durations [45], days_of_week [1] and days [\"fri\"], Then the stored link has durations [30] and days [\"mon\"]. (passes today; pin)",
    "AC-14 [contract, Go test on PATCH] Given an existing link, When a PATCH carries the same four values as AC-13, Then the link has durations [30] and days [\"mon\"], the same result as AC-13. (fails today)",
    "AC-14a [contract, Go tests on POST and PATCH] duration_options null + durations [45] -> durations [45] on both verbs; duration_options [] + durations [45] -> 422 {\"error\":\"at least one duration is required\"} on both verbs, and on PATCH the link is unchanged. (PATCH empty-list case fails today)",
    "AC-15 [contract] Given a single-use link booked once, When that booking's status is set to cancelled, Then link info, slots and booking each answer 410 {\"error\":\"link is no longer accepting bookings\"} and the owner sees uses_count 1.",
    "AC-16 [contract] Given a link limited to 2 with two bookings, When one is cancelled, Then 410 and uses_count 2; When the owner raises max_uses to 3, Then exactly one more booking succeeds.",
    "AC-17 [contract] Given a link limited to 2 with one cancelled booking and no other, Then uses_count is 1 and exactly one more booking succeeds.",
    "AC-17a [contract, data migration if the count is stored] Given a link limited to 1 whose only booking was cancelled before deploy, When the change is deployed, Then it answers 410 and uses_count is 1. (fails today)",
    "AC-18 [e2e] Given a single-use link seeded for this test alone and booked once, When its booking is set to cancelled in the database, Then the public booking page still shows 'link no longer available'.",
    "AC-19 [contract] Given an active link with an accepted co-host and a pending invitee, When the owner or the accepted co-host GETs it, Then 200 with hosts; When the pending invitee or a stranger GETs it, Then 403 with body exactly {\"error\":\"forbidden\"}.",
