  "nonHttpInterface": {
    "migration": "037_scheduling_link_lifecycle: scheduling_links.deleted_at TIMESTAMPTZ NULL (existing rows null = paused, D-1; delete sets deleted_at and active=false) with CHECK (deleted_at IS NULL OR active = false) (binding, challenge K4-1); bookings.booker_erased_at TIMESTAMPTZ NULL with CHECK (booker_erased_at IS NULL OR (booker_name = '' AND booker_email = '')); NOT NULL kept. Down: drop both columns and constraints; cannot fail on erased rows, cannot restore a value; deleted links reappear paused, erased bookings read blank (contract section 4).",
    "erasureJob": "In-process, part B. Due: deleted_at IS NOT NULL, some booking with booker_erased_at IS NULL, max(end_time over all bookings, every status) + 90*24h <= now. One transaction per link: lock link row FOR UPDATE (not FOR NO KEY UPDATE/FOR SHARE: it must block a booking insert's FK check), re-check, UPDATE bookings SET name='', email='', booker_erased_at=now WHERE not yet erased AND the due rule holds in the same statement (K4-3), audit entry in the same transaction when rows changed. Failure rolls back that link only; ctx cancellation stops between links. Injectable clock and logger (contract section 5). Lock order: link row, its bookings, audit insert (KEY SHARE on the owner's users row); no lock held across a network call; a 40P01 is a per-link failure retried next run.",
    "schedule": "Once as part of start-up before the first periodic run, then @every 24h; both wrapped by cronJob (PAC-81 drain awaits a run in progress; no run starts once shutdown has begun).",
    "auditEntry": "Owner's activity log, action scheduling_link_bookers_erased, details JSON {link_id, link_title, bookings_erased, last_booking_end_at, ran_at}; exactly one per link per erasure; written by a transactional WriteAuditLogTx that returns its error.",
    "logLine": "Exactly one per run: 'booker-erasure: run at=<RFC3339 UTC> links_examined=<n> links_erased=<n> bookings_erased=<n> failures=<n>'; per failure: 'booker-erasure: link <uuid> failed: <class>' where class carries no row data: SQLSTATE Code via errors.As on *pgconn.PgError (the driver is pgx stdlib), never err.Error() and never a wrapped database error (Message and Detail can repeat the row; K4-4); Sentry gets no raw database error.",
    "operatorCommand": "paceday-operator booker-erasure status [--check]: read-only; dispatched before the PAC-71 path like 'encryption'; opens with storage.OpenNoMigrate, application_name 'paceday-operator booker-erasure', never applies a migration (schema below 037 or dirty: message, exit 1); per deleted link due, overdue or due within 7 days: link id, owner id, deleted_at, last_booking_end_at, erasure_due_at, bookings awaiting, 'overdue' if > 24 h past due; no name, email or title; exit 0 listed, 1 failure, 2 usage, 3 with --check when any link is overdue (PAC-84 numbering; K4-5); not written to operator_audit.",
    "runbook": "docs/runbook.md 'Booker erasure (PAC-40)': reach and limits (calendar events, sent emails, backups up to 14 days), start-up + daily and the run log line, the status command, backup retention bounds survival, after a restore start the backend and check the next run line before use, what to do on failures>0, erasure is irreversible even by revert. Also (K4-8): a rollback of A turns every deleted link into a resumable paused link and a re-upgrade does not restore the deletion, so record deleted link ids before rolling A back.",
