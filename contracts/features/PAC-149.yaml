  "scope": "A co-host invitation is to an address. The single invite and the co-host list (create, PATCH) never read accounts by address: outcomes own_address, already_host, invited (well-formed: lowercased, net/mail.ParseAddress returns it unchanged), not_added (not well-formed); the single invite decides owner address, existing entry, well-formedness (400), limit (422), then records a pending invitation (201 SchedulingLinkHost {email, is_owner:false, status:pending}); 404 'user not found' removed. Pending invitations are scheduling_link_hosts rows with user_id NULL and invitee_email set; roster and removal report show pending by address only, declined by address and status only, accepted as before; fixed order (invited_at, invite_position, lower(address), bytes, id). The invitee side (list, accept, decline, leave; both spellings) matches only the caller's own address and only when the caller is its single domain-confirmed holder; a failed match is the 500. Delete erases pending invitations in its write. Three duplicate spellings are deprecated. Migration 044 converts pending rows in place and drops those on deleted links, for freed placeholders, and clashes; down restores those with a holder.",
