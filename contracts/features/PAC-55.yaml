  "schemasChanged": [
    "Settings / SettingsUpdate (shared &settingsProperties map) — timeFormat added: type string, enum ['12h', '24h']; required in Settings."
  ],
  "responsesAdded": [
    "SettingsValidationError — message `timeFormat must be 12h or 24h`."
  ],
  "acceptanceTests": [
    "AC-1  A user who never chose reads timeFormat '12h' (GET; the column default).",
    "AC-2  PATCH {timeFormat:'24h'} then GET reads '24h', and every other property is exactly what it was.",
    "AC-3  Two users: the first setting '24h' leaves the second at '12h'; the second setting '24h' and then '12h' leaves the first at '24h' after each step.",
    "AC-4  A PATCH of another property, not mentioning timeFormat, leaves it '24h'.",
    "AC-5  PATCH timeFormat '', 'AM' or '24' is a 400 `timeFormat must be 12h or 24h`; 24, true or null is a 400 naming timeFormat; nothing is stored.",
    "AC-6  [web unit] For each signed-in surface, fixture local times 00:05, 09:00, 13:30, 23:59: on 24h the output is '00:05', '09:00', '13:30', '23:59' with no AM/PM, keeping any date or seconds; on 12h the output is identical to the output before this change.",
    "AC-7  [web unit] A scan of the web source finds no time of day formatted outside the one shared formatting module.",
    "AC-8  [e2e] With 24h chosen, the calendar week view's hour axis reads '07:00' … '20:00' with no am/pm.",
    "AC-9  [web unit] The calendar event tile and the agenda, with a 14:00-15:00 fixture event and 24h, show '14:00' and no AM/PM.",
    "AC-10 [e2e] Choosing 24h in Settings and saving changes the hour axis without a reload; in a fresh session (new browser context, which stands in for cleared site storage) Settings shows 24h and the axis is still 24-hour.",
    "AC-11 [e2e] A host with 24h sees a booking's time in 24-hour form in the bookings list for the link; that host's public booking page shows 12-hour slots (asserted in this test, on this host)."
  ],
