      "path": "/api/settings",
      "change": "Settings gains the required property timeFormat ('12h' | '24h', default '12h')."
    },
    {
      "operationId": "patchSettings",
      "method": "PATCH",
      "path": "/api/settings",
      "change": "SettingsUpdate gains timeFormat through the shared property map; any other value, including \"\", is a 400 `timeFormat must be 12h or 24h`; null is the existing 400."
    }
