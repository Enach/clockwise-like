      "detail": "It reads snake_case names the server has never sent (26 of them) and writes them back, where the Go decoder ignores them. additionalProperties:false now makes that a 400 instead of a silent discard, so the settings page stops saving until the adapter is rewritten. This is API-013 surfacing, not PAC-24 creating it: today those writes are already discarded, they just fail quietly. PUT /api/settings is REMOVED rather than kept as a shim: it shared additionalProperties:false with PATCH, so it would have 400d that same frontend body. The GET path is unaffected either way. The frontend stage must rewrite the adapter against the generated types, which is already spec AC-20."
