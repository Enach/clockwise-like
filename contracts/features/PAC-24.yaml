  "followUps": {
    "llmProbeEndpointAllowlist": "FILE THIS BEFORE MERGE. A caller can still steer the LLM probe indirectly: write llmBaseUrl or azureEndpoint into their OWN settings with PATCH /api/settings, then POST /api/llm/test. On openai/anthropic that sends their own key to their own host, which is harmless. On azure_openai/bedrock/vertex the credential is the deployment's AMBIENT cloud identity — llm_azure_openai.go:28-50 mints a token with azidentity.NewDefaultAzureCredential and sends it as Authorization: Bearer to c.Endpoint — so any signed-in user can direct a deployment-wide credential at a host they choose. This path exists today via PUT /api/settings plus POST /api/llm/test; PAC-24 neither opens nor closes it. The fix is a scheme/host restriction or an allow-list on the endpoint properties, which this spec does not ask for. Recorded rather than silently fixed, per factory README §7.",
    "spec24AC7Amendment": "FILE THIS BEFORE STAGE 3. Spec AC-7 as written makes an empty value clear any setting. recapSendTime has no empty state — TIME NOT NULL DEFAULT '08:00' plus recapSendTimeOrDefault (storage/settings.go:356-361). AC-7 must exempt it and say why. The contract author may not edit the spec, so this is the mechanism.",
    "propertyNamesGeneratorFidelity": "CHECK AT STAGE 4. propertyNames is a JSON Schema 2020-12 / OpenAPI 3.1 keyword. scripts/openapi_downconvert.py copies it verbatim into the 3.0.3 rendering oapi-codegen consumes (verified here: exit 0, the keyword survives), but kin-openapi does not model it, so the generated Go request validator very likely ignores it. The handler checks at handlers_settings.go:145 and :154 therefore remain the enforcement point on the Go side and must NOT be deleted as redundant; the generated zod schemas, which read the 3.1 bundle, should carry it. Same class of risk as the readOnly/writeOnly fidelity question in PAC-24.md §8.",
    "calendarCredentialLifecycle": "FILE THIS BEFORE MERGE. Spec §8 OQ-6: PAC-24 repoints the code that reads and writes the Outlook and Zoom credentials because the row they live in is moving, but does not address refresh, revocation, or reconciling the stored provider with what the user actually connected.",
    "auditRegisterAdditions": "Three defects found while writing the spec are not in docs/factory/api-audit.md and should be added as rows so the register stays true: the shared Outlook refresh token and deployment-wide provider flip (spec §2.5), the recap cron fan-out that sends one user's recap to every user (§2.6), and the fact that no production path ever creates a per-user settings row, which breaks focus-time scheduling for every user but the first (§2.4)."
  },

  "rollback": "Revert the implementation PRs and keep this contract revision immutable. The migration's down (024_..._down.sql) loosens settings.user_id back to nullable and MUST NOT delete the per-user rows it created — those rows hold every setting every user saved since the upgrade, and deleting them is the only irreversible act available. After a revert the reverted code reads WHERE id = 1 again, the other rows are inert but intact, and re-applying picks them back up. Two things do not roll back: the reverted code resumes destroying the owning user's row on every partial write (API-004 reopens immediately), and provider keys entered after the upgrade become unreadable and unusable without database access, because write-only means they cannot be retrieved to re-enter. Prefer fixing forward. See docs/specs/PAC-24.md §7."
