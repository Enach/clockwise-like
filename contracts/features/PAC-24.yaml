  "operationsRemoved": [
    { "operationId": "updateSettings", "method": "PUT", "path": "/api/settings", "reason": "Revision 1 retained it as a deprecated merge alias, on the argument that it shielded the pre-PAC-24 frontend across the factory's cross-repo window. Checked, and the argument is false. Its only consumer, smart-calendar-flow/src/api/client.ts:813, sends settingsRequestBody(s) - a spread of the snake_case Settings object (:550-563) carrying work_start, llm_api_key and 24 more - and PUT shared SettingsUpdate with PATCH, which is additionalProperties:false, so that body was a 400 on PUT exactly as on PATCH. mcp/client.go defines get/post/patch/delete and NO put (:22,43,47,52), and no MCP tool writes settings (clockwise_get_settings, mcp/tools.go:236, is a GET). e2e/tests/ has no settings spec. The alias covered nothing and cost a permanently deprecated operation, a MIGRATION.md row and a follow-up issue. Separately: a PUT whose omissions mean unchanged is not a replace, and `deprecated` documents an intention to remove, not a change of method semantics - generated clients and intermediaries read the method, not the flag." }
  ],

