    "auditRegisterAdditions": "Three defects found while writing the spec are not in docs/factory/api-audit.md and should be added as rows so the register stays true: the shared Outlook refresh token and deployment-wide provider flip (spec §2.5), the recap cron fan-out that sends one user's recap to every user (§2.6), and the fact that no production path ever creates a per-user settings row, which breaks focus-time scheduling for every user but the first (§2.4)."
