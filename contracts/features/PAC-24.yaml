    {
      "consumer": "Enach/smart-calendar-flow — src/api/client.ts normalizeSettings/settingsRequestBody, src/pages/Settings.tsx, src/hooks/useSettings.ts",
      "breaks": "yes",
      "detail": "It reads snake_case names the server has never sent (26 of them) and writes them back, where the Go decoder ignores them. additionalProperties:false now makes that a 400 instead of a silent discard, so the settings page stops saving until the adapter is rewritten. This is API-013 surfacing, not PAC-24 creating it: today those writes are already discarded, they just fail quietly. The PUT alias keeps the READ path working during the window."
    },
    {
      "consumer": "Enach/smart-calendar-flow — src/api/client.ts llmTest",
      "breaks": "no, and it starts working",
      "detail": "It already POSTs the whole edited settings object to /api/llm/test, which the server discarded. With LLMTestRequest and additionalProperties:false it must send the LLM subset instead, in camelCase. Until it does, the probe returns 400 rather than silently testing the wrong configuration."
    },
    {
      "consumer": "Enach/clockwise-like — mcp/tools.go:233 clockwise_get_settings",
      "breaks": "no",
      "detail": "It calls GET /api/settings/ and passes the JSON straight through (jsonResult), so it is shape-agnostic. No code change needed. It stops handing llmApiKey to whatever model is driving the MCP server, which is a third disclosure channel the audit does not name."
    },
    {
      "consumer": "Enach/clockwise-like — mcp/tools.go:239 clockwise_calendar_status",
      "breaks": "no",
      "detail": "AuthStatusResponse is unchanged in shape; only whose state it describes changes."
    },
    {
      "consumer": "e2e/seed/seed.sql:79-90",
      "breaks": "no",
      "detail": "It already inserts one settings row per user with ON CONFLICT (user_id), i.e. it already assumes the post-PAC-24 shape."
    },
