  "rollback": "Revert the implementation PRs and keep this contract revision immutable. The migration's down (024_..._down.sql) loosens settings.user_id back to nullable and MUST NOT delete the per-user rows it created — those rows hold every setting every user saved since the upgrade, and deleting them is the only irreversible act available. After a revert the reverted code reads WHERE id = 1 again, the other rows are inert but intact, and re-applying picks them back up. Two things do not roll back: the reverted code resumes destroying the owning user's row on every partial write (API-004 reopens immediately), and provider keys entered after the upgrade become unreadable and unusable without database access, because write-only means they cannot be retrieved to re-enter. Prefer fixing forward. See docs/specs/PAC-24.md §7."
