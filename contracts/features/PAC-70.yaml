  "operationsChanged": [
    { "operationId": "testLLMConnection", "method": "POST", "path": "/api/llm/test", "change": "The 422 LLMDestinationRefusal now also covers openai, anthropic and ollama (provider from the body when present, else stored): an effective destination not approved for that provider sends nothing. The check precedes the key-presence check, so a refused destination with no key is a 422, not the 500 'LLM not configured'. A redirect from an approved openai/anthropic/ollama destination is never followed and is a 502. The PAC-66 paragraph 'The user-key and keyless providers ... are unchanged by PAC-66 ... PAC-66-B' is replaced (spec inherited scope). Two stale sentences from before PAC-21 (502 'carrying the upstream error string', 'provider's own error text is still echoed') are corrected to describe the generic bodies the server already returns." },
