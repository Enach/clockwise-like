  "schemasChanged": [
    "LLMDestinationRefusal.property: enum grows from [azureEndpoint, gcpLocation, awsRegion, awsProfile] to add llmBaseUrl and ollamaBaseUrl. Additive on a response enum; the web repo uses this schema only as a generated type (no runtime parse), so nothing breaks before the regen.",
    "LLMDestinationRefusal.reason: values unchanged. Descriptions extended: provider_not_enabled now also means 'no Ollama origin approved'; destination_not_approved now also covers the base-URL cases (path, query, fragment, userinfo, whitespace, insecure scheme or non-default port on openai/anthropic, other-provider approval, refused Ollama built-in default). No existing reason changes meaning (spec D-B7).",
    "Settings / SettingsUpdate (shared property map): descriptions on llmBaseUrl and ollamaBaseUrl. No pattern or format, on purpose: stored pre-PAC-66-B rows are kept (D-B4) and the map is also the response schema (as PAC-66.md §3).",
    "LLMTestRequest.llmProvider and llmApiKey: descriptions say the check follows the body's provider on all six providers, and that the key goes only to a destination approved for its provider."
