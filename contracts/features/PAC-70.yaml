  "operatorConfiguration": {
    "variables": {
      "PACEDAY_LLM_APPROVED_HOSTS_OPENAI": "extra approved hosts for openai, in addition to the built-in api.openai.com",
      "PACEDAY_LLM_APPROVED_HOSTS_ANTHROPIC": "extra approved hosts for anthropic, in addition to the built-in api.anthropic.com",
      "PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA": "approved origins (scheme, host, port) for ollama; unset or empty means ollama is not enabled"
    },
    "builtIn": "api.openai.com is approved for openai and api.anthropic.com for anthropic, each over https on the default port, on every deployment (D-B2). No variable value, malformed or not, removes them (AC-B15, OQ-B4).",
    "formatHosts": "PACEDAY_LLM_APPROVED_HOSTS_OPENAI and _ANTHROPIC: exactly part A's format (PAC-66.md §4). Comma-separated; entries trimmed; empty entries skipped. An entry is a bare DNS host name or https://<host> with an optional single trailing '/'. Anything else (other scheme, port, path, query, fragment, userinfo, wildcard, IP literal, trailing dot) is malformed.",
    "formatOrigins": "PACEDAY_LLM_APPROVED_ORIGINS_OLLAMA: comma-separated; entries trimmed; empty entries skipped. An entry is <scheme>://<host>[:<port>] with an optional single trailing '/', where scheme is http or https, host is a DNS name (a single label such as ollama or localhost is allowed), an IPv4 literal in dotted-decimal, or a bracketed IPv6 literal, and port is 1-65535. Anything else (no scheme, other scheme, path, query, fragment, userinfo, wildcard, trailing dot, empty host, port out of range) is malformed.",
    "malformed": "A malformed entry is logged at startup naming the variable and the entry, and approves nothing; well-formed siblings stay approved; the server starts; no input approves everything (AC-B15).",
    "baseUrlShape": "A stored or submitted llmBaseUrl / ollamaBaseUrl names a destination only when it is exactly <scheme>://<host>[:<port>] with at most one trailing '/'. Any other path, any '?' or '#' (even with nothing after it), userinfo, or leading/trailing whitespace: not approved (D-B8, AC-B18, AC-B19). Nothing is trimmed or normalised before the check.",
    "matchingHosts": "openai / anthropic: scheme https (case-insensitive); port absent or 443; host equal, ASCII case-insensitive, to the built-in public host or an entry for THAT provider. No suffix, subdomain or wildcard matching. A trailing dot on the destination is not stripped, so it does not match (answers OQ-B6 spelling question for these providers).",
    "matchingOrigins": "ollama: scheme equal (case-insensitive); host equal, ASCII case-insensitive, textual (an IP literal must be written as in the entry, no numeric normalisation); port equal after applying the scheme's default (80 for http, 443 for https), so http://h and http://h:80 are the same origin. A trailing dot is not stripped. No suffix or wildcard matching.",
    "perProvider": "An entry approves a destination for its own provider only. A destination approved for ollama is never a destination for openai or anthropic, and the reverse (D-B5, AC-B11).",
    "effectiveDestination": "openai / anthropic: stored llmBaseUrl; when \"\", the vendor's public host. A non-empty value with no usable host (e.g. http:/) is refused, never replaced. ollama: ollamaBaseUrl; when \"\", llmBaseUrl; when both \"\", http://localhost:11434 (order unchanged, D-B9). The request path is exactly /v1/chat/completions (openai), /v1/messages (anthropic) or /api/chat (ollama), with no query."
  },

