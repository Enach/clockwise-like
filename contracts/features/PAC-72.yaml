  "rule": {
    "horizon": "Per link: booking_horizon_days, 1..365, default 60 (existing links 60 via the scheduling_link_horizon_refusal migration, whose number is fixed at merge time). Today (link zone) and the next N-1 days. Owner decision D-1 (2026-11-01). A-3 owner-decided. Date-less listing with a long horizon may end in PAC-81's 503, never truncated.",
    "zone": "The link OWNER's profile time zone (settings.timezone), read per request, never stored on the link; UTC when the owner has no settings row or the name does not load. Wall-clock: nonexistent DST wall times not offered, repeated ones offered once at the first occurrence. Exposed as PublicLinkInfo.time_zone and SchedulingLink.time_zone. Owner decision D-9; the collective-link and no-zone readings A-2/A-4 (spec R2.4) are owner-decided 2026-11-01. A failed READ of the owner's settings (storage error) is a 500 everywhere (booking: booking conflict check failed, nothing written; listing both modes; link reads), never UTC (revision 3.1, D-7). DST window edges: a nonexistent edge is taken at the change instant (window never grows); an edge in a repeated hour at its first occurrence; grid counted in wall time from window_start_time. Disclosed to anyone with the link (D-9).",
    "minNotice": "409 (owner confirmed D-2).",
    "unofferedDuration": "400 'invalid duration', unchanged (owner accepted D-3).",
    "refusalBody": "Link owner setting refusal_message (factory reading A-1 of \"user setting\"): generic (default) -> {\"error\":\"slot is no longer available\"}; specific -> {\"error\":<paired text>,\"reason\":<BookingRefusalReason>}. Owner-decided A-1 (2026-11-01); co-hosts have no say and can be disclosed as busy under specific. Order: zone read, then beyond_horizon / outside_link_hours / too_soon without busy-time reads, then taken / host_busy. Past-day start: too_soon unless outside_link_hours (never beyond_horizon).",
    "busyBookings": "any non-cancelled booking (pending or confirmed) on any link a host owns or co-hosts, this link included. Spec D-11.",
    "storageFailure": "booking 500 'booking conflict check failed', nothing written; listing with date 500 'internal error'; listing without date omits the day. Spec D-7.",
    "externalCalendarFailure": "Host BUSY for the whole window: listing offers no slot needing it, booking 409 (reason host_busy), nothing written; budget-unreached host is 503. Owner decision D-6, implemented on main by PAC-81 Part A.",
    "noAcceptedHost": "Nothing offered, booking 409 (reason host_busy under specific). D-10 accepted."
  },
