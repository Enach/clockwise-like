  "acceptanceTestsSource": "AC-1 to AC-16 are copied from docs/specs/PAC-41.md section 4 at Revision 2.1: whitespace joined (the bulleted criteria AC-10, AC-11, AC-14 and AC-16 keep their '- ' bullets inline), test level moved to the front, nothing dropped. AC-16 is rewritten (Revision 2: the exceptions; Revision 2.1: the session-ended 401); AC-3, AC-8, AC-10, AC-11 and AC-12 to AC-14 have new wording and interim notes. The only addition is the marked manifest note on AC-11. Where this list and the spec differ, the spec wins.",
  "acceptanceTests": [
    "AC-1 [e2e] Given a signed-in Google user whose calendar list contains a room resource named \"Helsinki\", when they open an event, choose \"Book a room\", pick \"Helsinki\" and save, then the event stored on their calendar has the Helsinki room address as a resource attendee. *(Fails today: the save carries no room address and the stored event has no room.)*",
    "AC-2 [unit] Given the room list returns rooms carrying only an identifier and a name, when the user picks one, then the change the picker reports to the form carries a room address equal to that room's identifier and location text equal to its name. *(Fails today: the address is undefined.)*",
    "AC-3 [unit] Given the room list returns rooms carrying only an identifier and a name, when the list renders, then no row shows an availability verdict (\"Available\" or \"Busy\"), no row is disabled, and no row renders a secondary detail line. And when the user picks one of them, the selected-room card shows the room's name and renders no secondary detail line either. *(Fails today: every row reads \"✓ Available\" and has an empty detail line, and so does the selected card.)* *(Interim. PAC-100 replaces the \"no detail line\" half for rooms that carry details.)*",
    "AC-4 [unit] Given the form already holds a room address and the room list contains a room whose identifier equals it, when the picker opens in room mode, then that room is shown as selected. *(Fails today: the match is made on a field the live list does not carry.)*",
    "AC-5 [unit] Given the user types a search in room mode on an event with a start and an end, when the search request is made, then it carries the search text and no start or end of a time window. *(Fails today: both are sent.)*",
    "AC-6 [unit] Given the web code base, when it is type-checked, then the room type every room consumer accepts is mutually assignable with the contract-generated room type. So a room with only an identifier and a name is accepted everywhere, and a hand-written shape with an extra required field fails the check. *(Fails today: the hand-written room requires an address field the generated one lacks.)*",
    "AC-7 [unit] Given the web code base, when it is type-checked, then the coverage status type admits exactly the two values the contract declares, and the participant coverage type has no provider member. Both are asserted by type-level tests against the generated participant type. *(Fails today: a third status and a provider are declared.)*",
    "AC-8 [unit] Given a free/busy answer in which a co-host's status is \"known\", when the scheduling-link drawer renders that co-host (not an accepted host on the saved link) and the user opens the chip's tooltip, then the chip reads \"Availability synced\". In that case nothing inside the chip names a calendar provider (\"Google\", \"Microsoft\", \"Outlook\" or any other): not its visible text, its tooltip text, or any accessible name, label, title or description. Given \"unknown\", the chip shows the unknown state. *(Fails today: the tooltip says \"via Google Calendar\" for every caller.)*",
    "AC-9 [unit] Given a scheduling link whose saved host record shows a co-host as accepted with a Paceday account, when the drawer renders that co-host, then the chip reads \"On Paceday\" whatever the free/busy answer says. (Holds today; this pins it.)",
    "AC-10 [unit] Given a demo session, when room search and free/busy are called, then: - every demo room carries only an identifier and a name; - every demo room's identifier is a room address the live event save accepts (it matches `^[^@\\s]+@resource\\.calendar\\.google\\.com$`); - every demo coverage status is \"known\" or \"unknown\", with no provider. *(Fails today: demo rooms carry five more fields and their identifiers are `r1` to `r7`.)*",
    "AC-11 [contract] Given the audit register after this work merges: - API-040, API-041 and API-046 are marked Fixed with a reference to PAC-41; - API-077 is unchanged by this work (still Reported, or as PAC-47 left it); - API-047, API-075 and API-078 remain Reported. If the OQ-3 follow-up issue exists when the build stage edits the register, each of those last three rows names it. If it does not, each row carries the note \"split from PAC-41 (D-4); follow-up issue not yet filed\", and AC-11 is met by that note. Either way, none of the three is marked Fixed. (Manifest note, not spec text: on this branch the three resolved rows are Claimed (PAC-41) and the split note is present on API-047, API-075 and API-078; Fixed is set by the build stage when the web PR merges.)",
    "AC-12 [unit] *(D-6, interim until PAC-102.)* Given an event open for editing, when the user is in room booking (searching for a room, or with a room selected), then before they save the form shows text with two points: saving adds the chosen room and does not release a room the event already holds, and a held room is released in the calendar itself. *(Fails today: no such text exists.)*",
    "AC-13 [unit] *(D-6, interim until PAC-102.)* Given the user entered room booking during this edit, when they switch to free text or clear the selected room, then before they save the form shows text saying that a room already booked on the event stays booked. *(Fails today: no such text exists.)*",
    "AC-14 [e2e] *(D-6, interim; pins the outcome D-6 accepts. PAC-102 replaces it and does not delete it silently.)* Given an event on a signed-in Google user's calendar that holds room \"Helsinki\" booked through Paceday: - (a) when the user reopens it, picks room \"Oslo\" and saves, then the stored event holds both Helsinki and Oslo as resource attendees; - (b) when the user reopens it, sets the location to free text \"Café\" and saves, then the stored event still holds Helsinki as a resource attendee and its location is \"Café\". *(Not reachable today, because no room is ever booked. It becomes reachable with AC-1.)*",
    "AC-15 [contract] Given a signed-in Google user whose calendar list contains a room resource calendar named \"Helsinki\", when the room list is read, then the 200 answer is a JSON array. Its element for Helsinki has exactly the two keys the contract names for a room, an identifier equal to the room's resource calendar address, and the name \"Helsinki\". A change to the room's wire key set fails a test. *(Holds today, but no test pins it; see §2.5. This pins it.)*",
    "AC-16 [unit] *(Revision 2: the exceptions changed. Revision 2.1: the session-ended case.)* Given room booking is open: - when the room list's refusal says \"calendar not connected\", the picker says room booking needs a connected Google calendar; - when the room list is refused because the session has ended (the same refusal status with the \"unauthorized\" answer), the picker says the session has ended and the user must sign in again, and does not say a Google calendar is needed; - when it fails in any other way (an answer saying the server failed, which includes a stored Google connection that can no longer be used, or no answer because the server is unreachable), the picker says the rooms could not be loaded. In every one of these cases the picker shows neither \"No rooms matched.\" nor \"Start typing to search rooms.\", and the room address the form holds is unchanged. *(Fails today: the failure is swallowed, and the list reads \"No rooms matched.\" or \"Start typing to search rooms.\")*",
    "DC-1 [gate, delivery condition] api gate, web gate and (for AC-1, AC-14) e2e gate print rc=0 on each PR's final commit."
