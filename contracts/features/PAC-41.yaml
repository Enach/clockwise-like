    "C-3: API-040, API-041 and API-046 are marked Claimed (PAC-41), not Fixed, on this branch: each is a web-side defect and is fixed only when the web PR merges. Assumed by the factory, pending owner confirmation.",
    "Spec D-2 to D-5 are inherited, assumed by the factory, pending owner confirmation (spec OQ-3, OQ-6, OQ-8). D-1 and D-6 are narrowed to interim decisions by the owner answers of 2026-10-27 to OQ-1 and OQ-5 (spec D-7): they hold until PAC-100 and PAC-102 land. This contract describes today's wire, which those tickets change only through their own specs."
