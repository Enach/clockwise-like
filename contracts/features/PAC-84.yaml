  "rollback": "Before the conversion has run: image-only rollback. After: either restore the pre-deploy backup, or stop the backend, paceday-operator encryption decrypt-all, paceday-operator encryption downgrade-schema, start the previous image (never the new image in between). downgrade-schema refuses while anything is encrypted; it drops encryption_data_keys, encryption_backend_heartbeats and the sequence, and keeps operator_audit with its widened CHECK. No HTTP contract revision to revert."
