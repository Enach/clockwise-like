  "mergeInterplay": [
    "PAC-71 (#242): migration number and operator_audit per contract 7.3 (one migration text works in either order). If PAC-84 merges first it creates backend/cmd/paceday-operator with only the encryption subcommands and the operator_audit table; PAC-71 rebases, renumbers its migration to the next free number, and its CREATE TABLE IF NOT EXISTS operator_audit becomes a no-op that keeps the widened CHECK. Overlapping files listed in spec section 6 are resolved by whichever merges second."
