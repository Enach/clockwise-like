    "AC-3 [unit] Given a provider returning one busy window, when GET /api/calendar/freebusy, then each window's key set is exactly {start, end}; when POST /api/freebusy for a known participant, then results[0].busy[0] has key set {start, end} and equals participants[0].busy[0].",
    "AC-4 [unit] Given a personal calendar whose provider yields one event, when GET /api/personal-calendars/{id}/preview, then the element's key set is exactly {id, title, start, end}.",
    "AC-5 [integration] When POST /api/manager/profile, then the body's key set is exactly {user_id, is_manager, detected_at, analytics_shared_with_manager, updated_at}.",
    "AC-6 [integration] When POST /api/manager/team/members without and with team_id, then 201, the key set is exactly {id, manager_user_id, member_email, member_user_id, display_name, source, cadence, cadence_custom_days, last_one_on_one_at, created_at, updated_at}, id is not the zero UUID and equals the stored row's id, created_at/updated_at are not 0001-01-01T00:00:00Z, and with team_id cadence is the assignment's cadence.",
    "AC-7 [unit or integration] Given a successful patch whose re-read fails, when PATCH /api/manager/team/members/{email}, then 500 {\"error\":\"db error\"} (JSON), never 200 null; given it succeeds, then 200 with AC-6's key set.",
