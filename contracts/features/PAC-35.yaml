  "operationsChanged": [
    { "operationId": "googleOAuthCallback", "method": "GET", "path": "/api/auth/callback", "change": "302 has two destinations: success -> <FRONTEND_URL>/auth/callback with auth_token set; session not issued (empty secret or token generation error) -> <FRONTEND_URL>/?error=auth_failed with no auth_token cookie set or expired. The 'returns silently ... lands logged-out' note is removed. 400 and 500 unchanged." },
    { "operationId": "microsoftOAuthCallback", "method": "GET", "path": "/api/auth/microsoft/callback", "change": "Failure redirect (<FRONTEND_URL>/?error=auth_failed, no auth_token) for: Graph profile unreadable or without email; user upsert failed; session not issued. 502 REMOVED. 500 now only token exchange / token save. 'Every failure is a non-302' removed. 400, 503 unchanged." },
    { "operationId": "ssoOidcCallback", "method": "GET", "path": "/api/auth/callback/oidc/{domain}", "change": "Failure redirect when the session is not issued. 403 'email domain does not match SSO provider domain' (text/plain) ADDED: it has existed since PAC-45 but was undocumented." },
    { "operationId": "startGoogleOAuth", "method": "GET", "path": "/api/auth/google", "change": "login_hint is now components.parameters.LoginHint (plain string, no format). Forwarded to Google when it passes the LoginHint rule; dropped otherwise; never a 400." },
    { "operationId": "startMicrosoftOAuth", "method": "GET", "path": "/api/auth/microsoft", "change": "Same as startGoogleOAuth." },
    { "operationId": "startSsoLogin", "method": "GET", "path": "/api/auth/sso/{domain}", "change": "login_hint (LoginHint) ADDED; forwarded to the IdP only when it passes the rule AND its domain is exactly {domain} (spec D-10). 404, 500, 501 unchanged (spec D-5)." },
    { "operationId": "detectAuthProvider", "method": "POST", "path": "/api/auth/detect", "change": "Description only (SsoDetectResponse.redirect_url): a path on the API origin; the client appends ?login_hint=; there is no domain field." },
    { "operationId": "disconnectCalendar", "method": "DELETE", "path": "/api/auth/disconnect", "change": "No response sets or expires auth_token. Branches like getAuthStatus. Google (blank/unrecognised/no row): delete the Google token, 204. outlook/webcal: delete nothing, 409 CalendarDisconnectUnsupported. Settings unreadable: delete nothing, 500 (spec D-9). Summary rewritten; Set-Cookie header removed from 204." },
    { "operationId": "logout", "method": "POST", "path": "/api/auth/logout", "change": "200 (empty, no Content-Type) -> 204. Set-Cookie expiring auth_token unchanged. 401 unchanged." },
    { "operationId": "getCurrentUser", "method": "GET", "path": "/api/auth/me", "change": "Description: avatarUrl is the single picture name (API-065). Schema change in CurrentUserResponse, below." }
  ],

  "schemasChanged": [
    "components.parameters.LoginHint: NEW. name login_hint, in query, optional, type string (no format, on purpose: AC-10). Rule (revision 3): forwarded only when all of: (1) <= 254 chars; (2) exactly one '@'; (3) net/mail.ParseAddress accepts it with empty Name and Address equal to the whole value; (4) local part only [A-Za-z0-9._+'-] (apostrophe added in revision 3); (5) domain a DNS hostname of 2 or more dot-separated LDH labels, each [A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?, the last containing a letter (no IP literal, no single-label host). Else dropped, never a 400. Forwarded examples: alice@acme.com, o'brien@acme.com. Dropped examples: alice@acme.com&prompt=none, alice&prompt=none@acme.com, alice@acme.com?x=y, alice@acme.com#frag, alice@[127.0.0.1], alice@localhost, alice@acme. Repeated login_hint: first value only (url.Values.Get).",
    "CalendarDisconnectUnsupported: NEW. {error: const 'disconnecting this kind of calendar is not available yet', provider: enum [outlook, webcal]}, both required, additionalProperties false.",
    "CurrentUserResponse.provider: enum [google, microsoft, sso] (was free string with x-uncertain). Description: provider of the FIRST sign-in.",
    "CurrentUserResponse.avatarUrl: description only (single name; every sign-in overwrites it; Microsoft and SSO write '').",
    "SsoDetectResponse.redirect_url: description only."
  ],

  "interfaceChoicesMadeHere": {
    "failureState": "<FRONTEND_URL>/?error=auth_failed, fixed literal, no cause. Same URL the web completion page already uses for its own failure branch (AuthCallback.tsx:25), so AC-5/AC-6 have one state. PAC-35.md section 2.",
    "oq3SsoHintSource": "The web app appends ?login_hint=<email> to redirect_url, as it does for Google and Microsoft; detection does not carry the email. PAC-35.md section 3.",
    "oq6PictureName": "Keep avatarUrl (server's current name); web changes. PAC-35.md section 7.",
    "d8NotPerformedAnswer": "409 CalendarDisconnectUnsupported. PAC-35.md section 5."
  },

