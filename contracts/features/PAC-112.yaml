  "scope": "The link editor sends the complete co-host list with the link's fields (create and PATCH) whenever it differs, case-insensitively, from a baseline taken only from the strict GET /{id}. The create/PATCH answer (SchedulingLinkSaved) carries co_host_changes: one outcome per entry (invited, already_host, own_address, not_added), the hosts removed, and per-person counts, computed inside the write. Create becomes one transaction (no link on any failure) and never demotes the owner (API-048 remnant). New 422s: blank entry; a list over 5 entries that reaches a non-host (decided under the link lock); unrecognised days alias names on both verbs (API-053). Editor wording, stay-open rule and demo mode fixed in the md.",
