version: '3.9'

# Development overrides — expose ports, disable restart, add postgres port.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "5432:5432"
    restart: "no"

  backend:
    environment:
      - GO_ENV=development
    ports:
      - "8080:8080"
    restart: "no"

  frontend:
    restart: "no"
    # Optional: build locally from a sibling clone of smart-calendar-flow.
    # 1) git clone git@github.com:Enach/smart-calendar-flow.git ../smart-calendar-flow
    # 2) docker compose -f docker-compose.yml -f docker-compose.dev.yml build frontend
    # Comment the `image:` field above (or leave it — build wins on `docker compose build`).
    build:
      context: ../smart-calendar-flow
      # docker/frontend.dockerfile is in this repo (clockwise-like), so path is relative to context (the SCF repo).
      dockerfile: ${PACEDAY_REPO:-../clockwise-like}/docker/frontend.dockerfile

  docs:
    restart: "no"

  nginx:
    restart: "no"
