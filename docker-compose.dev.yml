version: '3.9'

# Development overrides — expose ports, disable restart, add postgres port.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "5432:5432"
    restart: "no"

  backend:
    environment:
      - GO_ENV=development
      # PAC-20: the dev stack is served over plain HTTP, so cookies drop the
      # Secure attribute here. Never set this in production.
      - PACEDAY_INSECURE_COOKIES=true
    ports:
      - "8080:8080"
    restart: "no"

  frontend:
    restart: "no"
    # Local frontend dev: see README.md "Frontend Development" — run
    # `make clone-frontend` then `bun run dev` in the sibling smart-calendar-flow
    # checkout. The default `image:` here pulls the published artefact.

  docs:
    restart: "no"

  nginx:
    restart: "no"
