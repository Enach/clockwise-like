name: Auto-merge

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

jobs:
  enable:
    runs-on: [self-hosted, linux, x64]
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge (squash) via GraphQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          curl -fsS -X POST -H "Authorization: bearer ${GH_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation(\$id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:\$id,mergeMethod:SQUASH}){pullRequest{number}}}\",\"variables\":{\"id\":\"${PR_NODE_ID}\"}}" \
            https://api.github.com/graphql
