# CI on GitHub-hosted runners: the repo's own gate, `make verify` (factory §3).
# Runs on every pull request and every push to main; release.yml publishes
# only main commits on which this job ("verify") passed in both repos.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Paired PRs (factory: the api PR and its web PR land together): use the
      # web branch naming the same PAC ticket as this branch, else main.
      # Candidates with an open PR in the web repo win: branches of superseded
      # PRs linger and would otherwise make the match ambiguous (-> main).
      - name: Paired web branch
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OTHER: Enach/smart-calendar-flow
        run: |
          n() { printf '%s\n' "$1" | grep -c . || true; }  # count lines
          j() { printf '%s\n' "$1" | paste -sd' ' -; }      # join lines
          ref=main why="no pac-N in branch name"
          t=$(grep -oiE 'pac-[0-9]+' <<<"$BRANCH" | head -1 | tr '[:upper:]' '[:lower:]' || true)
          if [ -n "$t" ]; then
            m=$(gh api --paginate "repos/$OTHER/branches" --jq '.[].name' | grep -iE "(^|[^a-z0-9])$t([^0-9]|$)" || true)
            why="no web branch for $t"
            o=""
            if [ -n "$m" ]; then
              if heads=$(gh api --paginate "repos/$OTHER/pulls?state=open&per_page=100" --jq ".[] | select(.head.repo.full_name == \"$OTHER\") | .head.ref"); then
                o=$(printf '%s\n' "$m" | grep -xF -f <(printf '%s\n' "$heads") || true)
              else
                echo "::warning::could not list open $OTHER PRs; pairing by branch name only"
              fi
            fi
            echo "candidates for $t: $(j "$m") | with an open PR: $(j "$o")"
            if [ "$(n "$o")" -eq 1 ]; then ref=$o why="only $t branch with an open PR"
            else
              if [ -n "$o" ]; then m=$o src="open-PR candidates"; else src="candidates (none has an open PR)"; fi
              # several (factory/pac-N-spec, impl/pac-N-api...): keep this branch's prefix (impl/)
              if [ "$(n "$m")" -gt 1 ] && [[ $BRANCH == */* ]]; then
                m=$(printf '%s\n' "$m" | grep -F "${BRANCH%%/*}/" || true)
                why="no ${BRANCH%%/*}/ branch among $src"
              fi
              # a lone leftover of another stage (factory/pac-N-spec for impl/...) with no open PR is stale
              if [ "$(n "$m")" -eq 1 ] && [ -z "$o" ] && [[ $BRANCH == */* && $m == */* && ${m%%/*} != "${BRANCH%%/*}" ]]; then
                why="only match $m has another prefix than ${BRANCH%%/*}/ and no open PR"
                echo "::notice::ignoring $m for $t: prefix differs from ${BRANCH%%/*}/ and no open PR; using main"
              elif [ "$(n "$m")" -eq 1 ]; then ref=$m why="only match among $src"
              elif printf '%s\n' "$m" | grep -qxF "$BRANCH"; then ref=$BRANCH why="same name as this branch, among $src"
              elif [ -n "$m" ]; then
                why="several web branches among $src: $(j "$m")"
                echo "::warning::several web branches for $t: $(j "$m"); using main"
              fi
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "web ref: $ref ($why)"

      # The web repo, where `make clone-frontend` puts it (WEB ?= ../smart-calendar-flow):
      # openapi-check also checks its generated types, e2e builds it.
      - uses: actions/checkout@v4
        with:
          repository: Enach/smart-calendar-flow
          ref: ${{ steps.pair.outputs.ref }}
          path: web
      - run: mv web ../smart-calendar-flow
      # docker/frontend.dockerfile (e2e and release) builds from frontend/ = the
      # web repo ("CI clones it at run-time"). Copied before npm ci, so no node_modules.
      - run: rm -rf frontend && cp -r ../smart-calendar-flow frontend && rm -rf frontend/.git

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            mcp/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tools pinned by the Makefile and scripts
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Web dependencies (openapi-check runs its generator)
        working-directory: ../smart-calendar-flow
        run: npm ci --legacy-peer-deps

      - name: e2e dependencies
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps

      # Pushes to main skip the cross-repo half of openapi-check: a paired
      # contract change merges api first and web minutes later, and in between
      # the two mains disagree by design. Release.yml runs that check on the
      # exact pair of main SHAs it would publish. PRs keep the full check.
      - name: make verify
        env:
          OPENAPI_CROSS_REPO: ${{ github.event_name == 'push' && 'skip' || 'check' }}
        run: make verify

      - name: Verify summary
        if: always()
        run: cat .verify/steps.txt .verify/coverage.txt 2>/dev/null || true
