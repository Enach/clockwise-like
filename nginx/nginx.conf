# Paceday edge (PAC-81 Part B). Mounted as /etc/nginx/conf.d/default.conf, so
# everything here is in the http context.
#
# Plain HTTP only. The load balancer or reverse proxy in front terminates TLS
# and sets HSTS (owner decision 2026-10-27); nginx never redirects to HTTPS,
# which would loop behind such a proxy.
#
# This file needs nginx/paceday-render.sh to run first: it defines the
# upstreams paceday_backend / paceday_frontend / paceday_mcp, $paceday_csp,
# $paceday_mcp_enabled and $paceday_peer_trusted from the container's
# environment. Without it nginx refuses to start rather than run without its
# headers.

# Real client (after the trusted-proxy rewrite), the path WITHOUT its query
# string, status and timings; peer= is the socket peer before the rewrite.
log_format paceday '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time "$upstream_response_time" '
                   'peer=$realip_remote_addr';

# The scheme the client used: only a trusted proxy may say "https".
map "$paceday_peer_trusted:$http_x_forwarded_proto" $paceday_forwarded_proto {
    default        http;
    "~*^1:https$"  https;
}

# A trusted proxy's chain is kept as received and that proxy's own address
# (the socket peer, before the real-IP rewrite) is appended, so the chain
# records every hop and the client appears once. ($proxy_add_x_forwarded_for
# would append $remote_addr, which after the rewrite is the client again.)
# From anyone else a client-supplied chain is dropped and the peer alone is
# forwarded.
map $http_x_forwarded_for $paceday_trusted_chain {
    ""       $realip_remote_addr;
    default  "$http_x_forwarded_for, $realip_remote_addr";
}
map $paceday_peer_trusted $paceday_forwarded_for {
    1        $paceday_trusted_chain;
    default  $remote_addr;
}

# PAC-81 Q-O2 (owner, 2026-11-01): only the public booking page may be
# framed, by any site. It is the web app's /book/:slug route
# (smart-calendar-flow src/App.tsx). $uri carries no query string. Its API
# calls (/api/book/...) are not documents and keep the defaults.
map $uri $paceday_framable {
    default                0;
    "~^/book/[^/]+/?$"     1;
}
# An empty value makes add_header send no header at all.
map $paceday_framable $paceday_frame_options {
    1        "";
    default  "DENY";
}

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log paceday;

    # D-7: 1 MiB, the backend's cap too. /api/ answers it in JSON below.
    client_max_body_size 1m;

    # D-4 ladder: longer than the backend's 120 s write backstop. The proxy in
    # front must allow more than 130 s.
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    # Upstream keep-alive (the upstream blocks carry `keepalive`).
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # All proxy_set_header lines live here: a location that sets any of its
    # own would silently drop every one of these.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $paceday_forwarded_for;
    proxy_set_header X-Forwarded-Proto $paceday_forwarded_proto;

    # Exactly one of each security header (AC-B2): drop the upstream's copies
    # (the backend's http.Error sets nosniff) and set ours. HSTS is the
    # proxy's, never sent from here.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;

    # Server level with `always`, and no location sets add_header, so every
    # response carries them: pages, assets, API errors, nginx's own 413.
    # X-Frame-Options DENY / frame-ancestors 'none' everywhere except the
    # public booking page, which has frame-ancestors * and no X-Frame-Options
    # (PAC-81 Q-O2; the CSP variable follows $paceday_framable).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $paceday_frame_options always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $paceday_csp always;

    # nginx's own liveness, for the health check: no upstream, no log line.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://paceday_backend;
        error_page 413 @api_body_too_large;
    }

    # The backend's error shape (writeError), not nginx's HTML page.
    location @api_body_too_large {
        default_type application/json;
        return 413 '{"error":"request body too large"}\n';
    }

    # PAC-81 Q-O1 (owner, 2026-11-01): the MCP SSE server on the public origin,
    # when the operator enables it (docker-compose.mcp.yml sets
    # NGINX_MCP_UPSTREAM). The path is passed unchanged: the MCP server runs
    # with MCP_BASE_PATH=/mcp. Every request still needs MCP_AUTH_TOKEN, which
    # the MCP server checks; the Authorization header passes through. With MCP
    # off this is a JSON 404, never the SPA.
    location /mcp/ {
        default_type application/json;
        if ($paceday_mcp_enabled = 0) {
            return 404 '{"error":"not found"}\n';
        }
        proxy_pass http://paceday_mcp;
        # An event stream: hand every event on at once, cache nothing, and let
        # an idle stream live for an hour (the client then reconnects).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The SPA. There is deliberately no docs location (D-16): /docs/ is an SPA
    # route like any other, under the app's CSP.
    location / {
        proxy_pass http://paceday_frontend;
    }
}
