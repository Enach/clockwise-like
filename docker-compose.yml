version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clockwise
      POSTGRES_USER: clockwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clockwise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clockwise -d clockwise"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://clockwise:${POSTGRES_PASSWORD:-clockwise}@postgres:5432/clockwise?sslmode=disable
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-}
      - SESSION_SECRET=${SESSION_SECRET:-changeme}
      - JWT_SECRET=${JWT_SECRET:-}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-}
      # IPs/CIDRs whose X-Real-IP the backend trusts (PAC-39). Empty = none.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # PAC-20: empty = every cookie is Secure. true only for plain-HTTP dev.
      - PACEDAY_INSECURE_COOKIES=${PACEDAY_INSECURE_COOKIES:-}
      # Microsoft OAuth
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_REDIRECT_URL=${MICROSOFT_REDIRECT_URL:-}
      # Zoom OAuth
      - ZOOM_CLIENT_ID=${ZOOM_CLIENT_ID:-}
      - ZOOM_CLIENT_SECRET=${ZOOM_CLIENT_SECRET:-}
      - ZOOM_REDIRECT_URL=${ZOOM_REDIRECT_URL:-}
      # Slack OAuth (meeting briefs + daily recap)
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - SLACK_REDIRECT_URI=${SLACK_REDIRECT_URI:-}
      # Notion OAuth (meeting briefs)
      - NOTION_CLIENT_ID=${NOTION_CLIENT_ID:-}
      - NOTION_CLIENT_SECRET=${NOTION_CLIENT_SECRET:-}
      - NOTION_REDIRECT_URI=${NOTION_REDIRECT_URI:-}
      # AI provider, model and API key are chosen per user in the Settings
      # page and stored in the database: Paceday supplies no LLM credential
      # (NEW-llm-bring-your-own). Only the destinations those keys may reach
      # are approved here (see .env.example). Unset means not enabled for
      # Azure OpenAI, Vertex AI and Bedrock; the public OpenAI and Anthropic
      # APIs are built in.
      - PACEDAY_LLM_APPROVED_HOSTS_AZURE_OPENAI=${PACEDAY_LLM_APPROVED_HOSTS_AZURE_OPENAI:-}
      - PACEDAY_LLM_APPROVED_HOSTS_VERTEX=${PACEDAY_LLM_APPROVED_HOSTS_VERTEX:-}
      - PACEDAY_LLM_APPROVED_HOSTS_BEDROCK=${PACEDAY_LLM_APPROVED_HOSTS_BEDROCK:-}
      - PACEDAY_LLM_APPROVED_HOSTS_OPENAI=${PACEDAY_LLM_APPROVED_HOSTS_OPENAI:-}
      - PACEDAY_LLM_APPROVED_HOSTS_ANTHROPIC=${PACEDAY_LLM_APPROVED_HOSTS_ANTHROPIC:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # Frontend source lives in Enach/smart-calendar-flow (see ADR-0002).
    # CI publishes images to enach/paceday-frontend; pin via FRONTEND_IMAGE_TAG.
    # For local frontend development, clone smart-calendar-flow and run
    # `bun install && bun run dev` there (it proxies /api to localhost:8080).
    image: enach/paceday-frontend:${FRONTEND_IMAGE_TAG:-latest}
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
    restart: unless-stopped

  docs:
    build: ./docs
    restart: unless-stopped

  mcp-server:
    build: ./mcp
    environment:
      BACKEND_URL: http://backend:8080
      MCP_TRANSPORT: sse
      MCP_PORT: "3001"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    # PAC-81 Part B: the render step writes the trusted-proxy list, the CSP
    # and the upstreams that nginx.conf needs, then starts nginx
    # (nginx/paceday-render.sh lists the settings).
    entrypoint: ["/bin/sh", "/paceday/render.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      NGINX_TRUSTED_PROXIES: ${NGINX_TRUSTED_PROXIES:-}
      NGINX_CSP_SENTRY_ORIGIN: ${NGINX_CSP_SENTRY_ORIGIN:-}
      NGINX_CSP_CONNECT_ORIGINS: ${NGINX_CSP_CONNECT_ORIGINS:-}
      API_BASE_URL: ${API_BASE_URL:-}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/paceday-render.sh:/paceday/render.sh:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
