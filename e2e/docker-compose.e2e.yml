# Paceday e2e stack.
#
# This is a SELF-CONTAINED compose file, not an override of the root
# docker-compose.yml. It is deliberately standalone because the root file
# pulls a published frontend image, mounts a named postgres volume and binds
# port 80 — none of which a test run should touch.
#
# Run it from the repository root:
#   docker compose -p paceday-e2e -f e2e/docker-compose.e2e.yml up -d --build
#
# Ports (all non-default, so a dev stack can run at the same time):
#   nginx     -> 127.0.0.1:8088   (the ONLY entrypoint the tests use)
#   postgres  -> 127.0.0.1:15433  (seeding + assertions only)
# The backend is intentionally NOT published: the tests must go through nginx,
# which is what proves the /api/ proxy rule in nginx/nginx.conf works.
#
# CALENDAR STAND-IN (PAC-43): the backend's Google Calendar traffic goes to
# `fake-google` (e2e/fake-google), selected by GOOGLE_CALENDAR_API_BASE_URL
# and allowed only because PACEDAY_ALLOW_STANDINS=true. With both set the
# backend guards every calendar connection: it connects only to loopback,
# RFC 1918 or IPv6 unique-local addresses. The stand-in sits at a fixed
# address on the pinned RFC 1918 network below, so it is permitted. Moving it
# to a routable address makes every calendar call fail closed at connect time;
# the fix for that is to move the stand-in, never to widen the backend's set.
#
# HERMETICITY: every real provider host name maps, inside the backend
# container, to the recording `sink` (see `extra_hosts`), NOT to 127.0.0.1:
# inside the single-process backend container 127.0.0.1 is the backend itself.
# Token refresh, sign-in and the second provider are deliberately NOT
# redirected, so this mapping is what keeps a refresh credential on the test
# host. It is load-bearing for safety, not only for hermeticity, and
# tests/hermeticity.spec.ts (AC-23) reads the sink after the whole run and
# fails if anything at all connected to it.
#
# Extra host ports (127.0.0.1 only, test-side control planes):
#   fake-google -> 127.0.0.1:18090  (/__fixture/ control plane, e2e/fake.ts)
#   sink        -> 127.0.0.1:18091  (GET /connections)

name: paceday-e2e

# Pinned, so the stand-in's address is known to be inside the backend's
# permitted set (spec §V3-5). A daemon whose default pool were not RFC 1918
# would otherwise make the stack fail closed, which is safe but confusing.
networks:
  default:
    name: paceday-e2e-net
    ipam:
      config:
        - subnet: 10.143.43.0/24

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paceday_e2e
      POSTGRES_USER: paceday_e2e
      POSTGRES_PASSWORD: paceday_e2e
      # Deterministic collation so ORDER BY in roster queries is stable.
      LANG: C
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
      - -c
      - timezone=UTC
    ports:
      - "127.0.0.1:15433:5432"
    # tmpfs: the database is ephemeral by construction. `docker compose down`
    # cannot leave a stale volume that makes the next run non-deterministic.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paceday_e2e -d paceday_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  backend:
    build:
      context: ../backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://paceday_e2e:paceday_e2e@postgres:5432/paceday_e2e?sslmode=disable
      # REQUIRED — main.go log.Fatal's without it. This exact value is what
      # e2e/auth.ts signs session JWTs with. Keep the two in sync.
      JWT_SECRET: ${E2E_JWT_SECRET:-e2e-only-jwt-secret-not-for-any-real-deployment}
      SESSION_SECRET: e2e-only-session-secret
      # Same-origin through nginx, so CORS must not be restrictive.
      ALLOWED_ORIGIN: "*"
      FRONTEND_URL: http://localhost:8088
      # Google OAuth is configured with unusable values on purpose. The
      # sign-in journey never drives the consent screen (see auth.ts); leaving
      # these empty would make /api/integrations/availability report Google as
      # unavailable, which is a different UI state than production.
      GOOGLE_CLIENT_ID: e2e-google-client-id
      GOOGLE_CLIENT_SECRET: e2e-google-client-secret
      GOOGLE_REDIRECT_URL: http://localhost:8088/api/auth/callback
      # Monitoring off: an empty DSN degrades to "monitoring disabled" and the
      # server still boots (backend/sentry.go). A test run must not ship events.
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: e2e
      # SMTP deliberately unset: engine/booking.go sendConfirmationEmail()
      # returns early when SMTP_HOST/SMTP_FROM are empty, so booking never
      # blocks on a mail server.
      TZ: UTC
      # PAC-43: the test-mode declaration and the calendar stand-in. Neither
      # is ever set by a production deployment; the address without the
      # declaration makes the server refuse to start (tests/startup.spec.ts).
      PACEDAY_ALLOW_STANDINS: "true"
      GOOGLE_CALENDAR_API_BASE_URL: http://fake-google:8080/calendar/v3/
    extra_hosts:
      # See the HERMETICITY note above. Every name goes to the sink's fixed
      # address. Keep this list identical to SINK_HOSTS in e2e/fake.ts.
      - "www.googleapis.com:10.143.43.20"
      - "oauth2.googleapis.com:10.143.43.20"
      - "accounts.google.com:10.143.43.20"
      - "graph.microsoft.com:10.143.43.20"
      - "login.microsoftonline.com:10.143.43.20"
      - "slack.com:10.143.43.20"
      - "api.notion.com:10.143.43.20"
      - "zoom.us:10.143.43.20"
    depends_on:
      postgres:
        condition: service_healthy
      fake-google:
        condition: service_healthy
      sink:
        condition: service_healthy
    restart: "no"

  fake-google:
    # The Google Calendar API stand-in (e2e/fake-google). No nginx route: only
    # the backend (on the network) and the tests (on 127.0.0.1) reach it.
    build:
      context: ./fake-google
    image: paceday-e2e-fake-google:local
    networks:
      default:
        ipv4_address: 10.143.43.10
    ports:
      - "127.0.0.1:18090:8080"
    healthcheck:
      test: ["CMD", "/fake-google", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  sink:
    # The recording sink (e2e/fake-google/sink): the address every real
    # provider host resolves to inside the backend. Same build context as
    # fake-google, so the second build is a layer-cache hit.
    build:
      context: ./fake-google
    image: paceday-e2e-sink:local
    command: ["/sink"]
    networks:
      default:
        ipv4_address: 10.143.43.20
    ports:
      - "127.0.0.1:18091:9090"
    healthcheck:
      test: ["CMD", "/sink", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  frontend:
    # Built from the real production Dockerfile so the suite exercises the
    # actual bundle, not a dev server. It needs the smart-calendar-flow
    # checkout at <repo-root>/frontend — see e2e/README.md "Prerequisites".
    # Set E2E_FRONTEND_IMAGE to skip the build and use a published image.
    image: ${E2E_FRONTEND_IMAGE:-paceday-frontend-e2e:local}
    build:
      context: ..
      dockerfile: docker/frontend.dockerfile
    environment:
      # Left EMPTY on purpose. docker/fileserver/main.go only injects
      # window.__API_BASE_URL__ when API_BASE_URL is non-empty; with it unset
      # both src/api/client.ts and src/lib/api.ts fall back to a same-origin
      # relative "/api", which is exactly what nginx serves.
      API_BASE_URL: ""
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      # The production routing rules, unmodified. If this file breaks, the
      # suite must break.
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: "no"
